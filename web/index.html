항에 의하여 계약기간을 연장한 경우에는 제23조에 의하여 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 계약금액을 조정한다. 다만, 제25조제3항 제5호의 사유에 의한 경우에는 그러하지 아니하다. ⑤ 계약상대자는 제40조에 의한 준공대가(장기계속계약의 경우에는 각 차수별 준공대가) 수령전까지 제4항에 의한 계약금액 조정신청을 하여야 한다. ⑥ 계약담당공무원은 제1항 내지 제5항에도 불구하고 계약상대자의 의무불이행으로 인하여 발생한 지체상금이 시행령 제50조제1항에 의한 계약보증금상당액에 달한 경우로서 계약목적물이 국가정책사업 대상이거나 계약의 이행이 노사분규 등 불가피한 사유로 인하여 지연된 때에는 계약기간을 연장할 수 있다.⑦ 제6항에 의한 계약기간의 연장은 지체상금이 계약보증금상당액에 달한 때에 하여야 하며, 연장된 계약기간에 대하여는 제25조에도 불구하고 지체상금을 부과하여서는 아니된다.⑧ 계약담당공무원은 장기계속공사의 연차별 계약기간 중 제1항에 의한 계약기간 연장신청(제25조제3항 제1호부터 제3호까지 및 제6호ㆍ제7호에 따른 사유로 인한 경우에 한한다)이 있는 경우, 당해 연차별 계약기간의 연장을 회피하기 위한 목적으로 당해 차수계약을 해지하여서는 아니된다.⑨ 장기계속공사에서 계약상대자의 책임에 속하지 아니하는 사유로 각 연차별 계약 사이 공백기간이 발생할 경우에는 계약담당공무원은 계약상대자의 신청에 의하여 다음 연차별 계약에 공백기간으로 인해 발생하는 비용에 대해 실비를 초과하지 아니하는 범위 안에서 계약금액을 조정한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:27","kind":"조문","type":"계약예규","family":"nca","label":"제27조","title":"검사","text":"제27조(검사) ① 계약상대자는 공사를 완성하였을 때에는 그 사실을 준공신고서 등 서면으로 계약담당공무원(「건설기술 진흥법」 제39조제2항에 의하여 건설사업관리 또는 감리를 하는 공사에 있어서는 건설기술용역업자를 말한다. 이하 이조 제2항, 제3항 및 제6항에서 같다)에게 통지하고 필요한 검사를 받아야 한다. ② 계약담당공무원은 제1항의 통지를 받은 날로부터 14일 이내에 계약서, 설계서, 준공신고서 기타 관계 서류에 의하여 계약상대자의 입회하에 그 이행을 확인하기 위한 검사를 하여야 한다. 다만, 천재ㆍ지변 등 불가항력적인 사유로 인하여 검사를 완료하지 못한 경우에는 해당사유가 존속되는 기간과 해당사유가 소멸된 날로부터 3일까지는 이를 연장할 수 있으며, 공사계약금액(관급자재가 있는 경우에는 관급자재 대가를 포함한다)이 100억원이상이거나 기술적 특수성 등으로 인하여 14일이내에 검사를 완료할 수 없는 특별한 사유가 있는 경우에는 7일 범위내에서 검사기간을 연장할 수 있다.③ 계약담당공무원은 제2항의 검사에서 계약상대자의 계약이행내용의 전부 또는 일부가 계약에 위반되거나 부당함을 발견한 때에는 계약상대자에게 필요한 시정조치를 요구하여야 한다. 이 경우에는 계약상대자로부터 그 시정을 완료한 사실을 통지받은 날로부터 제2항의 기간을 계산한다.④ 제3항에 의하여 계약이행기간이 연장될 때에는 계약담당공무원은 제25조에 의한 지체상금을 부과하여야 한다.⑤ 계약상대자는 제2항에 의한 검사에 입회ㆍ협력하여야 한다. 계약상대자가 입회를 거부하거나 검사에 협력하지 아니함으로써 발생하는 지체에 대하여는 제3항 및 제4항을 준용한다.⑥ 계약담당공무원은 검사를 완료한 때에는 그 결과를 지체없이 계약상대자에게 통지하여야 한다. 이 경우에 계약상대자는 검사에 대한 이의가 있을 때에는 재검사를 요청할 수 있으며, 계약담당공무원은 필요한 조치를 하여야 한다.⑦ 계약상대자는 제6항에 의한 검사완료통지를 받은 때에는 모든 공사시설, 잉여자재, 폐기물 및 가설물을 공사장으로부터 즉시 철거반출하여야 하며 공사장을 정돈하여야 한다.⑧ 제39조에 의한 기성대가지급시의 기성검사는 공사감독관이 작성한 감독조서의 확인으로 갈음할 수 있다. 다만, 기성 검사 3회마다 1회는 제1항에 의한 검사를 실시하여야 한다.⑨ 제8항에 의한 기성검사 시에 검사에 합격된 자재라도 단순히 공사현장에 반입된 것만으로는 기성부분으로 인정되지 아니한다. 다만, 다음 각 호의 경우에는 해당 자재의 특성, 용도 및 시장거래상황 등을 고려하여 반입(해당 자재를 계약목적물에 투입하는 과정의 특수성으로 인하여 가공ㆍ조립 또는 제작하는 공장에서 기성검사를 실시, 동 검사에 합격한 경우를 포함)된 자재를 기성부분으로 인정할 수 있다.1. 강교 등 해당공사의 기술적ㆍ구조적 특성을 고려하여 가공ㆍ조립ㆍ제작된 자재로서, 다른 공사에 그대로 사용하기 곤란하다고 인정되는 자재: 자재의 100분의 100 범위내에서 기성부분으로 인정 가능2. 기타 계약상대자가 직접 또는 제3자에게 위탁하여 가공ㆍ조립 또는 제작된 자재: 자재의 100분의 50 범위내에서 기성부분으로 인정 가능 제2항에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 제2항의 14일을 7일로 본다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:28","kind":"조문","type":"계약예규","family":"nca","label":"제28조","title":"인수","text":"제28조(인수) ① 계약담당공무원은 제27조제6항에 의하여 검사완료통지를 한 후에 계약상대자가 서면으로 인수를 요청하였을 때에는 즉시 현장인수증명서를 발급하고 해당 공사목적물을 인수하여야 한다.② 계약담당공무원은 제1항에 의하여 인수를 요청받은 경우에 공사규모 등을 고려하여 필요하다고 인정할 때에는 계약상대자로 하여금 다음 각호의 사항이 첨부된 준공명세서를 제출하게 하여야 한다.1. 완성된 공사목적물의 전면ㆍ후면ㆍ측면사진(10\"×15\") 각 5매 및 사진원본파일2. 제27조의 주요검사과정을 촬영한 동영상물(CD 등) 5본3. 착공에서 준공까지의 행정처리과정, 참여기술자, 관련참여업체 등의 내용을 포함하는 「건설기술 진흥법 시행령」 제78조에 의한 준공보고서 ③ 계약담당공무원은 계약상대자가 검사완료통지를 받은 날부터 7일이내에 제1항에 의한 인수요청을 아니할 때에는 계약상대자에게 현장인수증명서를 발급하고 해당 공사목적물을 인수할 수 있다. 이 경우 계약상대자는 지체없이 제2항에 의한 준공명세서를 제출하여야 한다.④ 계약담당공무원은 공사목적물을 인수한 때에는 다음 사항을 기재한 표지판을 부착하여 공시하여야 한다.1. 공사명 및 발주기관(관리청)2. 착공 및 준공년월일3. 공사금액4. 계약상대자5. 공사감독관 및 검사관6. 하자발생시 신고처7. 기타 필요한 사항⑤ 발주관서는 제3항에 의하여 인수된 공사목적물을 계약상대자에게 유지관리를 요구하는 경우에는 이에 필요한 비용을 지급하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:29","kind":"조문","type":"계약예규","family":"nca","label":"제29조","title":"기성부분의 인수","text":"제29조(기성부분의 인수) ① 계약담당공무원은 전체 공사목적물이 아닌 기성부분(성질상 분할할 수 있는 공사에 대한 완성부분에 한한다)에 대하여 이를 인수할 수 있다.② 제1항의 경우에는 제28조를 준용한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:30","kind":"조문","type":"계약예규","family":"nca","label":"제30조","title":"부분사용 및 부가공사","text":"제30조(부분사용 및 부가공사) ① 발주기관은 계약목적물의 인수전에 기성부분이나 미완성부분을 사용할 수 있으며, 이 경우에 사용부분에 대해서는 해당 구조물 안전에 지장을 주지 아니하는 부가공사를 할 수 있다.② 제1항의 경우 계약상대자와 부가공사에 대한 계약상대자는 계약담당공무원의 지시에 따라 공사를 진행하여야 한다.③ 계약담당공무원은 제1항에 의한 부분사용 또는 부가공사로 인하여 계약상대자에게 손해가 발생한 경우 또는 추가공사비가 필요한 경우로서 계약상대자의 청구가 있는 때에는 제23조에 의하여 실비의 범위안에서 보상하거나 계약금액을 조정하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:31","kind":"조문","type":"계약예규","family":"nca","label":"제31조","title":"일반적 손해","text":"제31조(일반적 손해) ① 계약상대자는 계약의 이행중 공사목적물, 관급자재, 대여품 및 제3자에 대한 손해를 부담하여야 한다. 다만, 계약상대자의 책임없는 사유로 인하여 발생한 손해는 발주기관의 부담으로 한다.② 제10조에 의하여 손해보험에 가입한 공사계약의 경우에는 제1항에 의한 계약상대자 및 발주기관의 부담은 보험에 의하여 보전되는 금액을 초과하는 부분으로 한다.③ 제28조 및 제29조에 의하여 인수한 공사목적물에 대한 손해는 발주기관이 부담하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:32","kind":"조문","type":"계약예규","family":"nca","label":"제32조","title":"불가항력","text":"제32조(불가항력) ① 불가항력이라 함은 태풍ㆍ홍수 기타 악천후, 전쟁 또는 사변, 지진, 화재, 전염병, 폭동 기타 계약당사자의 통제범위를 벗어난 사태의 발생 등의 사유(이하 \"불가항력의 사유\"라 한다)로 인하여 공사이행에 직접적인 영향을 미친 경우로서 계약당사자 누구의 책임에도 속하지 아니하는 경우를 말한다. ② 불가항력의 사유로 인하여 다음 각호에 발생한 손해는 발주기관이 부담하여야 한다.1. 제27조에 의하여 검사를 필한 기성부분2. 검사를 필하지 아니한 부분중 객관적인 자료(감독일지, 사진 또는 동영상 등)에 의하여 이미 수행되었음이 판명된 부분3. 제31조제1항 단서 및 동조제3항에 의한 손해③ 계약상대자는 계약이행 기간 중에 제2항의 손해가 발생하였을 때에는 지체없이 그 사실을 계약담당공무원에게 통지하여야 하며, 계약담당공무원은 통지를 받았을 때에는 즉시 그 사실을 조사하고 그 손해의 상황을 확인한 후에 그 결과를 계약상대자에게 통지하여야 한다. 이 경우에 공사감독관의 의견을 고려할 수 있다.④ 계약담당공무원은 제3항에 의하여 손해의 상황을 확인하였을 때에는 별도의 약정이 없는 한 공사금액의 변경 또는 손해액의 부담 등 필요한 조치에 대하여 계약상대자와 협의하여 이를 결정한다. 다만, 협의가 성립되지 않을 때에는 제51조에 의해서 처리한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:33","kind":"조문","type":"계약예규","family":"nca","label":"제33조","title":"하자보수","text":"제33조(하자보수) ① 계약상대자는 전체목적물을 인수한 날과 준공검사를 완료한 날 중에서 먼저 도래한 날(공사계약의 부분 완료로 관리ㆍ사용이 이루어지고 있는 경우에는 부분 목적물을 인수한 날과 공고에 따라 관리ㆍ사용을 개시한 날 중에서 먼저 도래한 날을 말한다)부터 시행령 제60조에 의하여 계약서에 정한 기간(이하 \"하자담보책임기간\"이라 한다)동안에 공사목적물의 하자(계약상대자의 시공상의 잘못으로 인하여 발생한 하자에 한함)에 대한 보수책임이 있다. ② 하자담보책임기간은 시행규칙 제70조에 정해진 바에 따라 공종을 구분(하자책임을 구분할 수 없는 복합공사의 경우에는 주된 공종)하여 설정하여야 한다. ③ 제2항에도 불구하고 하자담보책임기간을 공종 구분없이 일률적으로 정하였거나 시행규칙 제70조제1항각호에 정해진 기간과 다르게 정하여 계약이행중인 경우에는 시행규칙에서 정한 대로 계약서상 하자담보책임기간을 조정하여야 한다. ④ 계약상대자는 하자보수통지를 받은 때에는 즉시 보수작업을 하여야 하며 해당 하자의 발생원인 및 기타 조치사항을 명시하여 발주기관에 제출하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:34","kind":"조문","type":"계약예규","family":"nca","label":"제34조","title":"하자보수보증금","text":"제34조(하자보수보증금) ① 계약상대자는 공사의 하자보수를 보증하기 위하여 계약서에서 정한 하자보수보증금율을 계약금액(당초 계약금액이 조정된 경우에는 조정된 계약금액을 말한다)에 곱하여 산출한 금액(이하 \"하자보수보증금\"이라 한다)을 시행령 제62조 및 시행규칙 제72조에서 정한 바에 따라 납부하여야 한다.② 계약상대자가 제33조제1항에 의한 하자담보책임기간중 계약담당공무원으로부터 하자보수요구를 받고 이에 불응한 경우에 계약담당공무원은 제1항에 의한 하자보수보증금을 국고에 귀속한다.③ 계약담당공무원은 제35조제2항에 의한 하자보수완료확인서의 발급일까지 하자보수보증금을 계약상대자에게 반환하여야 한다. 다만, 하자담보책임기간이 서로 다른 공종이 복합된 건설공사에 있어서는 시행규칙 제70조에 의한 공종별 하자담보책임기간이 만료되어 보증목적이 달성된 공종의 하자보수보증금은 계약상대자의 요청이 있을 경우 즉시 반환하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:35","kind":"조문","type":"계약예규","family":"nca","label":"제35조","title":"하자검사","text":"제35조(하자검사) ① 계약담당공무원은 제33조제1항의 하자담보책임기간중 연2회이상 정기적으로 하자발생 여부를 검사하여야 한다.② 계약담당공무원은 하자담보책임기간이 만료되기 14일 전부터 만료일까지의 기간 중에 따로 최종검사를 하여야 하며, 최종검사를 완료하였을 때에는 즉시 하자보수완료확인서를 계약상대자에게 발급하여야 한다. 이 경우에 최종검사에서 발견되는 하자사항은 하자보수완료확인서가 발급되기 전까지 계약상대자가 자신의 부담으로 보수하여야 한다. ③ 계약상대자는 제1항 및 제2항의 검사에 입회하여야 한다. 다만, 계약상대자가 입회를 거부하는 경우에 계약담당공무원은 일방적으로 검사를 할 수 있으며 검사결과에 대하여 계약상대자가 동의한 것으로 간주한다.④ 계약상대자의 책임과 의무는 제2항에 의한 하자보수완료확인서의 발급일부터 소멸한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:36","kind":"조문","type":"계약예규","family":"nca","label":"제36조","title":"특별책임","text":"제36조(특별책임) ① 계약담당공무원은 제35조제2항에 의한 하자보수완료확인서의 발급에도 불구하고 해당공사의 특성 및 관련법령에서 정한 바에 따라 건축물의 구조적 안정성 확보, 이용자 안전 제고 등을 위해 필요하다고 인정하는 경우에는 계약상대자와 협의하여 제27조 및 제35조에 의한 검사과정에서 발견되지 아니한 시공상의 하자에 대하여는 계약상대자의 책임으로 하는 특약을 정할 수 있다. 이 경우 계약상대자의 책임기간은 해당계약에 대한 하자담보책임의 2배를 초과하여서는 아니된다. ② 계약담당공무원은 제1항에 따른 특약을 설정하려는 경우, 특약 설정의 필요성 및 계약상대자의 책임기간 등에 대하여 시행령 제94조에 따른 계약심의위원회의 심의를 거쳐야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:37","kind":"조문","type":"계약예규","family":"nca","label":"제37조","title":"특허권 등의 사용","text":"제37조(특허권 등의 사용) 공사의 이행에 특허권 기타 제3자의 권리의 대상으로 되어 있는 시공방법을 사용할 때에는 계약상대자는 그 사용에 관한 일체의 책임을 져야 한다. 그러나 발주기관이 제3조의 계약문서에 시공방법을 지정하지 아니하고 그 시공을 요구할 때에는 계약상대자에 대하여 제반편의를 제공ㆍ알선하거나 소요된 비용을 지급할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:38","kind":"조문","type":"계약예규","family":"nca","label":"제38조","title":"발굴물의 처리","text":"제38조(발굴물의 처리) ① 공사현장에서 발견한 모든 가치있는 화석ㆍ금전ㆍ보물 기타 지질학 및 고고학상의 유물 또는 물품은 관계법규에서 정하는 바에 의하여 처리한다.② 계약상대자는 제1항의 물품이나 유물을 발견하였을 때에는 즉시 계약담당공무원에게 통지하고 그 지시에 따라야 하며 이를 취급할 때에는 파손이 없도록 적절한 예방조치를 하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:39","kind":"조문","type":"계약예규","family":"nca","label":"제39조","title":"기성대가의 지급","text":"제39조(기성대가의 지급) ① 계약상대자는 최소한 30일마다 제27조제8항에 의한 검사를 완료하는 날까지 기성부분에 대한 대가지급청구서[(하수급인 및 자재ㆍ장비업자에 대한 대금지급 계획과 하수급인과 직접 계약을 체결한 자재ㆍ장비업자(이하 ‘하수급인의 자재ㆍ장비업자’라 한다)에 대한 대금지급계획을 첨부하여야 한다)]를 계약담당공무원과 공사감독관에게 동시에 제출할 수 있다. ② 계약담당공무원은 검사완료일부터 5일이내에 검사된 내용에 따라 기성대가를 확정하여 계약상대자에게 지급(「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통한 지급 포함. 이하 이 조에서 같다.)하여야 한다. 다만, 계약상대자가 검사완료일후에 대가의 지급을 청구한 때에는 그 청구를 받은 날부터 5일이내에 지급하여야 한다. ③ 계약담당공무원은 제2항에 따른 기성대가지급시에 제1항의 대금 지급 계획상의 하수급인, 자재ㆍ장비업자 및 하수급인의 자재ㆍ장비업자에게 기성대가지급 사실을 통보하고, 이들로 하여금 대금 수령내역(수령자, 수령액, 수령일 등) 및 증빙서류를 제출(「전자서명법」제2조에 따른 전자문서에 의한 제출을 포함한다. 이하 제40조제3항 및 제43조의2제1항에 따른 제출 및 통보에 있어 같다)하게 하여야 한다. ④ 계약담당공무원은 제27조제9항 단서에 의한 자재에 대하여 기성대가를 지급하는 경우에는 계약상대자로 하여금 그 지급대가에 상당하는 보증서(시행령 제37조제2항에 규정된 증권 또는 보증서 등을 말한다)를 제출하게 하여야 한다. ⑤ 계약담당공무원은 제1항에 의한 청구서의 기재사항이 검사된 내용과 일치하지 아니할 때에는 그 사유를 명시하여 계약상대자에게 이의 시정을 요구하여야 한다. 이 경우에 시정에 소요되는 기간은 제2항에서 규정한 기간에 산입하지 아니한다. ⑥ 기성대가는 계약단가에 의하여 산정ㆍ지급한다. 다만, 계약단가가 없을 경우에는 제20조제1항제2호 및 동조 제2항에 의하여 산정된 단가에 의한다. ⑦ 기성대가 지급의 경우에는 제40조제5항을 준용한다. ⑧ 제2항에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 제2항의 5일을 3일로 본다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:39의2","kind":"조문","type":"계약예규","family":"nca","label":"제39조의2","title":"계약금액조정전의 기성대가지급","text":"제39조의2(계약금액조정전의 기성대가지급) ① 계약담당공무원은 물가변동, 설계변경 및 기타계약내용의 변경으로 인하여 계약금액이 당초 계약금액보다 증감될 것이 예상되는 경우로서 기성대가를 지급하고자 하는 경우에는 「국고금관리법 시행규칙」 제72조에 의하여 당초 산출내역서를 기준으로 산출한 기성대가를 개산급으로 지급할 수 있다. 다만, 감액이 예상되는 경우에는 예상되는 감액금액을 제외하고 지급하여야 한다.② 계약상대자는 제1항에 의하여 기성대가를 개산급으로 지급받고자 하는 경우에는 기성대가신청시 개산급신청사유를 서면으로 작성하여 첨부하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:40","kind":"조문","type":"계약예규","family":"nca","label":"제40조","title":"준공대가의 지급","text":"제40조(준공대가의 지급) ① 계약상대자는 공사를 완성한 후 제27조에 의한 검사에 합격한 때에는 대가지급청구서(하수급인, 자재ㆍ장비업자 및 하수급인의 자재ㆍ장비업자에 대한 대금지급계획을 첨부하여야 한다)를 제출하는 등 소정절차에 따라 대가지급을 청구할 수 있다. ② 계약담당공무원은 제1항의 청구를 받은 때에는 그 청구를 받은 날로부터 5일(공휴일 및 토요일은 제외한다. 이하 이조에서 같다)이내에 그 대가를 지급(「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통한 지급 포함. 이하 이 조에서 같다)하여야 하며, 동 대가지급기한에도 불구하고 자금사정 등 불가피한 사유가 없는 한 최대한 신속히 대가를 지급하여야 한다. 다만, 계약당사자와의 합의에 의하여 5일을 초과하지 아니하는 범위안에서 대가의 지급기간을 연장할 수 있는 특약을 정할 수 있다. ③ 계약담당공무원은 제2항에 따른 대가지급시에 제1항의 대금 지급 계획상의 하수급인, 자재ㆍ장비업자 및 하수급인의 자재ㆍ장비업자에게 대가지급 사실을 통보하고, 이들로 하여금 대금 수령내역(수령자 ,수령액, 수령일 등) 및 증빙서류를 제출하게 하여야 한다. ④ 천재ㆍ지변 등 불가항력의 사유로 인하여 대가를 지급할 수 없게 된 경우에는 계약담당공무원은 해당사유가 존속되는 기간과 해당사유가 소멸된 날로부터 3일까지는 대가의 지급을 연장할 수 있다. ⑤ 계약담당공무원은 제1항의 청구를 받은 후 그 청구내용의 전부 또는 일부가 부당함을 발견한 때에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송할 수 있다. 이 경우에는 반송한 날로부터 재청구를 받은 날까지의 기간은 제2항의 지급기간에 산입하지 아니한다. ⑥ 제2항에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 제2항의 5일을 3일로 본다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:40의2","kind":"조문","type":"계약예규","family":"nca","label":"제40조의2","title":"국민건강보험료, 노인장기요양보험료 및 국민연금보험료의 사후정산","text":"제40조의2(국민건강보험료, 노인장기요양보험료 및 국민연금보험료의 사후정산) 계약담당공무원은 「정부 입찰ㆍ계약 집행기준」 제93조에 의하여 국민건강보험료, 노인장기요양보험료 및 국민연금보험료를 사후정산 하기로 한 계약에 대하여는 제39조 및 제40조에 의한 대가지급시 계약예규 「정부 입찰ㆍ계약 집행기준」제94조에 정한 바에 따라 정산하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:41","kind":"조문","type":"계약예규","family":"nca","label":"제41조","title":"대가지급지연에 대한 이자","text":"제41조(대가지급지연에 대한 이자) ① 계약담당공무원은 대가지급청구를 받은 경우에 제39조 및 제40조에 의한 대가지급기한(국고채무부담행위에 의한 계약의 경우에는 다음 회계년도 개시후 「국가재정법」에 의하여 해당 예산이 배정된 날부터 20일)까지 대가를 지급하지 못하는 경우에는 지급기한의 다음날부터 지급하는 날까지의 일수(이하 \"대가지급지연일수\"라 한다)에 해당 미지급금액에 대하여 지연발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 금융기관 대출평균금리를 말한다)를 곱하여 산출한 금액을 이자로 지급하여야 한다.② 불가항력의 사유로 인하여 검사 또는 대가지급이 지연된 경우에 제27조제2항 단서 및 제40조제4항에 의한 연장기간은 대가지급 지연일수에 산입하지 아니한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:42","kind":"조문","type":"계약예규","family":"nca","label":"제42조","title":"하도급의 승인 등","text":"제42조(하도급의 승인 등) ① 계약상대자가 계약된 공사의 일부를 제3자에게 하도급 하고자 하는 경우에는 「건설산업기본법」 등 관련법령에 정한 바에 의하여야 한다.② 계약담당공무원은 제1항에 의하여 계약상대자로부터 하도급계약을 통보받은 때에는 국토교통부장관이 고시한 건설공사하도급심사기준에 정한 바에 따라 하도급금액의 적정성을 심사하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:43","kind":"조문","type":"계약예규","family":"nca","label":"제43조","title":"하도급대가의 직접지급 등","text":"제43조(하도급대가의 직접지급 등) ① 계약담당공무원은 계약상대자가 다음 각호의 어느 하나에 해당하는 경우에 「건설산업기본법」 등 관련법령에 의하여 체결한 하도급계약중 하수급인이 시공한 부분에 상당하는 금액에 대하여는 계약상대자가 하수급인에게 제39조 및 제40조에 의한 대가지급을 의뢰한 것으로 보아 해당 하수급인에게 직접 지급하여야 한다.1. 하수급인이 계약상대자를 상대로 하여 받은 판결로서 그가 시공한 분에 대한 하도급대금지급을 명하는 확정판결이 있는 경우2. 계약상대자가 파산, 부도, 영업정지 및 면허취소 등으로 하도급대금을 하수급인에게 지급할 수 없게 된 경우3. 「하도급거래 공정화에 관한 법률」 또는 「건설산업기본법」에 규정한 내용에 따라 계약상대자가 하수급인에 대한 하도급대금 지급보증서를 제출하여야 할 대상 중 그 지급보증서를 제출하지 아니한 경우② 계약담당공무원은 제1항에도 불구하고 하수급인이 해당 하도급계약과 관련하여 노임, 중기사용료, 자재대 등을 체불한 사실을 계약상대자가 객관적으로 입증할 수 있는 서류를 첨부하여 해당 하도급대가의 직접지급 중지를 요청한 때에는 해당 하도급대가를 직접 지급하지 아니할 수 있다.③ 계약상대자는 제27조제1항에 의한 준공신고 또는 제39조에 의한 기성대가의 지급청구를 위한 검사를 신청하고자 할 경우에는 하수급인이 시공한 부분에 대한 내역을 구분하여 신청하여야 하며, 제39조 및 제40조에 의하여 제1항의 하도급대가가 포함된 대가지급을 청구할 때에는 해당 하도급대가를 분리하여 청구하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:43의2","kind":"조문","type":"계약예규","family":"nca","label":"제43조의2","title":"하도급대금 등 지급 확인","text":"제43조의2(하도급대금 등 지급 확인) ① 계약상대자는 제39조 및 제40조에 의한 대가를 지급받은 경우에 15일 이내에 하수급인 및 자재ㆍ장비업자가 시공ㆍ제작ㆍ대여한 분에 상당한 금액(이하 \"하도급대금 등\"이라 한다)을 하수급인 및 자재ㆍ장비업자에게 현금으로 지급하여야 하며, (다만 「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통해서도 지급이 가능하며(이하 이 조에서 같다.), 이 경우 5일 이내에 지급하여야 한다), 하도급대금 등의 지급 내역(수령자, 지급액, 지급일 등)을 5일(공휴일 및 토요일은 제외한다) 이내에 발주기관 및 공사감독관에게 통보하여야 한다. ② 계약상대자는 제1항에 따라 하수급인에게 하도급대금 등을 지급한 경우에 하수급인으로 하여금 제1항을 준용하여 하수급인의 자재ㆍ장비업자가 제작ㆍ대여한 분에 상당한 금액을 하수급인의 자재ㆍ장비업자에게 지급하고, 이들로 하여금 그 내역(수령자, 지급액, 지급일 등)을 발주기관 및 공사감독관에게 통보하도록 하여야 한다. ③ 계약담당공무원은 제1항 및 제2항에 의한 대금 지급내역을 제39조제3항 또는 제40조제3항에 따라 하수급인, 자재ㆍ장비업자 및 하수급인의 자재ㆍ장비업자로부터 제출받은 대금 수령내역과 비교ㆍ확인하여야 하며, 하수급인이 하수급인의 자재ㆍ장비업자에게 대금을 지급하지 않은 경우에는 계약상대자에게 즉시 통보하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:43의3","kind":"조문","type":"계약예규","family":"nca","label":"제43조의3","title":"노무비의 구분관리 및 지급확인","text":"제43조의3(노무비의 구분관리 및 지급확인) ① 계약상대자는 발주기관과 협의하여 정한 노무비 지급기일에 맞추어 매월 모든 근로자(직접노무비 대상에 한하며, 하수급인이 고용한 근로자를 포함)의 노무비 청구내역(근로자 개인별 성명, 임금 및 연락처 등)을 제출하여야 한다.② 계약담당공무원은 현장인 명부 등을 통해 제1항에 따른 노무비 청구내역을 확인하고 청구를 받은 날부터 5일 이내에 계약상대자의 노무비 전용계좌로 해당 노무비를 지급(「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통한 지급 포함. 이하 이 조에서 같다.)하여야 한다. ③ 계약상대자는 제2항에 따라 노무비를 지급받은 날부터 2일(공휴일 및 토요일은 제외한다) 이내에 노무비 전용계좌에서 이체하는 방식으로 근로자에게 노무비를 지급하여야 하며, 동일한 방식으로 하수급인의 노무비 전용계좌로 노무비를 지급하여야 한다. 다만, 근로자가 계좌를 개설할 수 없거나 다른 방식으로 지급을 원하는 경우 또는 계약상대자(하수급인 포함)가 근로자에게 노무비를 미리 지급하는 경우에는 그에 대한 발주기관의 승인을 받아 그러하지 아니할 수 있다.④ 계약상대자는 제1항에 따라 노무비 지급을 청구할 때에 전월 노무비 지급내역(계약상대자 및 하수급인의 노무비 전용계좌 이체내역 등 증빙서류)을 제출하여야 하며, 계약담당공무원은 동 지급내역과 계약상대자가 이미 제출한 같은 달의 청구내역을 비교하여 임금 미지급이 확인된 경우에는 해당 사실을 지방 고용노동(지)청에 통보하여야 한다.[본조신설 2012.1.1.]","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:44","kind":"조문","type":"계약예규","family":"nca","label":"제44조","title":"계약상대자의 책임있는 사유로 인한 계약의 해제 및 해지","text":"제44조(계약상대자의 책임있는 사유로 인한 계약의 해제 및 해지) ① 계약담당공무원은 계약상대자가 다음 각호의 어느 하나에 해당하는 경우에는 해당 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 다만, 제3호의 경우에 계약상대자의 계약이행 가능성이 있고 계약을 유지할 필요가 있다고 인정되는 경우로서 계약상대자가 계약이행이 완료되지 아니한 부분에 상당하는 계약보증금(당초 계약보증금에 제25조제1항에 따른 지체상금의 최대금액을 더한 금액을 한도로 한다)을 추가납부하는 때에는 계약을 유지한다. 1. 정당한 이유없이 약정한 착공시일을 경과하고도 공사에 착수하지 아니할 경우2. 계약상대자의 책임있는 사유로 인하여 준공기한까지 공사를 완공하지 못하거나 완성할 가능성이 없다고 인정될 경우3. 제25조제1항에 의한 지체상금이 시행령 제50조제1항에 의한 해당 계약(장기계속공사계약인 경우에는 차수별 계약)의 계약보증금상당액에 달한 경우4. 장기계속공사의 계약에 있어서 제2차공사 이후의 계약을 체결하지 아니하는 경우5. 계약의 수행중 뇌물수수 또는 정상적인 계약관리를 방해하는 불법ㆍ부정행위가 있는 경우6. 제47조의3에 따른 시공계획서를 제출 또는 보완하지 않거나 정당한 이유 없이 계획서대로 이행하지 않을 경우 7. 입찰에 관한 서류 등을 허위 또는 부정한 방법으로 제출하여 계약이 체결된 경우 8. 「정부입찰ㆍ계약 집행기준」 제36조제2항에 따른 선금사용내역서를 확인한 결과, 선금의 반복적인 목적 외 사용으로 계약 이행에 상당한 지장을 초래할 것이 명백한 경우 9. 기타 계약조건을 위반하고 그 위반으로 인하여 계약의 목적을 달성할 수 없다고 인정될 경우② 계약담당공무원은 제1항에 의하여 계약을 해제 또는 해지한 때에는 그 사실을 계약상대자 및 제42조에 의한 하수급자에게 통지하여야 한다.③ 제2항에 의한 통지를 받은 계약상대자는 다음 각호의 사항을 준수하여야 한다.1. 해당 공사를 즉시 중지하고 모든 공사자재 및 기구 등을 공사장으로부터 철거하여야 한다.2. 제13조에 의한 대여품이 있을 때에는 지체없이 발주기관에 반환하여야 한다. 이 경우에 해당 대여품이 계약상대자의 고의 또는 과실로 인하여 멸실 또는 파손되었을 때에는 원상회복 또는 그 손해를 배상하여야 한다.3. 제13조에 의한 관급재료중 공사의 기성부분으로서 인수된 부분에 사용한 것을 제외한 나머지 재료는 발주기관에 반환하여야 한다. 이 경우에 해당 재료가 계약상대자의 고의 또는 과실로 인하여 멸실 또는 파손되었을 때, 또는 공사의 기성부분으로서 인수되지 아니하는 부분에 사용된 때에는 원상회복 하거나 그 손해를 배상하여야 한다.4. 발주기관이 요구하는 공사장의 모든 재료, 정보 및 편의를 발주기관에 제공하여야 한다.④ 계약담당공무원은 제1항에 의하여 계약을 해제 또는 해지한 경우 및 제48조에 의하여 보증기관이 보증이행을 하는 경우에 기성부분을 검사하여 인수한 때에는 해당부분에 상당하는 대가를 계약상대자에게 지급하여야 한다. ⑤ 제1항에 의하여 계약이 해제 또는 해지된 경우에 계약상대자는 지급받은 선금에 대하여 미정산잔액이 있는 경우에는 그 잔액에 대한 약정이자상당액[사유발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 대출평균금리를 말한다)에 의하여 산출한 금액을 가산하여 발주기관에 상환하여야 한다.⑥ 제5항의 경우에 계약담당공무원은 선금잔액과 기성부분에 대한 미지급액을 상계하여야 한다. 다만, 「건설산업기본법」 및 「하도급 거래공정화에 관한 법률」에 의하여 하도급대금 지급보증이 되어 있지 않은 경우로서 제43조제1항에 의하여 하도급대가를 직접 지급하여야 하는 때에는 우선적으로 하도급대가를 지급한 후에 기성부분에 대한 미지금액의 잔액이 있으면 선금잔액과 상계할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:45","kind":"조문","type":"계약예규","family":"nca","label":"제45조","title":"사정변경에 의한 계약의 해제 또는 해지","text":"제45조(사정변경에 의한 계약의 해제 또는 해지) ① 발주기관은 제44조제1항 각호의 경우외에 다음 각 호의 사유와 같이 객관적으로 명백한 발주기관의 불가피한 사정이 발생한 때에는 계약을 해제 또는 해지할 수 있다. 1. 정부정책 변화 등에 따른 불가피한 사업취소2. 관계 법령의 제ㆍ개정으로 인한 사업취소3. 과다한 지역 민원 제기로 인한 사업취소4. 기타 공공복리에 의한 사업의 변경 등에 따라 계약을 해제 또는 해지하는 경우② 제1항에 의하여 계약을 해제 또는 해지하는 경우에는 제44조제2항 본문 및 제3항을 준용한다.③ 발주기관은 제1항에 의하여 계약을 해제 또는 해지하는 경우에는 다음 각호에 해당하는 금액을 제44조제3항 각호의 수행을 완료한 날부터 14일이내에 계약상대자에게 지급하여야 한다. 이 경우에 제7조에 의한 계약보증금을 동시에 반환하여야 한다.1. 제32조제2항제1호 및 제2호에 해당하는 시공부분의 대가중 지급하지 아니한 금액2. 전체공사의 완성을 위하여 계약의 해제 또는 해지일 이전에 투입된 계약상대자의 인력ㆍ자재 및 장비의 철수비용④ 계약상대자는 선금에 대한 미정산잔액이 있는 경우에는 이를 발주기관에 상환하여야 한다. 이 경우에 미정산잔액에 대한 이자는 가산하지 아니한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:46","kind":"조문","type":"계약예규","family":"nca","label":"제46조","title":"계약상대자에 의한 계약해제 또는 해지","text":"제46조(계약상대자에 의한 계약해제 또는 해지) ① 계약상대자는 다음 각호의 어느 하나에 해당하는 사유가 발생한 경우에는 해당계약을 해제 또는 해지할 수 있다.1. 제19조에 의하여 공사내용을 변경함으로써 계약금액이 100분의 40이상 감소되었을 때2. 제47조에 의한 공사정지기간이 공기의 100분의 50을 초과하였을 경우3. 발주기관이 정당한 이유없이 계약내용을 이행하지 아니함으로써 공사의 적정이행이 불가능하다고 명백히 인정되는 때 ② 제1항에 의하여 계약이 해제 또는 해지되었을 경우에는 제45조제2항 내지 제4항을 준용한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:47","kind":"조문","type":"계약예규","family":"nca","label":"제47조","title":"공사의 일시정지","text":"제47조(공사의 일시정지) ① 공사감독관은 다음 각호의 경우에는 공사의 전부 또는 일부의 이행을 정지시킬 수 있다. 이 경우에 계약상대자는 정지기간중 선량한 관리자의 주의의무를 게을리 하여서는 아니된다.1. 공사의 이행이 계약내용과 일치하지 아니하는 경우2. 공사의 전부 또는 일부의 안전을 위하여 공사의 정지가 필요한 경우3. 제24조에 의한 응급조치의 경우4. 기타 발주기관의 필요에 의하여 계약담당공무원이 지시한 경우② 공사감독관은 제1항에 의하여 공사를 정지시킨 경우에는 지체없이 계약상대자 및 계약담당공무원에게 정지사유 및 정지기간을 통지하여야 한다.③ 제1항 각호의 사유가 발생한 경우로서 공사감독관이 제2항에 따른 통지를 하지 않는 경우 계약상대자는 서면으로 공사감독관 또는 계약담당공무원에게 공사 일시정지 여부에 대한 확인을 요청할 수 있다. ④ 공사감독관 또는 계약담당공무원은 제3항의 요청을 받은 날부터 10일 이내에 공사계약상대자에게 서면으로 회신을 발송하여야 한다. ⑤ 제1항 및 제4항에 의하여 공사가 정지된 경우에 계약상대자는 계약기간의 연장 또는 추가금액을 청구할 수 없다. 다만, 계약상대자의 책임있는 사유로 인한 정지가 아닌 때에는 그러하지 아니한다. ⑥ 발주기관의 책임있는 사유에 의한 공사정지기간(각각의 사유로 인한 정지기간을 합산하며, 장기계속계약의 경우에는 해당 차수내의 정지기간을 말함)이 60일을 초과한 경우에 발주기관은 그 초과된 기간에 대하여 잔여계약금액(공사중지기간이 60일을 초과하는 날 현재의 잔여계약금액을 말하며, 장기계속공사계약의 경우에는 차수별 계약금액을 기준으로 함)에 초과일수 매 1일마다 지연발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 금융기관 대출평균금리를 말한다)를 곱하여 산출한 금액을 준공대가 지급시 계약상대자에게 지급하여야 한다. ⑦ 제6항에서 정하는 발주기관의 책임있는 사유란, 부지제공ㆍ보상업무ㆍ지장물처리의 지연, 공사 이행에 필요한 인ㆍ허가 등 행정처리의 지연과 계약서 및 관련 법령에서 정한 발주기관의 명시적 의무사항을 정당한 이유없이 불이행하거나 위반하는 경우를 말하며, 그 외 계약상대자의 책임있는 사유나 천재ㆍ지변 등 불가항력에 의한 사유는 제외한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:47의2","kind":"조문","type":"계약예규","family":"nca","label":"제47조의2","title":"계약상대자의 공사정지 등","text":"제47조의2(계약상대자의 공사정지 등) ① 계약상대자는 발주기관이 「국가를 당사자로 하는 계약에 관한 법률」과 계약문서 등에서 정하고 있는 계약상의 의무를 이행하지 아니하는 때에는 발주기관에 계약상의 의무이행을 서면으로 요청할 수 있다.② 계약담당공무원은 계약상대자로부터 제1항에 의한 요청을 받은 날부터 14일이내에 이행계획을 서면으로 계약상대자에게 통지하여야 한다.③ 계약상대자는 계약담당공무원이 제2항에 규정한 기한내에 통지를 하지 아니하거나 계약상의 의무이행을 거부하는 때에는 해당 기간이 경과한 날 또는 의무이행을 거부한 날부터 공사의 전부 또는 일부의 시공을 정지할 수 있다.④ 계약상대자는 현장여건이 안전에 긴급한 위험 요소가 있다고 판단될 경우 발주기관에 작업의 중지를 서면으로 요청할 수 있다.⑤ 계약담당공무원은 제4항에 의한 요청이 있는 경우 그 내용을 검토하여 작업의 중지 등 필요한 조치를 하여야 한다.⑥ 계약담당공무원은 제3항 및 제5항에 의하여 정지된 기간에 대하여는 제26조에 의하여 공사기간을 연장하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:47의3","kind":"조문","type":"계약예규","family":"nca","label":"제47조의3","title":"공정지연에 대한 관리","text":"제47조의3(공정지연에 대한 관리) ① 계약상대자는 자신의 책임 있는 사유로 다음 각호의 사례가 발생한 경우에는 즉시 이를 해소하기 위한 시공계획서를 제출하여야 한다.1. 실행공정률이 계획공정률에 비해 10%p 이상 지연된 경우2. 골조공사 등 주된 공사의 시공이 1개월 이상 중단된 경우② 발주기관과 계약상대자는 상호 협의하여 공사의 규모나 종류ㆍ특성 등에 따라 제1항 각호의 내용을 조정하거나 새로운 내용을 추가할 수 있다.③ 계약담당공무원은 제1항에 따라 계약상대방이 제출한 계획서를 검토하고 필요한 경우에 보완을 요구할 수 있다.[본조신설 2012.4.2.]","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:48","kind":"조문","type":"계약예규","family":"nca","label":"제48조","title":"공사계약의 이행보증","text":"제48조(공사계약의 이행보증) ① 계약담당공무원은 계약상대자가 제44조제1항 각호의 어느 하나에 해당하는 경우로서 시행령 제52조제1항제3호에 의한 공사이행보증서가 제출되어 있는 경우에는 계약을 해제 또는 해지하지 아니하고 제9조에 의한 보증기관에 대하여 공사를 완성할 것을 청구하여야 한다. ② 제1항의 청구가 있을 때에는 보증기관은 지체없이 그 보증의무를 이행하여야 한다. 이 경우에 보증의무를 이행한 보증기관은 계속공사에 있어서 계약상대자가 가지는 계약체결상의 이익을 가진다. 다만, 보증기관은 보증이행업체를 지정하여 보증의무를 이행하는 대신 공사이행보증서에 정한 금액을 현금으로 발주기관에 납부함으로써 보증의무이행에 갈음할 수 있다. ③ 제2항에 의하여 해당 계약을 이행하는 보증기관은 계약금액중 보증이행부분에 상당하는 금액을 발주기관에 직접 청구할 수 있는 권리를 가지며 계약상대자는 보증기관의 보증이행부분에 상당하는 금액을 청구할 수 있는 권리를 상실한다. ④ ⑤ 보증기관은 공사진행 상황 및 계약상대자의 이행능력 등을 조사할 수 있으며, 제44조제1항 각호의 사유가 발생하는 경우 계약담당공무원에게 보증이행의 청구를 건의할 수 있다. ⑥ 제1항 내지 제3항 외에 공사이행보증서 제출에 따른 보증의무이행에 대하여는 계약예규 「정부 입찰ㆍ계약 집행기준」 제13장(공사의 이행보증제도 운용)에 정한 바에 의한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:49","kind":"조문","type":"계약예규","family":"nca","label":"제49조","title":"부정당업자의 입찰참가자격 제한","text":"제49조(부정당업자의 입찰참가자격 제한) ① 계약상대자가 시행령 제76조에 해당하는 경우에는 1월 이상 2년 이하의 범위내에서 입찰참가자격 제한조치를 받게 된다. ②","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:50","kind":"조문","type":"계약예규","family":"nca","label":"제50조","title":"기술지식의 이용 및 비밀엄수의무","text":"제50조(기술지식의 이용 및 비밀엄수의무) ① 계약담당공무원은 사업목적 달성 또는 공공의 이익 등을 위해 필요하다고 인정되는 경우, 계약내용에 따라 계약상대자가 제출하는 각종 보고서, 정보 기타 자료 및 이에 의하여 얻은 기술지식(계약목적물의 내용에 포함되는 경우는 제외한다. 이하 이 조에서 \"기술지식 등\"이라 한다)의 전부 또는 일부를 계약상대자의 승인을 얻어 복사ㆍ이용 또는 공개할 수 있다.② 계약상대자는 해당 계약을 통하여 얻은 정보 또는 국가의 비밀사항을 계약이행의 전후를 막론하고 외부에 누설할 수 없다.③ 계약담당공무원은 시장에서 거래되는 등 재산적 가치가 있는 기술지식 등을 제1항에 따라 복사ㆍ이용 또는 공개하려는 경우에는 계약상대자에게 정당한 이용대가를 지급하여야 한다. 이 경우 기술지식 등의 이용대가는 시장거래가격 등을 기초로 계약상대자와 협의하여 결정한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:51","kind":"조문","type":"계약예규","family":"nca","label":"제51조","title":"분쟁의 해결","text":"제51조(분쟁의 해결) ① 계약의 수행중 계약당사자간에 발생하는 분쟁은 협의에 의하여 해결한다.② 제1항에 의한 협의가 이루어지지 아니할 때에는 법원의 판결 또는 「중재법」에 의한 중재에 의하여 해결한다. 다만 「국가를 당사자로 하는 계약에 관한 법률」제28조에서 정한 이의신청 대상에 해당하는 경우 국가계약분쟁조정위원회 조정결정에 따라 분쟁을 해결할 수 있다. ③ 제2항에도 불구하고 계약을 체결하는 때에 「국가를 당사자로 하는 계약에 관한 법률」제28조의2에 따라 분쟁해결방법을 정한 경우에는 그에 따른다. ④ 계약상대자는 제1항부터 제3항까지의 분쟁처리절차 수행기간중 공사의 수행을 중지하여서는 아니된다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:52","kind":"조문","type":"계약예규","family":"nca","label":"제52조","title":"공사관련자료의 제출","text":"제52조(공사관련자료의 제출) 계약담당공무원은 필요하다고 인정할 경우에 계약상대자에게 산출내역서의 기초가 되는 단가산출서 또는 일위대가표의 제출을 요구할 수 있으며 이 경우에 계약상대자는 이에 응하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:53","kind":"조문","type":"계약예규","family":"nca","label":"제53조","title":"적격ㆍPQ심사ㆍ종합심사낙찰제 관련사항 이행","text":"제53조(적격ㆍPQ심사ㆍ종합심사낙찰제 관련사항 이행) ① 계약상대자는 계약예규 「입찰참가자격사전심사요령」, 「적격심사기준」 및 「종합심사낙찰제 심사기준」 별표의 심사항목에 규정된 사항에 대하여 심사당시 제출한 내용대로 철저하게 이행하여야 한다. ② 계약담당공무원(「조달사업에 관한 법률」 제3조에 따라 조달청에 의뢰하여 계약한 공사로서 수요기관이 공사관리를 하는 경우에는 수요기관)은 제1항에 규정한 이행상황을 수시로 확인하여야 하며, 제출된 내용대로 이행이 되지 않고 있을 때에는 즉시 시정토록 조치하여야 한다. ③ 계약상대자는 제40조에 따른 대가지급을 청구할 때에 계약예규 「입찰참가자격사전심사요령」 제4조에 따른 표준계약서 사용계획의 이행결과로서 하도급 및 건설기계임대차 계약서를 제출하여야 한다. ④ 계약상대자가 제3항에 따른 계약서를 제출하지 않거나 하수급인 등의 계약상 이익을 제한하는 내용으로 표준계약서의 일부를 수정ㆍ삭제한 경우 또는 이면계약을 체결한 경우에는 표준계약서를 사용하지 않은 것으로 본다. ⑤ 계약담당공무원은 계약상대자가 표준계약서를 사용하지 않은 경우에 해당 업체명, 부여한 가점과 그에 따른 감점, 표준계약서 사용계획 대비 미사용 비율(계약금액 기준)을 전자조달시스템에 게재하고 동 사실을 계약상대자에게 통보하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:54","kind":"조문","type":"계약예규","family":"nca","label":"제54조","title":"재검토기한","text":"제54조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-gongsa-bid","kind":"법령","type":"계약예규","family":"nca","label":"공사입찰유의서","name":"(계약예규) 공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 유의서는 정부(이하 \"발주기관\"이라 한다)가 행하는 공사계약에 대한 입찰에서 해당 입찰에 참가하고자 하는 자가 유의하여야 할 사항을 정함을 목적으로 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"용어의 정의","text":"제2조(용어의 정의) 이 유의서에서 사용하는 용어의 정의는 이 유의서에서 따로 정하는 경우를 제외하고는 「국가를 당사자로 하는 계약에 관한 법률 시행령」, 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」, 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」(이하 각각 \"시행령\", \"시행규칙\" 및 \"특례규정\"이라 한다) 및 계약예규 「공사계약일반조건」(이하 \"일반조건\"이라 한다)에 정하는 바에 의한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"입찰참가신청","text":"제3조(입찰참가신청) ① 입찰에 참가하고자 하는 자는 입찰공고 또는 입찰참가통지서에 기재된 입찰참가신청마감일까지 다음 각호의 서류를 발주기관에 제출하여 입찰참가 신청을 하여야 한다.1. 입찰참가신청서(소정서식) 1통2. 해당 공사에 해당하는 면허수첩 또는 자격등록증 서류 1통3. 인감증명서 또는「본인서명사실 확인 등에 관한 법률」제2조제3호에 따른 본인서명사실확인서 1통. 다만,「전자조달의 이용 및 촉진에 관한 법률」제2조제4호에 따른 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)을 이용하여 등록하는 경우는 제외한다. 4. 기타 공고 또는 통지로 요구하는 서류② 제1항제2호의 경우에는 원본을 제시하거나 사본에 \"원본과 같음\"을 명기하고 인감(인감증명서상의 인감 또는 입찰참가신청서상의 사용인감)으로 날인(본인서명사실확인서를 제출한 경우는 서명)하여 제출하여야 한다. ③ 시행령 제72조에 의하여 공동계약이 허용된 경우에는 공동수급체를 구성하여 입찰에 참가하고자 하는 자는 공동수급협정서를 제1항 각호의 서류와 함께 제출하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:3의2","kind":"조문","type":"계약예규","family":"nca","label":"제3조의2","title":"입찰참가자격의 판단기준일","text":"제3조의2(입찰참가자격의 판단기준일) ① 시행령 제12조 및 제21조에 따른 등록ㆍ시공능력ㆍ실적 등에 의한 입찰참가자격의 판단기준일은 시행규칙 제40조제4항에 의한 입찰참가신청서류의 접수마감일(이하 \"입찰참가등록마감일\"이라 한다)로 하며, 입찰참가자는 입찰서제출 마감일까지 해당 입찰참가자격을 계속 유지하여야 한다. 1. 2. ② 제1항에도 불구하고 시행령 제21조제1항제6호 및 시행규칙 제24조에 따라 지역제한경쟁입찰에 부치는 경우 및 시행령 제72조 제3항에 따른 지역의무공동도급 사업의 경우 법인등기부상 본점소재지 기준일(본점소재지가 변경된 경우 법인등기부상 본점소재지 등기일을 말한다.)은 입찰공고일 현재 해당업체의 전입일 다음 날부터 기산하여 90일 이상으로 하며 계약체결일까지 계속 유지하여야 한다. ③ 입찰참가자가 영업정지처분을 받은 경우에는 「건설산업기본법」등 관련법령에 의한 처리기준에 따라 입찰참가자격을 판단하고, 입찰참가자가 시행령 제76조에 의한 입찰참가자격제한을 받은 경우에는 입찰참가등록마감일 전일까지 입찰참가자격제한기간이 만료되어야 입찰참가가 가능하다. 1. 2. ④ 입찰전에 상호 또는 대표자의 변경(법인의 경우에는 법인 등기사항증명서를 기준으로 한다)이 있는 경우에는 변경신고를 한 후에 변경된 상호 또는 대표자 명의로 입찰에 참가하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:3의3","kind":"조문","type":"계약예규","family":"nca","label":"제3조의3","title":"특별재난 선포지역의 지역제한경쟁입찰시 입찰참가자격의 판단기준일 관련 특례","text":"제3조의3(특별재난 선포지역의 지역제한경쟁입찰시 입찰참가자격의 판단기준일 관련 특례) ① 「재난 및 안전관리 기본법」제60조에 따라 특별재난지역으로 선포된 지역의 재난복구를 위하여 발주하는 공사를 시행령 제21조제1항제6호 및 시행규칙 제24조에 의하여 지역제한 경쟁입찰에 부치는 경우에는 법인등기부상 본점소재지 기준일(본점소재지가 변경된 경우 법인등기부상 본점소재지 등기일을 말한다.)은 다음 각 호의 기준에 의하여야 한다. 1. 특별재난지역 선포의 원인이 된 재난의 발생일 전에 소재지를 이전한 업체의 경우에는 제3조의2제2항을 적용함2. 특별재난지역 선포의 원인이 된 재난의 발생일 이후에 소재지를 이전한 업체의 경우에는 제3조의2제2항에 불구하고 입찰공고일 현재 해당업체의 등기일 다음 날부터 기산하여 90일이상이 경과하고 있어야 하며 계약체결일까지 계속유지 하여야 함② 「재난 및 안전관리 기본법」제60조에 따라 특별재난지역으로 선포된 지역의 재난복구를 위하여 발주하는 공사를 시행령 제30조제4항 및 시행규칙 제33조제2항에 의하여 법인등기부상 본점소재지로 견적서의 제출을 제한하는 경우에도 제1항 각 호를 준용한다. ③ 계약담당공무원은 제1항 및 제2항에 따라 특례를 적용하는 경우에는 이를 입찰공고 및 견적서제출 안내공고등에 명시하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"입찰에 관한 서류","text":"제4조(입찰에 관한 서류) ① 계약담당공무원은 입찰공고 시 입찰에 참가하려는 자에게 다음 각 호의 서류(이하 \"입찰에 관한 서류\"라 한다)를 열람하게 하고 교부하여야 한다. 1. 입찰공고문 또는 입찰참가통지서2. 공사입찰유의서3. 입찰참가신청서(소정서식)4. 입찰서(소정서식)5. 공사도급표준계약서(소정서식)6. 공사계약일반조건7. 공사계약특수조건8. 설계서(설계도면, 공사시방서 및 현장설명서를 말한다. 이하같다), 물량내역서(시행령 제14조제1항 단서의 경우 교부하지 아니할 수 있다). 9. 시행령 제6장 및 제8장을 적용받는 공사의 경우 입찰안내서 10. 시행령 제42조제5항ㆍ제6항에 따른 낙찰자 결정관련 심사기준(세부심사기준을 포함한다) 11. 국토교통부장관이 정하는 \"공공 건설공사의 공사기간 산정기준\" 등에 따라 산정한 공사기간의 산정근거(시행령 제6장 및 제8장의 계약은 제외한다) 12. 기타 참고사항을 기재한 서류 ② 발주기관은 제1항의 입찰에 관한 서류를 교부하는 경우에 입찰공고 등에서 정한 금액을 납부할 것을 요구할 수 있으며, 이 경우에는 입찰에 참가하고자 하는 자는 이에 따라야 한다.③ 제1항의 설계서를 교부받은 자는 해당 입찰에 참가하거나 계약을 이행하는 용도 이외의 목적으로 설계서를 무단복제, 배포, 개작, 전송 등의 행위를 하여서는 아니된다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:4의2","kind":"조문","type":"계약예규","family":"nca","label":"제4조의2","title":"국민건강보험료 및 국민연금보험료 사후정산 등에 관한 규정의 숙지 등","text":"제4조의2(국민건강보험료 및 국민연금보험료 사후정산 등에 관한 규정의 숙지 등) 계약담당공무원은 입찰공고 등에 계약예규 「정부 입찰ㆍ계약 집행기준」제19장에 정한 국민건강보험료 및 국민연금보험료 사후정산 등에 관한 내용을 기재하여 입찰에 참가하고자 하는 자가 열람할 수 있도록 하여야 하며, 입찰에 참가하고자 하는 자는 동 내용을 숙지하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:4의3","kind":"조문","type":"계약예규","family":"nca","label":"제4조의3","title":"단가산출서 공개","text":"제4조의3(단가산출서 공개) 계약담당공무원은 예정가격 작성을 위한 단가(안전관리비를 포함한다)와 요율 및 항목의 세부 산출방법(또는 내용)이 기재된 서류(이하 이 항에서 \"단가산출서 등\"이라 한다)를 입찰서 제출마감일 7일 전까지 공개하여야한다. 다만 긴급 입찰 또는 공고기간이 10일 이내일 경우 등 부득이한 사유가 있는 경우에는 입찰서 제출마감일 5일 전까지 공개하여야 하며, 입찰서 제출기간이 7일을 초과하는 경우에는 입찰서 제출개시일 전일까지 공개하여야 한다. 다만, 다음 각 호의 공사는 단가산출서를 공개하지 아니 할 수 있다.1. 추정가격 4억원 이하 종합건설공사2. 추정가격 2억원 이하 전문건설공사3. 추정가격 1.6억원 이하 전기ㆍ정보통신ㆍ소방시설 등 기타 공사","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"관계법령의 숙지","text":"제5조(관계법령의 숙지) ① 입찰에 참가하고자 하는 자는 시행령 등의 입찰에 관련된 법령 및 제4조제1항에 의한 입찰에 관한 서류를 입찰전에 완전히 숙지하여야 하며 이를 숙지하지 못한 책임은 입찰참가자에게 있다. ② 입찰에 참가하고자 하는 자는 제1항에 의한 입찰에 관한 서류의 검토과정에서 발견한 입찰에 관한 서류상의 착오, 누락사항 또는 기타 설명이 요구되는 사항에 대하여는 입찰서 제출마감일전일까지 발주기관에 그 설명을 요구할 수 있다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"현장설명","text":"제6조(현장설명) ① 현장설명에 참가하고자 하는 자는 소정의 국가기술자격을 취득하거나 「건설기술진흥법」 등 관련법령에 의하여 해당 기술자로 인정되고 있는 자이어야 하며 국가기술자격수첩 또는 건설기술자 경력수첩을 제시하여야 한다. 다만, 「건설산업기본법 시행령」 제8조, 「전기공사업법 시행령」 제5조 및 「정보통신공사업법 시행령」 제4조에 의한 경미한 공사의 경우에는 그러하지 아니하다. ②","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"입찰보증금","text":"제7조(입찰보증금) ① 입찰에 참가하고자 하는 자는 입찰신청마감일(공휴일인 때에는 전일)까지 입찰금액의 100분의 5 이상의 입찰보증금을 시행령 제37조제2항에 규정된 현금 또는 보증서등으로 발주기관에 납부하여야 한다.② 낙찰자가 정당한 이유없이 소정의 기한내에 계약을 체결하지 아니한 때(제21조제1항에 규정한 공사이행보증서 제출의무가 있는 경우에 동 보증서를 기한내에 제출하지 못하여 계약을 체결하지 못한 경우를 포함한다)에는 계약담당공무원은 해당 입찰보증금을 국고에 귀속한다. ③ 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)은 낙찰되지 아니한 입찰자의 입찰보증금을 낙찰자가 결정된 후에 즉시 반환한다. 다만, 낙찰자의 입찰보증금은 계약체결 후에 즉시 반환한다.④ 시행규칙 제43조제1항 단서에 의한 일괄보증의 경우에 입찰보증금 납부방법, 국고귀속 등 필요한 사항에 대하여는 계약예규 「정부 입찰ㆍ계약 집행기준」 제10장(일괄입찰보증제도의 운용)에 의한다. ⑤ 계약담당공무원은 다음 각호의 어느 하나에 해당하는 경우에는 원칙적으로 입찰보증금 납부를 면제할 수 있다. 1. 시행령 제37조제3항제1호 내지 제4호 및 제6호에 정한 자가 입찰에 참가하는 경우2. 「건설산업기본법」ㆍ「전기공사업법」ㆍ「정보통신공사업법」 또는 「소방시설공사업법」등에 의하여 국가 또는 지방자치단체(이하 \"국가기관 등\"이라 한다)로부터 등록 등을 받아 입찰신청마감일 현재 해당 공사관련법령에 의한 사업을 영위하고 있는 자가 입찰에 참가하는 경우 다만, 다음 각 목의 어느 하나에 해당하는 자는 제외한다. 가. 입찰공고일 이전 1년 이내에 시행령 제76조제2항제2호가목의 사유로 입찰참가자격제한을 받은 자(입찰참가자격 제한 기간 중인 경우를 포함한다) 나. 계약체결을 기피할 우려가 있어 각 중앙관서의 장 또는 계약담당공무원이 입찰공고에 명시한 요건에 해당하는 자 ⑥ 보증서 등에 의한 입찰보증금의 보증기간은 다음 각호를 충족하여야 한다.1. 보증기간의 시작일 : 입찰서 제출마감일 이전일 것2. 보증기간의 만료일 : 입찰서 제출마감일 다음날부터 30일 이후일 것. 다만, 시행령 제78조에 의한 공사입찰의 경우에는 입찰서 제출마감일 다음날부터 90일 이후일 것","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"입찰참가","text":"제8조(입찰참가) ① 입찰참가신청을 한 자가 아니면 입찰에 참가할 수 없다.② 입찰참가신청자가 입찰참가신청서 제출 시에 대리인을 지정한 경우에는 그 대리인도 입찰에 참가할 수 있다. 다만, 입찰참가신청서를 제출하는 때부터 입찰개시 시각전까지 입찰대리인을 지정하거나 입찰대리인을 변경하는 경우에는 그 대리인이 입찰에 참가할 수 있다.③ 제2항에 의한 대리인의 자격은 입찰참가자가 법인인 경우에는 해당 법인의 임ㆍ직원에 한하며, 계약담당공무원은 재직증명서와 다음 각호의 자료에 의해서 임ㆍ직원 여부를 확인하여야 한다. 다만 2개 이상 법인의 임직원인 자는 1개 법인의 대리인으로만 입찰에 참가할 수 있다. 1. 4대 보험 중 어느 하나의 가입 증명자료(최근 3개월 이내) 2. 소속 법인에서 받은 급여와 관련하여 해당 법인에서 발급받은 소득세 납부 증명자료 3. 법인 등기사항증명서 4. 기타 임ㆍ직원 여부를 확인할 수 있는 자료 ④ 시행령 제76조에 의한 부정당업자로 입찰참가자격을 제한받고 있는 자는 제2항에 의한 대리인을 할 수 없다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"입찰서의 작성","text":"제9조(입찰서의 작성) ① 입찰자는 입찰서를 소정의 서식에 의하여 작성하여야 하며, 입찰자는 기명날인을 함에 있어 반드시 입찰자 성명(법인의 경우 대표자 성명)을 기재하고 입찰참가신청서 제출시 신고한 인감(서명을 포함한다. 이하 같다)으로 날인하여야 한다. ② 입찰자는 입찰서(추정가격이 100억원이상인 공사의 입찰에 있어서는 시행령 제14조 제6항에 따른 산출내역서를 포함한다)의 기재사항 중 삭제 또는 정정한 곳이 있을 때에는 입찰에 사용하는 인감으로 날인하여야 한다. ③ 입찰자는 입찰서를 입찰공고 또는 입찰참가통지서 등에 별도로 규정한 경우를 제외하고는 한글로 작성하여야 하고, 입찰금액은 원화로 표기하여야 한다.④ 입찰자는 입찰서의 금액표시를 한글 또는 한자로 기재하여야 하며, 아라비아숫자를 함께 표기할 수 있다. 이 경우에 한글 또는 한자로 기재된 금액과 차이가 있을 때에는 한글 또는 한자로 기재한 금액에 의한다. 다만, 전산서식에 의한 입찰의 경우에는 지정된 표기방법으로 기재하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"입찰서의 제출","text":"제10조(입찰서의 제출) ① 입찰자는 입찰서를 봉함하여 1인 1통만을 제출하여야 한다.② 우편에 의한 입찰서는 입찰서 제출마감일전일까지 발주기관에 도착된 것에 한하여 효력이 있다. 이 경우에 우송중의 분실, 훼손 또는 지연에 대하여 발주기관은 책임을 지지 아니한다.③ 계약담당공무원은 제2항에 의하여 우편으로 입찰서가 제출된 때에는 해당 입찰서의 봉투표면에 접수일시를 기재하고 확인인을 날인하여 개찰 시까지 개봉하지 아니하고 보관하여야 한다.④ 입찰자는 제출한 입찰서를 교환ㆍ변경 또는 취소할 수 없다. 다만, 입찰서에 기재한 중요부분에 오기가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시한 것으로서 계약담당공무원이 이를 인정하는 경우에는 그러하지 아니하다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:10의2","kind":"조문","type":"계약예규","family":"nca","label":"제10조의2","title":"경영상태 심사서류의 제출","text":"제10조의2(경영상태 심사서류의 제출) ① 입찰에 참여하고자 하는 자는 「신용정보의 이용 및 보호에 관한 법률」제2조제8의3호 또는 「자본시장과 금융투자업에 관한 법률」제9조제26항의 업무를 영위하는 신용정보업자로부터 평가받은 모든 공공기관 입찰용 신용평가등급을 해당 신용정보업자를 통해 평가완료 후 3일 이내에 조달청 나라장터에 전송하여야 한다. ② 조달청장은 분기별로 신용정보업자로부터 평가명세서를 제출받아 미전송 여부를 확인하여 해당 업체를 나라장터에 게재하고, 발주기관은 동 업체에 대해 「정부입찰계약집행기준」 제98조에 따라 처리하며, 향후 1년간 시행령 제13조에 따른 입찰참가자격사전심사 및 시행령 제42조제1항에 따른 적격심사시 감점할 수 있다.[본조신설 2012.7.4.]","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:10의3","kind":"조문","type":"계약예규","family":"nca","label":"제10조의3","title":"청렴계약서의 제출","text":"제10조의3(청렴계약서의 제출) 입찰자는 입찰서를 제출할 때 시행령 제4조의2 및 정부입찰ㆍ계약집행기준 제98조의3에 따른 청렴계약서를 같이 제출하여야 한다.[본조신설 2016.1.1.]","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"산출내역서의 제출","text":"제11조(산출내역서의 제출) ① 추정가격이 100억원이상인 공사의 입찰 시에는 입찰서에 산출내역서를 첨부하여야 한다.② 제1항에 규정된 공사로서 제17조제1항에 의하여 재입찰에 부치는 공사 또는 추정가격이 100억원미만인 공사의 경우에 낙찰자는 착공신고서를 제출하는 때까지 산출내역서를 제출하여야 한다.③ 제1항 및 제2항에 의하여 제출하는 산출내역서는 모든 면에 제9조제1항에 의한 인감으로 간인하거나, 모든 면의 하단에 약식서명 또는 천공하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:11의2","kind":"조문","type":"계약예규","family":"nca","label":"제11조의2","title":"일괄 및 대안입찰에서의 건설폐기물처리비","text":"제11조의2(일괄 및 대안입찰에서의 건설폐기물처리비) ① 시행령 제78조에 의한 입찰의 경우에 입찰에 참가하고자 하는 자는 발주기관이 「건설폐기물의 재활용 촉진에 관한 법률」제15조에 따라 건설폐기물처리용역을 해당 건설공사와 분리발주 할 수 있도록 폐기물량을 적정하게 산출하여야 한다.② 제1항에 따라 산출된 폐기물량이 분리발주의 대상이 되는 경우에 그 처리비용은 한국건설자원협회에서 산출한 최근연도 건설폐기물처리단가를 기준으로 산정하여 입찰금액에 계상하되, 계약 체결 시에는 해당 비용을 계약금액에서 공제한다.③ 제1항에 따라 산출된 폐기물량 외에 추가로 발생하는 폐기물에 대해서는 계약상대자가 그 처리비용을 부담한다.[본조신설 2010.11.30.]","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"장기계속공사의 입찰","text":"제12조(장기계속공사의 입찰) 장기계속공사는 입찰 시 총공사를 대상으로 하여 입찰하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"부대입찰","text":"제13조(부대입찰)","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"경쟁입찰의 성립","text":"제14조(경쟁입찰의 성립) 경쟁입찰은 2인이상의 유효한 입찰로써 성립한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"입찰의 무효","text":"제15조(입찰의 무효) 시행규칙 제44조에서 무효로 규정한 입찰 및 다음 각 호의 어느 하나에 해당하는 입찰은 무효로 한다.1. 입찰자(법인인 경우 대표자를 말한다. 이하 같다)가 직접 입찰을 하지 아니하고 대리인을 통하여 입찰을 할 경우에 제8조제2항에 의한 대리인이 아닌 자가 한 입찰 또는 대리권이 없는 자가 한 입찰2. 동일사항에 대하여 타인의 대리를 겸하거나 2인 이상을 대리한 입찰3. 입찰서의 입찰금액 등 중요한 부분이 불분명하거나, 정정한 후 정정날인을 누락한 입찰4. 담합하거나 타인의 경쟁참가를 방해 또는 관계공무원의 공무집행을 방해한 자의 입찰5. 입찰자의 기명날인이 없는 입찰(입찰자의 성명을 기재하지 아니하고 대리인 성명 또는 회사명을 기재한 경우 및 입찰참가신청서 제출시 신고한 인감과 다른 인감으로 날인된 경우도 포함한다)6. 입찰서에 기재한 중요부분에 착오가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시한 것으로서 계약담당공무원이 이를 인정한 입찰7. 시행령 제14조에 의한 내역입찰에 있어서 타인의 산출내역서와 복사 등의 방법으로 동일하게 작성한 산출내역서가 첨부된 입찰(동일한 내용의 산출내역서를 제출한 자 모두 해당) 또는 「정부입찰ㆍ계약집행기준」제9장에서 무효입찰로 규정한 입찰 7의2. 시행령 제14조에 의한 내역입찰에 있어서 정당한 권한이 없는 자의 명의로 기명날인된 산출내역서가 첨부된 입찰 8. 9. 「건설산업기본법령」에 의하여 종합공사를 시공하는 업종을 등록한 건설업자가 도급받아서는 아니되는 공사금액의 하한을 위반한 입찰9의2. 「전기공사업법령」에 의하여 대기업인 전기공사업자가 도급받아서는 아니되는 공사금액의 하한을 위반한 입찰9의3. 「정보통신공사업법령」에 의하여 대기업인 정보통신공사업자가 도급받아서는 아니되는 공사금액의 하한을 위반한 입찰  10. 제9조제1항 및 제4항에 위반하여 소정의 입찰서를 사용하지 않거나 입찰서의 금액을 아라비아 숫자로만 기재한 입찰 또는 전산서식에 의한 입찰서를 훼손하거나 전산표기방법과 상이하게 작성ㆍ기재하여 전산처리가 되지 아니한 입찰11. 공동계약의 공동수급체구성원이 동일 입찰건에 대하여 공동수급체를 중복적으로 결성하여 참여한 입찰, 입찰등록 시 공동수급표준협정서를 제출하지 아니한 입찰, 「공동계약운용요령」 제9조를 위반한 입찰","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"입찰의 연기","text":"제16조(입찰의 연기) ① 발주기관은 다음 각호의 경우에 입찰공고 또는 입찰참가통지서에 기재된 현장설명일시 및 입찰서 제출마감일시를 연기할 수 있다.1. 제5조제2항에 의한 설명요구사항의 내용이 중대하여 연기가 불가피하다고 판단되는 경우2. 기타 불가피한 사유로 인하여 지정된 일시에 현장설명 또는 입찰을 실시하지 못하는 경우② 제1항에 의한 입찰연기의 경우에는 그 연기사유와 기간을 입찰공고의 방법과 동일한 방법으로 공고 또는 통지하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"재입찰 및 재공고입찰","text":"제17조(재입찰 및 재공고입찰) ① 계약담당공무원은 경쟁입찰에서 2인이상의 유효한 입찰자가 없거나 낙찰자가 없는 경우에는 재입찰에 부칠 수 있다. 이 경우에는 최초 입찰에의 참가유무 또는 입찰횟수의 제한을 받지 아니한다. ② 입찰자나 낙찰자가 없는 경우 또는 낙찰자가 계약을 체결하지 아니하는 경우에는 계약담당공무원은 재공고입찰에 부칠 수 있다.③ 제1항 및 제2항에 의하여 재입찰 또는 재공고입찰시 기한을 제외하고는 최초의 입찰에 부칠 때 정한 가격 및 기타조건을 변경할 수 없다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"낙찰자의 결정","text":"제18조(낙찰자의 결정) ① 제15조에 해당되는 사유가 없는 자로서 시행령 제42조등에 정한 낙찰자결정기준에 적합한 자를 낙찰자로 한다.② 계약담당공무원은 개봉된 입찰서를 확인하고 유효한 입찰서의 입찰금액과 예정가격을 대조하여 지체없이 적격자를 낙찰자로 선정하여야 한다. 다만, 시행령 제42조제1항에 따라 계약이행능력을 심사하여 낙찰자를 결정하거나 시행령 제42조제4항에 따라 각 입찰자의 입찰가격과 공사수행능력, 사회적책임 등을 종합적으로 심사하여 낙찰자를 결정하는 등 낙찰자 결정에 장시간이 소요되는 경우에는 그러하지 아니할 수 있다. ③ 계약담당공무원은 제1항 및 제2항에 의하여 낙찰자를 결정하기 전에 해당 입찰자의 입찰서, 법인 등기사항증명서(본사, 대표자 및 상호등 변경여부 확인), 공동수급표준협정서 등 관계서류를 검토하여 해당 낙찰예정자의 입찰이 제15조에 따른 무효입찰에 해당하는지의 여부를 확인하여야 한다. 다만, 일괄입찰, 대안입찰 및 기술제안입찰의 경우에는 입찰자 전원에 대하여 무효입찰 여부를 확인하여야 한다. ④ 계약담당공무원은 낙찰이 될 수 있는 동일가격으로 입찰한 자가 2인이상인 때에는 다음 각 호에 따라 낙찰자를 결정한다.1. 시행령 제42조제1항에 따라 낙찰자를 결정하는 경우 : 이행능력 심사결과 최고점수인 자를 낙찰자로 결정하되, 이행능력 심사결과도 동일한 경우에는 추첨에 의하여 낙찰자를 결정2. 시행령 제42조제4항에 따라 낙찰자를 결정하는 경우 : 종합심사점수가 최고점자인 자를 낙찰자로 결정하되, 최고점자가 2인이상인 경우에는 다음 순서에 의하여 낙찰자를 결정 가. 공사수행능력점수와 사회적책임점수의 합산점수(사회적책임점수는 공사수행능력점수의 배점한도내에서 가산한다)가 높은 자나. 입찰금액이 균형가격에 근접한 자. 다만, 균형가격이 예정가격의 100분의 88 이상인 경우 입찰금액이 낮은 자  다. 공사수행능력점수가 높은 자  라. 사회적책임점수가 높은 자  마. 입찰공고일을 기준으로 최근 1년간 종합심사낙찰제로 낙찰받은 계약금액이 적은 자 바. 추첨 ⑤ 제4항의 경우에 입찰자중 출석을 하지 아니한 자 또는 추첨을 하지 아니한 자가 있을 때에는 입찰사무에 관계없는 공무원으로 하여금 추첨을 대신하게 할 수 있다.⑥ 계약담당공무원은 낙찰자로 결정된 자가 계약체결 이전에 입찰무효 등 부적격자로 판명되어 낙찰자 결정이 취소된 경우로서 동 부적격자를 제외하고 2인이상 유효한 입찰이 성립되어 있는 때에는 차순위자 순으로 필요한 심사 등을 실시하여 낙찰자를 결정한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"계약의 체결","text":"제19조(계약의 체결) ① 낙찰자는 계약담당공무원으로부터 낙찰통지를 받은 후 10일이내에 소정서식의 계약서에 의하여 계약을 체결하여야 한다. 다만, 일반조건에 정한 불가항력의 사유로 인하여 계약을 체결할 수 없는 경우에는 불가항력의 사유가 존속하는 기간은 이를 산입하지 아니한다.② 제1항에 의하여 발주기관과 계약을 체결하고자 하는 자는 관계법령에 의하여 필요한 관계서류를 계약담당공무원에게 제출하여야 한다.③ 계약담당공무원은 낙찰자로 결정된 자가 정당한 이유없이 제1항에 의한 계약을 체결하지 아니한 때에는 낙찰을 취소할 수 있다.④ 장기계속공사계약의 경우에 낙찰자는 총공사낙찰금액을 부기하고 해당연도 예산의 범위안에서 제1차공사에 대하여 계약을 체결하여야 한다. 이 경우에 제2차공사 이후의 계약은 총공사낙찰금액(시행령 제64조 내지 제66조에 의한 계약금액의 조정이 있는 경우에는 조정된 총공사금액을 말한다)에서 이미 계약된 금액을 공제한 금액의 범위안에서 계약을 체결할 것을 부관(附款)으로 약정하여야 한다.⑤ 제4항에 의한 제1차공사 및 제2차공사 이후의 계약금액은 총공사의 계약단가에 의한다. 이 경우에 계약금액조정 등으로 인하여 산출내역서의 단가가 조정된 경우에는 조정된 계약단가에 의한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"계약의 성립","text":"제20조(계약의 성립) 계약담당공무원과 낙찰자가 계약서에 기명ㆍ날인(외국인에 대하여 서명을 허용한 경우에는 서명을 포함한다)함으로써 계약은 확정된다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"계약의 이행보증","text":"제21조(계약의 이행보증) ① 낙찰자는 계약체결일까지 시행령 제50조 및 시행령 제52조가 정하는 바에 따라 계약이행보증을 하여야 한다.② 제7조에 의한 입찰보증금은 계약보증금으로 대체할 수 있다. 다만, 입찰보증금과 계약보증금과의 금액에 차이가 있는 경우에 그 차액을 추가로 납부하여야 한다.③ 시행령 제52조에 의한 보증이행업체는 다음 각호에 해당하는 자격을 갖추고 있어야 하며, 계약담당공무원은 보증이행업체의 적격여부를 심사하기 위하여 낙찰자에게 관련자료의 제출을 요구할 수 있다. 1. 「독점규제 및 공정거래에 관한 법률」에 의한 계열회사가 아닌 자2. 시행령 제76조에 의한 입찰참가자격 제한을 받고 그 제한기간 중에 있지 아니한 자3. 시행령 제36조에 의한 입찰공고등에서 정한 입찰참가자격과 동등이상의 자격을 갖춘자4. 시행령 제13조에 의한 입찰의 경우에는 입찰참가자격 사전 심사기준에 따른 입찰참가에 필요한 종합평점이상이 되는 자④ 계약담당공무원은 제1항에 의하여 보증이행업체의 적격여부심사 결과 부적격하다고 인정되는 때에는 낙찰자에게 보증이행업체의 변경을 요구할 수 있다. ⑤ 시행령 제52조제1항제3호에 의한 공사이행보증서의 제출 및 보증기관의 보증이행등에 대하여는 제1항 내지 제4항외에 계약예규 「정부 입찰ㆍ계약 집행기준」 제13장(공사의 이행보증제도 운용)에 정한 바에 의한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"부정당업자의 입찰참가자격 제한","text":"제22조(부정당업자의 입찰참가자격 제한) ① 입찰자 또는 낙찰자가 「국가를 당사자로 하는 계약에 관한 법률」제27조 및 시행령 제76조 해당하는 경우에는 1월 이상 2년 이하의 범위 내에서 입찰참가자격 제한조치를 받게 된다. ② 낙찰자가 제21조제1항에 규정한 공사이행보증서 제출의무가 있는 경우 정당한 이유없이 기한내에 이를 제출하지 못하여 계약을 체결하지 못한 경우에도 제1항이 적용된다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"비밀유지의 의무","text":"제23조(비밀유지의 의무) 입찰자는 발주기관으로부터 배부받은 입찰에 관한 사유 또는 각종 자료 및 입찰과정에서 얻은 정보를 해당 입찰외의 목적으로 사용하여서는 아니된다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:24","kind":"조문","type":"계약예규","family":"nca","label":"제24조","title":"이의신청","text":"제24조(이의신청) 추정가격 30억원 이상인「건설산업기본법」에 따른 종합공사, 추정가격 3억원 이상인 「건설산업기본법」에 따른 전문공사, 추정가격 3억원 이상인 그 밖의 공사의 입찰에 있어 다음 각호의 어느 하나의 사유로 인하여 불이익을 받았다고 인정되는 자는 「국가를 당사자로 하는 계약에 관한 법률」(이하 \"법\"이라 한다) 제28조제2항 및 제4항에서 정한 바에 따라 이의신청을 할 수 있다. 1. 법 제28조제1항 각호의 어느 하나에 정한 사유2. 특례규정 제26조에서 정한 사유","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:25","kind":"조문","type":"계약예규","family":"nca","label":"제25조","title":"기타사항","text":"제25조(기타사항) 입찰공고조건 및 기타 이 유의서에 규정되지 아니한 사항에 대하여는 발주기관이 별도로 정하는 바에 의한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-bid:26","kind":"조문","type":"계약예규","family":"nca","label":"제26조","title":"재검토기한","text":"제26조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-gongsa-bid","group":"공사입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-gongsa-js","kind":"법령","type":"계약예규","family":"nca","label":"공사종합심사기준","name":"(계약예규) 공사계약 종합심사낙찰제 심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제42조제4항제1호 및 제2호에 의한 낙찰자 결정시의 심사방법ㆍ항목ㆍ배점한도 등 심사기준과 각 중앙관서의 장 또는 계약담당공무원이 준수하여야 할 사항을 정함을 목적으로 한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 예규에서 사용하는 용어의 정의는 다음과 같다.1. \"전자조달시스템\"이란 시행령 제13조제4항에 따른 전자조달시스템을 말한다.2. \"심사위원회\"란 제12조에 따른 물량심사 및 시공계획심사를 위하여 시행령 제42조제7항에 따라 구성한 위원회를 말한다.3. \"세부공종\"이란 물량내역서 및 산출내역서에 물량 및 단위가 표시된 최소단위 공종을 말한다.4. \"균형가격\"이란 입찰금액을 평가하기 위한 기준으로, 제8조에 따라 산정한 금액을 말한다5. \"균형단가\"는 제8조의 규정에 따른 균형가격 산정방법과 동일한 방법으로 세부공종별로 산정한 단가를 말한다.6. \"추정물량\"이란 발주기관이 입찰공고시 제공한 물량내역서의 물량으로 입찰자의 산출내역서 작성을 돕기 위해 제시한 물량을 말한다.7. \"입찰물량\"이란 입찰자가 발주기관이 제시한 설계서, 물량내역서의 추정물량 등을 참고하여 작성한 산출내역서 상의 물량을 말한다.8. \"최종물량\"이란 산출내역서의 입찰물량 적정성을 판단하기 위하여 발주기관에서 확정한 물량을 말한다.9. \"시공비율\"이란 공동수급협정서상의 각 구성원의 공사참여지분율에 시공능력평가액을 한도로 하여 산정한 비율을 말한다.10. \"상호시장 진출 허용 공사\"란 국토교통부 고시 「건설공사 발주 세부기준」제6조 및 제7조에 따라 시공자격을 갖춘 건설사업자의 입찰참가를 허용하는 공사를 말한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"심사기준","text":"제3조(심사기준) ① 시행령 제42조제4항제1호 및 제2호에 따른 심사(이하 \"종합심사낙찰제\"라 한다)는 공사의 규모 및 난이도에 따라 다음 각호의 심사기준에 따라 실시한다. 1. 발주기관이 물량ㆍ시공계획을 심사할 필요가 있다고 인정하는 고난이도 공사(이하 이 예규에서 \"고난이도 공사\"라고 한다): 제10조 내지 제13조, [별표1-2], [별표2] 내지 [별표4]2. 시행령 제42조제4항의 공사 중 추정가격 300억원 이상이면서 제1호에 해당하지 않는 공사(이하 이 예규에서 \"일반공사\"라고 한다): 제10조 내지 제13조, [별표1-1], [별표2] 내지 [별표4]  3. 시행령 제42조제4항의 공사 중 추정가격 300억원 미만이면서 제1호에 해당하지 않는 공사(이하 이 예규에서 \"간이형 공사\"라고 한다): 제10조 내지 제13조, [별표1-3], [별표2] 내지 [별표4]  ② 제1항에도 불구하고 시행령 제42조제4항제2호의 공사는 국가유산청장이 재정경제부장관의 승인을 받아 절차 및 심사기준을 정할 수 있다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"세부심사기준의 작성","text":"제4조(세부심사기준의 작성) ① 각 중앙관서의 장 또는 계약담당공무원은 제3조제1항의 심사기준에 대한 세부심사기준을 정할 때에는 이 예규에 규정된 바에 따라 낙찰자가 선정될 수 있도록 하되, 다음 각 호의 사항을 포함하여야 한다.1. 하도급계획서 작성 및 제출방법2. 물량산출근거ㆍ시공계획서 작성 및 제출방법(고난이도 공사에 한한다)3. 기타 이 예규에서 세부심사기준으로 정하도록 한 사항② 각 중앙관서의 장 또는 계약담당공무원은 제1항에도 불구하고 공사의 특성ㆍ내용 및 당해 공사가 속한 시장상황 등을 고려할 때 필요하다고 인정할 경우에는 재정경제부장관과 협의하여 [별표1] 내지 [별표4]의 심사항목에 대한 배점한도를 가ㆍ감 조정하거나 심사항목을 추가 또는 제외할 수 있다.③ 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 세부심사기준을 정함에 있어 관련 기관 및 협회 등에서 전기ㆍ정보통신ㆍ소방 등 기타공사 또는 「건설산업기본법」 제2조제6호에 따른 전문공사에 대한 통계 등 평가 기초자료를 수집ㆍ작성하지 아니하는 경우에는 제2항에도 불구하고 해당공사에 대하여 배점한도를 적용하거나 평가에서 제외하게 할 수 있다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"입찰공고","text":"제5조(입찰공고) 각 중앙관서의 장 또는 계약담당공무원은 입찰공고에 다음 각 호의 사항을 명시하여야 한다.1. 종합심사낙찰제 적용 대상이라는 점2. 종합심사기준 열람에 관한 사항, 심사에 필요한 서류와 제출기한 등3. 하도급계획서를 작성하여 제출한 경우에는 하도급계획서에 따라 하도급계약을 체결할 의무가 부여됨과 불이행 시 차기 입찰에서 받을 불이익4. 배치기술자 시공경력 평가시 제출한 계획서(배치 예정 기술자 목록 등)에 따라 이행할 의무가 부여됨과 동시에 불이행시 차기 입찰에서 받을 불이익5. 시공계획 심사시 제출한 계획서에 따라 이행할 의무가 부여됨과 동시에 불이행시 차기 입찰에서 받을 불이익6. 우선순위 시공계획 및 물량심사대상자의 수 및 심사절차(단, 고난이도 공사에 한한다)7. 「국가를 당사자로 하는 계약에 관한 법률」(이하 \"법\"이라 한다) 제5조의2에 따른 청렴계약서의 내용 및 청렴계약 위반시 받을 계약의 해제ㆍ해지, 입찰참가자격 제한 등8. 법령, 행정규칙 등에서 입찰공고에 명시하도록 정한 사항","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"현장설명시 교부서류","text":"제6조(현장설명시 교부서류) ① 각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 서류를 해당 공사 현장설명에 참가하는 자에게 교부하여야 한다.1. 산출내역서 작성방법 및 하도급계획서 작성방법2. 물량산출근거, 시공계획서 작성방법(단, 고난이도 공사에 한한다)3. 설계도면, 물량내역서(단, 순수내역입찰로 발주하는 공사에 대하여는 물량내역서를 교부하지 아니한다) 4. 입찰금액 산정에 참고가 되는 자료 5. 표준시장단가를 적용한 세부공종 및 표준시장단가6. 세부심사기준7. 그 밖의 참고사항을 기재한 서류② 각 중앙관서의 장 또는 계약담당공무원은 현장설명을 실시하지 아니하거나 현장설명을 실시하는 경우라도 필요하다고 인정되는 때에는 전자조달시스템에 제1항 각 호의 서류를 게재함으로써 입찰에 참가하고자 하는 자에 대한 교부를 갈음할 수 있다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"입찰서 등의 제출","text":"제7조(입찰서 등의 제출) ① 각 중앙관서의 장 또는 계약담당공무원은 입찰자로 하여금 입찰시 다음 각 호의 서류를 제출하게 하여야 한다. 다만, 제3호는 제10조에 따른 종합심사점수가 최고점인자에 한하여 제출하게 할 수 있으며 제5호는 고난이도 공사에 한하여 제출하게 하여야 한다. 1. 입찰서2. 제6조제1항제1호에 따라 교부한 산출내역서 작성방법에 따른 산출내역서3. 제6조제1항제1호에 따라 교부한 하도급계획서 작성방법에 따른 하도급계획서 4. 심사를 위해 입찰공고에서 발주기관이 요구한 자료. 다만, 배치기술자 심사관련 서류의 제출일은 최초의 종합 심사서류 제출요구일로부터 15일 이후로서 중앙관서의 장 또는 계약담당공무원이 별도로 지정한 날까지 제출하도록 하여야 한다. 5. 제12조에 따른 심사를 위해 발주기관이 요구한 자료② 각 중앙관서의 장 또는 계약담당공무원은 제6조제1항제2호에 따라 교부한 물량산출근거 작성방법에 따른 입찰자의 물량산출근거 및 시공계획서 작성방법에 따른 시공계획서는 제11조에 따라 물량ㆍ시공계획 심사대상자로 선정된 자에 한하여 제출하게 하여야 하며, 입찰자는 선정 통보를 받은 날부터 15일 이내에 발주기관에 물량산출근거 등을 제출하여야 한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"균형가격 산정","text":"제8조(균형가격 산정) ① 균형가격을 산정하는데 있어서 다음 각 호의 어느 하나에 해당하는 입찰금액은 제외한다.1. 입찰서상의 금액과 산출내역서상의 금액이 일치하지 아니한 입찰인 경우2. 입찰금액이 예정가격보다 높거나 예정가격의 100분의 70 미만인 경우3. 이윤 또는 세부공종에 음(-)의 입찰금액이 있는 경우. 다만 발주기관의 금액이 음(-)의 금액인 경우에는 제외한다.4. 항목별 입찰금액의 합계가 발주기관이 지정하여 투찰하도록 하거나 해당법령에서 정해진 금액 또는 비율에 의하여 산출한 금액의 합계의 1000분의 997 미만인 경우(다만, 국민건강보험료, 국민연금보험료, 노인장기요양보험료는 발주기관이 반영하도록 한 금액보다 낮은 경우) 5. 발주기관이 작성한 내역서상 세부공종에 표준시장단가가 적용된 경우로서 세부공종별 입찰금액이 발주기관 내역서상 세부공종별 금액의 1000분의 997미만인 경우 6. 입찰자의 산출내역서상 직접노무비가 발주기관이 작성한 내역서상 직접노무비의 100분의 80 미만인 경우 7. 기타 발주기관의 세부 심사기준에서 제외토록 명시한 경우② 제1항에 해당하는 입찰금액을 제외한 입찰금액의 상위 100분의 20이상과 하위 100분의 20이하에 해당하는 입찰금액을 제외한 입찰금액을 산술평균하여 균형가격을 산정한다. 다만, 제1항에 해당하는 입찰금액을 제외한 입찰금액이 10개 미만인 경우에는 상위 100분의 50이상과 최하위 1개의 입찰서를 제외하고, 제1항에 해당하는 입찰금액을 제외한 입찰금액이 10개 이상 20개 이내인 경우에는 상위 100분의 40이상과 하위 100분의 10이하를 제외한다.\n제2장  종합심사 방법","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"심사서류의 보완","text":"제9조(심사서류의 보완) ① 각 중앙관서의 장 또는 계약담당공무원은 제7조에 따라 입찰시 제출된 산출내역서, 하도급계획서 등의 내용이 불명확하여 인지할 수 없는 경우에는 기한을 정하여 보완을 요구할 수 있다. 다만, 제7조제1항제3호에 따른 하도급계획서 등의 서류 미비 및 오류에 대하여는 1회에 한하여 보완하게 할 수 있다. ② 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따른 기한까지 보완을 요구한 서류가 제출되지 아니한 경우 당초 제출된 서류만으로 심사하되, 당초 제출된 서류가 불명확하여 심사하기가 곤란한 경우에는 심사에서 제외할 수 있다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"종합심사 점수 산정","text":"제10조(종합심사 점수 산정) ① 간이형 공사는 공사수행능력점수(경영상태점수 포함), 사회적 책임점수(공사수행능력점수의 배점한도 내에서 가산한다), 입찰금액점수(단가 심사점수 및 하도급 계획 심사점수 포함) 및 계약신뢰도 점수를 합산하여 종합심사 점수를 산정한다. ② 일반공사는 공사수행능력점수, 사회적 책임점수(공사수행능력점수의 배점한도 내에서 가산한다), 입찰금액점수(단가 심사점수 및 하도급 계획 심사점수 포함) 및 계약신뢰도 점수를 합산하여 종합심사 점수를 산정한다.③ 고난이도 공사는 공사수행능력점수, 사회적 책임점수(공사수행능력점수의 배점한도 내에서 가산한다), 입찰금액점수(단가 심사점수, 하도급계획 심사점수, 물량심사점수 및 시공계획 심사점수 포함) 및 계약신뢰도 점수를 합산하여 종합심사 점수를 산정한다.④ 제1항부터 제3항에 따라 종합심사 점수를 산정할 때 제8조제1항에 해당하는 입찰자는 종합심사 점수를 산정하지 아니하며 낙찰자에서 배제한다. ⑤ 제1항부터 제3항에도 불구하고 각 중앙관서의 장 또는 계약담당공무원은 하도급계획 심사는 하도급 계획을 제외한 종합심사점수가 최고점인 자부터 순차적으로 심사할 수 있다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"물량 및 시공계획 심사대상자 선정","text":"제11조(물량 및 시공계획 심사대상자 선정) 각 중앙관서의 장 또는 계약담당공무원은 고난이도 공사에 대하여 제10조제1항 및 제5항에 따라 점수를 산정한 후 물량ㆍ시공계획 점수를 제외한 점수가 최고점 순으로 입찰공고에서 정하는 일정한 수의 업체를 우선순위 물량심사 및 시공계획심사 대상자로 선정한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"물량 및 시공계획 심사","text":"제12조(물량 및 시공계획 심사) ① 각 중앙관서의 장 또는 계약담당공무원은 제11조에 따라 우선순위 물량ㆍ시공계획의 심사대상자로 선정된 자에 한하여 물량 및 시공계획을 심사한다.② 각 중앙관서의 장 또는 계약담당공무원이 물량심사를 함에 있어서는 세부공종별로 물량의 적정성을 심사하여야 하며, 심사할 세부공종을 다음 각 호와 같이 정할 수 있다. 다만, 심사할 세부공종을 정할 경우 제1호는 반드시 포함하여야 한다.1. 해당 공사의 규모 및 중요도 등에 따라 물량심사 대상으로 입찰공고에 명시한 세부공종2. 동일한 세부공종에서 발주기관이 작성한 추정물량, 심사대상자가 작성한 입찰물량 및 다른 입찰참가자가 작성한 입찰물량 상호간 격차가  큰 세부공종3. 기타 입찰공고에 명시한 기준에 해당하는 세부공종③ 각 중앙관서의 장 또는 계약담당공무원은 제14조에 따른 심사위원회에서 물량ㆍ시공계획을 심사하여야 한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"낙찰자 결정","text":"제13조(낙찰자 결정) ① 제10조의 종합심사 점수가 최고점인 자를 낙찰자로 결정한다. 다만, 고난이도 공사의 경우에는 우선순위 물량ㆍ시공계획 심사대상자 중 1인 이상이 제10조제2항 및 제4항에 따른 종합심사 점수가 차순위 물량ㆍ시공계획 심사대상자의 제10조제1항 및 제4항에 따른 종합심사 점수를 초과하는 경우에는 차순위자의 물량ㆍ시공계획 심사 없이도 우선순위 물량ㆍ시공계획 심사대상자를 대상으로 낙찰자를 결정할 수 있다.② 종합심사 점수가 최고점인 자가 둘 이상인 경우에는 다음 각 호의 순으로 낙찰자를 결정한다.1. 공사수행능력점수와 사회적책임점수의 합산점수(사회적책임점수는 공사수행능력점수의 배점한도내에서 가산한다)가 높은 자2. 입찰금액이 균형가격에 근접한 자, 다만, 균형가격이 예정가격의 100분의 88 이상인 경우에는 입찰금액이 낮은 자 가. 삭제 나. 삭제 3. 공사수행능력점수가 높은 자 4. 사회적책임점수가 높은 자 5. 입찰공고일을 기준으로 최근 1년간 종합심사낙찰제로 낙찰받은 계약금액(공동수급체로 낙찰받은 경우에는 전체 공사부분에 대한 지분율을 적용한 금액을 말한다)이 적은 자 6. 추첨 ③ 제1항 및 제2항에도 불구하고 예정가격이 100억원 미만인 공사의 경우에는 입찰가격을 예정가격 중 다음 각 호에 해당하는 금액의 합계액의 100분의 98 미만으로 입찰한 자는 낙찰자에서 제외한다.1. 재료비ㆍ노무비ㆍ경비2. 제1호에 대한 부가가치세④ 각 중앙관서의 장 또는 계약담당공무원은 제1항 또는 제2항의 규정에 의하여 낙찰자를 결정한 경우 해당자에게 지체없이 통보하여야 한다.\n제3장  기타","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"위원회 구성","text":"제14조(위원회 구성) 각 중앙관서의 장 또는 계약담당공무원은 제12조에 따른 심사를 실시하는 공사에 대하여는 시행령 제42조제7항에 따른 위원회의 심의를 거쳐 낙찰자를 결정하여야 한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"결격사유 등","text":"제15조(결격사유 등) ① 입찰자가 부도, 파산, 해산, 부정당업자 제재, 영업정지(건설업 등의 등록말소ㆍ취소 포함), 입찰무효 등 상태에 있는 경우에는 심사대상에서 제외(이하 이 조에서 \"결격사유\"라 한다)한다.② 공동수급체를 구성하여 입찰에 참가한 경우로서 공동수급체의 일부 구성원에 결격사유가 있는 경우에는 해당 구성원을 제외하고 잔존 구성원의 시공비율 또는 분담내용을 변경하거나 결격사유가 발생한 구성원을 대신할 새로운 구성원을 추가하도록 하여 재심사한다. 다만, 공동수급체 대표자에게 결격사유가 있는 경우에는 해당 공동수급체 전체를 심사대상에서 제외한다. ③ 제1항 및 제2항의 해석에 있어 부도 및 파산의 경우로서 「채무자회생 및 파산에 관한 법률」에 따라 법원으로부터 기업회생절차개시결정을 받고 정상적인 금융거래의 재개를 확인할 수 있는 서류를 제출하는 경우에는 결격사유로 보지 아니한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"부정한 방법으로 심사서류를 제출한 자 등에 대한 처리","text":"제16조(부정한 방법으로 심사서류를 제출한 자 등에 대한 처리) ① 각 중앙관서의 장 또는 계약담당공무원은 제7조에 따라 제출된 서류가 위조, 변조, 부정 또는 허위로 작성된 것으로 판명된 때에는 다음 각 호와 같이 처리하여야 한다.1. 계약체결 이전인 경우에는 낙찰자 결정대상에서 제외 또는 결정 통보를 취소한다.2. 계약체결 이후인 경우에는 해당 계약을 해제 또는 해지할 수 있다.② 각 중앙관서의 장 또는 계약담당공무원은 제1항에 해당하는 자에 대하여 시행령 제76조에 의한 입찰참가자격 제한조치를 하여야 한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"입찰결과의 공개 등","text":"제17조(입찰결과의 공개 등) 각 중앙관서의 장 또는 계약담당공무원은 개찰 후 즉시 입찰참가업체별 입찰금액을 전자조달시스템 또는 발주기관의 정보처리장치를 통하여 공개하여야 하며, 「독점규제 및 공정거래에 관한 법률」제19조의2의 규정 등에 따라 입찰관련정보를 공정거래위원회에 제출하여야 한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"설계변경에 의한 계약금액조정의 제한","text":"제18조(설계변경에 의한 계약금액조정의 제한) 각 중앙관서의 장 또는 계약담당공무원은 고난이도 공사(발주기관이 물량내역수정을 허용한 공종에 한한다)에 대하여는 물량내역서의 누락사항이나 오류 등으로 설계를 변경하는 경우에도 그 계약금액을 증액할 수 없다.\n제4장  보칙","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-js:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"재검토기한","text":"제19조(재검토기한) 이 예규는「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월1일을 기준으로 매3년이 되는 시점(매3년째의 12월31까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-gongsa-js","group":"공사종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-mulpum-gen","kind":"법령","type":"계약예규","family":"nca","label":"물품구매계약일반조건","name":"(계약예규) 물품구매(제조)계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"총칙","text":"제1조(총칙) 계약담당공무원과 계약상대자는 물품구매표준계약서(이하 \"계약서\"라 한다)에 기재한 물품의 구매(\"제조\"를 포함한다. 이하 같다) 계약에 관하여 제3조에 의한 계약문서에서 정하는 바에 따라 신의와 성실의 원칙에 입각하여 이를 이행한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 조건에서 사용하는 용어의 정의는 다음과 같다.1. \"계약담당공무원\"이라 함은 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」(이하 \"시행규칙\"이라 한다) 제2조에 의한 공무원을 말한다. 이 경우 각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하거나 직접 처리하는 경우에는 이를 계약담당공무원으로 본다.2. \"계약상대자\"라 함은 정부와 물품구매계약을 체결한 자연인 또는 법인을 말한다.3. ‘규격서’라 함은 물품에 대한 기술적인 요구사항과 요구 필요조건의 일치성 여부를 판단하기 위한 절차와 방법을 포함하여 서술한 문서로, 제품의 성능, 재료형상, 치수, 용적, 색채, 제조, 포장 및 검사방법 등을 포함한다. 4. ‘산출내역서’라 함은 입찰금액 또는 계약금액을 구성하는 물량, 규격, 단위, 단가 등을 기재한  명세서를 말한다. 5. 이 조건에서 정한 용어를 제외하고는 「국가를 당사자로 하는 계약에 관한 법률 시행령」, 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」(이하 각각 \"시행령, 특례규정\"이라 한다), 시행규칙 및 계약예규 물품구매(제조)입찰유의서(이하 \"유의서\"라 한다)에 정하는 바에 의한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"계약문서","text":"제3조(계약문서) ① 계약문서는 계약서, 규격서, 유의서, 물품구매(제조)계약일반조건, 물품구매(제조)계약특수조건 및 산출내역서 등으로 구성되며 상호보완의 효력을 갖는다. 다만, 이 경우 산출내역서는 계약금액의 조정 및 기성부분에 대한 대가의 지급시에 적용할 기준으로서 계약문서의 효력을 갖는다. ② 계약담당공무원은 「국가를 당사자로 하는 계약에 관한 법령」, 물품구매(제조)와 관련된  법령 및 이 조건에 정한 계약일반사항 외에 해당 계약의 적정한 이행을 위하여 필요한 경우 물품구매계약 특수조건을 정하여 계약을 체결할 수 있다.③ 제2항에 따라 정한 물품구매계약 특수조건에 「국가를 당사자로 하는 계약에 관한 법령」, 물품구매(제조)와 관련된 법령 및 이 조건에 반하여 계약상대자의 계약상 이익을 제한하는 내용이 있는 경우 특수조건의 동 내용은 효력이 인정되지 아니한다. ④ 이 조건이 정하는 바에 의하여 계약당사자간에 행한 통지문서등은 계약문서로서의 효력을 가진다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"사용언어","text":"제4조(사용언어) ① 계약을 이행함에 있어서 사용하는 언어는 한국어를 원칙으로 한다. ② 계약담당공무원은 계약체결시 제1항에도 불구하고 필요하다고 인정하는 경우에는 계약이행과 관련하여 계약상대자가 외국어를 사용하거나 외국어와 한국어를 병행하여 사용할 수 있도록 필요한 조치를 할 수 있다.③ 제2항에 의하여 외국어와 한국어를 병행하여 사용한 경우에 외국어로 기재된 사항이 한국어와 상이한 경우에는 한국어로 기재한 사항이 우선한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"통지 등","text":"제5조(통지 등) ① 구두에 의한 통지ㆍ신청ㆍ청구ㆍ요구ㆍ회신ㆍ승인 또는 지시 등(이하 \"통지 등\"이라 한다)은 문서로 보완되어야 효력이 있다.② 통지 등의 장소는 계약서에 기재된 주소로 하며, 주소를 변경하는 경우에는 이를 즉시 계약당사자에게 통지하여야 한다.③ 통지 등의 효력은 계약문서에서 따로 정하는 경우를 제외하고는 계약당사자에게 도달한 날부터 발생한다. 이 경우 도달일이 공휴일인 경우에는 그 다음 날부터 효력이 발생한다.④ 계약상대자는 계약이행중 관계법령 및 이 조건 등에 정한 바에 따라 서면으로 정당한 요구를 받은 경우에는 이를 성실히 검토하여 회신하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"채권양도","text":"제6조(채권양도) ① 계약상대자는 이 계약에 의하여 발생한 채권(대금청구권)을 제3자(공동수급체 구성원 포함)에게 양도할 수 있다. ② 계약담당공무원은 제1항에 의한 채권양도와 관련하여 적정한 계약이행목적 등 필요한 경우에는 채권양도를 제한하는 특약을 정하여 운용할 수 있다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"계약보증금","text":"제7조(계약보증금) ① 계약을 체결하고자 하는 자는 계약체결일까지 시행령 제50조에 정한 바에 따라 시행령 제37조제2항에 규정된 현금 또는 보증서 등으로 계약보증금을 납부하여야 한다.② 계약을 체결하고자 하는 자가 계약보증금의 전부 또는 일부의 납부를 면제받은 경우에는 제8조제1항 및 제2항에 의하여 국고귀속사유가 발생할 때에 계약보증금에 해당하는 금액을 현금으로 납입할 것을 보장하기 위하여 그 지급을 확약하는 내용의 문서(이하 \"계약보증금지급각서\"라 한다)를 제출하여야 한다.③ 계약담당공무원은 단가계약에 의하는 경우로서 수회에 걸쳐 분할하여 계약을 이행하게 하는 때에는 매회별 이행예정량중 최대량에 계약단가를 곱한 금액의 100분의 10 상당금액이상을 계약보증금으로 납부하게 할 수 있다.④ 계약담당공무원은 시행령 제37조제2항제2호에 의한 유가증권이나 현금으로 납부된 계약보증금을 계약상대자가 특별한 사유로 시행령 제37조제2항제1호 내지 제5호에 규정된 보증서 등으로 대체납부할 것을 요청한 때에는 동가치 상당액 이상으로 대체납부하게 할 수 있다.⑤ 계약상대자는 이 조건에 의하여 계약금액이 증액된 경우에는 이에 상응하는 금액의 계약보증금을 제1항에 따라 추가로 납부하여야 하며, 계약담당공무원은 계약금액이 감액된 경우에는 이에 상응하는 금액의 계약보증금을 반환해야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"계약보증금의 처리","text":"제8조(계약보증금의 처리) ① 계약담당공무원은 계약상대자가 정당한 이유없이 계약상의 의무를 이행하지 아니할 때에는 계약보증금을 국고에 귀속한다.② 시행령 제69조에 의한 장기물품제조계약에 있어서 계약상대자가 2차 이후의 물품제조계약을 체결하지 아니한 경우에 제1항을 준용한다.③ 제7조제2항에 의하여 계약보증금지급각서를 제출한 경우로서 계약보증금의 국고귀속사유가 발생하여 계약담당공무원의 납입요청이 있을 때에는 계약상대자는 해당 계약보증금을 지체없이 현금으로 납부하여야 한다.④ 제1항 및 제2항에 의하여 계약보증금을 국고에 귀속함에 있어서 그 계약보증금은 이를 기성 또는 기납부분에 대한 미지급액과 상계 처리할 수 없다. 다만, 계약보증금의 전부 또는 일부를 면제받은 자의 경우에는 국고에 귀속되는 계약보증금과 기납부분에 대한 미지급액을 상계 처리할 수 있다.⑤ 계약상대자가 납부한 계약보증금은 계약이 이행된 후에 계약상대자의 청구에 의하여 반환한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"수량변경","text":"제9조(수량변경) 계약담당공무원은 필요에 따라 계약된 물품의 수량을 100분의 10 범위내에서 변경할 수 있다. 다만, 계약담당공무원이 해당 물품의 수급상황 등을 고려하여 부득이하다고 판단하는 경우 계약상대자의 동의를 얻어 100분의 10 범위를 초과하여 계약수량을 변경시킬 수 있다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"계약이행상의 감독","text":"제10조(계약이행상의 감독) ① 계약담당공무원은 계약의 적정한 이행을 확보하기 위하여 필요하다고 인정하는 경우에는 물품의 제조를 위하여 사용하는 재료 및 기타 제조공정에 대하여 감독할 수 있으며 계약상대자에 대하여 필요한 조치를 요구할 수 있다.② 계약상대자는 발주기관의 감독업무수행에 협력하여야 하며, 발주기관은 감독업무를 수행함에 있어서 계약상대자의 업무를 부당하게 방해하여서는 아니된다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"물가변동으로 인한 계약금액의 조정","text":"제11조(물가변동으로 인한 계약금액의 조정) ① 물가변동으로 인한 계약금액의 조정은 시행령 제64조 및 시행규칙 제74조에서 정한 바에 의한다.② 동일한 계약에 대한 계약금액의 조정시 품목조정율 및 지수조정율을 동시에 적용하여서는 아니되며, 계약을 체결할 때에 계약상대자가 지수조정율 방법을 원하는 경우 외에는 품목조정율 방법으로 계약금액을 조정하도록 계약서에 명시하여야 한다. 이 경우 계약이행중 계약서에 명시된 계약금액 조정방법을 임의로 변경하여서는 아니된다.③ 제1항에 의하여 계약금액을 증액하는 경우에는 계약상대자의 청구에 의하여야 하고, 계약상대자는 제22조에 의한 완납대가(장기계속계약의 경우에는 각 차수별 완납대가) 수령전까지 조정신청을 하여야 조정금액을 지급받을 수 있으며, 조정된 계약금액은 직전의 물가변동으로 인한 계약금액조정기준일부터 90일 이내에 이를 다시 조정할 수 없다. 다만, 천재ㆍ지변 또는 원자재의 가격급등으로 해당 기간내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 인정되는 경우에는 계약을 체결한 날 또는 직전 조정기준일로부터 90일이내에도 계약금액을 조정할 수 있다.④ 계약상대자는 제3항에 의하여 계약금액의 증액을 청구하는 경우에는 계약금액조정내역서를 첨부하여야 한다.⑤ 발주기관은 제1항 내지 제4항에 의하여 계약금액을 증액하는 경우에는 계약상대자의 청구를 받은 날부터 20일 이내에 계약금액을 조정하여야 한다. 이 경우 예산배정의 지연 등 불가피한 사유가 있는 경우에는 계약상대자와 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 증액할 수 있는 예산이 없는 때에는 제조량 등을 조정하여 그 대가를 지급할 수 있다. ⑥ 계약담당공무원은 제4항 및 제5항에 의한 계약상대자의 계약금액조정 청구내용이 일부 미비하거나 분명하지 아니한 경우에는 지체없이 필요한 보완요구를 하여야 하며, 이 경우에는 계약상대자가 보완요구를 통보받은 날부터 발주기관이 그 보완을 완료한 사실을 통지받은 날까지의 기간은 제5항에 의한 기간에 산입하지 아니한다. 다만, 계약상대자의 계약금액조정 청구내용이 계약금액 조정요건을 충족하지 않았거나 관련 증빙서류가 첨부되지 아니한 경우에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송하여야 하며, 이 경우에 계약상대자는 그 반송사유를 충족하여 계약금액조정을 다시 청구하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:11의2","kind":"조문","type":"계약예규","family":"nca","label":"제11조의2","title":"기타 계약내용의 변경으로 인한 계약금액의 조정","text":"제11조의2(기타 계약내용의 변경으로 인한 계약금액의 조정) ① 계약담당공무원은 물품구매(제조)계약에 있어서 제11조에 의한 경우 이외에 다음 각 호의 어느 하나의 사유로 인하여 계약금액을 조정할 필요가 있는 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위내에서 이를 조정한다.1. 최저임금법에 따른 최저임금을 시간당 노무비 단가로 정한 경우에 최저임금이 변경된 경우2. 기타 계약내용이 변경된 경우② 제1항의 경우에는 시행령 제65조제6항을 준용한다.③ 계약담당공무원은 제1항에 의하여 계약금액을 조정하는 경우에는 계약상대자의 계약금액조정 청구를 받은 날부터 30일이내에 계약금액을 조정하여야 한다. 이 경우 예산배정의 지연 등 불가피한 경우에는 계약상대자와 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 조정할 수 있는 예산이 없는 때에는 업무량 등을 조정하여 그 대가를 지급할 수 있다.④ 계약담당공무원은 제3항에 의한 계약상대자의 계약금액조정 청구내용이 부당함을 발견한 때에는 지체없이 보완요구 등의 필요한 조치를 하여야 한다. 이 경우 계약상대자가 보완요구 등의 조치를 통보받은 날부터 발주기관이 그 보완을 완료한 사실을 통지받은 날까지의 기간은 제3항의 기간에 산입하지 아니한다.⑤ 제3항에 의한 계약상대자의 계약금액조정 청구는 제22조에 의한 완료대가(장기계속계약의 경우에는 각 차수별 완료대가) 수령전까지 하여야 한다.[본조신설 2014.4.1.]","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:11의3","kind":"조문","type":"계약예규","family":"nca","label":"제11조의3","title":"계약금액 조정 전의 기성대가 지급","text":"제11조의3(계약금액 조정 전의 기성대가 지급) ① 계약담당공무원은 물가변동, 설계변경 및 기타계약내용의 변경으로 인하여 계약금액이 당초 계약금액보다 증감될 것이 예상되는 경우로서 기성대가를 지급하고자 하는 경우에는「국고금관리법 시행규칙」제72조에 의하여 당초 산출내역서를 기준으로 산출한 기성대가를 개산급으로 지급할 수 있다. 다만, 감액이 예상되는 경우에는 예상되는 감액금액을 제외하고 지급하여야 한다.② 계약상대자는 제1항에 의하여 기성대가를 개산급으로 지급받고자 하는 경우에는 기성대가 신청시 개산급 신청사유를 서면으로 작성하여 첨부하여야 한다. [본조신설 2025.12.31.]","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"납품","text":"제12조(납품) ① 계약상대자는 계약서에 정한 납품기일까지 해당물품(검사에 필요한 서류 등을 포함한다)을 「산업표준화법」 제24조에 따른 한국산업표준(특별한 사유가 없는 한 「물류정책기본법」 제24조에 따른 물류표준을 포함한다)을 준수하여 계약담당공무원이 지정한 장소에 납품하여야 한다.② 제1항에 의하여 납품된 물품을 검사ㆍ수령하기까지 발주기관의 책임없는 사유로 인하여 발생된 물품의 망실ㆍ파손 등은 계약상대자의 부담으로 한다.③ 계약담당공무원이 필요에 따라 분할납품을 요구하거나, 계약상 분할납품이 허용된 경우를 제외하고는 분할납품을 할 수 없다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"규격","text":"제13조(규격) ① 모든 물품의 규격은 계약상 명시된 규격명세, 규격번호 및 발주기관이 제시한 견품의 규격을 충족하여야 하며, 구매목적에 맞는 신품이어야 한다.② 계약상 규격이 명시되어 있지 아니한 경우에는 상관습과 기술적 타당성 및 구매규격 등에 부합하는 물품이어야 한다.③ 예비부속품으로서 기계ㆍ기구를 완성하는데 필요한 조립비는 물품가격에 포함되어 있는 것으로 간주한다. 다만, 계약에 부속품으로 기계, 기구를 완성하는데 필요한 조립비가 별도로 표시되어 있는 경우에는 그러하지 아니하다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"포장 및 품목표시","text":"제14조(포장 및 품목표시) ① 포장은 계약조건과 계약규격서에 규정된 포장조건에 따라야 하며 내용물의 보전에 충분하여야 한다.② 기계의 모체와 분리하여 부속품 또는 예비부속품을 포장할 때에는 관련 참조번호 및 기호 등을 명기한 꼬리표를 붙여야 한다.③ 계약상대자는 대한민국 외에서 제조된 계약물품을 납품하고자 할 때에는 관세청장이 고시한 원산지제도 운영에 관한 고시 및 산업통상자원부장관이 고시한 대외무역관리규정에 의하여 원산지를 해당 물품에 표시하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"포장명에 표기할 사항","text":"제15조(포장명에 표기할 사항) 물품의 포장면에는 다음 각호의 사항을 명기하여야 한다.1. 제작자 상호 및 계약상대자 상호2. 계약번호3. 품명 및 물품저장번호4. 포장내용물의 일련번호 및 수량5. 순무게, 총무게 및 부피6. 취급시 주의사항7. 기타 계약상 요구되는 표기","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"표기","text":"제16조(표기) ① 납품한 물품에는 계약상 규격서에 규정된 포장외에 제작자명 또는 상표와 발주기관이 정한 관수품 표시를 하여야 한다.② 표지는 물품의 형태 또는 성질에 따라 인쇄, 금속판 첩찰, 꼬리표 또는 기타방법에 의하여 표시하여야 한다.③ 물품에 표기하여야 할 표지는 그 물품의 지구성과 같아야 하며 포장의 표지는 목적된 장소에 도착할 때까지 선명하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"포장명세서","text":"제17조(포장명세서) ① 계약상대자는 납품할 때 포장내용물에 관하여 상세히 기재한 포장명세서를 제출하여야 한다.② 포장명세서에는 포장번호, 포장수, 포장품명, 수량, 순무게, 부피 등을 기명하여야 한다.③ 포장에는 포장명세서 1통을 첨부하여야 한다. 다만, 드럼통 등 명세서를 첨부하기 어려운 것에는 용기에 기명하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"사용 및 취급주의서","text":"제18조(사용 및 취급주의서) 계약상대자는 사용 및 취급상의 주의가 필요하다고 생각될 때에는 그 물품의 사용, 보관, 수리 등의 요령과 주의사항을 명기한 주의서를 제출하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"검사","text":"제19조(검사) ① 계약상대자는 계약이행을 완료한 때에는 그 사실을 서면으로 계약담당공무원에게 통지하고 필요한 검사를 받아야 한다. 기납부분에 대하여 완납전에 대가의 전부 또는 일부를 지급하고자 할 때에도 또한 같다.② 「산업표준화법」 제15조에 따라 인증을 받은 제품, 같은 법 제31조의4제2항에 따라 수상자로 선정된 기업 등이 제조한 물품, 「조달사업에 관한 법률」 제18조에 따라 조달청장이 고시한 품질관리능력 평가기준에 적합한 자가 제조한 물품에 대하여는 제1항에도 불구하고 검사를 면제하여야 한다. 다만, 해당 물품이 국민의 생명 보호, 안전, 보건위생 등을 위하여 검사가 필요하다고 인정되거나 불량 자재의 사용, 다수의 하자 발생, 관계 기관의 결함보상명령 등으로 품질의 확인이 필요한 것으로 인정되어 계약의 내용에 검사를 실시한다는 사항이 포함되도록 한 경우에는 그러하지 아니하다. ③ 계약담당공무원은 제1항의 통지를 받은 때에는 검사와 관련된 규정 및 다음 각호의 요령에 따라 계약서 기타 관계서류에 의하여 그 날로부터 14일 이내에 계약상대자의 입회하에 그 이행을 확인하기 위한 검사를 하여야 한다. 다만, 천재ㆍ지변 등 불가항력인 사유로 인하여 검사를 완료하지 못한 경우에는 해당 사유가 존속되는 기간과 해당 사유가 소멸된 날로부터 3일까지는 이를 연장할 수 있다.1. 검사는 계약담당공무원이 품질, 수량, 포장, 표기상태, 포장명세서, 품질식별기호 등에 관하여 행한다.2. 계약담당공무원은 물품을 신규로 제조할 필요가 있거나 물품의 성질상 제조과정이 중요한 경우에는 제조과정에서 검사를 할 수 있다.3. 계약상대자는 검사를 받기 위하여 발주기관이 지정하는 장소에 물품을 반입하였을 때에는 계약담당공무원에게 즉시 반입통지를 하여야 한다.4. 검사에 필요한 일체의 비용과 검사를 하기 위한 변형, 소모, 파손 또는 변질로 생기는 손상은 계약상대자의 부담으로 한다.④ 계약담당공무원은 제3항의 검사에 있어서 계약상대자의 계약이행 내용의 전부 또는 일부가 계약에 위반되거나 부당함을 발견한 때에는 필요한 시정조치를 할 수 있다. 이 경우에는 계약상대자로부터 그 시정을 완료한 사실을 통지받은 날로부터 제3항의 기간을 계산한다.⑤ 제3항에 따른 검사에 합격하지 못하여 계약이행기간이 연장될 때에는 계약담당공무원은 제24조에 의한 지체상금을 부과한다.⑥ 계약상대자는 제3항에 의한 검사에 입회ㆍ협력하여야 한다. 계약상대자가 입회를 거부하거나 검사에 협력하지 아니함으로써 발생하는 지체에 대하여는 제4항 및 제5항을 준용한다.⑦ 계약상대자는 제3항 및 제4항에 의한 검사에 이의가 있을 때에는 재검사를 요청할 수 있다. 이 경우 계약담당공무원은 지체없이 검사를 하여야 한다.⑧ 계약담당공무원은 검사를 완료한 때에는 그 결과를 서면으로 계약상대자에게 통지하여야 한다.⑨ 제3항에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 제3항의 14일을 7일로 본다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"특허권 등의 사용","text":"제20조(특허권 등의 사용) 계약상대자는 해당 계약의 이행에 제3자의 권리의 대상으로 되어 있는 특허권 등을 사용할 때에는 그 사용에 관한 일체의 책임을 져야 한다. 다만, 계약문서에 지정되지 않은 특허권 등의 사용을 발주기관이 요구한 경우에는 발주기관은 소요된 비용을 계약상대자에게 지급하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"보증","text":"제21조(보증) ① 계약상대자는 검수와는 별도로 납품후 1년간 납품한 물품의 규격과 품질이 계약내용과 동일함을 보증하여야 한다.② 계약담당공무원은 납품후 1년이내 납품한 물품의 규격과 품질이 계약내용과 상이함을 발견한 때에는 그 사실을 계약상대자에게 통지하고 해당물품의 대체납품 또는 해당 물품대금을 반환하도록 청구할 수 있다.③ 계약상대자는 제2항의 통지를 받으면 조속히 해당 물품을 계약조건에 따라 대체납품하여야 한다. 이 경우에 모든 대체물품가격과 이에 따르는 경비는 계약상대자의 부담으로 한다.④ 제3항의 대체물품에 대하여는 제1항을 적용한다.⑤ 계약상대자가 계약담당공무원이 요구한 물품의 대체를 거부하거나, 계약담당공무원이 통지를 한 후, 소정기일내에 물품의 대체납품을 하지 못할 때에는 계약상대자는 해당 물품가격을 발주기관에 반납하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"대가의 지급","text":"제22조(대가의 지급) ① 계약상대자는 계약이행을 완료한 후 제19조에 의한 검사에 합격한 때에는 대가지급청구서(하수급인에 대한 대금지급 계획을 첨부하여야 한다)를 제출하는 등 소정절차에 따라 대가지급을 청구할 수 있다. ② 계약담당공무원은 제1항에 따른 청구를 받은 때에는 그 청구를 받은 날로부터 5일(공휴일 및 토요일은 제외한다. 이하 이조에서 같다) 이내에 그 대가를 지급(「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통한 지급 포함. 이하 이 조에서 같다.)하여야 하며, 동 대가지급기한에도 불구하고 자금사정 등 불가피한 사유가 없는 한 최대한 신속히 대가를 지급하여야 한다. 다만, 계약상대자와의 합의에 의하여 5일을 초과하지 아니하는 범위안에서 대가의 지급기간을 연장하는 특약을 정할 수 있다. ③ 천재ㆍ지변 등 불가항력의 사유로 인하여 대가를 지급할 수 없게 된 경우에는 계약담당공무원은 해당 사유가 존속되는 기간과 해당 사유가 소멸된 날로부터 3일까지는 대가의 지급을 연장할 수 있다.④ 계약담당공무원은 기성부분 또는 기납부분에 대한 대가를 지급하는 경우에 제2항에도 불구하고 계약수량, 이행의 전망, 이행기간 등을 고려하여 최소한 매 30일마다 공평하게 지급하여야 하며 제19조제3항에 의한 검사를 한 후 계약상대자의 청구를 받은 날로부터 5일이내에 지급하여야 한다. ⑤ 계약담당공무원은 제2항 및 제4항에 따른 대가지급시 제1항의 대금지급 계획상의 하수급인에게 대가지급 사실을 통보하고 대금 수령내역(수령자, 수령액, 수령일 등) 및 증빙서류를 제출(「전자서명법」제2조에 따른 전자문서에 의한 제출을 포함한다. 이하 제22조의2제1항에 따른 제출 및 통보에 있어 같다)하게 하여야 한다. ⑥ 계약담당공무원은 제1항 또는 제4항의 청구를 받은 후에 그 청구내용의 전부 또는 일부가 부당함을 발견한 때에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송할 수 있다. 이 경우에는 반송한 날로부터 재청구를 받은 날까지의 기간은 제2항 또는 제4항의 지급기간에 이를 산입하지 아니한다.⑦ 제4항에 의하여 기성부분에 대한 대가를 지급하는 경우에는 제3조제1항 단서에 의한 산출내역서의 단가에 의하여 이를 계산한다.⑧ 제2항에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 제2항의 5일을 3일로 본다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:22의2","kind":"조문","type":"계약예규","family":"nca","label":"제22조의2","title":"하도급대금 지급 확인","text":"제22조의2(하도급대금 지급 확인) ① 계약상대자는 제22조에 따른 대가를 지급받은 경우에는 15일 이내에 하도급대금을 하수급인에게 현금으로 지급하여야 하며, (다만,「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통해서도 지급이 가능하며(이하 이 조에서 같다.), 이 경우 5일 이내에 지급하여야 한다.) 하도급대금의 지급 내역(수령자, 지급액, 지급일 등)을 5일(공휴일 및 토요일은 제외한다) 이내에 발주기관에게 통보하여야 한다. ② 계약담당공무원은 제1항에 따른 대금 지급내역을 제22조제5항에 따라 하수급인으로부터 제출받은 대금 수령내역과 비교ㆍ확인하여야 한다.③ 하도급거래 공정화에 관한 법률 제2조에 따라 동법의 적용을 받지 않는 하도급계약에 대해서는 제1항 및 제2항을 적용하지 아니한다.(제22조제5항의 경우에도 같다)[본조신설 2011.5.13.]","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:22의3","kind":"조문","type":"계약예규","family":"nca","label":"제22조의3","title":"국민건강보험료 등의 사후정산","text":"제22조의3(국민건강보험료 등의 사후정산) 계약담당공무원은 「정부 입찰ㆍ계약 집행기준」 제93조에 의하여 국민건강보험료 등을 사후정산 하기로 한 계약에 대하여는 제22조에 따른 대가 지급시 계약예규 「정부 입찰ㆍ계약 집행기준」 제94조에 따라 정산하여야 한다.[본조신설 2012.1.1.]","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"대가지급지연에 대한 이자","text":"제23조(대가지급지연에 대한 이자) ① 계약담당공무원은 대가지급청구를 받은 경우에 제22조에 의한 대가지급기한(국고채무부담행위에 의한 계약의 경우에는 다음 회계년도 개시 후 「국가재정법」에 의하여 해당 예산이 배정된 날부터 20일)까지 대가를 지급하지 못하는 경우에는 지급기한의 다음날부터 지급하는 날까지의 일수(이하 \"대가지급지연일수\"라 한다)에 해당 미지급액에 대하여 지연발생 시점에 금융기관 대출평균금리(한국은행 통계월보상의 금융기관 대출평균금리를 말한다)를 곱하여 산출한 금액을 이자로 지급하여야 한다.② 천재지변 등 불가항력적인 사유로 인하여 검사 또는 대가지급이 지연된 경우에 제19조제3항단서 및 제22조제3항에 의한 지연기간은 제1항의 대가지급지연일수에 산입하지 아니한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:24","kind":"조문","type":"계약예규","family":"nca","label":"제24조","title":"지체상금","text":"제24조(지체상금) ① 계약상대자는 계약서에서 정한 납품기한내에 물품을 납품하지 아니한 때에는 매 지체일수마다 계약서에서 정한 지체상금률을 계약금액(장기계속계약의 경우에는 연차별 계약금액)에 곱하여 산출한 금액(이하 \"지체상금\"이라 한다)을 현금으로 납부하여야 한다. 다만, 납부할 금액이 계약금액(제2항에 따라 기성부분 또는 기납부분에 대하여 검사를 거쳐 이를 인수한 경우에는 그 부분에 상당하는 금액을 계약금액에서 공제한 금액을 말한다)의 100분의 30을 초과하는 경우에는 100분의 30으로 한다. ② 계약담당공무원은 제1항의 경우에 기납부분에 대한 검사를 거쳐 해당 부분을 인수(인수하지 아니하고 관리ㆍ사용하고 있는 경우를 포함한다. 이하 이조에서 같다)한 때에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 기납부분의 인수는 성질상 분할할 수 있는 물품에 대한 완성부분으로서 인수하는 것에 한한다.③ 계약담당공무원은 다음 각 호의 어느 하나에 해당되어 납품이 지체되었다고 인정할 때에는 그 해당일수를 제1항의 지체일수에 산입하지 아니한다.1. 천재ㆍ지변 등 불가항력의 사유에 의한 경우2. 계약상대자가 대체사용할 수 없는 중요 관급재료의 공급이 지연되어 제조공정의 진행이 불가능하였을 경우3. 계약상대자의 책임 없이 납품이 지연된 경우로서 다음 각 목의 어느 하나에 해당하는 경우 가. 발주기관의 물품제작을 위한 설계도서 승인이 계획된 일정보다 지연된 경우(관련서류의 누락 등 계약상대자의 잘못을 보완하는 기간은 제외한다)나. 계약상대자가 시험기관 및 검사기관의 시험ㆍ검사를 위해 필요한 준비를 완료하였으나 시험기관 및 검사기관의 책임으로 시험ㆍ검사가 지연된 경우다. 설계도서 승인 후 발주기관의 요구에 의한 설계변경으로 인하여 제작기간이 지연된 경우라. 발주기관의 책임으로 제조의 착수가 지연되었거나 중단되었을 경우4. 기타 계약상대자의 책임에 속하지 않은 사유로 인하여 지체된 경우④ 계약담당공무원은 제1항에 의한 지체일수를 다음 각호에 따라 산정하여야 한다.1. 납품기한내에 제12조제1항에 의하여 물품(검사에 필요한 서류를 포함한다. 이하 이항에서 같다)을 납품한 때에는 제19조에 의한 검사에 소요된 기간은 지체일수에 산입하지 아니한다. 다만, 납품기한 이후에 제19조제4항에 의한 시정조치를 한 때에는 시정조치를 한 날부터 최종 검사에 합격한 날까지의 기간(검사기간이 제19조제3항에서 정한 기간을 초과한 경우에는 동조에 정한 기간에 한한다. 이하 같다)을 지체일수에 산입한다.2. 납품기한을 경과하여 물품과 검사서류를 제출한 때에는 납품기한 다음날부터 검사(시정조치를 한 때에는 최종 검사)에 합격한 날까지의 기간을 지체일수에 산입한다.3. 납품기한의 말일이 공휴일(관련 법령에 의하여 발주기관의 휴무일이거나 「근로자의 날 제정에 관한 법률」에 따른 근로자의 날(계약상대자가 실제 업무를 하지 아니한 경우에 한함)인 경우를 포함한다)인 경우 지체일수는 공휴일의 다음 다음날부터 기산한다. ⑤ 계약담당공무원은 제1항 내지 제4항에 의하여 산출된 지체상금을 계약상대자에게 지급될 대가, 대가지급지연에 대한 이자 또는 기타 예치금 등과 상계할 수 있다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:24의2","kind":"조문","type":"계약예규","family":"nca","label":"제24조의2","title":"불가항력","text":"제24조의2(불가항력) ① 불가항력이라 함은 태풍ㆍ홍수 기타 악천후, 전쟁 또는 사변, 지진, 화재, 전염병, 폭동 기타 계약당사자의 통제범위를 벗어나는 사태(이하 \"불가항력의 사유\"라 한다)가 발생하여 계약이행에 직접적인 영향을 미친 경우로서 계약당사자 누구의 책임에도 속하지 아니하는 경우를 말한다.② 제1항의 불가항력의 사유로 인하여 다음 각호에 발생한 손해는 발주기관이 부담하여야 한다.1. 제19조에 의한 검사를 완료한 기납부분2. 검사를 완료하지 아니한 부분 중 객관적인 자료(감독일지, 사진 또는 비디오테잎 등)에 의하여 이미 수행되었음이 판명된 부분③ 계약상대자는 제1항 및 제2항의 사유가 발생하였을 경우에는 지체없이 그 사실을 계약담당공무원에게 통지 하여야 하며, 계약담당공무원은 즉시 그 사실을 조사하고 그 손해의 상황을 확인한 후 그 결과를 계약상대자에게 통지하여야 한다.④ 계약담당공무원은 제3항에 의하여 손해의 상황을 확인하였을 때에는 별도의 약정이 없는 한 계약금액의 변경 또는 손해액의 부담 등에 대하여 계약상대자와 협의하여야 한다. 다만, 협의가 성립되지 않을 때에는 제31조에 따라 처리한다. ［본조신설 2025.12.31.］","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:25","kind":"조문","type":"계약예규","family":"nca","label":"제25조","title":"계약기간의 연장","text":"제25조(계약기간의 연장) ① 계약상대자는 제24조제3항 각 호의 어느 하나의 사유가 계약기간내에 발생한 경우에는 계약기간 종료전에 지체없이 계약담당공무원에게 서면으로 계약기간의 연장신청과 제4항에 의한 계약금액 조정신청을 함께 하여야 한다. 다만, 연장사유가 계약기간내에 발생하여 계약기간 경과후 종료된 경우에는 동 사유가 종료된 후 즉시 계약기간의 연장신청과 제4항에 의한 계약금액 조정신청을 함께 하여야 한다.② 계약담당공무원은 제1항에 의한 계약기간연장 신청이 접수된 때에는 즉시 그 사실을 조사 확인하고 계약이 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다.③ 계약담당공무원은 제1항의 연장청구를 승인하였을 경우에는 제24조에 의한 지체상금을 부과하여서는 아니된다.④ 제2항에 의하여 계약기간을 연장한 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 계약금액을 조정한다. ⑤ 계약담당공무원은 제1항 내지 제4항에도 불구하고 계약상대자의 의무불이행으로 인하여 발생한 지체상금이 시행령 제50조제1항에 의한 계약보증금상당액에 달한 경우로서 계약목적물이 국가정책사업 대상이거나 계약의 이행이 노사분규 등 불가피한 사유로 인하여 지연된 때에는 계약기간을 연장할 수 있다.⑥ 제4항에 의한 계약기간의 연장은 지체상금이 계약보증금상당액에 달한 때에 하여야 하며, 연장된 계약기간에 대하여는 제24조에도 불구하고 지체상금을 부과하여서는 아니된다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:26","kind":"조문","type":"계약예규","family":"nca","label":"제26조","title":"계약상대자의 책임있는 사유로 인한 계약의 해제 또는 해지","text":"제26조(계약상대자의 책임있는 사유로 인한 계약의 해제 또는 해지) ①계약담당공무원은 계약상대자가 다음 각 호의 어느 하나에 해당하는 경우에는 해당 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 다만, 제3호의 경우 계약상대자의 계약이행 가능성이 있고 계약을 유지할 필요가 있다고 인정되는 경우로서 계약상대자가 계약이행이 완료되지 아니한 부분에 상당하는 계약보증금(당초 계약보증금에 제24조제1항에 따른 지체상금의 최대금액을 더한 금액을 한도로 한다)을 추가납부하는 때에는 계약을 유지한다. 1. 계약서상의 납품기한(또는 연장된 납품기한)내에 계약상대자가 계약된 규격 등과 같은 물품납품을 거부하거나 완료하지 못한 때2. 계약상대자의 책임있는 사유로 인하여 납품기일내에 납품할 가능성이 없음이 명백하다고 인정될 경우3. 제24조제1항에 의한 지체상금이 시행령 제50조제1항에 의한 해당 계약(장기물품제조등의 계약인 경우에는 차수별 계약)의 계약보증금상당액에 달한 경우 4. 장기물품제조 등의 계약에 있어서 제2차이후의 계약을 체결하지 아니하는 경우5. 계약의 수행중 뇌물수수 또는 정상적인 계약관리를 방해하는 불법ㆍ부정행위가 있는 경우6. 입찰에 관한 서류 등을 허위 또는 부정한 방법으로 제출하여 계약이 체결된 경우7. 「정부입찰ㆍ계약 집행기준」 제36조제2항에 따른 선금사용내역서를 확인한 결과, 선금의 반복적인 목적 외 사용으로 계약 이행에 상당한 지장을 초래할 것이 명백한 경우 8. 기타 계약조건을 위반하고 그 위반으로 인하여 계약의 목적을 달성할 수 없다고 인정될 경우② 계약담당공무원은 제1항에 의하여 계약을 해제 또는 해지할 때에는 그 사실을 해당 계약상대자에게 통지하고 기납부분 검사를 필한 물품을 기납부분으로서 인수한 경우에는 해당부분에 상당하는 대가를 계약상대자에게 지급한다.③ 계약상대자는 계약상 기한내에 해당물품을 납품할 수 없다고 인정될 때에는 지체없이 계약담당공무원에게 통지하여야 한다.④ 제1항에 의하여 계약이 해제 또는 해지된 경우에 계약상대자는 지급받은 선금에 대하여 미정산잔액이 있는 경우에는 그 잔액에 대한 약정이자상당액[사유발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 대출평균금리를 말한다)에 의하여 산출한 금액]을 가산하여 발주기관에 상환하여야 한다. 이 경우 계약담당공무원은 상환할 금액과 기성부분의 대가를 상계 할 수 있다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:27","kind":"조문","type":"계약예규","family":"nca","label":"제27조","title":"사정변경에 의한 계약의 해제 또는 해지","text":"제27조(사정변경에 의한 계약의 해제 또는 해지) ① 발주기관은 제26조제1항 각호의 경우외에 다음 각 호의 사유와 같이 객관적으로 명백한 발주자의 불가피한 사정이 발생한 때에는 계약을 해제 또는 해지할 수 있다. 1. 정부정책 변화 등에 따른 불가피한 사업취소2. 관계 법령의 제ㆍ개정으로 인한 사업취소3. 과다한 지역 민원 제기로 인한 사업취소4. 기타 공공복리에 의한 사업의 변경 등에 따라 계약을 해제 또는 해지하는 경우② 발주기관은 제1항에 의하여 계약을 해제 또는 해지하는 경우에는 다음 각호에 해당하는 금액을 해제 또는 해지한 날부터 14일이내에 계약상대자에게 지급하여야 한다. 이 경우에는 제7조에 의한 계약보증금을 동시에 반환하여야 한다.1. 제22조제4항의 대가중 지급하지 아니한 금액2. 전체 물품제조의 완성을 위하여 계약의 해제 또는 해지일 이전에 투입된 계약상대자의 인력ㆍ재료 및 장비의 철수비용③ 계약상대자는 선금에 대한 미정산잔액이 있는 경우에는 이를 발주기관에 상환하여야 한다. 이 경우에 계약담당공무원은 미정산잔액에 대한 이자는 가산하지 아니한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:28","kind":"조문","type":"계약예규","family":"nca","label":"제28조","title":"부정당업자의 입찰참가자격제한","text":"제28조(부정당업자의 입찰참가자격제한) 계약상대자가 시행령 제76조에 해당하는 경우에는 1월이상 2년이하의 범위내에서 입찰참가자격 제한조치를 받게 된다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mul
