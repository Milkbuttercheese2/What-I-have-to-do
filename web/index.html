제94조제1항에 따른 계약심의위원회의 자문을 거쳐야 한다.\n②각 중앙관서의 장은 제1항의 규정에 의한 계약을 체결하고자 할 때에는 입찰전에 계약목적물의 특성ㆍ계약수량 및 이행기간등을 고려하여 사후원가검토에 필요한 기준 및 절차 등을 정하여야 하며, 이를 입찰에 참가하고자 하는 자가 열람할 수 있도록 하여야 한다.\n③ 각 중앙관서의 장은 추정가격 중 비목별 금액을 결정할 수 없는 비율이 100분의 50 이상인 사후원가검토조건부 계약을 체결한 경우에는 이를 감사원에 통지해야 한다.\n④계약의 이행이 완료된 후에는 제9조 및 제2항의 규정에 의한 기준등에 따라 원가를 검토하여 정산하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:73의2","kind":"조문","type":"시행령","family":"nca","label":"제73조의2","title":"건설사업관리용역계약","text":"제73조의2(건설사업관리용역계약)\n①각 중앙관서의 장 또는 계약담당공무원은 「건설산업기본법」에 따른 공사를 계약함에 있어서 계약목적물의 특성ㆍ규모 및 이행기간 등을 고려하여 필요하다고 인정하는 경우에는 「건설산업기본법」 제2조제8호에 따른 건설사업관리에 관한 업무를 수행할 수 있는 자와 건설사업관리용역계약을 체결할 수 있다.\n②제1항에 따른 계약의 체결방법 그 밖에 필요한 사항은 재정경제부장관이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:74","kind":"조문","type":"시행령","family":"nca","label":"제74조","title":"지체상금","text":"제74조(지체상금)\n①각 중앙관서의 장 또는 계약담당공무원은 계약상대자(국가기관과 지방자치단체를 제외한다)가 계약상의 의무를 지체한 때에는 지체상금으로서 계약금액(장기계속공사계약ㆍ장기계속물품제조계약ㆍ장기계속용역계약의 경우에는 연차별 계약금액을 말한다. 이하 이 조에서 같다)에 재정경제부령이 정하는 율과 지체일수를 곱한 금액을 계약상대자로 하여금 현금으로 납부하게 하여야 한다. 이 경우 계약상대자의 책임없는 사유로 계약이행이 지체되었다고 인정될 때에는 그 해당일수를 지체일수에 산입하지 아니한다.\n②제1항의 경우 기성부분 또는 기납부분에 대하여 검사를 거쳐 이를 인수한 경우(인수하지 아니하고 관리ㆍ사용하고 있는 경우를 포함한다. 이하 이 조에서 같다)에는 그 부분에 상당하는 금액을 계약금액에서 공제한 금액을 기준으로 지체상금을 계산하여야 한다. 이 경우 기성부분 또는 기납부분의 인수는 성질상 분할할 수 있는 공사ㆍ물품 또는 용역등에 대한 완성부분으로서 인수하는 것에 한한다.\n③ 제1항 및 제2항에 따라 납부할 지체상금이 계약금액(제2항에 따라 기성부분 또는 기납부분에 대하여 검사를 거쳐 이를 인수한 경우에는 그 부분에 상당하는 금액을 계약금액에서 공제한 금액을 말한다)의 100분의 30을 초과하는 경우에는 100분의 30으로 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:75","kind":"조문","type":"시행령","family":"nca","label":"제75조","title":"계약의 해제ㆍ해지","text":"제75조(계약의 해제ㆍ해지)\n①각 중앙관서의 장 또는 계약담당공무원은 법 제12조제3항의 규정에 의하여 계약보증금을 국고에 귀속시키는 경우에는 계약에 특별히 정한 것이 없는 한 당해 계약을 해제 또는 해지하고 계약상대자에게 그 사유를 통지하여야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 제74조제1항에 따른 지체상금의 징수사유가 발생하고 그 금액이 제50조제1항에 따른 계약보증금상당액(면제된 계약보증금을 포함한다)에 달하는 경우에는 다음 각 호의 구분에 따른 방법으로 계약을 해제 또는 해지하거나 유지할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76","kind":"조문","type":"시행령","family":"nca","label":"제76조","title":"부정당업자의 입찰참가자격 제한","text":"제76조(부정당업자의 입찰참가자격 제한)\n① 법 제27조제1항제8호에서 \"대통령령으로 정하는 기준에 따른 사망 등 중대한 위해\"란 「산업안전보건법」 제38조, 제39조 또는 제63조에 따른 안전 및 보건조치 의무를 위반하여 동시에 2명 이상의 근로자가 사망한 경우를 말한다.\n② 법 제27조제1항제9호 각 목 외의 부분에서 \"대통령령으로 정하는 자\"란 다음 각 호의 구분에 따른 자를 말한다.\n③ 각 중앙관서의 장은 다음 각 호의 어느 하나에 해당하는 자(이하 \"부정당업자\"라 한다)에 대해서는 즉시 1개월 이상 2년 이하의 범위에서 입찰참가자격을 제한해야 한다. 다만, 부정당업자의 대리인, 지배인 또는 그 밖의 사용인이 법 제27조제1항 각 호의 어느 하나에 해당하는 행위를 하여 입찰참가자격 제한 사유가 발생한 경우로서 부정당업자가 대리인, 지배인 또는 그 밖의 사용인의 그 행위를 방지하기 위해 상당한 주의와 감독을 게을리하지 않은 경우 또는 부정당업자의 위반행위가 천재지변이나 그 밖에 이에 준하는 부득이한 사유로 인한 경우에는 부정당업자에 대한 입찰참가자격을 제한하지 않는다.\n④ 제3항에 따른 입찰참가자격 제한의 기간에 관한 사항은 법 제27조제1항 각 호에 해당하는 행위별로 부실벌점, 하자비율, 부정행위 유형, 고의ㆍ과실 여부, 뇌물 액수 및 국가에 손해를 끼친 정도 등을 고려하여 재정경제부령으로 정한다.\n⑤ 법 제25조에 따른 공동계약의 공동수급체가 법 제27조제1항 각 호의 어느 하나에 해당하는 경우에는 입찰참가자격 제한의 원인을 제공한 자에 대해서만 제3항을 적용한다.\n⑥ 다음 각 호의 어느 하나에 해당하는 자가 법 제27조제1항 각 호의 어느 하나에 해당하는 경우에는 그 구분에 따른 자에 대해서도 제3항을 적용한다.\n⑦ 각 중앙관서의 장은 법 제27조제2항에 따라 입찰 참가자격 제한처분을 감경 또는 면제하려는 경우에는 다음 각 호의 구분에 따라 감경 또는 면제한다.\n⑧ 각 중앙관서의 장 또는 계약담당공무원은 제3항, 제5항 또는 제6항에 따라 입찰참가자격을 제한받은 자에 대해 제한기간 동안에는 해당 관서에서 집행하는 입찰에 참가할 수 없도록 해야 한다.\n⑨ 각 중앙관서의 장 또는 계약담당공무원은 경쟁입찰에서 낙찰된 자가 계약체결 전에 제3항, 제5항 또는 제6항에 따라 입찰참가자격 제한을 받은 경우에는 그 낙찰자와 계약을 체결해서는 안 된다. 다만, 법 제21조에 따른 장기계속계약의 낙찰자가 최초로 계약을 체결한 이후 입찰참가자격 제한을 받은 경우로서 해당 장기계속계약에 대한 연차별계약을 체결하는 경우에는 해당 계약상대자와 계약을 체결할 수 있다.\n⑩ 각 중앙관서의 장 또는 계약 담당공무원은 제6항제1호에 따라 입찰참가자격이 제한된 자가 대표자인 법인 또는 단체에 대해서도 제8항 및 제9항을 적용한다. 다만, 다음 각 호에 해당하는 경우에는 적용하지 않는다.\n⑪ 각 중앙관서의 장은 입찰참가자격 제한 처분을 한 경우에는 다음 각 호의 사항을 명백히 하여 제2호에 따른 입찰참가자격 제한기간의 개시일 전까지 다른 중앙관서의 장 또는 계약담당공무원이 알 수 있도록 재정경제부령으로 정하는 바에 따라 전자조달시스템에 게재해야 한다.\n⑫ 각 중앙관서의 장은 입찰참가자격 제한처분을 한 경우에는 법 제27조제5항에 따라 다음 각 호의 사항을 입찰참가자격 제한기간의 개시일 전까지 재정경제부령으로 정하는 바에 따라 전자조달시스템에 공개해야 한다.\n⑬ 각 중앙관서의 장 또는 계약담당공무원은 「지방자치단체를 당사자로 하는 계약에 관한 법률」 또는 「공공기관의 운영에 관한 법률」 등 다른 법령에 따라 입찰참가자격 제한을 한 사실을 통보받거나 전자조달시스템에 게재된 자에 대해서도 입찰에 참가할 수 없도록 해야 한다.\n⑭ 각 중앙관서의 장 또는 계약담당공무원은 제3항, 제5항 및 제6항에 따라 자격이 제한된 자와 제11항에 따라 전자조달시스템에 게재된 자가 상호ㆍ대표자 변경 등의 방법으로 제한기간 내에 입찰에 참가하는 것을 방지하기 위해 입찰참가자의 주민등록번호, 법인등록번호, 관계 법령상의 면허 또는 등록번호 등을 확인해야 한다.\n⑮ 제11항부터 제14항까지에서 규정한 사항 외에 입찰참가자격 제한의 통보 등에 필요한 사항은 재정경제부령으로 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의2","kind":"조문","type":"시행령","family":"nca","label":"제76조의2","title":"과징금 부과의 세부적인 대상과 기준","text":"제76조의2(과징금 부과의 세부적인 대상과 기준)\n① 법 제27조의2제1항제1호에서 \"부정당업자의 책임이 경미한 경우로서 대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다. 다만, 법 제27조제1항제2호, 같은 항 제5호부터 제7호까지, 이 영 제76조제2항제1호나목 및 같은 항 제2호나목ㆍ다목에 해당하는 자는 제외한다.\n② 법 제27조의2제1항제2호에서 \"입찰참가자격 제한으로 유효한 경쟁입찰이 명백히 성립되지 아니하는 경우로서 대통령령으로 정하는 경우\"란 입찰자가 2인 미만이 될 것으로 예상되는 경우를 말한다.\n③ 법 제27조의2제1항에 따른 과징금의 부과 비율과 그 밖에 필요한 사항은 법 제27조제1항 각 호에 해당하는 행위별로 부실벌점, 하자비율, 부정행위의 유형, 고의ㆍ과실 여부 등을 고려하여 재정경제부령으로 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의3","kind":"조문","type":"시행령","family":"nca","label":"제76조의3","title":"과징금의 부과 및 납부","text":"제76조의3(과징금의 부과 및 납부)\n① 각 중앙관서의 장은 법 제27조의2에 따라 과징금을 부과하려는 때에는 위반행위의 종류와 과징금의 금액을 분명하게 적은 서면으로 알려야 한다.\n② 제1항에 따라 통지를 받은 자는 통지를 받은 날부터 60일 이내에 과징금을 부과권자가 정하는 수납기관에 내야 한다. 다만, 천재지변이나 그 밖의 부득이한 사유로 그 기간 내에 과징금을 낼 수 없을 때에는 그 사유가 해소된 날부터 30일 이내에 내야 한다.\n③ 제2항에 따라 과징금을 받은 수납기관은 과징금을 낸 자에게 영수증을 내줘야 한다.\n④ 과징금의 수납기관이 제2항에 따라 과징금을 받았을 때에는 지체 없이 그 사실을 부과권자에게 통보하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의4","kind":"조문","type":"시행령","family":"nca","label":"제76조의4","title":"과징금 납부기한의 연장 및 분할납부","text":"제76조의4(과징금 납부기한의 연장 및 분할납부)\n① 각 중앙관서의 장은 법 제27조의2에 따라 부정당업자가 납부하여야 할 과징금이 계약금액의 10퍼센트를 초과하는 경우 또는 「중소기업기본법」 제2조에 따른 중소기업자에게 10억원을 초과하여 과징금을 부과하는 경우로서 다음 각 호의 어느 하나에 해당하는 사유로 인하여 과징금을 납부하여야 하는 자가 과징금의 전액을 일시에 납부하기가 어렵다고 인정되는 경우에는 그 납부기한을 연장하거나 분할납부하게 할 수 있다.\n② 제1항에 따라 과징금 납부기한의 연장이나 분할납부를 신청하려는 자는 과징금 납부를 통지받은 날부터 30일 이내에 납부기한의 연장 또는 분할납부의 사유를 증명하는 서류를 첨부하여 각 중앙관서의 장에게 신청하여야 한다.\n③ 제1항에 따른 납부기한의 연장은 그 납부기한의 다음 날부터 1년을 초과할 수 없다.\n④ 제1항에 따라 분할납부를 하게 하는 경우 분할된 납부기한 간의 간격은 3개월을 초과할 수 없으며, 분할 횟수는 3회를 초과할 수 없다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의5","kind":"조문","type":"시행령","family":"nca","label":"제76조의5","title":null,"text":"제76조의5 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의6","kind":"조문","type":"시행령","family":"nca","label":"제76조의6","title":null,"text":"제76조의6 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의7","kind":"조문","type":"시행령","family":"nca","label":"제76조의7","title":null,"text":"제76조의7 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의8","kind":"조문","type":"시행령","family":"nca","label":"제76조의8","title":null,"text":"제76조의8 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의9","kind":"조문","type":"시행령","family":"nca","label":"제76조의9","title":null,"text":"제76조의9 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의10","kind":"조문","type":"시행령","family":"nca","label":"제76조의10","title":null,"text":"제76조의10 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의11","kind":"조문","type":"시행령","family":"nca","label":"제76조의11","title":null,"text":"제76조의11 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의12","kind":"조문","type":"시행령","family":"nca","label":"제76조의12","title":null,"text":"제76조의12 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:76의13","kind":"조문","type":"시행령","family":"nca","label":"제76조의13","title":null,"text":"제76조의13 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:77","kind":"조문","type":"시행령","family":"nca","label":"제77조","title":null,"text":"제77조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:78","kind":"조문","type":"시행령","family":"nca","label":"제78조","title":null,"text":"제6장 대형공사계약","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:79","kind":"조문","type":"시행령","family":"nca","label":"제79조","title":"정의","text":"제79조(정의)\n①이 장에서 사용하는 용어의 정의는 다음 각 호와 같다.\n②제1항제3호의 경우에 대체될 수 있는 설계의 범위와 한계에 관하여 이의가 있는 경우에는 「건설기술 진흥법」 제5조에 따른 중앙건설기술심의위원회(특별건설기술심의위원회를 포함하며, 이하 \"중앙건설기술심의위원회\"라 한다)의 심의를 거쳐 각 중앙관서의 장이 그 범위와 한계를 정한다. 다만, 기술자문위원회를 설치ㆍ운영하고 있는 각 중앙관서의 장(그 소속기관의 장을 포함한다. 이하 이 장에서 같다)은 기술자문위원회의 심의를 거쳐 그 범위와 한계를 정할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:80","kind":"조문","type":"시행령","family":"nca","label":"제80조","title":"대형공사 입찰방법의 심의등","text":"제80조(대형공사 입찰방법의 심의등)\n①각 중앙관서의 장은 대형공사 및 특정공사(이하 이 조에서 \"대형공사등\"이라 한다)의 경우 다음 각 호의 사항에 관하여 중앙건설기술심의위원회의 심의를 거쳐야 한다.\n② 각 중앙관서의 장은 제1항에 따라 중앙건설기술심의위원회의 심의를 받으려는 때에는 해당 연도 이후에 집행할 대형공사등의 집행기본계획서를 다음 각 호에서 정하는 순서에 따라 국토교통부장관에게 제출하여야 하며, 대형공사등의 집행기본계획서의 작성방법과 제출시기 등에 관한 사항은 재정경제부령으로 정한다.\n③국토교통부장관은 제2항에 따라 제출된 대형공사등의 집행기본계획서에 대하여 중앙건설기술심의위원회의 심의를 거친 때에는 심의결과에 따라 대안입찰 또는 일괄입찰의 방법에 의하여 집행할 대형공사등과 그 실시설계적격자 또는 낙찰자 결정방법을 공고하여야 한다.\n④ 삭제\n⑤각 중앙관서의 장은 대형공사등에 있어서 특별한 사유가 없는 한 제3항에 따라 공고된 입찰방법과 그 실시설계적격자 또는 낙찰자 결정방법에 따라 입찰을 하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:81","kind":"조문","type":"시행령","family":"nca","label":"제81조","title":null,"text":"제81조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:82","kind":"조문","type":"시행령","family":"nca","label":"제82조","title":null,"text":"제82조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:83","kind":"조문","type":"시행령","family":"nca","label":"제83조","title":null,"text":"제83조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:84","kind":"조문","type":"시행령","family":"nca","label":"제84조","title":"일괄입찰 등의 입찰참가자격","text":"제84조(일괄입찰 등의 입찰참가자격)\n①각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 요건을 모두 갖춘 자에 한하여 일괄입찰 또는 대안입찰에 참가하게 하여야 한다. 다만, 제1호 및 제2호의 요건중 어느 하나만을 갖춘 자들이 공동으로 다음 각 호의 요건을 모두 갖추어 일괄입찰 또는 대안입찰에 참가하고자 하는 경우에는 이들의 입찰참가를 허용하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항에 불구하고 대안입찰의 경우 대안을 제출하지 아니하고 원안에 의한 입찰을 하는 자에 대하여는 제1항제1호의 요건만을 갖춘 자에 대하여도 입찰에 참가하게 하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:84의2","kind":"조문","type":"시행령","family":"nca","label":"제84조의2","title":null,"text":"제84조의2 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:85","kind":"조문","type":"시행령","family":"nca","label":"제85조","title":"일괄입찰등의 입찰절차","text":"제85조(일괄입찰등의 입찰절차)\n①일괄입찰은 기본설계입찰을 실시하여 제87조제1항의 규정에 의하여 실시설계적격자로 선정된 자에 한하여 실시설계서를 제출하게 하여야 한다.\n②대안입찰자가 원안입찰과 함께 대안을 제출하는 경우 다음 각 호의 도서를 입찰서에 첨부하여 제출하게 하여야 한다. 다만, 동시에 2개이상의 대안을 제출할 수 없다.\n③일괄입찰자는 기본설계입찰서 또는 실시설계서에 다음 각호의 구분에 따른 도서를 첨부하여 제출하여야 한다.\n④ 삭제\n⑤각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 어느 하나에 해당하는 때에는 중앙건설기술심의위원회에 해당 설계의 적격여부에 대한 심의 및 설계점수평가를 의뢰하여야 한다. 이 경우 중앙건설기술심의위원회는 기술적 타당성을 검토하고 설계의 적격여부를 명백히 한 서류(원안입찰의 경우를 제외한다) 및 설계점수를 해당 중앙관서의 장 또는 계약담당공무원에게 통지하여야 한다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 제5항의 규정에 의한 설계심의에 대하여는 기술자문위원회의 심의로 갈음할 수 있다. 다만, 기술자문위원회가 설치되어 있지 아니한 경우에는 그러하지 아니하다.\n⑦중앙건설기술심의위원회 또는 기술자문위원회는 제5항 또는 제6항의 규정에 의하여 설계의 심의를 함에 있어서 대안입찰서ㆍ기본설계입찰서 또는 실시설계서에 첨부된 도서가 입찰의 기본계획 및 지침의 내용이나 기본설계의 내용에 비추어 미비하거나 그 내용이 분명하지 아니한 경우에는 이에 대한 보완을 요구할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:85의2","kind":"조문","type":"시행령","family":"nca","label":"제85조의2","title":"일괄입찰 등의 실시설계적격자 또는 낙찰자 결정방법 등 선택","text":"제85조의2(일괄입찰 등의 실시설계적격자 또는 낙찰자 결정방법 등 선택)\n① 각 중앙관서의 장 또는 계약담담공무원은 일괄입찰의 경우 제87조제1항에 따라 선정된 자를 대상으로 중앙건설기술심의위원회에서 공사의 목적 및 특성 등을 고려하여 다음 각 호의 어느 하나에 해당하는 방법 중 해당 공사에 가장 적합하다고 심의한 방법으로 실시설계적격자를 결정하여야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 대안입찰의 경우 원안입찰자와 제86조제2항부터 제4항까지의 규정에 따라 채택된 대안을 제출한 자를 대상으로 중앙건설기술심의위원회에서 공사의 목적 및 특성 등을 고려하여 다음 각 호의 어느 하나에 해당하는 방법 중 해당 공사에 가장 적합하다고 심의한 방법으로 낙찰자를 결정하여야 한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제1항 및 제2항에 따른 실시설계적격자 또는 낙찰자의 결정방법을 입찰공고를 할 때에 명시하여야 한다.\n④ 일괄입찰에 있어 제1항제4호에 따라 실시설계적격자를 결정하는 경우에는 제79조제1항제5호 및 제6호에도 불구하고 기본설계입찰시 입찰서를 제출하게 하지 아니한다.\n⑤ 제1항 및 제2항 각 호에 따른 실시설계적격자 및 낙찰자의 결정 방법에 필요한 설계점수ㆍ가격점수의 산출방법과 가중치, 설계와 가격 조정을 위한 산식, 그 밖에 필요한 사항은 재정경제부장관이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:86","kind":"조문","type":"시행령","family":"nca","label":"제86조","title":"대안입찰의 대안채택 및 낙찰자 결정","text":"제86조(대안입찰의 대안채택 및 낙찰자 결정)\n①각 중앙관서의 장 또는 계약담당공무원은 제85조제2항에 따라 제출된 대안입찰서의 대안입찰가격(제3항 또는 제4항에 따른 조정을 거친 후의 대안입찰가격을 포함한다)이 다음 각 호의 요건을 모두 충족하는 경우에는 이를 낙찰적격입찰로 선정한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 선정된 낙찰적격입찰의 대안입찰서에 대하여 제85조제5항에 따라 설계의 적격여부 및 설계점수를 통지받은 때에는 적격으로 통지된 대안입찰서 중 설계점수가 높은 순으로 최대 6개의 대안(적격으로 통지된 대안이 6개 미만인 경우에는 적격으로 통지된 모든 대안)을 선정한 후 대안설계점수가 원안설계점수보다 높은 것을 대안으로 채택한다. 다만, 수개의 대안공종 중 일부 공종에 대한 대안설계점수가 원안설계점수보다 낮은 경우에는 해당공종에 대한 대안공종은 이를 채택하지 않는다.\n③각 중앙관서의 장 또는 계약담당공무원은 제2항 단서에 따라 대안으로 채택되지 않은 공종이 있는 경우에는 대안입찰자의 대안입찰서상 해당공종의 입찰가격을 원안입찰시에 제출한 산출내역서상의 해당공종의 입찰가격으로 대체하여 전체 대안입찰가격을 조정해야 한다.\n④각 중앙관서의 장 또는 계약담당공무원은 제3항에 따른 조정을 거친 후 제2항 단서에 따라 대안으로 채택되지 않은 공종으로 인해 불가피하게 채택된 공종에 대한 설계의 일부를 수정해야 하는 경우에는 이를 수정할 수 있다. 다만, 수정하게 되는 공종의 입찰가격은 증액할 수 없다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 원안입찰자와 제2항부터 제4항까지의 규정에 따라 채택된 대안을 제출한 자 중에서 제85조의2제2항에 따라 선택된 낙찰자 결정방법을 적용하여 낙찰자를 결정한다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 대안을 제출한 자가 없거나, 제5항에 따른 낙찰자가 없는 경우에는 원안입찰가격이 예정가격 이하로서 최저가격인 입찰을 제출한 자부터 순차적으로 다음 각 호의 방법에 따라 낙찰자를 결정한다.\n⑦제1항부터 제6항까지의 규정에 따른 낙찰자 결정은 부득이한 사유가 없는 한 입찰일부터 80일 이내에 해야 한다.\n⑧각 중앙관서의 장 또는 계약담당공무원은 제3항 및 제4항에 따른 조정 또는 수정을 하는 경우 미리 중앙건설기술심의위원회 또는 기술자문위원회의 심의를 거쳐야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:87","kind":"조문","type":"시행령","family":"nca","label":"제87조","title":"일괄입찰의 낙찰자 선정","text":"제87조(일괄입찰의 낙찰자 선정)\n①각 중앙관서의 장 또는 계약담당공무원은 기본설계입찰에 있어서 제85조제5항의 규정에 의한 통지를 받은 때에는 입찰자중 설계점수가 높은 순으로 최대 6인(적격으로 통지된 입찰자가 6인 미만인 경우에는 적격으로 통지된 모든 입찰자)을 선정한 후 제85조의2제1항에 따라 선택된 실시설계적격자 결정방법을 적용하여 실시설계적격자로 결정한다. 다만, 제85조제5항에 따른 기본설계적격자가 1인 이하인 경우에는 재공고입찰에 의하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제85조제5항 및 제6항의 규정에 의하여 중앙건설기술심의위원회 또는 기술자문위원회로부터 당해 실시설계의 적격통지를 받은 때에는 그 실시설계서를 제출한 자를 낙찰자로 결정한다.\n③각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 실시설계적격자로 결정된 입찰자의 입찰금액이 계속비대형공사에 있어서는 계속비예산, 일반대형공사에 있어서는 총공사예산을 각각 초과하는 경우에는 예산의 범위안으로 가격을 조정하기 위하여 그 입찰자와 협의하여야 하며 협의가 성립되지 아니할 때에는 재공고입찰에 의하여야 한다.\n④제1항 및 제2항의 규정에 의한 낙찰자의 결정은 부득이한 사유가 없는 한 실시설계서가 제출된 날부터 60일이내에 하여야 한다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 제2항의 규정에 의한 낙찰자결정에 있어서 공사의 시급성 기타 특수한 사정으로 인하여 필요하다고 인정하는 경우에는 제1항의 규정에 의한 실시설계적격자로 하여금 당해공사를 공정별 우선순위에 따라 구분하여 실시설계서를 작성하게 할 수 있으며, 당해 실시설계서에 대하여 중앙건설기술심의위원회 또는 기술자문위원회로부터 실시설계적격통지를 받은 때에는 그 실시설계적격자를 낙찰자로 결정하고 우선순위에 따라 공사를 시행하게 할 수 있다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 제5항의 규정에 의하여 낙찰자로 결정된 자로 하여금 공사를 시행하게 하기 전에 총공사와 실시설계적격통지를 받은 공사에 대한 산출내역서를 제출하게 하여 이에 따라 계약을 체결하여야 한다.\n⑦각 중앙관서의 장 또는 계약담당공무원은 총공사에 대한 최종실시설계적격통지가 있는 때에는 제6항의 규정에 의하여 계약을 체결한 자로 하여금 산출내역서를 다시 작성하여 당초의 산출내역서와 대체하도록 하여야 한다. 이 경우 당초의 계약금액은 이를 증액할 수 없다.\n⑧각 중앙관서의 장 또는 계약담당공무원은 제5항 및 제6항의 규정에 의하여 낙찰자를 결정하거나 계약을 체결하고자 하는 경우에는 실시설계서를 우선 제출하여야 하는 공종의 범위 및 제출기한, 산출내역서의 작성ㆍ제출에 관한 사항등을 입찰안내서등에 명시하여 입찰에 참가하고자 하는 자가 입찰전에 미리 이를 알 수 있도록 하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:88","kind":"조문","type":"시행령","family":"nca","label":"제88조","title":null,"text":"제88조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:89","kind":"조문","type":"시행령","family":"nca","label":"제89조","title":"설계비 보상","text":"제89조(설계비 보상)\n①각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 어느 하나에 해당하는 자의 전부 또는 일부에 대하여는 예산의 범위안에서 설계비의 일부를 보상할 수 있다.\n②제1항의 규정에 의한 설계보상비의 지급기준 및 절차등에 관하여 필요한 사항은 재정경제부장관이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:90","kind":"조문","type":"시행령","family":"nca","label":"제90조","title":null,"text":"제90조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:91","kind":"조문","type":"시행령","family":"nca","label":"제91조","title":"설계변경으로 인한 계약금액 조정의 제한","text":"제91조(설계변경으로 인한 계약금액 조정의 제한)\n①대안입찰 또는 일괄입찰에 대한 설계변경으로 대형공사의 계약내용을 변경하는 경우에도 정부에 책임있는 사유 또는 천재ㆍ지변 등 불가항력의 사유로 인한 경우를 제외하고는 그 계약금액을 증액할 수 없다.\n② 각 중앙관서의 장 또는 계약담당공무원은 일괄입찰의 경우 계약체결 이전에 실시설계적격자에게 책임이 없는 다음 각 호의 어느 하나에 해당하는 사유로 실시설계를 변경한 경우에는 계약체결 이후 즉시 설계변경에 의한 계약금액 조정을 하여야 한다.\n③제1항 또는 제2항의 경우에 계약금액을 조정하고자 할 때에는 다음 각호의 기준에 의한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:91의2","kind":"조문","type":"시행령","family":"nca","label":"제91조의2","title":null,"text":"제91조의2 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:92","kind":"조문","type":"시행령","family":"nca","label":"제92조","title":"평가","text":"제92조(평가) 각 중앙관서의 장 또는 계약담당공무원은 대형공사의 준공검사를 한 후에 평가단을 구성하여 당해 공사의 사업계획ㆍ시공과정ㆍ실적 및 효과등에 대하여 평가를 실시할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:92의2","kind":"조문","type":"시행령","family":"nca","label":"제92조의2","title":null,"text":"제7장 계약정보의 공개 등","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:93","kind":"조문","type":"시행령","family":"nca","label":"제93조","title":"계약실적보고","text":"제93조(계약실적보고) 각 중앙관서의 장 또는 계약담당공무원은 계약체결 또는 계약변경 후 30일 이내에 계약체결 및 계약변경에 관하여 재정경제부령이 정하는 사항을 재정경제부장관에게 제출하여야 한다. 다만, 제26조제1항제1호가목 중 작전상의 병력 이동에 따른 사유와 제26조제1항제1호나목 및 같은 항 제5호라목에 따른 사유로 인하여 체결한 수의계약의 경우에는 그러하지 아니하다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:94","kind":"조문","type":"시행령","family":"nca","label":"제94조","title":"계약심의위원회의 설치","text":"제94조(계약심의위원회의 설치)\n①각 중앙관서의 장 또는 그 소속기관의 장은 물품ㆍ공사ㆍ용역 등 다음 각 호의 사항에 관한 자문에 응하도록 하기 위하여 계약심의위원회를 설치ㆍ운영해야 한다.\n②제1항에 따른 계약심의위원회는 소속공무원, 계약에 관한 학식과 경험이 풍부한 사람 등으로 성별을 고려하여 구성한다.\n③제1항에 따른 계약심의위원회의 구성 및 운영에 관하여 필요한 세부사항은 각 중앙관서의 장이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:95","kind":"조문","type":"시행령","family":"nca","label":"제95조","title":null,"text":"제95조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:96","kind":"조문","type":"시행령","family":"nca","label":"제96조","title":"지정정보처리장치의 이용","text":"제96조(지정정보처리장치의 이용)\n① 삭제\n②각 중앙관서의 장 또는 계약담당공무원과 전자조달시스템을 관리ㆍ운영하는 조달청장은 제76조의 규정에 의한 부정당업자의 입찰참가자격제한, 제93조의 규정에 의한 계약실적보고, 그 밖의 계약과 관련된 정보를 당해 업무목적외의 용도로 사용하여서는 아니된다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:97","kind":"조문","type":"시행령","family":"nca","label":"제97조","title":null,"text":"제8장 기술제안입찰 등에 의한 계약","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:98","kind":"조문","type":"시행령","family":"nca","label":"제98조","title":"정의","text":"제98조(정의) 이 장에서 사용하는 용어의 뜻은 다음 각 호와 같다.\n1.\n1.  \"기술제안서\"란 입찰자가 발주기관이 교부한 설계서 등을 검토하여 공사비 절감방안, 공기단축방안, 공사관리방안 등을 제안하는 문서를 말한다.\n2.\n2.  \"실시설계 기술제안입찰\"이란 발주기관이 교부한 실시설계서 및 입찰안내서에 따라 입찰자가 제1호에 따른 기술제안서를 작성하여 입찰서와 함께 제출하는 입찰을 말한다.\n3.\n3.  \"기본설계 기술제안입찰\"이란 발주기관이 작성하여 교부한 기본설계서와 입찰안내서에 따라 입찰자가 제1호에 따른 기술제안서를 작성하여 입찰서와 함께 제출하는 입찰을 말한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:99","kind":"조문","type":"시행령","family":"nca","label":"제99조","title":"실시설계 기술제안입찰 및 기본설계 기술제안입찰의 입찰방법의 심의 등","text":"제99조(실시설계 기술제안입찰 및 기본설계 기술제안입찰의 입찰방법의 심의 등)\n① 각 중앙관서의 장은 제97조에서 정한 공사에 대하여 실시설계 기술제안입찰 또는 기본설계 기술제안입찰(이하 \"실시설계 기술제안입찰등\"이라 한다)을 실시하려는 경우 다음 각 호의 사항에 관하여 중앙건설기술심의위원회의 심의를 거쳐야 한다.\n② 각 중앙관서의 장은 제1항에 따라 중앙건설기술심의위원회의 심의를 받으려는 때에는 해당 연도 이후에 집행할 제97조에서 정한 공사의 집행기본계획서를 다음 각 호에서 정하는 순서에 따라 국토교통부장관에게 제출하여야 하며, 실시설계 기술제안입찰등의 집행기본계획서의 작성방법과 제출시기 등에 관한 사항은 재정경제부령으로 정한다.\n③ 제80조제3항과 제5항은 입찰방법 공고 등의 경우에 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:100","kind":"조문","type":"시행령","family":"nca","label":"제100조","title":"실시설계 기술제안입찰등의 입찰참가자격","text":"제100조(실시설계 기술제안입찰등의 입찰참가자격) 실시설계 기술제안입찰에 관하여는 제12조제1항을, 기본설계 기술제안입찰에 관하여는 제84조제1항을 각각 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:101","kind":"조문","type":"시행령","family":"nca","label":"제101조","title":null,"text":"제101조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:102","kind":"조문","type":"시행령","family":"nca","label":"제102조","title":"실시설계 기술제안입찰등의 낙찰자 결정방법 등 선택","text":"제102조(실시설계 기술제안입찰등의 낙찰자 결정방법 등 선택)\n① 각 중앙관서의 장 또는 계약담담공무원은 실시설계 기술제안입찰의 경우 제104조 본문에 따라 선정된 자를 대상으로 중앙건설기술심의위원회에서 공사의 목적 및 특성 등을 고려하여 다음 각 호의 어느 하나에 해당하는 방법 중 해당 공사에 가장 적합하다고 심의한 방법으로 낙찰자를 결정하여야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 기본설계 기술제안입찰의 경우 제106조제1항에 따라 기술제안적격으로 선정된 자를 대상으로 중앙건설기술심의위원회에서 공사의 목적 및 특성 등을 고려하여 다음 각 호의 어느 하나에 해당하는 방법 중 해당 공사에 가장 적합하다고 심의한 방법으로 실시설계적격자를 결정하여야 한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제1항 또는 제2항에 따라 선택된 낙찰자 및 실시설계적격자 결정방법을 입찰공고를 할 때에 명시하여야 한다.\n④ 각 중앙관서의 장은 제1항 및 제2항 각 호에 따른 낙찰자 및 실시설계적격자 결정방법에 필요한 기술제안점수ㆍ가격점수의 산출방법과 가중치, 기술과 가격 조정을 위한 산식, 그 밖에 필요한 사항을 정하여 입찰에 참가하려는 자가 열람할 수 있도록 하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:103","kind":"조문","type":"시행령","family":"nca","label":"제103조","title":"실시설계 기술제안입찰의 입찰절차","text":"제103조(실시설계 기술제안입찰의 입찰절차)\n① 각 중앙관서의 장 또는 계약담당공무원은 실시설계 기술제안입찰을 하는 경우 입찰자에게 다음 각 호의 내용을 포함한 기술제안서를 제출하게 하여야 한다. 다만, 공사의 특성 등을 고려하여 필요하면 그 내용의 일부를 변경할 수 있다.\n② 각 중앙관서의 장은 제1항에 따라 제출된 기술제안서의 평가를 위한 세부심사기준을 정하고 입찰에 참가하려는 자가 열람할 수 있도록 하여야 한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 기술제안서를 제출받은 때에는 중앙건설기술심의위원회에 해당 기술제안서의 적격여부에 대한 심의 및 점수 평가를 의뢰하고 중앙건설기술심의위원회는 의뢰받은 기술제안서의 타당성을 검토하여 기술제안서의 적격 여부 및 평가점수를 명백히 한 서류를 해당 중앙관서의 장 또는 계약담당공무원에게 통지하여야 한다.\n④ 각 중앙관서의 장 또는 계약담당공무원은 제3항에 따른 기술제안서 심의 및 점수 평가에 대하여는 기술자문위원회의 심의 및 점수 평가로 갈음할 수 있다.\n⑤ 중앙건설기술심의위원회 또는 기술자문위원회는 제3항 또는 제4항에 따라 기술제안서 심의를 하는 경우 기술제안서가 입찰의 기본계획 및 지침의 내용이나 설계서의 내용에 비추어 미비하거나 그 내용이 분명하지 아니한 경우에는 이에 대한 보완을 요구할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:104","kind":"조문","type":"시행령","family":"nca","label":"제104조","title":"실시설계 기술제안입찰의 낙찰자 결정","text":"제104조(실시설계 기술제안입찰의 낙찰자 결정) 각 중앙관서의 장 또는 계약담당공무원은 실시설계 기술제안입찰을 하는 경우 제103조제3항에 따른 통지를 받은 때에는 다음 각 호의 구분에 따른 예산을 초과하지 않는 금액으로 입찰한 입찰자 중 기술제안점수가 높은 순으로 최대 6명(적격으로 통지된 입찰자가 6명 미만인 경우에는 적격으로 통지된 모든 입찰자)을 선정한 후 제102조제1항에 따라 선택된 낙찰자 결정방법을 적용하여 낙찰자를 결정한다. 다만, 제103조제3항에 따른 기술제안적격자가 1명 이하인 경우에는 재공고입찰에 따라야 한다.\n1.\n1.  공사비가 계속비예산으로 계상된 공사: 계속비예산\n2.\n2.  공사비가 계속비예산으로 계상되지 않은 공사: 총공사예산","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:105","kind":"조문","type":"시행령","family":"nca","label":"제105조","title":"기본설계 기술제안입찰의 입찰절차","text":"제105조(기본설계 기술제안입찰의 입찰절차)\n① 각 중앙관서의 장 또는 계약담당공무원은 기본설계 기술제안입찰을 하는 경우 입찰자에게 다음 각 호의 내용을 포함한 기술제안서를 제출하게 하여야 한다. 다만, 공사의 특성 등을 고려하여 필요하면 그 내용의 일부를 변경할 수 있다.\n② 각 중앙관서의 장은 제1항에 따라 제출된 기술제안서의 평가를 위한 세부심사기준을 정하고 입찰에 참가하려는 자가 열람할 수 있도록 하여야 한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제106조제1항 본문에 따라 실시설계적격자로 선정된 자에 한정하여 실시설계서를 제출하게 하여야 하며, 실시설계서에 다음 각 호의 도서를 첨부하게 하여야 한다.\n④ 각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 어느 하나에 해당하는 경우에는 중앙건설기술심의위원회에 해당 기술제안서 또는 실시설계서의 적격여부에 대한 심의 및 점수 평가를 의뢰하고 중앙건설기술심의위원회는 의뢰받은 기술제안서 또는 실시설계서의 타당성을 검토하여 기술제안서 또는 실시설계서의 적격 여부 및 평가점수를 명백히 한 서류를 해당 중앙관서의 장 또는 계약담당공무원에게 통지하여야 한다.\n⑤ 각 중앙관서의 장 또는 계약담당공무원은 제4항에 따른 기술제안서 또는 실시설계서 심의 및 점수평가에 대하여는 기술자문위원회의 심의 및 점수평가로 갈음할 수 있다.\n⑥ 중앙건설기술심의위원회 또는 기술자문위원회는 제4항 또는 제5항에 따라 기술제안서 또는 실시설계서의 심의를 하는 경우 기술제안서 또는 실시설계서에 첨부된 도서가 입찰의 기본계획 및 지침의 내용이나 기본설계(실시설계서를 심의하는 경우에는 기술제안서를 포함한다)의 내용에 비추어 미비하거나 그 내용이 분명하지 아니한 경우에는 이에 대한 보완을 요구할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:106","kind":"조문","type":"시행령","family":"nca","label":"제106조","title":"기본설계 기술제안입찰의 낙찰자 선정","text":"제106조(기본설계 기술제안입찰의 낙찰자 선정)\n① 각 중앙관서의 장 또는 계약담당공무원은 기본설계 기술제안입찰의 경우 제105조제4항에 따른 통지를 받은 때에는 입찰자 중 기술제안점수가 높은 순으로 최대 6명(적격으로 통지된 입찰자가 6명 미만인 경우에는 적격으로 통지된 모든 입찰자)을 선정한 후 제102조제2항에 따른 실시설계적격자 결정방법을 적용하여 실시설계적격자를 결정한다. 다만, 제105조제4항에 따른 기술제안적격자가 1명 이하인 경우에는 재공고입찰에 의하여야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 제105조제4항 및 제5항에 따라 중앙건설기술심의위원회 또는 기술자문위원회로부터 해당 실시설계의 적격통지를 받은 때에는 그 실시설계서를 제출한 자를 낙찰자로 선정한다.\n③ 제87조제3항부터 제8항까지는 기본설계 기술제안입찰의 낙찰자결정에 관하여 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:107","kind":"조문","type":"시행령","family":"nca","label":"제107조","title":"기술제안입찰 제안서 작성비용 보상","text":"제107조(기술제안입찰 제안서 작성비용 보상)\n① 각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 어느 하나에 해당하는 자의 전부 또는 일부에 대해서는 예산의 범위에서 제안서 작성비용의 일부를 보상할 수 있다.\n② 제1항에 따른 보상비의 지급 기준과 절차 등에 관하여 필요한 사항은 재정경제부장관이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:108","kind":"조문","type":"시행령","family":"nca","label":"제108조","title":"설계변경으로 인한 계약금액조정","text":"제108조(설계변경으로 인한 계약금액조정) 설계변경으로 인한 계약금액 조정에 관하여 실시설계 기술제안입찰에 따른 공사계약의 경우에는 제65조를, 기본설계 기술제안입찰에 따른 공사계약의 경우에는 제91조를 각각 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:109","kind":"조문","type":"시행령","family":"nca","label":"제109조","title":"평가","text":"제109조(평가)\n① 각 중앙관서의 장 또는 계약담당공무원은 이 장에 의한 공사의 준공검사를 한후에 평가단을 구성하여 해당 공사의 발주방식의 적정성, 시공과정ㆍ실적 및 효과 등에 대하여 평가를 실시할 수 있다.\n② 제1항에 따른 평가단의 구성ㆍ운영, 그 밖에 평가에 관하여 필요한 사항은 각 중앙관서의 장이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:110","kind":"조문","type":"시행령","family":"nca","label":"제110조","title":null,"text":"제9장 이의신청과 국가계약분쟁조정위원회","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:111","kind":"조문","type":"시행령","family":"nca","label":"제111조","title":"국가계약분쟁조정위원회의 위원","text":"제111조(국가계약분쟁조정위원회의 위원)\n① 법 제29조제3항 각 호 외의 부분에서 \"대통령령으로 정하는 중앙행정기관 소속 공무원으로서 해당 기관의 장이 지명하는 사람\"이란 재정경제부ㆍ국토교통부ㆍ조달청과 그 밖에 재정경제부장관이 필요하다고 인정하는 중앙행정기관의 고위공무원단에 속하는 공무원으로서 해당 기관의 장이 지명하는 공무원 각 1명을 말한다.\n② 법 제29조제1항에 따른 국가계약분쟁조정위원회(이하 이 장에서 \"위원회\"라 한다)의 위원은 비상근으로 한다.\n③ 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:111의2","kind":"조문","type":"시행령","family":"nca","label":"제111조의2","title":"위원장의 직무","text":"제111조의2(위원장의 직무)\n① 위원장은 위원회를 대표하고, 위원회의 업무를 총괄한다.\n② 위원장이 부득이한 사유로 직무를 수행할 수 없을 때에는 재정경제부장관이 지명하는 위원이 그 직무를 대행한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:111의3","kind":"조문","type":"시행령","family":"nca","label":"제111조의3","title":"위원의 제척ㆍ기피ㆍ회피","text":"제111조의3(위원의 제척ㆍ기피ㆍ회피)\n① 위원회의 위원은 다음 각 호의 어느 하나에 해당하는 경우에는 해당 안건에 대한 심사ㆍ조정에서 제척(除斥)된다.\n② 해당 안건의 당사자는 위원에게 공정한 심사ㆍ조정을 기대하기 어려운 사정이 있는 경우에는 기피 신청을 할 수 있다. 이 경우 위원장은 이 기피 신청에 대하여 위원회의 의결을 거치지 않고 기피 여부를 결정한다.\n③ 위원이 제1항 각 호의 제척 사유와 제2항의 기피 사유에 해당하는 경우에는 스스로 그 안건의 심사ㆍ조정에서 회피(回避)해야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:111의4","kind":"조문","type":"시행령","family":"nca","label":"제111조의4","title":"위원의 지명철회","text":"제111조의4(위원의 지명철회) 법 제29조제3항에 따라 위원을 지명한 자는 해당 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 그 지명을 철회할 수 있다.\n1.\n1.  심신쇠약으로 직무를 수행할 수 없게 된 경우\n2.\n2.  직무와 관련된 비위사실이 있는 경우\n3.\n3.  직무태만, 품위손상이나 그 밖의 사유로 위원으로서 적합하지 않다고 인정되는 경우\n4.\n4.  위원 스스로 직무를 수행하기 어렵다는 의사를 밝히는 경우\n5.\n5.  제111조의3제1항 또는 제2항의 사유에 해당하는데도 불구하고 회피하지 않은 경우","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:111의5","kind":"조문","type":"시행령","family":"nca","label":"제111조의5","title":"위원회의 회의","text":"제111조의5(위원회의 회의)\n① 위원장은 위원회의 회의를 소집하며, 그 의장이 된다.\n② 위원회의 회의는 재적위원 과반수의 출석으로 개의(開議)하고, 출석위원 과반수의 찬성으로 의결한다.\n③ 위원회에 위원회의 사무를 처리하기 위해 간사 1명을 둔다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 위원회의 운영에 필요한 사항은 위원회의 위원장이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:111의6","kind":"조문","type":"시행령","family":"nca","label":"제111조의6","title":"소위원회","text":"제111조의6(소위원회)\n① 위원회의 업무를 효율적으로 처리하기 위해 위원회에 다음 각 호의 소위원회(이하 이 장에서 \"소위원회\"라 한다)를 둘 수 있다.\n② 제1항제1호의 공사분야소위원회는 건설ㆍ전기통신 등 공사계약과 관련된 분쟁의 심사ㆍ조정에 관한 사항을 담당한다.\n③ 제1항제2호의 물품ㆍ용역분야소위원회는 물품의 제조ㆍ구매ㆍ임차계약 및 용역계약(「방위사업법」 제3조제14호에 따른 국방조달계약은 제외한다)과 관련된 분쟁의 심사ㆍ조정에 관한 사항을 담당한다.\n④ 제1항제3호의 국방ㆍ방산분야소위원회는 「방위사업법」 제3조제14호에 따른 국방조달계약과 관련된 분쟁의 심사ㆍ조정에 관한 사항을 담당한다.\n⑤ 소위원회의 위원장은 위원회의 위원 중 위원회의 위원장이 지명하는 사람이 된다.\n⑥ 소위원회의 회의는 소위원회의 위원장과 위원회의 위원장이 회의마다 지정하는 6명 이상 9명 이하의 위원회의 위원으로 구성한다.\n⑦ 소위원회는 위원회에 심사ㆍ조정청구된 안건에 대해 미리 심사하여 조정안을 작성할 수 있다. 이 경우 조정안을 작성하기 전에 청구인 및 해당 중앙관서의 장과 그 대리인에게 의견을 진술할 기회를 주어야 하며, 필요한 경우에는 청구인 및 해당 중앙관서의 장과 그 대리인, 증인 또는 관계 전문가로 하여금 소위원회에 출석하게 하여 그 의견을 들을 수 있다.\n⑧ 소위원회는 제7항에 따라 조정안을 작성한 경우 이를 위원회에 상정해야 한다.\n⑨ 소위원회의 회의 및 심사에 관하여는 제111조의5 및 제112조제2항을 준용한다. 이 경우 \"위원회\"는 \"소위원회\"로, \"위원회의 위원장\"은 \"소위원회의 위원장\"으로 본다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:111의7","kind":"조문","type":"시행령","family":"nca","label":"제111조의7","title":"수당","text":"제111조의7(수당) 위원회 및 소위원회에 출석한 위원 및 관계 전문가에 대해서는 예산의 범위에서 수당을 지급할 수 있다. 다만, 공무원인 위원이 그 소관 업무와 직접 관련되어 위원회 또는 소위원회에 출석하는 경우에는 그렇지 않다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:112","kind":"조문","type":"시행령","family":"nca","label":"제112조","title":"심사","text":"제112조(심사)\n① 법 제30조제1항에 따라 심사ㆍ조정 청구의 사실을 통지받은 중앙관서의 장은 통지를 받은 날부터 14일 이내에 이에 대한 의견을 서면으로 위원회에 제출하여야 한다.\n② 위원회는 필요한 경우 청구인 및 해당 중앙관서의 장에게 심사ㆍ조정이 요청된 사항에 관한 서류의 제출을 요구할 수 있으며, 관계 전문기관에 감정ㆍ진단과 시험 등을 의뢰할 수 있다.\n③ 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:113","kind":"조문","type":"시행령","family":"nca","label":"제113조","title":"조정","text":"제113조(조정)\n① 위원회는 조정청구의 심사 결과에 대하여 조정안을 작성하여 이를 청구인 및 해당 중앙관서의 장에게 알려야 한다.\n② 제1항에 따른 조정안을 작성할 때 법 제28조제1항에 따른 행위로 청구인이 불이익을 받았다고 인정되는 경우에는 해당 중앙관서의 장 또는 계약담당공무원이 행한 행위를 취소 또는 시정하거나 그에 따른 손해배상 또는 손실보상을 하도록 하여야 한다.\n③ 제2항에 따른 손해배상 또는 손실보상은 입찰 준비와 조정의 청구 과정에서 드는 비용으로 한정할 수 있다.\n④ 각 중앙관서의 장은 법 제31조제3항에 따라 이의를 제기하려는 경우에는 제94조제1항에 따른 계약심의위원회의 자문을 거쳐 이의를 제기하는 취지와 사유 등이 포함된 서면을 위원회에 제출하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:114","kind":"조문","type":"시행령","family":"nca","label":"제114조","title":"조정의 중지","text":"제114조(조정의 중지) 위원회는 위원회에 조정청구된 것과 같은 사안에 대하여 법원의 소송이 진행 중인 경우 그 심사ㆍ조정을 중지할 수 있다. 이 경우 중지 사유를 청구인 및 해당 중앙관서의 장에게 알려야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:114의2","kind":"조문","type":"시행령","family":"nca","label":"제114조의2","title":"소송 관련 사실의 통지","text":"제114조의2(소송 관련 사실의 통지) 각 중앙관서의 장은 제113조에 따른 조정 결과에 불복하여 소송이 제기되거나 제114조에 따른 소송이 제기된 경우에는 그 사실 및 소송 결과를 재정경제부장관에게 알려야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:115","kind":"조문","type":"시행령","family":"nca","label":"제115조","title":"비용부담","text":"제115조(비용부담)\n① 청구인은 위원회의 심사ㆍ조정과 관련한 비용을  부담한다. 다만, 청구인과 해당 중앙관서의 장 간에 약정이 있는 경우에는 그 약정에 따른다.\n② 위원회의 심사ㆍ조정과 관련한 비용 부담에 관한 구체적인 사항은 재정경제부령으로 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:116","kind":"조문","type":"시행령","family":"nca","label":"제116조","title":null,"text":"제10장 보칙","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:117","kind":"조문","type":"시행령","family":"nca","label":"제117조","title":"규제의 재검토","text":"제117조(규제의 재검토) 재정경제부장관은 다음 각 호의 사항에 대하여 다음 각 호의 기준일을 기준으로 3년마다(매 3년이 되는 해의 기준일과 같은 날 전까지를 말한다) 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.\n1.\n1.  제21조제1항제6호에 따른 지역제한경쟁입찰: 2014년 1월 1일\n2.\n2.  삭제\n3.\n3.  삭제\n4.\n4.  삭제\n5.\n5.  삭제\n6.\n6.  제76조에 따른 부정당업자의 입찰참가자격 제한: 2014년 1월 1일","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:118","kind":"조문","type":"시행령","family":"nca","label":"제118조","title":"부정당업자의 입찰참가 제한 및 벌칙 적용에서의 공무원 의제","text":"제118조(부정당업자의 입찰참가 제한 및 벌칙 적용에서의 공무원 의제) 법 제27조제1항제7호 및 제35조제3호에서 \"대통령령으로 정하는 위원회\"란 각각 다음 각 호의 위원회를 말한다.\n1.\n1.  제42조제7항에 따른 종합심사낙찰제심사위원회\n2.\n2.  제43조제8항에 따른 제안서평가위원회\n3.\n3.  제94조제1항에 따른 계약심의위원회","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"law:nca-r","kind":"법령","type":"시행규칙","family":"nca","label":"국가계약법 시행규칙","name":"국가를 당사자로 하는 계약에 관한 법률 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:1","kind":"조문","type":"시행규칙","family":"nca","label":"제1조","title":null,"text":"제1장 총칙","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:2","kind":"조문","type":"시행규칙","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 규칙에서 사용하는 용어의 정의는 다음과 같다.\n1.\n1.  \"계약담당공무원\"이라 함은 세입의 원인이 되는 계약에 관한 사무를 각 중앙관서의 장으로부터 위임 받은 공무원, 「국고금관리법」 제22조의 규정에 의한 재무관(대리재무관ㆍ분임재무관 및 대리분임재무관을 포함한다. 이하 같다), 「국가를 당사자로 하는 계약에 관한 법률」(이하 \"법\"이라 한다) 제6조제1항의 규정에 의한 계약관(대리계약관ㆍ분임계약관 및 대리분임계약관을 포함한다. 이하 같다) 및 「국고금관리법」 제24조의 규정에 의하여 지출관으로부터 자금을 교부받아 지급원인행위를 할 수 있는 관서운영경비출납공무원(대리관서운영경비출납공무원ㆍ분임관서운영경비출납공무원 및 대리분임관서운영경비출납공무원을 포함한다. 이하 같다)과 기타 법령에 의하여 세입세출외의 자금 또는 기금의 출납의 원인이 되는 계약을 담당하는 공무원을 말한다.\n2.\n2.  \"추정금액\"이라 함은 공사에 있어서 「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"영\"이라 한다) 제2조제1호에 따른 추정가격에 「부가가치세법」에 따른 부가가치세와 관급재료로 공급될 부분의 가격을 합한 금액을 말한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:3","kind":"조문","type":"시행규칙","family":"nca","label":"제3조","title":"적용범위","text":"제3조(적용범위) 각 중앙관서의 장 또는 계약담당공무원은 계약에 관한 사무를 처리함에 있어서 다른 법령에 특별한 규정이 있는 경우를 제외하고는 이 규칙이 정하는 바에 의한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:4","kind":"조문","type":"시행규칙","family":"nca","label":"제4조","title":null,"text":"제2장 예정가격","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:5","kind":"조문","type":"시행규칙","family":"nca","label":"제5조","title":"거래실례가격 및 표준시장단가에 따른 예정가격의 결정","text":"제5조(거래실례가격 및 표준시장단가에 따른 예정가격의 결정)\n①영 제9조제1항제1호에 따른 거래실례가격으로 예정가격을 결정함에 있어서는 다음 각 호의 어느 하나에 해당하는 가격으로 하되, 해당거래실례가격에 제6조제1항제4호 및 제5호에 따른 일반관리비 및 이윤을 따로 가산하여서는 아니된다.\n②영 제9조제1항제3호에 따른 표준시장단가에 따라 예정가격을 결정할 때에 이미 수행한 공사의 종류별 계약단가, 입찰단가와 시공단가 등을 토대로 시장상황과 시공상황을 고려하여 산정하되, 이와 관련하여 필요한 사항은 재정경제부장관이 정한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:6","kind":"조문","type":"시행규칙","family":"nca","label":"제6조","title":"원가계산에 의한 예정가격의 결정","text":"제6조(원가계산에 의한 예정가격의 결정)\n①공사ㆍ제조ㆍ구매(수입물품의 구매는 제외한다) 및 용역의 경우 영 제9조제1항제2호에 따라 원가계산에 의한 가격으로 예정가격을 결정함에 있어서는 그 예정가격에 다음 각 호의 비목을 포함시켜야 한다.\n②수입물품을 구매하는 경우 원가계산에 의한 가격으로 예정가격을 결정함에 있어서는 그 예정가격에 다음 각호의 비목을 포함시켜야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 제1항 또는 제2항의 규정에 의하여 예정가격을 결정함에 있어서는 예정가격조서에 제1항 각호 또는 제2항 각호의 사항을 명백히 하여야 한다.\n④재료비ㆍ노무비 및 경비의 비목은 재정경제부장관이 따로 정한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:7","kind":"조문","type":"시행규칙","family":"nca","label":"제7조","title":"원가계산을 할 때 단위당 가격의 기준","text":"제7조(원가계산을 할 때 단위당 가격의 기준)\n①제6조제1항에 따른 원가계산을 할 때 단위당 가격은 다음 각 호의 어느 하나에 해당하는 가격을 말하며, 그 적용순서는 다음 각 호의 순서에 의한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항제1호에 따른 가격을 적용함에 있어 다음 각 호의 어느 하나에 해당하는 경우에는 해당 노임단가에 그 노임단가의 100분의 15 이하에 해당하는 금액을 가산할 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:8","kind":"조문","type":"시행규칙","family":"nca","label":"제8조","title":"원가계산에 의한 예정가격 결정시의 일반관리비율 및 이윤율","text":"제8조(원가계산에 의한 예정가격 결정시의 일반관리비율 및 이윤율)\n①원가계산에 의한 가격으로 예정가격을 결정함에 있어서 일반관리비의 비율은 다음 각 호의 구분에 따른 비율을 초과하지 못한다.\n②원가계산에 의한 가격으로 예정가격을 결정할 때 이윤율은 다음 각 호의 어느 하나에 해당하는 율을 초과하지 못한다. 다만, 각 중앙관서의 장은 다음 각 호의 이윤율의 적용으로는 계약의 목적달성이 곤란하다고 인정되는 특별한 사유가 있는 경우에는 재정경제부장관과 협의하여 그 이윤율을 초과하여 정할 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:9","kind":"조문","type":"시행규칙","family":"nca","label":"제9조","title":"원가계산서의 작성등","text":"제9조(원가계산서의 작성등)\n①원가계산에 의한 가격으로 예정가격을 결정함에 있어서는 원가계산서를 작성하여야 한다. 다만, 각 중앙관서의 장 또는 계약담당공무원이 직접 원가계산 방법에 의하여 예정가격조서를 작성하는 경우에는 원가계산서를 따로 작성하지 아니할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 계약목적물의 내용ㆍ성질 등이 특수하여 스스로 원가계산을 하기 곤란한 경우에는 다음 각 호의 어느 하나에 해당하는 기관(이하 \"원가계산용역기관\"이라 한다)에 원가계산을 의뢰할 수 있다.\n③ 원가계산용역기관은 다음 각 호의 요건을 모두 갖추어야 한다.\n④ 제3항에 따른 원가계산용역기관의 세부 요건은 재정경제부장관이 정한다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 제2항에 따라 원가계산을 의뢰한 경우 원가계산용역기관으로 하여금 이 규칙 및 재정경제부장관이 정하는 바에 의하여 원가계산서를 작성하게 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:10","kind":"조문","type":"시행규칙","family":"nca","label":"제10조","title":"감정가격등에 의한 예정가격의 결정","text":"제10조(감정가격등에 의한 예정가격의 결정) 영 제9조제1항제4호의 규정에 의한 감정가격, 유사한 거래실례가격 또는 견적가격은 다음 각호의 1의 가격을 말하며, 그 적용순서는 다음 각호의 순서에 의한다.\n1.\n1.  감정가격: 「부동산가격공시 및 감정평가에 관한 법률」에 의한 감정평가법인 또는 감정평가사(「부가가치세법」 제8조에 따라 평가업무에 관한 사업자등록증을 교부받은 자에 한한다)가 감정평가한 가격\n2.\n2.  유사한 거래실례가격: 기능과 용도가 유사한 물품의 거래실례가격\n3.\n3.  견적가격: 계약상대자 또는 제3자로부터 직접 제출받은 가격","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:11","kind":"조문","type":"시행규칙","family":"nca","label":"제11조","title":"예정가격결정시의 세액합산등","text":"제11조(예정가격결정시의 세액합산등)\n①예정가격에는 다음 각 호의 세액을 포함시켜야 한다.\n②제1항의 규정을 적용함에 있어서 원가계산에 의한 가격으로 예정가격을 결정하는 경우 그 예정가격은 제6조제1항 또는 제2항의 규정에 의하여 계산한 금액에 제1항 각호의 세액을 합하여 이를 계산한다. 이 경우 원가계산의 비목별 원재료의 단위당 가격은 제1항 각호의 세액을 감한 공급가액으로 하며, 제1항제1호의 부가가치세는 당해계약목적물의 공급가액에 부가가치세율을 곱하여 산출한다.\n③제2항의 규정을 적용함에 있어서 「부가가치세법」 제26조제1항 또는 「조세특례제한법」 제106조제1항의 규정에 의하여 부가가치세가 면제되는 재화 또는 용역을 공급하는 자와 계약을 체결하기 위하여 예정가격을 결정하는 경우에는 당해 계약상대자가 부담할 비목별 원재료의 부가가치세 매입세액해당액을 제6조제1항의 규정에 의하여 계산한 금액에 합산한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:12","kind":"조문","type":"시행규칙","family":"nca","label":"제12조","title":"희망수량경쟁입찰시 예정가격의 결정","text":"제12조(희망수량경쟁입찰시 예정가격의 결정)\n①영 제17조의 규정에 의한 희망수량경쟁입찰에 있어서의 예정가격은 당해 물품의 단가로 이를 정하여야 한다.\n②제1항의 경우 국고의 부담이 되는 물품의 제조 또는 구매에 관한 입찰인 때에는 그 입찰에 부치고자 하는 물품의 총수량을 기준으로 한 예정가격조서에 의하여 당해물품의 단가를 정하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:13","kind":"조문","type":"시행규칙","family":"nca","label":"제13조","title":"예정가격의 변경","text":"제13조(예정가격의 변경) 각 중앙관서의 장 또는 계약담당공무원은 영 제20조제2항의 규정에 의한 재공고입찰에 있어서도 입찰자 또는 낙찰자가 없는 경우로서 당초의 예정가격으로는 영 제27조제1항의 규정에 의한 수의계약을 체결할 수 없는 때에는 당초의 예정가격을 변경하여 새로운 절차에 의한 경쟁입찰에 부칠 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:14","kind":"조문","type":"시행규칙","family":"nca","label":"제14조","title":null,"text":"제3장 계약의 방법","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:15","kind":"조문","type":"시행규칙","family":"nca","label":"제15조","title":"입찰참가자격의 등록","text":"제15조(입찰참가자격의 등록)\n①각 중앙관서의 장 또는 계약담당공무원은 경쟁입찰업무를 효율적으로 집행하기 위하여 미리 경쟁입찰참가자격의 등록을 하게 할 수 있다. 등록된 사항이 변경된 때에도 또한 같다.\n②제1항에 따라 경쟁입찰참가자격의 등록을 하려는 자는 다음 각 호의 구분에 따른 서류를 제출하여야 한다.\n③제2항에 따라 입찰참가자격의 등록신청을 받은 각 중앙관서의 장 또는 계약담당 공무원은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서, 공장등록증명서(제조등록의 경우에만 해당한다) 및 다음 각 호의 서류를 확인하여야 한다. 다만, 경쟁입찰참가자격의 등록을 신청하려는 자가 다음 각 호의 서류 확인에 동의하지 아니하는 경우에는 그 서류(사업자등록증의 경우에는 그 사본을 말한다)를 첨부하도록 하여야 한다.\n④각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 입찰참가자격을 등록한 자에게 별지 제1호서식의 경쟁입찰참가자격등록증을 교부하여야 한다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 등록을 받은 경우에는 전자조달시스템에 게재하여야 한다. 이 경우 전자조달시스템에 게재된 등록사항은 다른 중앙관서의 장 또는 계약담당공무원에게도 등록한 것으로 본다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 당해 관서의 경쟁입찰업무에만 활용하기 위하여 경쟁입찰참가자격의 등록을 하게 할 수 있다. 이 경우 제5항은 적용하지 아니한다.\n⑦각 중앙관서의 장 또는 계약담당공무원은 경쟁입찰참가자격의 등록과 관련된 다음 각호의 사항을 전자조달시스템에 게재하여야 한다.\n⑧조달청장은 제5항에 따라 전자조달시스템에 게재된 등록사항에 대하여 별도의 유효기간을 둘 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:16","kind":"조문","type":"시행규칙","family":"nca","label":"제16조","title":"입찰참가자격에 관한 서류의 확인등","text":"제16조(입찰참가자격에 관한 서류의 확인등)\n①각 중앙관서의 장 또는 계약담당공무원은 입찰참가자에 대하여 입찰참가자격의 유무 및 영 제76조의 규정에 의한 입찰참가자격제한의 여부를 확인하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 확인을 한 결과 자격서류의 내용이 사실과 다른 때에는 그 사실을 당해서류의 제출자에게 통지하고 서류보완등에 필요한 적절한 조치를 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:17","kind":"조문","type":"시행규칙","family":"nca","label":"제17조","title":"입찰참가자격의 부당한 제한금지","text":"제17조(입찰참가자격의 부당한 제한금지) 각 중앙관서의 장 또는 계약담당공무원은 영, 이 규칙 및 다른 법령에 특별한 규정이 있는 경우외에는 영 제12조의 규정에 의한 경쟁입찰참가자격외의 요건을 정하여 입찰참가를 제한하여서는 아니된다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:18","kind":"조문","type":"시행규칙","family":"nca","label":"제18조","title":"입찰참가자격요건 등록등의 배제","text":"제18조(입찰참가자격요건 등록등의 배제) 다음 각 호의 어느 하나에 해당하는 경우에는 제14조부터 제16조까지의 규정을 적용하지 아니한다. 다만, 영 제76조에 따른 입찰참가자격제한의 여부에 관한 확인은 그러하지 아니하다.\n1.\n1.  국가ㆍ지방자치단체 또는 「공공기관의 운영에 관한 법률」에 따른 공공기관이 경쟁입찰에 참가하려는 경우\n2.\n2.  세입의 원인이 되는 계약을 하는 경우","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:19","kind":"조문","type":"시행규칙","family":"nca","label":"제19조","title":"희망수량경쟁입찰의 대상범위","text":"제19조(희망수량경쟁입찰의 대상범위) 영 제17조의 규정에 의하여 희망수량경쟁입찰의 방법에 의할 수 있는 경우는 다음 각호의 1과 같다.\n1.\n1.  1인의 능력이나 생산시설로는 그 공급이 불가능하거나 곤란하다고 인정되는 다량의 동일물품을 제조하게 하거나 구매할 경우\n2.\n2.  1인의 능력으로는 그 매수가 불가능하거나 곤란하다고 인정되는 다량의 동일물품을 매각할 경우\n3.\n3.  수인의 공급자 또는 매수자와 분할계약하는 것이 가격ㆍ품질 기타 조건에 있어서 국가에 유리하다고 인정되는 다량의 동일물품을 제조ㆍ구매 또는 매각할 경우","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:20","kind":"조문","type":"시행규칙","family":"nca","label":"제20조","title":"희망수량경쟁입찰의 입찰공고","text":"제20조(희망수량경쟁입찰의 입찰공고) 희망수량경쟁입찰에 의하는 경우의 입찰공고에는 다음 각호의 사항을 명시하여야 한다.\n1.\n1.  희망수량에 의한 일반경쟁입찰이라는 사항\n2.\n2.  영 제36조 각호의 사항\n3.\n3.  제47조제2항의 규정에 의한 입찰수량과 낙찰수량의 조정에 관한 사항\n4.\n4.  기타 희망수량경쟁입찰에 관하여 필요한 사항","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:21","kind":"조문","type":"시행규칙","family":"nca","label":"제21조","title":"2종이상의 물품에 대한 희망수량경쟁입찰","text":"제21조(2종이상의 물품에 대한 희망수량경쟁입찰) 각 중앙관서의 장 또는 계약담당공무원은 2종이상의 물품에 대하여 희망수량경쟁입찰에 부치고자 하는 경우에는 물품의 종류별로 단가 및 수량에 대하여 입찰을 하게 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:22","kind":"조문","type":"시행규칙","family":"nca","label":"제22조","title":"경매","text":"제22조(경매)\n①각 중앙관서의 장 또는 계약담당공무원은 영 제10조제2항의 규정에 의한 경매에 있어서는 예정가격을 제시하여 입찰하게 하고 최고입찰액을 발표한 후 다른 응찰자가 없을 때까지 다시 입찰하게 하여 최고가격의 입찰자를 낙찰자로 결정하여야 한다.\n②제1항의 규정에 의한 입찰의 경우 입찰보증금은 예정가격의 100분의 5 이상으로 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:23","kind":"조문","type":"시행규칙","family":"nca","label":"제23조","title":"계약이행의 성실도 평가 시 고려요소","text":"제23조(계약이행의 성실도 평가 시 고려요소) 각 중앙관서의 장 또는 계약담당공무원이 영 제13조제2항에 따라 계약이행의 성실도를 평가할 때에는 법 제5조의2제1항에 따른 청렴계약 준수정도, 「건설기술진흥법」 제53조에 따른 부실벌점, 같은 법 제50조에 따른 평가결과 등을 고려하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:23의2","kind":"조문","type":"시행규칙","family":"nca","label":"제23조의2","title":"입찰참가자격 사전심사 절차","text":"제23조의2(입찰참가자격 사전심사 절차)\n① 영 제13조제4항 각 호 외의 부분 본문에 따른 열람 및 교부 기간은 입찰공고일부터 입찰참가자격 사전심사 신청 마감일까지로 한다.\n② 제1항에 따른 입찰참가자격 사전심사 신청은 입찰공고일부터 7일 이상이 지난 날부터 하도록 하여야 하며, 신청기간은 10일 이상으로 하되, 입찰공고 시 그 신청기간을 명시하여야 한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 입찰참가자격 사전심사 신청 서류의 내용이 불명확하거나 누락된 서류가 있는 경우에는 3일 이내의 기간을 정하여 보완을 요구할 수 있다.\n④ 각 중앙관서의 장 또는 계약담당공무원은 제2항에 따른 신청기간 또는 제3항에 따른 보완기간이 끝난 날부터 10일 이내에 입찰참가자격을 사전심사하여 그 결과를 전자조달시스템에 게재하여야 한다.\n⑤ 입찰참가자격 사전심사를 신청한 자가 제4항에 따른 사전심사 결과에 이의가 있는 경우에는 영 제14조의2에 따른 현장설명일 3일 전까지 각 중앙관서의 장 또는 계약담당공무원에게 재심사를 요청할 수 있다. 이 경우 요청을 받은 날부터 3일 이내에 그 재심사 결과를 통지하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:23의3","kind":"조문","type":"시행규칙","family":"nca","label":"제23조의3","title":"단순한 노무에 의한 용역","text":"제23조의3(단순한 노무에 의한 용역) 영 제18조제1항ㆍ제3항, 제64조제8항 및 제66조제2항에서 \"재정경제부령으로 정하는 용역\"이란 다음 각 호의 어느 하나에 해당하는 용역을 말한다.\n1.\n1.  청소용역\n2.\n2.  검침(檢針)용역\n3.\n3.  경비시스템 등에 의하지 아니하는 단순경비 또는 관리용역\n4.\n4.  행사보조 등 인력지원용역\n5.\n5.  그 밖에 제1호부터 제4호까지와 유사한 용역으로서 재정경제부장관이 정하는 용역","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:24","kind":"조문","type":"시행규칙","family":"nca","label":"제24조","title":"제한경쟁입찰의 대상","text":"제24조(제한경쟁입찰의 대상)\n①영 제21조제1항제1호에서 \"재정경제부령이 정하는 금액의 공사계약\"이란 추정가격이 다음 각 호의 금액 이상인 공사계약을 말한다.\n②영 제21조제1항제6호에서 \"재정경제부령으로 정하는 금액\"이란 다음 각 호의 금액을 말한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:25","kind":"조문","type":"시행규칙","family":"nca","label":"제25조","title":"제한경쟁입찰의 제한기준","text":"제25조(제한경쟁입찰의 제한기준)\n①각 중앙관서의 장 또는 계약담당공무원은 영 제21조제1항에 따라 제한경쟁입찰에 참가할 자의 자격을 제한하는 경우 이행의 난이도, 규모의 대소, 수급상황 등을 적정하게 고려해야 한다.\n②각 중앙관서의 장 또는 계약담당공무원이 영 제21조제1항제1호부터 제3호까지 및 제5호에 따라 공사ㆍ제조 또는 용역 등의 실적, 시공능력으로 제한경쟁입찰에 참가할 자의 자격을 제한하는 경우 그 실적, 시공능력은 다음 각 호의 기준에 따라야 한다.\n③ 영 제21조제1항제6호에 따라 법인등기부상 본점소재지(개인사업자인 경우에는 사업자등록증 또는 관련 법령에 따른 허가ㆍ인가ㆍ면허ㆍ등록ㆍ신고 등에 관련된 서류에 기재된 사업장의 소재지를 말한다. 이하 같다)를 기준으로 제한경쟁입찰에 참가할 자의 자격을 제한하는 경우에는 법인등기부상 본점소재지가 해당 공사 등의 현장ㆍ납품지 등이 소재하는 특별시ㆍ광역시ㆍ특별자치시ㆍ도 또는 특별자치도(이하 이 항에서 \"시ㆍ도\"라 한다)의 관할구역(「공공기관 지방이전에 따른 혁신도시 건설 및 지원에 관한 특별법」 제31조에 따른 공동혁신도시의 경우에는 해당 공동혁신도시 건설 공동 주체의 관할구역 전체를 말하며, 이하 이 항에서 같다) 안에 있는 자로 제한해야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 해당 공사 등의 현장ㆍ납품지 등이 있는 시ㆍ도에 인접한 시ㆍ도(이하 이 항에서 \"인접 시ㆍ도\"라 한다)의 관할구역 안에 있는 자를 포함해 제한할 수 있다.\n④광역시ㆍ특별자치시 또는 도의 관할구역내에서 특별시ㆍ광역시 또는 특별자치시가 신설(편입된 경우를 제외한다)되는 경우에는 그 신설된 날부터 3년간은 종전의 광역시ㆍ특별자치시 또는 도의 관할구역과 신설된 특별시ㆍ광역시 또는 특별자치시의 관할구역은 이를 분리하지 아니한 것으로 보아 제3항의 규정을 적용한다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 영 제21조제1항에 따라 제한경쟁입찰에 참가할 자의 자격을 제한함에 있어서 같은 항 각 호 또는 각 호 내의 사항을 중복적으로 제한하여서는 아니된다. 다만, 영 제21조제1항제6호의 사항에 따라 제한하는 경우에는 같은 항 제2호의 사항과 중복하여 제한할 수 있으며, 영 제21조제1항제8호 또는 제10호의 사항에 따라 제한하는 경우에는 같은 항 각 호의 사항과 중복하여 제한할 수 있다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 영 제22조의 규정에 의하여 공사를 성질별ㆍ규모별로 유형화하여 제한기준을 정하는 경우에는 제2항의 규정에 의한 제한기준에 의하지 아니할 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:26","kind":"조문","type":"시행규칙","family":"nca","label":"제26조","title":"제한경쟁입찰 참가자격통지","text":"제26조(제한경쟁입찰 참가자격통지)\n①각 중앙관서의 장 또는 계약담당공무원은 영 제21조제3항 또는 영 제22조제2항의 규정에 의하여 입찰참가적격자에게 입찰참가통지를 하는 경우에는 별지 제2호서식의 경쟁입찰참가통지서에 의하여야 한다.\n②제1항의 규정에 의한 입찰참가통지는 현장설명일 7일전(현장설명을 하지 아니하는 경우에는 입찰서 제출마감일 7일전)까지 하여야 한다. 다만, 긴급을 요하는 경우에는 입찰서 제출마감일 5일전까지 통지할 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:27","kind":"조문","type":"시행규칙","family":"nca","label":"제27조","title":"지명경쟁입찰의 지명기준","text":"제27조(지명경쟁입찰의 지명기준) 각 중앙관서의 장 또는 계약담당공무원은 영 제23조제1항제1호 내지 제3호ㆍ제6호 또는 제9호에 따라 지명경쟁입찰에 참가할 자를 지명하는 경우에는 다음 각 호의 기준에 의하여 지명하되, 경쟁원리가 적정하게 이루어지도록 하여야 한다.\n1.\n1.  공사\n가.\n가.  시공능력을 기준으로 지명하는 경우에는 제25조제2항제2호의 규정을 준용하여 지명할 것\n나.\n나.  신용과 실적 및 경영상태를 기준으로 업체를 지명하되 특수한 기술의 보유가 필요한 경우에는 이를 보유한 자를 지명할 것\n다.\n다.  삭제\n2.\n2.  물품의 제조ㆍ구매, 수리ㆍ가공 등\n  계약의 성질 또는 목적에 비추어 특수한 기술, 기계ㆍ기구, 생산설비 등을 보유하고 있는 자로 하여금 행하게 할 필요가 있는 경우에는 그 기술, 기계ㆍ기구, 생산설비등을 보유한 자를 지명할 것","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:28","kind":"조문","type":"시행규칙","family":"nca","label":"제28조","title":null,"text":"제28조 삭제","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:29","kind":"조문","type":"시행규칙","family":"nca","label":"제29조","title":"지명경쟁계약의 보고서류등","text":"제29조(지명경쟁계약의 보고서류등)\n①계약담당공무원은 영 제23조제2항에 따라 지명경쟁입찰에 의한 계약(이하 \"지명경쟁계약\"이라 한다)을 보고하고자 할 때에는 제49조제1항 또는 제3항에 따른 계약서(해당계약서에 첨부하여야 하는 서류를 포함한다. 이하 이 조에서 같다)의 사본과 다음 각 호의 사항을 명백히 한 서류를 그 소속 중앙관서의 장에게 제출하여야 한다.\n②각 중앙관서의 장은 영 제23조제2항에 따라 감사원에 지명경쟁계약의 내용을 통지하는 때에는 제1항에 따른 계약서의 사본 및 서류를 함께 제출하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 지명경쟁입찰참가자로 지명된 자로부터 제27조의 규정에 의한 지명기준에 적합함을 증명하는 서류를 제출받아 이를 비치하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:30","kind":"조문","type":"시행규칙","family":"nca","label":"제30조","title":"지명경쟁입찰 참가자격통지","text":"제30조(지명경쟁입찰 참가자격통지) 제26조의 규정은 지명경쟁입찰의 참가적격자에 대한 입찰참가통지에 관하여 이를 준용한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:31","kind":"조문","type":"시행규칙","family":"nca","label":"제31조","title":null,"text":"제31조 삭제","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:32","kind":"조문","type":"시행규칙","family":"nca","label":"제32조","title":"재공고입찰등에 의한 수의 계약시 계약상대자 결정","text":"제32조(재공고입찰등에 의한 수의 계약시 계약상대자 결정) 각 중앙관서의 장 또는 계약담당공무원은 영 제27조제1항제2호의 규정에 의하여 수의 계약을 체결하고자 할 때에는 국가에 가장 유리한 가격을 제시한 자를 계약상대자로 결정하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:33","kind":"조문","type":"시행규칙","family":"nca","label":"제33조","title":"견적에 의한 가격결정 등","text":"제33조(견적에 의한 가격결정 등)\n①영 제30조제2항 단서에서 \"전자조달시스템에 의한 견적서제출이 곤란한 경우로서 재정경제부령이 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n②각 중앙관서의 장 또는 계약담당공무원이 영 제30조제4항에 따라 법인등기부상 본점소재지를 기준으로 견적서제출을 제한하는 경우에는 법인등기부상 본점소재지가 해당공사의 현장, 물품의 납품지 등이 소재하는 특별시ㆍ광역시ㆍ특별자치시ㆍ도 또는 특별자치도의 관할구역 안에 있는 자로 제한하여야 한다. 다만, 공사의 현장, 물품의 납품지 등이 소재하는 시(행정시를 포함한다. 이하 이 항에서 같다)ㆍ군(도의 관할구역 안에 있는 군을 말한다. 이하 이 항에서 같다)에 해당계약의 이행에 필요한 자격을 갖춘 자가 5인 이상인 경우에는 그 시ㆍ군의 관할구역 안에 있는 자로 제한할 수 있다.\n③영 제30조제7항에서 \"재정경제부령이 정하는 경우\"란 다음 각 호의 경우를 말한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:34","kind":"조문","type":"시행규칙","family":"nca","label":"제34조","title":"희망수량경쟁입찰과 수의계약","text":"제34조(희망수량경쟁입찰과 수의계약) 각 중앙관서의 장 또는 계약담당공무원은 희망수량경쟁입찰에 있어서 낙찰자중 계약을 체결하지 아니한 자가 있는 경우에 영 제28조의 규정에 의하여 수의계약에 의할 때에는 물품의 제조나 구매에 있어서는 당해 낙찰자의 낙찰단가 이하로서, 물품의 매각에 있어서는 당해 낙찰자의 낙찰단가 이상으로 계약을 체결하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:35","kind":"조문","type":"시행규칙","family":"nca","label":"제35조","title":"수의계약의 보고서류등","text":"제35조(수의계약의 보고서류등)\n①계약담당공무원은 영 제26조제5항에 따라 수의계약을 보고하고자 할 때에는 제49조제1항 또는 제3항에 따른 계약서(해당계약서에 첨부하여야 하는 서류를 포함한다. 이하 이 조에서 같다)의 사본과 다음 각 호의 사항을 명백히 한 서류를 그 소속 중앙관서의 장에게 제출하여야 한다.\n②각 중앙관서의 장은 영 제26조제5항에 따라 감사원에 수의계약의 내용을 통지하는 때에는 제1항에 따른 계약서의 사본 및 서류를 함께 제출하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:36","kind":"조문","type":"시행규칙","family":"nca","label":"제36조","title":"수의계약 적용사유에 대한 근거서류","text":"제36조(수의계약 적용사유에 대한 근거서류) 각 중앙관서의 장 또는 계약담당공무원은 영 제26조제1항제1호가목ㆍ다목, 제2호, 제3호가목부터 마목까지, 제4호가목부터 라목까지 또는 제5호다목ㆍ라목에 따라 수의계약을 체결하려는 경우에는 그 적용사유에 해당되는지의 여부를 입증할 근거서류를 비치하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:37","kind":"조문","type":"시행규칙","family":"nca","label":"제37조","title":"경쟁계약에 관한 규정의 준용","text":"제37조(경쟁계약에 관한 규정의 준용) 제14조제1항 및 제2항은 수의계약의 경우에 준용한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:38","kind":"조문","type":"시행규칙","family":"nca","label":"제38조","title":null,"text":"제4장 입찰 및 낙찰절차","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:39","kind":"조문","type":"시행규칙","family":"nca","label":"제39조","title":"입찰참가의 통지등","text":"제39조(입찰참가의 통지등) 각 중앙관서의 장 또는 계약담당공무원은 영 제13조 또는 영 제34조의 규정에 의하여 당해입찰참가적격자에게 입찰참가통지를 하는 때에는 별지 제2호서식의 경쟁입찰참가통지서에 의한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:40","kind":"조문","type":"시행규칙","family":"nca","label":"제40조","title":"입찰 참가신청","text":"제40조(입찰 참가신청)\n①각 중앙관서의 장 또는 계약담당공무원은 경쟁 입찰에 부치고자 할 때에는 입찰참가신청인으로 하여금 다음 각호의 서류를 제출하게 하여야 한다. 다만, 제15조의 규정에 의하여 자격등록을 한 자에 대하여는 입찰 보증금의 납부로써 다음 각호의 서류의 제출에 갈음하게 할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 입찰참가신청인이 제1항 각호의 서류를 제출한 때에는 그 서류의 내용을 검토하여 이를 접수하고 필요한 사항에 대하여 사실조사를 할 수 있다.\n③각 중앙관서의 장 또는 계약담당공무원은 입찰참가신청서류를 접수한 때에는 별지 제4호서식의 입찰참가신청증을 교부하여야 한다. 다만, 우편입찰의 경우 기타 필요하지 아니하다고 인정되는 경우에는 이를 생략할 수 있다.\n④제1항 본문의 규정에 의하여 제출하는 입찰참가신청서류의 접수마감일은 입찰서 제출마감일 전일로 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:41","kind":"조문","type":"시행규칙","family":"nca","label":"제41조","title":"입찰에 관한 서류의 작성","text":"제41조(입찰에 관한 서류의 작성)\n①영 제14조제1항제3호에서 \"재정경제부령으로 정하는 서류\"란 다음 각 호의 서류를 말한다.\n② 영 제16조제1항 본문에서 \"재정경제부령으로 정하는 입찰에 관한 서류\"란 다음 각 호의 서류를 말한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:41의2","kind":"조문","type":"시행규칙","family":"nca","label":"제41조의2","title":null,"text":"제41조의2 삭제","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:42","kind":"조문","type":"시행규칙","family":"nca","label":"제42조","title":"입찰방법","text":"제42조(입찰방법)\n①각 중앙관서의 장 또는 계약담당공무원은 경쟁입찰에 참가하고자 하는 자로 하여금 별지 제5호서식(입찰 및 낙찰자 결정을 전산처리에 의하여 하고자 하는 경우에는 별지 제6호서식)의 입찰서를 제출하게 하여야 한다.\n②제1항의 규정에 의하여 제출하는 입찰서는 1인 1통으로 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 입찰에 참가하고자 하는 자가 별지 제3호서식의 입찰참가신청서를 제출하는 때부터 입찰 개시시각전까지 입찰대리인을 지정하거나 지정된 입찰대리인을 변경하는 경우에는 그 대리인을 당해입찰에 참가하게 할 수 있다.\n④각 중앙관서의 장 또는 계약담당공무원은 입찰서를 접수한 때에는 당해입찰서에 확인인을 날인하고 개찰시까지 개봉하지 아니하고 보관하여야 한다.\n⑤제1항에 따라 제출하는 입찰서에 사용되는 인감(서명을 포함한다. 이하 이 항에서 같다)은 입찰참가신청서 제출시 신고한 인감과 같아야 한다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 영 제44조제1항의 규정에 의하여 물품의 제조 또는 구매계약을 체결하고자 하는 때에는 입찰시에 입찰자로 하여금 입찰서와 함께 당해 물품의 품질ㆍ성능ㆍ효율등이 표시된 품질등의 표시서(이하 \"품질등 표시서\"라 한다)를 제출하게 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:43","kind":"조문","type":"시행규칙","family":"nca","label":"제43조","title":"입찰보증금의 납부","text":"제43조(입찰보증금의 납부)\n①각 중앙관서의 장 또는 계약담당공무원은 입찰참가자로 하여금 입찰신청마감일까지 별지 제3호서식의 입찰참가신청서와 함께 소정절차에 따라 영 제37조에 따른 입찰보증금을 납부하게 하여야 한다. 다만, 영 제37조제2항제4호에 따른 보증서 중 1회계연도내의 모든 입찰(공사의 경우로 한정한다)에 대한 입찰보증금으로 납부할 수 있는 보증서의 경우에는 재정경제부장관이 정하는 바에 의하여 매 회계연도초에 이를 제출하게 할 수 있다.\n②영 제37조제4항의 규정에 의한 입찰보증금에 해당하는 금액의 지급을 확약하는 내용의 문서는 별지 제3호서식의 입찰참가신청서에 따라 입찰참가신청을 하거나 입찰서를 제출하는 때에 이를 제출하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:44","kind":"조문","type":"시행규칙","family":"nca","label":"제44조","title":"입찰무효","text":"제44조(입찰무효)\n①영 제39조제4항에 따라 무효로 하는 입찰은 다음과 같다.\n② 제1항에도 불구하고 영 제72조에 따라 공동수급체를 구성한 입찰자의 대표자 외의 구성원이 제1항 각 호의 사유에 해당하는 경우에는 해당 구성원에 대해서만 입찰을 무효로 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:45","kind":"조문","type":"시행규칙","family":"nca","label":"제45조","title":"입찰무효의 이유표시","text":"제45조(입찰무효의 이유표시) 각 중앙관서의 장 또는 계약담당공무원은 입찰을 무효로 하는 경우에는 무효여부를 확인하는데 장시간이 소요되는 등 부득이한 사유가 없는 한 개찰장소에서 개찰에 참가한 입찰자에게 이유를 명시하고 그 뜻을 알려야 한다. 다만, 영 제39조제1항에 따라 전자조달시스템 또는 각 중앙관서의 장이 지정ㆍ고시한 정보처리장치를 이용하여 입찰서를 제출하게 하는 경우에는 입찰공고에 표시한 절차와 방법으로 입찰자에게 입찰무효의 이유를 명시하고 그 뜻을 알려야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:46","kind":"조문","type":"시행규칙","family":"nca","label":"제46조","title":"특정물품의 제조 또는 구매시의 품질등에 의한 낙찰자 결정","text":"제46조(특정물품의 제조 또는 구매시의 품질등에 의한 낙찰자 결정) 각 중앙관서의 장 또는 계약담당공무원은 영 제44조제1항의 규정에 의하여 낙찰자를 결정함에 있어서는 제42조제6항의 규정에 의하여 입찰서와 함께 제출된 품질등 표시서를 영 제44조제2항의 규정에 의한 평가기준에 따라 평가하고 특별한 사유가 없는 한 입찰일 또는 개찰일부터 10일 이내에 낙찰자를 결정하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:47","kind":"조문","type":"시행규칙","family":"nca","label":"제47조","title":"희망수량경쟁입찰의 낙찰자 결정","text":"제47조(희망수량경쟁입찰의 낙찰자 결정)\n①각 중앙관서의 장 또는 계약담당공무원은 영 제45조 또는 영 제46조의 규정에 의한 희망수량경쟁입찰의 낙찰자 결정에 있어서 낙찰자가 될 동가의 입찰자가 2인이상 있을 때에는 입찰수량이 많은 자를 우선순위의 낙찰자로 하며, 입찰수량이 동일한 때에는 영 제47조의 규정에 준하여 추첨으로 낙찰자를 결정한다.\n②제1항의 규정에 의하여 낙찰자를 결정함에 있어서 최후순위의 낙찰자의 수량이 다른 낙찰자의 수량과 합산하여 수요량 또는 매각량을 초과하는 경우에는 그 초과하는 수량은 이를 낙찰되지 아니한 것으로 본다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:48","kind":"조문","type":"시행규칙","family":"nca","label":"제48조","title":"개찰 및 낙찰선언","text":"제48조(개찰 및 낙찰선언)\n①각 중앙관서의 장 또는 계약담당공무원은 지정된 시간까지 입찰서를 접수한 때에는 입찰서의 접수마감을 선언하고, 입찰자의 참석하에 입찰서를 개봉하여야 한다. 다만, 영 제39조제1항에 따라 전자조달시스템 또는 각 중앙관서의 장이 지정ㆍ고시한 정보처리장치를 이용하여 입찰서를 제출하게 하는 경우에는 입찰공고에 표시한 절차와 방법으로 입찰서의 접수를 마감하고 입찰서를 개봉하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 영 제18조제3항에 따라 규격과 가격 또는 기술과 가격입찰을 동시에 실시하는 경우에는 영 제11조의 규정에 의하여 2인이상의 유효한 입찰로 성립한 규격입찰 또는 기술입찰의 개찰결과 규격적격자 또는 기술적격자로 확정된 자가 1인인 경우에도 가격입찰서를 개봉할 수 있다.\n③ 삭제","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:49","kind":"조문","type":"시행규칙","family":"nca","label":"제49조","title":null,"text":"제5장 계약의 체결 및 이행","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:50","kind":"조문","type":"시행규칙","family":"nca","label":"제50조","title":"계약서의 작성을 생략하는 경우","text":"제50조(계약서의 작성을 생략하는 경우) 각 중앙관서의 장 또는 계약담당공무원은 영 제49조에 따라 계약서의 작성을 생략하는 경우에는 계약상대자로부터 청구서ㆍ각서ㆍ협정서ㆍ승낙사항등 계약성립의 증거가 될 수 있는 서류를 제출받아 비치하여야 한다. 다만, 재정경제부장관이 따로 정하는 회계경리에 관한 서식에 의한 경우에는 그러하지 아니하다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:51","kind":"조문","type":"시행규칙","family":"nca","label":"제51조","title":"계약보증금 납부","text":"제51조(계약보증금 납부)\n①각 중앙관서의 장 또는 계약담당공무원은 계약을 체결하고자 할 때에는 낙찰자 또는 계약상대자로 하여금 계약체결전까지 별지 제10호서식의 계약보증금납부서와 함께 소정절차에 따라 영 제50조의 규정에 의한 계약보증금을 납부하게 하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 계약상대자가 제43조의 규정에 의하여 납부한 입찰보증금을 별지 제11호서식의 입찰보증금의 계약보증금 대체납부신청서에 의하여 계약보증금으로 대체할 것을 요청한 때에는 계약보증금으로 이를 대체정리하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:52","kind":"조문","type":"시행규칙","family":"nca","label":"제52조","title":"하자보수보증금의 납부","text":"제52조(하자보수보증금의 납부) 각 중앙관서의 장 또는 계약담당공무원은 공사의 준공검사를 마친 때에는 그 공사대가의 최종지출시까지 별지 제12호서식의 하자보수보증금납부서와 함께 영 제62조의 규정에 의한 하자보수보증금을 납부하게 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:53","kind":"조문","type":"시행규칙","family":"nca","label":"제53조","title":"현금에 의한 보증금 납부","text":"제53조(현금에 의한 보증금 납부) 각 중앙관서의 장 또는 계약담당공무원은 입찰참가자 또는 계약상대자가 제43조ㆍ제51조 및 제52조의 규정에 의한 보증금을 현금으로 납부할 때에는 세입세출외 현금출납공무원으로 하여금 정부보관금취급규칙에 의하여 수령하게 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:54","kind":"조문","type":"시행규칙","family":"nca","label":"제54조","title":"증권에 의한 보증금 납부","text":"제54조(증권에 의한 보증금 납부)\n①각 중앙관서의 장 또는 계약담당공무원은 입찰참가자 또는 계약상대자가 제43조ㆍ제51조 및 제52조에 따른 보증금을 영 제37조제2항제2호에 따른 증권으로 납부할 때에는 유가증권취급공무원으로 하여금 정부유가증권취급규정에 의하여 수령하게 하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 계약상대자가 제43조ㆍ제51조 및 제52조의 규정에 의한 보증금을 국채중 등록국채로 납부하는 때에는 국채등록필통지서와 함께 별지 제13호서식의 질권설정동의서를 제출하게 하여야 하며 유가증권취급공무원으로 하여금 정부유가증권취급규정에 의하여 보관하게 하여야 한다.\n③유가증권취급공무원은 제2항의 규정에 의하여 국채등록필통지서와 질권설정동의서를 제출받은 때에는 부득이한 사유가 없는 한 지체없이 자신을 질권자로 하는 질권설정조치를 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:55","kind":"조문","type":"시행규칙","family":"nca","label":"제55조","title":"보증보험증권등에 의한 보증금 납부","text":"제55조(보증보험증권등에 의한 보증금 납부)\n①각 중앙관서의 장 또는 계약담당공무원은 입찰참가자 또는 계약상대자가 제43조ㆍ제51조 및 제52조의 규정에 의한 보증금을 영 제37조제2항제1호ㆍ제3호 또는 제4호의 규정에 의한 지급보증서ㆍ보증보험증권 또는 보증서(이하 \"보증보험증권등\"이라 한다)로 납부하고자 할 때에는 다음 각 호의 요건이 충족된 것으로 유가증권취급공무원에게 제출하게 하여야 한다.\n②유가증권취급공무원은 보증보험증권등의 제출이 있는 때에는 제1항 각호의 규정에 의한 사항등 기타 필요한 사항을 확인한 후 이를 정부유가증권취급규정에 의하여 보관하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:56","kind":"조문","type":"시행규칙","family":"nca","label":"제56조","title":"정기예금증서등에 의한 보증금 납부","text":"제56조(정기예금증서등에 의한 보증금 납부)\n①각 중앙관서의 장 또는 계약담당공무원은 입찰참가자 또는 계약상대자가 제43조ㆍ제51조 및 제52조의 규정에 의한 보증금을 영 제37조제2항제5호 내지 제7호의 규정에 의한 정기예금증서 또는 수익증권(이하 \"정기예금증서등\"이라 한다)으로 납부하고자 하는 경우에는 유가증권취급공무원으로 하여금 정부유가증권취급규정에 의하여 수령하게 하여야 한다.\n②제54조제2항 및 제3항의 규정중 질권설정동의서의 제출, 등록국채의 보관, 질권의 설정에 관한 규정은 제1항의 규정에 의하여 정기예금증서등으로 보증금을 납부하는 경우에 이를 준용한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:57","kind":"조문","type":"시행규칙","family":"nca","label":"제57조","title":"주식에 의한 보증금 납부","text":"제57조(주식에 의한 보증금 납부)\n①각 중앙관서의 장 또는 계약담당공무원은 입찰참가자 또는 계약상대자가 보증금을 주식(「자본시장과 금융투자업에 관한 법률」 제171조제4항에 따른 예탁증명서로 갈음하는 경우에는 예탁증명서를 말한다)으로 납부하고자 할 때에는 미리 「정부유가증권취급규칙」에 따른 유가증권취급점(이하 \"유가증권취급점\"이라 한다)에 납입하게 하여 「한국은행 정부유가증권취급규칙」에 따라 발행한 정부보관유가증권납입확인통지서와 함께 해당주식에 대한 양도증서 및 별지 제14호서식의 각서를 유가증권취급공무원에게 제출하게 해야 한다.\n②유가증권취급점은 제1항에 따라 정부보관유가증권납입서와 주식을 제출받은 때에는 주식의 종류ㆍ권면액ㆍ기호ㆍ번호ㆍ장수등과 상장증권인지의 여부를 확인하고 「한국은행 정부유가증권취급규칙」에 따라 발행하는 정부보관유가증권납입확인통지서의 비고란에 해당 주식의 소유자(기명식 주식의 경우에는 최후의 양수인)의 성명을 주식별로 기재하고 해당주식을 제출한 자에게 교부해야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:58","kind":"조문","type":"시행규칙","family":"nca","label":"제58조","title":"주식양도증서","text":"제58조(주식양도증서) 제57조의 규정에 의하여 제출하는 주식의 양도증서는 다음 각호의 규정에 의하여 작성된 것이어야 한다.\n1.\n1.  양수인의 성명과 양도일자를 기재하지 아니한 것일 것\n2.\n2.  양도인의 인감에 대하여 당해주식발행회사의 대조확인필인이 있을 것\n3.\n3.  발행회사가 서로 다른 여러 종류의 주식을 제출한 때에는 주식발행회사별 주식양도증서일 것","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:59","kind":"조문","type":"시행규칙","family":"nca","label":"제59조","title":"보증금의 납부확인","text":"제59조(보증금의 납부확인) 세입세출외 현금출납공무원 또는 유가증권취급공무원은 제43조ㆍ제51조 및 제52조의 규정에 의한 보증금을 소정절차에 따라 납부받은 때에는 그 보증금 납부서에 납부확인인을 찍어 이를 지체없이 소속 중앙관서의 장 또는 계약담당공무원에게 송부하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:60","kind":"조문","type":"시행규칙","family":"nca","label":"제60조","title":"보증기간중 의무","text":"제60조(보증기간중 의무) 각 중앙관서의 장 또는 계약담당공무원은 보증기간중 당해보증보험계약등의 약관ㆍ특약 또는 「상법」에 의하여 피보험자에게 주어진 다음 각호의 의무를 성실히 이행하여야 한다.\n1.\n1.  「상법」 제652조의 규정에 의한 위험의 변경 또는 증가의 통지의무\n2.\n2.  「상법」 제657조의 규정에 의한 보험사고발생의 통지의무\n3.\n3.  「상법」 제680조의 규정에 의한 손해방지의 의무\n4.\n4.  약관의 규정에 의한 조사승낙의 의무\n5.\n5.  기타 약관 또는 특약에서 정한 의무","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:61","kind":"조문","type":"시행규칙","family":"nca","label":"제61조","title":"보증보험증권등의 보증기간의 연장","text":"제61조(보증보험증권등의 보증기간의 연장) 각 중앙관서의 장 또는 계약담당공무원은 계약의 체결일을 연기하거나 계약의 이행기간 또는 하자담보책임기간을 연장하고자 할 때에는 계약상대자로 하여금 당초의 보증기간내에 그 연장하고자 하는 기간을 가산한 기간을 보증기간으로 하여 제55조의 규정에 적합하게 보증보험증권등을 유가증권취급공무원에게 제출하게 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:62","kind":"조문","type":"시행규칙","family":"nca","label":"제62조","title":"계약금액변경시의 보증금의 조정 및 추가납부등","text":"제62조(계약금액변경시의 보증금의 조정 및 추가납부등) 각 중앙관서의 장 또는 계약담당공무원은 영 제64조 내지 제66조의 규정에 의하여 계약금액이 조정된 때에는 이에 상응하는 금액의 보증금을 추가로 납부하게 하거나 계약상대자의 요청에 의하여 이를 반환하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:63","kind":"조문","type":"시행규칙","family":"nca","label":"제63조","title":"보증금의 반환","text":"제63조(보증금의 반환)\n①각 중앙관서의 장 또는 계약담당공무원은 영 제37조ㆍ제50조 및 제62조의 규정에 의하여 납부된 보증금의 보증목적이 달성된 때에는 계약상대자의 요청에 의하여 즉시 이를 반환하도록 하여야 한다.\n②하자담보책임기간이 서로 다른 공종이 복합된 건설공사에 있어서는 제70조의 규정에 의한 공종별 하자담보책임기간이 만료되어 보증목적이 달성된 공종의 하자보수보증금은 계약상대자의 요청이 있을 때에는 즉시 이를 반환하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:64","kind":"조문","type":"시행규칙","family":"nca","label":"제64조","title":"보증금등의 국고귀속","text":"제64조(보증금등의 국고귀속)\n①각 중앙관서의 장 또는 계약담당공무원은 영 제38조제1항의 규정에 의하여 제43조ㆍ제51조 및 제52조의 규정에 따라 납부된 보증금을 국고에 귀속하여야 할 사유가 발생한 경우에는 다음 각호의 방법에 의하여 당해보증금을 처리하여야 한다.\n② 삭제","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:65","kind":"조문","type":"시행규칙","family":"nca","label":"제65조","title":"희망수량경쟁입찰의 입찰보증금 국고귀속","text":"제65조(희망수량경쟁입찰의 입찰보증금 국고귀속) 최후순위의 낙찰자가 그 의무를 이행하지 아니하여 입찰보증금을 국고에 귀속시키는 경우 당해 낙찰자의 낙찰수량에 대하여 제47조제2항의 규정이 적용된 때에는 그 낙찰된 수량에 비례한 입찰보증금만을 국고에 귀속시켜야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:66","kind":"조문","type":"시행규칙","family":"nca","label":"제66조","title":"공사계약에 있어서의 이행보증","text":"제66조(공사계약에 있어서의 이행보증)\n① 삭제\n②각 중앙관서의 장 또는 계약담당공무원은 영 제52조의 규정에 의하여 공사이행보증서를 제출한 경우로서 계약상대자가 계약상의 의무를 이행하지 아니하는 경우에는 지체없이 공사이행보증서 발급기관에 그 의무를 이행할 것을 청구하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 제2항의 규정에 의한 청구에 의하여 공사이행보증서 발급기관이 지정한 업체(이하 \"보증이행업체\"라 한다)가 그 의무를 이행한 경우에는 계약금액중 보증이행업체가 이행한 부분에 상당하는 금액을 공사이행보증서 발급기관에 지급할 수 있도록 계약을 체결할 때에 미리 필요한 조치를 하여야 한다.\n④각 중앙관서의 장 또는 계약담당공무원은 제1항 및 제3항의 규정에 의하여 보증이행업체로 된 자가 부적격하다고 인정되는 경우에는 계약상대자 또는 공사이행보증서 발급기관에 보증이행업체의 변경을 청구할 수 있다.\n⑤제1항 내지 제4항의 규정은 용역계약의 경우에 이를 준용할 수 있다.\n⑥ 삭제","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:67","kind":"조문","type":"시행규칙","family":"nca","label":"제67조","title":"감독 및 검사","text":"제67조(감독 및 검사) 법 제13조 및 법 제14조의 규정에 의하여 감독 또는 검사를 한 자는 감독 또는 검사의 결과 계약이행의 내용이 당초의 계약내용에 적합하지 아니한 때에는 그 사실 및 조치에 관한 의견을 감독조서 또는 검사조서에 기재하여 소속 중앙관서의 장 또는 계약담당공무원에게 제출하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:68","kind":"조문","type":"시행규칙","family":"nca","label":"제68조","title":"감독 및 검사의 실시에 관한 세부사항","text":"제68조(감독 및 검사의 실시에 관한 세부사항) 각 중앙관서의 장은 필요하다고 인정할 때에는 감독 또는 검사에 관한 세부요령을 정할 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:69","kind":"조문","type":"시행규칙","family":"nca","label":"제69조","title":"감독 및 검사를 위탁한 경우의 확인","text":"제69조(감독 및 검사를 위탁한 경우의 확인) 각 중앙관서의 장 또는 계약담당공무원은 법 제13조제1항 단서 및 법 제14조제1항 단서의 규정에 의하여 감독 또는 검사를 전문기관으로 하여금 수행하게 하는 경우에는 그 결과를 문서로 통보받아 이를 확인하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:70","kind":"조문","type":"시행규칙","family":"nca","label":"제70조","title":"하자담보책임기간","text":"제70조(하자담보책임기간)\n①각 중앙관서의 장 또는 계약담당공무원은 영 제60조제1항 본문에 따라 공사계약을 체결할 때에 다음 각 호의 구분에 따른 공사의 종류별 구분에 따라 하자담보책임기간을 정해야 한다. 다만, 제7호를 제외한 각 공사의 종류 간의 하자책임을 구분할 수 없는 복합공사인 경우에는 주된 공사의 종류를 기준으로 하여 하자담보책임기간을 정해야 한다.\n②영 제60조제1항 단서의 규정에 의하여 하자담보책임기간을 정하지 아니하는 경우는 제72조제2항 각호의 공사로 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:71","kind":"조문","type":"시행규칙","family":"nca","label":"제71조","title":"하자검사","text":"제71조(하자검사)\n①영 제61조의 규정에 의하여 하자검사를 하는 자는 제70조의 규정에 의한 하자담보책임기간중 연 2회이상 정기적으로 하자검사를 하여야 하며, 하자담보책임기간이 만료되는 때에는 지체없이 따로 검사를 하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 영 제61조제2항의 규정에 의하여 하자검사를 전문기관에 의뢰하는 경우에는 그 결과를 문서로 통보받아 이를 확인하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 제1항 및 제2항의 규정에 의한 하자검사결과 하자가 발견된 때에는 지체없이 필요한 조치를 하여야 한다.\n④각 중앙관서의 장 또는 계약담당공무원은 하자검사를 하는 때에는 당해공사에 대한 하자보수관리부를 비치하고 다음 각호의 사항을 기록 ㆍ유지하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:72","kind":"조문","type":"시행규칙","family":"nca","label":"제72조","title":"하자보수보증금률","text":"제72조(하자보수보증금률)\n①각 중앙관서의 장 또는 계약담당공무원은 공사계약을 체결할 때에 영 제62조제1항 본문의 규정에 의하여 다음 각호의 공종(각 공종간의 하자책임을 구분할 수 없는 복합공사인 경우에는 주된 공종을 말한다)구분에 의하여 계약금액에 대한 하자보수보증금률을 정하여야 한다.\n②영 제62조제1항 단서에 따라 하자보수보증금을 납부하지 아니하게 할 수 있는 경우는 다음 각 호의 어느 하나의 공사로 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:73","kind":"조문","type":"시행규칙","family":"nca","label":"제73조","title":"하자보수보증금의 직접사용","text":"제73조(하자보수보증금의 직접사용)\n①각 중앙관서의 장 또는 계약담당공무원은 영 제63조의 규정에 의하여 하자보수보증금을 직접 사용하고자 할 때에는 세입세출외 현금출납공무원 또는 유가증권취급공무원에게 그 뜻을 통지하고 당해하자보수에 필요한 조치를 하여야 한다.\n②하자보수보증금을 영 제37조제2항의 규정에 의한 보증보험증권등으로 제출하게 한 때에는 제1항의 규정에 의한 통지와 동시에 당해보증기관에 대하여 보증한 금액을 납부할 것을 통지하여야 한다.\n③제1항에 따라 통지를 받은 유가증권취급공무원은 그가 보관하고 있는 유가증권등에 관하여 다음 각 호의 조치를 하여야 한다.\n④유가증권취급공무원은 보관하고 있는 유가증권등을 제3항의 규정에 의하여 매각하거나 당해보증채무의 이행을 받은 때에는 보증기관등으로 하여금 그 대금을 직접 세입세출외현금출납공무원에게 납입하도록 하여야 한다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 하자보수보증금의 직접사용을 위하여 지출원인행위를 한 때에는 그 지출원인행위의 관계서류를 세입세출외현금출납공무원에게 송부하되, 하자보수보증금으로 제출된 상장유가증권이 제3항제2호 또는 제3호의 규정에 의한 방법에 의하여 매각되지 아니한 때에는 지출원인행위를 할 수 없다.\n⑥세입세출외현금출납공무원은 제5항의 규정에 의하여 지출원인행위 관계서류를 송부받은 때에는 당해하자보수보증금중에서 그 하자보수의 대가를 지급하여야 한다.\n⑦각 중앙관서의 장 또는 계약담당공무원은 제70조제1항의 규정에 의한 하자담보책임기간동안 제6항의 규정에 의한 대가를 지급하고도 잔액이 있는 때에는 제64조제1항의 규정에 의하여 처리하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:74","kind":"조문","type":"시행규칙","family":"nca","label":"제74조","title":"물가변동으로 인한 계약금액의 조정","text":"제74조(물가변동으로 인한 계약금액의 조정)\n①영 제64조제1항제1호의 규정에 의한 품목조정률과 이에 관련된 등락폭 및 등락률 산정은 다음 각호의 산식에 의한다. 이 경우 품목 또는 비목 및 계약금액등은 조정기준일이후에 이행될 부분을 그 대상으로 하며, \"계약단가\"라 함은 영 제65조제3항제1호에 규정한 각 품목 또는 비목의 계약단가를, \"물가변동당시가격\"이라 함은 물가변동당시 산정한 각 품목 또는 비목의 가격을, \"입찰당시가격\"이라 함은 입찰서 제출마감일 당시 산정한 각 품목 또는 비목의 가격을 말한다.\n②영 제9조제1항제2호의 규정의 의한 예정가격을 기준으로 계약한 경우에는 제1항제1호 산식중 각 품목 또는 비목의 수량에 등락폭을 곱하여 산출한 금액의 합계액에는 동합계액에 비례하여 증감되는 일반관리비 및 이윤등을 포함하여야 한다.\n③제1항제1호의 등락폭을 산정함에 있어서는 다음 각호의 기준에 의한다.\n④영 제64조제1항제2호에 따른 지수조정률은 계약금액(조정기준일 이후에 이행될 부분을 그 대상으로 한다)의 산출내역을 구성하는 비목군 및 다음 각 호의 지수 등의 변동률에 따라 산출한다.\n⑤영 제64조제1항의 규정에 의하여 계약금액을 조정함에 있어서 그 조정금액은 계약금액중 조정기준일 이후에 이행되는 부분의 대가(이하 \"물가변동적용대가\"라 한다)에 품목조정률 또는 지수조정률을 곱하여 산출하되, 계약상 조정기준일전에 이행이 완료되어야 할 부분은 이를 물가변동적용대가에서 제외한다. 다만, 정부에 책임이 있는 사유 또는 천재ㆍ지변등 불가항력의 사유로 이행이 지연된 경우에는 물가변동적용대가에 이를 포함한다.\n⑥영 제64조제3항의 규정에 의하여 선금을 지급한 경우의 공제금액의 산출은 다음 산식에 의한다. 이 경우 영 제69조제2항ㆍ제3항 또는 제5항의 규정에 의한 장기계속공사계약ㆍ장기물품제조계약 또는 계속비예산에 의한 계약등에 있어서의 물가변동적용대가는 당해연도 계약체결분 또는 당해연도 이행금액을 기준으로 한다.\n  공제금액=물가변동적용대가×(품목조정률 또는 지수조정률)×선금급률\n⑦제1항에 따른 물가변동당시가격을 산정하는 경우에는 입찰당시가격을 산정한 때에 적용한 기준과 방법을 동일하게 적용하여야 한다. 다만, 천재ㆍ지변 또는 원자재 가격급등 등 불가피한 사유가 있는 경우에는 입찰당시가격을 산정한 때에 적용한 방법을 달리할 수 있다.\n⑧제1항에 따라 등락률을 산정함에 있어 제23조의3 각 호에 따른 용역계약(2006년 5월 25일 이전에 입찰공고되어 체결된 계약에 한한다)의 노무비의 등락률은 「최저임금법」에 따른 최저임금을 적용하여 산정한다.\n⑨각 중앙관서의 장 또는 계약담당공무원이 제1항 내지 제7항의 규정에 의하여 계약금액을 증액하여 조정하고자 하는 경우에는 계약상대자로부터 계약금액의 조정을 청구받은 날부터 30일 이내에 계약금액을 조정하여야 한다. 이 경우 예산배정의 지연등 불가피한 사유가 있는 때에는 계약상대자와 협의하여 조정기한을 연장할 수 있으며, 계약금액을 증액할 수 있는 예산이 없는 때에는 공사량 또는 제조량 등을 조정하여 그 대가를 지급할 수 있다.\n⑩재정경제부장관은 제4항에 따른 지수조정률의 산출 요령 등 물가변동으로 인한 계약금액의 조정에 관하여 필요한 세부사항을 정할 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:74의2","kind":"조문","type":"시행규칙","family":"nca","label":"제74조의2","title":"설계변경으로 인한 계약금액의 조정","text":"제74조의2(설계변경으로 인한 계약금액의 조정)\n①영 제65조의 규정에 의한 설계변경은 그 설계변경이 필요한 부분의 시공전에 완료하여야 한다. 다만, 각 중앙관서의 장 또는 계약담당공무원은 공정이행의 지연으로 품질저하가 우려되는 등 긴급하게 공사를 수행하게 할 필요가 있는 때에는 계약상대자와 협의하여 설계변경의 시기 등을 명확히 정하고, 설계변경을 완료하기 전에 우선 시공을 하게 할 수 있다.\n②제74조제9항 및 제10항의 규정은 제1항의 규정에 의한 계약금액의 조정에 관하여 이를 준용한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:74의3","kind":"조문","type":"시행규칙","family":"nca","label":"제74조의3","title":"기타 계약내용의 변경으로 인한 계약금액의 조정","text":"제74조의3(기타 계약내용의 변경으로 인한 계약금액의 조정)\n①영 제66조의 규정에 의한 공사기간, 운반거리의 변경 등 계약내용의 변경은 그 계약의 이행에 착수하기 전에 완료하여야 한다. 다만, 각 중앙관서의 장 또는 계약담당공무원은 계약이행의 지연으로 품질저하가 우려되는 등 긴급하게 계약을 이행하게 할 필요가 있는 때에는 계약상대자와 협의하여 계약내용 변경의 시기 등을 명확히 정하고, 계약내용을 변경하기 전에 우선 이행하게 할 수 있다.\n②제74조제9항 및 제10항의 규정은 제1항의 규정에 의한 계약금액의 조정에 관하여 이를 준용한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:75","kind":"조문","type":"시행규칙","family":"nca","label":"제75조","title":"지체상금률","text":"제75조(지체상금률) 영 제74조제1항에 따른 지체상금률은 다음 각호와 같다.\n1.\n1.  공사: 1천분의 0.5\n2.\n2.  물품의 제조ㆍ구매(영 제16조제3항에 따라 소프트웨어사업시 물품과 용역을 일괄하여 입찰에 부치는 경우를 포함한다. 이하 이 호에서 같다): 1천분의 0.75. 다만, 계약 이후 설계와 제조가 일괄하여 이루어지고, 그 설계에 대하여 발주한 중앙관서의 장의 승인이 필요한 물품의 제조ㆍ구매의 경우에는 1천분의 0.5로 한다.\n3.\n3.  물품의 수리ㆍ가공ㆍ대여,용역(영 제16조제3항에 따라 소프트웨어사업시 물품과 용역을 일괄하여 입찰에 부치는 경우의 그 용역을 제외한다) 및 기타: 1천분의 1.25\n4.\n4.  군용 음ㆍ식료품 제조ㆍ구매: 1천분의 1.5\n5.\n5.  운송ㆍ보관 및 양곡가공: 1천분의 2.5","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:75의2","kind":"조문","type":"시행규칙","family":"nca","label":"제75조의2","title":"부정당업자의 입찰참가자격 제한","text":"제75조의2(부정당업자의 입찰참가자격 제한) 영 제76조제2항제1호나목 단서에서 \"입찰서상 금액과 산출내역서상 금액이 일치하지 않은 입찰 등 재정경제부령으로 정하는 입찰무효사유에 해당하는 입찰\"이란 제44조제1항제6호 및 제6호의3에 따른 입찰을 말한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:76","kind":"조문","type":"시행규칙","family":"nca","label":"제76조","title":"부정당업자의 입찰참가자격 제한기준 등","text":"제76조(부정당업자의 입찰참가자격 제한기준 등) 영 제76조제4항에 따른 부정당업자의 입찰참가자격 제한의 세부기준은 별표 2와 같다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:77","kind":"조문","type":"시행규칙","family":"nca","label":"제77조","title":"입찰참가자격제한에 관한 게재 등","text":"제77조(입찰참가자격제한에 관한 게재 등)\n①계약담당공무원은 법 제27조제1항에 따른 부정당업자에 해당된다고 인정하는 자가 있을 때에는 지체없이 그 소속 중앙관서의 장에게 보고하여야 한다.\n② 삭제\n③영 제76조제11항에 따른 게재는 별지 제15호서식의 부정당업자제재확인서를 전자조달시스템에 게재하는 방법으로 한다.\n④각 중앙관서의 장은 전자조달시스템을 이용하여 입찰참가자의 입찰참가자격이 제한되고 있는 지 여부를 확인하여야 한다.\n⑤ 영 제76조제12항에 따른 공개는 별지 제15호서식의 부정당업자제재확인서(영 제76조제12항 각 호의 사항만 기재한다)를 입찰참가자격제한 기간 동안 전자조달시스템에 공개하는 방법으로 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:77의2","kind":"조문","type":"시행규칙","family":"nca","label":"제77조의2","title":"과징금 부과의 세부적인 대상과 기준","text":"제77조의2(과징금 부과의 세부적인 대상과 기준)\n① 법 제27조의2제1항과 영 제76조의2에 따라 과징금을 부과하는 위반행위의 종류와 위반 정도 등에 따른 과징금 부과율은 다음 각 호의 구분에 따른 별표 3 및 별표 4와 같다.\n② 각 중앙관서의 장은 위반행위의 동기ㆍ내용과 횟수 등을 고려하여 제1항에 따른 과징금 금액의 2분의 1의 범위에서 이를 감경할 수 있다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:78","kind":"조문","type":"시행규칙","family":"nca","label":"제78조","title":null,"text":"제6장 대형공사계약","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:79","kind":"조문","type":"시행규칙","family":"nca","label":"제79조","title":"중앙건설기술심의위원회의 심의","text":"제79조(중앙건설기술심의위원회의 심의)\n①국토교통부장관은 제78조제1항에 따라 집행기본계획서를 제출받은 때에는 「건설기술진흥법」 제5조제2항에 따른 중앙건설기술심의위원회로 하여금 집행기본계획서에 포함된 공사의 입찰방법에 관하여 심의하게 하여야 한다. 다만, 기타공사의 경우에는 심의를 생략하게 할 수 있다.\n②국토교통부장관은 중앙건설기술심의위원회의 심의가 완료된 경우에는 다음 각 호의 구분에 따라 해당중앙관서의 장에게 공사별로 심의결과를 통보하여야 한다.\n③각 중앙관서의 장은 특별한 사유가 없는 한 제2항에 따라 통보된 심의결과에 따라 집행기본계획서를 조정하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:79의2","kind":"조문","type":"시행규칙","family":"nca","label":"제79조의2","title":"특별건설기술심의위원회의 심의","text":"제79조의2(특별건설기술심의위원회의 심의) 국방부장관은 제79조제1항에 불구하고 국방부에 「건설기술진흥법」 제5조제2항에 따른 특별건설기술심의위원회가 설치되어 있는 경우에는 특별건설기술심의위원회로 하여금 집행기본계획서에 명시된 모든 공사의 입찰방법에 관하여 심의하게 하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:80","kind":"조문","type":"시행규칙","family":"nca","label":"제80조","title":null,"text":"제80조 삭제","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:81","kind":"조문","type":"시행규칙","family":"nca","label":"제81조","title":"대안입찰 및 일괄입찰 대상공사의 공고","text":"제81조(대안입찰 및 일괄입찰 대상공사의 공고) 국토교통부장관 또는 국방부장관은 제79조제1항 또는 제79조의2에 따라 중앙건설기술심의위원회 또는 특별건설기술심의위원회의 심의를 완료한 때에는 대안입찰 및 일괄입찰의 방법으로 집행할 공사를 신문 또는 전자조달시스템에 공고하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:81의2","kind":"조문","type":"시행규칙","family":"nca","label":"제81조의2","title":"실시설계 기술제안입찰등의 입찰방법 심의 등","text":"제81조의2(실시설계 기술제안입찰등의 입찰방법 심의 등) 영 제99조제1항에 따른 실시설계 기술제안입찰등의 입찰방법 심의 등에 관하여는 제78조, 제79조, 제79조의2 및 제81조를 준용한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:82","kind":"조문","type":"시행규칙","family":"nca","label":"제82조","title":null,"text":"제7장 계약정보의 공개 등","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:82의2","kind":"조문","type":"시행규칙","family":"nca","label":"제82조의2","title":"계약실적보고","text":"제82조의2(계약실적보고) 영 제93조 본문에서 \"재정경제부령이 정하는 사항\"이란 제82조제2호 및 제3호의 사항을 말한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:83","kind":"조문","type":"시행규칙","family":"nca","label":"제83조","title":"건설공사에 대한 자재의 관급","text":"제83조(건설공사에 대한 자재의 관급)\n①각 중앙관서의 장은 공사 발주 시 다른 공사부분과 하자책임 구분이 쉽고 공정관리에 지장이 없는 경우로서 다음 각 호의 어느 하나에 해당하는 경우에는 그 공사에 필요한 자재를 직접 공급할 수 있다.\n②제1항에 따라 각 중앙관서의 장이 직접 공급하는 자재의 운용 및 관리에 관하여 필요한 사항은 재정경제부장관이 정하는 바에 의한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:84","kind":"조문","type":"시행규칙","family":"nca","label":"제84조","title":"소프트웨어사업에 대한 소프트웨어의 관급","text":"제84조(소프트웨어사업에 대한 소프트웨어의 관급)\n① 각 중앙관서의 장 또는 계약담당공무원은 「소프트웨어 진흥법」 제2조제3호에 따른 소프트웨어사업을 발주하는 경우 주무부장관이 고시하는 소프트웨어 제품을 직접 구매하여 공급하여야 한다.\n② 제1항에도 불구하고 각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 어느 하나에 해당하는 때에는 소프트웨어 제품을 직접 구매하여 공급하지 아니할 수 있다.\n③ 제2항에 따라 소프트웨어를 직접 구매하여 공급하지 아니하는 경우에는 그 사유를 발주계획서 및 입찰공고문에 명시하여야 한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:85","kind":"조문","type":"시행규칙","family":"nca","label":"제85조","title":null,"text":"제8장 이의신청과 국가계약분쟁조정위원회","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:86","kind":"조문","type":"시행규칙","family":"nca","label":"제86조","title":"심사ㆍ조정 관련 비용 부담의 범위와 정산","text":"제86조(심사ㆍ조정 관련 비용 부담의 범위와 정산)\n① 영 제115조에 따라 심사ㆍ조정의 청구인이 부담할 비용의 범위는 다음 각 호와 같다.\n② 위원회는 필요하다고 인정하는 경우에는 청구인으로 하여금 제1항에 따른 심사ㆍ조정 관련 비용을 미리 내게 할 수 있다.\n③ 위원회는 제2항에 따라 심사ㆍ조정 관련 비용을 미리 받은 경우에는 심사ㆍ조정안이 당사자에게 제시된 날부터 30일 이내에 미리 받은 금액과 비용에 대한 정산서를 청구인에게 통지하여야 한다. 다만, 청구인과 해당 중앙관서의 장 간에 약정이 있는 경우에는 그 약정에 따라 정산서를 통지한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-r:87","kind":"조문","type":"시행규칙","family":"nca","label":"제87조","title":"위원회의 운영 등","text":"제87조(위원회의 운영 등) 이 규칙에 규정한 것 외에 위원회의 운영과 조정 절차에 관하여 필요한 사항은 위원회의 의결을 거쳐 위원장이 정한다.","lawId":"nca-r","group":"국가계약법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:nca-sp1-e","kind":"법령","type":"시행령","family":"nca","label":"특정물품 특례규정","name":"특정물품등의조달에관한국가를당사자로하는계약에관한법률시행령특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:1","kind":"조문","type":"시행령","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 영은 국제입찰에 의한 계약에 의하여 물품등을 조달함에 있어서의 계약사무처리등에 관하여 국가를당사자로하는계약에관한법률시행령에 대한 특례를 정함을 목적으로 한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:2","kind":"조문","type":"시행령","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 영에서 사용하는 용어의 정의는 다음과 같다.\n1.\n1.  \"특정물품등\"이라 함은 현금 및 유가증권을 제외한 물품과 프로그램중 재정경제부령이 정하는 것을 말한다.\n2.\n2.  \"정부조달\"이라 함은 재정경제부령이 정하는 국가기관(이하 \"각 중앙관서\"라 한다)이 특정물품등을 구매(할부구매를 포함한다) 또는 임차하거나 시설등을 대여받는 것을 말한다.\n3.\n3.  \"프로그램\"이라 함은 특정한 결과를 얻기 위하여 컴퓨터등 정보처리능력을 가진 장치안에서 직접 또는 간접으로 사용되는 일련의 지시 및 명령으로 표현된 것을 말한다.\n4.\n4.  \"특례조달계약\"이라 함은 특정물품등의 조달을 위하여 체결한 계약(계약물품등의 조달에 부수하여 운송ㆍ하역ㆍ보험등의 용역의 제공을 수반하는 계약으로서 당해 용역의 가액이 당해 특정물품등의 가액을 초과하지 아니하는 것을 포함한다)으로서 그 추정가액이 재정경제부장관이 정하는 금액이상인 계약을 말한다.\n5.\n5.  \"추정가액\"이라 함은 특정물품등의 예정가격이 결정되기 전에 예산배정금액 및 예산산출기초자료등에 의하여 추산한 가액을 말한다.\n6.\n6.  \"반복조달계약\"이라 함은 특례조달계약중 동일 또는 동종물품의 조달을 위하여 동일 연도중 동일인과 두 번 이상 체결하는 계약을 말한다.\n7.\n7.  \"외국인\"이라 함은 대한민국의 국적을 가지지 아니한 자와 대한민국의 국적과 대한민국외의 국적을 이중으로 가진 자 및 외국법인(외국의 법령에 의하여 설립된 법인을 말한다)을 말한다.\n8.\n8.  \"인증공급자명부\"라 함은 물품등의 유형별로 입찰에 참가할 수 있는 자격을 미리 정한 후 그 자격을 갖춘 자중 입찰참가가 가능한 자를 기록한 명부를 말한다.\n9.\n9.  \"공고\"라 함은 일반경쟁 및 제한경쟁의 경우에는 입찰이 있음을 알리고 모든 유자격자의 입찰참가를 권유하는 것을 말하며, 지명경쟁의 경우에는 입찰권유와 관련없이 단지 입찰이 있음만을 알리는 것을 말한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:3","kind":"조문","type":"시행령","family":"nca","label":"제3조","title":"적용범위","text":"제3조(적용범위)\n①이 영은 특례조달계약에 대하여 이를 적용한다.\n②외국인에 대하여는 당해 외국에서 대한민국 국민에 대하여 이 영에 규정하는 것과 동등한 대우를 보장하는 경우에 한하여 이 영을 적용한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:4","kind":"조문","type":"시행령","family":"nca","label":"제4조","title":"추정가액 결정","text":"제4조(추정가액 결정) 각 중앙관서의 장 또는 그 위임을 받은 공무원은 특례조달계약의 체결시 추정가액을 결정함에 있어서 다음 각호의 1에 해당하는 경우에는 그 각호의 규정에 따라 추정가액을 결정한다.\n1.\n1.  단가계약인 경우에는 당해 물품단가에 조달 예정수량을 곱한 금액\n2.\n2.  반복조달계약인 경우에는 동일 연도내에 계약할 금액의 총액\n3.\n3.  물품의 임차 또는 시설등의 대여를 위한 계약으로서 계약기간이 명시된 경우에는 총계약금액으로 하며, 계약기간이 명시되지 아니한 경우에는 1월분의 임차료 또는 대여료에 48을 곱한 금액","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:5","kind":"조문","type":"시행령","family":"nca","label":"제5조","title":"계약의 원칙","text":"제5조(계약의 원칙)\n①각 중앙관서의 장 또는 그 위임을 받은 공무원은 특례조달계약을 체결함에 있어서 계약상대자의 국적이나 제품의 생산지등을 이유로 계약상의 이익을 부당하게 제한하는 특약이나 조건등을 정하여서는 아니된다.\n②각 중앙관서의 장 또는 그 위임을 받은 공무원은 계약상대자를 공정하게 선정하여야 하며, 정부조달에 관한 계약과 관련된 정보를 차별적으로 제공하여서는 아니된다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:6","kind":"조문","type":"시행령","family":"nca","label":"제6조","title":"입찰참가자격 및 심사등","text":"제6조(입찰참가자격 및 심사등)\n①외국인의 입찰참가 자격과 그에 대한 공고등에 관하여 필요한 사항은 재정경제부령으로 정한다.\n②각 중앙관서의 장 또는 그 위임을 받은 공무원은 입찰에 참가하고자 하는 자로부터 입찰참가자격심사신청을 받아 입찰참가자격의 유무를 심사하여 그 심사 결과를 당해 신청인에게 통지하여야 한다.\n③각 중앙관서의 장 또는 그 위임을 받은 공무원은 제2항의 규정에 의한 입찰참가자격심사신청서가 늦게 접수되어 입찰전일까지 자격심사를 할 여유가 없는 경우에는 입찰참가자격을 충족시키는 것을 조건으로 입찰참가를 허용할 수 있다.\n④제2항의 규정에 의한 입찰참가자격 심사에 있어서 각 중앙관서의 장 또는 그 위임을 받은 공무원은 동일 물품등에 대하여 다른 기관에서 행한 입찰참가 자격심사의 결과가 있는 경우에는 별도의 심사없이 이를 적용할 수 있다.\n⑤각 중앙관서의 장 또는 그 위임을 받은 공무원은 자격요건의 증명절차를 간소화하기 위하여 인증공급자명부를 작성하여 운용할 수
