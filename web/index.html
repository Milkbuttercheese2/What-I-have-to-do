psa","label":"제42조의11","title":"이익금 등의 처리","text":"제42조의11(이익금 등의 처리)\n① 공제조합의 이익금 처리는 다음 각 호의 순서에 따른다.\n② 공제조합이 해산하는 경우 남은 재산은 「민법」 제80조에 따라 처리한다. 다만, 남은 재산 중 조합원의 출자금은 총회의 의결에 따라 처리한다.\n③ 제1항제5호에 따른 이익금의 배당에 관하여는 「상법」 중 주식회사의 회계에 관한 규정을 준용하고, 그 밖에 필요한 사항은 정관으로 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의12","kind":"조문","type":"시행령","family":"psa","label":"제42조의12","title":"공제조합의 회계","text":"제42조의12(공제조합의 회계)\n① 공제조합의 기본재산 중 출자금 및 출연금은 자본계정의 자본금계정으로 회계처리하고, 책임준비금은 자본계정의 책임준비금계정으로 회계처리한다.\n② 제1항에서 정한 사항 외에 공제조합의 회계는 공제조합의 회계기준에 따라 회계처리하되, 그 기준에서 정하지 않은 사항에 관하여는 기업회계기준에 따른다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의13","kind":"조문","type":"시행령","family":"psa","label":"제42조의13","title":"공제조합의 감독","text":"제42조의13(공제조합의 감독) 조달청장은 법 제32조의2제4항에 따라 공제조합에 대해 다음 각 호의 업무를 감독해야 한다.\n1.\n1.  공제조합의 총회 또는 이사회 의결 사항\n2.\n2.  조합원의 자격과 가입 및 탈퇴에 관한 사항\n3.\n3.  기본재산의 조성 및 운영관리에 관한 사항\n4.\n4.  자산 및 회계에 관한 사항\n5.\n5.  잉여금ㆍ적립금 및 손실금의 처리에 관한 사항\n6.\n6.  사업계획 및 예산에 관한 사항\n7.\n7.  기구 및 조직에 관한 사항\n8.\n8.  그 밖에 조달청장이 위탁한 업무 및 정관에서 정하고 있는 업무의 수행에 관한 사항","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의14","kind":"조문","type":"시행령","family":"psa","label":"제42조의14","title":"공제조합의 사업","text":"제42조의14(공제조합의 사업) 법 제32조의3제1항제7호에서 \"대통령령으로 정하는 사업\"이란 다음 각 호의 사업을 말한다.\n1.\n1.  조합원의 조달사업을 위한 제조ㆍ생산ㆍ연구시설 등에 대한 공제사업\n2.\n2.  조합원의 조달사업에 필요한 기자재의 구매알선 사업\n3.\n3.  조달계약 관련 조사ㆍ연구 사업\n4.\n4.  조달계약 및 관련 사업에 대한 외국으로부터의 수주(受注) 등에 대한 정보 제공 사업\n5.\n5.  조합의 목적 달성에 필요한 관련 사업에 대한 투자 사업\n6.\n6.  조합원의 이용에 지장을 주지 않는 범위에서 정관 및 법 제32조의3제2항제2호에 따른 공제규정에서 정하는 바에 따라 조합원이 아닌 조달기업을 대상으로 하는 다음 각 목의 사업\n가.\n가.  조달계약에 필요한 자금의 융자\n나.\n나.  조달계약에 관한 손해배상 책임을 보장하거나 업무상 재해로 인한 손실을 보상하는 공제사업\n다.\n다.  조달계약 관련 경영상담ㆍ진단ㆍ지도 및 교육훈련 사업\n라.\n라.  조달계약 및 관련 사업에 대한 외국으로부터의 수주(受注) 등에 대한 정보 제공 사업\n7.\n7.  제1호부터 제6호까지의 사업에 부대되는 사업으로서 정관에서 정하는 사업","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의15","kind":"조문","type":"시행령","family":"psa","label":"제42조의15","title":"조사 및 검사","text":"제42조의15(조사 및 검사)\n① 법 제32조의4제3항에 따른 금융위원회의 조사 또는 검사는 조달청장이 조사 또는 검사가 필요한 사유를 명시하여 금융위원회에 요청한 경우로 한정한다.\n② 금융위원회는 법 제32조의4제3항에 따라 조사 또는 검사를 한 경우에는 그 결과를 지체 없이 조달청장에게 통보해야 한다. 이 경우 시정해야 할 사항이 있으면 시정을 요구할 수 있다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:43","kind":"조문","type":"시행령","family":"psa","label":"제43조","title":null,"text":"제10장 보칙","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:44","kind":"조문","type":"시행령","family":"psa","label":"제44조","title":"과태료의 부과기준","text":"제44조(과태료의 부과기준) 법 제35조제1항에 따른 과태료의 부과기준은 별표 2와 같다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:45","kind":"조문","type":"시행령","family":"psa","label":"제45조","title":"조달물자의 사고 처리","text":"제45조(조달물자의 사고 처리) 조달청장은 국외로부터 조달물자를 도입하는 도중에 사고가 발생하였을 때에는 국제관례에 따라 처리하고 수요기관에 그 결과를 통보해야 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:psa-r","kind":"법령","type":"시행규칙","family":"psa","label":"조달사업법 시행규칙","name":"조달사업에 관한 법률 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:1","kind":"조문","type":"시행규칙","family":"psa","label":"제1조","title":"목적","text":"제1조(목적) 이 규칙은 「조달사업에 관한 법률」 및 「조달사업에 관한 법률 시행령」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:2","kind":"조문","type":"시행규칙","family":"psa","label":"제2조","title":"수요물자의 구매절차 등","text":"제2조(수요물자의 구매절차 등)\n① 수요기관의 장은 「조달사업에 관한 법률」(이하 \"법\"이라 한다) 제11조제1항 본문 및 제2항에 따라 조달청장에게 수요물자(제3조에 따라 구매하는 수요물자는 제외한다)의 구매계약 체결을 요청(납품의 요구를 포함한다)하려는 경우에는 조달청장이 미리 정하여 통보하는 기한까지 별지 제1호서식의 조달요청서를 조달청장에게 제출해야 한다.\n② 수요기관의 장은 법 제12조제1항에 따른 제3자를 위한 단가계약을 체결한 계약상대자에게 납품을 요구하려는 경우에는 별지 제2호서식의 제3자 단가계약 분할납품 요구서를 계약상대자와 조달청장에게 각각 보내야 한다.\n③ 수요기관의 장은 제1항 또는 제2항에 따라 수요물자를 공급받았을 때에는 별지 제3호서식의 물품납품 및 영수증을 조달청장에게 제출해야 한다.\n④ 조달청장은 제1항부터 제3항까지에서 규정한 사항 외에 수요물자의 구매ㆍ공급절차에 관한 세부기준을 정하여 시행할 수 있다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:3","kind":"조문","type":"시행규칙","family":"psa","label":"제3조","title":"수요물자 중 외국산제품 등의 구매절차","text":"제3조(수요물자 중 외국산제품 등의 구매절차)\n① 수요기관의 장은 법 제11조제1항 본문 및 제2항에 따라 조달청장에게 국내에서 생산 또는 공급되지 않거나 차관자금으로 구매하는 수요물자(이하 \"외국산제품등\"이라 한다)의 구매계약 체결을 요청(납품의 요구를 포함한다)하려는 경우에는 조달청장이 미리 정하여 통보하는 기한까지 별지 제4호서식의 외자조달요청서에 다음 각 호의 서류를 첨부하여 조달청장에게 제출해야 한다.\n② 수요기관의 장은 외국으로부터 도입되는 물자를 지정된 인수기간에 인수하지 않을 경우 인수기간 종료일 다음 날부터의 보관료를 부담해야 한다.\n③ 조달청장은 제1항 및 제2항에서 규정한 사항 외에 외국산제품등의 구매절차에 관한 세부기준을 정하여 시행할 수 있다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:4","kind":"조문","type":"시행규칙","family":"psa","label":"제4조","title":"입찰서의 기술검토","text":"제4조(입찰서의 기술검토) 조달청장은 제2조 또는 제3조에 따른 수요물자의 품질 및 성능 등을 검토하기 위해 필요하다고 인정할 때에는 해당 수요물자의 입찰서에 대한 기술검토를 수요기관의 장에게 요청할 수 있다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:5","kind":"조문","type":"시행규칙","family":"psa","label":"제5조","title":"공사의 계약절차","text":"제5조(공사의 계약절차)\n① 수요기관의 장은 법 제11조제1항 본문 및 제2항에 따라 조달청장에게 공사의 계약체결을 요청하려는 경우에는 조달청장이 미리 정하여 통보하는 기한까지 별지 제5호서식의 공사계약 요청서에 다음 각 호의 서류를 첨부하여 조달청장에게 제출해야 한다.\n② 조달청장은 제1항에 따라 공사의 계약체결을 요청받았을 때에는「국가를 당사자로 하는 계약에 관한 법률 시행령」 제9조 또는 「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」 제10조에 따른 공사 예정가격을 결정하여 계약을 체결하고, 별지 제7호서식의 계약체결 통지서에 다음 각 호의 서류를 첨부하여 수요기관의 장에게 보내야 한다.\n③ 수요기관의 장은 「조달사업에 관한 법률 시행령」 제27조제2호에 따라 조달청장에게 공사의 계약 및 그에 따른 사업의 지원 또는 대행을 요청하려는 경우에는 지원 또는 대행요청서에 다음 각 호에 해당하는 서류를 첨부하여 조달청장에게 제출해야 한다.\n④ 조달청장은 제1항부터 제3항까지에서 규정한 사항 외에 공사의 계약에 관한 세부기준을 정하여 시행할 수 있다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:6","kind":"조문","type":"시행규칙","family":"psa","label":"제6조","title":"수요물자 구매 또는 공사의 계약체결 위임","text":"제6조(수요물자 구매 또는 공사의 계약체결 위임)\n① 조달청장은 영 제11조제2항제5호에 따라 다음 각 호의 어느 하나에 해당하는 경우 수요기관에 수요물자 구매 또는 공사의 계약체결을 위임할 수 있다.\n② 수요기관의 장은 제1항제2호 및 제3호에 따라 구매 또는 공사 계약체결의 위임을 요청할 때에는 해당 물품의 품명ㆍ규격ㆍ수량ㆍ단가ㆍ수요시기 및 수요기관의 직접 구매 또는 공사 계약체결이 필요한 사유를 구체적으로 적어 조달청장에게 요청해야 한다.\n③ 조달청장은 제2항에 따른 구매위임 요청을 받은 경우에는 요청받은 날부터 10일 이내에 그 결과를 수요기관의 장에게 통보해야 한다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:7","kind":"조문","type":"시행규칙","family":"psa","label":"제7조","title":"공사집행 계획서의 제출","text":"제7조(공사집행 계획서의 제출) 수요기관의 장이 영 제11조제3항에 따라 조달청장에게 제출해야 하는 공사집행 계획서는 별지 제8호서식에 따른다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:8","kind":"조문","type":"시행규칙","family":"psa","label":"제8조","title":"공사계약의 사후관리","text":"제8조(공사계약의 사후관리)\n① 수요기관의 장은 제5조제2항에 따른 계약체결의 통지를 받은 공사(이하 이 조에서 \"공사\"라 한다)에 대해 설계변경 등으로 인해 계약내용을 변경하려는 경우에는 변경계약의 체결에 필요한 조치를 한 후 이를 조달청장에게 통보해야 한다. 다만, 수요기관의 장은 변경계약의 체결에 필요한 조치를 하기 곤란한 경우에는 지체 없이 별지 제9호서식의 공사계약내용 변경요청서에 다음 각 호의 서류를 첨부하여 조달청장에게 변경계약의 체결을 요청해야 한다.\n② 조달청장은 제1항 각 호 외의 부분 단서에 따라 변경계약의 체결을 요청받았을 때에는 변경계약의 체결 등 필요한 조치를 해야 한다.\n③ 수요기관의 장은 계약서에 정한 기한까지 공사가 착공되지 않은 경우에는 그 내용을 조달청장에게 통보해야 한다.\n④ 수요기관의 장은 공사가 착공되었을 때 「국가를 당사자로 하는 계약에 관한 법률」 제13조 및 제14조, 「지방자치단체를 당사자로 하는 계약에 관한 법률」 제16조 및 제17조에 따라 공사의 감독 및 검사에 필요한 조치를 해야 한다. 다만, 수요기관의 장이 요청하는 경우에는 조달청장이 이를 대행할 수 있다.\n⑤ 수요기관의 장은 공사가 완료되어 공사대금을 지급했을 때 별지 제11호서식의 준공통지서에 다음 각 호의 서류를 첨부하여 조달청장에게 제출해야 한다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:9","kind":"조문","type":"시행규칙","family":"psa","label":"제9조","title":"공사계약의 해제 또는 공사이행보증서 발급기관에 의한 이행","text":"제9조(공사계약의 해제 또는 공사이행보증서 발급기관에 의한 이행)\n① 수요기관의 장은 계약자의 계약불이행, 그 밖의 부득이한 사유로 제5조제2항에 따른 계약체결의 통지를 받은 공사의 계약(이하 이 조에서 \"공사계약\"이라 한다)을 해제하거나 공사계약의 전부 또는 일부를 공사이행보증서 발급기관으로 하여금 이행하게 할 필요가 있을 때에는 조달청장에게 공사계약의 해제 또는 공사이행보증서 발급기관에 의한 해당 계약의 이행을 요청해야 한다. 이 경우 공사계약의 해제를 요청할 때에는 별지 제12호서식의 공사계약 해제요청서에 다음 각 호의 서류를 첨부하여 조달청장에게 제출해야 한다.\n② 조달청장은 제1항에 따라 공사계약의 해제 또는 공사이행보증서 발급기관에 의한 이행의 요청을 받았을 때에는 이에 필요한 조치를 하고, 그 내용을 해당 수요기관의 장에게 통보해야 한다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:10","kind":"조문","type":"시행규칙","family":"psa","label":"제10조","title":"연체료율","text":"제10조(연체료율) 영 제21조에서 \"재정경제부령으로 정한 연체료율\"이란 다음 각 호의 구분에 따른 연체료율을 말한다.\n1.\n1.  납입기한이 지난 날부터 10일 이내에 납입하는 경우: 1천분의 1\n2.\n2.  납입기한이 지난 날부터 10일을 초과하고 30일 이내에 납입하는 경우: 1천분의 5\n3.\n3.  납입기한이 지난 날부터 30일을 초과하여 납입하는 경우: 1천분의 10","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:11","kind":"조문","type":"시행규칙","family":"psa","label":"제11조","title":"이의제기","text":"제11조(이의제기) 영 제24조제1항에서 \"재정경제부령으로 정하는 이의신청서\"란 별지 제13호서식의 이의신청서를 말한다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:11의2","kind":"조문","type":"시행규칙","family":"psa","label":"제11조의2","title":"혁신제품 지원센터의 지정 신청 등","text":"제11조의2(혁신제품 지원센터의 지정 신청 등)\n① 법 제27조의2제1항에 따른 혁신제품 지원센터(이하 \"지원센터\"라 한다)로 지정을 받으려는 자는 별지 제13호의2서식의 혁신제품 지원센터 지정신청서에 다음 각 호의 서류를 첨부하여 조달청장에게 제출해야 한다.\n② 제1항에 따른 신청을 받은 조달청장은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서를 확인해야 한다. 다만, 신청인이 확인에 동의하지 않는 경우에는 해당 서류를 첨부하도록 해야 한다.\n③ 영 제33조의2제4항에 따른 지원센터 지정서는 별지 제13호의3서식과 같다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:11의3","kind":"조문","type":"시행규칙","family":"psa","label":"제11조의3","title":"지원센터의 지정 변경 신청","text":"제11조의3(지원센터의 지정 변경 신청)\n① 지원센터로 지정을 받은 자는 영 제33조의2제2항 후단에 따라 다음 각 호의 사항을 변경하려는 경우에는 별지 제13호의4서식의 혁신제품 지원센터 지정 변경 신청서에 영 제33조의2제4항에 따른 지원센터 지정서를 첨부하여 조달청장에게 제출해야 한다.\n② 제1항에 따른 신청을 받은 조달청장은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서를 확인해야 한다. 다만, 신청인이 확인에 동의하지 않는 경우에는 해당 서류를 첨부하도록 해야 한다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:12","kind":"조문","type":"시행규칙","family":"psa","label":"제12조","title":"비축물자의 판매절차","text":"제12조(비축물자의 판매절차)\n① 조달청장은 수요기관 또는 법 제29조제2항에 따른 이용업체(이하 이 조에서 \"수요자\"라 한다)에 비축물자를 판매하기 위해 비축물자를 배정하는 경우 별지 제14호서식의 비축물자 배정통지서를 수요자에게 발급해야 한다.\n② 조달청장은 비축물자를 배정받은 수요자가 법 제30조제3항에 따라 정해진 납입시기에 비축물자의 판매대금을 납입하지 않는 경우 그 비축물자의 배정을 취소할 수 있다.\n③ 조달청장은 법 제30조제3항 단서에 따라 비축물자를 인도한 후에 판매대금을 납입하게 하는 경우에는 수요자로 하여금 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제37조제2항 각 호의 어느 하나에 해당하는 보증서 등을 제출하게 해야 한다. 다만, 같은 영 제37조제3항제1호부터 제4호까지의 규정에 해당하는 자에 대해서는 보증서 등의 제출을 면제할 수 있다.\n④ 제3항에 따른 보증서 등의 금액은 비축물자 판매대금과 그 금액에 대한 비축물자 인도일의 다음 날부터 판매대금 지급일까지의 약정이자에 상당하는 금액을 더한 금액으로 한다.\n⑤ 수요자가 비축물자를 수령했을 때에는 별지 제15호서식의 비축물자 인수증을 조달청장에게 제출해야 한다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-r:13","kind":"조문","type":"시행규칙","family":"psa","label":"제13조","title":"신용카드 등을 통한 비축물자대금의 납부","text":"제13조(신용카드 등을 통한 비축물자대금의 납부)\n① 영 제37조에 따른 비축물자대금 납부대행기관(이하 이 조에서 \"비축물자대금 납부대행기관\"이라 한다)으로서 같은 조 제1항에서 \"재정경제부령으로 정하는 기관\"이란 다음 각 호의 어느 하나에 해당하는 기관을 말한다.\n② 조달청장은 영 제37조제2항에 따라 비축물자대금 납부대행기관의 운영경비 등을 종합적으로 고려하여 납부대행 수수료를 정하고, 이를 고시한다.","lawId":"psa-r","group":"조달사업법 시행규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:epa","kind":"법령","type":"법률","family":"epa","label":"전자조달법","name":"전자조달의 이용 및 촉진에 관한 법률","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:1","kind":"조문","type":"법률","family":"epa","label":"제1조","title":null,"text":"제1장 총칙","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:2","kind":"조문","type":"법률","family":"epa","label":"제2조","title":"정의","text":"제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1.\n1.  \"수요기관\"이란 국가기관ㆍ지방자치단체 및 대통령령으로 정하는 공공단체를 말한다.\n2.\n2.  \"계약담당자\"란 관계 법령에 따라 수요기관의 계약사무 처리를 위임 또는 위탁받은 자를 말한다.\n3.\n3.  \"조달업무\"란 수요기관의 장에게 필요한 물자 또는 용역의 구매ㆍ공급에 관한 업무 및 시설공사 계약에 관한 업무를 말한다.\n4.\n4.  \"국가종합전자조달시스템\"이란 제12조에 따라 조달청장이 조달업무를 전자적으로 처리하기 위하여 구축ㆍ운용하는 정보시스템을 말한다.\n5.\n5.  \"전자조달\"이란 국가종합전자조달시스템을 이용 또는 활용하여 조달업무를 전자적으로 처리하는 것을 말한다.\n6.\n6.  \"전자조달이용자\"란 제17조에 따라 국가종합전자조달시스템에 이용자등록을 한 자를 말한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:3","kind":"조문","type":"법률","family":"epa","label":"제3조","title":"적용 범위","text":"제3조(적용 범위) 이 법은 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)을 이용 또는 활용하는 자에 대하여 적용한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:4","kind":"조문","type":"법률","family":"epa","label":"제4조","title":"다른 법률과의 관계","text":"제4조(다른 법률과의 관계) 전자조달에 관하여 「국가를 당사자로 하는 계약에 관한 법률」 또는 「지방자치단체를 당사자로 하는 계약에 관한 법률」(이하 \"계약법률\"이라 한다) 등 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:5","kind":"조문","type":"법률","family":"epa","label":"제5조","title":null,"text":"제2장 조달업무의 전자화","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:6","kind":"조문","type":"법률","family":"epa","label":"제6조","title":"경쟁입찰의 전자적 공고","text":"제6조(경쟁입찰의 전자적 공고)\n① 수요기관의 장 또는 계약담당자는 경쟁입찰을 전자적으로 처리하려는 경우에는 입찰에 관한 사항을 전자조달시스템을 통하여 공고하여야 한다.\n② 제1항에 따른 공고의 방법 및 시기와 그 밖에 필요한 사항은 대통령령으로 정한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:7","kind":"조문","type":"법률","family":"epa","label":"제7조","title":"전자입찰","text":"제7조(전자입찰) 전자조달이용자는 전자조달시스템을 이용하여 이루어지는 경쟁입찰 또는 수의계약 상대자 결정(이하 \"전자입찰\"이라 한다)에 참가할 때에는 대통령령으로 정하는 바에 따라 전자적 형태의 입찰서 또는 견적서를 제출하여야 한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:8","kind":"조문","type":"법률","family":"epa","label":"제8조","title":"계약상대자의 전자적 공고","text":"제8조(계약상대자의 전자적 공고) 수요기관의 장 또는 계약담당자는 전자입찰 결과 계약상대자로 결정된 자(이하 \"계약상대자\"라 한다)를 전자조달시스템을 통하여 공고할 수 있다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:9","kind":"조문","type":"법률","family":"epa","label":"제9조","title":"전자계약서의 작성 및 계약의 성립","text":"제9조(전자계약서의 작성 및 계약의 성립)\n① 수요기관의 장 또는 계약담당자는 전자조달시스템을 이용하여 계약상대자와 계약을 체결하려는 경우에는 계약의 목적, 계약금액, 이행기간, 계약보증금이나 지연배상금(遲延賠償金)에 관한 사항, 그 밖에 필요한 사항이 입력된 전자적 형태의 계약서(이하 \"전자계약서\"라 한다)를 전자조달시스템을 통하여 작성하여야 한다.\n② 다음 각 호의 순서에 따른 요건을 모두 갖춘 때에는 제1항에 따른 계약이 성립한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:9의2","kind":"조문","type":"법률","family":"epa","label":"제9조의2","title":"하도급 관리의 전자적 처리","text":"제9조의2(하도급 관리의 전자적 처리)\n① 수요기관의 장 또는 계약담당자는 계약상대자와 계약을 체결할 때 하도급에 관한 사항을 전자적으로 처리하려는 경우에는 전자조달시스템 또는 수요기관의 장이 전자적으로 하도급 관리를 위하여 구축ㆍ운영하거나 이용하는 시스템(이하 \"전자조달시스템등\"이라 한다)을 활용하여야 한다.\n② 제1항에도 불구하고 대통령령으로 정하는 수요기관의 장 또는 계약담당자는 계약상대자와 체결하는 계약 중 계약 규모 및 기간 등을 고려하여 대통령령으로 정하는 계약의 하도급 대금ㆍ임금 등 계약대금의 청구ㆍ지급 등에 관한 사항은 전자조달시스템등을 통하여 처리하여야 한다.\n③ 제1항에 따른 하도급 관리 및 제2항에 따른 계약대금의 전자적 처리에 관한 내용과 절차 등에 필요한 사항은 대통령령으로 정한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:10","kind":"조문","type":"법률","family":"epa","label":"제10조","title":"보증금의 전자적 납부","text":"제10조(보증금의 전자적 납부)\n① 수요기관의 장 또는 계약담당자는 입찰참가자 또는 계약상대자로 하여금 계약법률 등에 따른 입찰보증금, 계약보증금, 하자보수보증금 등을 전자조달시스템을 이용하여 납부하게 할 수 있다.\n② 제1항에 따른 입찰보증금, 계약보증금, 하자보수보증금 등의 납부는 전자적 형태의 보증서로 제출하는 방법으로 한다. 다만, 계약법률 관계 법령에 따라 현금 등으로 납부하는 경우에는 그러하지 아니하다.\n③ 제1항 및 제2항에 따른 납부의 방법 및 절차 등에 필요한 사항은 대통령령으로 정한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:11","kind":"조문","type":"법률","family":"epa","label":"제11조","title":"전자문서의 송신ㆍ수신","text":"제11조(전자문서의 송신ㆍ수신)\n① 제6조부터 제10조까지의 규정에 따라 전자조달시스템을 통하여 전자적 형태로 작성, 송신ㆍ수신 또는 저장된 문서(이하 \"전자문서\"라 한다)에는 「전자서명법」 제2조제2호에 따른 전자서명(서명자의 실지명의를 확인할 수 있는 것을 말하며, 「전자정부법」 제2조제9호에 따른 행정전자서명을 포함한다)이 있어야 한다.\n② 전자문서는 전자조달시스템에 입력된 때 송신 및 수신된 것으로 본다. 다만, 전자조달이용자가 제출하는 전자입찰서의 경우에는 전자조달시스템에 입력된 시점이 확인되지 아니하더라도 「전자서명법」 제18조에 따라 전자서명인증사업자에게 제시된 시점이 확인된 경우에는 해당 시점을 수신시점으로 할 수 있다.\n③ 「전자문서 및 전자거래 기본법」 제6조제2항제1호 단서에도 불구하고 전자조달시스템 외의 전산장비에 입력된 전자문서는 그 출력 여부와 상관없이 수신되지 아니한 것으로 본다.\n④ 「전자문서 및 전자거래 기본법」 제7조제2항 및 제3항에도 불구하고 전자조달시스템에 입력된 전자문서는 그 송신자의 진의(眞意)와는 관계없이 송신된 것으로 본다.\n⑤ 「전자문서 및 전자거래 기본법」 제9조에도 불구하고 전자문서 송신자는 전자문서의 수신확인통지를 요청하거나 그 효력 발생에 조건을 붙일 수 없다. 다만, 수요기관의 장 또는 계약담당자가 따로 정하는 경우에는 그에 따른다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:12","kind":"조문","type":"법률","family":"epa","label":"제12조","title":null,"text":"제3장 전자조달시스템의 운용 및 관리","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:13","kind":"조문","type":"법률","family":"epa","label":"제13조","title":"전자조달시스템을 이용한 계약 체결의 요청","text":"제13조(전자조달시스템을 이용한 계약 체결의 요청) 수요기관의 장은 「조달사업에 관한 법률」에 따라 조달청장에게 조달물자의 구매ㆍ공급 계약 또는 시설공사 계약의 체결을 요청하려는 경우에는 전자조달시스템을 이용하여야 한다. 다만, 천재지변이나 전산장애 등으로 인한 불가피한 사유가 발생한 경우에는 그러하지 아니하다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:14","kind":"조문","type":"법률","family":"epa","label":"제14조","title":"자체전자조달시스템의 구축ㆍ운영","text":"제14조(자체전자조달시스템의 구축ㆍ운영)\n① 재정경제부장관은 수요기관의 장이 신규로 자체전자조달시스템을 구축하려는 경우 대통령령으로 정하는 요건을 충족하는 수요기관의 장에 한정하여 전자조달시스템과 연계되는 자체전자조달시스템을 구축ㆍ운영하게 할 수 있다.\n② 삭제\n③ 재정경제부장관은 기존에 구축된 자체전자조달시스템을 운영하고 있는 수요기관의 장이 대통령령으로 정하는 요건을 충족하지 못하게 된 경우 제12조의 전자조달시스템으로 이용전환을 하도록 요구할 수 있다.\n④ 수요기관의 장이 자체전자조달시스템을 구축ㆍ운영할 때에는 제12조제3항에 따라 고시된 기준을 최대한 반영하여야 한다.\n⑤ 제1항 및 제3항의 재정경제부장관의 권한은 대통령령으로 정하는 바에 따라 조달청장에게 위임할 수 있다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:15","kind":"조문","type":"법률","family":"epa","label":"제15조","title":"수요기관 외의 자의 전자조달시스템 이용 및 활용","text":"제15조(수요기관 외의 자의 전자조달시스템 이용 및 활용)\n① 수요기관 외의 자는 조달청장의 승인을 받아 전자입찰을 실시하거나 전자조달시스템을 활용하여 새로운 서비스를 개발ㆍ제공하는 등 전자조달시스템을 이용 또는 활용할 수 있다.\n② 조달청장은 수요기관 외의 자가 다음 각 호의 어느 하나에 해당하는 경우에는 전자조달시스템의 이용 또는 활용을 승인하지 아니할 수 있다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:16","kind":"조문","type":"법률","family":"epa","label":"제16조","title":null,"text":"제4장 전자조달이용자 정보의 관리 및 보호","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:17","kind":"조문","type":"법률","family":"epa","label":"제17조","title":"전자조달이용자의 이용자등록 등","text":"제17조(전자조달이용자의 이용자등록 등)\n① 전자조달시스템을 이용하여 수요기관 또는 수요기관 외의 자와 계약을 전자적으로 체결하려는 자는 대통령령으로 정하는 바에 따라 전자조달시스템에 이용자등록을 하여야 한다.\n② 전자조달이용자는 제1항에 따라 등록된 정보에 잘못이 있거나 정보가 변경된 경우에는 이를 수정 또는 변경하여 등록하여야 한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:18","kind":"조문","type":"법률","family":"epa","label":"제18조","title":"비밀보호","text":"제18조(비밀보호)\n① 조달청장은 전자조달이용자의 개인정보, 영업상 비밀 등을 보호하기 위한 대책을 수립하여야 한다.\n② 수요기관의 장 또는 계약담당자는 계약상대자의 동의를 받지 아니하고는 계약상대자의 영업상 비밀을 타인에게 제공하거나 누설하여서는 아니 된다.\n③ 전자조달시스템을 관리ㆍ운영하는 자 또는 관리ㆍ운영하였던 자는 직무상 알게 된 전자문서, 그 밖의 관련 정보의 내용을 누설하거나 직무상 목적 외의 다른 용도로 이를 자신이 이용 또는 제3자로 하여금 이용하게 하여서는 아니 된다.\n④ 제1항에 따른 영업상 비밀을 보호하기 위한 대책의 구체적 내용 등에 관하여 필요한 사항은 대통령령으로 정한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:19","kind":"조문","type":"법률","family":"epa","label":"제19조","title":"전자조달업무의 방해행위 금지","text":"제19조(전자조달업무의 방해행위 금지)\n① 누구든지 전자조달시스템에 거짓 정보나 부정한 명령을 입력하는 등의 방법으로 전자조달업무를 방해하여서는 아니 된다.\n② 누구든지 전자조달시스템에 보관된 전자문서, 그 밖의 관련 정보를 위조 또는 변조하거나 위조 또는 변조된 정보를 행사하여서는 아니 된다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:20","kind":"조문","type":"법률","family":"epa","label":"제20조","title":"부정한 전자조달행위의 금지","text":"제20조(부정한 전자조달행위의 금지) 누구든지 전자입찰에 참여하게 할 목적으로 다른 사람에게 「전자서명법」 제2조제6호에 따른 인증서(서명자의 실지명의를 확인할 수 있는 것을 말한다. 이하 같다)를 양도 또는 대여하거나 전자입찰에 참여할 목적으로 다른 사람의 인증서를 양도 또는 대여받아서는 아니 된다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:21","kind":"조문","type":"법률","family":"epa","label":"제21조","title":null,"text":"제5장 전자조달업무의 촉진 및 지원","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:22","kind":"조문","type":"법률","family":"epa","label":"제22조","title":"국제협력 및 국외수출 촉진","text":"제22조(국제협력 및 국외수출 촉진) 조달청장은 전자조달에 관한 국제협력 및 전자조달시스템의 국외수출을 촉진하기 위하여 다음 각 호의 사업을 할 수 있다.\n1.\n1.  전자조달에 관한 홍보\n2.\n2.  기술ㆍ인력의 교류\n3.\n3.  공동조사ㆍ연구 및 기술협력\n4.\n4.  국제 표준화\n5.\n5.  국내기업의 외국정부 전자조달시장 진출 지원ㆍ협력\n6.\n6.  그 밖에 조달청장이 필요하다고 인정하는 사업","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:23","kind":"조문","type":"법률","family":"epa","label":"제23조","title":"전자조달지원센터","text":"제23조(전자조달지원센터)\n① 조달청장은 전자조달시스템의 발전과 안정적인 운영지원 등을 위하여 전자조달지원센터(이하 \"지원센터\"라 한다)를 지정할 수 있다.\n② 지원센터는 다음 각 호의 사업을 수행한다.\n③ 지원센터는 제2항에 따른 사업을 수행하는 데 필요한 경비를 조달하기 위하여 수익사업을 할 수 있다.\n④ 삭제\n⑤ 지원센터의 지정기준, 사업추진실적 보고 및 경비 지원 등에 관하여 필요한 사항은 대통령령으로 정한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:24","kind":"조문","type":"법률","family":"epa","label":"제24조","title":"지원센터의 지정 취소","text":"제24조(지원센터의 지정 취소) 조달청장은 지원센터가 다음 각 호의 어느 하나에 해당하는 경우에는 그 지정을 취소하거나 6개월 이내의 기간을 정하여 업무의 정지를 명할 수 있다. 다만, 제1호에 해당하면 그 지정을 취소하여야 한다.\n1.\n1.  거짓이나 그 밖의 부정한 방법으로 지원센터로 지정을 받은 경우\n2.\n2.  정당한 사유 없이 계속하여 2년 이상 사업추진 실적이 없는 경우\n3.\n3.  제23조제2항에 따른 사업을 수행할 능력을 상실한 경우\n4.\n4.  제23조제5항에 따른 지정기준에 적합하지 아니하게 된 경우","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:25","kind":"조문","type":"법률","family":"epa","label":"제25조","title":null,"text":"제6장 보칙","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:26","kind":"조문","type":"법률","family":"epa","label":"제26조","title":"포상금의 지급","text":"제26조(포상금의 지급)\n① 조달청장은 제20조에 따른 부정한 전자조달행위를 신고 또는 제보하고 증거자료를 제출한 자(이하 \"신고자\"라 한다)에게 예산의 범위에서 포상금을 지급할 수 있다.\n② 신고 또는 제보를 받은 자는 신고자 등의 신분 등에 관한 비밀을 유지하여야 한다.\n③ 제1항에 따른 포상금 지급대상자의 범위, 지급기준, 지급절차 등에 관하여 필요한 사항은 대통령령으로 정한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:27","kind":"조문","type":"법률","family":"epa","label":"제27조","title":null,"text":"제7장 벌칙","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:28","kind":"조문","type":"법률","family":"epa","label":"제28조","title":"벌칙","text":"제28조(벌칙) 다음 각 호의 어느 하나에 해당하는 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.\n1.\n1.  제18조제2항을 위반하여 계약상대자의 영업상 비밀을 타인에게 제공하거나 누설한 자\n2.\n2.  제18조제3항을 위반하여 직무상 알게 된 전자문서, 그 밖의 관련 정보의 내용을 누설하거나 직무상 목적 외의 다른 용도로 이를 자신이 이용 또는 제3자로 하여금 이용하게 한 자","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:29","kind":"조문","type":"법률","family":"epa","label":"제29조","title":"벌칙","text":"제29조(벌칙) 제20조를 위반하여 전자입찰에 참여하게 할 목적으로 다른 사람에게 인증서를 양도 또는 대여하거나 전자입찰에 참여할 목적으로 다른 사람의 인증서를 양도 또는 대여받은 자는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:30","kind":"조문","type":"법률","family":"epa","label":"제30조","title":"양벌규정","text":"제30조(양벌규정) 법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제27조 및 제29조의 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 해당 조문의 벌금형을 과(科)한다. 다만, 법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다.","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa:31","kind":"조문","type":"법률","family":"epa","label":"제31조","title":null,"text":"제31조 삭제","lawId":"epa","group":"전자조달법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:epa-e","kind":"법령","type":"시행령","family":"epa","label":"전자조달법 시행령","name":"전자조달의 이용 및 촉진에 관한 법률 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:1","kind":"조문","type":"시행령","family":"epa","label":"제1조","title":"목적","text":"제1조(목적) 이 영은 「전자조달의 이용 및 촉진에 관한 법률」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:2","kind":"조문","type":"시행령","family":"epa","label":"제2조","title":"공공단체의 범위","text":"제2조(공공단체의 범위) 「전자조달의 이용 및 촉진에 관한 법률」(이하 \"법\"이라 한다) 제2조제1호에서 \"대통령령으로 정하는 공공단체\"란 다음 각 호의 어느 하나에 해당하는 기관이 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)의 이용 또는 활용을 요청하여 조달청장이 수요기관으로 인정한 기관을 말한다.\n1.\n1.  「공공기관의 운영에 관한 법률」 제4조에 따라 지정된 공공기관\n2.\n2.  「초ㆍ중등교육법」, 「고등교육법」 및  그 밖에 다른 법률에 따라 설치된 각급 학교\n3.\n3.  지방자치단체가 납입자본금을 출자한 기관\n4.\n4.  지방자치단체가 출연한 기관\n5.\n5.  공공목적을 위하여 특별법에 따라 설립된 법인\n6.\n6.  제1호부터 제5호까지의 규정에 해당하는 기관의 지분 합계가 50퍼센트 이상인 기관\n7.\n7.  제1호부터 제6호까지의 규정에 해당하는 기관 외에 「조달사업에 관한 법률 시행령」 제4조에 따라 조달청장이 인정한 기관","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:3","kind":"조문","type":"시행령","family":"epa","label":"제3조","title":"전자조달 촉진을 위한 시책","text":"제3조(전자조달 촉진을 위한 시책) 법 제5조제2항에 따른 전자조달을 촉진하기 위한 시책에는 다음 각 호의 사항이 포함되어야 한다.\n1.\n1.  전자조달을 촉진하기 위한 기본 방향에 관한 사항\n2.\n2.  전자조달시스템의 발전 및 운영에 관한 사항\n3.\n3.  전자조달을 위한 통계의 수집ㆍ분석과 활용 방안에 관한 사항\n4.\n4.  그 밖에 전자조달에 관한 교육ㆍ훈련 등 전자조달을 촉진하기 위하여 필요한 사항","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:4","kind":"조문","type":"시행령","family":"epa","label":"제4조","title":"전자적 공고의 방법 및 시기 등","text":"제4조(전자적 공고의 방법 및 시기 등)\n① 법 제6조제2항에 따른 공고의 방법 및 시기는 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제33조부터 제36조까지 또는 「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」 제33조부터 제36조까지의 규정에 따른다.\n② 수요기관의 장 또는 계약담당자는 국제입찰인 경우에는 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」 제8조제2항 각 호의 사항을 전자조달시스템을 통하여 공고하여야 한다.\n③ 전자조달시스템에 게시된 내용과 붙임 파일 형태의 입찰공고문(이하 \"입찰공고문\"이라 한다)의 내용이 다른 경우에는 입찰공고문의 내용이 우선한다. 다만, 입찰공고일은 전자조달시스템에 게시한 날과 입찰공고문에 적힌 입찰공고일이 다른 경우 전자조달시스템에 게시한 날이 우선한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 경쟁입찰의 전자적 공고에 필요한 사항은 재정경제부령으로 정한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:5","kind":"조문","type":"시행령","family":"epa","label":"제5조","title":"전자적 형태의 입찰서 제출","text":"제5조(전자적 형태의 입찰서 제출)\n① 전자조달이용자는 법 제7조에 따른 전자적 형태의 입찰서(이하 \"전자입찰서\"라 한다)를 경쟁입찰의 전자적 공고에서 지정한 기간 내에 전자조달시스템을 이용하여 제출하여야 한다.\n② 전자조달이용자는 같은 입찰에 대해서는 같은 컴퓨터에서 하나의 전자입찰서만을 제출할 수 있다.\n③ 전자조달이용자는 전자조달시스템으로 제출한 전자입찰서를 교환ㆍ변경하거나 취소할 수 없다. 다만, 전자입찰서를 제출한 전자조달이용자는 전자입찰서의 입찰금액 등 중요한 입력사항에 오류가 있는 경우에는 재정경제부령으로 정하는 바에 따라 수요기관의 장 또는 계약담당자에게 법 제7조에 따른 전자입찰(이하 \"전자입찰\"이라 한다)의 취소를 신청할 수 있다.\n④ 수요기관의 장 또는 계약담당자는 제3항에 따른 취소 신청을 받은 경우에는 신청한 전자조달이용자의 전자입찰을 취소하고, 해당 전자입찰서를 무효로 처리할 수 있다.\n⑤ 전자조달이용자는 제3항 단서 및 제4항에 따라 전자입찰의 취소를 신청하여 전자입찰서가 무효로 처리되면 그 전자입찰에는 참여할 수 없다. 다만, 수요기관의 장 또는 계약담당자가 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제20조 또는 「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」 제19조에 따른 재입찰 또는 재공고입찰에 부치는 경우에는 그러하지 아니하다.\n⑥ 전자입찰서와 함께 전자조달시스템을 통하여 제출된 전자입찰 부속서류에 암호가 설정되었거나 컴퓨터 바이러스가 감염되는 등의 사유로 전자입찰 부속서류를 판독하기 곤란한 경우에는 전자입찰 부속서류가 제출되지 아니한 것으로 본다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:6","kind":"조문","type":"시행령","family":"epa","label":"제6조","title":"전자공개수의계약","text":"제6조(전자공개수의계약)\n① 수요기관의 장 또는 계약담당자는 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제30조 또는 「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」 제30조에 따라 2인 이상으로부터 견적서를 받아야 하는 수의계약에 대하여 전자조달시스템을 통하여 계약상대자를 결정할 경우에는 법 제7조에 따른 전자적 형태의 견적서(이하 \"전자견적서\"라 한다)의 제출에 필요한 사항을 분명하게 적어 전자조달시스템을 통하여 안내공고를 하여야 한다.\n② 제1항에 따른 전자견적서의 제출 및 안내공고에 관하여는 제4조와 제5조를 준용한다. 이 경우 제4조 중 \"입찰공고문\"은 \"안내공고문\"으로, 제5조 중 \"전자입찰서\"는 \"전자견적서\"로 본다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:7","kind":"조문","type":"시행령","family":"epa","label":"제7조","title":"하도급 관리의 전자적 처리","text":"제7조(하도급 관리의 전자적 처리)\n① 전자조달이용자는 상호 간에 하도급계약을 할 때에는 전자조달시스템 또는 법 제9조의2제1항에 따라 수요기관의 장이 전자적으로 하도급 관리를 위하여 운영하는 시스템(이하 \"전자조달시스템등\"이라 한다)을 이용하여 전자적 형태의 하도급계약서를 작성할 수 있다.\n② 전자조달시스템등은 다음 각 호의 기능을 포함해야 한다.\n③ 계약체결자 및 하수급인은 제2항제1호 각 목에 따른 금액의 지급을 위한 전용계좌를 개설하여 전자조달시스템등에 등록해야 한다.\n④ 「국가를 당사자로 하는 계약에 관한 법률」 또는 「공공기관의 운영에 관한 법률」을 적용받는 수요기관의 장은 법 제9조의2제1항에 따라 전자적으로 하도급 관리를 위하여 운영하는 시스템을 구축하려는 경우에는 미리 재정경제부장관과 협의해야 한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:7의2","kind":"조문","type":"시행령","family":"epa","label":"제7조의2","title":"하도급 관리의 전자적 처리 의무 대상","text":"제7조의2(하도급 관리의 전자적 처리 의무 대상)\n① 법 제9조의2제2항에서 \"대통령령으로 정하는 수요기관\"이란 다음 각 호의 어느 하나에 해당하는 기관을 말한다.\n② 법 제9조의2제2항에서 \"대통령령으로 정하는 계약\"이란 다음 각 호의 어느 하나에 해당하는 계약을 말한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:8","kind":"조문","type":"시행령","family":"epa","label":"제8조","title":"보증금의 전자적 납부 방법 및 절차 등","text":"제8조(보증금의 전자적 납부 방법 및 절차 등)\n① 수요기관의 장 또는 계약담당자가 법 제10조제1항 및 같은 조 제2항 본문에 따라 입찰보증금, 계약보증금, 하자보수보증금 등을 입찰참가자 또는 계약상대자에게 전자조달시스템을 이용하여 전자적 형태의 보증서로 제출하게 하는 경우에는 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제37조제2항에 따른 보증서등(이하 \"보증서등\"이라 한다)을 전자적 형태로 제출하게 하는 방법으로 한다. 다만, 수요기관의 장 또는 계약담당자는 전자조달시스템의 장애 등으로 보증서등을 전자적 형태로 제출하는 것이 불가능한 경우에는 직접 제출하게 할 수 있다.\n② 보증기관(「국가를 당사자로 하는 계약에 관한 법률 시행령」 제37조제2항에 따른 보증서등을 발행하는 기관을 말한다)은 「전자서명법」제2조제2호에 따른 전자서명(서명자의 실지명의를 확인할 수 있는 것으로 한정한다)이 포함된 전자적 형태의 보증서를 전자조달시스템을 이용하여 해당 수요기관의 장 또는 계약담당자에게 전송하고, 정상적으로 송신되었는지를 확인하여야 한다.\n③ 전자적 형태의 입찰보증서는 입찰공고문에서 따로 정한 경우를 제외하고는 전자입찰서의 제출마감일 전날까지 전자조달시스템에 접수되어야 한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:9","kind":"조문","type":"시행령","family":"epa","label":"제9조","title":"전자조달시스템의 운용을 위한 정보의 제공 요청 등","text":"제9조(전자조달시스템의 운용을 위한 정보의 제공 요청 등)\n① 조달청장은 법 제12조제2항에 따라 수요기관의 장 등 관계 기관의 장에게 다음 각 호의 자료 또는 정보의 제공을 요청할 수 있다.\n② 조달청장은 제1항 각 호의 자료 또는 정보를 관계 기관의 장에게 서면, 팩스 또는 전자적 방법으로 제공할 것을 요청할 수 있다.\n③ 조달청장은 수요기관의 원활한 계약사무 수행을 지원하기 위하여 필요한 범위에서 계약에 관한 정보 등을 수집하여 제공하거나 전자거래에 필요한 역무를 제공할 수 있다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:9의2","kind":"조문","type":"시행령","family":"epa","label":"제9조의2","title":"자체전자조달시스템의 구축ㆍ운영","text":"제9조의2(자체전자조달시스템의 구축ㆍ운영)\n① 법 제14조제1항에서 \"대통령령으로 정하는 요건\"이란 다음 각 호의 어느 하나를 말한다.\n② 법 제14조제3항에서 \"대통령령으로 정하는 요건을 충족하지 못하게 된 경우\"란 제1항 각 호의 어느 하나에도 해당하지 않는 경우로서 법 제12조제3항에 따라 고시된 기준 중 조달청장이 정하는 기준을 충족하지 못하는 경우를 말한다.\n③ 재정경제부장관은 법 제14조제5항에 따라 다음 각 호의 권한을 조달청장에게 위임한다. 다만, 신규로 자체전자조달시스템을 구축하게 하거나 기존에 구축된 자체전자조달시스템을 전자조달시스템으로 이용전환을 하도록 요구하는 때에는 미리 재정경제부장관과 협의해야 한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:10","kind":"조문","type":"시행령","family":"epa","label":"제10조","title":"전자조달시스템 이용 또는 활용의 제한","text":"제10조(전자조달시스템 이용 또는 활용의 제한) 법 제15조제2항제3호에서 \"대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n1.\n1.  최근 3년 이내에 법 제18조부터 제20조까지의 규정을 위반하여 처벌을 받은 자인 경우\n2.\n2.  체납된 국세나 지방세가 있는 자인 경우\n3.\n3.  「국가를 당사자로 하는 계약에 관한 법률」 제27조 또는 「지방자치단체를 당사자로 하는 계약에 관한 법률」 제31조에 따라 부정당업자로 입찰 참가자격을 제한받고 있는 자인 경우","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:11","kind":"조문","type":"시행령","family":"epa","label":"제11조","title":"전자조달시스템의 이용자등록 등","text":"제11조(전자조달시스템의 이용자등록 등)\n① 법 제7조에 따라 전자입찰에 참가하려는 자는 전자입찰서 제출마감일 전날까지 법 제17조제1항에 따른 이용자등록을 하여야 한다. 등록된 사항이 변경된 경우에도 또한 같다.\n② 법 제17조에 따라 이용자등록을 하려는 자 또는 이용자등록을 변경하려는 전자조달이용자는 「전자서명법」제2조제6호에 따른 인증서(서명자의 실지명의를 확인할 수 있는 것으로 한정한다)로 전자조달시스템을 이용하여 이용자등록이나 그 변경을 신청하여야 한다.\n③ 제1항과 제2항에서 규정한 사항 외에 전자조달시스템의 이용자등록 및 변경에 필요한 사항은 조달청장이 정하여 고시한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:12","kind":"조문","type":"시행령","family":"epa","label":"제12조","title":"영업상 비밀의 범위 등","text":"제12조(영업상 비밀의 범위 등)\n① 법 제18조제1항에 따른 영업상 비밀의 범위는 다음 각 호와 같다. 다만, 공공연하게 알려져 있거나 전자조달이용자의 동의를 받은 사항은 제외한다.\n② 법 제18조제4항에 따른 영업상 비밀을 보호하기 위한 대책은 다음 각 호와 같다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:13","kind":"조문","type":"시행령","family":"epa","label":"제13조","title":"전자조달지원센터의 지정기준 등","text":"제13조(전자조달지원센터의 지정기준 등)\n① 법 제23조제1항에 따른 전자조달지원센터(이하 \"지원센터\"라 한다)의 지정기준은 다음 각 호와 같다.\n② 지원센터로 지정을 받으려는 자는 재정경제부령으로 정하는 지정신청서를 조달청장에게 제출하여야 한다. 지정 사항을 변경하려는 경우에도 또한 같다.\n③ 조달청장은 제2항에 따른 지정신청을 받은 경우에는 제1항에 따른 지정기준에 적합한 자를 지원센터로 지정하고, 신청인에게 재정경제부령으로 정한 지정서를 발급하여야 한다.\n④ 조달청장은 법 제23조제2항에 따라 지원센터가 수행하는 사업에 드는 경비의 전부 또는 일부를 예산의 범위에서 지원할 수 있다.\n⑤ 제4항에 따라 경비 지원을 받은 지원센터는 해당 연도의 사업이 끝난 후 2개월 이내에 해당 연도의 사업추진실적, 예산집행실적 및 다음 연도의 사업계획을 조달청장에게 제출하여야 한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:14","kind":"조문","type":"시행령","family":"epa","label":"제14조","title":"전자조달시스템의 이용수수료","text":"제14조(전자조달시스템의 이용수수료)\n① 법 제25조제1항에 따른 전자조달시스템의 이용수수료는 전자조달시스템의 운영에 드는 실비(實費)의 범위에서 조달청장이 재정경제부장관과 협의하여 정한 후 고시한다.\n② 법 제25조제2항에 따른 연체료는 이용수수료의 1천분의 10을 넘지 아니하는 범위에서 재정경제부령으로 정한다.\n③ 제1항과 제2항에 따른 이용수수료와 연체료는 현금으로 납부하여야 한다. 다만, 조달청장은 전자통신망을 이용하여 전자화폐ㆍ전자결제 등의 방법으로 수수료를 납부하게 할 수 있다.\n④ 법 제25조제1항 각 호의 어느 하나에 해당하는 자로부터 징수하는 이용수수료 및 연체료는 「정부기업예산법」 제3조제4호에 따른 조달특별회계의 세입으로 한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:15","kind":"조문","type":"시행령","family":"epa","label":"제15조","title":"포상금 지급대상자의 범위 등","text":"제15조(포상금 지급대상자의 범위 등)\n① 법 제26조제1항에 따른 포상금의 지급대상자는 다음 각 호의 요건을 모두 갖춘 신고자(같은 항에 따른 신고자를 말한다)로 한다.\n② 법 제26조제1항에 따른 포상금의 지급금액은 2천만원의 범위에서 부정한 전자조달행위의 규모, 전자조달 사업에 미치는 영향과 예산 등을 고려하여 조달청장이 정한다.\n③ 법 제26조제1항에 따라 법 제20조에 따른 부정한 전자조달행위를 신고하거나 제보하고 증거자료를 제출하려는 자는 부정한 전자조달행위 신고서 또는 제보서에 인적 사항과 증거자료 등을 첨부하여 조달청장이 정하여 고시하는 바에 따라 조달청장에게 제출하여야 한다.\n④ 제3항에 따른 신고나 제보를 받은 조달청장은 법 제20조에 따른 부정한 전자조달행위와 관련된 사실 관계를 조사하고, 그 결과를 신고하거나 제보하고 증거자료를 제출한 사람에게 통지하여야 한다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 포상금의 구체적인 유형별 지급금액과 포상금의 지급시기 등에 관하여 필요한 사항은 조달청장이 정하여 고시한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:16","kind":"조문","type":"시행령","family":"epa","label":"제16조","title":"전자조달 기록물의 보존","text":"제16조(전자조달 기록물의 보존) 조달청장은 전자조달시스템을 통하여 처리한 전자기록물을 5년간 보존하여야 한다.","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:epa-e:17","kind":"조문","type":"시행령","family":"epa","label":"제17조","title":null,"text":"제17조 삭제","lawId":"epa-e","group":"전자조달법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:epa-r","kind":"법령","type":"시행규칙","family":"epa","label":"전자조달법 시행규칙","name":"전자조달의 이용 및 촉진에 관한 법률 시행규칙","확인일":"20260721","시행일":"20130923","상태":"현행"},{"id":"art:epa-r:1","kind":"조문","type":"시행규칙","family":"epa","label":"제1조","title":"목적","text":"제1조(목적) 이 규칙은 「전자조달의 이용 및 촉진에 관한 법률」 및 같은 법 시행령에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.","lawId":"epa-r","group":"전자조달법 시행규칙","확인일":"20260721","시행일":"20130923","상태":"현행"},{"id":"art:epa-r:2","kind":"조문","type":"시행규칙","family":"epa","label":"제2조","title":"전자입찰서의 제출마감 일시의 공고 등","text":"제2조(전자입찰서의 제출마감 일시의 공고 등)\n① 「전자조달의 이용 및 촉진에 관한 법률」(이하 \"법\"이라 한다) 제7조에 따른 전자입찰(이하 \"전자입찰\"이라 한다)을 실시하는 수요기관의 장 또는 계약담당자는 「전자조달의 이용 및 촉진에 관한 법률 시행령」(이하 \"영\"이라 한다) 제4조에 따라 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)을 통하여 공고할 때에는 다음 각 호의 사항을 포함하여 전자입찰에 필요한 사항을 전자조달시스템에 입력하여야 한다.\n② 수요기관의 장 또는 계약담당자는 제1항제1호에 따른 전자입찰서의 접수시작 일시부터 같은 항 제2호에 따른 전자입찰서의 제출마감 일시까지가 최소한 48시간 이상이 되도록 정하여야 한다.\n③ 수요기관의 장 또는 계약담당자는 제1항제2호에 따른 전자입찰서의 제출마감 일시를 근무일(토요일과 「관공서의 공휴일에 관한 규정」 제2조에 따른 공휴일 및 수요기관이 정한 휴무일을 제외한 날을 말한다)의 오전 10시부터 오후 5시까지로 하여야 한다. 다만, 전자입찰의 목적과 특수성 등을 고려하여 전자입찰서의 제출마감 일시를 달리 적용할 경우에는 그 사유를 입찰공고문에 명시하여야 한다.\n④ 제1항제4호에 따른 개찰 일시는 전자입찰서의 제출마감 일시부터 1시간이 지난 때로 한다.","lawId":"epa-r","group":"전자조달법 시행규칙","확인일":"20260721","시행일":"20130923","상태":"현행"},{"id":"art:epa-r:3","kind":"조문","type":"시행규칙","family":"epa","label":"제3조","title":"공동수급협정서의 제출","text":"제3조(공동수급협정서의 제출)\n① 전자조달이용자는 법 제7조에 따라 전자입찰에 참가할 때 공동수급체(共同受給體)를 구성하여 전자입찰에 참가하는 경우에는 전자입찰서의 제출마감일 전일까지 공동수급협정서(계약상대자를 둘 이상으로 하는 공동계약을 할 때 공동수급체 구성원 상호간의 권리ㆍ의무 등에 관한 중요 사항을 규정한 협정서를 말한다)를 전자조달시스템을 통하여 제출하여야 한다.\n② 제1항에 따른 공동수급협정서는 전자조달시스템을 이용하여 전자입찰서를 제출한 후에는 제출할 수 없다. 제출된 공동수급협정서의 내용을 변경하려는 경우에도 또한 같다.","lawId":"epa-r","group":"전자조달법 시행규칙","확인일":"20260721","시행일":"20130923","상태":"현행"},{"id":"art:epa-r:4","kind":"조문","type":"시행규칙","family":"epa","label":"제4조","title":"전자입찰의 취소 신청 등","text":"제4조(전자입찰의 취소 신청 등)\n① 전자조달이용자는 영 제5조제3항 단서에 따라 전자입찰의 취소를 신청할 때에는 제2조제1항제4호에 따라 공고한 개찰 일시 이전까지 별지 제1호서식의 전자입찰 취소 신청서를 수요기관의 장 또는 계약담당자에게 전자조달시스템을 이용하거나 직접 또는 팩스 전송 등의 방법으로 제출하여야 한다.\n② 전자조달이용자는 제1항에 따라 전자입찰 취소 신청서를 직접 또는 팩스 전송 등의 방법으로 제출할 때에는 전자조달시스템에 등록된 도장을 찍어야 한다. 다만, 전자조달시스템에 등록된 도장이 없는 경우에는 「상업등기법」에 따른 법인의 인감도장이나 「인감증명법」에 따라 신고한 인감도장을 찍고 인감증명서를 함께 제출하여야 한다.","lawId":"epa-r","group":"전자조달법 시행규칙","확인일":"20260721","시행일":"20130923","상태":"현행"},{"id":"art:epa-r:5","kind":"조문","type":"시행규칙","family":"epa","label":"제5조","title":"전자조달지원센터의 지정 신청","text":"제5조(전자조달지원센터의 지정 신청)\n① 영 제13조제2항에 따라 전자조달지원센터(이하 \"지원센터\"라 한다)의 지정을 받으려는 자는 별지 제2호서식의 전자조달지원센터 지정 신청서(전자문서로 된 신청서를 포함한다)에 다음 각 호의 서류(전자문서를 포함한다)를 첨부하여 조달청장에게 제출하여야 한다.\n② 제1항에 따른 신청을 받은 조달청장은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서를 확인할 수 있다.\n③ 영 제13조제3항에 따른 지정서는 별지 제3호서식과 같다.","lawId":"epa-r","group":"전자조달법 시행규칙","확인일":"20260721","시행일":"20130923","상태":"현행"},{"id":"art:epa-r:6","kind":"조문","type":"시행규칙","family":"epa","label":"제6조","title":"지원센터의 지정 변경 신청","text":"제6조(지원센터의 지정 변경 신청)\n① 지원센터로 지정을 받은 자가 영 제13조제2항 후단에 따라 다음 각 호의 사항을 변경하려는 때에는 별지 제4호서식의 전자조달지원센터 지정 변경 신청서를 조달청장에게 제출하여야 한다.\n② 제1항에 따른 변경 신청서에는 다음 각 호의 서류를 첨부하여야 한다.","lawId":"epa-r","group":"전자조달법 시행규칙","확인일":"20260721","시행일":"20130923","상태":"현행"},{"id":"art:epa-r:7","kind":"조문","type":"시행규칙","family":"epa","label":"제7조","title":"연체료의 부과 금액","text":"제7조(연체료의 부과 금액) 영 제14조제2항에 따른 연체료는 다음 각 호의 구분에 따른 금액으로 한다.\n1.\n1.  이용수수료의 납입기한이 지난 날부터 10일 이내에 이용수수료를 납입하는 경우: 연체금액의 1천분의 1에 해당하는 금액\n2.\n2.  이용수수료의 납입기한이 지난 날부터 10일을 초과하고 30일 이내에 이용수수료를 납입하는 경우: 연체금액의 1천분의 5에 해당하는 금액\n3.\n3.  이용수수료의 납입기한이 지난 날부터 30일을 초과하여 이용수수료를 납입하는 경우: 연체금액의 1천분의 10에 해당하는 금액","lawId":"epa-r","group":"전자조달법 시행규칙","확인일":"20260721","시행일":"20130923","상태":"현행"},{"id":"law:ye-jibhaeng","kind":"법령","type":"계약예규","family":"nca","label":"정부입찰계약집행기준","name":"(계약예규) 정부 입찰·계약 집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 공사 등의 입찰ㆍ계약의 집행과 관련하여 「국가를 당사자로 하는 계약에 관한 법률시행령」(이하 \"시행령\"이라 한다), 「국가를 당사자로 하는 계약에 관한 법률시행규칙」(이하 \"시행규칙\"이라 한다) 및 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」(이하 \"특례규정\"이라 한다)에서 위임된 사항과 그 시행에 관하여 필요한 사항을 규정함을 목적으로 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 예규에서 사용하는 용어의 정의는 다음과 같다.1. \"계약담당공무원\"이라 함은 시행규칙 제2조에 의한 공무원을 말한다. 이 경우 각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다.2. \"계약상대자\"라 함은 정부와 계약을 체결한 자연인 또는 법인을 말한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:2의2","kind":"조문","type":"계약예규","family":"nca","label":"제2조의2","title":"물품, 용역, 공사가 혼재된 계약의 집행","text":"제2조의2(물품, 용역, 공사가 혼재된 계약의 집행) ① 계약담당공무원은 물품, 용역, 공사 중 2개 이상이 혼재된 계약을 발주하려는 경우에는 사업계획 단계부터 다음의 사항을 고려하여 일괄 또는 분리발주 여부를 검토하여야 한다.1. 물품ㆍ용역ㆍ공사 등 각 목적물 유형별  독립성ㆍ가분성2. 계약목적물의 일부에 공사가 포함된 계약을 발주함에 있어서 「건설산업기본법」,「전기공사업법」,「정보통신공사업법」등 공사관련 법령의 준수 여부3. 계약이행 및 관리의 효율성에 미치는 영향4. 하자 등 책임구분의 용이성5. 각 발주방식에 따른 해당시장의 경쟁제한효과② 계약담당공무원은 제1항에 따라 계약을 일괄하여 발주하려는 경우 예정가격에 작성함에 있어 다음 사항을 유의하여 집행하여야 한다.1. 예정가격 산정에 있어 설치비용 등 부수적인 목적물에 대한 비용(설치에 수반되는 재료비, 노무비, 경비, 일반관리비 및 이윤 등)이 누락되었는지 여부  2. 공사가 혼재된 계약의 예정가격 산정에 있어서 공사부분에 대한 산업재해보험, 고용보험 등 법령이나 계약조건에 의하여 의무적으로 가입이 요구되는 보험의 보험료를 「건설산업기본법」 제22조제7항 등 관련법령에서 정한 바에 따라 계상하였는지 여부 [본조신설 2016.12.30.]③ 계약담당공무원은 제1항에 따라 계약을 일괄하여 발주하려는 경우 역무내용 중「건설기술진흥법」,「전력기술관리법」,「정보통신공사업법」등 공사 관련 법령에 따른 의무적 설계 또는 감리 대상이 포함되어 있는 경우에는 용역계약의 발주 등 관련 법령에 따른 조치를 취하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:2의3","kind":"조문","type":"계약예규","family":"nca","label":"제2조의3","title":"하도급 관련사항의 공고","text":"제2조의3(하도급 관련사항의 공고) ① 각 중앙관서의 장 또는 계약담당공무원은 입찰공고시 하도급과 관련하여 계약상대자가 숙지하여야 할 다음의 사항 등을 공고하여야 한다.1. 건설산업기본법 등 개별법령상 하도급 관련규정의 준수2. 해당 계약에 있어서 하도급이 가능한지 여부3. 관련법령상 하도급규정을 위반하여 하도급을 하거나, 발주기관의 승인없이 하도급을 하는 경우 입찰참가자격 제한을 받을 수 있다는 취지4. 하도급이 가능한 계약의 이행에 있어 하도급 승인 절차② 각 중앙관서의 장 또는 계약담당공무원은 제1항 제4호의 하도급 승인을 함에 있어서 하도급을 받을 자의 실적부족을 이유로 승인을 거부하여서는 아니된다. 다만, 입찰공고시 사전에 하도급 받을 자의 요건을 명시한 경우는 그러하지 아니하다.③ 각 중앙관서의 장 또는 계약담당공무원은 제1항 제4호의 하도급 승인절차와 관련하여 과업의 내용 및 계약의 난이도 등을 고려하여 필요하다고 인정하는 경우 계약체결시에 구체적인 업무범위를 정하여 하도급을 사전적으로 승인할 수 있다.④ 제1항 내지 제3항에도 불구하고 하도급의 가부, 하도급 승인 등에 대해 「건설산업기본법」,「중소기업제품 구매촉진 및 판로지원에 관한 법률」 등 다른 법령에서 정하고 있는 경우에는 그 규정에 따른다.[본조신설 2017.12.28.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:2의4","kind":"조문","type":"계약예규","family":"nca","label":"제2조의4","title":"예정가격 결정과 관련한 책정기준 등의 공고","text":"제2조의4(예정가격 결정과 관련한 책정기준 등의 공고) ① 각 중앙관서의 장 또는 계약담당공무원은 시행령 제9조제1항제2호 또는 제3호의 방식으로 예정가격을 결정한 경우에는 제36조제16호에 따라 입찰공고에 다음 각 호의 사항을 명시하여야 한다.1. 시행규칙 제7조제1항에서 정한 단위당 가격 및 적용기준 공표기관, 공표시기 또는 적용대상기간2. 다른 법령 등에서 계상하도록 규정한 비용(국민건강보험료 등)의 적용 기준3. 시행규칙 제8조제1항에 따른 일반관리비율 및 이윤율4. 그 밖에 각 중앙관서의 장 또는 계약담당공무원이 공개가 필요하다고 인정하는 정보② 각 중앙관서의 장 또는 계약담당공무원은 제1항의 공고사항이 입찰의 공정성을 훼손할 우려가 있다고 판단되는 경우에는 입찰공고 시 제외할 수 있다. 이 경우 제외 사유를 입찰공고에 명시하여야 한다.[본조신설 2018.12.31.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:2의5","kind":"조문","type":"계약예규","family":"nca","label":"제2조의5","title":"순공사원가 기준 등의 공고","text":"제2조의5(순공사원가 기준 등의 공고) 각 중앙관서의 장 또는 계약담당공무원은 영 제42조제1항 및 제4항에 따라 공사를 입찰공고할 때에는 다음 각 호의 사항을 명시하여야 한다.1. 예정가격이 100억원 미만인 공사의 경우 예정가격 중 재료비ㆍ노무비ㆍ경비 및 이에 대한 부가가치세를 합산한 금액의 100분의 98 미만으로 입찰한 자는 낙찰자로 결정하지 않는다는 사항2. 「예정가격작성기준」 제44조의3에 의한 기초금액 중 재료비, 노무비, 경비와 이에 대한 부가가치세를 합산한 금액(다만, 복수예비가격에 의하여 예정가격을 결정하는 경우에 한함)[본조신설 2020.4.7.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:2의6","kind":"조문","type":"계약예규","family":"nca","label":"제2조의6","title":"계약담당공무원 유의사항","text":"제2조의6(계약담당공무원 유의사항) 계약담당공무원은 공사ㆍ용역 및 물품제조(구매)계약 등의 입찰ㆍ계약의 집행과 관하여 이 예규에서 정한 바에 따라 업무를 처리하여야 하며 다음 각 호의 사례가 발생하지 않도록 유의하여야 한다.1. 입찰공고ㆍ특수조건에 특정업체에게 하도급하게 하거나 자재를 납품하게 하는 등 부당한 요구를 하는 사례2. 납품실적 등의 평가와 관련하여 제5조제4항 각호에 따른 제한사유를 평가기준으로 적용하는 사례3. 신기술ㆍ특허공법 보유자 또는 물품공급ㆍ기술지원사와 발주 전에 기술사용(지원)협약 등을 체결하지 아니하고 낙찰자로 하여금 직접 신기술ㆍ특허 보유자 또는 물품공급ㆍ기술지원사와 체결한 사용협약서 또는 물품공급ㆍ기술지원협약서를 제출하게 하거나 이로 인해 낙찰자가 계약을 체결할 수 없는 경우에도 부정당업자로 입찰참가자격을 제한하고 입찰보증금을 귀속하는 사례4. 신기술ㆍ특허공법 보유자 또는 물품공급ㆍ기술지원사와 발주기관이 사전에 체결한 기술사용(지원)협약 등과 다르게 부당한 요구를 하여 낙찰자와 신기술ㆍ특허 보유자 또는 물품공급ㆍ기술지원사가 간 협약이 체결되지 않게 하는 사례5. 신기술ㆍ특허공법이 사용되는 공사의 전부 또는 일부가 기술보유자의 기술력을 활용하지 아니하면 시공과 품질 확보가 불가능하거나, 기술보유자가 보유한 특수 장비 등을 직접 사용하지 아니하면 시공과 품질 확보가 불가능한 경우를 제외하고 계약상대자에게 신기술ㆍ특허공법 보유자와 하도급계약 등을 체결하도록 강요ㆍ유도하는 사례6. 전문성, 기술성, 창의성, 예술성, 안정성 등이 요구되지 않는 물품, 용역을 협상에 의한 계약체결로 집행하는 사례7. 협상에 의한 계약체결시 특정 항목에 대해 과다하게 배점을 부여하거나 기술과 가격의 평가비중을 자의적으로 설정하는 사례8. 시행령 제18조에 따른 2단계 경쟁 등의 입찰, 시행령 제43조에 따른 협상에 의한 계약체결 및 시행령 제43조의3에 따른 경쟁적 대화에 의한 계약체결 등의 경우 평가기준 및 절차(외부전문가를 위원으로 선정하여 평가하는 경우를 포함한다)등을 정함에 있어 특정업체에 유리한 평가기준을 적용하는 등 공정성, 객관성, 적합성 등이 결여되는 사례9. 수의계약 시에도 규격서나 시방서 등에 특별한 이유가 없는 한 표준시방서를 명시하여 수의계약 대상제품을 효율성ㆍ안전성ㆍ경제성을 고려하여 최종 선택해야 함에도 부득이하게 특별하여 필요한 경우를 제외하고 특정제품 규격이나 인증번호 등을 명시하여 수의계약 체결을 요구하는 사례10. 법 제19조 등에 따른 계약 내용의 변경에 따른 계약금액 조정과 관련하여 계약금액의 조정 없이 추가 과업을 요구하거나 일방적으로 과업을 변경하며 정당한 이유 없이 계약금액 조정신청을 거부 또는 인정하지 아니하는 사례11. 발주기관이 계약체결 이후 과업을 변경 시 계약 목적달성을 위해 필요한 최소한의 과업만을 변경하지 않고 빈번하게 과업변경을 계약상대자에게 요구하는 사례 또는 계약금액 감액 시 기준, 대상, 방식에 대한 협의 없이 자의적으로 업체의 적정대가를 보장하지 않는 사례12. 장기계속계약의 연차별 계약기간 중 계약예규 「공사계약일반조건」제25조제3항 제1호부터 제3호까지 및 제6호ㆍ제7호에 따른 사유가 발생한 이후, 해당 연차계약을 해지하고 남은 공사부분을 차년도 연차계약으로 이월하는 사례13. 계약체결 부대비용 등 계약체결 및 이행 과정에서 발생하는 비용 중 발주기관이 부담할 부분을 계약상대자에게 전가하거나, 공사용지 확보, 사업관련 민원대응 등 발주기관의 업무를 계약상대자에게 전가하는 행위14. 계약상대자에 대해 계약의 이행 및 관리과정의 통지ㆍ신청ㆍ청구ㆍ요구ㆍ회신ㆍ승인 또는 지시를 서면으로 시행하지 않고 구두로 하는 행위15. 발주기관이 「조달사업에 관한 법률」 제27조 제1항에 따른 혁신제품을 자재로 사용토록한 공사계약의 경우로서 혁신제품의 하자가 직접적인 원인이 되어 전체 계약의 이행이 불가능하게 되거나 목적물에 하자가 발생한 경우, 계약상대자에 대해 계약불이행 또는 하자보수에 대한 책임을 묻는 행위  16. 발주기관이 일괄ㆍ기술제안입찰사업 등 입찰안내서 작성 시 관행적인 사유 등으로 국가계약법 시행령, 국가계약법 시행규칙, 국가계약법 특례규정 및 계약예규 등에 위배되거나 계약상대자간의 불공정한 계약내용을 포함하는 행위  17. 발주기관이 일괄ㆍ기술제안입찰에 있어서 「공사계약 일반조건」제21조제3항 또는 제5항에 해당하는 경우에도 계약상대방에게 설계변경으로 인한 계약금액 조정을 하지 않는 행위\n제2장 제한경쟁입찰의 운용","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"제한경쟁입찰의 집행","text":"제3조(제한경쟁입찰의 집행) 계약담당공무원은 시행령 제21조 및 시행규칙 제24조 및 제25조에 의한 제한경쟁입찰시에 이 장에 정한 바에 따라 집행하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"제한경쟁입찰의 대상","text":"제4조(제한경쟁입찰의 대상) ① 시행령 제21조제1항제2호에서 정한 \"특수한 기술 또는 공법이 요구되는 공사\"는 다음 각호와 같다.1. 특수기술이 필요한 공사(1) 터널을 수반하는 공사(2) 활주로 공사(3) 지하철 공사(4) 저수ㆍ유조하천공사 또는 수중작업을 수반하는 공사(5) 댐 축조공사(6) 취수장, 정수장, 유수지(遊水池) 또는 오수처리장 공사로서 수중 작업을 수반하는 공사(7) 송ㆍ배수관공사(8) 수중관ㆍ사이폰ㆍ저수지 또는 제방공사(9) 매립지등 연약지반에서 파일 또는 우물통공사를 수반하는 공사(10) 독크 축조공사(11) 간척(방조제포함) 또는 매립공사(12) 「항만법」 제2조제5호에 의한 항만시설공사 및 「어촌ㆍ어항법」 제2조제3호에 의한 어항시설공사(13) 장대교(길이 100m 이상인 교량을 말한다) 제작 또는 가설공사(14) 철도 및 철도궤도공사(15) 정밀한 시공이 필요하거나 위험을 수반하는 기계설치공사(16) 발전ㆍ변전ㆍ송전 또는 배전설비공사(17) 전기철도 또는 전차시설공사(18) 정밀시공ㆍ고위험 전기기계 설치공사 (19) 신호집중제어 또는 특수제어장치설치공사(20) 자동신호 또는 연동장치공사(21) 원형차량 감지기 설치공사(22) 국가유산 보수공사(23) 차선도색공사(24) 도로봉합제를 사용한 신축이음 및 균열 보수공사(25) 상수도관 세척갱생공사(26) 하수도 흡입 준설공사(27) 심정공사(深井工事)(28) 산간벽지등 특수지역에서 시공하여야 하는 군사시설공사(29) 하천환경정비사업(30) 기타 특수한 기술이 요구되는 공사로 각 중앙관서의 장이 특별히 인정하는 공사2. 특수공법이 필요한 공사(1) 스폼공법 또는 철골공법에 의한 공사(2) 피ㆍ시공법등 중앙관서장이 특수공법으로 지정ㆍ고시한 공법에 의한 공사(3) 특수설계 또는 특수사양에 의한 선박 공사② 시행령 제21조제1항제3호에서 정한 \"특수한 설비 또는 기술이 요구되는 물품제조계약\"은 다음 각호와 같다.1. 특수한 품질 또는 성능의 보장을 위하여 특수한 설비와 기술을 필요로 하는 경우2. 시행령 제23조제1항제6호에 의한 물품을 제조하는 경우③ ④ 시행령 제21조제1항제6호에 따른 제한기준은 다음 각 호와 같다.1. 공사 : 공사의 현장이 소재하는 특별시ㆍ광역시ㆍ도ㆍ특별자치시 및 특별자치도(이하 \"시ㆍ도\"라 한다)의 관할구역 안에 법인등기부상 본점(개인사업자인 경우에는 해당 사업에 관한 사업자등록증 또는 관련법령에 의한 허가ㆍ인가ㆍ면허ㆍ등록ㆍ신고 등 관련서류상의 사업장 소재지를 말한다. 이하 이 예규에서 본점이라 한다)이 있는 자(지점 또는 지사는 입찰참가 불가) 2. 물품 : 물품제조에 있어서는 납품지가 소재하는 시ㆍ 도의 관할구역 안에 주된 영업소가 있는 자, 물품구매에 있어서는 납품지가 소재하는 시ㆍ도의 관할구역 안에 본점이 있는 자(지점 또는 지사는 입찰참가 불가) 3. 용역 : 용역 결과물의 납품지(시공단계의 건설사업관리 용역 등 현장과 밀접한 관련이 있는 경우에는 해당 용역의 현장)가 소재하는 시ㆍ도의 관할구역 안에 본점이 있는 자(지점 또는 지사는 입찰참가 불가) ⑤ 제4항을 적용함에 있어 광역시 또는 도의 관할구역내에서 특별시 또는 광역시가 신설(편입된 경우는 제외)되는 경우에는 그 신설된 날로부터 3년간은 종전의 광역시 또는 도의 관할구역과 신설된 특별시 또는 광역시의 관할구역은 이를 분리하지 아니한 것으로 본다.⑥ 제4항을 적용함에 있어 입찰참가자가 개인사업자인 경우로서 사업장 소재지는 다르지만 사업종류가 동일한 복수의 사업자등록증 등을 보유하고 있는 경우에는 해당 개인사업자가 그 중 한곳을 지정한 사업장 소재지를 주된 영업소로 본다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"제한기준","text":"제5조(제한기준) ① 시행령 제21조제1항 및 시행규칙 제25조제2항의 \"실적\"이라 함은 현재 발주하려는 계약과 계약내용이 실질적으로 동일한 것은 물론, 이와 유사하여 계약목적달성이 가능하다고 인정되는 과거 1건의 공사ㆍ제조 또는 용역 등의 실적(장기계속공사ㆍ제조 또는 용역 등에 있어서는 총공사ㆍ제조 또는 용역 등의 실적으로 한다)에 해당되는 금액 또는 규모(양)를 말하며, 제조 또는 용역의 경우에는 해당 계약목적물의 3분의 1배 이내에서 실적을 요구하되, 계약담당공무원이 계약의 특성 및 난이도 등을 감안하여 필요하다고 인정하는 경우에는 계약목적물의 최대 1배까지 실적을 요구할 수 있다. 다만, 추정가격이 고시금액 미만인 제조 또는 용역계약의 경우에는 실적으로 경쟁참가자의 자격을 제한하여서는 아니된다.② 시행령 제21조제1항의 \"기술보유상황\"이라 함은 다음 각호의 경우를 말한다.1. 「엔지니어링 산업진흥법」에 의한 엔지니어링 활동주체 또는 「기술사법」에 의한 기술사사무소로 개설등록을 한 기술사의 경우2. 기술도입 또는 외국업체와의 기술제휴의 방법으로 해당 공사수행 또는 물품제조에 필요한 기술을 보유하고 있음이 객관적으로 인정되는 경우3. 기타 해당 공사수행 또는 물품제조에 필요한 기술ㆍ공법을 개발 또는 보유하고 있음이 객관적으로 인정되는 경우③ 시행령 제21조제1항제9호의 \"재무상태\"라 함은 현재 부도상태에 있거나 파산등으로 정상적인 영업활동이 곤란하다고 인정되지 아니하는 경우를 말한다.④ 계약담당공무원은 시행령 제21조제1항에 의하여 제한경쟁입찰에 참가할 자의 자격을 제한하는 경우에 이행의 난이도, 규모의 대소, 수급상황 등을 적정하게 고려하여야 한다. 다만, 다음 각호와 같이 경쟁참가자의 자격을 제한하여서는 아니 된다.1. 시행령 제21조제1항 각호 또는 각호내의 사항을 중복적으로 제한하는 경우. 다만, 시행령 제21조제1항제6호에 규정된 사항에 의하여 제한하는 경우에는 동항 제2호에 규정된 사항과 중복하여 제한할 수 있음2. 특정한 명칭의 실적으로 제한함으로써 유사한 실적이 있는 자의 입찰참가기회를 제한하는 경우가. 농공단지 조성공사에 있어 농공단지 조성실적이 있는 업체만으로 제한함으로써 사실상 공사내용이 동일한 공업단지나 주택단지 등의 조성실적이 있는 자의 입찰참가를 배제나. 종합문화예술회관 공사에 있어 종합문화회관 건립 단일공사 관람석 000석이상 준공실적이 있는 업체로 제한함으로서 시민회관, 강당 등 사실상 내용이 같은 공사실적이 있는 자의 입찰참가를 배제3. 특정기관이 발주한 준공실적만을 요구하고 다른 기관 및 민간의 실적을 인정하지 않는 경우(예:국가기관, 지방자치단체 및 공기업ㆍ준정부기관 등의 실적만을 인정함으로써 다른 공공기관 및 민간실적을 배제)4. 해당 공사이행에 필요한 수준 이상의 준공실적을 요구하는 경우(예:동일공사에서 교량이 2개 이상 있을 경우 합산한 규모의 실적업체로 제한하여 1개 규모의 실적보유업체를 배제)5. 물품의 제조ㆍ구매입찰시 부당하게 특정상표 또는 특정규격 또는 모델을 지정하여 입찰에 부치는 경우와 입찰조건, 시방서 및 규격서 등에서 정한 규격ㆍ품질ㆍ성능과 동등이상의 물품을 납품한 경우에 특정상표 또는 모델이 아니라는 이유로 납품을 거부하는 경우(예:특정 수입품목의 모델을 내역서에 명기하여 품질 및 성능면에서 동등이상인 국산품목의 납품을 거부)6. 지역제한경쟁입찰을 하는 경우에 본점이 공사의 현장ㆍ납품지 등이 소재하는 시ㆍ도의 관할구역안에 있는 자로 제한하여야 함에도 시ㆍ군ㆍ자치구의 관할구역안에 있는 자로 제한하는 경우 7. 일반경쟁입찰이 가능함에도 과도하게 실적 등으로 제한하는 경우[예:빗물 펌프장(유수지) 공사에서 펌프 용량으로 실적제한]8. 관련법령 등에 의해 1개의 등록만으로 시공이 가능함에도 2개이상의 등록을 요구하는 등 등록요건을 강화하는 경우9. 교량이나 도로공사 발주시 공사의 실적을 평가하는데 주요한 기준의 규모(또는 양)로 제한하지 아니하고, 폭 등 독특한 실적만으로 제한하는 경우 및 폭, 연장, 경간장(徑間長), 공법 등을 모두 제한하는 경우10. 창의성이 요구되는 건축설계 등 문화예술관련 용역에 대해서 용역수행실적으로 제한하는 경우11. 시행령 제73조의2에 의한 건설사업관리용역을 발주함에 있어 시공 단계의 건설사업관리 용역이 해당용역의 주요부분임에도 불구하고 건설사업관리 실적만을 요구하는 등 시공 단계의 건설사업관리 용역실적을 인정하지 않는 경우","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:5의2","kind":"조문","type":"계약예규","family":"nca","label":"제5조의2","title":"신기술 또는 특허공법이 요구되는 공사 적용기준","text":"제5조의2(신기술 또는 특허공법이 요구되는 공사 적용기준) ① 계약담당공무원은 공사계약을 함에 있어 해당 공사에 신기술이나 특허공법(이하 \"신기술 등\"이라 한다)이 포함된 경우에는 다음 각 호에 따라야 한다.1. 해당 공사를 신기술 등을 보유한 자(이하 \"기술보유자\"라 한다)가 계약을 이행하는 것이 객관적으로 타당한 경우에는 수의계약 또는 지명경쟁에 의할 수 있다. 다만, 기술보유자가 다수 존재하는 경우로서 경쟁성이 확보되는 경우에는 제한경쟁에 의할 수 있다. 이 경우에 입찰공고에 입찰참가자격제한 사유를 명시하여야 한다.2. 해당 공사에서 신기술 등이 일부 포함되어 있는 경우에는 일반경쟁에 의하는 것을 원칙으로 하고, 일반경쟁에 의하지 않더라도 시행령 제21조제1항 제2호의 사항으로 입찰참가자격을 제한할 수 없다.② 동일한 공종에 적용될 수 있는 신기술 등이 다수 존재하는 경우로서 제1항에 따라 신기술 등을 설계에 포함하여 수의계약 체결 내지 경쟁입찰을 실시하고자 하는 때에는 시행령 제94조에 의한 계약심의회의 심의를 거쳐야 한다. 다만, 시행령 제26조제1항제5호 가목(「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 같은 조제6항을 포함한다. 이하 같다.)에 따른 공사에는 그러하지 아니한다. ③ 제1항제2호에 따른 공사에서 신기술 등을 설계에 포함하고자 하는 경우에 설계반영단계에서 계약담당공무원은 별지 제2호의 예시를 참조하여 입찰공고전에 기술보유자와 기술사용협약을 체결하여야 한다. 다만, 기술사용협약이 이루어지지 않은 경우에는 분리발주하거나 다른 기술 등을 사용할 수 있다. ④ 계약담당공무원은 제3항에 의한 내용을 입찰공고에 명시하여야 하고, 낙찰자 결정 후에 낙찰자에게 그 사본을 제공하여 낙찰자가 기술보유자로부터 기술사용협약에 따라 해당 기술을 원활히 제공받을 수 있도록 하여야 하며, 하도급대금의 결정은 하도급부분에 해당하는 예정가격(단, 발주자로부터 계약금액 조정을 받은 경우 조정분 포함)에 원도급공사의 낙찰률 및 「건설산업기본법 시행령」 제34조에 따른 비율을 곱한 금액을 하한금액으로 하고 그 하한 금액에 「건설기술진흥법」 제14조에 의한 기술사용료를 더한 금액을 상한금액으로 하여 그 범위 내에서 낙찰자와 기술보유자 간 합의한 금액으로 한다. ⑤ 제3항의 기술사용협약에 따라 기술을 제공하거나 시공에 참여하는 경우 기술사용료 지급은 「건설기술진흥법」 시행령 제34조에 따라 국토교통부 장관이 정하는 \"건설신기술 기술사용료 적용기준\"을 적용하여야 한다. ⑥ 계약담당공무원은 용역계약 및 물품제조계약을 함에 있어 특수한 설비 또는 기술이 요구되는 경우에 제1항 내지 제4항을 준용한다. ⑦ 계약담당공무원은 원가계산에 반영된 기술사용료에서 제4항에 따라 지급한 기술사용료의 차액을 감액한다. [본조신설 2008.12.29.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:5의3","kind":"조문","type":"계약예규","family":"nca","label":"제5조의3","title":"특수한 성능ㆍ품질 등의 납품능력이 요구되는 물품","text":"제5조의3(특수한 성능ㆍ품질 등의 납품능력이 요구되는 물품) ① 계약담당공무원은 물품구매계약을 함에 있어 해당 물품에 특수한 성능 또는 품질(이하 \"특수한 성능 등\"이라 한다)이 요구되는 경우에는 다음 각 호에 따라야 한다.1. 특수한 성능 등의 납품능력을 가진 자가 공급하는 것이 적합하다고 인정되는 경우에는 수의계약 또는 지명경쟁에 의할 수 있다. 다만, 특수한 성능 등의 납품능력을 가진 자가 다수 존재하는 경우로서 경쟁성이 확보되는 경우에는 제한경쟁에 의할 수 있다. 이 경우 입찰공고에 입찰참가자격제한 사유를 명시하여야 한다.2. 해당 물품구매에서 특수한 성능 등이 일부만 포함되어 있는 경우에는 일반경쟁에 의하는 것을 원칙으로 하고, 일반경쟁에 의하지 않더라도 시행령 제21조제1항제4호에 의한 사유로 제한경쟁을 실시할 수 없다.② 제1항제2호에 따른 물품구매에 있어 특수한 성능 등을 규격서(시방서)에 반영하고자 하는 경우에는 규격서 작성단계에서 계약담당공무원은 별지 제3호의 예시를 참조하여 입찰공고전에 제조사 또는 기술지원사(이하 \"제조사 등\"이라 한다)와 물품공급 또는 기술지원협약을 체결하여야 하며, 협약금액은 해당 물품 또는 기술부분에 대한 예정가격에 물품구매계약의 예상낙찰률을 곱한 금액을 기초로 하여 제조사 등과 합의한 금액으로 한다. 다만, 물품공급 또는 기술지원협약이 이루어지지 않은 경우에는 다른 물품으로 발주할 수 있다.  ③ 계약담당공무원은 제2항에 의한 협약내용을 입찰공고에 명시하여야 하며, 낙찰자 결정후 낙찰자에게 그 사본을 제공하여 낙찰자가 제조사 등으로부터 물품공급 또는 기술지원확약서를 발급받을 수 있도록 하여야 한다. [본조신설 2008.12.29.]\n제3장  공사의 지명경쟁입찰시  지명업체 선정기준","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"선정기준","text":"제6조(선정기준) 계약담당공무원은 시행규칙 제27조에 따라 공사를 지명경쟁입찰로 집행하고자 하는 경우에는 다음 각 호의 기준에 의하여 지명업체를 선정하여야 한다.1. 시공능력을 기준으로 지명하고자 할 때에는 시공능력 일련순위에 따라 지명할 것2. 특수기술을 필요로 하는 공사로서 전문적인 기술의 보유자가 아니면 계약목적의 달성이 곤란한 때에는 그 기술보유자중에서 시공능력 순위에 따라 지명할 것3. 특수공법을 필요로 하는 공사의 경우에 동종공사의 시공실적의 보유자가 아니면 계약목적의 달성이 곤란한 때에는 그 실적보유자중에서 시공능력 순위에 따라 지명할 것4. 시행령 제23조제1항제2호에 따른 공사의 경우에 시ㆍ도업체만을 지명하고자 할 때에는 해당 시ㆍ도업체의 시공능력 순위에 따라 지명할 것  가. 삭제  나. 삭제\n제4장 긴급에 따른 수의계약 및 소액수의계약 등의 집행","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"수의계약의 집행","text":"제7조(수의계약의 집행) 계약담당공무원은 시행령 제26조제1항제1호 가목, 제2호 가목 내지 바목 및 제5호 가목에 의하여 수의계약으로  집행하는 경우에 이 장에 정한 바에 따라야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:7의2","kind":"조문","type":"계약예규","family":"nca","label":"제7조의2","title":"긴급에 따른 수의계약","text":"제7조의2(긴급에 따른 수의계약) 시행령 제26조제1항제1호 가목에 의한 긴급한 행사, 감염병 예방 및 확산방지, 긴급복구가 필요한 수해 등 비상재해 그 밖에 이에 준하는 경우로서 경쟁에 부칠 여유가 없을 경우라 함은 시행령 제35조제4항 등에 따라 긴급 입찰공고에 의한 경쟁입찰에 의하더라도 계약목적의 달성이 곤란한 경우를 말한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"집행기준","text":"제8조(집행기준) ① 계약담당공무원은 시행령 제26조제1항제2호 가목 내지 바목에 의한 수의계약을 할 때에는 다음 각 호의 기준에 해당하는 경우로서 경쟁이 성립할 수 없는 경우에 한하여 체결하여야 한다. 1. 시행령 제26조제1항제2호 \"가\"목에서 규정하고 있는 하자책임구분이 곤란한 경우라 함은 금차공사가 시공 중에 있는 전차공사 또는 하자담보책임기간내에 있는 전차공사와 그 수직적 기초를 공통으로 할 경우와 전차시공물의 일부를 해체 또는 변경하여 이에 접합시키는 경우를 말한다. 2. 시행령 제26조제1항제2호 \"나\"목에서 규정 하고 있는 동일현장에 2인 이상의 업자를 투입할 수 없는 경우라 함은 금차공사가 시공 중에 있는 전차공사와 시공 과정상 시간적, 공간적으로 중복되는 경우를 말한다. 3. 시행령 제26조제1항제2호 \"다\"목에서 규정 하고 있는 마감공사라 함은 시공중에 있는 전차공사 또는 하자담보책임기간내에 있는 전차공사에 대한 뒷마무리공사와 성토(흙쌓기), 옹벽, 포장등의 부대시설공사를 말한다. 4. 시행령 제26조제1항제2호 \"라\" 및 \"마\"목에서 규정하고 있는 사실상 경쟁이 불가능한 경우라 함은 금차공사가 접적지역, 도서지역(연륙교로 육지와 연결된 지역은 제외한다.),  고산벽지 또는 이에 준하는 특수지역의 공사이거나 특허공법에 의한 공사 및 「건설기술진흥법」제14조에 따라 지정ㆍ고시된 신기술, 「환경기술 및 환경산업지원법」제7조에 따라 인증 내지 검증받은 기술 또는 「전력기술관리법」(법률제13741호로 개정되기 전의 것을 말한다)제6조의2에 따라 지정ㆍ고시된 새로운 전력기술 또는 「재난안전산업진흥법」제14조에 따라 지정된 방재신기술(각 해당 법률에 따라 지정된 보호기간 또는 유효기간 내의 경우로 한정한다)을 적용하는 공사로서 입찰적격자가 한정되어 경쟁이 실질적으로 곤란한 경우를 말한다. 5. 시행령 제26조제1항제2호 \"바\"목에서 규정하고 있는 해당물품을 제조ㆍ공급한 자가 직접 물품을 설치ㆍ조립 또는 정비하는 경우라 함은 해당 물품을 설치ㆍ조립 또는 정비하는 공사를 제조ㆍ공급과 분리하여 시행하는 경우에 해당물품을 제조ㆍ공급한자가 직접 설치ㆍ조립 또는 정비하는 것이 공사비 및 공사기간에 있어서 국가기관에 유리한 경우를 말한다. ② 계약담당공무원은 조달청장이 정한 세부평가기준에 따라 발주하고자 하는 공사가 제1항에 정한 수의계약 사유에 해당하는 지의 여부를 결정할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:8의2","kind":"조문","type":"계약예규","family":"nca","label":"제8조의2","title":"설계용역 등에 대한 수의계약의 집행","text":"제8조의2(설계용역 등에 대한 수의계약의 집행) 계약담당공무원은 시행령 제26조제1항제2호차목에 따라「건축서비스산업진흥법」제21조에 따른 공모의 당선자와 수의계약을 체결하려는 경우 공모의 공고문에서 결정된 대가를 감액하여 수의계약을 체결하여서는 아니된다.[본조신설 2018.12.31.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"계속공사의 계약금액 결정","text":"제9조(계속공사의 계약금액 결정) ① 계약담당공무원은 시행령 제31조 본문에서 정한 바와 같이 수의계약 상대방이 제출한 견적금액이 해당 예정가격에 제1차공사의 낙찰율을 곱한 금액의 범위이내일 경우에 한하여 그 금액으로 계약을 체결할 수 있다.② 시행령 제31조 단서에서 재정경제부장관이 정하는 경우라 함은 다음 각 호의 어느 하나에 해당하는 것을 말한다. 1. 제1차공사의 낙찰율이 100분의 87.75미만인 경우로서 계속공사의 추정가격이 10억원(전문공사 및 전기ㆍ정보통신ㆍ소방ㆍ국가유산공사 등은 3억원) 미만인 공사는 해당 예정가격에 100분의 87.75를 곱한 금액으로 한다.2. 제1차공사의 낙찰율이 100분의 86.75미만인 경우로서 계속공사의 추정가격이 50억원미만 10억원(전문공사 및 전기ㆍ정보통신ㆍ소방ㆍ국가유산공사 등은 3억원) 이상인 공사는 해당 예정가격에 100분의 86.75를 곱한 금액으로 한다.3. 제1차공사의 낙찰율이 100분의 85.5미만인 경우로서 계속공사의 추정가격이 100억원 미만 50억원이상인 공사는 해당 예정가격에 100분의 85.5를 곱한 금액으로 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"소액수의계약 체결절차 등","text":"제10조(소액수의계약 체결절차 등) ① 계약담당공무원은 시행령 제26조제1항제5호가목에 따라 수의계약을 체결함에 있어 추정가격이 2천만원(같은 목 5)가)부터 다)까지의 어느 하나에 해당하는 자와 계약을 체결하는 경우에는 5천만원)을 초과하는 경우에는 시행령 제14조제3항에 따라 「전자조달의 이용 및 촉진에 관한 법률」 제2조제4호에 따른 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)을 이용하여 견적서를 제출하도록 하여야 하고, 시행령 제36조 각 호에 정한 사항 중 필요한 사항을 견적서제출마감일 전일부터 기산하여 3일(공휴일과 토요일은 제외하고 산정한다)전까지 전자조달시스템을 이용하여 안내공고를 하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다. 1. 시행규칙 제33조제1항제1호 및 제2호에 해당하는 경우2. 기존 시설물을 계속적으로 유지ㆍ보수하는 경우로서 전자조달시스템을 이용하여 견적서를 제출받는 경우에는 호환이 되지 않는 등 사실상 유지ㆍ보수가 곤란하거나 예산낭비가 우려되는 경우 3. 「건설기술진흥법」에 따른 설계용역 및 타당성조사용역과 그 밖에 다른 법령에 따른 설계용역의 경우(지역경제활성화를 위하여 예산을 조기집행할 필요가 있는 경우만 해당한다). 다만, 계약담당공무원은 추정가격 2천만원이상인 수의계약을 같은 사업체와 3회 이상 체결할 수 없다. 4. 제2항에 따른 재안내 공고를 실시한 결과 2인 이상으로부터 견적서를 받지 못한 경우, 그 밖에 계약의 목적이나 특성상 전자조달시스템에 의한 견적서를 제출받아 수의계약을 체결하는 경우에는 사실상 계약목적 달성이 어려운 경우 ② 제1항에 따른 안내공고에 불구하고 다음 각 호의 어느 하나에 해당하는 때에는 재안내공고를 하여야 한다. 1. 시행령 제12조제1항의 요건을 갖춘 견적서 제출자가 2인 미만인 경우 2. 예정가격 이하로서 제10조의2제1항 각호의 기준을 충족하는 견적서가 없는 경우 3. 4. 견적서를 제출한 자가 1인이하인 경우 등 계약상대자를 결정할 수 없는 경우(단, 재안내 공고를 실시하더라도 견적서 제출자가 1인 밖에 없을 것으로 명백히 예상되는 경우는 제외)  ③ 계약담당공무원은 제1항 본문에 따라 전자조달시스템을 이용하여 견적서를 제출하게 하는 공사의 경우에는 설계서, 공종별 목적물 물량내역서(이하 \"물량내역서\"라 한다), 기타 견적서 제출에 필요한 서류를 작성ㆍ비치하여야 하고, 견적서제출마감일까지 견적서를 제출하려는 자에게 열람하게 하고 교부하여야 한다. 다만, 계약담당공무원은 물량내역서 및 견적서 제출에 필요한 서류를 전자조달시스템에 게재함으로써 열람 또는 교부에 갈음할 수 있다. ④ 제1항 본문에 따라 전자조달시스템을 이용하여 견적서를 제출하게 하는 공사의 경우에 있어 계약담당공무원은 견적서를 제출하려는 자에게 견적금액을 적은 견적서를 제출하게 하고, 계약상대자로 결정된 자에게 제3항에 따라 교부된 물량내역서에 단가를 적은 산출내역서를 착공신고서의 제출 시까지 제출하게 하여야 한다. ⑤ 시행령 제26조제1항제5호 \"가목\" 4)의 \"특수한 지식ㆍ기술 또는 자격을 요구하는 계약\"이란 다음 각 호와 같다. 1. 학술연구, 원가계산, 타당성조사, 여론조사 용역2. 「건설기술진흥법」에 따른 건설기술용역3. 「시설물의 안전관리에 관한 특별법」에 따른 안전점검 및 정밀안전진단 용역4. 「엔지니어링산업진흥법」에 따른 엔지니어링활동을 목적으로 하는 용역5. 「건설폐기물의 재활용촉진에 관한 법률」 및 「폐기물관리법」에 따른 폐기물처리 용역6. 법률자문ㆍ회계ㆍ감정평가 등 특정자격을 필요로 하는 용역7. 기타 전문적인 지식이나 인력ㆍ설비 등이 필요한 용역⑥ 시행령 제26조제1항제5호 가목5)다)에 따른 \"재정경제부 장관이 정하는 요건을 충족하는 자\"란 「사회적기업 육성법」제2조 제2호의 취약계층을 전체 근로자의 100분의 30 이상 고용한 자를 말한다. ⑦ 계약담당공무원은 시행령 제26조제1항5호가목5)다)의 자(이하 이 조에서 \"사회적기업등\"이라 한다)와 수의계약을 체결하려는 경우에는, 수의계약을 체결하려는 자로 하여금 다음 각 호에서 정하는 자로부터 제6항의 요건을 충족하였음을 증명하는 확인서 등(계약체결일로부터 6개월 이내에 발급한 서류에 한한다)을 제출하게 하여야 한다. 1. 「사회적기업 육성법」 제2조제1호에 따른 사회적기업 및「협동조합 기본법」 제2조제3호에 따른 사회적협동조합: 「사회적기업 육성법」 제20조에 따른 한국사회적기업진흥원 2. 「국민기초생활 보장법」 제18조에 따른 자활기업: 「국민기초생활 보장법」 제15조의2에 따른 중앙자활센터 3. 「도시재생 활성화 및 지원에 관한 특별법」 제2조제1항제9호에 따른 마을기업: 관할 지방자치단체","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의2","kind":"조문","type":"계약예규","family":"nca","label":"제10조의2","title":"소액수의계약의 계약상대자 결정","text":"제10조의2(소액수의계약의 계약상대자 결정) ① 계약담당공무원은 제10조제1항 본문에 의하여 전자조달시스템을 이용하여 견적서를 제출받는 경우에는 다음 각 호의 기준에 따라 계약상대자를 결정한다. 1. 공사 : 시행령 제7조의2제1항에 의하여 예정가격을 결정한 경우에는 계약예규「적격심사기준」에서 정한 추정가격이 10억원미만인 공사의 낙찰하한율 이상으로 견적서를 제출한 자 중 최저가격으로 견적서를 제출한 자. 단, 예정가격과 견적금액은 국민연금, 건강보험, 퇴직공제부금비, 노인장기요양보험, 산업안전보건관리비, 안전관리비, 품질관리비를 제외한 금액을 기준으로 한다. 2. 물품ㆍ용역 : 예정가격의 88%(시행규칙 제23조의3 각 호에 따른 용역계약의 경우에는 90%)이상으로 견적서를 제출한 자 중 최저가격으로 견적서를 제출한 자② 제1항에 따라 선정된 자가 다음 각 호에 어느 하나에 해당되는 경우에는 차순위 자를 계약상대자로 결정한다.1. 견적서 제출마감일 현재 부도ㆍ파산ㆍ해산ㆍ영업정지 등이 확정된 경우2. 견적서 제출마감일 현재 「건설산업기본법」등 공사관련 법령에 정한 기술자 보유 현황이 해당공사 시공에 필요한 업종등록 기준에 미달하는 자3. 「국가를 당사자로 하는 계약에 관한 법률」제27조 및 시행령 제76조에 따라 입찰참가자격 제한 기간 중에 있는 자 4. 수의계약 안내공고일 기준 최근 6개월 이내에 시행령 「국가를 당사자로 하는 계약에 관한 법률」제27조 및 시행령 제76조 또는 다른 법령에 의하여 부실시공, 담합행위, 입찰 및 계약서류 위조 또는 허위제출, 입ㆍ낙찰 또는 계약이행 관련 뇌물제공자로서 부정당업자 제재처분을 받은 사실이 있는 자 5. 계약상대자로 결정된 자가 계약체결 이전에 경쟁입찰의 입찰무효 사유에 준하는 등 부적격자로 판명되어 계약상대자 결정이 취소된 경우로서 동 부적격자를 제외하고 비교 가능한 2개 이상의 견적서가 확보되어 있는 경우6. 계약상대자로 결정된 자가 스스로 계약체결을 포기한 경우로서 포기한 자를 제외하고 비교 가능한 2개 이상의 견적서가 확보되어 있는 경우7. 견적서 제출 마감일 기준 최근 3개월 이내에 해당 중앙관서와의 계약 및 그 이행과 관련하여 정당한 이유 없이 계약에 응하지 아니하거나 포기서를 제출한 사실이 있는 자","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의3","kind":"조문","type":"계약예규","family":"nca","label":"제10조의3","title":"소액수의계약시 유의사항","text":"제10조의3(소액수의계약시 유의사항) ① 계약담당공무원은 제15조에 의한 동일구조물공사 및 단일공사로서 설계서 등에 의하여 전체사업내용이 확정된 공사를 시기적으로 분할하거나 공사량을 구조별, 공종별로 분할하여 시행령 제26조제1항제5호가목에 의한 공사를 수의계약으로 체결할 수 없다. 다만, 제16조제2항 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다. ② 「건설산업기본법」에 따른 공사를 발주하는 경우에 종합공사와 전문공사의 구분은 동 법 제16조 및 동법 시행령 제21조에 정한 바에 따른다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의4","kind":"조문","type":"계약예규","family":"nca","label":"제10조의4","title":"소액수의계약 절차 등의 준용","text":"제10조의4(소액수의계약 절차 등의 준용) 계약담당공무원은 시행령 제26조제1항제5호가목에 따라 추정가격이 2천만원미만인 계약에 대하여 수의계약을 체결함에 있어 필요하다고 인정하는 경우에는 제10조 내지 제10조의3을 준용할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의5","kind":"조문","type":"계약예규","family":"nca","label":"제10조의5","title":"소기업ㆍ소상공인 제품 우선구매","text":"제10조의5(소기업ㆍ소상공인 제품 우선구매) 계약담당공무원은 시행령 제21조제1항제10호에 해당하는 계약으로서 추정가격이 시행령 제30조제1항제2호에 해당하는 경우에는 「중소기업기본법」 과 「소기업 및 소상공인 지원을 위한 특별조치법」에  따른 소기업 또는 소상공인과 우선하여 계약을 체결할 수 있다.[본조신설 2012.1.1.]\n제5장 일괄입찰 및 기술제안입찰로 발주된 공사의 수의계약 집행","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의6","kind":"조문","type":"계약예규","family":"nca","label":"제10조의6","title":"일괄입찰 및 기본설계 기술제안입찰로 발주된 공사의 수의계약","text":"제10조의6(일괄입찰 및 기본설계 기술제안입찰로 발주된 공사의 수의계약) 시행령 제79조제1항제5호에 따른 일괄입찰과 시행령 제98조제3호에 따른 기본설계 기술제안입찰로 발주된 공사를 시행령 제27조제1항에 따라 수의계약으로 집행하는 경우에는 이 장에 정한 바에 따라야 한다.[본조신설 2016.12.30.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의7","kind":"조문","type":"계약예규","family":"nca","label":"제10조의7","title":"정의","text":"제10조의7(정의) 이 장에서 사용하는 용어의 정의는 다음과 같다.1. \"예비계약\"이라 함은 수의계약 상대방(이하 이 장에서 \"상대방\"이라 한다)과 본 계약 체결시까지 임시적으로 체결하는 계약으로서 상대방이 실시설계용역을 수행함과 동시에 양 당사자간 가격협상이 성립할 것을 조건으로 본 계약을 체결할 것을 약정하는 계약을 말한다.2. \"발주기관 검토가격\"이라 함은 실시설계서, 산출내역서 및 제10조의10제1항에 따른 물량 등 적정성 검토결과를 기초로 계약예규 「예정가격 작성기준」에 따라 산출한 공사비를 말한다.3. \"설계대가\"라 함은 국토교통부 고시 「공공건축사업에 대한 건축사의 업무 범위 및 대가기준」, 산업통상자원부 고시 「엔지니어링사업대가의 기준」 등 관련 규정에 따라 산정한 설계용역의 대가를 말한다.4. \"협상 기초가격\"이라 함은 해당 공사의 설계대가 및 발주기관 검토가격을 합산하여 산출한 가격으로서 발주기관이 제시할 수 있는 최대 가격을 말한다.5. \"최소 협상가격\"이라 함은 공사품질 및 시공의 적정성을 담보하기 위해 발주기관이 수의시담시 제시할 수 있는 최소 수준의 금액을 말한다.6. \"설계 보정율\"이라 함은 최소 협상가격의 산정 과정에서 설계 평가점수, 표준시장단가 적용공종의 비중 등 설계상 특수성을 반영하기 위해 적용하는 비율을 말한다.7. \"본 계약\"이라 함은 각 중앙관서의 장과 상대방 사이에 가격협상이 성립되어 시공과 계약을 일괄하여 종국적으로 체결되는 계약을 말한다.[본조신설 2016.12.30.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의8","kind":"조문","type":"계약예규","family":"nca","label":"제10조의8","title":"수의계약 절차","text":"제10조의8(수의계약 절차) ① 계약담당공무원은 제10조의7제1호에 따른 예비계약을 체결하여 실시설계 용역을 먼저 실시하고 실시설계서가 적격통지를 받은 경우에 한하여 같은 조 제7호에 따른 본 계약을 체결할 수 있다.② 계약담당공무원은 일괄입찰 및 기본설계기술제안입찰의 입찰공고시 재공고입찰이 유찰될 경우 최종 공고의 단독입찰자와 이 장에 따른 절차에 따라 수의계약을 체결할 수 있다는 취지를 공고문에 명시하여야 한다.③ 각 중앙관서의 장은 이 장에 따른 수의계약의 집행을 위해 다음의 사항에 대한 세부적인 기준을 정할 수 있다.1. 제10조의11제2항제3호에 따른 유사공사의 범위2. 제10조의11제2항제4호에 따른 설계 보정율3. 제10조의11제3항에 따라 가격협상시 고려할 사항[본조신설 2016.12.30.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의9","kind":"조문","type":"계약예규","family":"nca","label":"제10조의9","title":"예비계약의 체결","text":"제10조의9(예비계약의 체결) ① 계약담당공무원은 상대방이 제출하는 기본설계의 설계점수 또는 기술제안점수가 계약담당공무원이 정한 설계점수(60점 이상 85점 이하의 범위에서 결정)를 초과하는 경우에는 해당 상대방과 실시설계 용역과 가격협상 성립을 조건으로 하는 공사계약을 일괄하여 체결할 수 있다.② 계약담당공무원은 제1항의 계약을 체결함에 있어 다음 각 호의 사항을 부관(附款)으로 약정하여야 한다.1. 계약금액은 실시설계가 확정된 이후 협의에 의해 결정한다는 취지2. 협의과정에서 계약금액에 이견이 있을 경우 발주기관은 시공부분의 계약을 해지할 수 있으며 이 경우 국가계약법 제27조에 따른 입찰참가자격 제한을 하지 아니한다는 취지3. 제2호의 경우에 발주기관은 상대방에 대하여 다음의 금액을 지급하고 설계서의 이용권리를 취득하며 시공부분을 별도로 발주 할 수 있다는 취지가. 일괄입찰로 발주된 공사: 기본설계서 및 실시설계서에 대한 설계대가를 기초로 각 설계용역에 대한 평균낙찰율을 감안하여 산정한 금액나. 기본설계 기술제안입찰로 발주된 공사: 실시설계서에 대한 설계대가를 기초로 설계용역 평균낙찰율을 감안하여 산정한 금액과 제87조의3에 따른 제안서 보상비를 합산한 금액4. 상대방은 제3호에 따라 별도로 발주되는 입찰에 참여할 수 없다는 취지5. 본계약을 체결함에 있어 제10조의12 제2항에 따라 계약금액 조정이 가능하다는 취지 ③ 계약담당공무원은 제1항의 계약을 체결함에 있어서는 법 제12조에 따른 계약보증금을 제출요구하지 아니하며, 시행령 제89조 및 제107조에 따른 설계비 등의 보상대상이 아님을 명시하여야 한다.④ 계약담당공무원은 예비계약의 체결 이전에 다음의 사항을 상대방에게 고지 또는 열람토록 하여야 한다.1. 제2항제3호에 따라 산정된 금액2. 제10조의8제3항제1호 및 제2호에 따른 세부기준을 정하였을 경우 그 기준[본조신설 2016.12.30.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의10","kind":"조문","type":"계약예규","family":"nca","label":"제10조의10","title":"발주기관 검토가격 작성","text":"제10조의10(발주기관 검토가격 작성) ① 계약담당공무원(「조달사업에 관한 법률」 제11조에 따라 조달청장에게 계약을 의뢰하는 공사에 대하여는 수요기관 담당공무원을 말한다. 이하 이 조에서 같다)은 실시설계서에 대하여 시행령 제85조제5항, 제6항 또는 제105조제4항, 제5항에 따라 적격통지를 받은 경우 발주기관 검토가격을 작성하여야 한다. 이 경우 실시설계서와 산출내역서를 검토하여 물량 및 산출내역서에 반영된 자재비, 노무비, 장비조합, 작업 여건 및 물가 등(이하 이 조에서 \"물량 등\"이라 한다)이 적정하게 반영되도록 하여야 한다. ② 제1항 단서에 따른 물량 등의 적정성 검토에 전문적인 지식이 요구되어 계약담당공무원이 직접 검토하기 곤란한 경우에는 시행규칙 제9조제2항에 따른 원가계산용역기관에 물량 등의 적정성 검토를 의뢰할 수 있다.③ 계약담당공무원은 발주기관 검토가격 작성업무를 조달청에 의뢰할 수 있다.④ 계약담당공무원은 제1항에 따라 발주기관 검토가격을 작성함에 있어서, 당초 산출내역서상의 물량ㆍ단가를 조정 반영하는 경우에는 그 내역 및 사유를 상대방에게 고지하여야 한다. [본조신설 2016.12.30.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의11","kind":"조문","type":"계약예규","family":"nca","label":"제10조의11","title":"가격협상","text":"제10조의11(가격협상) ① 계약담당공무원은 수의시담(隨義示談: 가격 및 업무 협의) 전 다음과 같이 협상 기초가격과 최소 협상가격을 작성하여야 한다.1. 협상 기초가격= 발주기관 검토가격 + 설계대가(기본설계 기술제안입찰의 경우 제87조의3에 따른 제안서 보상비를 포함한다. 이하 같다)2. 최소 협상가격= 발주기관 검토가격 x (최근 1년 유사공사 평균 낙찰률+설계 보정율) + 설계대가② 계약담당공무원은 제1항의 집행에 있어 다음의 사항을 유의하여야 한다.1. 협상 기초가격은 예산금액을 초과하지 못한다.2. \"최근 1년간 유사공사\"는 해당 발주기관에서 종합심사낙찰제로 발주한 공사로서 수의계약 대상 공사의 최종 입찰공고일로부터 1년 이내에 낙찰된 공사를 대상으로 선정한다.3. 제2호의 경우 유사공사는 계약예규「종합심사낙찰제 심사기준」에 따른 같은 동일공종그룹에 속하는 공사 중 공사의 내용 및 기술적 특성이 유사한 공사를 선정하여야 하며, 같은 동일공종그룹에 속하는 공사가 2건 이하인 경우에는 다음과 같은 순서에 따라 유사공사의 범위를 확대하여 적용할 수 있다.가. 다른 발주기관에서 발주된 공사나. 최근 3년간 낙찰된 공사다. 같은 동일 또는 유사업종(건축ㆍ토목 등)에 속하는 공사4. 설계 보정율은 다음의 사항을 고려하여 산출하여야 한다.가. 시행령 제85조제5항, 제6항 또는 제105조제4항, 제5항에 따른 평가점수나. 표준시장단가 적용공종의 비중다. 공사의 구조적ㆍ기술적 특성③ 계약담당공무원은 협상 기초가격과 최소 협상가격 사이에서 계약을 체결하되, 시공의 난이도 및 지역적 특성 등을 감안하여 계약금액이 결정되도록 하여야 한다.④ 계약담당공무원(조달사업에 관한 법률 제11조에 따라 조달청장에게 계약을 의뢰하는 공사에 대하여는 수요기관 담당공무원을 말한다)은 최소 협상가격이 예산금액을 초과하는 등 예산금액의 범위 내에서 가격협상이 곤란하다고 판단되는 경우에는 설계서 변경 등을 통해 공사물량을 감축할 수 있다. 다만, 당초 입찰안내서 등에서 명시 또는 반영하도록 되어 있는 사항을 제외하여서는 아니된다. ⑤ 계약담당공무원은 제4항 후단에 따른 공사물량 감축이 어려운 경우 예산금액을 조정할 수 있다. [본조신설 2016.12.30.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:10의12","kind":"조문","type":"계약예규","family":"nca","label":"제10조의12","title":"본계약의 체결","text":"제10조의12(본계약의 체결) ① 계약담당공무원은 가격협상이 성립되면 최종적인 산출내역서를 제출받고 지체없이 본계약을 체결하여야 한다.② 계약담당공무원은 제1항에 따라 본계약을 체결함에 있어 설계변경으로 인한 계약금액의 조정은 시행령 제91조, 제108조를 따르도록 하여야 한다.③ 가격협상이 이루어지지 않을 경우 계약담당공무원은 상대방에게 제10조의9제2항제3호의 금액을 지급하고 시공부분을 분리하여 발주할 수 있다.[본조신설 2016.12.30.]\n제6장 우수연구개발 혁신제품에 대한 수의계약 절차\n제10조의13\n제10조의14\n제10조의15\n제10조의16\n제10조의17\n제7장 지명경쟁계약, 수의계약 및 개산계약 집행시 서류구비","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"지명경쟁계약 등의 경우 서류구비 및 통지","text":"제11조(지명경쟁계약 등의 경우 서류구비 및 통지) 각 중앙관서의 장은 시행령 제23조제2항, 제26조제5항 및 제70조제3항에 의한 감사원 통지시 이 장에 정한 바에 따라 서류를 구비하여 통지하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"구비서류","text":"제12조(구비서류) 계약담당공무원은 다음 각호의 내용에 따라 서류를 구비하여야 한다.1. 시행령 제23조제2항에 의하여 감사원에 통지하는 경우에는 시행규칙 제29조에 정한 서류2. 시행령 제26조제5항에 의하여 감사원에 통지하는 경우에는 시행규칙 제35조에 정한 서류 3. 시행령 제70조제3항에 의하여 감사원에 통지하는 경우에는 시행규칙 제29조제1항 각목에 정한 서류","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"적용조문과 사유 기재요령","text":"제13조(적용조문과 사유 기재요령) ① 제12조 각호에 의한 적용조문과 사유는 관계법령(시행령 및 시행규칙)의 적용조문을 명시하고 그 적용사유를 구체적으로 기재하여야 한다.② 제12조제1호 및 제2호의 경우에는 시행령 제26조제1항제2호, 시행규칙 제27조 각 항목에 해당하는 사실과 피지명업체 또는 수의계약당사자가 동 항목에 각각 해당되는 사실을 구체적으로 명백히 하여야 한다.\n제8장 동일구조물공사 및 단일공사의 집행","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"동일구조물공사 및 단일공사의 집행","text":"제14조(동일구조물공사 및 단일공사의 집행) 계약담당공무원은 시행령 제68조에 의한 동일구조물공사 및 단일공사를 발주하고자 하는 경우에는 이 장에 정한 바에 따라 집행하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"정의","text":"제15조(정의) 시행령 제68조 및 이 장에서 사용하는 동일구조물공사 및 단일공사의 정의는 다음과 같다.1. \"동일구조물공사\"라 함은 천연 또는 인조의 재료를 사용하여 그 사용목적에 적합하도록 만들어진 기능이 상호 연결되는 일체식 구조물(그 부대공작물을 포함)로서 동일인이 계속하여 시공함이 적합한 시설물을 말한다.2. \"단일공사\"라 함은 다음의 경우를 말한다.가. \"단일공사\"라 함은 해당년도 예산상 특정단일사업으로 책정된 공사와 그 시공지역에서 이와 관련하여 시공되는 부대공사를 말한다.나. 예산상 특정되지 아니한 경우에는 예산집행과정에서 특정되는 공사에 대하여는 가목을 준용한다.다. 면허나 자격요건 등으로 법령에 의하여 공사를 분할 발주하여야 하는 경우에는 그 분할 발주하는 공사를 각각 단일공사로 본다. 다만, 관계법령에서 정하고 있는 경미한 공사의 경우에는 그러하지 아니하다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"분할계약의 금지","text":"제16조(분할계약의 금지) ① 계약담당공무원은 시행령 제68조에 의하여 동일구조물공사 및 단일공사로서 설계서등에 의하여 전체사업내용이 확정된 공사는 이를 시기적으로 분할 하거나 공사량을 구조별, 공종별로 분할함이 없이 일괄하여 계약을 체결하여야 한다.② 제1항에도 불구하고 다음 각호의 1에 해당하는 경우에는 분할하여 발주할 수 있다.1. 다른 법률에 의하여 다른 업종의 공사와 분리 발주할 수 있도록 규정된 공사2. 공사의 성질이나 규모 등에 비추어 분할시공함이 효율적인 공사3. 하자책임구분이 용이하고 공정관리에 지장이 없는 다음 각 목의 어느 하나에 해당하는 공사로서 분리 시공하는 것이 효율적이라고 인정되는 공사가. 설계서가 별도로 작성되는 공사나. 공사의 성격상 공종(工種)간 시공 목적물, 시공 시기, 시공 장소 등이 명확히 구분되는 공사③ 각 중앙관서의 장은 공사의 예산 편성과 기본 설계 등 사업의 계획단계부터 제2항에 따른 분할ㆍ분리 계약 가능 여부를 검토하여야 한다.\n제9장  내역입찰의 집행","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"내역입찰의 집행","text":"제17조(내역입찰의 집행) 계약담당공무원은 시행령 제14조 및 시행규칙 제44조에 의하여 내역입찰을 실시하는 경우에는 이 장에 정한 바에 따라 집행하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"내역입찰의 대상","text":"제18조(내역입찰의 대상) 계약담당공무원은 시행령 제14조제6항에 의하여 추정가격이 100억원 이상인 공사에 대하여는 내역입찰로 집행하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"산출내역서의 작성ㆍ제출","text":"제19조(산출내역서의 작성ㆍ제출) 계약담당공무원은 시행령 제14조제6항에 따라 내역입찰을 실시할 때에는 입찰자로 하여금 별지 제1호 서식에 단가 등 필요한 사항을 기입한 산출내역서를 제출하게 하여야 한다. 이 경우 계약담당공무원은 각 중앙관서의 장이 제정한 수량산출기준을 물량내역서 작성의 기초자료로 할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"입찰무효의 범위","text":"제20조(입찰무효의 범위) 시행규칙 제44조제6호에 의한 입찰무효의 범위는 다음 각호와 같다.1. 입찰서금액과 산출내역서상의 총계금액이 일치하지 아니한 입찰, 다만, 10원미만의 차이가 있는 경우에는 차상위 입찰자의 입찰금액이 10원이상 높은 경우에 한하여 유효한 입찰로 한다.  이 경우에 입찰서상 금액을 입찰금액으로 하며, 차상위자와 10원 미만의 차이가 있어 입찰무효가 될 때에는 상위금액 입찰자중 입찰서의 금액과 산출내역서상의 총계금액이 일치한 입찰자를 낙찰자로 한다.2. 산출내역서의 각 항목(각 공종, 경비, 일반관리비, 이윤, 부가가치세 등을 포함한다)별로 금액을 합산한 금액이 총계금액과 일치하지 아니한 입찰, 이 경우 제1호의 단서규정을 준용한다.가. \"공종\"이란 공사의 특성에 따라 작업단계(예:가설공사, 기초공사, 토공, 철근콘크리트, 마감공사 등)별로 구분되는 것을 의미하며, 공종별 합계금액을 표기하지 아니한 경우에는 공종내의 세부비목의 가격을 합산한 금액을 해당 공종의 금액으로 한다.나. \"공종\"에 대한 금액을 재료비, 노무비, 경비를 구분하여 명기한 때에는 재료비, 노무비, 경비를 합산한 금액이 공종의 금액과 일치하지 아니한 경우에는 공종의 금액을 기준으로 한다.3. 발주관서가 배부한 내역서상의 공종별 목적물물량 중 누락 또는 변경된 공종 혹은 수량에 대한 예정가격 조서상의 금액이 예정가격의 100분의 5이상인 경우4. 입찰서 금액, 산출내역서의 총계금액, 항목(각 공종, 경비, 일반관리비, 이윤, 부가가치세 등을 포함한다)별 금액을 정정하고 정정인을 누락한 입찰","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"낙찰자의 산출내역서 조정","text":"제21조(낙찰자의 산출내역서 조정) ① 제20조에 의한 무효입찰에는 해당되지 아니하나 입찰시에 제출한 산출내역서의 세부비목이나 「부가가치세법」 등 다른 법령에서 요구되는 비용의 금액산정에 착오가 있는 경우에는 바르게 정정하여 이에 따라 비목별 또는 항목별 금액을 수정한다.② 증감된 차액부분에 대하여는 간접노무비, 일반관리비, 이윤에 우선적으로 균등배분하되, 동 비목의 금액이 관련규정상의 기준 한도율을 초과하는 경우에 초과되는 금액에 대하여는 다른 비목에 균등배분한다.③ 산출내역서상의 단가표기금액이 재료비, 노무비, 경비, 합계금액 등으로 구분 작성되어 단가 및 합계금액 등을 고려할 때 단가가 잘못 표기된 것이 명백한 경우에는 입찰금액 범위안에서 단가를 수정할 수 있다.④ 제1항 내지 제3항에 따라 산출내역서를 수정할 경우에는 계약담당공무원과 낙찰자가 각각 정정인을 날인하여야 한다.⑤ 제20조제3호에 해당되지 아니한 입찰로서 일부공종 또는 수량이 누락된 산출내역서의 경우에는 누락된 공종 또는 수량을 표기하고 이에 대한 금액은 \"0\"으로 표기한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"기타사항","text":"제22조(기타사항) ① 제18조 내지 제21조는 시행령 제6장의 대안입찰(대안부분중 일부분에 대한 대안을 채택할 경우에 원안부분을 포함)에 있어 원안입찰로서 낙찰자를 결정할 경우에 준용한다.② 계약담당공무원은 입찰참가자로 하여금 산출내역서에 동 산출내역서 작성에 참여한 자 전원의 직책 및 성명을 기재하고 날인토록 하여야 한다.③ 계약담당공무원은 제2항에 의하여 제출된 산출내역서에 직책 및 성명기재 사실과 날인여부를 확인하여야 하며, 낙찰자로 하여금 준공후 1년까지 동 산출내역서 부본을 보관토록 하여야 한다.\n제10장  일괄입찰보증제도의 운용","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"일괄입찰보증의 운용","text":"제23조(일괄입찰보증의 운용) 계약담당공무원은 시행규칙 제43조제1항 단서에 의하여 일괄입찰보증을 운용하고자 하는  경우에 이 장에 정한 바에 따라야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:24","kind":"조문","type":"계약예규","family":"nca","label":"제24조","title":"정의","text":"제24조(정의) 이 장에서 사용하는 \"일괄입찰보증서\"(이하 이장에서 \"보증서\"라 한다)라 함은 시행령 제37조제2항제4호에 규정된 보증서중 1회계연도내의 모든 입찰(공사의 경우에 한한다)에 대한 입찰보증금을 납부할 수 있는 보증서를 말한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:25","kind":"조문","type":"계약예규","family":"nca","label":"제25조","title":"보증서의 납부","text":"제25조(보증서의 납부) 계약담당공무원은 보증서의 납부를 희망하는 자로 하여금 매 회계연도초 또는 시행규칙 제15조에 의한 최초의 등록마감일까지 소정의 절차에 따라 이를 납부하게 하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:26","kind":"조문","type":"계약예규","family":"nca","label":"제26조","title":"입찰참가신청","text":"제26조(입찰참가신청) 계약담당공무원은 보증서를 납부한 자 중 시행규칙 제15조에 의한 등록을 한 자가 입찰에 참가하고자 할 경우에는 해당 입찰신청마감일까지 시행규칙 별지 제3호서식의 입찰참가신청서(다만, 첨부서류는 제외한다)를 제출하게 하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:27","kind":"조문","type":"계약예규","family":"nca","label":"제27조","title":"보증서의 기재사항","text":"제27조(보증서의 기재사항) 보증서에는 일괄입찰보증금액, 보증기간, 피보증기관, 입찰참가자, 발급일자 및 보증기관등이 기재되어야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:28","kind":"조문","type":"계약예규","family":"nca","label":"제28조","title":"보증기간","text":"제28조(보증기간) 보증서의 보증기간의 종료일은 다음 연도 1월 30일 이후이어야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:29","kind":"조문","type":"계약예규","family":"nca","label":"제29조","title":"납부등 확인","text":"제29조(납부등 확인) 계약담당공무원은 제25조에 의하여 보증서를 납부한 자가 입찰참가신청을 한 때에는 그 보증서의 납부 및 적정여부 등을 확인하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:30","kind":"조문","type":"계약예규","family":"nca","label":"제30조","title":"국고귀속","text":"제30조(국고귀속) 시행령 제38조에 의한 국고귀속의 경우에 그 금액은 시행령 제37조제1항에서 규정한 입찰보증금의 최저금액으로 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:31","kind":"조문","type":"계약예규","family":"nca","label":"제31조","title":"입찰참가상황 통보","text":"제31조(입찰참가상황 통보) 계약담당공무원은 보증기관의 요청이 있는 경우에 매월별로 입찰참가자, 공사명, 입찰금액, 입찰일자등의 사항을 다음 달 10일까지 통보하여야 한다.\n제11장 계약보증금의 감면","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:32","kind":"조문","type":"계약예규","family":"nca","label":"제32조","title":"계약보증금의 감면","text":"제32조(계약보증금의 감면) ① 계약담당공무원은 「기후위기 대응을 위한 탄소중립ㆍ녹색성장 기본법」 제60조제2항에 따라 녹색기술 및 녹색사업에 대한 적합성 인증을 받거나 녹색전문기업으로 확인받은 업체에 대해서는 다음 각호에서 정한 금액만큼 계약보증금 또는 계약이행보증서상의 보증금액(이하 계약보증금 등)을 감면할 수 있다.1. 시행령 제50조 및 제52조제1항제2호에 따라 계약보증금을 납부하는 경우 계약금액의 5/1002. 시행령 제52조제1항제3호에 따라 계약이행보증서를 제출하는 경우 계약금액의 10/100② 계약담당공무원은 제1항정에도 불구하고 다음 각 호의 어느 하나에 해당하는 자에 대해서는 계약보증금 등을 감면하지 아니한다.1. 계약예규 입찰참가자격사전심사요령 제6조제2항에 따른 경영상태부문의 적격요건을 충족하지 못한 자(단, 100억 미만 공사의 경우에는 업체 평균 유동ㆍ부채비율 수준 미만인 자)2. 입찰참가등록 마감일(수의계약의 경우에는 계약체결일) 기준으로 시행령 제76조에 따라 입찰참가자격제한을 받고 해당 제한기간이 종료된 날로부터 1년이 경과하지 않은 자[본조신설 2011.5.13.]\n제12장 선금의 지급 등","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:33","kind":"조문","type":"계약예규","family":"nca","label":"제33조","title":"선금의 지급 등","text":"제33조(선금의 지급 등) 계약담당공무원은 「국고금관리법 시행령」 제40조제1항제15호에 의하여 선금을 지급하고자 할 때에는 이 장에 정한 바에 따라야 한다. 다만, 각 중앙관서의 장은 특수한 사유로 인하여 이 예규에 의하기 곤란하다고 인정할 때에는 재정경제부장관과 협의하여 특례를 정할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:34","kind":"조문","type":"계약예규","family":"nca","label":"제34조","title":"적용범위","text":"제34조(적용범위) ① 계약담당공무원은 다음 각호의 요건을 충족하는 경우로서 계약상대자가 선금의 지급을 요청할 때에는 계약금액의 100분의 70을 초과하지 아니하는 범위 내에서 선금을 지급할 수 있다. 1. 공사, 물품 제조 또는 용역 계약(발주기관이 시스템 특성 등에 맞게 소프트웨어의 일부에 대하여 수정ㆍ변경을 요구하여 체결한 소프트웨어사업을 포함) 2. 시행령 제76조에 의한 입찰참가자격제한을 받고 그 제한기간 중에 있지 아니한 경우② 계약상대자가 제1항에 따른 선금의 지급을 최초로 신청하는 경우 제4항 및 제5항에 따른 금액을 초과하지 아니하는 범위 내에서 선금을 지급하여야 한다. 다만, 계약상대자가 제4항 및 제5항에 따른 금액 이하로 신청하는 경우에는 신청한 바에 따라 지급하여야 한다. ③ 계약담당공무원은 계약상대자가 제4항 내지 제7항에 따라 선금지급을 요청하는 경우 하수급인에 대한 선금지급계획을 포함한 선금사용계획서 및 당해 계약만을 위해 사용되는 선금전용계좌를 제출하도록 하여야 하며, 필요시 기한을 정해 보완을 요구할 수 있다. ④ 계약담당공무원은 다음 각호 및 제5항 내지 제7항에 해당되는 선금에 대하여는 계약상대자의 청구를 받은 날로부터 14일 이내에 지급하여야 한다. 다만, 제3항에 따라 서류 보완을 요구한 경우에는 보완서류를 제출한 날부터 14일 이내에 지급하여야 한다.1. 공사가. 계약금액이 100억원이상인 경우 : 100분의 30 나. 계약금액이 20억원이상 100억원 미만인 경우 : 100분의 40 다. 계약금액이 20억원 미만인 경우 : 100분의 502. 물품의 제조 및 용역가. 계약금액이 10억원이상인 경우 : 100분의 30 나. 계약금액이 3억원이상 10억원 미만인 경우 : 100분의 40 다. 계약금액이 3억원 미만인 경우 : 100분의 503. 수해복구공사가. 계약금액이 20억원미만인 경우 : 100분의 70나. 계약금액이 20억원이상인 경우 : 100분의 50⑤ 계약담당공무원은 다음 각호의 어느 하나에 해당하는 경우에는 계약상대자의 청구에 의해 제4항제1호 또는 제2호에 해당하는 금액 이외에 해당 계약금액의 100분의 10범위 내에서 추가로 지급하여야 한다. 1. 제70조4제1항 각호에 따른 원자재 가격이 급등한 경우2. 신기술을 사용하는 물품 및 용역계약에 있어서 기술개발투자를 위한 자금이 계약이행초기에 집중적으로 소요되는 경우3. 계약상대방이 「기후위기 대응을 위한 탄소중립ㆍ녹색성장 기본법」 제60조제2항」에 따라 녹색기술ㆍ녹색사업에 대한 적합성 인증을 받거나 녹색전문기업으로 확인받은 경우(제60조제3항 각호에 해당하는 자 제외)⑥ 계약담당공무원은 제2항에도 불구하고 계약상대자가 최초 선금 신청시 제4항 및 제5항의 금액을 초과한 선금을 요청할 경우 계약의 목적, 특성 등을 고려하여 불가피하다고 인정되는 때에는 그 초과분에 대하여 선금을 지급할 수 있다. ⑦ 계약담당공무원은 계약상대자가 제4항 내지 제6항에 따라 선금을 수령한 후 추가로 선금 지급을 요청할 경우, 제36조제2항에 따라 이미 지급된 선금의 사용내역 또는 선금 지급분에 해당하는 공정률을 확인한 후 추가로 선금을 지급할 수 있다. ⑧ 제2항, 제4항 내지 제7항의 경우에서 「국가를 당사자로 하는 계약에 관한 법률」 제15조에 의하여 기성부분 또는 기납부분에 대하여 대가를 지급한 때에는 계약금액(단가계약의 경우에는 발주금액)에서 그 대가를 공제한 금액을 기준으로 한다. ⑨ 계약담당공무원은 계속비와 명시이월비 예산에 의한 계약에 대하여 선금을 지급하는 경우에 계약금액중 해당년도 이행금액을 기준으로 하며, 장기계속계약의 경우에는 각 연차계약금액을 기준으로 한다.⑩ 계약담당공무원은 국고채무부담행위예산에 의한 계약에 대하여 선금을 지급하는 경우에 국고채무부담행위액 상환을 위한 세출예산이 계상된 년도에만 할 수 있다.⑪ 제1항 내지 제10항의 경우에 계약담당공무원은 자금사정등 불가피한 사유에 의하여 선금 지급이 불가능한 때에는 지체 없이 소속 중앙관서의 장의 승인을 얻어 계약상대자에게 그 사유를 서면으로 통지하여야 한다. ⑫ 제11항에 의한 \"선금지급이 불가능한 경우\"라 함은 다음 각호의 경우를 말한다. 1. 자금배정이 지연될 경우. 단, 자금배정이 있을 경우에는 즉시 선금지급을 하여야 함2. 계약체결후 불가피한 사유로 이행착수가 상당기간 지연될 것이 명백한 경우. 단, 동 사유 해제시 즉시 선금지급을 하여야 함3. 계약상대자로부터 선금지급 요청이 없거나 유예신청이 있는 경우⑬ 계약담당공무원은 계약이행에 필요한 기간등에 비추어 계약을 체결한 연도내에 해당 예산을 전액 집행할 수 없는 경우로서 해당 예산의 사고이월이 불가피하다고 인정되는 때에는 제4항 내지 제7항에도 불구하고 계약을 체결한 연도내에 집행할 수 있는 금액을 한도로 선금을 지급하여야 하며, 제4항 내지 제6항에 의하여 지급하여야 할 선금중 미지급된 금액은 예산이 이월된 연도에 지급하여야 한다. ⑭ 계약담당공무원은 계약상대자로 하여금 제2항, 제6항 및 제7항에 따른 선금을 지급받은 날로부터 5일 이내에 하수급인에게 선금수령 사실을 서면으로 통지하도록 하여야 한다. ⑮ 계약담당공무원은 제2항, 제6항 및 제7항에 따라 선금을 지급하는 경우, 발주기관은 계약 상대자의 의사에 반하는 선금의 신청을 요구하거나 강제하여서는 아니 된다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:35","kind":"조문","type":"계약예규","family":"nca","label":"제35조","title":"채권확보","text":"제35조(채권확보) ① 계약담당공무원은 선금을 지급하고자 할 경우에는 계약상대자로 하여금 시행령 제37조제2항에 의한 증권 또는 보증서를 제출하게 하여야 한다. 다만, 국가, 지방자치단체, 「공공기관의 운영에 관한 법률」에 따른 공공기관 중 공기업과 준정부기관, 특별법에 의하여 정부가 보호 육성하는 법인으로서 정부가 출연한 법인, 「농업협동조합법」에 의한 조합 및 그 중앙회, 「수산업협동조합법」에 의한 어촌계ㆍ수산업협동조합 및 그 중앙회, 「산림조합법」에 의한 조합 및 그 중앙회 또는 「중소기업협동조합법」에 의한 중소기업협동조합 및 그 중앙회와 계약을 체결한 경우에는 그러하지 아니하다. 이 경우에 제38조에 의하여 반환 사유가 발생한 때에는 계약상대자로 하여금 선금잔액에 해당하는 금액을 현금(체신관서 또는 「은행법」의 적용을 받는 금융기관이 발행한 자기앞수표를 포함한다)으로 반납할 것을 보장받기 위하여 그 지급을 확약하는 내용의 문서를 제출하게 하여야 한다. ② 계약담당공무원은 제1항에 의하여 채권확보조치를 하는 경우에 보증 또는 보험금액은 선금액에 그 금액에 대한 보증 또는 보험기간에 해당하는 약정이자상당액[사유발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 대출평균금리)에 의하여 산출한 금액을 말한다]을 가산한 금액 이상으로 하여야 한다.③ 제2항의 경우에 제37조에 의하여 정산하였을 때에는 계약상대자의 요청에 의하여 해당 선금잔액(선금액에서 제37조에 의한 선금정산액을 공제한 금액을 말한다. 이하 같다)에 해당 약정이자상당액을 가산한 금액을 기준으로 제2항의 채권확보조치를 할 수 있다.④ 제1항 내지 제3항의 경우에 보증 또는 보험기간의 개시일은 선금지급일 이전이어야 하며 그 종료일은 이행기간의 종료일 다음날부터 60일이상(계약의 이행기간이 60일 이내인 경우는 30일 이상)으로 하여야 한다. 다만, 계약담당공무원이 그 이행기간을 연장하고자 할 경우에는 계약상대자로 하여금 당초의 보증 또는 보험기간에 그 연장하고자 하는 기간을 가산한 기간을 보증 또는 보험기간으로 하는 증권 또는 보증서를 제출하게 하여야 한다. ⑤ 계약담당공무원은 제38조제3항에 따라 하수급인에게 선금을 지급하고자 하는 경우로서 계약상대자가 요구할 경우에는 해당 하수급인으로 하여금 계약상대자에게 보증서를 제출하도록 하여야 한다. ⑥ 계약담당공무원은 제38조제3항에 따라 하수급인에게 선금을 지급하는 경우는 제1항에 따라 계약상대자가 제출한 보증서의 보증금액을 감액하지 아니한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:36","kind":"조문","type":"계약예규","family":"nca","label":"제36조","title":"선금의 사용","text":"제36조(선금의 사용) ① 계약담당공무원은 선금을 지급하고자 할 때에 해당 선금을 계약목적달성을 위한 용도와 수급인의 하수급인에 대한 선금배분이외의 다른 목적에 사용하게 할 수 없으며, 노임지급(공사계약 및 시행규칙 제23조의3 각호의 용역계약은 제외) 및 자재확보에 우선 사용하도록 하여야 한다. ② 계약담당공무원은 지급된 선금이 제1항에 의한 용도로 사용되었는지 여부를 확인하기 위하여 계약상대자로 하여금 선금사용내역서 및 세금계산서 등 증빙서류를 제출하게 할 수 있다. ③ 계약담당공무원은 계약상대방이 선금을 전액 정산하기 이전에는 계약에 의하여 발생한 권리의무를 제3자에게 양도하게 할 수 없다. 다만, 제35조에 따라 선금 지급을 보증한 기관의 동의를 얻어 공사대금청구권을 양도하고자 하는 경우에는 선금을 전액 정산하기 이전이라도 공사대금청구권을 제3자에게 양도하게 할 수 있다. ④ 계약담당공무원은 수급인에게 선금을 지급한 경우에는 선금지급일로부터 20일 이내에 계약상대자와 하수급인으로부터 증빙서류를 제출받아 선금배분 및 수령내역을 비교ㆍ확인하여야 한다. ⑤ 계약담당공무원은 계약상대자가 하수급인에게 선금을 현금으로 지급하도록 하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:37","kind":"조문","type":"계약예규","family":"nca","label":"제37조","title":"선금의 정산","text":"제37조(선금의 정산) ① 선금은 기성부분 또는 기납부분의 대가 지급시마다 다음 방식에 의하여 산출한 선금정산액 이상을 정산하여야 한다.② 계약담당공무원은 계약 이행기간의 종료일 이전에 제1항에 따라 선금 전액의 정산이 완료된 경우로
