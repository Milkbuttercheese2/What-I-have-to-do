서, 계약상대자의 신청이 있는 경우에는 선금의 정산이 완료되었음을 증명하는 서류를 발급하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:38","kind":"조문","type":"계약예규","family":"nca","label":"제38조","title":"반환청구","text":"제38조(반환청구) ① 계약담당공무원은 선금을 지급한 후 다음 각호에 해당하는 경우에는 해당 선금잔액에 대해서 계약상대자에게 지체 없이 그 반환을 청구하여야 한다. 다만, 계약상대자의 귀책사유에 의하여 반환하는 경우에는 해당 선금잔액에 대한 약정이자상당액을 가산하여 청구하여야 한다. 이 경우에 약정이자율은 선금을 지급한 시점을 기준으로 한다. 1. 계약을 해제 또는 해지하는 경우2. 선금사용계획 등 선금지급조건을 위배한 경우 3. 4. 정당한 사유 없이 선금 수령일로부터 15일 이내에 하수급인에게 선금을 배분하지 않은 경우 5. 계약변경으로 인해 계약금액이 감액되었을 경우 6. 선금사용내역 확인에 필요한 자료를 제출하지 않거나, 위ㆍ변조, 허위 서류를 제출하는 등 선금사용내역 확인에 협조하지 않는 경우 ② 제1항에 의한 이자상당액의 계산방법은 매일의 선금잔액에 대한 일변계산(日邊計算)에 의하며, 계산기간은 반환시까지로 한다.③ 계약담당공무원은 계약상대자가 하수급인에게 정당한 사유 없이 선금을 적정하게 배분하지 않은 경우에는 제1항에 따라 반환받은 선금을 하수급인에게 직접 지급할 수 있다. ④ 제1항 및 제2항에 의한 반환청구시 기성부분에 대한 미지급액이 있는 경우에는 선금잔액을 그 미지급액에 우선적으로 충당하여야 한다. 다만, 「건설산업기본법」 및 「하도급 거래공정화에 관한 법률」에 의하여 하도급대금 지급보증이 되어 있지 않은 경우로서 계약예규 「공사계약일반조건」 제43조제1항에 의하여 하도급대가를 직접 지급하는 때에는 우선적으로 하도급대가를 지급한 후에 기성부분에 대한 미지급액의 잔액이 있으면 선금잔액과 상계할 수 있다.⑤ 제1항제5호의 경우 계약금액이 감액되는 비율 만큼 선금을 반환청구 해야한다. 다만, 계약상대자에게 지급된 선금이 제34조제1항에서 정하고 있는 최대 선금지급율을 초과하지 아니하였을 경우에는 계약상대자로부터 변경계약에 따른 배서증권 제출요구 등 채권확보를 안전하게 하는 것으로 이를 갈음할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:39","kind":"조문","type":"계약예규","family":"nca","label":"제39조","title":"선금지급조건","text":"제39조 (선금지급조건) 계약담당공무원은 선금을 지급하고자 하는 경우에는 계약체결시에 제35조 내지 제38조에 의한 채권확보조치, 선금의 사용, 정산 및 반환청구등 기타 필요한 사항을 선금지급 조건으로 명시하여야 한다.\n제13장 공사의 이행보증제도 운용","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:40","kind":"조문","type":"계약예규","family":"nca","label":"제40조","title":"공사의 이행보증 운용","text":"제40조(공사의 이행보증 운용) 계약담당공무원은 시행령 제52조제1항제3호 및 시행규칙 제66조에 의한 공사이행보증서의 제출 등에 대해서는 이 장에 정한 바에 따라야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:41","kind":"조문","type":"계약예규","family":"nca","label":"제41조","title":"정의","text":"제41조(정의) 이 장에서 사용하는 용어의 정의는 다음과 같다.1. \"공사이행보증서\"라 함은 시행령 제2조제4호에 의한 보증서를 말한다.2. \"보증이행업체\"라 함은 공사이행보증서 발급기관(이하 \"보증기관\"이라 한다)이 해당 공사의 보증시공을 위하여 지정한 업체를 말한다.3. \"보증채무\"라 함은 계약상대자가 정당한 이유 없이 계약상의 의무를 이행하지 아니한 경우에 보증기관이 발주기관에 대하여 보증하여야 할 의무를 말한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:42","kind":"조문","type":"계약예규","family":"nca","label":"제42조","title":"공사이행보증서의 제출","text":"제42조(공사이행보증서의 제출) ① 계약담당공무원은 공사계약에 있어서 계약상대자가 시행령 제50조제1항 내지 제3항에 의한 계약보증금을 납부하지 아니하고 공사이행보증서를 제출하고자 하는 경우에는 시행령 제52조제1항제3호에서 정한 금액을 납부할 것을 보증하는 것이어야 한다.② 보증기관은 시행령 제37조제2항제1호, 제3호 및 제4호에서 규정한 보증서등의 발급기관 이어야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:43","kind":"조문","type":"계약예규","family":"nca","label":"제43조","title":"보증채무의 범위","text":"제43조(보증채무의 범위) ① 계약담당공무원은 계약상대자가 정당한 이유 없이 계약상의 의무를 이행하지 아니한 경우에는 보증기관으로 하여금 보증서에 기재된 사항에 따라 발주기관에 보증채무를 이행하게 하여야 한다.② 제1항에 의한 보증채무에는 하자담보채무와 선금반환채무를 포함하지 아니한다. 다만, 계약체결시 하자담보채무에 대하여 별도의 특약을 체결한 때에는 이를 포함한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:44","kind":"조문","type":"계약예규","family":"nca","label":"제44조","title":"보증채무의 이행방법","text":"제44조(보증채무의 이행방법) 계약상대자가 정당한 이유없이 계약상의 의무를 이행하지 아니한 경우에 보증기관은 보증이행업체를 지정하여 해당계약을 이행하게 하되 새로운 보증이행업체를 지정하기 곤란한 경우 발주기관의 승인을 거쳐 기존 계약상대자로 하여금 해당계약을 이행하게 할 수 있다. 다만, 공사이행보증서상의 보증금을 현금으로 납부하는 경우에는 그러하지 아니하다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:45","kind":"조문","type":"계약예규","family":"nca","label":"제45조","title":"보증이행업체의 지정","text":"제45조(보증이행업체의 지정) ① 제44조에 의한 보증이행업체 지정시에 계약담당공무원은 보증기관으로 하여금 다음 각호의 자격을 갖추고 있는 자를 보증이행업체로 지정하게 하여야 하며, 보증이행업체지정에 관련된 서류를 계약담당공무원에게 제출하여 승인을 얻도록 하여야 한다. 지정된 보증이행업체를 변경하는 경우에도 또한 같다.1. 「독점규제 및 공정거래에 관한 법률」에 의한 계열회사가 아닌 자2. 시행령 제76조에 의한 입찰참가자격제한을 받고 그 제한 기간 중에 있지 아니한 자3. 시행령 제36조에 의한 입찰공고에서 정한 입찰참가자격과 동등이상의 자격을 갖춘 자4. 시행령 제13조에 의한 입찰의 경우에는 입찰참가자격사전심사기준에 따른 심사 종합평점이 입찰적격 기준점수 이상이 되는 자② 계약담당공무원은 제1항에 의하여 보증이행업체로 지명된 자가 부적격하다고 인정되는 경우에는 보증기관에 보증이행업체의 변경을 요구할 수 있으며, 보증기관이 지정된 보증이행업체의 변경을 요구하는 경우에는 이를 승인할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:46","kind":"조문","type":"계약예규","family":"nca","label":"제46조","title":"보증이행업체의 보증이행","text":"제46조(보증이행업체의 보증이행) ① 계약담당공무원은 계약상대자가 계약상의 의무를 이행하지 아니한 경우에는 지체없이 보증기관에 보증채무의무를 이행할 것을 청구하여야 한다. 이때 계약담당공무원은 공사현장(기성부분, 가설물, 기계ㆍ기구, 자재 등)의 보존과 손해의 발생을 방지하여야 하며 보증기관이 보증이행업체를 지정하여 보증채무를 이행하게 한 경우에는 그 보증이행업체에게 이를 인도하여야 한다.② 제1항의 청구에 의하여 계약상의 공사보증이행의무를 완수한 보증기관은 계속공사에 있어 계약상대자가 가지는 계약체결상의 이익을 가진다.③ 보증기관은 계약금액중 보증이행부분에 상당하는 금액을 발주기관에 직접 청구할 수 있는 권리를 가지며, 계약상대자는 보증이행업체의 보증이행부분에 상당하는 금액을 청구할 수 있는 권리를 상실한다.④ 계약담당공무원은 보증기관이 정당한 이유없이 계약상의 보증채무를 이행하지 아니한 경우에는 보증기관으로 하여금 공사이행보증서상의 보증금을 현금으로 납부하게 하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:47","kind":"조문","type":"계약예규","family":"nca","label":"제47조","title":"보증채무의 소멸시기","text":"제47조(보증채무의 소멸시기) 계약담당공무원은 제46조에 의한 보증채무의 이행을 공사이행보증서상의 보증기간 말일 다음날부터 기산하여 6월이내에 보증기관에 청구하여야 하며, 보증기관은 그 청구기간이 경과된 후에는 보증책임을 지지 아니한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:48","kind":"조문","type":"계약예규","family":"nca","label":"제48조","title":"보증기관에 대한 통지등","text":"제48조(보증기관에 대한 통지등) ① 계약담당공무원은 다음 각호의 어느 하나의 경우에는 지체없이 그 사실을 보증기관에 서면으로 통지하여야 한다.1. 공사의 전부 또는 일부의 시공을 중지하였을 경우2. 시행령 제64조 내지 제66조에 의하여 물가변동, 설계변경, 기타 계약내용변경에 따라 계약금액을 조정하였을 경우3. 공사계약기간을 연장 또는 단축하고자 할 경우4. 계약상대자의 공사계약에 의하여 발생한 채권(이하 \"공사대금청구권\"이라 한다)에 대하여 타인으로부터 발주기관에 압류ㆍ가압류 또는 가처분 등의 강제집행이 있는 경우② 계약담당공무원은 다음 각호의 어느 하나에 대하여 보증기관의 요청이 있는 경우 이에 협조하여야 한다.1. 보증기관이 보증채무의 이행을 위하여 설계도서나 이미 공급한 지급자재내역에 대한 자료요청을 하는 경우2. 보증기관이 공사진행 상황을 조사하고자 하는 경우3. 하도급내용에 대한 자료요청을 하는 경우","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:49","kind":"조문","type":"계약예규","family":"nca","label":"제49조","title":"공사대금청구권의 양도","text":"제49조(공사대금청구권의 양도) 계약담당공무원은 계약상대자가 공사대금청구권을 보증기관의 동의 없이 제3자에게 양도하고자 할 때에는 이를 승인하여서는 아니 된다. 다만, 「사회기반시설에 대한 민간투자법」 제2조제6호 단서에서 정한 초과시공을 수행한 자가 해당 초과시공 부분 공사대금청구권(「국가를 당사자로 하는 계약에 관한 법률」 제14조 및 시행령 제55조에서 정한 기성검사를 완료한 경우에 한함)을 제3자에게 양도함에 있어 「사회기반시설에 대한 민간투자법」 제34조제1항에 의한 신용보증을 받고자 하는 경우에는 계약담당공무원은 보증기관의 동의 없이 이를 승인할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:50","kind":"조문","type":"계약예규","family":"nca","label":"제50조","title":"공동계약에 있어서의 보증채무의 이행","text":"제50조(공동계약에 있어서의 보증채무의 이행) ① 계약담당공무원은 공동이행방식으로 체결된 공동계약에 있어 공동수급체 구성원중 일부가 부도ㆍ파산 또는 해산 등의 사유로 계약을 이행할 수 없는 경우로서 잔존구성원이 면허, 시공능력평가액 등 해당 계약이행요건을 갖추지 못한 경우로서 새로운 구성원을 추가하지 않은 때 또는 해당 계약이행요건을 갖추었더라도 계약을 이행하지 아니하는 때에는 보증기관에 보증채무의 이행을 청구하여야 한다. ② 계약담당공무원은 분담이행방식으로 체결된 공동계약에 있어 공동수급체 구성원중 일부가 부도ㆍ파산 또는 해산등의 사유로 계약을 이행할 수 없는 경우에는 제1항에도 불구하고 잔존구성원의 자격요건 구비여부와 관계없이 보증기관에 보증채무의 이행을 청구하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:51","kind":"조문","type":"계약예규","family":"nca","label":"제51조","title":"보증채무이행개시 기한","text":"제51조(보증채무이행개시 기한) 계약담당공무원은 보증기관으로 하여금 이행청구서가 접수된 날부터 30일이내에 보증채무의 이행을 개시하게 하여야 한다. 다만, 보증기관의 보증이행업체 선정 지연등 불가피한 사유가 인정되는 때에는 30일의 범위내에서 보증채무의 이행개시일을 연장할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:52","kind":"조문","type":"계약예규","family":"nca","label":"제52조","title":"지체상금","text":"제52조(지체상금) 계약담당공무원은 보증기관이 제51조에 의한 보증채무이행개시 기한(동 기한이 연장된 때에는 연장된 기한)내에 보증채무의 이행을 개시하는 경우에 그 이행청구서가 접수된 날부터 보증채무이행개시일 전일까지의 기간에 대하여는 지체상금을 부과하여서는 아니 된다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:53","kind":"조문","type":"계약예규","family":"nca","label":"제53조","title":"기타 사항","text":"제53조(기타 사항) ① 시행령 제52조제5항에 따라 시행령 제52조제1항 내지 제4항을 준용할 수 있는 용역계약은 다음 각 호와 같다. 1. 건설기술진흥법 제2조제3호에 따른 건설기술용역2. 건축사법 제2조제3호에 따른 설계용역3. 기타 각 중앙관서의 장이 공익상 이행확보의 필요성이 크다고 인정하는 용역② 제1항에도 불구하고 시행규칙 제23조의3 각호에 해당하는 용역계약의 경우에는 시행령 제52조제1항 내지 제4항을 준용하지 아니한다. ③ 이 장에 정한 사항외의 공사이행보증과 관련된 기타계약조건은 공사이행보증약관과 해당 공사의 특성 등을 고려하여 발주기관ㆍ계약상대자 및 보증기관간의 협의에 의하여 정할 수 있다.\n제14장 공사의 손해보험가입 업무집행","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:54","kind":"조문","type":"계약예규","family":"nca","label":"제54조","title":"공사의 손해보험 가입","text":"제54조(공사의 손해보험 가입) 계약담당공무원은 시행령 제53조제2항에 따른 공사손해보험(「건설산업기본법」 제56조제1항제5호에 따른 손해공제를 포함한다. 이하 이 장에서 같다)의 규정에 의한 공사손해보험 가입 업무수행은 이 장에 정한 바에 따라야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:55","kind":"조문","type":"계약예규","family":"nca","label":"제55조","title":"보험의 가입","text":"제55조(보험의 가입) ① 계약담당공무원은 시행령 제78조, 제97조 및 추정가격 200억원이상인 공사로서 계약예규「입찰참가자격사전심사요령」제6조제5항제1호에 규정된 공사에 대하여 공사손해보험에 가입하거나 계약상대자에게 공사손해보험에 가입하도록 하여야 하며 필요한 경우 보험가입 등과 관련하여 전문가로부터 자문을 받을 수 있다. ② 계약담당공무원은 제1항에 해당하는 공사로서 하나의 사업을 수 개의 공구로 분할하여 발주하거나, 유사한 유형의 수 개의 공사를 인접한 시기에 발주하는 경우 경제성ㆍ효율성 등을 감안하여 공사손해보험에 가입하는 것을 우선 고려하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:56","kind":"조문","type":"계약예규","family":"nca","label":"제56조","title":"보험가입의 범위","text":"제56조(보험가입의 범위) 제55조에 의하여 가입하는 보험은 계약목적물에 대한 손해담보와 제3자 손해배상책임을 담보할 수 있는 보험이어야 한다. 다만, 계약상대자가 필요하다고 인정할 경우에는 계약상대자의 부담으로 추가적으로 담보하는 보험에 가입하게 할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:57","kind":"조문","type":"계약예규","family":"nca","label":"제57조","title":"보험가입금액","text":"제57조(보험가입금액) ① 계약목적물에 대한 손해보험가입금액은 공사의 보험가입 대상부분의 계약금액에서 부가가치세와 손해보험료를 제외한 금액(이하 \"순계약금액\"이라 한다)을 기준으로 한다.② 제1항에 규정한 순 계약금액에 관급자재가 있을 경우에는 이를 포함하며, 장기계속공사계약인 경우에는 총 공사 부기금액을 기준으로 순계약금액을 산정한다.③ 제3자 손해배상책임에 대한 매 사고당 보상한도는 제1항 및 제2항에서 규정한 보험가입 금액의 100분의 1과 5억원중 많은 금액으로 한다.④ 계약담당공무원은 계약금액이 증감(시행령 제64조 내지 제66조에 의한 계약금액의 증감)된 경우에는 증감된 순계약금액만큼 공사손해보험가입금액을 증액 또는 감액하거나 계약상대자에게 증액 또는 감액하게 하여야 한다. 다만, 계약금액이 증가되는 경우로서 증가된 순계약금액이 당초 보험가입금액의 100분의 10을 초과하지 아니하는 경우에는 그러하지 아니하다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:58","kind":"조문","type":"계약예규","family":"nca","label":"제58조","title":"피보험자","text":"제58조(피보험자) 계약담당공무원 이나 계약상대자는 공사손해보험가입시에 발주기관, 계약상대자, 하수급인 및 해당공사의 이해관계인을 피보험자로 하여야 하며, 계약상대자가 가입하는 경우로서 보험사고 발생으로 발주기관이외의 자가 보험금을 수령하게 될 경우에는 발주기관의 장의 사전동의를 받도록 약정하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:59","kind":"조문","type":"계약예규","family":"nca","label":"제59조","title":"보험의 가입시기 및 기간","text":"제59조(보험의 가입시기 및 기간) ① 계약담당공무원은 제55조에 의한 보험가입을 공사착공일 이전까지 가입하거나 계약상대자에게 가입하게 하여야 하고 그 증서를 착공신고서 제출시에 발주기관에게 제출하게 하여야 한다. ② 제1항에 따른 보험기간은 해당공사 착공시(손해보험가입 비대상공사가 포함된 공사의 경우에는 손해보험가입대상공사 착공일을 말함)부터 발주기관의 인수시(시운전이 필요한 공사인 경우에는 시운전 시기까지 포함한다)까지로 하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:60","kind":"조문","type":"계약예규","family":"nca","label":"제60조","title":"보험료 계상 및 보험료율 산정","text":"제60조(보험료 계상 및 보험료율 산정) ① 계약담당공무원은 제55조에 의한 보험가입대상 공사로서 계약상대자가 가입하게 하는 경우에는 예정가격 작성시에 계약예규 「예정가격 작성기준」 제2장(원가계산에 의한 예정가격 작성)에 정한 내용에 따라 예정가격에 보험료를 계상하여야 한다. 다만, 시행령 제7조의2제2항에 의하여 예정가격을 작성하지 아니하는 경우에는 공사예산에 보험료를 계상하여야 한다. ② 계약담당공무원은 제1항에 의한 보험료 계상을 위한 보험료율은 보험개발원, 손해보험회사등으로부터 제공받아 이를 기초로 하여 산정한다.③ 계약담당공무원은 공사손해보험료 산정의 근거가 되는 보험가입대상 공사부분의 항목 등을 설계서에 명시하여야 한다. ④ 계약담당공무원은 계약상대자에게 예정가격조서상의 보험료 또는 계약상대자가 제출한 입찰금액 산출내역서상의 보험료와 손해보험회사에 실제 납입한 보험료간의 차액발생을 이유로 보험가입을 거절하거나 동 차액의 정산을 요구하지 아니하도록 하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:61","kind":"조문","type":"계약예규","family":"nca","label":"제61조","title":"보험약관","text":"제61조(보험약관) 계약담당공무원은 제55조에 의한 보험가입대상 공사에서 계약상대자가 가입하는 경우에는 보험약관의 형식(독일식 약관 또는 영국식 약관)을 정하여 계약상대자에게 통보하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:62","kind":"조문","type":"계약예규","family":"nca","label":"제62조","title":"계약상대자의 의무등","text":"제62조(계약상대자의 의무등) 계약담당공무원은 공사손해보험에 가입하거나 계약상대자에게 가입하게 하는 경우에 계약상대자로 하여금 다음 각호의 사항을 성실히 이행하게 하여야 한다. 1. 보험에 가입한 공사의 손해방지를 위한 위험관리에 있어 신의와 성실의 원칙에 입각한 선량한 관리자로서의 주의의무2. 보험가입과 관련하여 피보험자가 이행하여야 할 보험회사에 대한 고지 또는 통지의무3. 보험에 가입한 공사의 시공기간중 보험회사의 위험도 조사에 대한 협조 및 보험회사로부터 제출된 위험도 조사 보고서(Risk Survey Report)에 따른 적절한 위험방지 조치4. 보험사고 발생시에 구체적인 사고경위 등을 지체없이 계약담당공무원에게 통보할 의무","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:63","kind":"조문","type":"계약예규","family":"nca","label":"제63조","title":"보험계약상의 권리의무 승계","text":"제63조(보험계약상의 권리의무 승계) 계약담당공무원은 제55조에 의한 보험계약의 체결에 있어 시행령 제52조에 의한 공사이행보증서 발급기관이 보증시공을 하게 될 경우에는 계약상대자의 보험계약상의 권리와 의무가 공사이행보증서 발급기관에 승계될 수 있게 하여야 한다. 보험가입공사계약이 해제 또는 해지되어 새로운 계약상대자가 선정되는 경우에도 또한 같다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:64","kind":"조문","type":"계약예규","family":"nca","label":"제64조","title":"보험계약상의 권리양도 등의 제한","text":"제64조(보험계약상의 권리양도 등의 제한) 계약담당공무원은 계약 상대자가 보험과 관련한 일체의 보험계약상의 권리를 제3자에게 양도ㆍ이전ㆍ질권의 설정ㆍ기타 담보를 제공하게 하여서는 아니되며, 어떠한 형태로든지 피보험자의 권리를 제한하는 행위를 하게 하여서는 아니 된다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:65","kind":"조문","type":"계약예규","family":"nca","label":"제65조","title":"보험금의 사용","text":"제65조(보험금의 사용) ① 계약담당공무원은 보험가입 목적물의 보험사고로 보험금이 지급되는 경우에 계약상대자로 하여금 동 보험금을 해당 공사의 복구에 우선 사용하게 하여야 한다.② 계약담당공무원은 제1항에 의한 보험금 지급의 지연 또는 부족을 이유로 계약상대자가 피해복구를 지연하거나 거절할 수 없게 하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:66","kind":"조문","type":"계약예규","family":"nca","label":"제66조","title":"기타사항","text":"제66조(기타사항) 계약담당공무원은 보험가입등과 관련하여 이 예규에 규정되지 아니한 사항에 대하여는 보험약관에 정하거나 계약상대자 및 손해보험회사와의 협의 또는 중재기관에 의한 조정 등에 의할 수 있다.\n제15장 물가변동 조정율 산출","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:67","kind":"조문","type":"계약예규","family":"nca","label":"제67조","title":"품목조정율","text":"제67조(품목조정율) ① 계약담당공무원은 시행령 제64조제1항제1호에 의한 품목조정율 산출시에는 시행규칙 제74조제1항 내지 제3항에 정한 바에 의하되, 표준시장단가가 적용된 공종의 경우에는 입찰당시(또는 직전조정기준일당시)의 표준시장단가와 물가변동당시의 표준시장단가를 비교하여 등락율을 산출한다. ② 제1항에도 불구하고 각 중앙관서의 장 또는 그가 지정하는 단체에서 제정한 \"표준품셈\"상의 건설기계는 입찰당시의 건설기계 시간당 손료(損料)와 물가변동당시의 건설기계 시간당 손료를 비교하여 등락율을 산출한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:68","kind":"조문","type":"계약예규","family":"nca","label":"제68조","title":"지수조정율 및 용어의 정의","text":"제68조(지수조정율 및 용어의 정의) 시행령 제64조제1항제2호에 의한 지수조정율 산출시에는 이 장에서 정한 바에 따라야 하며, 이 장에서 사용하는 용어의 정의는 다음과 같다. 1. \"비목군\"이라 함은 계약금액의 산출내역중 재료비, 노무비 및 경비를 구성하는 제비목을 노무비, 기계경비, 표준시장단가 또는 한국은행이 조사 발표하는 생산자물가기본분류지수 및 수입물가지수표상의 품류에 따라 입찰시점(수의계약의 경우에는 계약체결시점. 단, 시행령 제28조제2항에 따라 준용되는 같은 조 제1항의 수의계약의 경우 당초계약의 입찰시점을 말한다. 이하 같다)에 계약담당공무원이 다음 각목의 예와 같이 분류한 비목을 말하며 이하 \"A, B, C, D, E, F, G, H, I, J, K, L, M, ㆍㆍㆍㆍㆍZ\"로 한다. 가. A : 노무비(공사와 제조로 구분하며 간접노무비 포함)나. B : 기계경비(공사에 한함)다. C : 광산품라. D : 공산품마. E : 전력ㆍ수도ㆍ 도시가스 및 폐기물바. F : 농림ㆍ수산품사. G : 표준시장단가(공사에 한하며, G1 : 토목부문, G2 : 건축부문, G3 : 기계설비부문, G4 : 전기부문, G5 : 정보통신부문으로 구분하며, 일부공종에 대하여 재료비ㆍ노무비ㆍ경비중 2개이상 비목의 합계액을 견적받아 공사비에 반영한 경우에는 이를 해당 부분(G1, G2, G3, G4, G5)의 표준시장단가에 포함한다. 이하 같다.) 아. H : 산재보험료자. I : 산업안전보건관리비차. J : 고용보험료카. K : 건설근로자 퇴직공제부금비타. L : 국민건강보험료파. M : 국민연금보험료하. N : 노인장기요양보험료거. Z : 기타 비목군2. \"계수\"라 함은 \"A, B, C, D, E, F, G, H, J, J, K, L, M, ㆍㆍㆍㆍㆍ Z\"의 각 비목군에 해당하는 산출내역서상의 금액(예정조정기준일전에 이행이 완료되어야 할 부분에 해당되는 금액은 제외한다)이 동 내역서상의 재료비, 노무비 및 경비의 합계액(예정조정기준일전에 이행이 완료되어야 할 부분에 해당되는 금액은 제외한다)에서 각각 차지하는 비율(이하 \"가중치\"라 한다)로서 이하 \"a, b, c, d, e, f, g, h, i, j, k, l, m,  ㆍㆍㆍㆍㆍ z\"로 표시한다.3. \"지수 등\"이라 함은 다음 각목을 말한다.가. A에 대하여는 시행규칙 제7조제1항에 의하여 조사ㆍ공표된 해당직종의 평균치를, B에 대하여는 각 중앙관서의 장 또는 그가 지정하는 단체에서 제정한 \"표준품셈\"의 건설기계 가격표상의 전체기종에 대한 시간당 손료의 평균치(해당공사에 투입된 기종을 의미하는 것은 아님)를, \"C, D, E, F\"에 대하여는 생산자물가기본분류지수표 및 수입물가지수표상 해당 품류에 해당하는 지수를, G에 대하여는 시행령 제9조제1항제3호에 의하여 각 중앙관서의 장이 발표한 공종별(G1, G2, G3, G4, G5) 표준시장단가의 전체 평균치를 말하며, 이하 기준시점인 입찰시점의 지수 등은 각각 \"A0, B0, C0, D0, E0, F0, G0\"로, 비교시점인 물가변동시점의 지수 등은 각각 \"A1, B1, C1, D1, E1, F1, G1\"으로 표시하되 통계월보상의 지수는 매월말에 해당하는 것으로 보고 각 비목군의 지수상승율을 산출한다. 나. \"H, I\"에 대하여는 다음 공식에 의하여 산출하며, \"J, K, L, M, N\"에 대하여는 \"H\" 산출방식을 준용한다.H0=A0×입찰시 산재보험료율H1=A1×조정기준일 당시 산재보험료율I0=변동전(직접노무비계수+재료비계수+표준시장단가계수)×입찰시 산업안전보건관리비율* 변동전 재료비계수=c+d+e+fI1=변동후(직접노무비계수+재료비계수+표준시장단가계수)×조정기준일당시 산업안전보건관리비율* 변동후 계수=변동전계수×지수변동율다. Z0 또는 Z1의 경우에는 A0부터 G0까지 또는 A1부터 G1까지 각 비목의 지수를 해당비목의 가중치에 곱하여 산출한 수치의 합계를 비목군수로 나눈 수치로 하여 아래 공식에 의하여 산출한다. 단, 노무비(A)는 지수화(100%)하여 적용한다.Z0=(aA0+cC0+dD0+eE0+fF0+gG0)/비목군수Z1=(aA1+cC1+dD1+eE1+fF1+gG1)/비목군수","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:69","kind":"조문","type":"계약예규","family":"nca","label":"제69조","title":"조정율의 산출","text":"제69조(조정율의 산출) ① 지수조정율(이하 \"K\"라 표시한다)은 다음의 계산식에 의하여 산출한다.② 각 비목군의 지수는 입찰시점과 조정기준일 시점의 지수(\"C, D, E, F\"에 대하여는 각각의 전월지수, 다만, 월말인 경우에는 해당 월의 지수를 말한다)를 각각 적용한다.③ 제68조에 의한 비목군은 계약이행기간중 설계변경, 비목군 분류기준의 변경 및 비목군 분류과정에서 착오나 고의 등으로 비목군 분류가 잘못 적용된 경우를 제외하고는 변경하지 못한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:70","kind":"조문","type":"계약예규","family":"nca","label":"제70조","title":"계약금액의 조정","text":"제70조(계약금액의 조정) ① 계약담당공무원은 계약체결후 90일 이상이 경과(계약체결일을 불산입하고 그 다음 날부터 기산하여 91일이 되는 날을 의미한다. 이하 같다)되고 제69조제1항에 의하여 산출한 K가 100분의 3이상인 경우로서 계약상대자의 청구가 있는 때에는 계약금액을 조정하되, 청구금액의 적정성에 대하여 직접 심사하기 곤란한  경우에는 「예정가격작성기준」 제31조에 따른 원가계산용역기관에 위탁할 수 있다. ② 제1항에 의한 계약금액의 조정은 조정기준일 이후에 이행되는 부분의 대가(이하 \"물가변동 적용대가\"라 한다)에 적용하되, 시공 또는 제조개시전에 제출된 공정예정표상 조정기준일전에 이행이 완료되어야 할 부분은 물가변동 적용대가에서 제외한다. 다만, 정부에 책임 있는 사유 또는 천재·지변 등 불가항력적인 요인으로 공정 또는 납품이 지연된 경우에는 그러하지 아니하다.③ 제1항에 의하여 계약금액조정에 사용된 K는 90일간 변동하지 못한다.④ 제2차 이후의 계약금액조정율은 제69조제1항의 계산식중 \"A0, B0, C0, D0, E0, F0, G0, H0, I0, J0, K0, L0, M0, ·····Z0\"에는 직전조정시의 \"A1, B1, C1, D1, E1, F1, G1, H1, I1, J1, K1, L1, M1, ··· Z1\"을,  \"A1, B1, C1, D1, E1, F1, G1, H1, I1, J1, K1, L1, M1, ···Z1\"에는 비교시점인 물가변동시점의 지수등을 각각 대입하여 산출한다.⑤ 계약담당공무원은 제68조제3호에 의한 \"표준품셈\"(이하 품셈이라 한다. 이하 같다)상의 건설기계 시간당 손료의 평균치를 다음 각호에 따라 산정하여야 한다.1. 입찰시점 또는 직전조정기준일 시점의 기계경비 지수는 당시 품셈의 건설기계 가격표상의 기종에 대한 시간당 손료의 평균치2. 물가변동시점의 기계경비 지수는 조정기준일 당시 품셈의 건설기계 가격표상의 기종 중 입찰시점 또는 직전조정기준일 시점 당시 품셈의 건설기계 가격표상의 기종만의 시간당 손료의 평균치3. 입찰시점 또는 직전조정기준일 당시 품셈의 건설기계 가격표상의 기종이 물가변동시점에 삭제된 경우에는 입찰시점 또는 직전조정기준일 시점 당시 품셈의 건설기계 가격표상의 기종에 대한 시간당 손료의 평균치 산정시 물가변동시점에 삭제된 기종을 제외함 ⑥ 계약담당공무원은 제68조제3호에 의한 각 중앙관서의 장이 발표한 공종별(G1, G2, G3, G4, G5) 표준시장단가의 전체 평균치를 다음 각호에 따라 산정하여야 한다. 1. 입찰시점 또는 직전조정기준일 시점의 표준시장단가 지수는 입찰시점 또는 직전조정기준일 시점 당시 각 중앙관서의 장이 발표한 공종별 표준시장단가의 전체 평균치2. 물가변동시점의 표준시장단가 지수는 조정기준일 중 입찰시점 또는 직전조정기준일 시점 당시 공종별 표준시장단가에 해당하는 표준시장단가만의 전체 평균치3. 입찰시점 또는 직전조정기준일 시점에 발표되어 있던 표준시장단가 적용 공종이 물가변동시점에 삭제된 경우에는 입찰시점 또는 직전조정기준일 시점 당시 공종별 표준시장단가의 전체 평균치 산정시 물가변동시점에 삭제된 공종을 제외함⑦ 제6항에도 불구하고 건축부문 표준시장단가(G2)의 전체평균치 산정시 국토교통부장관이 발표한 표준시장단가 공종 중 타워크레인 운반비(8ton, 10ton, 12ton)와 타워크레인 임대료(8ton, 10ton, 12ton)는 발표된 단가를 다음 각 호에 따라 단위를 보정하여 산정한 단가를 반영한다. 1. 타워크레인 운반비는 대당 단가를 규격별 권상(卷上)능력으로 나누어 톤당 단가로 반영2. 타워크레인 임대료는 월당 단가를 25일로 나누어 일당 단가로 반영⑧ 시행규칙 제74조 제7항의 불가피한 사유는 다음 각 호의 사유를 말한다.1. 예측하기 힘든 태풍·홍수 기타 악천후, 전쟁 또는 사변, 지진, 화재, 전염병, 폭동 등에 따라 계약금액 조정이 필요한 경우2. 원자재의 급격한 가격 급등에 따라 계약금액 조정이 필요한 경우3. 장기계속 물품·용역계약으로서 시행령 제9조제1항제1호에 따라 예정가격을 결정하여 입찰당시의 원가자료가 존재하지 아니하는 경우","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:70의2","kind":"조문","type":"계약예규","family":"nca","label":"제70조의2","title":"지수조정율 등 산정시 소수점 처리","text":"제70조의2(지수조정율 등 산정시 소수점 처리) 계약담당공무원은 지수조정율 등 산정시 소수점 이하의 숫자가 있는 경우에 다음 각호에 따라 산정한다.1. 지수, 지수변동율(입찰시점의 지수대비 물가변동시점의 지수) 및 지수조정율(K) 은 소수점 다섯째자리 이하는 절사하고 소수점 넷째자리까지 산정함2. 각 비목군의 계수는 계수의 합이 1이 되어야 함을 고려하여 계약당사자간에 협의(예 : 일부는 절상하고 일부는 절사하여 계수의 합이 1이 되도록 하는 방법)하여 결정함","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:70의3","kind":"조문","type":"계약예규","family":"nca","label":"제70조의3","title":"특정규격 자재의 가격변동으로 인한 계약금액조정","text":"제70조의3(특정규격 자재의 가격변동으로 인한 계약금액조정) ① 계약담당공무원은 시행령 제64조제6항에 따라 특정규격의 자재별 가격변동에 따른 계약금액을 조정하는 경우에 품목조정률에 의하며, 시행규칙 제74조를 준용한다.② 계약담당공무원은 제1항에 따른 계약금액을 조정 후에 시행령 제64조제1항 및 시행규칙 제74조에 따라 물가변동으로 인한 계약금액을 조정하는 경우에는 다음 각 호의 기준에 따른다. 다만, 2차 이후의 계약금액 조정에 있어서는 다음 각 호에도 불구하고 시행령 제64조제1항 및 시행규칙 제74조에 따른다.1. 시행령 제64조제1항제1호에 따라 계약금액을 조정하는 경우에는 품목조정률 산출시에 제1항에 따라 산출한 특정규격자재의 가격상승률을 감산(하락률은 합산)한다.2. 시행령제64조제1항제2호에 따라 계약금액을 조정하는 경우에 지수조정률은 다음 각목과 같이 산출한다.가. 제68조제1호에 따른 비목군 분류시에는 특정자재가 속해 있는 비목군에서 특정자재 비목군을 따로 분류한다.나. 제68조제2호에 따른 계수산출시에는 제1항에 따라 조정된 금액을 제외하고 산출하며, 특정자재 비목군과 특정자재를 제외한 비목군에 해당하는 금액이 차지하는 비율에 따라 각각 계수를 산출한다.다. 제69조에 따른 조정률 산출시에 특정자재 비목군의 지수변동률은 특정규격자재의 등락폭에 해당하는 지수상승률을 감산(하락률일 경우에는 합산)하고, 특정규격자재의 조정기준일부터 물가변동으로 인한 계약금액 조정기준일까지 지수상승률은 합산하여 산출한다.③ 계약담당공무원은 총액증액조정요건과 단품증액조정요건이 동시에 충족되는 경우에는 총액증액조정을 적용하여야 한다. 다만, 다음 각호의 경우에는 단품증액조정을 우선 적용할 수 있다. 1. 단품증액조정이 총액증액조정보다 하수급업체에 유리한 경우2. 기타 발주기관의 계약관리 효율성 제고 등을 위해 단품증액조정을 적용할 필요성이 있다고 인정되는 경우[본조신설 2008.5.1.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:70의4","kind":"조문","type":"계약예규","family":"nca","label":"제70조의4","title":"원자재 가격급등 등으로 계약이행이 곤란한 경우 계약금액조정","text":"제70조의4(원자재 가격급등 등으로 계약이행이 곤란한 경우 계약금액조정) ①시행령 제64조제5항에서 원자재의 가격급등 등으로 인하여 90일내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 인정되는 경우란 계약체결일 또는 직전 조정기준일 이후 원자재가격 급등과 관련하여 다음 각 호에 해당하는 경우를 말한다.1. 공사, 용역, 물품제조계약에서 품목조정률이나 지수조정률이 5%이상 상승한 경우2. 물품구매 계약에서 품목조정률이나 지수조정률이 10%이상 상승한 경우3. 공사, 용역 및 물품제조계약에서 품목조정률이나 지수조정률이 3%(물품구매계약에서는 6%)이상 상승하고, 기타 객관적 사유로 조정제한기간 내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 계약담당공무원이 인정하는 경우② 조정기준일은 제1항의 조건이 충족된 최초의 날을 말한다.③ 계약상대자는 제1항제1호 및 제2호에 따라 물가변동으로 인한 계약금액 조정을 하는 경우에는 원자재 가격급등 및 이에 따라 계약금액에 미치는 영향 등에 대한 증빙서류를 계약담당공무원에게 제출하여야 한다.④ 계약상대자는 제1항제3호에 따라 물가변동으로 인한 계약금액 조정을 하는 경우에 원자재가격급등 및 이에 따라 계약금액에 미치는 영향, 계약이행이 곤란한 객관적 사유 등에 대한 증빙서류를 계약담당공무원에게 제출하여야 한다.⑤ 제4항에서 계약이행이 곤란한 객관적 사유에 대한 증빙서류에는 다음과 같은 내용이 포함될 수 있다.1. 계약가격과 시중거래가격의 현저한 차이 존재2. 환율급등, 하도급자의 파업등 입찰시 또는 계약체결시 예상할 수 없었던 사유에 의해 계약금액을 조정하지 아니하고는 계약수행이 곤란한 상황3. 계약을 이행하는 것보다 납품지연, 납품거부, 계약포기로 제재조치를 받는 것이 비용상 더 유리한 상황4. 주요 원자재의 가격급등으로 인한 조달곤란으로 계약목적물을 적기에 이행할 수 없어 과도한 추가비용이 소요되는 상황5. 기타 계약상대자의 책임없는 사유로 계약금액을 조정하지 아니하고는  계약이행이 곤란한 상황⑥ 각 중앙관서의 장은 동조에 따라 계약금액을 조정할 필요가 있는 경우는 시행령 제94조의 계약심의회 심의를 거쳐 결정할 수 있으며, 동조 시행에 필요한 세부기준을 운용할 수 있다.[본조신설 2008.11.1.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:70의5","kind":"조문","type":"계약예규","family":"nca","label":"제70조의5","title":"계약금액 감액조정 등","text":"제70조의5(계약금액 감액조정 등) ① 계약담당공무원은 시행령 제64조 제1항 또는 제6항의 감액조정요건이 충족되는 경우에는 계약상대자에게 통보하여 계약금액을 감액 조정하되, 계약금액 조정요건의 충족여부 등을 자체적으로 확인할 수 없는 경우에는 「예정가격작성기준」 제31조에 따른 원가계산용역기관에 위탁하여 확인할 수 있다. 다만, 계약금액의 감액조정금액이 원가계산기관 위탁수수료보다 낮을 것으로 예상되는 경우 감액조정을 생략할 수 있다. ② 계약담당공무원은 총액감액조정과 단품감액조정 요건이 동시에 충족되는 경우에는 원칙적으로 총액감액조정을 우선 적용한다.③ 계약담당공무원은 직전 계약금액조정시에 단품증액조정을 한 경우에 단품감액조정요건이 충족되면 원칙적으로 단품감액조정을 하여야 한다. 다만, 계약담당공무원은 단품감액조정을 적용함으로써 총액증액조정의 등락요건이 입찰일 또는 직전조정기준일로부터 조기에 충족되어 추가적인 계약금액 조정이 예상되는 경우에는 동 단품감액조정을 생략할 수 있다.④ 계약담당공무원은 직전 계약금액조정시에 단품증액조정요건과 총액증액조정요건이 동시에 충족하여 단품증액조정을 적용하지 못한 경우에는 단품감액조정을 적용하지 아니한다.⑤ 계약담당공무원은 단품감액 조정을 할 경우에 그 대상인 특정규격의 자재(부산물 또는 작업설은 제외한다)는 산출내역서상 재료비 항목의 자재로 한다. 다만, 산출내역서만으로 재료비 항목을 구분하기 어려운 경우에는 산출내역서 작성시 제출한 기초자료[(일위대가:一位代價) 등]를 활용하여 재료비 항목으로 구분하여 단품감액조정을 적용할 수 있다.⑥ 계약담당공무원은 계약금액을 감액조정할 경우에 시행규칙 제74조제6항에 따른 선금공제를 적용하지 않는다.⑦ 계약담당공무원은 해당 조정기준일 이후에 이행된 부분에 대해 조정통보 전에 지급된 기성대가(준공대가 포함)는 물가변동적용대가에서 공제한다. 다만, 계약담당공무원이 계약상대자에게 감액조정 통보 후에 지급한 기성대가(준공대가 포함) 또는 개산급으로 지급한 기성대가는 물가변동적용대가에 포함한다.⑧ 계약담당공무원은 단품감액조정 또는 총액감액조정을 할 경우에 계약상대자가 직전 계약금액 조정시에 단품증액조정이나 총액증액조정으로 인하여 조정받은 금액을 하수급인 등에게 배분한 것과 동일한 방식으로 회수·관리하도록 하여야 한다.⑨ 계약담당공무원은 2006.12.29 이전 계약으로서 계약상대자가 단품증액조정을 받지 않은 경우에는 단품감액조정을 적용하지 아니하되, 단품증액조정을 받은 경우 단품증액조정된 증액범위를 초과하여 단품감액조정을 할 수 없다.[본조신설 2009.5.4.]\n제16장 실비의 산정","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:71","kind":"조문","type":"계약예규","family":"nca","label":"제71조","title":"실비의 산정","text":"제71조(실비의 산정) 계약담당공무원은 시행령 제66조에 의한 실비 산정(하도급업체가 지출한 비용을 포함한다)시에는 이 장에 정한 바에 따라야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:72","kind":"조문","type":"계약예규","family":"nca","label":"제72조","title":"실비산정기준","text":"제72조(실비산정기준) ① 계약담당공무원은 기타 계약내용의 변경으로 계약금액을 조정함에 있어서는 실제 사용된 비용등 객관적으로 인정될 수 있는 자료와 시행규칙 제7조에 의한 가격을 활용하여 실비를 산출하여야 한다.② 계약담당공무원은 간접노무비 산출을 위하여 계약상대자로 하여금 급여 연말정산서류, 임금지급대장 및 공사감독의 현장확인복명서등 간접노무비 지급 관련서류를 제출케하여 이를 활용할 수 있다.③ 계약담당공무원은 경비의 산출을 위하여 계약상대자로부터 경비지출 관련 계약서, 요금고지서, 영수증등 객관적인 자료를 제출하게 하여 활용할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:73","kind":"조문","type":"계약예규","family":"nca","label":"제73조","title":"공사이행기간의 변경에 따른 실비산정","text":"제73조(공사이행기간의 변경에 따른 실비산정) ① 간접노무비는 연장 또는 단축된 기간중 해당현장에서 계약예규 「예정가격 작성기준」 제10조제2항 및 제18조에 해당하는 자가 수행하여야 할 노무량을 산출하고, 동 노무량에 급여 연말정산서, 임금지급대장 및 공사감독의 현장확인복명서 등 객관적인 자료에 의하여 지급이 확인된 임금을 곱하여 산정하되, 정상적인 공사기간 중에 실제 지급된 임금수준을 초과할 수 없다. ② 제1항에 따라 노무량을 산출하는 경우 계약담당공무원은 계약상대자로 하여금 공사이행기간의 변경사유가 발생하는 즉시 현장유지·관리에 소요되는 인력투입계획을 제출하도록 하고, 공사의 규모, 내용, 기간 등을 고려하여 해당 인력투입계획을 조정할 필요가 있다고 인정되는 경우에는 계약상대자와 협의하여 이를 조정하여야 한다. ③ 경비중 지급임차료, 보관비, 가설비, 유휴장비비 등 직접계상이 가능한 비목의 실비는 계약상대자로부터 제출받은 경비지출관련 계약서, 요금고지서, 영수증 등 객관적인 자료에 의하여 확인된 금액을 기준으로 변경되는 공사기간에 상당하는 금액을 산출하며, 수도광열비, 복리후생비, 소모품비, 여비ㆍ교통비ㆍ통신비, 세금과공과, 도서인쇄비, 지급수수료(7개 항목을 \"기타경비\"라 한다)와 산재보험료, 고용보험료 등은 그 기준이 되는 비목의 합계액에 계약상대자의 산출내역서상 해당비목의 비율을 곱하여 산출된 금액과 당초 산출내역서상의 금액과의 차액으로 한다. ④ 계약상대자의 책임 없는 사유로 공사기간이 연장되어 당초 제출한 계약보증서ㆍ공사이행보증서ㆍ하도급대금지급보증서 및 공사손해보험 등의 보증기간을 연장함에 따라 소요되는 추가비용은 계약상대자로부터 제출받은 보증수수료의 영수증 등 객관적인 자료에 의하여 확인된 금액을 기준으로 금액을 산출한다. ⑤ 계약상대자는 건설장비의 유휴가 발생하게 되는 경우 즉시 발생사유 등 사실관계를 계약담당공무원과 공사감독관에게 통지하여야 하며, 계약담당공무원은 장비의 유휴가 계약의 이행 여건상 타당하다고 인정될 경우에는 유휴비용을 다음 각 호의 기준에 따라 계산한다.1. 임대장비: 유휴 기간 중 실제로 부담한 장비임대료2. 보유장비: (장비가격×시간당 장비손료계수) × (연간표준가동기간÷365일) × (유휴일수) × 1/2","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:74","kind":"조문","type":"계약예규","family":"nca","label":"제74조","title":"설계서 작성시 주의사항 및 운반거리 변경에 따른 실비의 산정","text":"제74조(설계서 작성시 주의사항 및 운반거리 변경에 따른 실비의 산정) ① 계약담당공무원은 시행령 제14조에 의한 해당 공사의 설계서를 작성함에 있어 운반비 산정의 기준이 되는 다음 각호의 사항을 구체적으로 명기하여 불가피한 경우를 제외하고는 계약체결 후 운반거리 변경이 발생하지 아니하도록 하여야 한다.1. 토사(土砂)채취, 사토(捨土) 및 폐기물처리 등을 위한 위치2. 공사현장과 제1호에 의한 위치간의 운반거리, 운반로, 및 운반속도 등3. 기타 운반비 산정에 필요한 사항② 계약담당공무원은 토사채취 사토 및 폐기물처리등과 관련하여 당초 설계서에 정한 운반거리가 증·감되는 경우에 다음 각호의 기준에 의하여 계약금액을 조정한다.1. 당초 운반로 전부가 남아 있는 경우로서 운반거리가 변경되는 경우·조정금액 = 당초 계약단가 + 추가된 운반거리를 변경당시의 품셈을 기준으로 하여 산정한 단가와 동 단가에 낙찰율을 곱한 단가의 범위내에서 계약당사자간에 서로 주장하는 각각의 단가기준에 대한 근거자료 제시 등을 통하여 성실히 협의(이하 이 장에서 \"협의\"라 한다)하여 결정한 단가2. 당초 운반로 일부가 남아 있는 경우로서 운반거리가 변경되는 경우ㆍ조정금액 = (당초 계약단가 - 당초 운반로중 축소되는 부분의 계약단가) + 대체된 운반거리를 변경당시 품셈을 기준으로 산정한 단가와 동 단가에 낙찰율을 곱한 단가의 범위내에서 계약당사자간에 협의하여 결정한 단가3. 당초 운반로 전부가 변경되는 경우ㆍ조정금액 = (계약단가 + 변경된 운반거리를 변경당시 품셈을 기준으로 산정한 단가와 동단가에 낙찰율을 곱한 단가의 범위내에서 계약당사자간에 협의하여 결정한 단가) - 계약단가③ 제2항 각호에 의한 계산식 중 협의단가를 결정함에 있어 계약당사자간의 협의가 이루어지지 아니하는 경우에는 그 중간금액으로 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:75","kind":"조문","type":"계약예규","family":"nca","label":"제75조","title":"기타 실비의 산정","text":"제75조(기타 실비의 산정) 제73조 및 제74조 규정이외의 경우에 실비의 산정은 변경된 내용을 기준으로 하여 산정한 단가와 당초 단가와의 차액범위안에서 계약당사자간에 협의하여 결정한다. 다만, 계약당사자간에 협의가 이루어지지 아니하는 경우에는 변경된 내용을 기준으로 하여 산정한 단가와 당초 단가를 합한 금액의 100분의 50으로 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76","kind":"조문","type":"계약예규","family":"nca","label":"제76조","title":"일반관리비 및 이윤","text":"제76조(일반관리비 및 이윤) 일반관리비 및 이윤은 제73조 내지 제75조 규정에 의하여 산출된 금액에 대하여 계약문서상의 일반관리비율 및 이윤율에 의하며 시행규칙 제8조에서 정하는 율의 범위내에서 결정하여야 한다.\n제16장의2 시행규칙 제23조의3 각호의 용역계약의 집행","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의2","kind":"조문","type":"계약예규","family":"nca","label":"제76조의2","title":"노무용역계약의 집행","text":"제76조의2(노무용역계약의 집행) 시행규칙 제23조의3 각호의 용역계약의 집행과 관련하여서는 이 장에 정한 바에 따라야 한다.[본조신설 2017.12.28.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의3","kind":"조문","type":"계약예규","family":"nca","label":"제76조의3","title":"노무비의 계상","text":"제76조의3(노무비의 계상) ① 계약담당공무원은 예정가격 작성시 인건비의 기준단가는 다음 각호의 어느 하나에 따른 노임에 의하되, 「근로기준법」에서 정하고 있는 제수당, 상여금(기준단가의 연 400%를 초과하여 계상할 수 없다), 퇴직급여충당금의 합계액으로 한다. 1. 시설물관리용역: 「통계법」 제17조의 규정에 따라 중소기업중앙회가 발표하는 ‘중소제조업 직종별 임금조사 보고서’(최저임금 상승 효과 등 적용시점의 임금상승 예측치를 반영한 통계가 있을 경우 동 통계를 적용한다. 이하 이 조에서 ‘임금조사 보고서’라 한다)의 단순노무종사원 노임(다만, 임금조사 보고서상 해당직종의 노임이 있는 종사원에 대하여는 해당직종의 노임을 적용한다) 2. 그 밖의 용역: 임금조사 보고서의 단순노무종사원 노임② 제1항에도 불구하고 제1항에 따른 인건비 기준단가에 0.87995를 곱한 금액이 최저임금에 미치지 못하는 경우에는 최저임금에 0.87995를 나눈 금액을 인건비 기준단가로 한다.  [본조신설 2017.12.28.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의4","kind":"조문","type":"계약예규","family":"nca","label":"제76조의4","title":"근로조건 등의 명시","text":"제76조의4(근로조건 등의 명시) 계약담당공무원은 용역계약의 입찰에 있어 시행령 제42조제5항에 따른 외주근로자 근로조건 이행계획에 다음의 사항을 포함하고, 계약체결시 계약서에 명시하여 계약상대자가 이행토록 하여야 한다.1. 제76조의3 각호에 따른 인건비 기준단가(이하 이장에서 \"기준 노임단가\"라 한다)에 낙찰률을 곱한 금액 이상의 임금을 지급할 것2. 퇴직금, 국민건강보험료 등 법정부담금을 지급할 것3. 포괄적 재하도급을 하지 아니할 것4. 「근로기준법」,「최저임금법」 및 「남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률」을 준수할 것[본조신설 2017.12.28.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의5","kind":"조문","type":"계약예규","family":"nca","label":"제76조의5","title":"기준 노임단가 변동에 따른 계약금액 조정","text":"제76조의5(기준 노임단가 변동에 따른 계약금액 조정) ① 계약담당공무원은 시행령 제64조제8항에 따라 기준노임단가의 변동에 따른 계약금액 조정을 하는 경우에는 품목조정률에 의한다.② 제1항에 따른 품목조정률은 다음 각호의 품목 또는 비목에 한하여 다음과 같이 산정한다.1. 노무비(기본급)의 등락률: 2. 제수당, 상여금, 퇴직급여충당금, 보험료, 일반관리비, 이윤 등 노무비에 연동되는 항목의 등락률: 노무비(기본급)의 등락률과 동일③ 계약담당공무원은 총액증액조정요건과 기준 노임단가 변동에 따른 증액조정요건이 동시에 충족되는 경우에는 계약상대자가 신청한 조정방식을 우선 적용하여야 한다.④ 계약담당공무원은 제1항에 따른 계약금액을 조정한 후에 시행령 제64조제1항 및 시행규칙 제74조에 따라 계약금액을 조정하는 경우에는 제70조의3 제2항을 준용하여 계약금액을 조정한다. 이 경우 \"특정규격자재\"는 \"노무비\"로 본다.⑤ 계약담당공무원은 증액된 노무비가 근로자의 임금으로 지급되도록 하여야 한다.⑥ 기준 노임단가 변동에 따른 계약금액을 조정함에 있어 이 장에서 정하지 않은 사항은 시행규칙 제74조를 준용한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의6","kind":"조문","type":"계약예규","family":"nca","label":"제76조의6","title":"최저임금 인상에 따른 계약금액 조정","text":"제76조의6(최저임금 인상에 따른 계약금액 조정) ① 시행령 제66조제2항의 \"재정경제부장관이 정하는 요건\"이란 기준 노임단가에 해당 계약의 낙찰률을 곱한 금액(이하 \"내역서상 노임단가\"라 한다)이 최저임금에 미치지 못하는 경우를 말한다.② 시행령 제66조제2항에 따른 계약금액 조정은 최저임금을 하회하는 내역서상 노임단가에 대하여 최저임금을 적용하는 방식으로 한다.\n제16장의3 디지털서비스 계약의 집행","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의7","kind":"조문","type":"계약예규","family":"nca","label":"제76조의7","title":"디지털서비스 계약의 집행","text":"제76조의7(디지털서비스 계약의 집행)「클라우드컴퓨팅 발전 및 이용자 보호에 관한 법률 시행령」제3조 각호의 서비스(이하 이 장에서 \"디지털서비스\"라 한다) 계약의 집행에 관하여는 이 장에서 정한 바에 따라야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의8","kind":"조문","type":"계약예규","family":"nca","label":"제76조의8","title":"디지털서비스의 계약방법","text":"제76조의8(디지털서비스의 계약방법) 계약담당공무원은 신속한 디지털서비스의 구매를 위해 다음 각호의 방법으로 계약을 체결할 수 있다. 1. 시행령 제26조제1항제5호아목에 따른 수의계약2. 조달사업에 관한 법률 시행령 제16조에 따른 카탈로그 계약","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의9","kind":"조문","type":"계약예규","family":"nca","label":"제76조의9","title":"공동계약","text":"제76조의9(공동계약) 계약담당공무원은 수 개의 전문분야가 요구되는 복합사업에 해당한다고 판단되는 계약에 대하여는 공동계약을 허용하여야 한다. 다만, 공동계약으로 발주할 경우 품질 저하, 사업일정 지연 등 불가피한 사유가 있는 경우에는 그러하지 아니하다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의10","kind":"조문","type":"계약예규","family":"nca","label":"제76조의10","title":"장기계속계약","text":"제76조의10(장기계속계약) 계약담당공무원은 수년간 존속할 필요가 있는 디지털서비스 계약에 대하여 장기계속계약을 체결할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:76의11","kind":"조문","type":"계약예규","family":"nca","label":"제76조의11","title":"서비스 이용대가","text":"제76조의11(서비스 이용대가)계약담당공무원은 서비스의 이용량에 대하여 대가를 지급하고자 하는 경우 단가계약을 체결할 수 있다. 장기계속계약으로 집행하는 디지털서비스 계약에 대하여도 이와 같다.\n제17장 계약정보의 공개 등","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:77","kind":"조문","type":"계약예규","family":"nca","label":"제77조","title":"구매규격 사전공개","text":"제77조(구매규격 사전공개) ① 계약담당공무원은 물품 및 용역을 경쟁입찰에 부치고자 할 때에는 다음에 정하는 구매규격을 사전에 공개하여야 한다. 다만, 해당연도에 1회 이상 규격을 사전에 공개한 물품 및 용역에 대하여는 사전공개절차를 생략할 수 있다. 1. 물품제조·구매계약: 규격서, 사양서, 시방서 등 계약목적물의 성능, 제원, 재질 등을 기재한 서류, 협상에 의한 계약으로 집행할 경우 실적평가 여부와 그 기준2. 용역계약: 과업지시서, 제안요청서 등 계약상대자가 이행하여야 할 구체적인 과업의 내용을 기재한 서류 및 협상에 의한 계약으로 집행할 경우 실적평가 여부와 그 기준② 구매규격 사전공개는 5일간으로 하고, 전자조달시스템을 통해 공개한다. 다만, 긴급한 경우에는 3일간 공개할 수 있다.③ 계약담당공무원은 제1항에 따라 구매규격을 사전공개하려는 경우 이의제기 절차, 소명서류 등 이의제기의 방법을 명시하여야 하며, 사전공개와 관련한 의견이 제기될 경우 이를 수요목적 범위내에서 적극 수렴되도록 검토하여야 한다. ④ 계약담당공무원은 구매규격 관련 이의사항의 조정이 필요한 경우 계약심의회에 자문을 요청할 수 있다.[본조 신설 2016.1.1.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:77의2","kind":"조문","type":"계약예규","family":"nca","label":"제77조의2","title":"계약실적의 보고","text":"제77조의2(계약실적의 보고) 계약담당공무원은 시행령 제93조 및 특례규정 제25조에 의하여 계약실적보고서를 작성·제출하는 경우에는 이 장에 정한 바에 따라야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:77의3","kind":"조문","type":"계약예규","family":"nca","label":"제77조의3","title":"계약실적 등의 관리","text":"제77조의3(계약실적 등의 관리) ① 각 중앙관서의 장 또는 계약담당공무원은 계약이행이 완료된  후 30일 이내에 시행규칙 제82조의 계약정보 등 계약내용과 관련된 주요사항을 전자조달시스템 또는「전자조달의 이용 및 촉진에 관한 법률」제14조에 따른 자체 전자조달시스템(이하 이 조에서 \"전자조달시스템 등\"이라 한다) 에 등록하여야 한다.② 각 중앙관서의 장 또는 계약담당공무원은 계약상대자가 제1항에 따른 전자조달시스템등을 통하여 이행이 완료된 계약의 금액, 규모, 계약기간 및 계약내용 등(이하 ‘계약실적’이라 한다)을 증명하는 서류의 발급을 요청하는 경우 동 전자조달시스템 등을 통하여 계약실적에 대한 증명서를 발급하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:77의4","kind":"조문","type":"계약예규","family":"nca","label":"제77조의4","title":"협상에 의한 계약의 실적평가에 대한 검토","text":"제77조의4(협상에 의한 계약의 실적평가에 대한 검토) ① 계약담당공무원은 협상에 의한 계약에 대해 실적평가 제외 의견을 제기하려는 자에 대하여 다음 각 호의 사항을 명백히 한 서류를 제출하도록 하여야 한다. [신설 2020.9.24.]1. 실적평가 제외대상에 해당하는 부분 및 근거조항(계약예규「협상에 의한 계약체결기준」[별표] 주2) 나)의 2.또는 3.에 따른 적용법령(이하 이 조에서 \"제외기준\"이라 한다)을 명시)2. 소관부처의 승인·지정서류 등 입찰에 참여하려는 제품의 제외기준 해당여부를 입증하는 서류3. 기타 계약담당공무원이 실적평가 제외 여부를 판단하기 위해 필요하다고 인정하는 서류② 계약담당공무원은 제1항에 따른 의견이 제기된 경우로서 해당 계약중 제외기준에 해당하는 부분에 대하여는 실적평가를 배제하여야 한다(지정 또는 승인시로부터 3년을 초과하지 않는 경우에 한한다). 다만, 국민안전·보건·국가안보 등을 위해 실적평가가 불가피하다고 판단되는 경우는 그러하지 아니하다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:77의5","kind":"조문","type":"계약예규","family":"nca","label":"제77조의5","title":"입찰안내서의 사전공개","text":"제77조의5(입찰안내서의 사전공개) ① 계약담당공무원은 중앙건설기술위원회 또는 기술자문위원회의 심의를 받기 전에 입찰안내서를  사전에 공개하여야 한다.② 입찰안내서 사전공개는 5일 이상으로 하고, 전자조달시스템을 통해 공개한다. 다만, 긴급한 경우에는 3일 이상 공개할 수 있다.③ 계약담당공무원은 제1항에 따라 입찰안내서를 사전공개하려는 경우 의견제출 방법을 명시하여야 하며, 의견수렴 결과 입찰안내서가 제2조의6제16호에 해당된다고 인정되는 경우 입찰안내서를 수정하여야 한다.④ 계약담당공무원은 입찰안내서를 작성하기 전에 공개설명회를 개최하여 입찰안내서 작성 방향 등에 대한 의견을 입찰참가희망자로부터 들을 수 있다.[본조 신설 2024.4.30.]\n제1절 시행령 제93조에 의한 계약실적보고","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:78","kind":"조문","type":"계약예규","family":"nca","label":"제78조","title":"계약실적보고서 작성·제출","text":"제78조(계약실적보고서 작성·제출) 계약담당공무원은 시행령 제93조에 의하여 다음 각호의 사항이 포함된 계약실적보고서를 계약체결 또는 계약변경 후 30일 이내에 별첨 1 및 2서식에 따라 작성하여 재정경제부장관에게 제출하여야 한다. 다만, 시행령 제92조의2에 의하여 지정정보처리장치등에 계약관련 정보를 공개한 경우에는 계약실적보고서를 재정경제부장관에게 제출한 것으로 본다. 1. 계약체결에 관한 사항가. 계약의 목적나. 입찰일 및 계약체결일다. 추정가격 또는 예정가격라. 계약체결방법(일반경쟁·제한경쟁·지명경쟁·수의계약, 지역제한여부, 시행령 제72조제3항의 적용여부)마. 계약상대자의 성명(법인인 경우에는 법인명)바. 계약 물량 또는 규모사. 계약금액(장기계속공사의 경우 총공사금액. 이하 같다)아. 지명경쟁 또는 수의계약의 경우에는 그 사유2. 계약변경에 관한 사항가. 계약의 목적나. 계약변경 전의 계약내용(계약 물량 또는  규모, 계약금액)다. 계약의 변경내용라. 계약변경의 사유","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:79","kind":"조문","type":"계약예규","family":"nca","label":"제79조","title":"조달청 위탁계약의 계약실적보고 작성","text":"제79조(조달청 위탁계약의 계약실적보고 작성) 조달청장에게 위탁하여 대행계약을 체결하게 한 경우에도 그 위탁관서의 계약담당공무원은 제78조에 의한 계약실적보고서를 작성하여 제출하여야 한다. 이 경우에는 계약실적보고서에 조달청에 위탁하여 체결한 계약임을 표시하여야 한다.\n제2절 특례규정 제25조에 의한 계약실적보고","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:80","kind":"조문","type":"계약예규","family":"nca","label":"제80조","title":"계약담당공무원의 계약실적보고서 작성","text":"제80조(계약담당공무원의 계약실적보고서 작성) 계약담당공무원은 특례규정 제25조 및 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행특례규칙」(이하 \"특례규칙\"이라 한다) 제8조제1항에 의한 계약실적보고서를 다음 각호의 기준에 따라 회계연도별로 작성하여 이를 해당연도 종료후 30일이내에 소속중앙관서의 장에게 제출하여야 한다.1. 계약실적보고서는 별첨 3 내지 6서식에 의하여 회계별(또는 기금별)로 구분하여 작성하여야 한다.2. 공사를 조달청장에게 위탁하여 대행계약을 체결하게 한 경우에 그 위탁관서는 제1호의 계약실적보고서에 이를 합산하여 작성하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:81","kind":"조문","type":"계약예규","family":"nca","label":"제81조","title":"각 중앙관서의 장의 계약실적보고","text":"제81조(각 중앙관서의 장의 계약실적보고) 각 중앙관서의 장은 특례규칙 제8조제1항에 의한 계약실적보고서를 다음 각호의 기준에 따라 작성하여 이를 해당연도 종료후 60일이내에 재정경제부장관에게 제출하여야 한다. 1. 각 중앙관서의 장은 해당관서 소관의 회계별 계약실적보고서를 집계하여 별표 각호 서식의 계약실적보고서를 작성하여야 한다.2. 지방자치단체에 위임하여 계약을 집행하게 한 경우에는 지방자치단체로부터 제1항에 의하여 계약실적보고서를 제출받아 제1호의 계약실적보고서에 합산하여야 한다.3. 공기업·준정부기관 등에 대한 계약실적보고서는 그 주무부장관이 제1호에 준하여 작성하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:82","kind":"조문","type":"계약예규","family":"nca","label":"제82조","title":"조달청장의 계약실적보고","text":"제82조(조달청장의 계약실적보고) 조달청장은 정부수요물자와 비축물자의 구매계약, 용역 및 공사대행계약을 체결한 때에는 다음 각호의 기준에 의하여 별표 각호 서식에 계약실적보고서를 소관별·회계별(또는 기금별)로 작성하여 제81조에 의하여 재정경제부장관에게 제출하여야 한다. 1. 비축물자와 정부수요물자중 저장품의 구매실적은 이를 별지로 작성하여 계약실적보고서에 첨부하여야 한다.2. 국가기관외의 기관(지방자치단체, 공기업·준정부기관 등)으로부터 의뢰를 받아 공사·물품 및 용역의 조달계약을 체결한 경우에는 이를 구분하여 별지로 작성한 후 계약실적보고서에 첨부하여야 한다.\n제3절 보 칙","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:83","kind":"조문","type":"계약예규","family":"nca","label":"제83조","title":"실적보고대상계약","text":"제83조(실적보고대상계약) 각 중앙관서의 장 또는 계약담당공무원은 제78조 및 제80조에 의하여 계약실적보고서를 작성함에 있어서 시행령 제49조에 의한 계약서 작성을 생략하는 경우를 제외하고는 모든 실적을 계상하여야 한다.\n제18장 대형공사 및 기술제안입찰의 설계비 등 보상","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:84","kind":"조문","type":"계약예규","family":"nca","label":"제84조","title":"대형공사 및 기술제안입찰의 설계비 등 보상","text":"제84조(대형공사 및 기술제안입찰의 설계비 등 보상) 계약담당공무원은 시행령 제89조에 의한 대형공사의 설계비 및 시행령 제107조에 의한 기술제안입찰의 제안서 작성비용(이하 \"설계비 등\"이라 한다) 보상 시 이 장에 정한 보상기준 및 절차 등에 따라 집행하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:85","kind":"조문","type":"계약예규","family":"nca","label":"제85조","title":"설계비 등 보상대상","text":"제85조(설계비 등 보상대상) 시행령 제89조 및 제107조에 따라 설계비 등을 보상받을 수 있는 자는 다음 각호에 해당하는 자로 한다. 1. 시행령 제86조제2항, 제87조, 제104조 및 제106조제1항에 따라 선정된 자중 낙찰자로 결정되지 아니한 자(이하 \"낙찰탈락자\"라 한다)2. 발주기관의 귀책사유로 취소된 대안입찰, 일괄입찰 및 기술제안입찰에 참여한 자(계약예규「정부 입찰·계약 집행기준」제10조의9에  따른 예비계약을 체결한 자는 제외한다)","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:86","kind":"조문","type":"계약예규","family":"nca","label":"제86조","title":"설계비 등 보상예산","text":"제86조(설계비 등 보상예산) 계약담당공무원은 제85조 각호에 규정한 자에게 설계비 등을 보상하기 위하여 다음 각 호에 따라 설계비 등의 보상예산을 확보하여야 한다. 1. 시행령 제89조에 따른 대형공사의 설계비 보상예산: 해당 공사예산의 20/10002. 시행령 제107조에 따른 기술제안입찰의 제안서 작성비용 보상예산: 해당 공사예산의 10/1000","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:87","kind":"조문","type":"계약예규","family":"nca","label":"제87조","title":"대안입찰의 설계비 보상기준","text":"제87조(대안입찰의 설계비 보상기준) ① 계약담당공무원은 낙찰탈락자에 대해 해당 공사의 설계보상비로 책정된 해당 공사예산의 20/1000에 해당하는 금액을 다음 각호와 같이 지급하여야 한다.1. 낙찰탈락자가 5명인 경우 : 공사예산의 20/1000에 해당하는 금액을 설계점수가 높은 자 순으로 20분의 7, 20분의 5, 20분의 4, 20분의 2, 20분의 2를 지급2. 낙찰탈락자가 4명인 경우 : 공사예산의 20/1000에 해당하는 금액을 설계점수가 높은 자 순으로 20분의 7, 20분의 5, 20분의 4, 20분의 2를 지급3. 낙찰탈락자가 3명인 경우 : 공사예산의 20/1000에 해당하는 금액을 설계점수가 높은 자 순으로 20분의 7, 20분의 5, 20분의 4를 지급4. 낙찰탈락자가 2명인 경우 : 공사예산의 20/1000에 해당하는 금액을 설계점수가 높은 자 순으로 20분의 7, 20분의 5를 지급5. 낙찰탈락자가 1명인 경우 : 공사예산의 20/1000에 해당하는 금액의 1/4를 지급② 계약담당공무원은 제85조제2호에 해당하는 자에 대해 해당 공사의 설계보상비로 책정된 해당 공사예산의 20/1000에 해당하는 금액을 다음 각호와 같이 지급하여야 한다. 1. 시행령 제86조제2항에 따라 선정된 자가 6인인 경우 : 공사예산의 20/1000에 해당하는 금액을 설계점수가 높은 자 순으로 20분의 7, 20분의 5, 20분의 4, 20분의 2, 20분의 1, 20분의 1을 지급2. 시행령 제86조제2항에 따라 선정된 자가 5인 이하인 경우 : 제87조제1항을 준용하여 지급③ 계약담당공무원은 제2항에도 불구하고 시행령 제86조제2항에 따라 낙찰자가 선정되기 전에 발주기관의 귀책사유로 입찰이 취소된 경우에는 모든 입찰참여자에 대해 해당 공사의 설계보상비로 책정된 해당 공사예산의 20/1000에 해당하는 금액을 균분하여 지급한다. 다만, 입찰참여 1인당 동 금액의 1/4를 초과하여 지급하지 못한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:87의2","kind":"조문","type":"계약예규","family":"nca","label":"제87조의2","title":"일괄입찰의 설계비 보상기준","text":"제87조의2(일괄입찰의 설계비 보상기준) ① 계약담당공무원은 낙찰탈락자 중 설계점수가 입찰공고에 명시한 일정점수를 초과하는 자(이하 이 조에서 보상대상자라 한다)에 대하여 시행령 제87조제2항에 따라 낙찰자를 결정한 때 다음의 계산식에 따라 설계보상비를 지급한다. ② 제1항에도 불구하고 낙찰탈락자 중 시행령 제87조제1항에 따라 실시설계적격자로 결정되지 않은 자에 대하여는 실시설계적격자를 결정한 때 제1호에 따른 설계보상비를 지급하며, 시행령 제87조제2항에 따라 낙찰자를 결정한 때 제2호와 제1호의 차액을 추가로 지급한다. 다만, 시행령 제87조제1항에 따라 실시설계적격자로 결정된 자가 시행령 제87조제2항에 따라 낙찰자로 결정되지 아니한 때는 제2호와 제1호의 차액을 추가로 지급하지 아니한다. 1. 2. ③ 계약담당공무원은 제85조제2호에 해당하는 자중 보상대상자에 해당하는 자에 대하여 제1항의 계산식에 따라 설계보상비를 지급한다.  ④ 계약담당공무원은 제1항 내지 제3항에도 불구하고, 보상대상자 1인에게 공사예산에서 다음 각호의 요율을 곱한 금액을 초과하여 설계보상비를 지급하여서는 아니된다.   1. 토목의 경우 실시설계적격자 결정일의「엔지니어링사업대가의 기준」의 기본설계 요율2. 건축의 경우 실시설계적격자 결정일의「공공발주사업에 대한 건축사의 업무범위와 대가 기준」의 건축설계 대가요율 각 종별 중급의 40/100⑤ 계약담당공무원은 제3항에도 불구하고 시행령 제87조에 따라 선정되기 전에 발주기관의 귀책사유로 입찰이 취소된 경우에 제87조제3항에 따라 지급한다.  ⑥ 계약담당공무원은 제1항 내지 제5항에도 불구하고 보상대상자 중 가장 높은 설계점수를 받은 자에게 지급하는 것으로 산정된 설계보상비가 실시설계적격자 또는 낙찰자의 기본설계비(계약담당공무원이「건설엔지니어링 대가 등에 관한 기준」, 「공공발주사업에 대한 건축사의 업무범위와 대가 기준」등에 따라 산정한 기본설계비를 말한다.) 보다 큰 경우, 실시설계 적격자 또는 낙찰자의 기본설계비를 한도로 설계보상비를 지급하며, 보상대상자가 2인 이상인 경우에는 다음 계산식에 따라 보상비를 지급한다. ⑦ 계약담당공무원은 실시설계적격자에게도 낙찰탈락자 설계보상비에 준하는 금액을 지급할 수 있으며, 이 경우 계약 체결시 기본설계비에서 정산한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:87의3","kind":"조문","type":"계약예규","family":"nca","label":"제87조의3","title":"기술제안입찰의 제안서 작성비용 보상기준","text":"제87조의3(기술제안입찰의 제안서 작성비용 보상기준) ① 계약담당공무원은 낙찰탈락자 중 제안서점수가 입찰공고에 명시한 일정점수를 초과하는 자(이하 이 조에서 보상대상자라 한다)에 대하여 다음 계산식에 따라 제안서 보상비를 지급한다. 이 경우 기본설계 기술제안입찰의 낙찰탈락자에 대하여는 시행령 제106조제2항에 따라 낙찰자를 결정한 때 제안서 보상비를 지급한다. ② 제1항에도 불구하고 기본설계 기술제안입찰에 있어 낙찰탈락자 중 시행령 제106조제1항에 따라 실시설계적격자로 결정되지 않은 자에 대하여는 실시설계적격자를 결정한 때 제1호에 따른 제안서 보상비를 지급하며, 시행령 제106조제2항에 따라 낙찰자를 결정한 때 제2호와 제1호의 차액을 추가로 지급한다. 다만, 시행령 제106조제1항에 따라 실시설계적격자로 결정된 자가 시행령 제106조제2항에 따라 낙찰자로 결정되지 아니한 때는 제2호와 제1호의 차액을 추가로 지급하지 아니한다. 1. 2. ③ 계약담당공무원은 제85조제2호에 해당하는 자 중 보상대상자에 해당하는 자에 대하여 제1항의 산식에 따라 제안서 보상비를 지급한다.  ④ 계약담당공무원은 제1항 내지 제3항에도 불구하고, 보상대상자 1인에게 공사예산에서 다음 각호의 요율을 곱한 금액을 초과하여 제안서 보상비를 지급하여서는 아니된다.   1. 토목의 경우 실시설계적격자 결정일의「엔지니어링사업대가의 기준」의 기본설계 요율의 2분의 12. 건축의 경우 실시설계적격자 결정일의「공공발주사업에 대한 건축사의 업무범위와 대가 기준」의 건축설계 대가요율 각 종별 중급의 20/100⑤ 계약담당공무원은 제3항에도 불구하고 시행령 제104조 또는 제106조제1항에 따라 선정되기 전에 발주기관의 귀책사유로 입찰이 취소된 경우에 제87조제3항을 준용하여 지급한다.  [본조신설 2015.1.1.]⑥ 계약담당공무원은 기본설계 기술제안입찰에 있어 실시설계적격자에게도 낙찰탈락자 설계보상비에 준하는 금액을 지급할 수 있으며, 이 경우 계약 체결시 기본설계비에서 정산한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:88","kind":"조문","type":"계약예규","family":"nca","label":"제88조","title":"공동입찰시의 설계비 등 보상","text":"제88조(공동입찰시의 설계비 등 보상) 계약담당공무원은 2인이상이 공동으로 입찰하여 낙찰탈락자가 된 경우에는 제87조 내지 제87조의3에 의해 산출된 금액을 공동입찰의 대표자에게 지급하여야 하며, 대표자는 대금을 받은 날로부터 14일 이내에 설계분야 참가자들에게 설계비용을 지급하고 지급 증빙서류를 제출하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:89","kind":"조문","type":"계약예규","family":"nca","label":"제89조","title":"보상통지","text":"제89조(보상통지) ① 계약담당공무원은 낙찰탈락자가 확정되면 즉시 낙찰탈락자에게 설계비 등 보상과 관련된 내용을 통지하여야 한다. ② 제1항의 통지에는 특별한 사유가 없는 한 통지일로부터 30일 이내에 낙찰탈락자의 설계비 등의 보상요청이 없으면 설계비 등 보상금에 대한 권리를 포기한 것으로 간주한다는 내용이 포함되어야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:90","kind":"조문","type":"계약예규","family":"nca","label":"제90조","title":"입찰공고시 공고사항","text":"제90조(입찰공고시 공고사항) 계약담당공무원은 시행령 제79조 및 제98조에 규정한 대안입찰, 일괄입찰 또는 기술제안입찰 공사의 입찰공고를 하는 경우에 입찰공고에 제87조 내지 제89조의 내용을 포함시켜야 한다.\n제19장 국민건강보험료 및 국민연금보험료 사후정산 등","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:91","kind":"조문","type":"계약예규","family":"nca","label":"제91조","title":"국민건강보험료, 노인장기요양보험료, 국민연금보험료, 퇴직급여충당금 및 퇴직공제부금 사후정산 등","text":"제91조(국민건강보험료, 노인장기요양보험료, 국민연금보험료, 퇴직급여충당금 및 퇴직공제부금 사후정산 등) 계약담당공무원은 공사·용역 및 물품제조계약에 있어 국민건강보험료, 노인장기요양보험료, 국민연금보험료, 퇴직급여충당금 및「건설근로자의 고용개선 등에 관한 법률」제10조에 따른 퇴직공제부금(이하 국민건강보험료 등 이라 한다)의 계상, 입찰 및 대가지급과 관련하여서는 이 장에 정한 바에 따라야한다(단, 퇴직급여충당금의 경우 시행규칙 제23조의3 각호에 해당하는 용역계약에 한하여 적용하며 퇴직공제부금은 「건설근로자의 고용개선 등에 관한 법률」제10조에서 규정한 건설공사에 한하여 적용한다).","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:92","kind":"조문","type":"계약예규","family":"nca","label":"제92조","title":"국민건강보험료 등의 계상","text":"제92조(국민건강보험료 등의 계상) 계약담당공무원은 예정가격 작성시 국민건강보험료 등을 관련법령에서 정하는 기준에 따라 각각 계상한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:93","kind":"조문","type":"계약예규","family":"nca","label":"제93조","title":"입찰공고시 안내 등","text":"제93조(입찰공고시 안내 등) 계약담당공무원은 국민건강보험료 등의 사후정산과 관련하여 다음 각 호의 사항을 입찰공고 등에 명시하여 입찰에 참가하고자 하는 자가 미리 열람할 수 있도록 하여야 한다.1. 국민건강보험료 등은 시행령 제73조에 따라 사후정산을 하게 된다는 사항2. 예정가격 작성시 계상된 국민건강보험료 등3. 입찰참가자가 입찰금액 산정시(내역입찰의 경우 산출내역서 포함) 국민건강보험료 등은 제2호에 따른 금액을 조정 없이 반영하여야 한다는 사항. 다만, 시행규칙 제23조의3 각호에 해당하는 용역계약의 경우에는 예정가격상의 보험료에 낙찰률을 곱한 금액을 반영하게 할 수 있다. 4. 기성대가 및 준공대가 지급시 이 장에 정한 바에 따라 정산을 하게 된다는 사항","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:94","kind":"조문","type":"계약예규","family":"nca","label":"제94조","title":"대가지급시 정산절차 등","text":"제94조(대가지급시 정산절차 등) ① 계약담당공무원은 계약상대자의 기성부분에 대한 대가지급 청구시 국민건강보험료 등의 청구와 관련하여 다음 각 호의 서류를 첨부하게 하여야 한다. 1. 국민건강보험료 등의 납입확인서(하수급인의 보험료 납입확인서를 포함한다)2. 전회분 기성대가에 포함하여 지급된 국민건강보험료 등의 지급액 중 해당부분을 하수급인에게 지급하였음을 증빙하는 서류② 계약담당공무원은 계약대가의 지급청구를 받은 때에는 하도급계약을 포함하여 해당 계약 전체에 대한 보험료 납부여부를 최종 확인하여야 하며, 이를 확인 후 제93조제2호에 따라 입찰공고 등에 고지된 국민건강보험료 등의 범위 내에서 최종 정산하여야 한다. 다만, 최종보험료 납입확인서가 준공대가 신청 이후에 발급이 가능한 경우에는 해당보험료를 준공대가와 별도로 정산해야 한다. ③ 계약담당공무원은 제1항 내지 제2항 절차에 따라 사업자 부담분의 국민건강보험료 등에 대한 납입확인서의 금액을 정산하되, 다음 각호와 같이 정산한다. 1. 일용근로자는 해당 사업장단위로 기재된 납입확인서의 납입금액으로 정산한다.2. 생산직 상용근로자(직접노무비 대상에 한함)는 소속회사에서 납부한 납입확인서에 의하여 정산하되 현장인 명부 등을 확인하여 해당 사업장 계약이행기간 대비 해당 사업장에 실제로 투입된 일자를 계산(현장명부 등 발주기관이나 감리가 확인한 서류에 의함)하여 보험료를 일할 정산한다. 다만, 해당 사업장단위로 보험료를 별도 분리하여 납부한 경우에는  제1호를 준용한다. 3. 퇴직급여충당금은 계약체결 후 발주기관이 승인한 산출내역서 금액과 계약상대자가 실제 지급한 금액을 비교하여 정산한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:95","kind":"조문","type":"계약예규","family":"nca","label":"제95조","title":"선금의 사용","text":"제95조(선금의 사용) 계약담당공무원은 선금을 지급하는 경우에 국민건강보험료 등의 납부를 위하여 선금을 우선 사용할 수 있도록 할 수 있다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:96","kind":"조문","type":"계약예규","family":"nca","label":"제96조","title":"장기계속계약의 관리·운용","text":"제96조(장기계속계약의 관리·운용) ① 계약담당공무원은 시행령 제69조에 따라 장기계속계약을 체결하는 경우에는 해당 연도 예산 범위 내에서 체결하여야 한다.② 계약담당공무원은 발주기관의 동의없이 계약내용과 다르게 선시공이 이루어지지 않도록 관리하여야 한다.③ 계약담당공무원은 차년도 계약을 체결함에 있어 계약상대자의 해당 연도 공사의 완성도 및 이행능력 등을 검토하여야 한다.[본조신설 2010.10.22.]\n제20장 입찰 관련 서류의 진위 여부 검증","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:97","kind":"조문","type":"계약예규","family":"nca","label":"제97조","title":"입찰 관련 서류에 대한 확인","text":"제97조(입찰 관련 서류에 대한 확인) ① 계약담당공무원은 시설공사에 있어 낙찰자를 결정하기 전 낙찰예정자가 제출한 입찰에 관한 서류가 위·변조되었거나 허위 제출 또는 부정하게 작성되었는지 여부를 확인하여야 한다.② 계약담당공무원은 제1항에도 불구하고 여러 건의 입찰이 동시에 진행되거나 1건의 입찰에서 확인 분량이 과다하여 낙찰이 지연될 우려가 있는 경우에 확인대상 서류를 선택하여 선별적으로 확인을 할 수 있다.③ 제1항 및 제2항에 따라 계약담당공무원이 관련 기관에 입찰서류의 위ㆍ변조 등에 대한 확인을 요청하였으나 요청기한 내 회신이 없는 경우에는 낙찰예정자를 낙찰자로 결정하며, 낙찰자 결정 이후 위ㆍ변조 등이 확인된 경우에는 제98조에 따라 처리한다.[본조신설 2012.4.2.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:98","kind":"조문","type":"계약예규","family":"nca","label":"제98조","title":"부정한 방법으로 심사서류를 제출한 자에 대한 처리","text":"제98조(부정한 방법으로 심사서류를 제출한 자에 대한 처리) 계약담당공무원은 입찰에 관한 서류가 부정 또는 허위로 작성된 것으로 판명된 때에는 다음 각 호와 같이 처리하여야 한다.1. 계약체결 이전인 경우에는 낙찰자 결정대상에서 제외하거나 결정통보를 취소한다.2. 계약체결 이후인 경우에는 해당 계약을 해제 또는 해지할 수 있다.[본조신설 2012.4.2.]\n제21장 청렴ㆍ공정계약의 집행","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:98의2","kind":"조문","type":"계약예규","family":"nca","label":"제98조의2","title":"청렴·공정계약의 집행","text":"제98조의2(청렴·공정계약의 집행) ① 계약담당공무원은 입찰자가 입찰서를 제출할 때 시행령 제4조의2에 따른 청렴계약서를 제출하도록 하여야 한다.② 계약담당공무원은 계약을 체결할 때 계약상대자가 제출한 청렴계약서의 내용과 발주기관이 작성한 공정계약 서약서의 내용이 계약서에 포함되도록 하여야 한다.","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:98의3","kind":"조문","type":"계약예규","family":"nca","label":"제98조의3","title":"청렴계약서의 내용","text":"제98조의3(청렴계약서의 내용) ① 계약담당공무원은 청렴계약서에 다음의 사항이 포함되도록 하여야 한다.1. 입찰자 또는 계약상대자가 준수하여야 할 시행령 제4조의2 제1항 각호의 사항2. 시행령 제4조의2 제1항 각호의 위반시 해당 입찰·낙찰을 취소하거나 계약을 해제·해지할 수 있다는 내용② 계약담당공무원은 계약목적물의 특성, 공급자의 수 등을 고려할 때 담합행위의 개연성이 있다고 판단될 경우 청렴계약서에 시행령 제4조의2제1항제2호 위반시에 입찰자 또는 계약상대자가 배상하여야 할 손해배상액의 예정을 포함할 수 있다.③ 계약담당공무원은 제2항에 따른 손해배상액의 예정에 있어 해당 계약의 발주방식, 난이도 및 예상되는 입찰자의 수 등을 고려하여 적정한 손해배상액을 산정토록 하되 다음 각호의 금액을 초과하여서는 아니된다. 1. 입찰자: 입찰금액의 100분의52. 계약상대자: 계약금액의 100분의10[본조신설 2016.1.1.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:98의4","kind":"조문","type":"계약예규","family":"nca","label":"제98조의4","title":"공정계약 서약서의 내용","text":"제98조의4(공정계약 서약서의 내용) 공정계약 서약서에는  다음의 사항이 포함되어야 한다.1. 계약상대자 금품, 향응, 취업제공 등 요구행위의 금지2. 계약상대자에 대한 경영·인사 및 계약상대자와 제3자간 계약내용에 대한 개입행위의 금지3. 계약과 직접적인 관련이 없는 의무를 부과하거나 발주기관의 부담을 전가하는 행위의 금지4. 기타 국가계약법령 및 계약예규를 위반하여 계약상대자의 권리를 제한하거나 의무를 부과하는 행위의 금지[본조신설 2020.6.19.]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:98의5","kind":"조문","type":"계약예규","family":"nca","label":"제98조의5","title":"계약담당공무원의 책임","text":"제98조의5(계약담당공무원의 책임) 국가계약법령 및 계약예규를 위반하여 고의 또는 중과실로 불공정한 계약을 체결·집행한 계약담당공무원에게는 다음 각호에 따른 제재 또는 책임을 부과한다.1. 국가공무원법 제78조에 따른 징계2. 회계관계 직원 등의 책임에 관한 법률 제4조에 따른 변상책임[본조신설 2020.6.19.]\n제22장 분쟁해결방법의 합의","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:99","kind":"조문","type":"계약예규","family":"nca","label":"제99조","title":"입찰공고시 안내 등","text":"제99조(입찰공고시 안내 등) ① 계약담당공무원은 「국가를 당사자로 하는 계약에 관한 법률」(이하 이 장에서 \"법\"이라 한다)제28조의2에 따라 계약을 체결하는 때에 분쟁의 해결방법을 미리 정하고자 하는 경우에는 다음 각 호의 사항을 입찰공고 등에 명시하여 입찰에 참가하고자 하는 자가 미리 열람할 수 있도록 하여야 한다.1. 국가를 당사자로 하는 계약에서 발생하는 분쟁을 효율적으로 해결하기 위하여 계약을 체결하는 때에 계약당사자 간 분쟁의 해결방법을 정할 수 있다는 사항2. 제1호에 따른 분쟁의 해결방법은 다음 각 목의 어느 하나 중 계약당사자 간 합의로 정한다는 사항가. 법 제29조에 따른 국가계약분쟁조정위원회의 조정(법 제28조에서 정한 이의신청 대상에 해당하는 경우에 한정한다)나. 「중재법」에 따른 중재(「중재법」제40조의 상사중재기관을 통한 중재를 포함한다)3. 그 밖에 분쟁해결방법의 합의와 관련하여 필요한 사항② 계약체결시 합의한 바에 따라 제1항제2호가목의 조정을 청구하고자 하는 자는 법 제28조의 이의신청 절차를 거쳐야 한다.③ 시행령 제26조부터 제30조까지에 따라 체결하는 수의계약의 경우에도 제1항 및 제2항의 사항을 준용하여야 한다.[본조신설 2018.3.20.][종전 제99조는 제100조로 이동 ]\n제23장 보 칙","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jibhaeng:100","kind":"조문","type":"계약예규","family":"nca","label":"제100조","title":"재검토기한","text":"제100조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다. ]","lawId":"ye-jibhaeng","group":"정부입찰계약집행기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-yejeong","kind":"법령","type":"계약예규","family":"nca","label":"예정가격작성기준","name":"(계약예규) 예정가격 작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제9조제1항제2호 및 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」(이하 \"시행규칙\"이라 한다) 제6조에 의한 원가계산에 의한 예정가격 작성, 시행령 제9조제1항제3호 및 시행규칙 제5조제2항에 의한 표준시장단가에 의한 예정가격 작성 및 시행규칙 제5조에 의한 전문가격조사기관(이하 \"조사기관\"이라 한다.)의 등록 등에 있어 적용하여야 할 기준을 정함을 목적으로 한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"계약담당공무원의 주의사항","text":"제2조(계약담당공무원의 주의사항) ① 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)은 예정가격 작성등과 관련하여 이 예규에 정한 사항에 따라 업무를 처리한다.② 계약담당공무원은 이 예규에 따라 예정가격 작성시에 표준품셈에 정해진 물량, 관련 법령에 따른 기준가격 및 비용 등을 부당하게 감액하거나 과잉 계상되지 않도록 하여야 하며, 불가피한 사유로 가격을 조정한 경우에는 조정사유를 예정가격조서에 명시하여야 한다. ③ 계약담당공무원은「부가가치세법」에 따른 면세사업자와 수의계약을 체결하려는 경우에는 부가가치세를 제외하고 예정가격을 작성할 수 있으며, 이 경우 예정가격 조서에 그 사유를 명시하여야 한다.④ 계약담당공무원은 공사원가계산에 있어서 공종의 단가를 세부내역별로 분류하여 작성하기 어려운 경우 이외에는 총계방식(이하 \"1식단가\"라 한다)으로 특정공종의 예정가격을 작성하여서는 아니된다.\n제2장 원가계산에 의한 예정가격 작성\n제1절 총칙","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"원가계산의 구분","text":"제3조(원가계산의 구분) 원가계산은 제조원가계산과 공사원가계산 및 용역원가계산으로 구분하되, 용역원가계산에 관하여는 제4절 및 제5절에 의한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"원가계산의 비목","text":"제4조(원가계산의 비목) 원가는 재료비, 노무비, 경비, 일반관리비 및 이윤으로 구분하여 작성한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"비목별 가격결정의 원칙","text":"제5조(비목별 가격결정의 원칙) ① 재료비, 노무비, 경비는 각각 아래에서 정한 계산식에 따른다.ㅇ 재료비 = 재료량 × 단위당가격ㅇ 노무비 = 노무량 × 단위당가격ㅇ 경 비 = 소요(소비)량 × 단위당 가격② 재료비, 노무비, 경비의 각 세비목별 단위당가격은 시행규칙 제7조에 따라 계산한다.③ 계약담당공무원은 재료비, 노무비, 경비의 각 세비목 및 그 물량(재료량, 노무량, 소요량) 산출은 계약목적물에 대한 규격서, 설계서 등에 의하거나 제34조에 의한 원가계산자료를 근거로 하여 산정하여야 하며, 일정률로 계상하는 일반관리비, 간접노무비 등에 대해서는 사전 공고한 공사원가 제비율을 준수하여야 한다. ④ 계약담당공무원은 제3항의 각 세비목 및 그 물량산출은 계약목적물의 내용 및 특성 등을 고려하여 그 완성에 적합하다고 인정되는 합리적인 방법으로 작성하여야 한다.⑤ 공사계약의 원가계산에 있어 기 체결한 물품제조ㆍ구매계약(국가기관ㆍ지방자치단체ㆍ공공기관이 발주한 계약을 말한다. 이하 이조에서 같다.)의 내역을 재료비의 단위당 가격으로 활용하려는 경우에는 해당물품의 예정가격 또는 계약예규 「예정가격작성기준」제44조의3에 따른 기초가격을 재료비의 단위당 가격으로 적용하며, 물품제조ㆍ구매계약의 계약금액은 시행규칙 제7조에 따른 거래실례가격으로 보지 아니한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"원가계산에 의한 예정가격 작성시 주의사항","text":"제6조(원가계산에 의한 예정가격 작성시 주의사항) ① 계약담당공무원은 원가계산방법으로 예정가격을 작성할 때에는 계약수량, 이행의 전망, 이행기간, 수급상황, 계약조건 기타 제반여건을 고려하여야 한다.② 계약담당공무원은 표준품셈을 이용하여 원가계산을 하는 경우에는 가장 최근의 표준품셈을 이용하여야 한다. ③ 계약담당공무원은 원가계산의 단위당 가격을 산정함에 있어 소요물량ㆍ거래조건 등 제반사정을 고려하여 객관적으로 단가를 산정하여야 한다.\n제2절 제조원가계산","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"제조원가","text":"제7조(제조원가) 제조원가라 함은 제조과정에서 발생한 재료비, 노무비, 경비의 합계액을 말한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"작성방법","text":"제8조(작성방법) 계약담당공무원은 제조원가를 계산 하고자 할 때에는 별표1의 제조원가계산서를 작성하고 비목별 산출근거를 명시한 기초계산서를 첨부하여야 한다. 이 경우에 재료비, 노무비, 경비 중 일부를 별표1의 제조원가계산서상 일반관리비 또는 이윤 다음 비목으로 계상하여서는 아니된다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"재료비","text":"제9조(재료비) 재료비는 제조원가를 구성하는 다음 내용의 직접재료비, 간접재료비로 한다.① 직접재료비는 계약목적물의 실체를 형성하는 물품의 가치로서 다음 각호를 말한다. 1. 주요재료비계약목적물의 기본적 구성형태를 이루는 물품의 가치2. 부분품비계약목적물에 원형대로 부착되어 그 조성부분이 되는 매입부품ㆍ수입부품ㆍ외장재료 및 제11조제3항제13호 규정에 의한 경비로 계상되는 것을 제외한 외주품의 가치② 간접재료비는 계약목적물의 실체를 형성하지는 않으나 제조에 보조적으로 소비되는 물품의 가치로서 다음 각호를 말한다.1. 소모재료비기계오일, 접착제, 용접가스, 장갑, 연마재등 소모성 물품의 가치2. 소모공구ㆍ기구ㆍ비품비내용연수 1년미만으로서 구입단가가 「법인세법」 또는 「소득세법」 규정에 의한 상당금액이하인 감가상각대상에서 제외되는 소모성 공구ㆍ기구ㆍ비품의 가치3. 포장재료비제품포장에 소요되는 재료의 가치③ 재료의 구입과정에서 해당재료에 직접 관련되어 발생하는 운임, 보험료, 보관비 등의 부대비용은 재료비에 계상한다. 다만, 재료구입 후 발생되는 부대비용은 경비의 각 비목으로 계상한다.④ 계약목적물의 제조 중에 발생되는 작업설, 부산품, 연산품 등은 그 매각액 또는 이용가치를 추산하여 재료비에서 공제하여야 한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"노무비","text":"제10조(노무비) 노무비는 제조원가를 구성하는 다음 내용의 직접노무비, 간접노무비를 말한다.① 직접노무비는 제조현장에서 계약목적물을 완성하기 위하여 직접작업에 종사하는 종업원 및 노무자에 의하여 제공되는 노동력의 대가로서 다음 각호의 합계액으로 한다. 다만, 상여금은 기본급의 년 400%, 제수당, 퇴직급여충당금은 「근로기준법」상 인정되는 범위를 초과하여 계상할 수 없다.1. 기본급(「통계법」 제15조의 규정에 의한 지정기관이 조사ㆍ공표한 단위당가격 또는 재정경제부장관이 결정ㆍ고시하는 단위당가격으로서 동단가에는 기본급의 성격을 갖는 정근수당ㆍ가족수당ㆍ위험수당 등이 포함된다)2. 제수당(기본급의 성격을 가지지 않는 시간외 수당ㆍ야간수당ㆍ휴일수당ㆍ주휴수당 등 작업상 통상적으로 지급되는 금액을 말한다) 3. 상여금4. 퇴직급여충당금② 간접노무비는 직접 제조작업에 종사하지는 않으나, 작업현장에서 보조작업에 종사하는 노무자, 종업원과 현장감독자 등의 기본급과 제수당, 상여금, 퇴직급여충당금의 합계액으로 한다. 이 경우에는 제1항 각호 및 단서를 준용한다.③ 제1항의 직접노무비는 제조공정별로 작업인원, 작업시간, 제조수량을 기준으로 계약목적물의 제조에 소요되는 노무량을 산정하고 노무비 단가를 곱하여 계산한다.④ 제2항의 간접노무비는 제34조에 의한 원가계산자료를 활용하여 직접노무비에 대하여 간접노무비율(간접노무비/직접노무비)을 곱하여 계산한다.⑤ 제4항의 간접노무비는 제3항의 직접노무비를 초과하여 계상할 수 없다. 다만, 작업현장의 기계화, 자동화 등으로 인하여 불가피하게 간접노무비가 직접노무비를 초과하는 경우에는 증빙자료에 의하여 초과 계상할 수 있다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"경비","text":"제11조(경비) ① 경비는 제품의 제조를 위하여 소비된 제조원가중 재료비, 노무비를 제외한 원가를 말하며 기업의 유지를 위한 관리활동부문에서 발생하는 일반관리비와 구분된다.② 경비는 해당 계약목적물 제조기간의 소요(소비)량을 측정하거나 제34조에 의한 원가계산자료나 계약서, 영수증 등을 근거로 하여 산출하여야 한다. ③ 경비의 세비목은 다음 각호의 것으로 한다.1. 전력비, 수도광열비는 계약목적물을 제조하는데 직접 소요되는 해당 비용을 말한다. 2. 운반비는 재료비에 포함되지 않는 운반비로서 원재료 또는 완제품의 운송비, 하역비, 상하차비, 조작비등을 말한다.3. 감가상각비는 제품생산에 직접 사용되는 건물, 기계장치 등 유형고정자산에 대하여 세법에서 정한 감가상각방식에 따라 계산한다. 다만, 세법에서 정한 내용연수의 적용이 불합리하다고 인정된 때에는 해당 계약목적물에 직접 사용되는 전용기기에 한하여 그 내용년수를 별도로 정하거나 특별상각할 수 있다.4. 수리수선비는 계약목적물을 제조하는데 직접 사용되거나 제공되고 있는 건물, 기계장치, 구축물, 선박차량 등 운반구, 내구성공구, 기구제품의 수리수선비로서 해당 목적물의 제조과정에서 그 원인이 발생될 것으로 예견되는 것에 한한다. 다만, 자본적 지출에 해당하는 대수리 수선비는 제외한다.5. 특허권사용료는 계약목적물이 특허품이거나 또는 그 제조과정의 일부가 특허의 대상이 되어 특허권 사용계약에 의하여 제조하고 있는 경우의 사용료로서 그 사용비례에 따라 계산한다.6. 기술료는 해당 계약목적물을 제조하는데 직접 필요한 노하우(Know-how) 및 동 부대비용으로서 외부에 지급하는 비용을 말하며 「법인세법」상의 시험연구비 등에서 정한 바에 따라 계상하여 사업년도로부터 이연상각하되 그 적용비례를 기준하여 배분 계산한다.7. 연구개발비는 해당 계약목적물을 제조하는데 직접 필요한 기술개발 및 연구비로서 시험 및 시범제작에 소요된 비용 또는 연구기관에 의뢰한 기술개발용역비와 법령에 의한 기술개발촉진비 및 직업훈련비를 말하며 「법인세법」상의 시험연구비 등에서 정한 바에 따라 이연상각하되 그 생산수량에 비례하여 배분 계산한다. 다만, 연구개발비중 장래 계속생산으로의 연결이 불확실하여 미래수익의 증가와 관련이 없는 비용은 특별상각할 수 있다.8. 시험검사비는 해당 계약의 이행을 위한 직접적인 시험검사비로서 외부에 이를 의뢰하는 경우의 비용을 말한다. 다만, 자체시험검사비는 법령이나 계약조건에 의하여 내부검사가 요구되는 경우에 계상할 수 있다.9. 지급임차료는 계약목적물을 제조하는데 직접 사용되거나 제공되는 토지, 건물, 기술, 기구 등의 사용료로서 해당 계약 물품의 생산기간에 따라 계산한다.10. 보험료는 산업재해보험, 고용보험, 국민건강보험 및 국민연금보험 등 법령이나 계약조건에 의하여 의무적으로 가입이 요구되는 보험의 보험료를 말하며 재료비에 계상되는 것은 제외한다.11. 복리후생비는 계약목적물의 제조작업에 종사하고 있는 노무자, 종업원등의 의료 위생약품대, 공상치료비, 지급피복비, 건강진단비, 급식비(\"중식 및 간식제공을 위한 비용을 말한다.\"이하 같다)등 작업조건유지에 직접 관련되는 복리후생비를 말한다.12. 보관비는 계약목적물의 제조에 소요되는 재료, 기자재 등의 창고 사용료로서 외부에 지급되는 경우의 비용만을 계상하여야 하며 이중에서 재료비에 계상되는 것은 제외한다.13. 외주가공비는 재료를 외부에 가공시키는 실가공비용을 말하며 부분품의 가치로서 재료비에 계상되는 것은 제외한다.14. 산업안전보건관리비는 작업현장에서 산업재해 및 건강장해예방을 위하여 법령에 따라 요구되는 비용을 말한다.15. 소모품비는 작업현장에서 발생되는 문방구, 장부대 등 소모품 구입비용을 말하며 보조재료로서 재료비에 계상되는 것은 제외한다.16. 여비ㆍ교통비ㆍ통신비는 작업현장에서 직접 소요되는 여비 및 차량유지비와 전신전화사용료, 우편료를 말한다.17. 세금과 공과는 해당 제조와 직접 관련되어 부담하여야 할 재산세, 차량세 등의 세금 및 공공단체에 납부하는 공과금을 말한다.18. 폐기물처리비는 계약목적물의 제조와 관련하여 발생되는 오물, 잔재물, 폐유, 폐알칼리, 폐고무, 폐합성수지등 공해유발물질을 법령에 따라 처리하기 위하여 소요되는 비용을 말한다.19. 도서인쇄비는 계약목적물의 제조를 위한 참고서적구입비, 각종 인쇄비, 사진제작비(VTR제작비를 포함한다)등을 말한다20. 지급수수료는 법령에 규정되어 있거나 의무지워진 수수료에 한하며, 다른 비목에 계상되지 않는 수수료를 말한다.21. 법정부담금은 관련법령에 따라 해당 제조와 직접 관련하여 의무적으로 부담하여야 할 부담금을 말한다. 22. 기타 법정경비는 위에서 열거한 이외의 것으로서 법령에 규정되어 있거나 의무지워진 경비를 말한다.23. 품질관리비는 해당 계약목적물의 품질관리를 위하여 관련 법령 및 계약조건에 의하여 요구되는 비용(품질시험 인건비를 포함한다)을 말하며, 간접노무비에 계상되는 것은 제외한다. 24. 안전관리비는 제조현장의 안전관리를 위하여 관계법령에 의하여 요구되는 비용을 말한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"일반관리비의 내용","text":"제12조(일반관리비의 내용) 일반관리비는 기업의 유지를 위한 관리활동부문에서 발생하는 제비용으로서 제조원가에 속하지 아니하는 모든 영업비용중 판매비 등을 제외한 다음의 비용, 즉, 임원급료, 사무실직원의 급료, 제수당, 퇴직급여충당금, 복리후생비, 여비, 교통ㆍ통신비, 수도광열비, 세금과 공과, 지급임차료, 감가상각비, 운반비, 차량비, 경상시험연구개발비, 보험료 등을 말하며 기업손익계산서를 기준하여 산정한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"일반관리비의 계상방법","text":"제13조(일반관리비의 계상방법) 제12조에 의한 일반관리비는 제조원가에 별표3에서 정한 일반관리비율(일반관리비가 매출원가에서 차지하는 비율)을 초과하여 계상할 수 없다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"이윤","text":"제14조(이윤) 이윤은 영업이익(비영리법인의 경우에는 목적사업이외의 수익사업에서 발생하는 이익을 말한다. 이하 같다.)을 말하며 제조원가중 노무비, 경비와 일반관리비의 합계액(이 경우에 기술료 및 외주가공비는 제외한다)의  25%를 초과하여 계상할 수 없다.\n제3절 공사원가계산","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"공사원가","text":"제15조(공사원가) 공사원가라 함은 공사시공과정에서 발생한 재료비, 노무비, 경비의 합계액을 말한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"작성방법","text":"제16조(작성방법) 계약담당공무원은 공사원가계산을 하고자 할 때에는 별표2의 공사원가계산서를 작성하고 비목별 산출근거를 명시한 기초계산서를 첨부하여야 한다. 이 경우에 재료비, 노무비, 경비 중 일부를 별표2의 공사원가계산서상 일반관리비 또는 이윤 다음 비목으로 계상하여서는 아니된다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"재료비","text":"제17조(재료비) 재료비는 공사원가를 구성하는 다음 내용의 직접재료비 및 간접재료비로 한다.① 직접재료비는 공사목적물의 실체를 형성하는 물품의 가치로서 다음 각호를 말한다.1. 주요재료비공사목적물의 기본적 구성형태를 이루는 물품의 가치2. 부분품비공사목적물에 원형대로 부착되어 그 조성부분이 되는 매입부품, 수입부품, 외장재료 및 제19조제3항제13호에 의해 경비로 계상되는 것을 제외한 외주품의 가치② 간접재료비는 공사목적물의 실체를 형성하지는 않으나 공사에 보조적으로 소비되는 물품의 가치로서 다음 각호를 말한다.1. 소모재료비기계오일ㆍ접착제ㆍ용접가스ㆍ장갑등 소모성물품의 가치2. 소모공구ㆍ기구ㆍ비품비내용년수 1년미만으로서 구입단가가 「법인세법」 또는 「소득세법」 규정에 의한 상당금액이하인 감가상각대상에서 제외되는 소모성 공구ㆍ기구ㆍ비품의 가치3. 가설재료비비계, 거푸집, 동바리 등 공사목적물의 실체를 형성하는 것은 아니나 동 시공을 위하여 필요한 가설재의 가치③ 재료의 구입과정에서 해당재료에 직접 관련되어 발생하는 운임, 보험료, 보관비등의 부대비용은 재료비에 계상한다. 다만 재료구입 후 발생되는 부대비용은 경비의 각 비목으로 계상한다.④ 계약목적물의 시공중에 발생하는 작업설, 부산물 등은 그 매각액 또는 이용가치를 추산하여 재료비에서 공제하여야 한다. 다만, 기존 시설물의 철거, 해체, 이설 등으로 발생되는 작업설, 부산물 등은 재료비에서 공제하지 아니하고, 매각비용 등에 대해 별도 계상한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"노무비","text":"제18조(노무비) 노무비의 내용 및 산정방식은 제5조와 제10조를 준용하며, 간접노무비의 구체적 계산방법 등에 대하여는 별표2-1을 참고하여 계산한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"경비","text":"제19조(경비) ① 경비는 공사의 시공을 위하여 소요되는 공사원가중 재료비, 노무비를 제외한 원가를 말하며, 기업의 유지를 위한 관리활동부문에서 발생하는 일반관리비와 구분된다.② 경비는 해당 계약목적물 시공기간의 소요(소비)량을 측정하거나 제34조에 의한 원가계산 자료나 계약서, 영수증 등을 근거로 산정하여야 한다.③ 경비의 세비목은 다음 각호의 것으로 한다.1. 전력비, 수도광열비는 계약목적물을 시공하는데 소요되는 해당 비용을 말한다.2. 운반비는 재료비에 포함되지 않은 운반비로서 원재료, 반재료 또는 기계기구의 운송비, 하역비, 상하차비, 조작비등을 말한다.3. 기계경비는 각 중앙관서의 장 또는 그가 지정하는 단체에서 제정한 \"표준품셈상의 건설기계의 경비산정기준에 의한 비용을 말한다.4. 특허권사용료는 타인 소유의 특허권을 사용한 경우에 지급되는 사용료로서 그 사용비례에 따라 계산한다.5. 기술료는 해당 계약목적물을 시공하는데 직접 필요한 노하우(Know-how) 및 동 부대비용으로서 외부에 지급되는 비용을 말하며 「법인세법」상의 시험연구비 등에서 정한 바에 따라 계상하여 사업초년도부터 이연상각하되 그 사용비례를 기준으로 배분계산한다.6. 연구개발비는 해당 계약목적물을 시공하는데 직접 필요한 기술개발 및 연구비로서 시험 및 시범제작에 소요된 비용 또는 연구기관에 의뢰한 기술개발 용역비와 법령에 의한 기술개발촉진비 및 직업훈련비를 말하며 「법인세법」상의 시험연구비 등에서 정한 바에 따라 이연상각하되 그 사용비례를 기준하여 배분계산한다. 다만, 연구개발비중 장래 계속시공으로서의 연결이 불확실하여 미래 수익의 증가와 관련이 없는 비용은 특별상각할 수 있다.7. 품질관리비는 해당 계약목적물의 품질관리를 위하여 관련법령 및 계약조건에 의하여 요구되는 비용(품질시험 인건비를 포함한다)을 말하며, 간접노무비에 계상(시험관리인)되는 것은 제외한다.8. 가설비는 공사목적물의 실체를 형성하는 것은 아니나 현장사무소, 창고, 식당, 숙사, 화장실 등 동 시공을 위하여 필요한 가설물의 설치에 소요되는 비용(노무비, 재료비를 포함한다)을 말한다.9. 지급임차료는 계약목적물을 시공하는데 직접 사용되거나 제공되는 토지, 건물, 기계기구(건설기계를 제외한다)의 사용료를 말한다.10. 보험료는 산업재해보험, 고용보험, 국민건강보험 및 국민연금보험 등 법령이나 계약조건 에 의하여 의무적으로 가입이 요구되는 보험의 보험료를 말하고, 동 보험료는 「건설산업기본법」 제22조제7항 등 관련법령에 정한 바에 따라 계상하며, 재료비에 계상되는 보험료는 제외한다. 다만 공사손해보험료는 제22조에서 정한 바에 따라 별도로 계상된다. 11. 복리후생비는 계약목적물을 시공하는데 종사하는 노무자ㆍ종업원ㆍ현장사무소직원 등의 의료위생약품대, 공상치료비, 지급피복비, 건강진단비, 급식비등 작업조건 유지에 직접 관련되는 복리후생비를 말한다.12. 보관비는 계약목적물의 시공에 소요되는 재료, 기자재 등의 창고사용료로서 외부에 지급되는 비용만을 계상하여야 하며 이중에서 재료비에 계상되는 것은 제외한다.13. 외주가공비는 재료를 외부에 가공시키는 실가공비용을 말하며 외주가공품의 가치로서 재료비에 계상되는 것은 제외한다.14. 산업안전보건관리비는 작업현장에서 산업재해 및 건강장해예방을 위하여 법령에 따라 요구되는 비용을 말한다.15. 소모품비는 작업현장에서 발생되는 문방구, 장부대등 소모용품 구입비용을 말하며, 보조재료로서 재료비에 계상되는 것은 제외한다.16. 여비ㆍ교통비ㆍ통신비는 시공현장에서 직접 소요되는 여비 및 차량유지비와 전신전화사용료, 우편료를 말한다.17. 세금과 공과는 시공현장에서 해당공사와 직접 관련되어 부담하여야 할 재산세, 차량세, 사업소세 등의 세금 및 공공단체에 납부하는 공과금을 말한다.18. 폐기물처리비는 계약목적물의 시공과 관련하여 발생되는 오물, 잔재물, 폐유, 폐알칼리, 폐고무, 폐합성수지등 공해유발물질을 법령에 의거 처리하기 위하여 소요되는 비용을 말한다.19. 도서인쇄비는 계약목적물의 시공을 위한 참고서적구입비, 각종 인쇄비, 사진제작비(VTR제작비를 포함한다) 및 공사시공기록책자 제작비등을 말한다.20. 지급수수료는 시행령 제52조제1항 단서에 의한 공사이행보증서 발급수수료, 「건설산업기본법」 제34조 및 「하도급거래 공정화에 관한 법률」 제13조의2의 규정에 의한 건설하도급대금 지급보증서 발급수수료, 「건설산업기본법」제68조의3에 의한 건설기계 대여대금 지급보증 수수료 등 법령으로서 지급이 의무화된 수수료를 말한다. 이경우 보증서 발급수수료는 보증서 발급기관이 최고 등급업체에 대해 적용하는 보증요율중 최저요율을 적용하여 계상한다. 21. 환경보전비는 계약목적물의 시공을 위한 제반환경오염 방지시설을 위한 것으로서, 관련법령에 의하여 규정되어 있거나 의무 지워진 비용을 말한다.22. 보상비는 해당 공사로 인해 공사현장에 인접한 도로 하천ㆍ기타 재산에 훼손을 가하거나 지장물을 철거함에 따라 발생하는 보상ㆍ보수비를 말한다. 다만, 해당공사를 위한 용지보상비는 제외한다.23. 안전관리비는 건설공사의 안전관리를 위하여 관계법령에 의하여 요구되는 비용을 말한다.24. 건설근로자퇴직공제부금비는 「건설근로자의 고용개선 등에 관한 법률」에 의하여 건설근로자퇴직공제에 가입하는데 소요되는 비용을 말한다. 다만, 제10조제1항제4호 및 제18조에 의하여 퇴직급여충당금을 산정하여 계상한 경우에는 동 금액을 제외한다.25. 관급자재 관리비는 공사현장에서 사용될 관급자재에 대한 보관 및 관리 등에 소요되는 비용을 말한다. 26. 법정부담금은 관련법령에 따라 해당 공사와 직접 관련하여 의무적으로 부담하여야 할 부담금을 말한다. 27. 기타 법정경비는 위에서 열거한 이외의 것으로서 법령에 규정되어 있거나 의무 지워진 경비를 말한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"일반관리비","text":"제20조(일반관리비) 일반관리비의 내용은 제12조와 같고 별표3에서 정한 일반관리비율을 초과하여 계상할 수 없으며, 아래와 같이 공사규모별로 체감 적용한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"이윤","text":"제21조(이윤) 이윤은 영업이익을 말하며 공사원가중 노무비, 경비와 일반관리비의 합계액(이 경우에 기술료 및 외주가공비는 제외한다)의 15%를 초과하여 계상할 수 없다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"공사손해보험료","text":"제22조(공사손해보험료) ① 공사손해보험료는 계약예규 「공사계약일반조건」 제10조에 의하여 공사손해보험에 가입할 때에 지급하는 보험료를 말하며, 보험가입대상 공사부분의 총공사원가(재료비, 노무비, 경비, 일반관리비 및 이윤의 합계액을 말한다. 이하 같다)에 공사손해 보험료율을 곱하여 계상한다.② 발주기관이 지급하는 관급자재가 있을 경우에는 보험가입 대상 공사부분의 총공사원가와 관급자재를 합한 금액에 공사손해보험료율을 곱하여 계상한다.③ 제1항에 의한 공사손해보험료를 계상하기 위한 공사손해보험료율은 계약담당공무원이 설계서와 보험개발원, 손해보험회사 등으로부터 제공받은 자료를 기초로 하여 정한다.\n제4절 학술연구용역 원가계산","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"용어의 정의","text":"제23조(용어의 정의) 이 절에서 사용하는 용어의 정의는 다음 각호와 같다.1. \"학술연구용역\"이라 함은 \"학문분야의 기초과학과 응용과학에 관한 연구용역 및 이에 준하는 용역\"을 말하며, 그 이행방식에 따라 다음 각목과 같이 구분할 수 있다.가. 위탁형 용역 : 용역계약을 체결한 계약상대자가 자기책임하에 연구를 수행하여 연구결과물을 용역결과보고서 형태로 제출하는 방식나. 공동연구형 용역 : 용역계약을 체결한 계약상대자와 발주기관이 공동으로 연구를 수행하는 방식다. 자문형 용역 : 용역계약을 체결한 계약상대자가 발주기관의 특정 현안에 대한 의견을 서면으로 제시하는 방식2. \"책임연구원\"이라 함은 해당 용역수행을 지휘ㆍ감독하며 결론을 도출하는 역할을 수행하는 자를 말하며, 대학 부교수 수준의 기능을 보유하고 있어야 한다. 이 경우에 책임연구원은 1인을 원칙으로 하되, 해당 용역의 성격상 다수의 책임자가 필요한 경우에는 그러하지 아니하다.3. \"연구원\"이라 함은 책임연구원을 보조하는 자로서 대학 조교수 수준의 기능을 보유하고 있어야 한다.4. \"연구보조원\"이라 함은 통계처리ㆍ번역 등의 역할을 수행하는 자로서 해당 연구분야에 대해 조교정도의 전문지식을 가진 자를 말한다.5. \"보조원\"이라 함은 타자, 계산, 원고정리등 단순한 업무처리를 수행하는 자를 말한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:24","kind":"조문","type":"계약예규","family":"nca","label":"제24조","title":"원가계산비목","text":"제24조(원가계산비목) 원가계산은 노무비(이하 \"인건비\"라 한다), 경비, 일반관리비등으로 구분하여 작성한다. 다만, 제23조제1호나목 및 다목에 의한 공동연구형 용역 및 자문형 용역의 경우에는 경비항목 중 최소한의 필요항목만 계상하고 일반관리비는 계상하지 아니한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:25","kind":"조문","type":"계약예규","family":"nca","label":"제25조","title":"작성방법","text":"제25조(작성방법) 학술연구용역에 대한 원가계산을 하고자 할 때에는 별표4에서 정한 학술연구용역원가계산서를 작성하고 비목별 산출근거를 명시한 기초계산서를 첨부하여야 한다","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:26","kind":"조문","type":"계약예규","family":"nca","label":"제26조","title":"인건비","text":"제26조(인건비) ① 인건비는 해당 계약목적에 직접 종사하는 연구요원의 급료를 말하며, 별표5에서 정한 기준단가에 의하되, 「근로기준법」에서 규정하고 있는 상여금, 퇴직급여충당금의 합계액으로 한다. 다만, 상여금은 기준단가의 연 400%를 초과하여 계상할 수 없다. ② 이 예규 시행일이 속하는 년도의 다음 년도부터는 매년 전년도 소비자물가 상승률만큼 인상한 단가를 기준으로 한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:27","kind":"조문","type":"계약예규","family":"nca","label":"제27조","title":"경비","text":"제27조(경비) 경비는 계약목적을 달성하기 위하여 필요한 다음 내용의 여비, 유인물비, 전산처리비, 시약 및 연구용 재료비, 회의비, 임차료, 교통통신비 및 감가상각비를 말한다.1. 여비는 다음 각호의 기준에 따라 계상한다.가. 여비는 「공무원여비규정」에 의한 국내여비와 국외여비로 구분하여 계상하되 이를 인정하지 아니하고는 계약목적을 달성하기 곤란한 경우에 한하며 관계공무원의 여비는 계상할 수 없다.나. 국내여비는 시외여비만을 계상하되 연구상 필요불가피한 경우외에는 월15일을 초과할 수 없으며, 책임연구원은 「공무원여비규정」제3조관련 별표1(여비지급구분표) 제1호등급, 연구원, 연구보조원 및 보조원은 동표 제2호등급을 기준으로 한다. 2. 유인물비는 계약목적을 위하여 직접 소요되는 프린트, 인쇄, 문헌복사비(지대포함)를 말한다.3. 전산처리비는 해당 연구내용과 관련된 자료처리를 위한 컴퓨터사용료 및 그 부대비용을 말한다.4. 시약 및 연구용 재료비는 실험실습에 필요한 비용을 말한다.5. 회의비는 해당 연구내용과 관련하여 자문회의, 토론회, 공청회 등을 위해 소요되는 경비를 말하며, 참석자의 수당은 해당 연도 예산안 작성 세부지침상 위원회 참석비를 기준으로 한다. 6. 임차료는 연구내용에 따라 특수실험실습기구를 외부로부터 임차하거나 혹은 공청회 등을 위한 회의장사용을 하지 아니하고는 계약목적을 달성할 수 없는 경우에 한하여 계상할 수 있다.7. 교통통신비는 해당 연구내용과 직접 관련된 시내교통비, 전신전화사용료, 우편료를 말한다.8. 감가상각비는 해당 연구내용과 직접 관련된 특수실험 실습기구ㆍ기계장치에 대하여 제11조제3항제3호의 규정을 준용하여 계산한다. 단 임차료에 계상되는 것은 제외한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:28","kind":"조문","type":"계약예규","family":"nca","label":"제28조","title":"일반관리비 등","text":"제28조(일반관리비 등) ① 일반관리비는 시행규칙 제8조에 규정된 일반관리비율을 초과하여 계상할 수 없다. ② 이윤은 영업이익을 말하며, 인건비, 경비 및 일반관리비의 합계액에 시행규칙 제8조에서 정한 이윤율을 초과하여 계상할 수 없다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:29","kind":"조문","type":"계약예규","family":"nca","label":"제29조","title":"회계직공무원의 주의의무","text":"제29조(회계직공무원의 주의의무) ① 계약담당공무원은 학술연구용역 의뢰시에는 해당 연구에 대한 전문기관 또는 전문가를 엄선하여 연구목적을 달성할 수 있도록 그 주의의무를 다하여야 한다.② 각 중앙관서의 장은 학술연구용역을 수의계약으로 체결하고자 할 경우에는 해당 계약상대자의 최근년도 원가계산자료(급여명세서, 손익계산서등)을 활용하여 제26조의 상여금, 퇴직금 및 제28조제1항의 일반관리비 산정시 과다 계상되지 않도록 주의하여야 한다.\n제5절 기타용역의 원가계산","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:30","kind":"조문","type":"계약예규","family":"nca","label":"제30조","title":"기타용역의 원가계산","text":"제30조(기타용역의 원가계산) ① 엔지니어링사업, 측량용역, 소프트웨어 개발용역 등 다른 법령에서 그 대가기준(원가계산기준)을 규정하고 있는 경우에는 해당 법령이 정하는 기준에 따라 원가계산을 할 수 있다.② 원가계산기준이 정해지지 않은 기타의 용역에 대하여는 제1항 및 제23조 내지 제29조에 규정된 원가계산기준에 준하여 원가계산할 수 있다. 이 경우 시행규칙 제23조의3 각호의 용역계약에 대한 인건비의 기준단가는 다음 각호의 어느 하나에 따른 노임에 의하되, 「근로기준법」에서 정하고 있는 제수당, 상여금(기준단가의 연 400%를 초과하여 계상할 수 없다), 퇴직급여충당금의 합계액으로 한다. 1. 시설물관리용역: 「통계법」 제17조의 규정에 따라 중소기업중앙회가 발표하는 ‘중소제조업 직종별 임금조사 보고서’(최저임금 상승 효과 등 적용시점의 임금상승 예측치를 반영한 통계가 있을 경우 동 통계를 적용한다. 이하 이 조에서 ‘임금조사 보고서’라 한다)의 단순노무종사원 노임(다만, 임금조사 보고서상 해당직종의 노임이 있는 종사원에 대하여는 해당직종의 노임을 적용한다) 2. 그 밖의 용역: 임금조사 보고서의 단순노무종사원 노임 ③ 제2항에도 불구하고 제2항 후단에 따른 인건비 기준단가에 0.87995를 곱한 금액이 최저임금에 미치지 못하는 경우에는 최저임금에 0.87995를 나눈 금액을 인건비 기준단가로 한다.\n제6절 원가계산용역기관","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:31","kind":"조문","type":"계약예규","family":"nca","label":"제31조","title":"원가계산용역기관의 요건","text":"제31조(원가계산용역기관의 요건) ① 시행규칙 제9조제3항제2호의 \"전문인력 10명 이상\"은  다음의 요건을 갖춘 인원을 말한다. 1. 국가공인 원가분석사 자격증 소지자 6인 또는 원가계산업무에 종사(연구기간 포함)한 경력이 3년 이상인자 4인, 5년 이상인자 2인 2. 이공계대학 학위소지자 또는 「국가기술자격법」에 의한 기술ㆍ기능분야의 기사 이상인 자 2인 3. 상경대학 학위소지자 2인 ② 시행규칙 제9조제2항제2호 및 제3호의 기관의 경우에는 제1항 각호의 인원이 대학(교) 직원 또는 대학(교) 부설연구소 직원이어야 하며, 각 분야별 상시고용인원 중에 교수(부교수, 조교수 포함)는 1인 이하로 하여야 한다.  ③ 계약담당공무원은 시행규칙 제9조제3항제3호의 기본재산 요건 구비 여부를 판단함에 있어 자본금은 최근연도 결산재무제표(또는 결산재무상태표)상의 자산총액에서 부채총액을 차감한 금액을 적용하여야 한다.  ④ 용역기관은 본부 외에 별도로 지사ㆍ지부 또는 출장소, 연락사무소 등을 설치하여 원가계산용역업무를 수행할 수 없다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:31의2","kind":"조문","type":"계약예규","family":"nca","label":"제31조의2","title":"용역기관에 대한 제재","text":"제31조의2(용역기관에 대한 제재) 계약담당공무원은 원가계산용역기관이 자격요건 심사 시에 허위서류를 제출하는 등 관련 규정을 위반하거나 원가계산용역을 부실하게 한 경우에는 국가기관의 원가계산용역업무를 수행할 수 없도록 해당 용역기관의 주무관청 등 감독기관에 요청할 수 있다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:32","kind":"조문","type":"계약예규","family":"nca","label":"제32조","title":"원가계산용역 의뢰시 주의사항","text":"제32조(원가계산용역 의뢰시 주의사항) ① 계약담당공무원은 제31조의 요건을 갖춘 기관에 한하여 원가계산내용에 따른 전문성이 있는 기관에 용역의뢰를 하여야 한다. 다만, 제31조의 요건을 갖춘 용역기관들의 단체로서 「민법」 제32조의 규정에 의하여 설립된 법인이 동 요건 충족여부를 확인한 경우에는 별도의 요건심사를 면제할 수 있다.② 계약담당공무원은 용역의뢰시에 제1항 단서에서 규정한 용역기관들의 단체에게 용역기관의 자격요건 심사를 의뢰하여 그 충족여부를 확인하여야 한다. (제1항 단서에 따라 심사가 면제된 용역기관은 제외) ③ 계약담당공무원은 제1항의 경우에 해당 용역기관의 장과 다음 각호의 사항을 명백히 한 계약서를 작성하여야 한다. 다만, 시행령 제49조에 의한 계약서 작성을 생략할 경우에도 다음 각호의 사항을 준용하여 각서 등을 제출요구하여야 한다. 1. 부실원가계산시 그 책임에 관한 사항2. 계약의 해제 또는 해지에 관한 사항3. 원가계산내용의 보안유지에 관한 사항4. 기타 원가계산 수행에 필요하다고 인정되는 사항④ 계약담당공무원은 최종원가계산서에 해당 용역기관의 장[대학(교) 연구소의 경우에는 연구소장] 및 책임연구원이 직접 확인ㆍ서명하였음을 확인하여야 한다. ⑤ 계약담당공무원은 용역기관에서 제출된 최종원가계산서의 내용이 「국가를 당사자로 하는 계약에 관한 법률」, 동법 시행령, 시행규칙, 이 예규 및 계약서 등의 용역조건에 부합되는지 여부를 검토하여 해당 원가계산의 적정을 기하여야 한다. 이 경우에 원가계산의 적정성을 기하기 위해 필요하다고 판단되는 때에는 해당 원가계산서를 작성하지 아니한 다른 용역기관에 검토를 의뢰할 수 있다. ⑥ 계약담당공무원은 제1항에 따라 원가계산용역기관에 용역의뢰를 하려는 경우 시행규칙 제9조제2항부터 제4항까지의 요건을 확인하기 위해 원가계산용역기관으로 하여금 다음 각 호의 서류를 제출하게 하여야 한다. 1. 정관(학교의 연구소 또는 산학협력단의 경우 학칙이나 연구소 규정)2. 삭제  3. 설립허가서 등 시행규칙 제9조제2항각호의 기관임을 증명하는 서류4. 제1항 각호의 인력에 대한 학위, 자격증명서, 재직증명서 등 자격 및 재직여부를 증명하는 서류5. 재무제표 등 시행규칙 제9조제3항제3호에 따른 기본재산을 증명할 수 있는 서류6. 기타 자격요건 등 확인을 위해 필요하다고 인정되는 서류⑦ 계약담당공무원은 제6항의 요건을 확인하는 경우 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 원가계산용역기관의 법인등기부 등본 서류를 확인하여야 한다.\n제7절 보칙","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:33","kind":"조문","type":"계약예규","family":"nca","label":"제33조","title":"특례설정 등","text":"제33조(특례설정 등) ① 각 중앙관서의 장은 특수한 사유로 인하여 동 기준에 따른 원가계산이 곤란하다고 인정될 때에는 특례를 설정할 수 있다. ② 각 중앙관서의 장은 반복적 또는 계속적으로 발주되는 공사에 있어서는 최근의 발주된 동종의 공사에 대한 원가계산서에 따라 예정가격을 작성할 수 있다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:34","kind":"조문","type":"계약예규","family":"nca","label":"제34조","title":"원가계산자료의 비치 및 활용","text":"제34조(원가계산자료의 비치 및 활용) ① 계약담당공무원은 원가계산에 의한 예정가격을 작성함에 있어서 계약상대방으로 적당하다고 예상되는 2개 업체 이상의 최근년도 원가계산자료에 의거하여 계약목적물에 관계되는 수치를 활용하거나(수의계약대상업체에 대하여는 해당업체의 최근년도 원가계산자료), 동 업체의 제조(공정)확인 결과를 활용하여 제7조, 제15조의 비목별 가격결정 및 제12조, 제20조의 일반관리비 계상을 위한 기초자료로 활용할 수 있다.② 계약담당공무원은 공사원가계산을 위하여 각 중앙관서의 장 또는 그가 지정하는 단체에서 제정한 \"표준품셈\"에 따라 제15조의 비목별 가격을 산출할 수 있으며, 동 품셈적용대상공사가 아닌 경우와 동 품셈적용을 할 수 없는 비목계상의 경우에는 제1항을 준용한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:35","kind":"조문","type":"계약예규","family":"nca","label":"제35조","title":"외국통화로 표시된 재료비의 환율적용","text":"제35조(외국통화로 표시된 재료비의 환율적용) 예정가격을 산출함에 있어서 외국통화로 표시된 재료비는 원가계산시 외국환거래법에 의한 기준환율 또는 재정환율을 적용하여 환산한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:36","kind":"조문","type":"계약예규","family":"nca","label":"제36조","title":"세부시행기준","text":"제36조(세부시행기준) 이 예규를 운용함에 있어 필요한 세부사항에 관하여는 재정경제부장관이 그 기준을 정할 수 있다.\n제3장 표준시장단가에 의한 예정가격작성","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:37","kind":"조문","type":"계약예규","family":"nca","label":"제37조","title":"표준시장단가에 의한 예정가격의 산정","text":"제37조(표준시장단가에 의한 예정가격의 산정) ① 표준시장단가에 의한 예정가격은 직접공사비, 간접공사비, 일반관리비, 이윤, 공사손해보험료 및 부가가치세의 합계액으로 한다. ② 시행령 제42조제1항에 따라 낙찰자를 결정하는 경우로서 추정가격이 100억원 미만인 공사에는 표준시장단가를 적용하지 아니한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:38","kind":"조문","type":"계약예규","family":"nca","label":"제38조","title":"직접공사비","text":"제38조(직접공사비) ① 직접공사비란 계약목적물의 시공에 직접적으로 소요되는 비용을 말하며, 계약목적물을 세부 공종(계약예규 「정부 입찰ㆍ계약 집행기준」 제19조 등 관련 규정에 따른 수량산출기준에 따라 공사를 작업단계별로 구분한 것을 말한다)별로 구분하여 공종별 단가에 수량(계약목적물의 설계서 등에 의해 그 완성에 적합하다고 인정되는 합리적인 단위와 방법으로 산출된 공사량을 말한다)을 곱하여 산정한다.② 직접공사비는 다음 각호의 비용을 포함한다.1. 재료비재료비는 계약목적물의 실체를 형성하거나 보조적으로 소비되는 물품의 가치를 말한다.2. 직접노무비공사현장에서 계약목적물을 완성하기 위하여 직접작업에 종사하는 종업원과 노무자의 기본급과 제수당, 상여금 및 퇴직급여충당금의 합계액으로 한다.3. 직접공사경비공사의 시공을 위하여 소요되는 기계경비, 운반비, 전력비, 가설비, 지급임차료, 보관비, 외주가공비, 특허권 사용료, 기술료, 보상비, 연구개발비, 품질관리비, 폐기물처리비 및 안전관리비를 말하며, 비용에 대한 구체적인 정의는 제19조를 준용한다.③ 제1항의 공종별 단가를 산정함에 있어 재료비 또는 직접공사경비중의 일부를 제외할 수 있다. 이 경우에는 해당 계약목적물 시공 기간의 소요(소비)량을 측정하거나 계약서, 영수증 등을 근거로 금액을 산정하여야 한다.④ 각 중앙관서의 장 또는 각 중앙관서의 장이 지정하는 기관은 직접공사비를 공종별로 직접조사ㆍ집계하여 산정할 수 있다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:39","kind":"조문","type":"계약예규","family":"nca","label":"제39조","title":"간접공사비","text":"제39조(간접공사비) ① 간접공사비란 공사의 시공을 위하여 공통적으로 소요되는 법정경비 및 기타 부수적인 비용을 말하며, 직접공사비 총액에 비용별로 일정요율을 곱하여 산정한다.② 간접공사비는 다음 각호의 비용을 포함하며, 비용에 대한 구체적인 정의는 제10조제2항 및 제19조를 준용한다.1. 간접노무비2. 산재보험료3. 고용보험료4. 국민건강보험료5. 국민연금보험료6. 건설근로자퇴직공제부금비7. 산업안전보건관리비8. 환경보전비9. 기타 관련법령에 규정되어 있거나 의무지워진 경비로서 공사원가계산에 반영토록 명시된 법정경비10. 기타간접공사경비(수도광열비, 복리후생비, 소모품비, 여비, 교통비, 통신비, 세금과 공과, 도서인쇄비 및 지급수수료를 말한다.)③ 제1항의 일정요율이란 관련법령에 의해 각 중앙관서의 장이 정하는 법정요율을 말한다. 다만 법정요율이 없는 경우에는 다수기업의 평균치를 나타내는 공신력이 있는 기관의 통계자료를 토대로 각 중앙관서의 장 또는 계약담당공무원이 정한다.④ 제38조에 따라 산정되지 아니한 공종에 대하여도 간접공사비 산정은 제1항 내지 제3항을 적용한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:40","kind":"조문","type":"계약예규","family":"nca","label":"제40조","title":"일반관리비","text":"제40조(일반관리비) ① 일반관리비는 기업의 유지를 위한 관리활동부문에서 발생하는 제비용으로서, 비용에 대한 구체적인 정의와 종류에 대하여는 제12조의 규정을 준용한다.② 일반관리비는 직접공사비와 간접공사비의 합계액에 일반관리비율을 곱하여 계산한다. 다만, 일반관리비율은 공사규모별로 아래에서 정한 비율을 초과할 수 없다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:41","kind":"조문","type":"계약예규","family":"nca","label":"제41조","title":"이윤","text":"제41조(이윤) 이윤은 영업이익을 말하며 직접공사비, 간접공사비 및 일반관리비의 합계액에 이윤율을 곱하여 계산한다. 이윤율은 시행규칙에서 정한 기준에 따른다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:42","kind":"조문","type":"계약예규","family":"nca","label":"제42조","title":"공사손해보험료","text":"제42조(공사손해보험료) 계약예규 「정부 입찰ㆍ계약 집행기준」 제14장에 따른 공사손해보험가입 비용을 말한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:43","kind":"조문","type":"계약예규","family":"nca","label":"제43조","title":"총괄집계표의 작성","text":"제43조(총괄집계표의 작성) 계약담당공무원이 표준시장단가에 따라 예정가격을 작성하는 경우, 예정가격을 직접공사비, 간접공사비, 일반관리비, 이윤, 공사손해보험료 및 부가가치세로 구분하여 별표6의 총괄집계표를 작성하여야 한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:44","kind":"조문","type":"계약예규","family":"nca","label":"제44조","title":"세부시행기준","text":"제44조(세부시행기준) 계약담당공무원은 이 장을 운용함에 있어 필요한 세부사항을 정할 수 있다.\n제4장 복수예비가격에 의한 예정가격의 결정","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:44의2","kind":"조문","type":"계약예규","family":"nca","label":"제44조의2","title":"복수예비가격 방식에 의한 예정가격의 결정","text":"제44조의2(복수예비가격 방식에 의한 예정가격의 결정) 각 중앙관서의 장 또는 계약담당공무원은 예정가격의 유출이 우려되는 등 필요하다고 인정되는 경우 복수예비가격 방식에 의해 예정가격을 결정할 수 있으며, 이 경우에는 이 장에서 정한 절차와 기준을 따라야 한다.[본조신설 2018.12.31.]","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:44의3","kind":"조문","type":"계약예규","family":"nca","label":"제44조의3","title":"예정가격 결정 절차","text":"제44조의3(예정가격 결정 절차) ① 계약담당공무원은 입찰서 제출 마감일 5일 전까지 기초금액(계약담당공무원이 시행령 제9조제1항의 방식으로 조사한 가격으로서 예정가격으로 확정되기 전 단계의 가격을 말하며,「출판문화산업 진흥법」제22조에 해당하는 간행물을 구매하는 경우에는 간행물의 정가를 말한다)을 작성하여야 한다.② 계약담당공무원은 제1항 따라 작성된 기초금액의 ±2% 금액 범위 내에서 서로 다른 15개의 가격(이하 \"복수예비가격\"이라 한다)을 작성하고 밀봉하여 보관하여야 한다.③ 계약담당공무원은 입찰을 실시한 후 참가자 중에서 4인(우편입찰 등으로 인하여 개찰장소에 출석한 입찰자가 없는 때에는 입찰사무에 관계없는 자 2인)을 선정하여 복수예비가격 중에서 4개를 추첨토록 한 후 이들의 산술평균가격을 예정가격으로 결정한다.④ 유찰 등으로 재공고 입찰에 부치려는 경우에는 복수예비가격을 다시 작성하여야 한다.[본조신설 2018.12.31.]","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:44의4","kind":"조문","type":"계약예규","family":"nca","label":"제44조의4","title":"세부기준ㆍ절차의 작성","text":"제44조의4(세부기준ㆍ절차의 작성) ① 각 중앙관서의 장은 이 장에서 정하지 아니한 사항으로서 복수예비가격에 의한 예정가격의 작성과 관련하여 필요한 사항에 대하여는 세부기준 및 절차를 정하여 운용할 수 있다.② 제44조의3의 규정에도 불구하고「전자조달의 이용 및 촉진에 관한 법률」 제2조제4호에 따른 국가종합전자조달시스템 또는 동법 제14조에 따른 자체전자조달시스템을 통해 전자입찰을 실시하는 경우에는 제44의3의 규정을 적용하지 아니하고 해당 기관이 정하는 기준에 따라 예정가격을 결정할 수 있다.  [본조신설 2018.12.31.]\n제5장 전문가격조사기관의 등록 및 조사업무","lawId":
