pum-gen:29","kind":"조문","type":"계약예규","family":"nca","label":"제29조","title":"기술지식의 이용 및 비밀엄수의무","text":"제29조(기술지식의 이용 및 비밀엄수의무) ① 계약담당공무원은 사업목적 달성 또는 공공의 이익 등을 위해 필요하다고 인정되는 경우, 계약내용에 따라 계약상대자가 제출하는 각종 보고서, 정보, 기타자료 및 이에 의하여 얻은 기술지식(계약목적물의 내용에 포함되는 경우는 제외한다. 이하 이 조에서 \"기술지식 등\"이라 한다)의 전부 또는 일부를 계약상대자의 승인을 얻어 복사, 이용 또는 공개할 수 있다.② 계약상대자는 해당계약을 통하여 얻은 모든 정보 또는 국가의 기밀사항을 계약이행의 전후를 막론하고 외부에 누설할 수 없다.③ 계약담당공무원은 시장에서 거래되는 등 재산적 가치가 있는 기술지식 등을 제1항에 따라 복사ㆍ이용 또는 공개하려는 경우에는 계약상대자에게 정당한 이용대가를 지급하여야 한다. 이 경우 기술지식 등의 이용대가는 시장거래가격 등을 기초로 계약상대자와 협의하여  결정한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:29의2","kind":"조문","type":"계약예규","family":"nca","label":"제29조의2","title":"계약목적물의 지식재산권 귀속 등","text":"제29조의2(계약목적물의 지식재산권 귀속 등) 해당 계약에 따른 계약목적물에 대한 지식재산권은 발주기관과 계약상대자가 공동으로 소유하며, 별도의 정함이 없는 한 지분은 균등한 것으로 한다. 이와 관련한 자세한 사항은 계약예규 「용역계약일반조건」제35조의2, 제35조의3 및 제35조의4를 준용한다.[본조신설 2015.1.1.]","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:30","kind":"조문","type":"계약예규","family":"nca","label":"제30조","title":"적격심사관련사항 이행","text":"제30조(적격심사관련사항 이행) ① 시행령 제42조제1항 본문에 의한 물품을 제조ㆍ구매함에 있어 계약상대자는 계약예규 「적격심사기준」(발주관서의 장이 직접 적격심사요령을 작성한 경우 동 심사요령) 심사항목에 규정된 사항에 대하여 적격심사당시 제출한 내용대로 이행하여야 한다.② 계약담당공무원은 제1항에 규정한 이행상황을 수시로 확인하여야 하며, 제출된 내용대로 이행이 되지 않고 있을 때에는 즉시 시정토록 조치하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:31","kind":"조문","type":"계약예규","family":"nca","label":"제31조","title":"분쟁의 해결","text":"제31조(분쟁의 해결) ① 물품계약의 수행중 계약당사자간에 발생하는 분쟁은 협의에 의하여 해결한다.② 제1항에 의한 협의가 이루어지지 아니할 때에는 법원의 판결 또는 「중재법」에 의한 중재에 의하여 해결한다. 다만, 「국가를 당사자로 하는 계약에 관한 법률」제28조에서 정한 이의신청 대상에 해당하는 경우 국가계약분쟁조정위원회 조정결정에 따라 분쟁을 해결할 수 있다. ③ 제2항에도 불구하고 계약을 체결하는 때에 「국가를 당사자로 하는 계약에 관한 법률」제28조의2에 따라 분쟁해결방법을 정한 경우에는 그에 따른다. ④ 계약상대자는 제1항부터 제3항까지의 분쟁처리절차 수행기간중 물품계약의 수행을 중지하여서는 아니된다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-gen:32","kind":"조문","type":"계약예규","family":"nca","label":"제32조","title":"재검토기한","text":"제32조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-mulpum-gen","group":"물품구매계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-mulpum-bid","kind":"법령","type":"계약예규","family":"nca","label":"물품구매입찰유의서","name":"(계약예규) 물품구매(제조)입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 유의서는 정부(이하 \"발주기관\"이라 한다)가 행하는 물품의 구매ㆍ제조 및 기타 계약(매각 등 세입의 원인이 되는 계약은 제외한다)에 대한 입찰에서 해당 입찰에 참가하고자 하는 자가 유의해야 할 사항을 정함을 목적으로 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"용어의 정의","text":"제2조(용어의 정의) 이 유의서에서 사용하는 용어의 정의는 이 유의서에서 따로 정하는 경우를 제외하고는 「국가를 당사자로 하는 계약에 관한 법률 시행령」, 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」, 「특정조달을위한국가를당사자로하는계약에관한법률시행령특례규정」(이하 각각 \"시행령\", \"시행규칙\" 및 \"특례규정\"이라 한다) 및 계약예규 「물품구매(제조)계약일반조건」(이하 \"일반조건\"이라 한다)에 정하는 바에 의한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"입찰참가신청","text":"제3조(입찰참가신청) ① 입찰에 참가하고자 하는 자는 입찰공고 또는 입찰참가통지서에 기재된 입찰참가신청마감일까지 다음 각호의 서류를 발주기관에 제출하여 입찰참가신청을 하여야 한다.1. 입찰참가신청서(소정양식) 1통2. 입찰참가자격을 증명하는 서류 1통3. 인감증명서 또는「본인서명사실 확인 등에 관한 법률」제2조제3호에 따른 본인서명사실확인서 1통. 다만,「전자조달의 이용 및 촉진에 관한 법률」제2조제4호에 따른 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)을 이용하여 등록하는 경우는 제외한다. 4. 기타 공고 또는 통지로 요구하는 서류② 제1항제2호의 경우에는 원본을 제시하거나 사본에 \"원본과 같음\"을 명기하고 인감(인감증명서상의 인감 또는 입찰참가신청서상의 사용인감)으로 날인(본인서명사실확인서를 제출한 경우는 서명)하여 제출하여야 한다. ③ 시행령 제72조에 의하여 공동계약이 허용된 경우에는 공동수급체를 구성하여 입찰에 참가하고자 하는 자는 공동수급협정서를 제1항 각호의 서류와 함께 제출하여야 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:3의2","kind":"조문","type":"계약예규","family":"nca","label":"제3조의2","title":"입찰참가자격의 판단기준일","text":"제3조의2(입찰참가자격의 판단기준일) ① 시행령 제12조 및 제21조에 따른 등록ㆍ실적 등에 의한 입찰참가자격의 판단기준일은 시행규칙 제40조제4항에 의한 입찰참가신청서류의 접수마감일(이하 \"입찰참가등록마감일\"이라 한다)로 하며, 입찰참가자는 입찰참가등록마감일 이후 입찰서제출 마감일까지 해당 입찰참가자격을 계속 유지하여야 한다.② 제1항에도 불구하고 시행령 제21조제1항제6호 및 시행규칙 제24조에 따라 지역제한경쟁입찰을 부치는 경우 법인등기부상 본점소재지 기준일(본점소재지가 변경된 경우 법인등기부상 본점소재지 등기일을 말한다.)은 입찰공고일 전일로 하며 계약체결일까지 계속 유지하여야 한다. ③ 입찰참가자가 시행령 제76조에 의한 입찰참가자격제한을 받은 경우에는 입찰참가등록마감일 전일까지 입찰참가자격제한기간이 만료되어야 입찰에 참가할 수 있다.④ 입찰전에 상호 또는 대표자의 변경(법인의 경우에는 법인 등기사항증명서를 기준으로 한다)이 있는 경우에는 변경신고를 한 후 변경된 상호 또는 대표자 명의로 입찰에 참가하여야 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"입찰에 관한 서류","text":"제4조(입찰에 관한 서류) ① 입찰에 참가하고자 하는 자는 다음 각호의 서류(이하 \"입찰에 관한 서류\"라 한다)를 열람할 수 있으며 추정가격이 고시금액이상인 물품의 경우에는 이를 교부받을 수 있다.1. 입찰공고문 또는 입찰참가통지서2. 물품구매(제조)입찰유의서3. 입찰참가신청서(소정서식)4. 입찰서(소정서식)5. 물품구매(제조)표준계약서(소정서식)6. 물품구매(제조)계약일반조건7. 물품구매(제조)계약특수조건8. 기타 참고사항을 기재한 서류② 발주기관은 제1항의 입찰에 관한 서류를 교부하는 경우에는 입찰공고 등에서 정한 금액을 납부할 것을 요구할 수 있으며, 이 경우에는 입찰에 참가하고자 하는 자는 이에 따라야 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"관계법령 등의 숙지","text":"제5조(관계법령 등의 숙지) ① 입찰에 참가하고자 하는 자는 시행령 등의 입찰에 관련된 법령 및 제4조제1항에 의한 입찰에 관한 서류를 입찰전에 완전히 숙지하여야 하며 이를 숙지하지 못한 책임은 입찰참가자에게 있다.② 입찰에 참가하고자 하는 자는 제1항에 의한 입찰에 관한 서류의 검토과정에서 발견한 입찰에 관한 서류상의 착오, 누락사항 또는 기타설명이 요구되는 사항에 대하여는 입찰서제출마감일까지 발주기관에 그 설명을 요구할 수 있다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"입찰보증금","text":"제6조(입찰보증금) ① 입찰에 참가하고자 하는 자는 입찰신청마감일(공휴일인 때에는 전일)까지 입찰금액의 100분의 5이상의 입찰보증금을 시행령 제37조제2항에 규정된 현금 또는 보증서 등으로 발주기관에 납부하여야 한다.② 낙찰자가 정당한 이유없이 소정의 기한내에 계약을 체결하지 아니할 때에는 계약담당공무원은 해당 입찰보증금을 국고에 귀속한다. ③ 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)은 낙찰되지 아니한 입찰자의 입찰보증금을 낙찰자가 결정된 후 즉시 반환한다. 다만, 낙찰자의 입찰보증금은 계약체결 후 즉시 반환한다.④ 계약담당공무원은 다음 각 호의 어느 하나에 해당하는 경우에는 원칙적으로 입찰보증금 납부를 면제할 수 있다. 1. 시행령 제37조제3항제1호 내지 제4호, 제5의2호 및 제6호에 정한 자가 입찰에 참가하는 경우2. 「식품위생법」 또는 「약사법」등 제조업관련 법령에 의하여 국가기관 등으로부터 면허ㆍ허가 등을 받았거나 등록ㆍ신고 등을 마친 자로서 입찰참가신청마감일 현재 해당 제조업을 영위하고 있는 법인이 입찰에 참가하는 경우. 다만, 다음 각 목의 어느 하나에 해당하는 자는 제외한다 가. 입찰공고일 이전 1년 이내에 시행령 제76조제2항제2호가목의 사유로 입찰참가자격제한을 받은 자(입찰참가자격 제한 기간 중인 경우를 포함한다) ⑤ 보증서 등에 의한 입찰보증금의 보증기간은 다음 각호를 충족하여야 한다.1. 보증기간의 첫날 : 입찰서 제출마감일 이전일 것 2. 보증기간의 만료일 : 입찰서 제출마감일 다음날부터 30일 이후일 것","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"입찰참가","text":"제7조(입찰참가) ① 입찰참가신청을 한 자가 아니면 입찰에 참가할 수 없다.② 입찰참가신청자가 입찰참가신청서 제출시 대리인을 지정한 경우에는 그 대리인도 입찰에 참가할 수 있다. 다만, 입찰참가신청서를 제출하는 때부터 입찰개시 시각전까지 입찰대리인을 지정하거나 입찰대리인을 변경하는 경우에는 그 대리인이 입찰에 참가할 수 있다.③ 제2항에 의한 대리인의 자격은 입찰참가자가 법인인 경우에는 해당 법인의 임ㆍ직원에 한하며, 계약담당공무원은 재직증명서와 다음 각호의 자료에 의해서 임ㆍ직원 여부를 확인하여야 한다. 다만, 2개 이상 법인의 임ㆍ직원인 자는 1개 법인의 대리인만 입찰에 참가할 수 있다. 1. 4대 보험 중 어느 하나의 가입 증명자료(최근 3개월 이내) 2. 소속 법인에서 받은 급여와 관련하여 해당 법인에서 발급받은 소득세 납부 증명자료 3. 법인 등기사항증명서 4. 기타 임ㆍ직원 여부를 확인할 수 있는 자료 ④ 시행령 제76조에 의한 부정당업자로 입찰참가자격을 제한받고 있는 자는 제2항에 의한 대리인이 될 수 없다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"입찰서의 작성","text":"제8조(입찰서의 작성) ① 입찰자는 입찰서를 소정의 서식에 의하여 작성하여야 하며, 입찰금액은 총액입찰인 경우에는 총액을, 단가입찰인 경우에는 단가를 표기하여야 한다.② 입찰자는 입찰서에 납품기한을 명기하여야 하며 견품을 제출할 때에는 그 사실을 기재하여야 한다.③ 입찰자는 입찰서에 기명날인을 함에 있어 반드시 입찰자 성명(법인의 경우 대표자 성명)을 기재하고 입찰참가신청서 제출시 신고한 인감(서명을 포함한다. 이하 같다)으로 날인하여야 한다. ④ 입찰자는 입찰서의 기재사항 중 삭제 또는 정정한 곳이 있을 때에는 입찰에 사용하는 인감으로 날인하여야 한다.⑤ 입찰자는 입찰서를 입찰공고 또는 입찰참가통지서 등에 별도로 규정한 경우를 제외하고는 한글로 작성하여야 하며 입찰금액은 원화로 표기하여야 한다.⑥ 입찰자는 입찰서의 금액표시를 한글 또는 한자로 기재하여야 하며 아라비아숫자를 함께 표기할 수 있다. 이 경우에 아라비아숫자로 함께 표기한 금액이 한글 또는 한자로 기재한 금액과 차이가 있을 때에는 한글 또는 한자로 기재한 금액에 의한다. 다만, 전산서식에 의한 입찰의 경우에는 지정된 표기방법으로 기재하여야 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"입찰서의 제출","text":"제9조(입찰서의 제출) ① 입찰자는 입찰서를 봉합하여 1인 1통만을 제출하여야 한다.② 우편에 의한 입찰서는 입찰서 제출마감일전일까지 발주기관에 도착된 것에 한하여 효력이 있다. 이 경우에 우송중의 분실, 훼손 또는 지연에 대하여 발주기관은 책임을 지지 아니한다.③ 계약담당공무원은 제2항에 의하여 우편으로 입찰서가 제출된 때에는 해당 입찰서의 봉투표면에 접수일시를 기재하고 확인인을 날인하여 개찰시까지 개봉하지 아니하고 보관하여야 한다.④ 입찰자는 제출한 입찰서를 교환, 변경 또는 취소할 수 없다. 다만, 입찰서에 기재한 중요부분에 오기가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시한 것으로 계약담당공무원이 이를 인정하는 경우에는 취소가 가능하며, 시행령 제18조에 의한 2단계경쟁 등의 입찰에 있어 계약담당공무원은 규격입찰을 개찰한 결과 적격자가 없는 경우 또는 일부 경미한 사항의 규격보완을 조건으로 규격적합 판정을 하는 경우에는 규격입찰서를 변경하여 제출하게 할 수 있다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:9의2","kind":"조문","type":"계약예규","family":"nca","label":"제9조의2","title":"경영상태 심사서류의 제출","text":"제9조의2(경영상태 심사서류의 제출) ① 입찰에 참여하고자 하는 자는 「신용정보의 이용 및 보호에 관한 법률」제2조제8의3호 또는「자본시장과 금융투자업에 관한 법률」제9조제26항의 업무를 영위하는 신용정보업자로부터 평가받은 모든 공공기관 입찰용 신용평가등급을 해당 신용정보업자를 통해 평가완료 후 3일 이내에 조달청 나라장터에 전송하여야 한다. ② 조달청장은 분기별로 신용정보업자로부터 평가명세서를 제출받아 미전송 여부를 확인하여 해당 업체를 나라장터에 게재하고, 발주기관은 동 업체에 대해 「정부입찰계약집행기준」 제98조에 따라 처리하며, 향후 1년간 시행령 제13조에 따른 입찰참가자격사전심사 및 시행령 제42조제1항에 따른 적격심사시 감점할 수 있다.[본조신설 2012.7.4.]","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:9의3","kind":"조문","type":"계약예규","family":"nca","label":"제9조의3","title":"청렴계약서의 제출","text":"제9조의3(청렴계약서의 제출) 입찰자는 입찰서를 제출할 때 시행령 제4조의2 및 정부입찰ㆍ계약집행기준 제98조의3에 따른 청렴계약서를 같이 제출하여야 한다.[본조신설 2016.1.1.]","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"장기물품제조 등의 입찰","text":"제10조(장기물품제조 등의 입찰) 장기물품제조 등의 경우에는 입찰자는 입찰시 총물품제조 등을 대상으로 하여 입찰하여야 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"경쟁입찰의 성립","text":"제11조(경쟁입찰의 성립) ① 경쟁입찰은 2인이상의 유효한 입찰로써 성립한다.② 계약담당공무원은 시행령 제18조제3항에 의하여 규격과 가격을 분리하여 입찰에 부치는 경우에는 시행령 제11조에 의하여 2인 이상의 유효한 입찰로 성립한 규격입찰의 개찰결과에서 규격적격자로 확정된 자가 1인인 경우에도 가격입찰서를 개봉할 수 있다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"입찰의 무효","text":"제12조(입찰의 무효) 시행규칙 제44조에서 무효로 규정한 입찰 및 다음 각 호의 어느 하나에 해당하는 입찰은 무효로 한다.1. 입찰자(법인의 경우 대표자를 말한다. 이하 같다)가 직접 입찰을 하지 아니하고 대리인을 통하여 입찰을 할 경우에는 제7조제2항에 의한 대리인이 아닌 자가 한 입찰 또는 대리권이 없는 자가 한 입찰2. 동일사항에 대하여 타인의 대리를 겸하거나 2인 이상을 대리한 입찰3. 입찰서의 입찰금액 등 중요한 부분이 불분명하거나 정정한 후 정정날인을 누락한 입찰4. 담합하거나 타인의 경쟁참가를 방해 또는 관계공무원의 공무집행을 방해한 자의 입찰5. 입찰자의 기명날인이 없는 입찰(입찰자의 성명을 기재하지 아니하고 대리인 성명 또는 회사명을 기재한 경우 및 입찰참가신청서 제출시 신고한 인감과 다른 인감으로 날인된 경우도 포함한다)6. 입찰서에 기재한 중요부분에 착오가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시한 것으로서 계약담당공무원이 이를 인정한 입찰7. 제16조제8항에 정한 해당 서류를 제출하지 아니한 입찰 8. 제8조제1항 및 제6항에 위반하여 소정의 입찰서를 사용하지 않거나 입찰서의 금액을 아라비아숫자로만 기재한 입찰 또는 전산서식에 의한 입찰서를 훼손하거나 전산표기방법과 상이하게 작성, 기재하여 전산처리가 되지 아니한 입찰9. 공동계약의 공동수급체구성원이 동일 입찰건에 대하여 공동수급체를 중복적으로 결성하여 참여한 입찰, 입찰등록시 공동수급표준협정서를 제출하지 아니한 입찰 및 공동계약운용요령 제9조를 위반한 입찰","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"견품의 제출","text":"제13조(견품의 제출) ① 입찰자는 입찰공고 등에서 견품의 제출을 요구하였거나 이의 제출이 필요하다고 인정할 때에는 견품을 제출하여야 한다. 이 때에는 견품의 품명, 입찰자의 주소, 성명(또는 상호) 및 입찰공고번호 등 필요한 사항을 기재하여야 한다.② 계약담당공무원은 낙찰자의 견품을 계약이행 후, 낙찰자이외의 입찰자의 견품은 낙찰자결정 후 각각 1개월 이내에 해당 낙찰자 또는 입찰자의 요구에 의하여 반환한다. 이 경우에 발주기관의 책임없는 사유로 인하여 발생된 견품의 멸실, 훼손에 대해서는 발주기관은 책임을 지지 아니하며, 반환에 따른 경비는 낙찰자 또는 입찰자의 부담으로 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"입찰의 연기","text":"제14조(입찰의 연기) ① 발주기관은 다음 각호의 경우 입찰공고 또는 입찰참가통지서에 기재된 입찰서 제출마감일시를 연기할 수 있다.1. 제5조제2항에 의한 설명요구사항의 내용이 중대하여 연기가 불가피하다고 판단되는 경우2. 기타 불가피한 사유로 인하여 지정된 일시에 입찰 또는 개찰을 실시하지 못하는 경우② 제1항에 의하여 입찰을 연기한 경우에는 그 연기사유와 기간을 입찰공고의 방법과 동일한 방법으로 공고 또는 통지하여야 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"재입찰 및 재공고입찰","text":"제15조(재입찰 및 재공고입찰) ① 계약담당공무원은 경쟁입찰에서 2인이상의 유효한 입찰자가 없거나 낙찰자가 없는 경우에는 재입찰에 부칠 수 있다. 이 경우에는 최초 입찰에의 참가유무 또는 입찰횟수의 제한을 받지 아니한다. ② 입찰자나 낙찰자가 없는 경우 또는 낙찰자가 계약을 체결하지 아니하는 경우에는 계약담당공무원은 재공고입찰에 부칠 수 있다.③ 계약담당공무원은 시행령 제18조제3항에 의하여 규격과 가격을 분리하여 입찰에 부친 경우 가격입찰서를 개찰한 결과 낙찰자를 결정할 수 없는 경우로서 규격적격자가 2인 이상인 때에는 그 규격적격자에게 가격입찰서를 다시 제출하게 할 수 있다.④ 제1항 내지 제3항에 의한 재입찰 또는 재공고입찰시에는 기한을 제외하고는 최초의 입찰에 부칠 때에 정한 가격 및 기타조건을 변경할 수 없다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"낙찰자의 결정","text":"제16조(낙찰자의 결정) ① 계약담당공무원은 제12조에 해당하는 사유가 없는 자로서 시행령 제42조 등에 정한 낙찰자결정기준에 적합한 자를 낙찰자로 한다.② 시행령 제17조에 따른 희망수량에 의한 일반경쟁입찰의 경우에는 유효한 입찰자중 예정가격이하의 최저단가 입찰자로부터 순차로 수요수량에 달할 때까지의 입찰자를 낙찰자로 한다. 다만, 최후순위의 낙찰의 수량이 다른 낙찰자의 수량과 합산하여 구매예정량을 초과할 때는 그 초과하는 수량에 대하여는 낙찰되지 아니한 것으로 본다.③ 계약담당공무원은 개봉된 입찰서를 확인하고 유효한 입찰서의 입찰금액과 예정가격을 대조하여 지체없이 적격자를 낙찰자로 선정하여야 한다. 다만, 시행령 제42조제1항에 의하여 계약이행능력을 심사하여 낙찰자를 결정하는 등 낙찰자 결정에 장시간이 소요되는 경우에는 그러하지 아니할 수 있다.④ 계약담당공무원은 제1항 내지 제3항에 의하여 낙찰자를 결정하기 전에 해당 입찰자의 입찰서, 법인 등기사항증명서(본사, 대표자 및 상호등 변경여부 확인), 공동수급표준협정서 등 관계서류를 검토하여 해당 낙찰예정자의 입찰이 제12조에 따른 무효입찰에 해당되는지의 여부를 확인하여야 한다. ⑤ 계약담당공무원은 낙찰이 될 수 있는 동일가격으로 입찰한 자가 2인 이상인 때에는 다음 각 호에 따라 낙찰자를 결정한다.1. 시행령 제17조에 따른 희망수량에 의한 경쟁입찰인 경우 : 입찰수량이 많은 입찰자를 낙찰자로 결정하되, 입찰수량도 동일한 때에는 추첨에 의하여 낙찰자를 결정2. 시행령 제42조제1항에 따라 낙찰자를 결정하는 경우 : 이행능력 심사결과 최고점수인 자를 낙찰자로 결정하되, 이행능력 심사결과도 동일한 때에는 추첨에 의하여 낙찰자를 결정3. (삭  제) 4. 시행령 제42조제3항에 따라 낙찰자를 결정하는 경우 : 규격 또는 기술우위자를 낙찰자로 결정하되, 규격 또는 기술평가 결과도 동일한 때에는 추첨에 의하여 낙찰자를 결정⑥ 제5항에 의한 낙찰자 결정시에 입찰자중 출석하지 아니한 자 또는 추첨을 하지 아니한 자가 있을 때에는 입찰사무에 관계없는 공무원으로 하여금 추첨을 대신하게 할 수 있다.⑦ 제1항에도 불구하고 시행령 제44조제1항에 의해 재정경제부장관이 지정ㆍ고시하는 물품의 제조 또는 구매입찰에 있어서는 해당물품의 입찰가격외에 품질, 성능, 효율 등(이하 \"품질 등\"이라 한다)을 종합적으로 고려하여 가장 경제성이 있는 가격의 입찰자를 낙찰자로 한다. 이 경우 계약담당공무원은 해당물품의 품질 등의 평가기준을 재정경제부장관이 정하는 바에 따라 입찰전에 미리 결정하여 입찰자로 하여금 이를 열람하게 하여야 한다. ⑧ 계약담당공무원은 제7항에 의한 입찰시에는 입찰자로 하여금 해당물품의 품질 등 표시서를 입찰서에 첨부하게 하여야 한다.⑨ 계약담당공무원은 입찰서와 함께 품질 등 표시서의 제출을 받은 경우에 제7항에 따라 입찰전에 미리 결정한 평가기준에 의하여 평가하되 특별한 사유가 없는 한 입찰 또는 개찰(우편입찰일 경우에 한한다)일로부터 10일 이내에 낙찰자를 결정하여야 한다.⑩ 계약담당공무원은 낙찰자로 결정된 자가 계약체결 이전에 입찰무효 등 부적격자로 판명되어 낙찰자 결정이 취소된 경우로서 동 부적격자를 제외하고 2인이상 유효한 입찰이 성립되어 있는 때에는 차순위자 순으로 필요한 심사 등을 실시하여 낙찰자를 결정한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"계약의 체결","text":"제17조(계약의 체결) ① 낙찰자는 소정서식에 의한 구비서류 및 낙찰금액의 산출내역을 표시하는 내역서(이하 \"산출내역서\"라 한다)를 낙찰통지를 받은 후 7일 이내에 발주기관에 제출하고 10일 이내에 계약을 체결하여야 한다. 다만, 시행령 제9조제1항제2호에 의한 예정가격을 기준으로 계약을 체결하지 아니한 계약에 있어서는 계약담당공무원이 필요하다고 인정하는 경우에 그 산출내역서를 제출하게 할 수 있다.② 제1항의 경우에 불가항력의 사유로 인하여 계약을 체결할 수 없는 경우에는 그 사유가 존속하는 기간은 이를 산입하지 아니한다.③ 제1항에 의하여 발주기관과 계약을 체결하고자 하는 자는 관계법령 및 계약담당공무원이 요구하는 서류를 계약담당공무원에게 제출하여야 한다.④ 계약담당공무원은 낙찰자가 정당한 이유없이 제1항에 의하여 계약을 체결하지 아니하는 때에는 낙찰을 취소할 수 있다⑤ 계약담당공무원은 장기물품제조의 경우에 낙찰자와의 계약은 총물품 제조낙찰금액을 부기하고 해당연도 예산의 범위안에서 제1차 물품제조에 대하여 계약을 체결하여야 한다. 이 경우에 제2차 물품제조이후의 계약은 총물품제조낙찰금액(시행령 제64조 내지 제66조에 의한 계약금액의 조정이 있는 경우에는 조정된 총물품제조금액을 말한다.)에서 이미 계약된 금액을 공제한 금액의 범위안에서 계약을 체결할 것을 부관(附款)으로 약정하여야 한다. ⑥ 제4항에 의하여 제1차 및 제2차 물품제조 이후의 계약금액은 총물품제조의 계약단가에 의한다. 이 경우 계약금액조정 등으로 인하여 산출내역서의 단가가 조정된 경우에는 조정된 계약단가에 의한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"계약의 성립","text":"제18조(계약의 성립) 계약담당공무원과 낙찰자가 계약서에 기명ㆍ날인(외국인에 대하여 서명을 허용한 경우에는 서명을 포함한다)함으로써 계약은 확정된다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"입찰보증금의 계약보증금으로의 대체","text":"제19조(입찰보증금의 계약보증금으로의 대체) ① 계약담당공무원은 낙찰자가 납부한 입찰보증금을 소정의 절차에 따라 계약보증금으로 대체할 수 있다. 다만, 입찰보증금과 계약보증금과의 차이가 있으면 계약상대자는 그 차액을 추가로 납부하여야 한다. ② 제1항에 의한 대체는 계약이 성립한 때에 이루어진 것으로 본다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"부정당업자의 입찰참가자격제한","text":"제20조(부정당업자의 입찰참가자격제한) 입찰자 또는 낙찰자가 「국가를 당사자로 하는 계약에 관한 법률」제27조 및 시행령 제76조에 해당하는 경우에는 1월이상 2년이하의 범위내에서 입찰참가자격 제한조치를 받게 된다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"비밀유지 의무","text":"제21조(비밀유지 의무) 입찰자는 발주기관으로부터 배부받은 입찰에 관한 서류 또는 각종 자료 및 입찰과정에서 얻은 정보를 해당 입찰 이외의 목적으로 사용하여서는 아니된다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"이의신청","text":"제22조(이의신청) ① 추정가격이 1억 5천만원이상인 물품의 입찰에 있어 다음 각 호의 어느 하나의 사유로 인하여 불이익을 받았다고 인정되는 자는 「국가를 당사자로 하는 계약에 관한 법률」(이하 \"법\"이라 한다) 제28조제2항 및 제4항에서 정한 바에 따라 이의신청을 할 수 있다. 1. 법 제28조제1항 각 호의 어느 하나에 정한 사유2. 특례규정 제26조에서 정한 사유","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"기타사항","text":"제23조(기타사항) 입찰공고조건 및 이 유의서에 명시되지 아니한 기타의 사항에 대하여는 발주기관에서 정하는 바에 의한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-mulpum-bid:24","kind":"조문","type":"계약예규","family":"nca","label":"제24조","title":"재검토기한","text":"제24조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-mulpum-bid","group":"물품구매입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-yongyeok-gen","kind":"법령","type":"계약예규","family":"nca","label":"용역계약일반조건","name":"(계약예규) 용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 계약당사자간에 이행하여야 할 용역에 관한 계약조건을 정함을 목적으로 하며, 계약당사자는 이 예규에 정한 계약문서에 따라 신의와 성실의 원칙에 입각하여 계약을 이행하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"적용방법","text":"제2조(적용방법) ① 계약담당공무원은 계약체결시 제1장 총칙과 제2장에 정한 일반용역계약조건에 제3장 이하의 세부용역별 계약조건 중 해당 용역조건을 조합하여 계약서에 첨부하여야 한다. 이 경우 일반용역계약조건과 세부용역별 계약조건 중 상충되는 사항이 있는 때에는 세부용역별 계약조건을 우선적으로 적용한다.② 각 장에 정하지 아니한 용역의 경우에는 각 장의 용역중 유사한 용역의 계약조건을 준용할 수 있으며, 해당 용역의 특성상 다르게 정할 필요가 있는 경우에는 재정경제부장관과 협의하여 해당 용역의 이행을 위한 계약조건을 따로 정할 수 있다.\n제2장 일반용역계약조건(공통)","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"정의","text":"제3조(정의) 이 장에서 사용하는 용어의 정의는 다음과 같다.1. \"계약담당공무원\"이라 함은 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」(이하 \"시행규칙\"이라 한다) 제2조에 의한 공무원을 말한다. 이 경우 각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다.2. \"계약상대자\"라 함은 정부(이하 \"발주기관\"이라 한다)와 용역계약을 체결한 자연인 또는 법인을 말한다.3. \"기본업무\"라 함은 계약상대자가 수행하여야 하는 업무로서 과업내용서에 기재된 업무를 말한다.4. \"추가업무\"라 함은 계약목적의 달성을 위해 기본업무 외에 계약담당공무원이 추가하여 지시 또는 승인한 업무를 말한다.5. \"특별업무\"라 함은 계약목적외의 목적을 위해 계약특수조건 등에 특별업무항목으로 기재되거나 계약담당공무원이 그 수행을 지시 또는 승인한 용역항목으로서 제3호 및 제4호에 속하지 아니하는 업무를 말한다.6. 이 조건에서 따로 정하는 용어를 제외하고는 「국가를 당사자로 하는 계약에 관한 법률 시행령」, 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」(이하 각각 \"시행령\" 및 \"특례규정\"이라 한다), 「시행규칙」, 계약예규 「용역입찰유의서」(이하 \"유의서\"라 한다)에 정하는 바에 의한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"계약문서","text":"제4조(계약문서) ① 계약문서는 계약서, 유의서, 일반조건, 용역계약특수조건, 과업내용서 및 산출내역서로 구성되며 상호보완의 효력을 가진다. 다만, 이 경우 산출내역서는 이 조건에서 규정하는 계약금액의 조정 및 기성부분에 대한 대가의 지급시에 적용할 기준으로서 계약문서로서의 효력을 갖는다② 계약담당공무원은 「국가를 당사자로 하는 계약에 관한 법률」(이하 \"법률\"이라 한다.), 시행령, 시행규칙, 특례규정, 관계법령 및 이 조건에 정한 계약일반사항외에 해당 계약의 적정한 이행을 위하여 필요한 경우 용역계약특수조건을 정하여 계약을 체결할 수 있다.③ 제2항에 의하여 정한 용역계약특수조건에 법률, 시행령, 시행규칙, 특례규정, 관계법령 및 이 조건에 의한 계약상대자의 계약상 이익을 제한하는 특수조건의 해당내용은 효력이 인정되지 아니한다.④ 이 조건에서 정하는 바에 의하여 계약당사자간에 행한 통지문서등은 계약문서로서의 효력을 가진다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"사용언어","text":"제5조(사용언어) ① 계약을 이행함에 있어서 사용하는 언어는 한국어를 원칙으로 한다.② 계약담당공무원은 계약체결시 제1항에도 불구하고 필요하다고 인정하는 경우에는 계약이행과 관련하여 계약상대자가 외국어를 사용하거나 외국어와 한국어를 병행하여 사용할 수 있도록 필요한 조치를 할 수 있다.③ 제2항에 의하여 외국어와 한국어를 병행하여 사용한 경우에 외국어로 기재된 사항이 한국어와 상이한 경우에는 한국어로 기재한 사항이 우선한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"통지 등","text":"제6조(통지 등) ① 구두에 의한 통지ㆍ신청ㆍ청구ㆍ요구ㆍ회신ㆍ승인 또는 지시 등(이하 \"통지 등\"이라 한다)은 문서로 보완되어야 효력이 있다.② 통지 등의 장소는 계약서에 기재된 주소로 하며, 주소를 변경하는 경우에는 이를 즉시 계약당사자에게 통지하여야 한다.③ 통지 등의 효력은 계약문서에서 따로 정하는 경우를 제외하고는 계약당사자에게 도달한 날부터 발생한다. 이 경우 도달일이 공휴일인 경우에는 그 다음 날부터 효력이 발생한다.④ 계약당사자는 계약이행중 이 조건 및 관계법령 등에서 정한 바에 따라 서면으로 정당한 요구를 받은 경우에는 이를 성실히 검토하여 회신하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"채권양도","text":"제7조(채권양도) ① 계약상대자는 이 계약에 의하여 발생한 채권(대금 청구권)을 제3자(공동수급체 구성원 포함)에게 양도할 수 있다. ② 계약담당공무원은 제1항에 의한 채권양도와 관련하여 적정한 용역이행목적 등 필요한 경우에는 채권양도를 제한하는 특약을 정하여 운용할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"계약보증금","text":"제8조(계약보증금) ① 계약을 체결하고자 하는 자는 계약체결일까지 시행령 제50조에 정한 바에 따라 시행령 제37조제2항에 규정된 현금 또는 보증서 등으로 계약보증금을 납부하여야 한다.② 계약을 체결하려고 하는 자가 계약보증금의 전부 또는 일부의 납부를 면제받은 경우에는 제9조제1항에 의하여 국고귀속사유가 발생할 때에 계약보증금에 해당하는 금액을 현금으로 납입할 것을 보장하기 위하여 그 지급을 확약하는 내용의 문서(이하 \"계약보증금지급각서\"라 한다)를 제출하여야 한다.③ 계약상대자는 이 조건에 의하여 계약금액이 증액된 경우에는 이에 상응하는 금액의 계약보증금을 제1항에 따라 추가로 납부하여야 하며, 계약담당공무원은 계약금액이 감액된 경우에는 이에 상응하는 금액의 계약보증금을 반환해야 한다. ④ 계약담당공무원은 시행령 제37조제2항제2호에 의한 유가증권이나 현금으로 납부된 계약보증금을 계약상대자가 특별한 사유로 시행령 제37조제2항제1호 내지 제5호에 규정된 보증서 등으로 대체납부할 것을 요청한 때에는 동가치 상당액 이상으로 대체 납부하게 할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"계약보증금의 처리","text":"제9조(계약보증금의 처리) ① 계약담당공무원은 계약상대자가 정당한 이유없이 계약상의 의무를 이행하지 아니한 때에는 계약보증금을 국고에 귀속한다.② 시행령 제69조에 의한 장기계속용역계약에 있어서 계약상대자가 2차 이후의 용역계약을 체결하지 아니한 경우에는 제1항을 준용한다③ 제8조제2항에 의하여 계약보증금지급각서를 제출한 경우로서 계약보증금의 국고귀속사유가 발생하여 계약담당공무원의 납입요청이 있을 때에는 계약상대자는 해당 계약보증금을 지체없이 현금으로 납부하여야 한다.④ 제1항 및 제2항에 의하여 계약보증금을 국고에 귀속함에 있어서 그 계약보증금은 이를 기성부분에 대한 미지급액과 상계 처리할 수 없다. 다만, 계약보증금의 전부 또는 일부를 면제받은 자의 경우에는 국고에 귀속되는 계약보증금과 기성부분에 대한 미지급액을 상계 처리할 수 있다.⑤ 계약상대자가 납부한 계약보증금은 계약이 이행된 후에 계약상대자에게 계약상대자의 청구에 의하여 반환한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"용역계약에 있어서의 이행보증","text":"제10조(용역계약에 있어서의 이행보증) ① 계약담당공무원이 시행령 제52조제5항에 의하여 계약이행보증을 요구한 경우 계약상대자는 계약체결시 다음 각호의 방법 중 하나를 선택하여 계약의 이행을 보증하여야 한다. 1. 2. 계약보증금을 계약금액의 100분의 15이상으로 납부하는 방법 3. 시행령 제50조제1항 내지 제3항에 의한 계약보증금을 납부하지 아니하고 용역이행보증서(해당 계약상의 의무를 이행할 것을 보증한 기관이 계약상대자를 대신하여 계약상의 의무를 이행하지 아니하는 경우에는 계약금액의 100분의 40이상을 납부할 것을 보증하는 것이어야 한다)를 제출하는 방법② 계약담당공무원은 제1항에 따라 계약이행을 보증한 경우로서 계약상대자가 계약이행보증방법의 변경을 요청하는 때에는 1회에 한하여 계약이행 보증방법을 변경하게 할 수 있다. 1. 2. 3. ③ 1. 2. 3. 4. ④ ⑤ 제1항에 의한 용역이행보증서의 제출에 따른 보증이행 등에 대하여는 계약예규 「정부 입찰ㆍ계약 집행기준」 제13장(공사의 이행보증제도 운용)을 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"계약상대자의 근로자","text":"제11조(계약상대자의 근로자) ① 계약상대자는 해당 계약의 수행에 필요한 기술과 경험을 가진 근로자를 채용하여야 하며 근로자의 행위에 대하여 책임을을 져야 한다. 다만, 계약상대자가 근로자의 관리ㆍ감독에 상당한 주의와 의무를 다한 경우에는 그러하지 아니하다. ② 계약담당공무원은 계약상대자가 채용한 근로자가 다음 각호의 사유에 해당한다고 판단될 경우 해당 근로자의 교체를 요청할 수 있다. 1. 입찰공고 및 계약문서에서 특정한 기준을 갖춘 근로자를 배치할 것을 조건으로 명시한 계약에서 해당기준을 미달하는 근로자를 배치한 경우2. 고의 또는 중과실로 업무수행시 준수하여야 할 법령 또는 기준을 위반한 경우3. 뇌물ㆍ사기 등 부정행위를 한 경우4. 기타 제1호부터 제3호까지에 준하는 사유로서 계약의 적정성ㆍ공정성을 저해한 경우③ 계약상대자가 전항의 요청을 받은 경우 발주기관과 협의하여 해당 근로자의 교체여부를 결정하여야 한다.④ 계약상대자는 해당 계약의 이행을 위하여 채용한 근로자에 대하여 「최저임금법」 제6조제1항 및 제2항과 「근로기준법」 제43조를 준수하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"계약이행상황의 감독","text":"제12조(계약이행상황의 감독) ① 계약담당공무원은 해당 계약의 적정한 이행을 확보하기 위하여 필요하다고 인정할 때에는 계약문서에 의하여 스스로 감독하거나 소속공무원에게 그 사무를 위임하여 감독을 하여야 한다. 다만, 시행령 제54조 제1항 제2호의 전문적인 지식 또는 기술을 필요로 하거나 기타 부득이한 사유로 인하여 감독을 할 수 없는 경우에는 전문기관을 따로 지정하여 필요한 감독을 할 수 있다.② 제1항 단서에 의하여 전문기관이 감독을 하도록 할 경우에는 시행규칙 제67조, 제69조에 의하여 감독조서의 작성 및 그 결과를 문서로써 제출하도록 하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"용역의 착수 및 보고","text":"제13조(용역의 착수 및 보고) ① 계약상대자는 계약문서에서 정하는 바에 따라 용역을 착수하여야 하며, 발주기관이 관련법령에서 정한 서류 및 다음 각 호의 사항이 포함된 착수신고서의 제출을 요구하는 경우에는 이를 제출하여야 한다.1. 용역공정예정표2. 인력 및 장비투입계획서3. 기타 계약담당공무원이 지정한 사항② 계약상대자는 계약의 이행중에 과업내용의 변경 등으로 인하여 제1항에 의하여 제출한 서류의 변경이 필요한 때에는 관련서류를 변경하여 제출하여야 한다.③ 계약담당공무원은 제1항 및 제2항에 의하여 제출된 서류의 내용을 조정할 필요가 있다고 인정될 경우에는 계약상대자에게 이의 조정을 요구할 수 있다.④ 계약담당공무원은 용역의 전부 또는 일부의 진행이 지연되어 소정의 기간내에 수행이 불가능하다고 인정되는 경우에는 주간공정현황을 제출토록 하는 등 계약상대자에게 필요한 조치를 할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"휴일 및 야간작업","text":"제14조(휴일 및 야간작업) ① 계약상대자는 계약담당공무원의 계약기간 단축지시 및 발주기관의 부득이한 사유로 인하여 휴일 또는 야간작업을 지시하였을 때에는 추가비용을 청구할 수 있다. ② 제1항의 경우는 제17조를 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"물가변동으로 인한 계약금액의 조정","text":"제15조(물가변동으로 인한 계약금액의 조정) ① 물가변동으로 인한 계약금액의 조정은 시행령 제64조 및 시행규칙 제74조에서 정한 바에 의한다.② 동일한 계약에 대한 계약금액의 조정시 품목조정율 및 지수조정율을 동시에 적용하여서는 아니되며, 계약을 체결할 때에 계약상대자가 지수조정율 방법을 원하는 경우 외에는 품목조정율 방법으로 계약금액을 조정하도록 계약서에 명시하여야 한다. 이 경우 계약이행중 계약서에 명시된 계약금액 조정방법을 임의로 변경하여서는 아니된다.③ 제1항에 의하여 계약금액을 증액하는 경우에는 계약상대자의 청구에 의하여야 하고, 계약상대자는 제27조에 의한 완료대가(장기계속계약의 경우에는 각 차수별 완료대가) 수령전까지 조정신청을 하여야 조정금액을 지급받을 수 있으며, 조정된 계약금액은 직전의 물가변동으로 인한 계약금액조정기준일부터 90일이내에 다시 조정할 수 없다. 다만, 천재ㆍ지변 또는 원자재의 가격급등으로 해당 기간내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 인정되는 경우에는 계약을 체결한 날 또는 직전 조정기준일로부터 90일 이내에도 계약금액을 조정할 수 있다. ④ 계약상대자는 제3항에 의하여 계약금액의 증액을 청구하는 경우에는 계약금액조정내역서를 첨부하여야 한다.⑤ 계약담당공무원은 제1항 내지 제4항에 의하여 계약금액을 증액하는 경우에는 계약상대자의 청구를 받은 날부터 20일 이내에 계약금액을 조정하여야 한다. 이 때 예산배정의 지연 등 불가피한 경우에는 계약상대자와 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 증액할 수 있는 예산이 없는 때에는 업무량 등을 조정하여 그 대가를 지급할 수 있다. ⑥ 계약담당공무원은 제4항 및 제5항에 의한 계약상대자의 계약금액조정 청구내용이 일부 미비하거나 분명하지 아니한 경우에는 지체없이 필요한 보완요구를 하여야 하며, 이 경우 계약상대자가 보완요구를 통보받은 날부터 발주기관이 그 보완을 완료한 사실을 통지받은 날까지의 기간은 제5항에 의한 기간에 산입하지 아니한다. 다만, 계약상대자의 계약금액조정 청구내용이 계약금액 조정요건을 충족하지 않았거나 관련 증빙서류가 첨부되지 아니한 경우에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송하여야 하며, 이 경우 계약상대자는 그 반송사유를 충족하여 계약금액조정을 다시 청구하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:15의2","kind":"조문","type":"계약예규","family":"nca","label":"제15조의2","title":"기준 노임단가 변동 등에 따른 계약금액 조정","text":"제15조의2(기준 노임단가 변동 등에 따른 계약금액 조정) ① 제15조제1항부터 제3항까지의 규정에도 불구하고 시행규칙 제23조의3 각호의 용역계약에 있어 기준 노임단가 또는 최저임금이 변동된 경우 시행령 제64조제8항 및 제66조제2항에 따라 계약금액 조정을 한다.② 제1항에 따라 계약금액을 증액하는 경우에는 계약상대자의 청구에 의하여야 한다.③ 계약상대자는 제1항에 따라 계약금액이 증액된 경우 계약금액 중 노무비 증액분에 대하여는 근로자의 임금으로 지급하여야 한다.④ 제1항의 계약금액 조정의 경우 제15조 제4항부터 제6항까지의 규정을 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"과업내용의 변경","text":"제16조(과업내용의 변경) ① 계약담당공무원은 계약의 목적상 필요하다고 인정될 경우에는 다음 각호의 과업내용을 계약상대자에게 지시할 수 있다. 다만, 계약담당공무원은 과업내용을 추가할 경우에는 계약상대자와 사전에 협의하여야 한다. 1. 추가업무 및 특별업무의 수행2. 용역공정계획의 변경3. 특정용역항목의 삭제 또는 감소② 제1항에 의한 과업내용의 변경은 그 변경이 필요한 부분의 이행 전에 완료하여야 한다. 다만, 계약담당공무원은 계약이행의 지연으로 품질저하가 우려되는 등 긴급하게 용역을 수행하여야 할 필요가 있는 때에는 계약상대자와 협의하여 그 변경시기 등을 명확히 정하고, 과업내용의 변경을 완료하기 전에 우선 과업내용을 이행하게 할 수 있다.③ 계약상대자는 계약의 기본방침에 대한 변동없이 과업내용서상의 용역항목을 변경하는 것이 발주기관에 유리하다고 판단될 경우에는 제1항 각호에 해당하는 제안을 할 수 있다. 이 경우 계약담당공무원은 제안요청을 받은 날부터 14일이내에 그에 대한 승인여부를 계약상대자에게 통지하여야 한다.④ 제1항 및 제3항에 의하여 과업내용의 변경을 지시하거나 승인한 경우에 계약금액조정은 시행령 제65조제1항 내지 제6항을 준용한다. 다만, 계약담당공무원은 과업내용에 없는 과업을 추가 요구할 경우에는 정당한 대가를 지급하여야 한다. ⑤ 계약담당공무원은 제1항 내지 제4항에 의하여 계약금액을 조정하는 경우에는 계약상대자의 계약금액조정 청구를 받은 날부터 30일이내에 계약금액을 조정하여야 한다. 이 경우 예산배정의 지연 등 불가피한 경우에는 계약상대자와 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 조정할 수 있는 예산이 없는 때에는 업무량 등을 조정하여 그 대가를 지급할 수 있다.⑥ 계약담당공무원은 제5항에 의한 계약상대자의 계약금액조정 청구내용이 부당함을 발견한 때에는 지체없이 보완요구 등의 필요한 조치를 하여야 한다. 이 경우 계약상대자가 보완요구 등의 조치를 통보받은 날부터 발주기관이 그 보완을 완료한 사실을 통지받은 날까지의 기간은 제5항의 기간에 산입하지 아니한다.⑦ 제5항에 의한 계약상대자의 계약금액조정 청구는 제27조에 의한 완료대가(장기계속계약의 경우에는 각 차수별 완료대가) 수령전까지 하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"기타 계약내용의 변경으로 인한 계약금액의 조정","text":"제17조(기타 계약내용의 변경으로 인한 계약금액의 조정) ① 계약담당공무원은 용역계약에 있어서 제15조 및 제16조에 의한 경우 이외에 다음 각 호의 어느 하나의 사유로 인하여 계약금액을 조정할 필요가 있는 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위 내에서 이를 조정한다. 1. 최저임금법에 따른 최저임금을 시간당 노무비 단가로 정한 경우에 최저임금이 변경된 경우 2. 기타 계약내용이 변경된 경우 ② 제1항의 경우에는 시행령 제65조제6항을 준용한다.③ 제1항 및 제2항에 의한 계약금액조정의 경우에는 제16조제5항 내지 제7항을 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"지체상금","text":"제18조(지체상금) ① 계약상대자는 계약서에서 정한 용역수행기한내에 용역을 완성하지 아니한 때에는 매 지체일수마다 계약서에서 정한 지체상금율을 계약금액(장기계속용역계약의 경우에는 연차별 계약금액)에 곱하여 산출한 금액(이하 \"지체상금\"이라 한다.)을 현금으로 납부하여야 한다. 다만, 납부할 금액이 계약금액(제2항에 따라 기성부분 또는 기납부분에 대하여 검사를 거쳐 이를 인수한 경우에는 그 부분에 상당하는 금액을 계약금액에서 공제한 금액을 말한다)의 100분의 30을 초과하는 경우에는 100분의 30으로 한다. ② 계약담당공무원은 제1항의 경우에 제22조에 의하여 기성부분에 대한 검사를 거쳐 이를 인수(인수하지 아니하고 관리ㆍ사용하고 있는 경우를 포함한다. 이하 이조에서 같다)한 때에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 이 경우 기성부분의 인수는 그 성질상 분할할 수 있는 용역에 대한 완성부분으로 인수하는 것에 한한다.③ 계약담당공무원은 다음 각호의 어느 하나에 해당되어 용역수행이 지체되었다고 인정할 때에는 그 해당일수(제5호에 해당하는 경우에는 해당 일수의 1/2)를 제1항의 지체일수에 산입하지 아니한다. 1. 제24조에서 규정하는 불가항력의 사유에 의한 경우2. 발주기관의 책임으로 용역착수가 지연되거나 용역수행이 중단되었을 경우3. 4. 계약상대자의 부도 등으로 보증기관이 보증이행업체를 지정하여 보증이행할 경우5. 제49조에 따른 소프트웨어사업으로서 구현하고자 하는 기능의 범위에 대해 계약기간 내에 발주기관과 계약상대자간의 이견이 발생하여 과업내용을 조정함으로 인한 경우 6. 기타 계약상대자의 책임에 속하지 않는 사유로 인하여 지체된 경우④ ⑤ 제3항제4호에 의하여 지체일수에 산입하지 아니하는 기간은 발주기관으로부터 보증채무이행청구서를 접수한 날부터 보증이행개시일 전일까지(단, 30일이내에 한한다)로 한다.⑥ 제3항제5호에 따라 과업내용을 조정하고자 하는 경우에는 그에 따른 소요기간을 산정하고, 동 기간을 초과하는 일수에 대해서는 지체일수에 모두 산입한다. ⑦ 계약담당공무원은 제1항에 의한 지체일수를 다음 각호에 따라 산정하여야 한다.1. 용역수행기한내에 용역목적물 또는 용역완료보고서를 제출한 때에는 제20조에 의한 검사에 소요된 기간은 지체일수에 산입하지 아니한다. 다만, 용역수행기한 이후에 제20조제3항에 의한 시정조치를 한 때에는 시정조치를 한 날부터 최종 검사에 합격한 날까지의 기간(검사기간이 제20조에 정한 기간을 초과한 경우에는 동조에 정한 기간에 한한다. 이하 같다)을 지체일수에 산입한다.2. 용역수행기한을 경과하여 용역목적물 또는 용역완료보고서를 제출한 때에는 용역수행기한 다음 날부터 검사(시정조치를 한 때에는 최종 검사)에 합격한 날까지의 기간을 지체일수에 산입한다.3. 용역수행기한의 말일이 공휴일(관련 법령에 의하여 발주기관의 휴무일이거나 「근로자의 날 제정에 관한 법률」에 따른 근로자의 날(계약상대자가 실제 업무를 하지 아니한 경우에 한함)인 경우를 포함한다)인 경우 지체일수는 공휴일의 다음 다음날부터 기산한다. ⑧ 계약담당공무원은 제1항 내지 제5항에 의하여 산출된 지체상금을 계약상대자에게 지급될 대가, 대가지급지연에 대한 이자 또는 기타 예치금 등과 상계할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"계약기간의 연장","text":"제19조(계약기간의 연장) ① 계약상대자는 제18조제3항 각호의 사유(제5호 제외)가 계약기간내에 발생한 경우에는 계약기간 종료전에 지체없이 계약담당공무원에게 서면으로 계약기간의 연장신청과 동 연장으로 인하여 추가비용이 발생하는 경우에는 제4항에 의한 계약금액 조정신청을 함께 하여야 한다. 다만, 연장사유가 계약기간내에 발생하여 계약기간 경과후 종료된 경우에는 동 사유가 종료된 후 즉시 계약기간의 연장신청과 제4항에 의한 계약금액 조정신청을 함께 하여야 한다.② 계약담당공무원은 제1항에 의한 계약기간연장 신청이 접수된 때에는 즉시 그 사실을 조사 확인하고 해당 용역이 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다.③ 계약담당공무원은 제1항의 연장청구를 승인하였을 경우 동 연장기간에 대하여는 제18조에 의한 지체상금을 부과하여서는 아니된다.④ 제2항에 의하여 계약기간을 연장한 경우에는 제17조에 의하여 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 계약금액을 조정한다. 다만, 제18조제3항제4호의 사유에 의한 경우에는 그러하지 아니하다. ⑤ 계약담당공무원은 제1항 내지 제4항에도 불구하고 계약상대자의 의무불이행으로 인하여 발생한 지체상금이 시행령 제50조제1항에 의한 계약보증금상당액에 달한 경우라고 하더라도 계약목적물이 국가정책사업 대상이거나 계약의 이행이 노사분규 등 불가피한 사유로 인하여 지연된 때에는 계약기간을 연장할 수 있다.⑥ 제5항에 의한 계약기간의 연장은 지체상금이 계약보증금상당액에 달한 때에 하여야 하며, 연장된 계약기간에 대하여는 제18조에도 불구하고 지체상금을 부과하여서는 아니된다.⑦ 제2항 및 제5항에 따라 계약기간을 연장하는 경우 계약상대자는 계약기간 연장계약 체결전까지 계약기간 연장이 표시된 보증서 등을 발주기관에 제출하여야 한다. 다만, 보증서 등의 보증기간이 해당 계약의 실제 완료일 까지 유효한 것으로 약정된 경우에는 그러하지 아니한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"검사","text":"제20조(검사) ① 계약상대자는 용역을 완성하였을 때에는 그 사실을 계약담당공무원에게 서면으로 통지하고 필요한 검사를 받아야 한다. 기성부분에 대하여 완성 전에 대가의 전부 또는 일부를 지급받고자 할 때에도 또한 같다.② 계약담당공무원은 제1항의 통지를 받은 때에는 계약서 기타 관계서류에 의하여 통지를 받은 날부터 14일 이내에 그 이행을 확인하기 위한 검사(관련법령 또는 특수조건으로 정한 경우 및 필요하다고 인정하여 미리 서면으로 요청한 경우에는 계약상대자의 입회하에 실시한다)를 하여야 한다. 다만, 천재ㆍ지변 등 불가항력적인 사유로 인하여 검사를 완료하지 못한 경우에는 해당 사유가 존속되는 기간과 소멸된 날로부터 3일까지는 이를 연장할 수 있다.③ 계약담당공무원은 제2항의 검사에 있어서 계약상대자의 계약이행내용의 전부 또는 일부가 계약에 위반되거나 부당함을 발견한 때에는 필요한 시정조치를 하여야 한다. 이 경우에는 계약상대자로부터 그 시정을 완료한 사실을 통지받은 날로부터 제2항의 기간을 계산한다.④ 제3항에 의해 계약이행기간이 연장될 때에는 계약담당공무원은 제18조에 의한 지체상금을 부과하여야 한다.⑤ 계약상대자는 제2항에 의하여 검사에 입회하여야 하는 경우에는 이에 따라야 한다. 계약상대자가 입회를 거부하거나 검사에 협력하지 아니함으로써 발생하는 지체에 대하여는 제3항 및 제4항을 준용한다.⑥ 계약담당공무원은 검사를 완료한 때에는 그 결과를 계약상대자에게 서면으로 통지하여야 한다. 이 경우 계약상대자는 검사에 대한 이의가 있을 때에는 재검사를 요청할 수 있으며 계약담당공무원은 필요한 조치를 하여야 한다.⑦ 제2항에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 제2항의 14일을 7일로 본다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"인수","text":"제21조(인수) ① 계약담당공무원은 해당 용역의 특성상 계약목적물의 인수가 필요한 경우에는 계약상대자가 서면으로 인수를 요청하였을 때에는 제20조에 의한 검사를 실시하여 용역의 완성을 확인하고, 계약상대자가 서면으로 인수를 요청하였을 때에는 즉시 해당 용역목적물을 인수하여야 한다.② 계약담당공무원은 계약상대자가 제1항의 요청을 아니한 때에는 용역대가의 지급과 동시에 해당 용역목적물의 인도를 요구할 수 있다. 이 경우에 계약상대자는 지체없이 해당 목적물을 인도하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"기성부분의 인수","text":"제22조(기성부분의 인수) ① 계약담당공무원은 전체 계약목적물이 아닌 기성부분(성질상 분할할 수 있는 용역의 완성부분에 한한다)에 대하여 이를 인수할 수 있다.② 제1항의 경우에는 제21조를 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"일반적 손해","text":"제23조(일반적 손해) ① 계약상대자는 계약의 수행 중 용역목적물 및 제3자에 대한 손해를 부담하여야 한다. 다만, 그 손해가 계약상대자의 책임없는 사유로 인하여 발생한 경우에는 발주기관의 부담으로 한다.② 제21조 및 제22조에 의하여 인수한 계약목적물에 대한 손해는 발주기관이 부담하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:24","kind":"조문","type":"계약예규","family":"nca","label":"제24조","title":"불가항력","text":"제24조(불가항력) ① 불가항력이라 함은 태풍ㆍ홍수 기타 악천후(거친 날씨), 전쟁 또는 사변, 지진, 화재, 전염병, 폭동 기타 계약당사자의 통제범위를 벗어나는 사태(이하 \"불가항력의 사유\"라 한다)가 발생하여 용역수행에 직접적인 영향을 미친 경우로서 계약당사자 누구의 책임에도 속하지 아니하는 경우를 말한다. ② 제1항의 불가항력의 사유로 인하여 다음 각호에 발생한 손해는 발주기관이 부담하여야 한다.1. 제20조에 의한 검사를 완료한 기성부분2. 검사를 완료하지 아니한 부분 중 객관적인 자료(감독일지, 사진 또는 비디오테잎 등)에 의하여 이미 수행되었음이 판명된 부분3. 제23조제1항 단서 및 동조제2항에 의한 손해③ 계약상대자는 제1항 및 제2항의 사유가 발생하였을 경우에는 지체없이 그 사실을 계약담당공무원에게 통지하여야 하며, 계약담당공무원은 즉시 그 사실을 조사하고 그 손해의 상황을 확인한 후 그 결과를 계약상대자에게 통지하여야 한다.④ 계약담당공무원은 제3항에 의하여 손해의 상황을 확인하였을 때에는 별도의 약정이 없는 한 용역금액의 변경 또는 손해액의 부담 등에 대하여 계약상대자와 협의하여야 한다. 다만, 협의가 성립되지 않을 때에는 제36조에 따라 처리한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:25","kind":"조문","type":"계약예규","family":"nca","label":"제25조","title":"특허권 등의 사용","text":"제25조(특허권 등의 사용) 용역을 수행함에 있어 제3자의 권리의 대상으로 되어 있는 특허권 등을 사용할 때에는 계약상대자는 그 사용에 관한 일체의 책임을 져야 한다. 그러나 발주기관이 계약문서에 수행방법을 지정하지 아니하고 그 수행 또는 적용을 요구할 때에는 계약상대자에게 제반편의를 제공ㆍ알선하거나 소요된 비용을 지급할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:26","kind":"조문","type":"계약예규","family":"nca","label":"제26조","title":"기성대가의 지급","text":"제26조(기성대가의 지급) ① 계약상대자는 최소한 30일마다 검사를 완료하는 날까지 기성부분에 대한 대가지급청구서(하수급인에 대한 대금지급 계획을 첨부하여야 한다)를 발주기관에 제출할 수 있다. ② 계약담당공무원은 검사완료일부터 5일이내에 검사된 내용에 따라 기성대가를 확정하여 계약상대자에게 지급(「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통한 지급 포함. 이하 이 조에서 같다.)하여야 한다. 다만, 계약상대자가 검사완료일후에 대가의 지급을 청구한 때에는 그 청구를 받은 날부터 5일이내에 지급하여야 한다. ③ 계약담당공무원은 제2항에 따른 기성대가지급시 제1항의 대금지급 계획상의 하수급인에게 기성대가지급 사실을 통보하고 대금 수령내역(수령자, 수령액, 수령일 등) 및 증빙서류를 제출(「전자서명법」제2조에 따른 전자문서에 의한 제출을 포함한다)하게 하여야 한다. ④ 계약담당공무원은 제1항에 의한 청구서의 기재사항이 검사된 내용과 일치하지 아니할 때에는 그 사유를 명시하여 계약상대자에게 이의 시정을 요구하여야 한다. 이 경우 시정에 소요되는 기간은 제2항에서 규정한 기간에 산입하지 아니한다.⑤ 기성대가는 계약단가에 의하여 산정ㆍ지급한다.⑥ 기성대가 지급의 경우에는 제27조제4항을 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:26의2","kind":"조문","type":"계약예규","family":"nca","label":"제26조의2","title":"계약금액 조정 전의 기성대가 지급","text":"제26조의2(계약금액 조정 전의 기성대가 지급) ① 계약담당공무원은 물가변동, 설계변경 및 기타계약내용의 변경으로 인하여 계약금액이 당초 계약금액보다 증감될 것이 예상되는 경우로서 기성대가를 지급하고자 하는 경우에는「국고금관리법 시행규칙」제72조에 의하여 당초 산출내역서를 기준으로 산출한 기성대가를 개산급으로 지급할 수 있다. 다만, 감액이 예상되는 경우에는 예상되는 감액금액을 제외하고 지급하여야 한다.② 계약상대자는 제1항에 의하여 기성대가를 개산급으로 지급받고자 하는 경우에는 기성대가 신청시 개산급 신청사유를 서면으로 작성하여 첨부하여야 한다. ［본조신설 2025.12.31.］","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:27","kind":"조문","type":"계약예규","family":"nca","label":"제27조","title":"대가의 지급","text":"제27조(대가의 지급) ① 계약상대자는 용역을 완성한 후 제20조에 의한 검사에 합격한 때에는 대가지급청구서(하수급인에 대한 대금지급 계획을 첨부하여야 한다)를 제출하는 등 소정의 절차에 따라 대가지급을 청구할 수 있다. ② 계약담당공무원은 제1항의 청구를 받은 때에는 그 청구를 받은 날로부터 5일(공휴일 및 토요일은 제외한다. 이하 이조에서 같다) 이내에 그 대가를 지급(「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통한 지급 포함. 이하 이 조에서 같다.)하여야 하며, 동 대가지급기한에도 불구하고 자금사정 등 불가피한 사유가 없는 한 최대한 신속히 대가를 지급하여야 한다. 다만, 계약상대자와의 합의에 의하여 5일을 초과하지 아니하는 범위내에서 대가의 지급기간을 연장할 수 있는 특약을 정할 수 있다. ③ 계약담당공무원은 제2항에 따른 대가지급시 제1항의 대금지급 계획상의 하수급인에게 대가지급 사실을 통보하고 대금 수령내역(수령자, 수령액, 수령일 등) 및 증빙서류를 제출하게 하여야 한다. ④ 천재ㆍ지변 등 불가항력의 사유로 인하여 대가를 지급할 수 없게 된 경우에는 해당 사유가 존속되는 기간과 해당 사유가 소멸된 날로부터 3일까지는 대가의 지급을 연장할 수 있다.⑤ 계약담당공무원은 제1항의 청구를 받은 후 그 청구내용의 전부 또는 일부가 부당함을 발견한 때에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송할 수 있다. 이 경우에는 반송한 날로부터 재청구를 받은 날까지의 기간은 제2항의 지급기간에 이를 산입하지 아니한다.⑥ 제3항에 따라 통보 및 제출하는 경우에는 제26조제3항을 준용한다.⑦ 제2항에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 제2항의 5일을 3일로 본다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:27의2","kind":"조문","type":"계약예규","family":"nca","label":"제27조의2","title":"하도급대금 지급 확인","text":"제27조의2(하도급대금 지급 확인) ① 계약상대자는 제26조 및 제27조에 따른 대가를 지급받은 경우 15일 이내에 하도급대금을 하수급인에게 현금으로 지급하여야 하며, (다만, 「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통해서도 지급이 가능하며(이하 이 조에서 같다.), 이 경우 5일 이내에 지급하여야 한다.) 하도급대금의 지급 내역(수령자, 지급액, 지급일 등)을 5일(공휴일 및 토요일은 제외한다) 이내에 계약담당공무원에게 통보하여야 한다. ② 계약담당공무원은 제1항에 따른 대금지급내역을 제26조제3항 또는 제27조제3항에 따라 하수급인으로부터 제출받은 대금 수령내역과 비교ㆍ확인하여야 한다.③ 하도급거래 공정화에 관한 법률 제2조에 따라 동법의 적용을 받지 않는 하도급계약에 대해서는 제1항 및 제2항을 적용하지 아니한다.(제26조제3항 및 제27조제3항의 경우에도 같다)④ 제1항에 따라 통보하는 경우에는 제26조제3항을 준용한다. [동조신설 2011.5.13.]","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:27의3","kind":"조문","type":"계약예규","family":"nca","label":"제27조의3","title":"국민건강보험료 등의 사후정산","text":"제27조의3(국민건강보험료 등의 사후정산) 계약담당공무원은 「정부입찰ㆍ계약집행기준」 제93조에 의하여 국민건강보험료 등을 사후정산하기로 한 계약에 대하여는 제26조 및 제27조에 따른 대가 지급시 계약예규 「정부 입찰ㆍ계약 집행기준」 제94조에 따라 정산하여야 한다.[본조신설 2012.1.1.]","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:27의4","kind":"조문","type":"계약예규","family":"nca","label":"제27조의4","title":"노무비의 구분관리 및 지급확인","text":"제27조의4(노무비의 구분관리 및 지급확인) ① 시행규칙 제23조의3 각호의 용역계약의 경우 계약상대자는 발주기관과 협의하여 정한 노무비 지급기일에 맞추어 매월 모든 근로자(직접노무비 대상에 한하며, 하수급인이 고용한 근로자를 포함)의 노무비 청구내역(근로자 개인별 성명, 임금 및 연락처 등)을 제출하여야 한다.② 계약담당공무원은 제1항에 따른 노무비 청구내역을 확인하고 청구를 받은 날부터 5일 이내에 계약상대자의 노무비 전용계좌로 해당 노무비를 지급(「전자조달의 이용 및 촉진에 관한 법률」 제9조의2제1항에 따른 시스템을 통한 지급 포함. 이하 이 조에서 같다.)하여야 한다. ③ 계약상대자는 제2항에 따라 노무비를 지급받은 날부터 2일(공휴일 및 토요일은 제외한다) 이내에 노무비 전용계좌에서 이체하는 방식으로 근로자에게 노무비를 지급하여야 하며, 동일한 방식으로 하수급인의 노무비 전용계좌로 노무비를 지급하여야 한다. 다만, 근로자가 계좌를 개설할 수 없거나 다른 방식으로 지급을 원하는 경우 또는 계약상대자(하수급인 포함)가 근로자에게 노무비를 미리 지급하는 경우에는 그에 대한 발주기관의 승인을 받아 그러하지 아니할 수 있다.④ 계약상대자는 제1항에 따라 노무비 지급을 청구할 때에 전월 노무비 지급내역(계약상대자 및 하수급인의 노무비 전용계좌 이체내역 등 증빙서류)을 제출하여야 하며, 계약담당공무원은 동 지급내역과 계약상대자가 이미 제출한 같은 달의 청구내역을 비교하여 임금 미지급이 확인된 경우에는 해당 사실을 지방 고용노동(지)청에 통보하여야 한다.[본조신설 2017.12.28.]","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:28","kind":"조문","type":"계약예규","family":"nca","label":"제28조","title":"대가지급지연에 대한 이자","text":"제28조(대가지급지연에 대한 이자) ① 계약담당공무원은 대가지급청구를 받은 경우에 제26조 및 제27조에 따른 대가지급기한(국고채무부담행위에 의한 계약의 경우에는 다음 회계연도 개시 후에 「국가재정법」에 의하여 해당 예산이 배정된 날부터 20일)까지 대가를 지급하지 못하는 경우에는 지급기한의 다음날부터 지급하는 날까지의 일수(이하 \"대가지급지연일수\"라 한다)에 해당 미지급금액에  지연발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 금융기관 대출평균금리를 말한다)를 곱하여 산출한 금액을 이자로 지급하여야 한다.② 천재ㆍ지변 등 불가항력의 사유로 인하여 검사 또는 대가지급이 지연된 경우에는 제20조제2항 단서 및 제27조제4항에 의한 연장기간은 제1항의 대가지급지연일수에 산입하지 아니한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:29","kind":"조문","type":"계약예규","family":"nca","label":"제29조","title":"계약상대자의 책임있는 사유로 인한 계약의 해제 또는 해지","text":"제29조(계약상대자의 책임있는 사유로 인한 계약의 해제 또는 해지) ① 계약담당공무원은 계약상대자가 다음 각호의 어느 하나에 해당하는 경우에는 해당 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 다만, 제3호의 경우에는 계약상대자의 계약이행 가능성이 있고 계약을 유지할 필요가 있다고 인정되는 경우로서 계약상대자가 계약이행이 완료되지 아니한 부분에 상당하는 계약보증금(당초 계약보증금에 제18조제1항에 따른 지체상금의 최대금액을 더한 금액을 한도로 한다)을 추가납부하는 때에는 계약을 유지한다. 1. 정당한 이유없이 약정한 착수기일을 경과하고도 용역수행에 착수하지 아니할 경우2. 계약상대자의 책임있는 사유로 인하여 용역수행기한까지 해당 용역을 완료하지 못하거나 완료할 가능성이 없다고 인정될 경우3. 제18조제1항에 의한 지체상금이 시행령 제50조제1항에 의한 해당 계약(장기계속용역계약인 경우에는 차수별 계약)의 계약보증금상당액에 달한 경우4. 장기계속용역의 계약에 있어서 제2차 용역이후의 계약을 체결하지 아니하는 경우5. 계약의 수행중 뇌물수수 또는 정상적인 계약관리를 방해하는 불법ㆍ부정행위가 있는 경우6. 해당 계약이행과 관련하여 계약상대자가 「최저임금법」제6조제1항 및 제2항 또는 「근로기준법」 제43조를 위반하여 「최저임금법」 제28조 또는 「근로기준법」 제109조에 따라 처벌을 받은 경우(다만, 지체없이 시정된 경우에는 그러하지 아니한다)7. 입찰에 관한 서류 등을 허위 또는 부정한 방법으로 제출하여 계약이 체결된 경우8. 「정부입찰ㆍ계약 집행기준」 제36조제2항에 따른 선금사용내역서를 확인한 결과, 선금의 반복적인 목적 외 사용으로 계약 이행에 상당한 지장을 초래할 것이 명백한 경우 9. 기타 계약조건을 위반하고 그 위반으로 인하여 계약의 목적을 달성할 수 없다고 인정될 경우② 계약담당공무원은 제1항에 의하여 계약을 해제 또는 해지한 때에는 그 사실을 즉시 계약상대자에게 통지하여야 한다.③ 계약담당공무원은 제1항에 의하여 계약을 해제 또는 해지한 경우 및 제33조에 의하여 보증기관이 보증이행을 하는 경우에 기성부분을 검사하여 인수하는 때에는 인수한 날로부터 14일 이내에 해당 부분에 상당하는 대가를 계약상대자에게 지급하여야 한다. ④ 계약상대자는 제1항에 의하여 계약이 해제 또는 해지되는 경우에는 지급받은 선금에 대하여 미정산잔액이 있는 경우에는 그 잔액에 대한 약정이자상당액[사유발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 금융기관 대출평균금리를 말한다)에 의하여 산출한 금액]을 가산하여 발주기관에 상환하여야 한다. 이 경우 계약담당공무원은 상환할 금액과 기성부분의 대가를 상계할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:30","kind":"조문","type":"계약예규","family":"nca","label":"제30조","title":"사정변경에 의한 계약의 해제 또는 해지","text":"제30조(사정변경에 의한 계약의 해제 또는 해지) ① 계약담당공무원은 제29조제1항 각호의 경우외에 다음 각 호의 사유와 같이 객관적으로 명백한 발주자의 불가피한 사정이 발생한 때에는 계약을 해제 또는 해지할 수 있다. 1. 정부정책 변화 등에 따른 불가피한 사업취소2. 관계 법령의 제ㆍ개정으로 인한 사업취소3. 과다한 지역 민원 제기로 인한 사업취소4. 기타 공공복리에 의한 사업의 변경 등에 따라 계약을 해제 또는 해지하는 경우.② 제1항에 의하여 계약을 해제 또는 해지한 경우에는 제29조제2항을 준용한다.③ 계약담당공무원은 제1항에 의하여 계약을 해제 또는 해지할 경우에는 다음 각호에 해당하는 금액을 해제 또는 해지한 날부터 14일이내에 계약상대자에게 지급하여야 한다. 이 경우 제8조에 의한 계약보증금을 동시에 반환하여야 한다.1. 제24조제2항제1호 및 제2호에 해당하는 부분 중 대가를 지급하지 아니한 금액2. 전체용역의 완성을 위하여 계약의 해제 또는 해지일 이전에 투입된 계약상대자의 인력ㆍ자재 및 장비의 철수비용④ 계약상대자는 선금에 대한 미정산잔액이 있는 경우에는 이를 발주기관에 상환하여야 한다. 이 경우에는 미정산잔액에 대한 이자는 가산하지 아니한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:31","kind":"조문","type":"계약예규","family":"nca","label":"제31조","title":"계약상대자에 의한 계약의 해제 또는 해지","text":"제31조(계약상대자에 의한 계약의 해제 또는 해지) ① 계약상대자는 다음 각호의 어느 하나에 해당하는 사유가 발생한 경우에는 해당 계약을 해제 또는 해지할 수 있다.1. 제16조에 의한 계약내용의 변경으로 계약금액이 100분의 40이상 감소되었을 때2. 제32조에 의한 용역수행정지기간이 계약기간의 100분의 50을 초과하였을 경우② 제1항에 의하여 계약이 해제 또는 해지되었을 경우에는 제30조제3항 및 4항을 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:32","kind":"조문","type":"계약예규","family":"nca","label":"제32조","title":"용역의 일시정지","text":"제32조(용역의 일시정지) ① 계약담당공무원은 다음 각호의 경우에는 용역의 전부 또는 일부의 수행을 정지시킬 수 있다. 이 경우 계약상대자는 정지기간중 선량한 관리자의 주의의무를 해태하여서는 아니된다. 1. 용역의 수행이 계약내용과 일치하지 아니하는 경우2. 안전을 위해 용역의 전부 또는 일부의 정지가 필요한 경우3. 기타 발주기관의 필요에 의하여 계약담당공무원이 지시한 경우② 계약담당공무원은 제1항에 의하여 용역을 정지시킨 경우에는 계약상대자에게 정지사유 및 정지기간을 지체없이 통지하여야 한다.③ 제1항에 의하여 용역이 정지된 경우에는 계약상대자는 계약기간의 연장 또는 추가금액을 청구할 수 없다. 다만, 계약상대자의 책임있는 사유로 인한 정지가 아닌 때에는 그러하지 아니한다.④ 발주기관의 책임있는 사유에 의한 용역정지기간(각각의 사유로 인한 정지기간을 합산하며, 장기계속계약의 경우에는 해당 차수내의 정지기간을 말함)이 60일을 초과한 경우 계약담당공무원은 그 초과된 기간에 대하여 잔여계약금액(용역중지기간이 60일을 초과하는 날 현재의 잔여계약금액을 말하며, 장기계속계약의 경우에는 차수별 계약금액을 기준으로 함)에 초과일수 매 1일마다 지연발생시점의 금융기관 대출평균금리(한국은행 통계월보상의 금융기관 대출평균금리를 말한다)를 곱하여 산출한 금액을 준공대가 지급시 계약상대자에게 지급하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:32의2","kind":"조문","type":"계약예규","family":"nca","label":"제32조의2","title":"계약상대자의 용역정지 등","text":"제32조의2(계약상대자의 용역정지 등) ① 계약상대자는 발주기관이 「국가를 당사자로 하는 계약에 관한 법령」과 계약문서 등에서 정하고 있는 계약상의 의무를 이행하지 아니하는 때에는 발주기관에 계약상의 의무이행을 서면으로 요청할 수 있다.② 계약담당공무원은 제1항에 의하여 계약상대자의 통지를 받은 날로부터 14일이내에 이행계획을 계약상대자에게 서면으로 통지하여야 한다.③ 계약상대자는 계약담당공무원이 제2항에 의한 기간내에 통지를 하지 않거나 계약상의 의무이행을 거부하는 때에는 해당 기간이 경과한 날 또는 의무이행을 거부한 날부터 용역의 전부 또는 일부의 이행을 정지할 수 있다.④ 계약상대자는 현장여건이 안전에 긴급한 위험 요소가 있다고 판단될 경우 발주기관에 작업의 중지를 서면으로 요청할 수 있다.⑤ 계약담당공무원은 제4항에 의한 요청이 있는 경우 그 내용을 검토하여 작업의 중지 등 필요한 조치를 하여야 한다.⑥ 계약담당공무원은 제3항 및 제5항에 의하여 정지된 기간에 대하여는 제19조에 따라 계약기간을 연장하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:33","kind":"조문","type":"계약예규","family":"nca","label":"제33조","title":"용역계약에 있어서의 이행보증","text":"제33조(용역계약에 있어서의 이행보증) ① 계약담당공무원은 계약상대자가 제10조제1항 또는 제5항에 의하여 계약이행보증을 한 경우로서 계약상대자가 제29조제1항 각호의 어느 하나에 해당하는 때에는 계약을 해제 또는 해지하지 아니하고 제10조에 의한 보증기관에게 해당 용역을 이행할 것을 청구하여야 한다. ② 제1항의 청구가 있을 때에는 보증기관은 지체없이 그 보증의무를 이행하여야 한다. 다만, 보증기관은 보증이행업체를 지정하여 보증의무를 이행하는 대신 용역이행보증서에 정한 금액을 현금으로 발주기관에 납부함으로써 보증의무이행에 갈음할 수 있다. ③ 제2항에 의하여 해당 계약을 이행하는 보증기관은 계약금액 중 보증이행부분에 상당하는 금액을 계약담당공무원에게 직접 청구할 수 있으며, 계약상대자는 보증기관의 보증이행부분에 상당하는 금액을 청구할 수 없다. ④ ⑤ 제1항 내지 제3항 외에 용역이행보증서 제출에 따른 보증의무이행에 대하여는 계약예규 「정부 입찰ㆍ계약 집행기준」 제13장(공사의 이행보증제도 운용)을 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:34","kind":"조문","type":"계약예규","family":"nca","label":"제34조","title":"부정당업자의 입찰참가자격제한","text":"제34조(부정당업자의 입찰참가자격제한) ① 계약상대자가 시행령 제76조에 해당하는 경우에는 1월 이상 2년 이하의 범위 내에서 입찰참가자격 제한 조치를 받게 된다. ②","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:35","kind":"조문","type":"계약예규","family":"nca","label":"제35조","title":"기술지식의 이용 및 비밀엄수 의무","text":"제35조(기술지식의 이용 및 비밀엄수 의무) ① 계약담당공무원은 사업목적 달성 또는 공공의 이익 등을 위해 필요하다고 인정되는 경우, 계약내용에 따라 계약상대자가 제출하는 각종 보고서, 정보, 기타 자료 및 이에 의하여 얻은 기술지식(계약목적물의 내용에 포함되는 경우는 제외한다. 이하 이 조에서 \"기술지식 등\"이라 한다)의 전부 또는 일부를 계약상대자의 승인을 얻어 복사, 이용 또는 공개할 수 있다.② 계약상대자는 해당 계약을 통하여 얻은 정보 또는 국가의 기밀사항을 계약이행의 전후를 막론하고 외부에 누설할 수 없다.③ 계약상대자는 용역을 수행함에 있어 발생한 제반 문제점 및 개선방안 등을 문서로 작성ㆍ비치하고, 발주기관의 제출요구가 있을 경우에는 이에 따라야 한다.④ 계약담당공무원은 시장에서 거래되는 등 재산적 가치가 있는 기술지식 등을 제1항에 따라 복사ㆍ이용 또는 공개하려는 경우에는 계약상대자에게 정당한 이용대가를 지급하여야 한다. 이 경우 기술지식 등의 이용대가는 시장거래가격 등을 기초로 계약상대자와 협의하여 결정한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:35의2","kind":"조문","type":"계약예규","family":"nca","label":"제35조의2","title":"계약목적물의 지식재산권 귀속 등","text":"제35조의2(계약목적물의 지식재산권 귀속 등) ① 해당 계약에 따른 계약목적물에 대한 지식재산권은 발주기관과 계약상대자가 공동으로 소유한다② 지식재산권과 관련한 기타사항은 제56조를 준용한다.[본조신설 2014.1.10.]","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:35의3","kind":"조문","type":"계약예규","family":"nca","label":"제35조의3","title":"계약목적물의 특허권 등의 귀속 등에 대한 특례","text":"제35조의3(계약목적물의 특허권 등의 귀속 등에 대한 특례) ① 해당 계약에 따른 계약목적물에 대한 지식재산권 중 특허권, 실용신안권, 디자인권(이하 \"특허권 등\"이라 한다. 특허권 등을 받을 수 있는 권리를 포함한다. 이하 같다)은 계약의 목적, 개발의 기여도(발주기관과 계약상대자의 공동 개발 등), 기술개발 결과물의 활용 및 사업화를 고려하여 계약당사자간 협의를 통해 특허권 등에 대한 귀속주체, 지분 등을 정할 수 있다. 다만, 계약의 특수성(국가안전보장, 국방, 외교관계, 정보보안, 계약상대자의 소재지 등)을 고려하여 계약당사자간의 협의를 통해 발주기관 단독으로 소유할 수 있다.② 제1항에 의하여 특허권 등을 계약상대자가 단독으로 소유하거나 발주기관과 계약상대자가 공동으로 소유하고 계약상대자가 공동수급체인 경우에는 해당 특허권 등에 대한 소유권, 지분 등은 공동수급체 구성원간의 협의를 통해 지분 등을 정할 수 있다.③ 제1항에 의하여 계약상대자가 특허권 등을 소유하는 경우에는 다음 각 호의 조치를 하여야 한다.1. 국내 또는 국외에서 출원하거나 등록하는 특허권 등의 경우에는 특허권 등 출원서 또는 등록신청서와 그 사실을 증명할 수 있는 서류를 출원 또는 등록 후 6개월 이내에 발주기관에 제출할 것2. 국내 또는 국외에서 등록된 특허권 등의 포기로 권리가 소멸되는 경우에는 그 권리 소멸일 전에 그 사실을 발주기관에 통보할 것④ 특허권 등과 관련한 기타사항은 제56조를 준용한다.[본조신설 2015.1.1.]","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:35의4","kind":"조문","type":"계약예규","family":"nca","label":"제35조의4","title":"계약목적물의 직무발명에 대한 권리의 승계","text":"제35조의4(계약목적물의 직무발명에 대한 권리의 승계) 계약상대자는 해당 계약체결 후에 그 계약에 따른 직무발명에 대한 권리를 계약상대자의 임직원으로부터 계약상대자에게 귀속시키고 정당한 보상을 실시한다는 취지의 근무규정 또는 직무발명계약(이하 ‘직무발명규정 등’이라 한다)을 신속히 정하여 발주기관에 제출하여야 한다. 다만, 계약상대자가 이미 그 직무발명규정 등이 있는 경우에는 그 내용을 발주기관에 제출하여야 한다.[본조신설 2015.1.1.]","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:36","kind":"조문","type":"계약예규","family":"nca","label":"제36조","title":"분쟁의 해결","text":"제36조(분쟁의 해결) ① 계약의 수행중 계약당사자간에 발생하는 분쟁은 협의에 의하여 해결한다.② 제1항에 의한 협의가 이루어지지 아니할 때에는 법원의 판결 또는 「중재법」에 의한 중재에 의하여 해결한다. 다만 「국가를 당사자로 하는 계약에 관한 법률」제28조에서 정한 이의신청 대상에 해당하는 경우 국가계약분쟁조정위원회 조정결정에 따라 분쟁을 해결할 수 있다. ③ 제2항에도 불구하고 계약을 체결하는 때에 「국가를 당사자로 하는 계약에 관한 법률」제28조의2에 따라 분쟁해결방법을 정한 경우에는 그에 따른다. ④ 계약상대자는 제1항부터 제3항까지의 분쟁처리절차 수행기간중 용역의 수행을 중지하여서는 아니된다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:37","kind":"조문","type":"계약예규","family":"nca","label":"제37조","title":"용역관련자료의 제출 등","text":"제37조(용역관련자료의 제출 등) 계약담당공무원은 필요하다고 인정하는 경우 계약상대자에게 산출내역서의 기초가 되는 단가산출서 등의 제출을 요구할 수 있으며 이 경우 계약상대자는 이에 따라야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:38","kind":"조문","type":"계약예규","family":"nca","label":"제38조","title":"적격심사관련사항 이행","text":"제38조(적격심사관련사항 이행) ① 계약상대자는 시행령 제42조제1항에 따라 낙찰된 용역을 수행함에 있어 계약예규 「적격심사기준」(발주기관의 장이 직접 적격심사기준을 작성한 경우에는 동 심사기준) 별표의 심사항목에 규정된 사항에 대하여 적격심사시 제출한 내용대로 이행하여야 한다.② 계약담당공무원은 제1항에 따른 이행사항의 준수여부를 수시로 확인하여야 하며, 제출된 내용대로 이행이 되지 않고 있을 때에는 즉시 시정토록 조치하여야 한다.③ 계약상대자는 계약예규「적격심사기준」제5조제3항 및 「협상에 의한 계약체결기준」제7조제1항에 따른 외주근로자 근로조건의 이행여부 확인에 필요한 임금지급 명세서, 보험료 납입증명서 등 관련 서류를 매 분기별로 제출하여야 한다. ④ 계약담당공무원은 계약상대자가 정당한 사유없이 제3항의 서류를 제출하지 않거나 외주근로자 근로조건을 이행하지 않은 경우에는 계약상대자를 전자조달시스템에 게재하고 동 사실을 계약상대자에게 통보하여야 한다. 다만, 계약담당공무원이 시정을 요구한 날로부터 10일 이내에 해당 근로조건을 이행하고 관련 서류를 제출한 경우에는 그러하지 아니하다.\n제3장 시공 단계의 건설사업관리용역 계약조건","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:39","kind":"조문","type":"계약예규","family":"nca","label":"제39조","title":"정의","text":"제39조(정의) 이 장에서 사용하는 용어의 정의는 다음과 같다.1. \"시공 단계의 건설사업관리용역\"이라 함은 「건설기술 진흥법」 제39조제2항에 의한 건설사업관리 또는 감리용역을 말한다. 2. \"감독 권한대행 등 건설사업관리\"라 함은 「건설기술 진흥법」 제2조제5호에 의한 발주기관이 발주하는 일정한 건설공사에 대하여 「건설기술 진흥법」 제26조에 의한 건설사업관리용역업자가 해당 공사의 설계도서, 기타 관계서류의 내용대로 시공되는지의 여부를 확인하고 품질관리, 시공관리, 공정관리, 안전 및 환경관리 등에 대한 기술지도를 하며, 발주기관의 위탁에 의하여 관계법령에 따라 발주기관의 감독 권한을 대행하는 것을 말하며, 감독 권한대행 등 건설사업관리는 총공사비가 200억원 이상인 건설사업관리 대상공사 전부에 대하여 시행하는 감독 권한대행 등 건설사업관리 외에 계약단위별 건설공사중 교량, 터널, 배수문 등 건설공사 중 부분적으로 감독 권한대행 업무를 포함하는 건설사업관리로 구분한다. 3. \"건설사업관리용역업자\"라 함은  「건설기술 진흥법 시행령」 [별표5]에 따른 건설사업관리를 업으로 하고자 「건설기술 진흥법」 제26조에 따라 건설공사에 대한 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ도지사 또는 특별자치도지사에게 건설기술용역업자로 등록한 자를 말한다. 4. \"건설사업관리기술자\"라 함은 일정한 자격을 갖추고 「건설기술 진흥법」 제26조에 따른 건설사업관리용역업자에 소속되어 건설사업관리 업무를 수행하는 자를 말한다. 5. \"책임건설사업관리기술자\"라 함은 발주기관과 체결된 건설사업관리 용역계약에 의하여 건설사업관리용역업자를 대표하며 해당공사의 현장에 상주하면서 해당공사의 건설사업관리업무를 총괄하는 자를 말한다. 6. \"분야별 건설사업관리기술자\"라 함은 소관 분야별로 책임건설사업관리기술자를 보좌하여 건설사업관리 업무를 수행하는 자로서, 담당 건설사업관리업무에 대하여 책임건설사업관리기술자와 연대하여 책임지는 자를 말한다. 7. \"상주 건설사업관리기술자\"라 함은 「건설기술 진흥법 시행규칙」 제34조제1항에 규장된 바에 따라 현장에 상주하면서 건설사업관리업무를 수행하는 자를 말한다. 8. \"기술지원 건설사업관리기술자\"이라 함은 「건설기술 진흥법 시행규칙」 제34조제1항에 규정된 바에 따라 상주 건설사업관리기술자의 업무를 지원하는 자를 말한다. 9. \"공사감독자\"이라 함은 재정경제부 계약예규 「공사계약일반조건」 제16조의 업무를 수행하기 위하여 발주기관이 임명한 기술직원 또는 그의 대리인으로 해당 공사 전반에 관한 감독업무를 수행하고 건설사업관리업무를 총괄하는 사람을 말한다. 10. \"공사관리관\"이라 함은 감독 권한대행 등 건설사업관리를 시행하는 건설공사에 대하여 「건설기술 진흥법 시행령」 제56조제1항제1호부터 제4호까지의 업무를 수행하는 발주기관의 소속 직원을 말한다. 11. \"설계자\"라 함은 설계용역계약의 계약상대자를 말한다.12. \"시공자\"라 함은 공사계약의 계약상대자를 말한다.13. \"건설사업관리 업무수행지침\"이라 함은 「건설기술 진흥법 시행령」 제59조제제1항 각 호의 건설사업관리 업무범위 중 계약으로 정한 업무범위에 해당하는 단계의 업무내용을 효율적으로 수행하게 하기 위하여 국토교통부장관이 정하여 고시한 「건설공사 사업관리방식 검토기준 및 업무수행지침」 제3장 ‘건설사업관리 업무’를 말한다. 14. 이 장에 따로 정하는 경우를 제외하고는 「건설기술 진흥법」 및 「건설사업관리 업무수행지침」에 정하는 바에 의한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:40","kind":"조문","type":"계약예규","family":"nca","label":"제40조","title":"계약문서","text":"제40조(계약문서) ① 시공 단계의 건설사업관리용역계약에 있어서는 제4조에 의한 계약문서외에 「건설사업관리 업무지침」이 계약문서에 포함되며 다른 계약문서와 상호보완의 효력을 가진다. ② 시공 단계의 건설사업관리용역계약의 대상이 되는 공사의 계약문서는 제1항의 계약문서와 보완적인 효력을 가진다. 계약담당공무원은 계약예규 「공사계약일반조건」제3조에 정한 공사계약문서 일체를 계약상대자에게 제공하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:41","kind":"조문","type":"계약예규","family":"nca","label":"제41조","title":"계약상대자의 손해배상책임","text":"제41조(계약상대자의 손해배상책임) ① 계약상대자는 이 조건에서 규정하는 책임과 의무의 위반, 법령의 위반, 부주위한 행위 또는 과실로 인하여 발주기관, 시공자, 제3자 등에게 손해를 끼친 경우에는 그 손해를 배상하여야 한다.② 계약상대자는 제1항에 규정된 배상책임을 담보할 수 있는 손해보험 또는 공제에 가입하여야 한다. 이 경우 보험료는 발주기관이 부담하되, 시중의 일반적인 요율을 초과하는 금액에 대하여는 계약상대자가 부담하여야 한다.③ 제2항의 보험에는 발주기관과 계약상대자를 공동피보험자로 기명하여야 한다.④ 보험가입기간 및 가입금액은 「건설기술진흥법시행령」제50조에 정한 바에 따라야 한다. ⑤ 제1항에 의한 계약상대자의 배상책임은 제4항에서 규정한 보험가입금액을 상한으로 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:42","kind":"조문","type":"계약예규","family":"nca","label":"제42조","title":"계약담당공무원 및 감리원의 기본임무","text":"제42조(계약담당공무원 및 감리원의 기본임무) ① 계약담당공무원은 시공 단계의 건설사업관리용역 수행과 관련하여 다음 각호의 기본임무를 수행하여야 한다. 1. 계약담당공무원은 건설공사의 계획ㆍ설계ㆍ발주ㆍ건설사업관리ㆍ시공ㆍ사후평가 전반을 총괄하고, 건설사업관리 및 시공계약 이행에 필요한 다음 각호의 사항을 지원, 협력하여야 하며 시공 단계의 건설사업관리용역 계약에 규정된 바에 따라 건설사업관리가 성실히 수행되고 있는지에 대한 지도ㆍ점검을 실시하여야 한다. 가. 건설사업관리 및 시공에 필요한 설계도면, 문서, 참고자료와 건설사업관리 용역계약문서에 명기한 자재ㆍ장비ㆍ비품ㆍ설비의 제공 나. 건설공사 시행에 따른 업무연락, 문제점 파악 및 민원해결다. 건설공사 시행에 필요한 용지 및 지장물 보상과 국가, 지방자치단체, 기타 공공기관의 허가ㆍ인가 등의 처분을 얻을 수 있도록 조치 또는 협력라. 건설사업관리기술자가 시공 단계의 건설사업관리계약 이행에 필요한 시공자의 문서, 도면, 자재, 장비, 설비, 직원 등에 대한 자료제출 및 조사의 보장 마. 건설사업관리기술자가 보고한 설계변경, 준공기한 연기요청, 그 밖에 현장 실정보고 등에 대하여 건설사업관리업무 수행에 지장이 없도록 의사를 결정하여 통보 바. 특수공법 등 주요공종에 대해 외부 전문가의 자문ㆍ건설사업관리가 필요하다고 인정되는 경우에는 별도 조치 사. 기타 건설사업관리용역업자와 계약으로 정한 사항 등 시공 단계의 건설사업관리용역 발주자로서의 감독업무 2. 계약담당공무원은 관계법령에서 별도로 정하는 사항 및 제1호에서 정하는 사항 외에는 정당한 사유 없이 건설사업관리기술자의 업무에 개입 또는 간섭하거나 건설사업관리기술자의 권한을 침해할 수 없다. 3. 계약담당공무원은 특별한 사유가 없는 한 건설공사를 착공하기 전에 설계도서 검토 등의 건설사업관리업무를 수행하기 위하여 필요한 기간을 확보하여야 하며, 공사 준공처리, 사후관리 등을 위하여 공사준공 후 일정기간 건설사업관리업무를 수행하게 하여야 한다. ② 건설사업관리기술자는 다음 각 호의 기본임무를 수행하여야 한다.1. 「건설기술 진흥법 시행령」 제59조의 업무와 「건설기술 진흥법 시행규칙」 제34조에 의한 건설사업관리기술자의 업무를 성실히 수행하여야 한다. 2. 발주기관과 건설사업관리용역업자간에 체결된 시공 단계의 건설사업관리용역 계약의 내용에 따라 건설사업관리기술자는 해당 공사가 설계도서 및 기타 관계서류의 내용대로 시공되는지의 여부를 확인하고 품질관리, 시공관리, 공정관리, 안전 및 환경관리 등에 대한 기술지도를 하며, 발주기관의 위탁에 의하여 관계법령에 따라 발주기관의 감독 권한을 대행하여야 한다. 3. 검측업무를 수행하는 건설사업관리기술자는 감리원의 지시에 따라 해당 공사의 특성, 공사의 규모 및 현장조건을 고려하여 현장별로 수립한 검측체크리스트에 따라 관련법령, 설계도서 및 계약서 등의 내용대로 시공되는지 시설물의 각 공종마다 육안검사ㆍ측량ㆍ입회ㆍ승인ㆍ시험 등의 방법으로 검측업무를 수행하여야 한다. 4. 시공자가 검측업무를 요청할 경우에는 즉시 검측업무를 수행하고 그 결과를 시공자에게 통보하여야 한다.5. 계약예규 「공동계약운용요령」 제13조제1항에 따라 제출된 계약이행계획서에 따라 공동수급체 구성원이 실제 계약이행에 참여하고 있는지를 확인ㆍ감독하여야 한다.6. 하도급대금, 건설기계대여금, 건설공사용 부품 대금이「건설산업기본법」제34조제1항 등에 따라 적정하게 지급 되는지를 확인ㆍ감독하여야 한다. 7. 건설사업관리기술자는 해당 공사의 규모와 현장조건을 해당 공사의 규모와 현장조건을 고려한 『검측업무지침』을 현장별로 작성ㆍ수립하여 발주청의 승인을 받은 후 이를 근거로 검측업무를 수행하여야 하며. 다만, 「검측업무지침」은 검측하여야 할 세부공종, 검측절차, 검측시기 또는 검측빈도, 검측체크리스트 등의 내용을 포함하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:43","kind":"조문","type":"계약예규","family":"nca","label":"제43조","title":"건설사업관리기술자의 근무수칙","text":"제43조(건설사업관리기술자의 근무수칙) ① 건설사업관리업무에 종사하는 자는 다음 각 호의 업무를 성실히 수행하고, 건설공사의 품질향상을 위해 노력하며, 건설사업관리기술자로서의 품위를 유지하여야 한다. 1. 건설사업관리기술자는 관계법령과 이에 따른 명령 및 공공복리에 어긋나는 어떠한 행위도 하지 않으며 용역계약문서에서 정하는 바에 따라 신의와 성실로서 업무를 수행하여야 하며, 품위를 손상하는 행위를 하여서는 안된다. 2. 건설사업관리기술자는 담당업무와 관련하여 제3자로부터 금품, 이권 또는 향응을 받아서는 아니된다. 3. 건설사업관리기술자는 건설공사의 품질향상을 위하여 기술개발 및 활용ㆍ보급에 전력을 다하여야 한다. 4. 건설사업관리기술자는 건설사업관리업무를 수행함에 있어서 해당 설계용역계약문서, 공사계약문서, 건설사업관리과업내용서, 그 밖의 관계규정 등의 내용을 숙지하고 해당 공사의 특수성을 파악한 후 건설사업관리업무를 수행하여야 한다. 5. 건설사업관리기술자는 설계자 및 시공자의 의무와 책임을 면제시킬 수 없으며, 임의로 설계를 변경시키거나, 기일연장 등 설계용역계약조건 및 공사계약조건과 다른 지시나 결정을 하여서는 안된다. 6. 건설사업관리기술자는 문제점이 발생되거나 설계 또는 시공에 관련한 중요한 변경 및 예산과 관련되는 사항에 대하여는 수시로 발주기관에 보고하고 지시를 받아 업무를 수행하여야 한다. 다만, 인명손실이나 시설물의 안전에 위험이 예상되는 사태가 발생할 시에는 먼저 적절한 조치를 취한 후 즉시 발주기관에 보고하여야 한다. 7. 건설사업관리용역업자 및 건설사업관리기술자는 해당 용역시행 중은 물론 용역이 종료된 후라도 감사기관의 수감요구 및 문제발생으로 인한 발주기관의 출석요구가 있으면 이에 응하여야 하며, 건설사업관리업무 수행과 관련하여 발생된 사고 또는 피해로 피해자가 소송제기시 국가지정 소송업무에 적극 협력하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:44","kind":"조문","type":"계약예규","family":"nca","label":"제44조","title":"계약담당공무원의 지도감독","text":"제44조(계약담당공무원의 지도감독) ① 계약담당공무원은 시공 단계의 건설사업관리용역계약문서에 규정된 바에 따라 다음 각호의 사항에 대하여 건설사업관리기술자를 지도ㆍ감독하며 모든 지시는 건설사업관리용역업자 또는 책임건설사업관리기술자를 통하여 하도록 한다. 1. 건설사업관리기술자의 적정자격 보유 여부 및 상주 이행상태 2. 품위손상 여부 및 근무자세3. 발주기관 지시사항의 이행상태 4. 행정서류 및 비치서류 처리상태5. 각종 보고서의 처리상태② 계약담당공무원은 건설사업관리기술자가 계약담당공무원의 지시에 위반된다고 판단되는 업무를 수행할 경우 이에 대하여 해명토록 하거나 시정하도록 서면으로 지시할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:45","kind":"조문","type":"계약예규","family":"nca","label":"제45조","title":"건설사업관리용역의 착수 및 보고","text":"제45조(건설사업관리용역의 착수 및 보고) ① 건설사업관리용역업자는 계약체결 즉시 상주 및 기술지원 기술자 투입 등 건설사업관리업무 수행준비에 대하여 발주기관과 협의하여야 하며, 계약서상 착수일에 건설사업관리용역을 착수하여야 한다. 다만, 건설사업관리 대상 건설공사의 전부 또는 일부의 용지매수 지연 등으로 계약서상 착수일에 건설사업관리용역을 착수할 수 없는 경우에는 발주기관은 실제 착수 시점 및 상주기술자 투입시기 등을 조정, 통보하여야 한다. ② 건설사업관리용역업자는 건설사업관리용역 착수 시 다음 각 호의 서류를 첨부한 착수신고서를 제출하여 발주기관의 승인을 받아야 한다. 1. 건설사업관리업무수행계획서 2. 건설사업관리비 산출내역서 3. 상주, 기술지원 기술자 지정신고서(총괄책임자 선임계를 포함한다)와 건설사업관리기술자 경력확인서 4. 건설사업관리기술자 조직 구성내용과 건설사업관리기술자별 투입기간 및 담당업무 ③ 입찰참가자격사전심사에 의해 건설사업관리용역업자로 선정된 경우에 있어 제2항제4호의 건설사업관리기술자는 입찰참가제안서에 명시된 자로 하여야 한다. 다만, 부득이한 사유로 교체가 필요한 경우에는 기술자격, 학ㆍ경력 등을 종합적으로 검토하여 건설사업관리업무수행 능력이 저하되지 않는 범위 내에서 발주기관의 사전승인을 받아야 한다. ④ 발주기관은 제2항제3호 및 제4호의 내용을 검토하여 건설사업관리기술자 또는 건설사업관리조직 구성내용이 해당 공사현장의 공종 및 공사 성격에 적합하지 않다고 인정할 때에는 그 사유를 명시하여 서면으로 건설사업관리용역업자에 변경을 요구할 수 있으며, 변경요구를 받은 건설사업관리용역업자는 특별한 사유가 없으면 요구에 따라야 한다. ⑤ 건설사업관리기술자는 공사시공과 관련된 각종 인ㆍ허가 사항을 포함한 제반법규 등을 시공자로 하여금 준수토록 지도ㆍ감독하여야 하며, 발주기관이 받아야 하는 인ㆍ허가 사항은 발주기관에 협조ㆍ요청하여야 한다. ⑥ 승인된 건설사업관리기술자는 업무의 연속성, 효율성 등을 고려하여 특별한 사유가 없으면 건설사업관리용역 완료시 까지 근무토록 하여야 하며 교체가 필요한 경우에는 시행규칙 제35조제5항에 따라 교체인정 사유를 명시하여 발주기관의 사전승인을 받아야 한다. ⑦ 건설사업관리기술자의 구성은 계약문서에 기술된 과업내용에 따라 관련분야 기술자격 또는 학력ㆍ경력을 갖춘자로 구성되어야 한다. ⑧ 건설사업관리단의 조직은 공사담당, 품질담당 및 안전담당 등으로 현장여건에 따라 구성토록 함으로서 건설사업관리업무를 효율적으로 수행할 수 있도록 하여야 한다. 또한 공사의 원활한 추진을 위하여 필요한 경우 발주기관의 승인을 받아 한시적으로 검측을 담당하도록 건설사업관리기술자를 투입할 수 있다. ⑨ 책임건설사업관리기술자는 분야별 건설사업관리기술자의 개인별 업무를 분담하고 그 분담 내용에 따라 업무수행계획을 수립하여 과업을 수행토록 하여야 한다. ⑩ 건설사업관리기술자는 현장에 부임하는 즉시 사무소, 숙소, 사고발생 및 복구시 응급대처 할 수 있는 비상연락체계, 전화번호 및 팩스 등을 발주기관에 보고하여 업무연락에 차질이 없도록 하여야 하며 변경 되었을 경우에도 보고하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:46","kind":"조문","type":"계약예규","family":"nca","label":"제46조","title":"휴일 및 야간작업","text":"제46조(휴일 및 야간작업) 상주 건설사업관리기술자는 시공자가 발주기관의 승인을 얻어 휴일 또는 야간작업을 하는 경우에는 휴일 또는 야간작업을 하여야 한다. 이 경우 제17조를 준용한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:47","kind":"조문","type":"계약예규","family":"nca","label":"제47조","title":"지체상금","text":"제47조(지체상금) 시공 단계의 건설사업관리용역계약에 있어서는 제18조제3항 각호에 정한 사유외에도 시공사의 책임으로 시공 단계의 건설사업관리용역의 착수 또는 완성이 지연되었거나 시공 단계의 건설사업관리용역 수행이 중단되었을 경우 그 해당일수를 지체일수에 산입하지 아니한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:48","kind":"조문","type":"계약예규","family":"nca","label":"제48조","title":"감리용역의 일시정지","text":"제48조(감리용역의 일시정지) 계약담당공무원은 제32조제1항 각호에 정한 사유외에도 공사계약이 해제 또는 해지되거나 공사의 수행이 일시 정지된 경우 시공 단계의 건설사업관리용역의 전부 또는 일부의 수행을 정지시킬 수 있다.\n제4장 소프트웨어용역 계약조건","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:49","kind":"조문","type":"계약예규","family":"nca","label":"제49조","title":"정의","text":"제49조(정의) 이 장에서 사용하는 용어의 정의는 다음과 같다.1. \"소프트웨어사업\"이라 함은 「소프트웨어 진흥법」 제2조제3호에 의한 소프트웨어의 개발ㆍ제작ㆍ생산ㆍ유통 등과 이에 관련된 서비스, 「지능정보화 기본법」 제2조제2호에 의한 정보화에 관한 사업 및 「전자정부법」 제2조제13호에 의한 정보시스템에 관한 사업과 관련된 경제활동을 말한다.2. \"계약목적물\"이라 함은 제1호의 소프트웨어사업 수행을 통해 산출되는 소프트웨어, 정보시스템 및 이와 관련된 서비스, 기타 부수하는 조작 설명서 등으로 계약에 의하여 발주기관이 최종적으로 인수하는 계약의 목적물을 말한다.3. \"과업내용서\"란 발주기관과 계약상대자가 최종적으로 합의한 소프트웨어사업의 범위를 구체적으로 기재한 문서로서, 계약당사자의 업무범위를 설정하고, 과업내용 변경의 기준서로서의 역할을 한다.4. \"하자보수\"라 함은 하자보수기간 중에 발견한 소프트웨어 또는 정보시스템 등의 결함 등을 수정하는 것을 말한다.5. 이 장에서 따로 정하는 경우를 제외하고는 제1호에 정한 소프트웨어사업 관련법령에 정하는 바에 따른다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:50","kind":"조문","type":"계약예규","family":"nca","label":"제50조","title":"계약이행의 관리ㆍ감독 및 사업의 품질 확보","text":"제50조(계약이행의 관리ㆍ감독 및 사업의 품질 확보) ① 계약담당공무원은 해당 계약의 적정한 수행여부와 산출물 등의 품질을 확보하기 위하여 「소프트웨어 진흥법」 제56조제1항에 의하여 사업의 수행과정이나 계약이행상황을 관리ㆍ감독하여야 한다. 다만, 시행령 제54조 제1항 제2호의 전문적인 지식 또는 기술을 필요로 하거나 기타 부득이한 사유로 인하여 감독을 할 수 없는 경우에는 전문기관을 따로 지정하여 필요한 감독을 하게 할 수 있다.② 계약담당공무원은 해당 계약의 원할한 이행과 사업 완료 후의 원활한 유지보수를 위하여 부품ㆍ기기에 대한 공급과 기술지원 확약에 관한 서류의 제출을 요구할 수 있으며, 계약상대자는 특별한 사유가 없는 한 이에 따라야 한다.③ 제1항 단서에 의하여 전문기관이 감독을 하도록 할 경우에는 시행규칙 제67조 및 제69조에 의하여 감독조서의 작성 및 그 결과를 문서로서 제출하도록 하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:51","kind":"조문","type":"계약예규","family":"nca","label":"제51조","title":"소프트웨어 용역의 착수 및 보고","text":"제51조(소프트웨어 용역의 착수 및 보고) ① 계약상대자는 계약문서에서 정하는 바에 따라 소프트웨어사업을 착수하여야 하며, 발주기관이 관련법령에서 정한 서류 및 다음 각 호의 사항이 포함된 착수신고서의 제출을 요구하는 경우에는 이를 제출하여야 한다.1. 사업수행계획서(사업범위, 사업추진일정계획, 인력 및 장비 투입계획, 표준화 및 보안대책 등)2. 사업품질보증계획서3. 역할 분담에 따른 발주기관 협조사항② 과업내용의 변경 등에 따른 조치는 제13조제2항 내지 제4항에 정한 바에 의한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:52","kind":"조문","type":"계약예규","family":"nca","label":"제52조","title":"작업장소 등","text":"제52조(작업장소 등) ① 계약당사자는 소프트웨어사업수행을 위하여 필요한 장소 및 설비 기타 작업환경(이하 \"작업장소 등\"이라고 한다)을 상호 협의하여 정한다. 다만, 핵심 개발인력이 아닌 지원인력의 근무장소는 보안 등 특별한 사유가 있는 경우를 제외하고는 계약상대자가 달리 정할 수 있다. ② 발주기관이 작업장소 등에 관한 비용을 사업예산 또는 예정가격에 계상하지 아니한 경우에는 발주기관이 작업장소 등을 제공한다. ③ 계약상대자는 해당 계약의 이행을 위하여 필요한 경우 그 사유 및 기간 등을 정하여 계약담당공무원의 승인을 얻은 후 해당 사업에 투입되는 인력을 제1항의 작업장소 이외에서도 근무하게 할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:53","kind":"조문","type":"계약예규","family":"nca","label":"제53조","title":"과업내용의 변경","text":"제53조(과업내용의 변경) 소프트웨어사업의 경우에 과업내용의 변경 및 계약금액조정은 제16조에 정한 바에 의하되 계약당사자는 다음 각 호의 사항을 준수하여야 한다.1. 제16조제1항 및 제3항에 의한 과업내용의 변경지시 및 변경제안시 에는 별지 제1호서식 「과업내용변경요청서」에 의하여야 한다.2. 계약담당공무원은 제1호에 따른 과업내용 변경의 적정성 여부를 심의하기 위하여 계약당사자 및 외부 전문가가 참여하는 과업변경심의위원회(이하 \"위원회\"라 한다)를 설치할 수 있다. 다만, 과업내용 변경에 따른 계약금액의 조정액이 당초 계약금액의 100분의 10이상으로 추정될 경우에는 위원회를 설치하여 과업변경 심의를 하여야 한다.3. 계약담당공무원은 과업내용 변경에 따라 계약금액을 조정하는 경우 그 결과를 별지 제2호서식 「과업내용변경관리내역서」를 작성하여 관리하여야 한다.4. 계약금액의 조정은 「소프트웨어사업 대가산정 가이드」를 준용하여 산정한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:54","kind":"조문","type":"계약예규","family":"nca","label":"제54조","title":"인력투입의 종료","text":"제54조(인력투입의 종료) 용역을 완성(계약기간내에 용역을 완성한 경우를 포함한다)한 후 제20조에 따른 검사가 완료된 때에는 인력의 투입도 종료된다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:55","kind":"조문","type":"계약예규","family":"nca","label":"제55조","title":"지체상금률","text":"제55조(지체상금률) 제18조에 따른 지체상금을 부과할 때에는 소프트웨어 사업에 적용하는 지체상금률은 다음 각 호와 같다. 1. 시행령 제16조제3항에 의하여 소프트웨어 사업시 물품과 용역을 일괄하여 입찰에 부치는 경우: 물품계약의 성질에 따라 다음 각목을 적용한다.가. 계약 이후 물품에 대한 설계와 제조가 일괄하여 이루어지고, 그 설계에 대하여 발주한 중앙관서의 장의 승인이 필요한 경우: 시행규칙 제75조제1호에 따른 지체상금률 나. 그 외의 경우: 시행규칙 제75조제2호에 따른 지체상금률 2. 제1호 이외의 경우: 시행규칙 제75조제3호에 따른 지체상금률","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:56","kind":"조문","type":"계약예규","family":"nca","label":"제56조","title":"계약목적물의 지식재산권 귀속 등","text":"제56조(계약목적물의 지식재산권 귀속 등) ① 해당 계약에 따른 계약목적물에 대한 지식재산권은 발주기관과 계약상대자가 공동으로 소유하며, 별도의 정함이 없는 한 지분은 균등한 것으로 한다. 다만, 개발의 기여도 및 계약목적물의 특수성(국가안전보장, 국방, 외교관계 등)을 고려하여 계약당사자간의 협의를 통해 지식재산권 귀속주체 등에 대해 공동소유와 달리 정할 수 있다. ② 제1항에 따라 지식재산권을 공동으로 소유하는 경우에는 국가안전보장, 국가의 방위계획 및 정보활동, 외교관계 등의 사유에 의해 지식재산권의 상업적 활용을 제한할 수 있는 경우를 당사자간에 별도로 협의하여 정하지 않는 한 공유자 일방은 지식재산권의  복제, 배포, 개작, 전송 등의 사용ㆍ수익을 할 수 있다. ③ 제2항에 의한 지식재산권의 사용ㆍ수익 등에 따른 이익은 별도의 정함이 없는 한 지식재산권을 행사한 당사자에게 귀속하는 것으로 한다. ④ 제1항 및 제2항에도 불구하고, 발주기관이 개발된 소프트웨어를 타기관과 공동으로 활용하는 경우에 계약담당공무원은 그 대상기관의 범위 등을 입찰 공고에 명시하고 이를 계약서에 반영하여야 한다. ⑤ 공유자 일방이 지분을 제3자에게 양도하는 등 지식재산권을 처분ㆍ배포하고자 하는 경우에는 반드시 타공유자의 동의를 받아야 한다. ⑥ 제1항에 의하여 지식재산권이 발주기관에 귀속된 경우 발주기관은 국가안전보장, 국가의 방위계획 및 정보활동, 외교관계 그 밖에 이에 준하는 경우로서 국가기관의 행위를 비밀리에 할 필요가 있을 경우 등 특별한 사유가 없는 한 계약상대자에게 계약목적물을 개작할 수 있는 권리를 부여하여야 하며, 계약상대자는 이를 상업적으로 활용할 수 있다. 이 경우 개작권을 부여받은 계약상대자는 발주기관의 승인을 받아 제3자에게 개작권을 양도할 수 있다.⑦ 제1항에 의하여 지식재산권이 계약상대자에게 귀속된 경우라 하더라도 계약상대자는 발주기관이 계약목적과 관련되어 해당 계약목적물을 사용(기능개선, 재개발, 유지보수를 포함한다. 이하 \"계약목적물의 사용\"이라 한다)함에 있어서는 어떠한 제한을 하여서도 아니된다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:56의2","kind":"조문","type":"계약예규","family":"nca","label":"제56조의2","title":"계약목적물의 특허권 등의 귀속 등에 대한 특례","text":"제56조의2(계약목적물의 특허권 등의 귀속 등에 대한 특례) 해당 계약에 따른 계약목적물에 대한 특허권 등에 대해서는 제35조의3을 준용한다.[본조신설 2015.1.1.]","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:56의3","kind":"조문","type":"계약예규","family":"nca","label":"제56조의3","title":"계약목적물의 직무발명에 대한 권리의 승계","text":"제56조의3(계약목적물의 직무발명에 대한 권리의 승계) 해당 계약에 따른 직무발명에 대해서는 제35조의4를 준용한다.[본조신설 2015.1.1.]","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:57","kind":"조문","type":"계약예규","family":"nca","label":"제57조","title":"계약목적물의 기술자료 임치 등","text":"제57조(계약목적물의 기술자료 임치 등) ① 계약상대자는 제56조제3항에 따른 계약목적물의 사용을 보장하고, 지식재산권을 보호하기 위해서 계약상대자의 사업수행에 따른 계약목적물의 \"기술자료\"를 제3의 기관(이하 \"임치기관\"이라 한다)에 임치하여야 한다. 이 경우 발주기관은 계약상대자에게 기술자료의 제출을 요구할 수 없다. ② 제1항에서 \"기술자료\"라 함은 아래의 각호의 것을 의미하고, 계약상대자는 계약목적물의 기능수행에 있어 중요한 변경사항이 발생한 경우 발생일로부터 30일 이내에 추가 임치하여야 하고 임치기관은 이를 발주기관에게 즉시 통보하여야 한다.1. 소스코드 및 오브젝트 코드의 복제물2. 기술정보(매뉴얼, 설계서, 사양서, 플로우차트, 유지보수자료 등)③ 임치기관은 「저작권법시행령」 제39조의2 및 「대중소기업 상생협력 촉진에 관한 법률 시행령」제15조의2에 의한 기관 중에서 계약상대자가 선정하며, 임치수수료는 계약상대자가 부담한다. ④ 계약담당공무원은 계약목적물의 사용을 위하여 필요한 경우 그 사유를 명시하여 계약상대자에게 통지한 후 임치기관에 기술자료의 교부를 요청할 수 있다. 다만, 다음 각 호의 경우에는 계약상대자에게 통지없이 기술자료의 교부를 요청할 수 있다.1. 계약상대자가 파산선고를 받거나 해산결의를 하여 그 권리가 민법 또는 기타 다른 법률에 의하여 소멸된 경우2. 그 밖에 계약당사자가 협의하여 정한 경우⑤ 제4항과 관련하여 계약당사자간 다르게 정한 사항이 있는 경우에는 그에 따른다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:58","kind":"조문","type":"계약예규","family":"nca","label":"제58조","title":"하자보수 등","text":"제58조(하자보수 등) ① 계약상대자는 계약담당공무원이 제21조 및 제22조의 인수에 의하여 사업의 종료를 확인한 후 1년간(별도의 관련 법률에서 따로 정하고 있는 경우는 제외) 계약목적물의 하자에 대한 보수책임이 있다.② 제1항에서 정한 기간내에 하자가 발생하여 계약담당공무원이 하자보수를 요청한 경우 계약상대자는 요청을 받은 즉시 그 하자를 보수하여야 하며 해당 하자의 발생원인 및 기타 조치사항을 명시하여 계약담당공무원에게 제출하여야 한다. 다만, 다음 각 호의 경우는 유상 유지관리 또는 재개발로 본다. 1. 무상 하자보수기간 경과 후 발생된 하자에 대한 보수 2. 이미 구매한 물품 또는 이와 연동된 제품을 기초로 추가되는 개발ㆍ구축(사용방법 및 환경개선을 위한 요구사항 추가를 포함한다)3. 계약서에 명시되지 않은 예방을 위한 현장방문, 상시 근무에 소요되는 인력투입 등4. 계약서에 명시되지 않은 사용자에 대한 교육 및 기술지원 ③ 계약상대자는 다음 각호의 어느 하나의 사유로 인하여 발생한 하자에 대해서는 제1항에도 불구하고 하자보수책임이 없다. 다만, 계약상대자가 그 물품 또는 지시의 부적당함을 알고 발주기관에게 고지하지 아니한 경우에는 그러하지 아니하다.1. 발주기관의 유지ㆍ관리소홀이나 사용상 부주의로 인한 경우2. 발주기관이 제공한 시스템, 장비, 프로그램 등의 하자로 인한 경우3. 발주기관이 임의로 산출물 등을 변경한 경우4. 발주기관의 지시에 따라 구축한 경우5. 천재지변 등 불가항력에 의한 경우④ 제2항 각호에 해당하는 유상 유지 관리 또는 재개발에 대해서는 발주기관이 계약목적물을 인수한 직후부터 계약을 체결하여 시행하여야 한다. 다만, 당초  소프트웨어사업 내용에 유지 관리 또는 재개발이 이미 포함된 경우에는 그러하지 아니한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:59","kind":"조문","type":"계약예규","family":"nca","label":"제59조","title":"하자보수보증금","text":"제59조(하자보수보증금) ① 계약상대자는 제58조의 하자보수를 보증하기 위하여 계약서에서 정한 하자보수보증금율(100분의 2, 별도의 관련 법률에서 따로 정하고 있는 경우는 제외)과 계약금액(당초 계약금액이 조정된 경우에는 조정된 계약금액을 말한다)을 곱하여 산출한 금액(이하 \"하자보수보증금\"이라 한다)을 시행령 제37조제2항에 따른 보증서 또는 증권 등으로 발주기관에 납부하여야 한다.② 계약담당공무원은 계약상대자가 제58조제1항에 의한 하자담보책임기간중 발주기관으로부터 하자보수요구를 받고 이에 불응한 경우에는 제1항에 의한 하자보수보증금을 국고에 귀속하여야 한다.③ 계약담당공무원은 하자담보책임기간이 만료된 경우 하자보수보증금을 지체없이 계약상대자에게 반환하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:60","kind":"조문","type":"계약예규","family":"nca","label":"제60조","title":"하도급 관리 등","text":"제60조(하도급 관리 등) ① 계약상대자는 해당 소프트웨어사업의 일부를 제3자에게 하도급하거나, 승인을 받은 하도급 조건을 변경하고자 하는 경우에는 「하도급거래 공정화에 관한 법률」 제3조의2에 의한 소프트웨어사업표준하도급계약서 등 관련 자료를 첨부하여 계약담당공무원에게 사전승인을 요청하여야 한다.② 제1항의 요청을 받은 계약담당공무원은 계약의 품질확보 등 적정성 여부를 판단하여 14일이내에 그 승인 여부를 계약상대자에게 통지하여야 한다. 다만, 계약담당공무원은 정당한 사유에 의하여 통지기간을 연장하고자 할 경우에는 그 연장사유와 통지예정기한을 지체없이 계약상대자에게 통지하여야 한다.③ 계약담당공무원이 계약당사자에게 제2항의 하도급 승인여부를 기간내에 통지하지 아니하거나 통지기간연장을 통지하지 아니한 경우에는 제1항의 하도급을 승인한 것으로 본다.④ 계약상대자는 하도급계약과 관련 「하도급거래 공정화에 관한 법률」을 준수하여야 하며, 계약담당공무원의 요청이 있는 경우에는 하도급계약의 준수실태 등을 확인할 수 있도록 표준하도급계약서상의 주요내용을 계약담당공무원에게 보고하여야 한다.⑤ 계약담당공무원은 제2항에 따른 하도급 승인시 제4항에 따른 하도급계약의 준수여부에 대한 보고주기를 정할 수 있다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:61","kind":"조문","type":"계약예규","family":"nca","label":"제61조","title":"소프트웨어사업의 계약정보 공개","text":"제61조(소프트웨어사업의 계약정보 공개) ① 계약담당공무원은 소프트웨어사업의 경우에 다음 각 호의 사항을 발주기관의 인터넷 홈페이지에 공개하여야 한다.1. 발주계획(사업명, 발주물량 또는 그 규모, 예산액을 포함한다)2. 입찰공고(국가를 당사자로 하는 계약에 관한 법률 시행령 제30조제2항에 따라 2인 이상으로부터 견적서를 제출받은 수의계약의 공고를 포함한다)3. 개찰의 결과4. 계약체결의 현황(하도급 현황을 포함한다)5. 과업내용 등 계약내용의 변경(입찰공고와 다른 조건으로 계약이 체결된 경우를 포함한다)에 관한 사항6. 감리ㆍ감독ㆍ검사의 현황7. 대가의 지급현황② 제1항에 따른 계약정보의 공개는 계약이행 완료일로부터 5년 이상 하여야 한다.[본조신설 2014.4.1.]\n제5장 보 칙","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-gen:62","kind":"조문","type":"계약예규","family":"nca","label":"제62조","title":"재검토기한","text":"제62조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-yongyeok-gen","group":"용역계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-yongyeok-bid","kind":"법령","type":"계약예규","family":"nca","label":"용역입찰유의서","name":"(계약예규) 용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 유의서는 정부(이하 \"발주기관\"이라 한다)가 행하는 용역계약에 대한 입찰에서 해당 입찰에 참가하고자 하는 자가 유의하여야 사항을 정함을 목적으로 한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"용어의 정의","text":"제2조(용어의 정의) 이 유의서에서 사용하는 용어의 정의는 이 유의서에서 따로 정하는 경우를 제외하고는 「국가를 당사자로 하는 계약에 관한 법률 시행령」, 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」, 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」(이하 각각 \"시행령\", \"시행규칙\" 및 \"특례규정\"이라 한다) 및 계약예규 「용역계약일반조건」(이하 \"일반조건\"이라 한다)에 정하는 바에 의한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"입찰참가신청","text":"제3조(입찰참가신청) ① 입찰에 참가하고자 하는 자는 입찰공고 또는 입찰참가통지서에 기재된 입찰참가신청마감일까지 다음 각호의 서류를 발주기관에 제출하여 입찰참가 신청을 하여야 한다.1. 입찰참가신청서(소정양식) 1통2. 입찰참가자격을 증명하는 사본 1통3. 인감증명서 또는「본인서명사실 확인 등에 관한 법률」제2조제3호에 따른 본인서명사실확인서 1통. 다만,「전자조달의 이용 및 촉진에 관한 법률」제2조제4호에 따른 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)을 이용하여 등록하는 경우는 제외한다. 4. 기타 공고 또는 통지로 요구하는 서류② 제1항제2호의 경우에는 원본을 제시하거나 사본에 \"원본과 같음\"을 명기하고 인감(인감증명서상의 인감 또는 입찰참가신청서상의 사용인감)으로 날인(본인서명사실확인서를 제출한 경우는 서명)하여 제출하여야 한다. ③ 시행령 제72조에 의하여 공동계약이 허용된 경우에는 공동수급체를 구성하여 입찰에 참가하고자 하는 자는 공동수급협정서를 제1항 각호의 서류와 함께 제출하여야 한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:3의2","kind":"조문","type":"계약예규","family":"nca","label":"제3조의2","title":"입찰참가자격의 판단기준일","text":"제3조의2(입찰참가자격의 판단기준일) ① 시행령 제12조 및 제21조에 따른 등록ㆍ실적 등에 의한 입찰참가자격의 판단기준일은 시행규칙 제40조제4항에 의한 입찰참가신청서류의 접수마감일(이하 \"입찰참가등록마감일\"이라 한다)로 하며, 입찰참가자는 입찰참가등록마감일 이후 입찰서제출 마감일까지 해당 입찰참가자격을 계속 유지하여야 한다.② 제1항에도 불구하고 시행령 제21조제1항제6호 및 시행규칙 제24조에 따라 지역제한경쟁입찰을 부치는 경우 법인등기부상 본점소재지 기준일(본점소재지가 변경된 경우 법인등기부상 본점소재지 등기일을 말한다.)은 입찰공고일 전일로 하며 계약체결일까지 계속 유지하여야 한다. ③ 입찰참가자가 시행령 제76조에 의한 입찰참가자격제한을 받은 경우에는 입찰참가등록마감일 전일까지 입찰참가자격제한기간이 만료되어야 입찰에 참가할 수 있다.④ 입찰전에 상호 또는 대표자의 변경(법인의 경우에는 법인등기부를 기준으로 한다)이 있는 경우에는 변경신고를 한 후 변경된 상호 또는 대표자 명의로 입찰에 참가하여야 한다","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"입찰에 관한 서류","text":"제4조(입찰에 관한 서류) ① 입찰에 참가하고자 하는 자는 다음 각호의 서류(이하 \"입찰에 관한 서류\"라 한다)를 열람할 수 있으며 추정가격이 고시금액 이상인 용역의 경우에는 이를 교부받을 수 있다.1. 입찰공고문 또는 입찰참가통지서2. 용역입찰유의서3. 입찰참가신청서(소정서식)4. 입찰서(소정서식)5. 용역표준계약서(소정서식)6. 용역계약일반조건7. 용역계약특수조건8. 과업내용서9. 기타 참고사항을 기재한 서류② 발주기관은 제1항의 입찰에 관한 서류를 교부하는 경우에는 입찰공고 등에서 정한 금액을 납부할 것을 요구할 수 있으며, 이 경우에는 입찰에 참가하고자 하는 자는 이에 따라야 한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"관계법령 등의 숙지","text":"제5조(관계법령 등의 숙지) ① 입찰에 참가하고자 하는 자는 시행령 등의 입찰관련 법령 및 제4조제1항에 의한 입찰에 관한 서류를 입찰전에 완전히 숙지하여야 하며 이를 숙지하지 못한 책임은 입찰참가자에게 있다.② 입찰에 참가하고자 하는 자는 제1항에 의한 입찰에 관한 서류의 검토과정에서 발견한 입찰에 관한 서류상의 착오, 누락사항 또는 기타 설명이 요구되는 사항에 대하여는 입찰서 제출마감일전일까지 발주기관에 그 설명을 요구할 수 있다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"입찰보증금","text":"제6조(입찰보증금) ① 입찰에 참가하고자 하는 자는 입찰참가신청마감일(공휴일인 때에는 전일)까지 입찰금액의 100분의 5이상의 입찰보증금을 시행령 제37조제2항에 규정된 현금 또는 보증서 등으로 발주기관에 납부하여야 한다.② 낙찰자가 정당한 이유없이 소정의 기한내에 계약을 체결하지 아니할 때(제18조의2 제1항에 규정한 용역이행보증서 제출의무가 있는 경우에 동 보증서를 기한내에 제출하지 못하여 계약을 체결하지 못한 경우를 포함한다.)에는 계약담당공무원은 해당 입찰보증금은 국고에 귀속한다. ③ 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)은 낙찰되지 아니한 입찰자의 입찰보증금을 낙찰자가 결정된 후 즉시 반환한다. 다만, 낙찰자의 입찰보증금은 계약체결 후 즉시 반환한다.④ 계약담당공무원은 다음 각호의 어느 하나에 해당하는 경우에는 입찰보증금 납부를 원칙적으로 면제할 수 있다. 1. 시행령 제37조제3항제1호 내지 제4호, 제5호의2 및 제6호에 정한 자가 입찰에 참가하는 경우2. 「건설기술관리법」ㆍ「엔지니어링기술진흥법」 또는 「건설폐기물의 재활용촉진에 관한 법률」 등 해당 용역관련법령에 의하여 국가기관 등으로부터 면허ㆍ허가 등을 받았거나 등록ㆍ신고 등을 하고 해당 용역관련법령상의 사업(해당 용역과 관계없는 면허ㆍ허가ㆍ등록ㆍ신고 등도 해당 용역관련법령상의 면허ㆍ허가ㆍ등록ㆍ신고 등은 포함)을 입찰참가신청마감일 현재 영위하고 있는 법인이 입찰에 참가하는 경우. 다만, 다음 각 목의 어느 하나에 해당하는 자는 제외한다. 가. 입찰공고일 이전 1년 이내에 시행령 제76조제2항제2호가목의 사유로 입찰참가자격제한을 받은 자(입찰참가자격 제한 기간 중인 경우를 포함한다) 나. 계약체결을 기피할 우려가 있어 각 중앙관서의 장 또는 계약담당공무원이 입찰공고에 명시한 요건에 해당하는 자 ⑤ 보증서 등에 의한 입찰보증금의 보증기간은 다음 각호를 충족하여야 한다.1. 보증기간의 시작일 : 입찰서 제출마감일 이전일 것2. 보증기간의 만료일 : 입찰서 제출마감일 다음날부터 30일 이후일 것","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"입찰참가","text":"제7조(입찰참가) ① 입찰참가신청을 한 자가 아니면 입찰에 참가할 수 없다.② 입찰참가신청자가 입찰참가신청서 제출 시에 대리인을 지정한 경우에는 그 대리인도 입찰에 참가할 수 있다. 다만, 입찰참가신청서를 제출하는 때부터 입찰개시 시각전까지 입찰대리인을 지정하거나 입찰대리인을 변경하는 경우에는 그 대리인이 입찰에 참가할 수 있다.③ 제2항에 의한 대리인의 자격은 입찰참가자가 법인인 경우에는 해당 법인의 임ㆍ직원(다만,「산업교육진흥 및 산학연협력촉진에 관한 법률」에 따라 설립한 산학협력단의 경우에는 해당 법인의 임ㆍ직원 및 연구원(대학의 장 또는 산학협력단장이 임명한 자에 한함)으로 한다)에 한하며, 계약담당공무원은 재직증명서와 다음 각 호의 자료에 의해서 임ㆍ직원 여부를 확인하여야 한다. 다만, 2개 이상 법인의 임ㆍ직원인 자는 1개 법인의 대리인으로만 입찰에 참가할 수 있다. 1. 4대 보험 중 어느 하나 가입 증명자료(최근 3개월 이내) 2. 소속 법인에서 받은 급여와 관련하여 해당 법인에서 발급받은 소득세 납부 증명자료 3. 법인 등기사항증명서 4. 기타 임ㆍ직원 여부를 확인할 수 있는 자료 ④ 시행령 제76조에 의한 부정당업자로 입찰참가자격을 제한받고 있는 자는 제2항에 의한 대리인이 될 수 없다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"입찰서의 작성","text":"제8조(입찰서의 작성) ① 입찰자는 입찰서를 소정의 서식에 의하여 작성하여야 하며, 입찰금액은 총액을 표기하여야 한다.② 입찰자는 입찰서에 기명날인을 함에 있어 반드시 입찰자 성명(법인의 경우 대표자 성명)을 기재하고 입찰참가신청서 제출시 신고한 인감(서명을 포함한다. 이하 같다)으로 날인하여야 한다. ③ 입찰자는 입찰서의 기재사항 중 삭제 또는 정정한 곳이 있을 때에는 입찰에 사용하는 인감으로 날인하여야 한다.④ 입찰자는 입찰서를 입찰공고 또는 입찰참가통지서 등에 별도로 규정한 경우를 제외하고는 한글로 작성하여야 하며 입찰금액은 원화로 표기하여야 한다⑤ 입찰자는 입찰서의 금액표시를 한글 또는 한자로 기재하여야 하며 아라비아숫자를 함께 표기할 수 있다. 이 경우에 아라비아숫자로 함께 표기한 금액이 한글 또는 한자로 기재한 금액과 차이가 있을 때에는 한글 또는 한자로 기재한 금액에 의한다. 다만, 전산서식에 의한 입찰의 경우에는 지정된 표기방법으로 기재하여야 한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"입찰서의 제출","text":"제9조(입찰서의 제출) ① 입찰자는 입찰서를 봉함하여 1인 1통만 제출하여야 한다.② 우편에 의한 입찰서는 입찰서 제출마감일전일까지 발주기관에 도착된 것에 한하여 효력이 있다. 이 경우에 우송중의 분실, 훼손 또는 지연에 대하여 발주기관은 책임을 지지 아니한다.③ 계약담당공무원은 제2항에 의하여 우편으로 입찰서가 제출된 때에는 해당 입찰서의 봉투표면에 접수일시를 기재하고 확인인을 날인하여 개찰시까지 개봉하지 아니하고 보관하여야 한다.④ 입찰자는 제출한 입찰서를 교환, 변경 또는 취소할 수 없다. 다만, 입찰서에 기재한 중요부분에 오기가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시한 것으로서 계약담당공무원이 이를 인정하는 경우에는 취소가 가능하며, 시행령 제18조에 의한 2단계 경쟁 등의 입찰의 경우에 있어 계약담당공무원은 기술입찰을 개찰한 결과 적격자가 없는 경우 또는 일부 경미한 사항의 기술보완을 조건으로 기술적합 판정을 하는 경우에는 기술입찰서를 변경하여 제출하게 할 수 있다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:9의2","kind":"조문","type":"계약예규","family":"nca","label":"제9조의2","title":"경영상태 심사서류의 제출","text":"제9조의2(경영상태 심사서류의 제출) ① 입찰에 참여하고자 하는 자는 「신용정보의 이용 및 보호에 관한 법률」제2조제8의3호 또는 「자본시장과 금융투자업에 관한 법률」제9조제26항의 업무를 영위하는 신용정보업자로부터 평가받은 모든 공공기관 입찰용 신용평가등급을 해당 신용정보업자를 통해 평가완료 후 3일 이내에 조달청 나라장터에 전송하여야 한다. ② 조달청장은 분기별로 신용정보업자로부터 평가명세서를 제출받아 미전송 여부를 확인하여 해당 업체를 나라장터에 게재하고, 발주기관은 동 업체에 대해 「정부입찰계약집행기준」 제98조에 따라 처리하며, 향후 1년간 시행령 제13조에 따른 입찰참가자격사전심사 및 시행령 제42조제1항에 따른 적격심사시 감점할 수 있다.[본조신설 2012.7.4.]","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:9의3","kind":"조문","type":"계약예규","family":"nca","label":"제9조의3","title":"청렴계약서의 제출","text":"제9조의3(청렴계약서의 제출) 입찰자는 입찰서를 제출할 때 시행령 제4조의2 및 정부입찰ㆍ계약집행기준 제98조의3에 따른 청렴계약서를 같이 제출하여야 한다.[본조신설 2016.1.1.]","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"장기계속기술용역의 입찰","text":"제10조(장기계속기술용역의 입찰) 장기계속용역의 경우에는 입찰자는 입찰시 총용역을 대상으로하여 입찰하여야 한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"경쟁입찰의 성립","text":"제11조(경쟁입찰의 성립) ① 경쟁입찰은 2인이상의 유효한 입찰로써 성립한다.② 계약담당공무원은 시행령 제18조제3항에 의하여 기술과 가격을 분리하여 입찰에 부치는 경우에는 시행령 제11조에 의하여 2인 이상의 유효한 입찰로 성립한 기술입찰의 개찰결과에서 기술적격자로 확정된 자가 1인인 경우에도 가격입찰서를 개봉할 수 있다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"입찰의 무효","text":"제12조(입찰의 무효) 시행규칙 제44조에서 무효로 규정한 입찰 및 다음 각호 어느 하나에 해당하는 입찰은 무효로 한다.1. 입찰자(법인의 경우 대표자를 말한다. 이하 같다)가 직접 입찰을 하지 아니하고 대리인을 통하여 입찰을 할 경우에는 제7조제2항에 의한 대리인이 아닌 자가 한 입찰 또는 대리권이 없는 자가 한 입찰2. 동일사항에 대하여 타인의 대리를 겸하거나 2인 이상을 대리한 입찰3. 입찰서의 입찰금액 등 중요한 부분이 불분명하거나 정정한 후 정정날인을 누락한 입찰4. 담합하거나 타인의 경쟁참가를 방해 또는 관계공무원의 공무집행을 방해한 자의 입찰5. 입찰자의 기명날인이 없는 입찰(입찰자의 성명을 기재하지 아니하고 대리인 성명 또는 회사명을 기재한 경우 및 입찰참가신청서 제출시 신고한 인감과 다른 인감으로 날인된 경우도 포함한다)6. 입찰서에 기재한 중요부분에 착오가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시하여 계약담당공무원이 이를 인정한 입찰7. 제8조제1항 및 제6항에 위반하여 소정의 입찰서를 사용하지 않거나 입찰서의 금액을 아라비아숫자로만 기재한 입찰 또는 전산서식에 의한 입찰서를 훼손하거나 전산표기방법과 상이하게 작성, 기재하여 전산처리가 되지 아니한 입찰8. 공동계약의 공동수급체구성원이 동일 입찰건에 대하여 공동수급체를 중복적으로 결성하여 참여한 입찰, 입찰등록시 공동수급표준협정서를 제출하지 아니한 입찰 및 공동계약운용요령 제9조를 위반한 입찰","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"입찰의 연기","text":
