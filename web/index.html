<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LawEverything — 조달 법령 즉시검색</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171d2b; --panel2:#1e2537; --line:#2b3346;
    --text:#e8ecf4; --muted:#93a0b8; --accent:#4c9aff;
    --wimim:#f6a94a; --inyong:#5cc8ff; --sosok:#39425a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  body{overflow:hidden}

  /* ───────── 스포틀라이트 (초기 화면) ───────── */
  #spot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:0 20px;z-index:20;background:var(--bg)}
  #spot.docked{background:transparent}
  #spot .brand{margin-top:18vh;text-align:center;transition:opacity .15s}
  #spot .brand h1{margin:0;font-size:26px;letter-spacing:-.4px;font-weight:650}
  #spot .brand p{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
  #spot.typing .brand{display:none}
  #spot.typing{padding-top:6vh}
  .qwrap{width:100%;max-width:680px;margin-top:26px;position:relative}
  #spot.typing .qwrap{margin-top:0}
  #q{width:100%;padding:15px 17px;border-radius:13px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:16px;outline:none;
    box-shadow:0 6px 26px rgba(0,0,0,.35)}
  #q:focus{border-color:var(--accent)}
  .hint{margin-top:9px;font-size:11.5px;color:var(--muted);text-align:center}
  .hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;font-family:inherit;font-size:10.5px}

  .results{width:100%;max-width:680px;margin-top:12px;overflow:auto;flex:1;min-height:0;
    padding-bottom:24px}
  .ritem{padding:10px 13px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
  .ritem.sel{background:var(--panel2);outline:1px solid var(--line)}
  .ritem:hover{background:var(--panel2)}
  .ritem .dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
  .ritem .main{flex:1;min-width:0}
  .ritem .ttl{font-size:13.5px}
  .ritem .ttl b{color:var(--accent);font-weight:600}
  .ritem .sub{font-size:11.5px;color:var(--muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ritem .badge{font-size:10px;color:var(--muted);background:var(--panel2);
    border-radius:20px;padding:2px 8px;flex:none}
  .none{color:var(--muted);font-size:13px;text-align:center;padding:30px}

  /* ───────── 원문 뷰 ───────── */
  #reader{position:fixed;inset:0;display:none;grid-template-rows:auto 1fr;z-index:10}
  #reader.on{display:grid}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  .topbar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .topbar button:hover{border-color:var(--accent)}
  .topbar .grow{flex:1;min-width:0}
  .topbar .metaline{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
  .topbar .metaline.warn{color:var(--wimim)}

  .cols{display:grid;grid-template-columns:1fr 380px;min-height:0}
  .doc{overflow:auto;padding:26px 34px 60px}
  .doc .crumb{font-size:12px;color:var(--muted)}
  .doc h2{margin:6px 0 2px;font-size:22px;letter-spacing:-.3px}
  .doc .subt{font-size:13px;color:var(--muted)}
  .stamp{margin-top:10px;font-size:11px;color:var(--muted);padding:4px 9px;
    border-radius:6px;background:var(--panel2);display:inline-block}
  .stamp.old{color:var(--wimim);background:rgba(246,169,74,.13)}
  .body{margin-top:20px;font-size:14.5px;line-height:1.95;color:#dbe3f0;
    white-space:pre-wrap;max-width:74ch}
  .body a.cite{color:var(--inyong);text-decoration:none;
    border-bottom:1px dashed rgba(92,200,255,.5);cursor:pointer}
  .body a.cite:hover{background:rgba(92,200,255,.12)}
  .body mark{background:rgba(76,154,255,.28);color:inherit;border-radius:3px}

  .side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
  .side h3{margin:0;padding:12px 15px 8px;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px}
  #mini{width:100%;height:260px;display:block;border-bottom:1px solid var(--line)}
  .rel{font-size:12.5px;padding:7px 15px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
  .rel:hover{background:var(--panel2)}
  .rel .k{font-size:9.5px;padding:1px 6px;border-radius:20px;flex:none}
  .rel .k.위임{background:rgba(246,169,74,.18);color:var(--wimim)}
  .rel .k.인용{background:rgba(92,200,255,.16);color:var(--inyong)}
  .rel .k.소속{background:#2a3247;color:var(--muted)}
  .rel .ev{color:var(--muted);font-size:11px}
  .relempty{padding:6px 15px 14px;font-size:12px;color:var(--muted)}

  /* 국소 그래프 */
  .edge{stroke-width:1.5;fill:none}
  .edge.위임{stroke:var(--wimim)}
  .edge.인용{stroke:var(--inyong);stroke-dasharray:5 4}
  .edge.소속{stroke:var(--sosok);stroke-width:1;opacity:.55}
  .node{cursor:pointer}
  .node circle{stroke:#0c111c;stroke-width:1.5}
  .node.ext circle{stroke-dasharray:3 3;stroke:#6b7690}
  .node.focus circle{stroke:#fff;stroke-width:2.5}
  .node text{font-size:10px;fill:var(--text);pointer-events:none;paint-order:stroke;
    stroke:#0c111c;stroke-width:3px}
</style>
</head>
<body>

<!-- 검색 (초기 화면 = 본체) -->
<div id="spot">
  <div class="brand">
    <h1>LawEverything</h1>
    <p id="meta"></p>
  </div>
  <div class="qwrap">
    <input id="q" autocomplete="off" spellcheck="false"
      placeholder="조문·키워드 검색   예) 수의계약 · 7조 보증금 · ㅅㅇㄱㅇ" />
  </div>
  <div class="hint" id="hint">
    <kbd>↑</kbd><kbd>↓</kbd> 이동 · <kbd>Enter</kbd> 원문 · <kbd>Esc</kbd> 닫기 · 초성 검색 가능
  </div>
  <div class="results" id="results"></div>
</div>

<!-- 원문 -->
<div id="reader">
  <div class="topbar">
    <button id="back">← 뒤로</button>
    <button id="tosearch">검색 <kbd>/</kbd></button>
    <div class="grow"></div>
    <div class="metaline" id="rmeta"></div>
  </div>
  <div class="cols">
    <div class="doc" id="doc"></div>
    <div class="side">
      <h3>관계 그래프 (2단계)</h3>
      <svg id="mini"></svg>
      <div id="rels"></div>
    </div>
  </div>
</div>

<script>
const GRAPH = {"meta":{"title":"조달 법령군 스냅샷 (Phase 1 — 핵심 30종)","collectedAt":"2026-07-21T13:01:33.247Z","source":"법제처 국가법령정보 오픈API","documents":30,"articles":1223,"기준일":"20260721","확인요약":{"현행":30,"시행예정":0,"미확인":0,"최고경과일":0,"낡음":0}},"nodes":[{"id":"law:nca","kind":"법령","type":"법률","family":"nca","label":"국가계약법","name":"국가를 당사자로 하는 계약에 관한 법률","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:1","kind":"조문","type":"법률","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 법은 국가를 당사자로 하는 계약에 관한 기본적인 사항을 정함으로써 계약업무를 원활하게 수행할 수 있도록 함을 목적으로 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:2","kind":"조문","type":"법률","family":"nca","label":"제2조","title":"적용 범위","text":"제2조(적용 범위) 이 법은 국제입찰에 따른 정부조달계약과 국가가 대한민국 국민을 계약상대자로 하여 체결하는 계약[세입(歲入)의 원인이 되는 계약을 포함한다] 등 국가를 당사자로 하는 계약에 대하여 적용한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:3","kind":"조문","type":"법률","family":"nca","label":"제3조","title":"다른 법률과의 관계","text":"제3조(다른 법률과의 관계) 국가를 당사자로 하는 계약에 관하여는 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:4","kind":"조문","type":"법률","family":"nca","label":"제4조","title":"국제입찰에 따른 정부조달계약의 범위","text":"제4조(국제입찰에 따른 정부조달계약의 범위)\n① 국제입찰에 따른 정부조달계약의 범위는 정부기관이 체결하는 물품ㆍ공사(工事) 및 용역의 계약으로서 정부조달협정과 이에 근거한 국제규범에 따라 재정경제부장관이 정하여 고시하는 금액 이상의 계약으로 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 국제입찰에 따른 정부조달계약의 대상에서 제외한다.\n② 제1항 각 호 외의 부분 본문에 따른 정부기관과 물품ㆍ공사 및 용역의 범위는 정부조달협정의 내용에 따라 대통령령으로 정한다.\n③ 「국가재정법」 제6조에 따른 중앙관서의 장(이하 \"각 중앙관서의 장\"이라 한다) 또는 제6조에 따라 위임ㆍ위탁 등을 받아 계약사무를 담당하는 공무원(이하 \"계약담당공무원\"이라 한다)은 계약의 목적과 성질 등을 고려하여 필요하다고 인정하면 제1항에 해당하지 아니하는 경우에도 대통령령으로 정하는 바에 따라 국제입찰에 의하여 조달할 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:5","kind":"조문","type":"법률","family":"nca","label":"제5조","title":"계약의 원칙","text":"제5조(계약의 원칙)\n① 계약은 서로 대등한 입장에서 당사자의 합의에 따라 체결되어야 하며, 당사자는 계약의 내용을 신의성실의 원칙에 따라 이행하여야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 제4조제1항에 따른 국제입찰의 경우에는 호혜(互惠)의 원칙에 따라 정부조달협정 가입국(加入國)의 국민과 이들 국가에서 생산되는 물품 또는 용역에 대하여 대한민국의 국민과 대한민국에서 생산되는 물품 또는 용역과 차별되는 특약(特約)이나 조건을 정하여서는 아니 된다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 계약을 체결할 때 이 법 및 관계 법령에 규정된 계약상대자의 계약상 이익을 부당하게 제한하는 특약 또는 조건(이하 \"부당한 특약등\"이라 한다)을 정해서는 아니 된다.\n④ 제3항에 따른 부당한 특약등은 무효로 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:5의2","kind":"조문","type":"법률","family":"nca","label":"제5조의2","title":"청렴계약","text":"제5조의2(청렴계약)\n① 각 중앙관서의 장 또는 계약담당공무원은 국가를 당사자로 하는 계약에서 투명성 및 공정성을 높이기 위하여 입찰자 또는 계약상대자로 하여금 입찰ㆍ낙찰, 계약체결 또는 계약이행 등의 과정(준공ㆍ납품 이후를 포함한다)에서 직접적ㆍ간접적으로 금품ㆍ향응 등을 주거나 받지 아니할 것을 약정하게 하고 이를 지키지 아니한 경우에는 해당 입찰ㆍ낙찰을 취소하거나 계약을 해제ㆍ해지할 수 있다는 조건의 계약(이하 \"청렴계약\"이라 한다)을 체결하여야 한다.\n② 청렴계약의 구체적 내용과 체결 절차 등 세부적인 사항은 대통령령으로 정한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:5의3","kind":"조문","type":"법률","family":"nca","label":"제5조의3","title":"청렴계약 위반에 따른 계약의 해제ㆍ해지 등","text":"제5조의3(청렴계약 위반에 따른 계약의 해제ㆍ해지 등) 각 중앙관서의 장 또는 계약담당공무원은 청렴계약을 지키지 아니한 경우 해당 입찰ㆍ낙찰을 취소하거나 계약을 해제ㆍ해지하여야 한다. 다만, 금품ㆍ향응 제공 등 부정행위의 경중, 해당 계약의 이행 정도, 계약이행 중단으로 인한 국가의 손실 규모 등 제반사정을 고려하여 공익을 현저히 해(害)한다고 인정되는 경우에는 대통령령으로 정하는 바에 따라 각 중앙관서의 장의 승인을 받아 해당 계약을 계속하여 이행하게 할 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:5의4","kind":"조문","type":"법률","family":"nca","label":"제5조의4","title":"근로관계법령의 준수","text":"제5조의4(근로관계법령의 준수) 각 중앙관서의 장 또는 계약담당공무원은 계약을 체결할 때 계약상대자로 하여금 해당 계약을 이행하는 근로자(「하도급거래 공정화에 관한 법률」에 따른 수급사업자가 고용한 근로자를 포함한다)의 근로조건이 「근로기준법」 등 근로관계 법령을 준수하도록 하는 내용을 계약서에 포함시킬 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:6","kind":"조문","type":"법률","family":"nca","label":"제6조","title":"계약사무의 위임ㆍ위탁","text":"제6조(계약사무의 위임ㆍ위탁)\n① 각 중앙관서의 장은 그 소관에 속하는 계약사무를 처리하기 위하여 필요하다고 인정하면 그 소속 공무원 중에서 계약에 관한 사무를 담당하는 공무원(이하 \"계약관\"이라 한다)을 임명하여 그 사무를 위임할 수 있으며, 그 소속 공무원에게 계약관의 사무를 대리(代理)하게 하거나 그 사무의 일부를 분장(分掌)하게 할 수 있다.\n② 각 중앙관서의 장은 대통령령으로 정하는 바에 따라 다른 중앙관서 소속 공무원에게 계약관의 사무를 위탁할 수 있다.\n③ 각 중앙관서의 장은 대통령령으로 정하는 바에 따라 그 소관의 계약에 관한 사무를 다른 관서에 위탁할 수 있다.\n④ 제1항과 제2항에 따른 계약관의 사무의 위임ㆍ위탁, 대리 및 일부 분장은 각 중앙관서 소속 기관에 설치된 관직을 지정함으로써 갈음할 수 있다.\n⑤ 계약관은 대통령령으로 정하는 재정보증이 없으면 그 직무를 담당할 수 없다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:7","kind":"조문","type":"법률","family":"nca","label":"제7조","title":"계약의 방법","text":"제7조(계약의 방법)\n① 각 중앙관서의 장 또는 계약담당공무원은 계약을 체결하려면 일반경쟁에 부쳐야 한다. 다만, 계약의 목적, 성질, 규모 등을 고려하여 필요하다고 인정되면 대통령령으로 정하는 바에 따라 참가자의 자격을 제한하거나 참가자를 지명(指名)하여 경쟁에 부치거나 수의계약(隨意契約)을 할 수 있다.\n② 제1항 본문에 따라 경쟁입찰에 부치는 경우 계약이행의 난이도, 이행실적, 기술능력, 재무상태, 사회적 신인도 및 계약이행의 성실도 등 계약수행능력평가에 필요한 사전심사기준, 사전심사절차, 그 밖에 대통령령으로 정하는 바에 따라 입찰 참가자격을 사전심사하고 적격자만을 입찰에 참가하게 할 수 있다.\n③ 제1항에 따라 계약을 체결하는 과정에서 다른 법률에 따른 우선구매 대상이 경합하는 경우에는 계약의 목적이나 규모, 사회적 약자에 대한 배려 수준 등을 고려하여 계약상대자를 결정하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:8","kind":"조문","type":"법률","family":"nca","label":"제8조","title":"입찰 공고 등","text":"제8조(입찰 공고 등)\n① 각 중앙관서의 장 또는 계약담당공무원은 경쟁입찰을 하는 경우에는 입찰에 관한 사항을 공고하거나 통지하여야 한다.\n② 제1항에 따른 입찰 공고 또는 통지의 방법, 내용, 시기, 그 밖에 필요한 사항은 대통령령으로 정한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:8의2","kind":"조문","type":"법률","family":"nca","label":"제8조의2","title":"예정가격의 작성","text":"제8조의2(예정가격의 작성)\n① 각 중앙관서의 장 또는 계약담당공무원은 입찰 또는 수의계약 등에 부칠 사항에 대하여 낙찰자 및 계약금액의 결정기준으로 삼기 위하여 미리 해당 규격서 및 설계서 등에 따라 예정가격을 작성하여야 한다. 다만, 다른 국가기관 또는 지방자치단체와 계약을 체결하는 경우 등 대통령령으로 정하는 경우에는 예정가격을 작성하지 아니하거나 생략할 수 있다.\n② 각 중앙관서의 장 또는 계약담당공무원이 제1항 본문에 따른 예정가격을 작성할 경우에는 계약수량, 이행기간, 수급상황, 계약조건 등을 고려하여 계약목적물의 품질ㆍ안전 등이 확보되도록 적정한 금액을 반영하여야 한다.\n③ 제1항 본문에 따른 예정가격의 작성시기, 결정방법, 결정기준, 그 밖에 필요한 사항은 대통령령으로 정한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:9","kind":"조문","type":"법률","family":"nca","label":"제9조","title":"입찰보증금","text":"제9조(입찰보증금)\n① 각 중앙관서의 장 또는 계약담당공무원은 경쟁입찰에 참가하려는 자에게 입찰보증금을 내도록 하여야 한다. 다만, 대통령령으로 정하는 경우에는 입찰보증금의 전부 또는 일부의 납부를 면제할 수 있다.\n② 제1항에 따른 입찰보증금의 금액, 납부방법, 그 밖에 필요한 사항은 대통령령으로 정한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 낙찰자가 계약을 체결하지 아니하였을 때에는 해당 입찰보증금을 국고에 귀속시켜야 한다. 이 경우 제1항 단서에 따라 입찰보증금의 전부 또는 일부의 납부를 면제하였을 때에는 대통령령으로 정하는 바에 따라 입찰보증금에 해당하는 금액을 국고에 귀속시켜야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:10","kind":"조문","type":"법률","family":"nca","label":"제10조","title":"경쟁입찰에서의 낙찰자 결정","text":"제10조(경쟁입찰에서의 낙찰자 결정)\n① 세입의 원인이 되는 경쟁입찰에서는 최고가격의 입찰자를 낙찰자로 한다. 다만, 계약의 목적, 입찰 가격과 수량 등을 고려하여 대통령령으로 기준을 정한 경우에는 그러하지 아니하다.\n② 국고의 부담이 되는 경쟁입찰에서는 다음 각 호의 어느 하나의 기준에 해당하는 입찰자를 낙찰자로 한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제2항에도 불구하고 공사에 대한 경쟁입찰로서 예정가격이 100억원 미만인 공사의 경우 다음 각 호에 해당하는 비용의 합계액의 100분의 98 미만으로 입찰한 자를 낙찰자로 하여서는 아니 된다.\n④ 제2항 각 호에도 불구하고 각 중앙관서의 장 또는 계약담당공무원은 계약의 목적ㆍ성질ㆍ수량 등 대통령령으로 정하는 요건에 해당하여 1인의 낙찰자로는 계약목적 달성이 곤란하다고 판단되는 경우에는 둘 이상의 입찰자를 낙찰자로 결정할 수 있다. 이 경우 각 중앙관서의 장 또는 계약담당공무원은 둘 이상의 낙찰자를 결정한다는 취지를 입찰공고 또는 입찰통지에 명시하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:11","kind":"조문","type":"법률","family":"nca","label":"제11조","title":"계약서의 작성 및 계약의 성립","text":"제11조(계약서의 작성 및 계약의 성립)\n① 각 중앙관서의 장 또는 계약담당공무원은 계약을 체결할 때에는 다음 각 호의 사항을 명백하게 기재한 계약서를 작성하여야 한다. 다만, 대통령령으로 정하는 경우에는 계약서의 작성을 생략할 수 있다.\n② 제1항에 따라 계약서를 작성하는 경우에는 그 담당 공무원과 계약상대자가 계약서에 기명하고 날인하거나 서명함으로써 계약이 확정된다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:12","kind":"조문","type":"법률","family":"nca","label":"제12조","title":"계약보증금","text":"제12조(계약보증금)\n① 각 중앙관서의 장 또는 계약담당공무원은 국가와 계약을 체결하려는 자에게 계약보증금을 내도록 하여야 한다. 다만, 대통령령으로 정하는 경우에는 계약보증금의 전부 또는 일부의 납부를 면제할 수 있다.\n② 제1항에 따른 계약보증금의 금액, 납부방법, 그 밖에 필요한 사항은 대통령령으로 정한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 계약상대자가 계약상의 의무를 이행하지 아니하였을 때에는 해당 계약보증금을 국고에 귀속시켜야 한다. 이 경우 제1항 단서에 따라 계약보증금의 전부 또는 일부의 납부를 면제하였을 때에는 대통령령으로 정하는 바에 따라 계약보증금에 해당하는 금액을 국고에 귀속시켜야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:13","kind":"조문","type":"법률","family":"nca","label":"제13조","title":"감독","text":"제13조(감독)\n① 각 중앙관서의 장 또는 계약담당공무원은 공사, 제조, 용역 등의 계약을 체결한 경우에 그 계약을 적절하게 이행하도록 하기 위하여 필요하다고 인정하면 계약서, 설계서, 그 밖의 관계 서류에 의하여 직접 감독하거나 소속 공무원에게 그 사무를 위임하여 필요한 감독을 하게 하여야 한다. 다만, 대통령령으로 정하는 계약의 경우에는 전문기관을 따로 지정하여 필요한 감독을 하게 할 수 있다.\n② 제1항에 따라 감독하는 자는 감독조서(監督調書)를 작성하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:14","kind":"조문","type":"법률","family":"nca","label":"제14조","title":"검사","text":"제14조(검사)\n① 각 중앙관서의 장 또는 계약담당공무원은 계약상대자가 계약의 전부 또는 일부를 이행하면 이를 확인하기 위하여 계약서, 설계서, 그 밖의 관계 서류에 의하여 검사하거나 소속 공무원에게 그 사무를 위임하여 필요한 검사를 하게 하여야 한다. 다만, 대통령령으로 정하는 계약의 경우에는 전문기관을 따로 지정하여 필요한 검사를 하게 할 수 있다.\n② 제1항에 따라 검사하는 자는 검사조서(檢査調書)를 작성하여야 한다. 다만, 대통령령으로 정하는 경우에는 검사조서의 작성을 생략할 수 있다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제1항에도 불구하고 다른 법령에 따른 품질인증을 받은 물품 또는 품질관리능력을 인증받은 자가 제조한 물품 등 대통령령으로 정하는 물품에 대하여는 같은 항에 따른 검사를 하지 아니할 수 있다.\n④ 물품구매계약 또는 물품제조계약의 경우 물품의 특성상 필요한 시험 등의 검사에 드는 비용과 검사로 인하여 생기는 변형, 파손 등의 손상은 계약상대자가 부담한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:15","kind":"조문","type":"법률","family":"nca","label":"제15조","title":"대가의 지급","text":"제15조(대가의 지급)\n① 각 중앙관서의 장 또는 계약담당공무원은 공사, 제조, 구매, 용역, 그 밖에 국고의 부담이 되는 계약의 경우 검사를 하거나 검사조서를 작성한 후에 그 대가(代價)를 지급하여야 한다. 다만, 국제관례 등 부득이한 사유가 있다고 인정되는 경우에는 그러하지 아니하다.\n② 제1항에 따른 대가는 계약상대자로부터 대가 지급의 청구를 받은 날부터 대통령령으로 정하는 기한까지 지급하여야 하며, 그 기한까지 대가를 지급할 수 없는 경우에는 대통령령으로 정하는 바에 따라 그 지연일수(遲延日數)에 따른 이자를 지급하여야 한다.\n③ 동일한 계약에서 제2항에 따른 이자와 제26조에 따른 지체상금은 상계(相計)할 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:16","kind":"조문","type":"법률","family":"nca","label":"제16조","title":"대가의 선납","text":"제16조(대가의 선납) 각 중앙관서의 장 또는 계약담당공무원은 재산의 매각ㆍ대부, 용역의 제공, 그 밖에 세입의 원인이 되는 계약에서는 다른 법령에 특별한 규정이 없으면 계약상대자에게 그 대가를 미리 내도록 하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:17","kind":"조문","type":"법률","family":"nca","label":"제17조","title":"공사계약의 담보책임","text":"제17조(공사계약의 담보책임) 각 중앙관서의 장 또는 계약담당공무원은 공사의 도급계약을 체결할 때에는 그 담보책임의 존속기간을 정하여야 한다. 이 경우 그 담보책임의 존속기간은 「민법」 제671조에서 규정한 기간을 초과할 수 없다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:18","kind":"조문","type":"법률","family":"nca","label":"제18조","title":"하자보수보증금","text":"제18조(하자보수보증금)\n① 각 중앙관서의 장 또는 계약담당공무원은 공사의 도급계약의 경우 계약상대자로 하여금 그 공사의 하자보수(瑕疵補修) 보증을 위하여 하자보수보증금을 내도록 하여야 한다. 다만, 대통령령으로 정하는 경우에는 하자보수보증금의 전부 또는 일부의 납부를 면제할 수 있다.\n② 제1항에 따른 하자보수보증금의 금액, 납부시기, 납부방법, 예치기간, 그 밖에 필요한 사항은 대통령령으로 정한다.\n③ 하자보수보증금의 국고 귀속에 관하여는 제12조제3항을 준용한다. 다만, 그 하자의 보수를 위한 예산이 없거나 부족한 경우에는 그 하자보수보증금을 그 하자의 보수를 위하여 직접 사용할 수 있다.\n④ 제3항 단서의 경우에 사용하고 남은 금액은 국고에 납입하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:19","kind":"조문","type":"법률","family":"nca","label":"제19조","title":"물가변동 등에 따른 계약금액 조정","text":"제19조(물가변동 등에 따른 계약금액 조정) 각 중앙관서의 장 또는 계약담당공무원은 공사계약ㆍ제조계약ㆍ용역계약 또는 그 밖에 국고의 부담이 되는 계약을 체결한 다음 물가변동, 설계변경, 그 밖에 계약내용의 변경(천재지변, 전쟁 등 불가항력적 사유에 따른 경우를 포함한다)으로 인하여 계약금액을 조정(調整)할 필요가 있을 때에는 대통령령으로 정하는 바에 따라 그 계약금액을 조정한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:20","kind":"조문","type":"법률","family":"nca","label":"제20조","title":"회계연도 시작 전의 계약체결","text":"제20조(회계연도 시작 전의 계약체결) 각 중앙관서의 장 또는 계약담당공무원은 임차계약ㆍ운송계약ㆍ보관계약 등 그 성질상 중단할 수 없는 계약의 경우 대통령령으로 정하는 바에 따라 「국고금 관리법」 제20조에도 불구하고 회계연도 시작 전에 해당 연도의 확정된 예산의 범위에서 미리 계약을 체결할 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:21","kind":"조문","type":"법률","family":"nca","label":"제21조","title":"계속비 및 장기계속계약","text":"제21조(계속비 및 장기계속계약)\n① 각 중앙관서의 장 또는 계약담당공무원은 「국가재정법」 제23조에 따른 계속비사업에 대하여는 총액과 연부액을 명백히 하여 계속비계약을 체결하여야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 임차, 운송, 보관, 전기ㆍ가스ㆍ수도의 공급, 그 밖에 그 성질상 수년간 계속하여 존속할 필요가 있거나 이행에 수년이 필요한 계약의 경우 대통령령으로 정하는 바에 따라 장기계속계약을 체결할 수 있다. 이 경우 각 회계연도 예산의 범위에서 해당 계약을 이행하게 하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:22","kind":"조문","type":"법률","family":"nca","label":"제22조","title":"단가계약","text":"제22조(단가계약) 각 중앙관서의 장 또는 계약담당공무원은 일정 기간 계속하여 제조, 수리, 가공, 매매, 공급, 사용 등의 계약을 할 필요가 있을 때에는 해당 연도 예산의 범위에서 단가(單價)에 대하여 계약을 체결할 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:23","kind":"조문","type":"법률","family":"nca","label":"제23조","title":"개산계약","text":"제23조(개산계약)\n① 각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 어느 하나에 해당하는 계약으로서 미리 가격을 정할 수 없을 때에는 대통령령으로 정하는 바에 따라 개산계약(槪算契約)을 체결할 수 있다.\n② 제1항에 따른 개산계약의 사후정산의 절차ㆍ기준 등에 관하여 필요한 사항은 대통령령으로 정한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 개산계약을 체결하는 경우 제2항에 따른 사후정산의 절차ㆍ기준 등에 대하여 입찰공고 등을 통하여 입찰참가자에게 미리 알려주어야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:24","kind":"조문","type":"법률","family":"nca","label":"제24조","title":"종합계약","text":"제24조(종합계약)\n① 각 중앙관서의 장 또는 계약담당공무원은 같은 장소에서 다른 관서, 지방자치단체 또는 「공공기관의 운영에 관한 법률」에 따른 공기업 및 준정부기관이 관련되는 공사 등에 대하여 관련 기관과 공동으로 발주하는 계약(이하 \"종합계약\"이라 한다)을 체결할 수 있다.\n② 종합계약을 체결하는 데에 관련되는 기관의 장은 그 계약체결에 필요한 사항에 대하여 협조하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:25","kind":"조문","type":"법률","family":"nca","label":"제25조","title":"공동계약","text":"제25조(공동계약)\n① 각 중앙관서의 장 또는 계약담당공무원은 공사계약ㆍ제조계약 또는 그 밖의 계약에서 필요하다고 인정하면 계약상대자를 둘 이상으로 하는 공동계약을 체결할 수 있다.\n② 제1항에 따라 계약서를 작성하는 경우에는 그 담당 공무원과 계약상대자 모두가 계약서에 기명하고 날인하거나 서명함으로써 계약이 확정된다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:26","kind":"조문","type":"법률","family":"nca","label":"제26조","title":"지체상금","text":"제26조(지체상금)\n① 각 중앙관서의 장 또는 계약담당공무원은 정당한 이유 없이 계약의 이행을 지체한 계약상대자로 하여금 지체상금을 내도록 하여야 한다.\n② 제1항에 따른 지체상금의 금액, 납부방법, 그 밖에 필요한 사항은 대통령령으로 정한다.\n③ 제1항의 지체상금에 관하여는 제18조제3항 단서를 준용한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:27","kind":"조문","type":"법률","family":"nca","label":"제27조","title":"부정당업자의 입찰 참가자격 제한 등","text":"제27조(부정당업자의 입찰 참가자격 제한 등)\n① 각 중앙관서의 장은 다음 각 호의 어느 하나에 해당하는 자(이하 \"부정당업자\"라 한다)에게는 2년 이내의 범위에서 대통령령으로 정하는 바에 따라 입찰 참가자격을 제한하여야 하며, 그 제한사실을 즉시 다른 중앙관서의 장에게 통보하여야 한다. 이 경우 통보를 받은 다른 중앙관서의 장은 대통령령으로 정하는 바에 따라 해당 부정당업자의 입찰 참가자격을 제한하여야 한다.\n② 각 중앙관서의 장은 제1항제2호 또는 제5호에 따라 입찰 참가자격을 제한받은 부정당업자가 「독점규제 및 공정거래에 관한 법률」 제44조에 따라 부당한 공동행위를 한 사실의 자진신고 등을 통하여 시정조치나 과징금을 감경 또는 면제받은 경우에는 대통령령으로 정하는 바에 따라 제1항에 따른 입찰 참가자격 제한처분을 감경 또는 면제할 수 있다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 입찰 참가자격을 제한받은 자와 수의계약을 체결하여서는 아니 된다. 다만, 제1항에 따라 입찰 참가자격을 제한받은 자 외에는 적합한 시공자, 제조자가 존재하지 아니하는 등 부득이한 사유가 있는 경우에는 그러하지 아니하다.\n④ 제1항에도 불구하고 각 중앙관서의 장은 제1항 각 호의 행위가 종료된 때(제5호 및 제6호의 경우에는 중소벤처기업부장관 또는 공정거래위원회로부터 요청이 있었던 때)부터 5년이 지난 경우에는 입찰 참가자격을 제한할 수 없다. 다만, 제2호 및 제7호의 행위에 대하여는 위반행위 종료일부터 7년으로 한다.\n⑤ 각 중앙관서의 장은 제1항에 따라 입찰참가자격을 제한할 경우, 그 제한내용을 대통령령으로 정하는 바에 따라 공개하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:27의2","kind":"조문","type":"법률","family":"nca","label":"제27조의2","title":"과징금","text":"제27조의2(과징금)\n① 각 중앙관서의 장은 제27조제1항에 따라 부정당업자에게 입찰 참가자격을 제한하여야 하는 경우로서 다음 각 호의 어느 하나에 해당하는 경우에는 입찰 참가자격 제한을 갈음하여 다음 각 호의 구분에 따른 금액 이하의 과징금을 부과할 수 있다.\n② 삭제\n③ 제1항에 따른 과징금의 금액과 그 밖에 필요한 사항은 대통령령으로 정한다.\n④ 각 중앙관서의 장은 제1항에 따라 과징금을 부과받은 자가 납부기한까지 내지 아니하면 국세 체납처분의 예에 따라 징수한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:27의3","kind":"조문","type":"법률","family":"nca","label":"제27조의3","title":null,"text":"제27조의3 삭제","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:27의4","kind":"조문","type":"법률","family":"nca","label":"제27조의4","title":"하도급대금 직불조건부 입찰참가","text":"제27조의4(하도급대금 직불조건부 입찰참가)\n① 각 중앙관서의 장은 계약상대자가 「건설산업기본법」 제34조제1항 또는 「하도급거래 공정화에 관한 법률」 제13조제1항이나 제3항을 위반한 사실을 확인한 때에는 해당 계약상대자 및 위반행위를 다른 중앙관서의 장에게 지체 없이 통보하여야 한다.\n② 제1항의 통보가 있는 때에는 각 중앙관서의 장 또는 계약담당공무원은 같은 항의 계약상대자가 통보일부터 1년 이내에 입찰공고일이 도래하는 입찰에 참가하고자 하는 경우 계약상대자가 제15조제1항에 따른 대가 지급 시 하도급대금은 발주기관이 하수급인에게 직접 지급하는 것에 합의한다는 내용의 확약서를 제출하는 경우에 한정하여 입찰참가를 허용하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:27의5","kind":"조문","type":"법률","family":"nca","label":"제27조의5","title":"조세포탈 등을 한 자의 입찰 참가자격 제한","text":"제27조의5(조세포탈 등을 한 자의 입찰 참가자격 제한)\n① 각 중앙관서의 장은 대통령령으로 정하는 조세포탈 등을 한 자로서 유죄판결이 확정된 날부터 2년이 지나지 아니한 자에 대하여 입찰 참가자격을 제한하여야 한다.\n② 제1항에 따라 입찰 참가자격을 제한받은 자와의 수의계약 체결에 관하여는 제27조제3항을 준용한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:28","kind":"조문","type":"법률","family":"nca","label":"제28조","title":"이의신청","text":"제28조(이의신청)\n① 대통령령으로 정하는 금액(국제입찰의 경우 제4조에 따른다) 이상의 정부조달계약 과정에서 해당 중앙관서의 장 또는 계약담당공무원의 다음 각 호의 어느 하나에 해당하는 행위로 불이익을 받은 자는 그 행위를 취소하거나 시정(是正)하기 위한 이의신청을 할 수 있다.\n② 이의신청은 이의신청의 원인이 되는 행위가 있었던 날부터 30일 이내 또는 그 행위가 있음을 안 날부터 25일 이내에 해당 중앙관서의 장에게 하여야 한다.\n③ 해당 중앙관서의 장은 이의신청을 받은 날부터 15일 이내에 심사하여 시정 등 필요한 조치를 하고 그 결과를 신청인에게 통지하여야 한다.\n④ 제3항에 따른 조치에 이의가 있는 자는 통지를 받은 날부터 30일 이내에 제29조에 따른 국가계약분쟁조정위원회에 조정(調停)을 위한 재심(再審)을 청구할 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:28의2","kind":"조문","type":"법률","family":"nca","label":"제28조의2","title":"분쟁해결방법의 합의","text":"제28조의2(분쟁해결방법의 합의)\n① 각 중앙관서의 장 또는 계약담당공무원은 국가를 당사자로 하는 계약에서 발생하는 분쟁을 효율적으로 해결하기 위하여 계약을 체결하는 때에 계약당사자 간 분쟁의 해결방법을 정할 수 있다.\n②제1항에 따른 분쟁의 해결방법은 다음 각 호의 어느 하나 중 계약당사자 간 합의로 정한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:29","kind":"조문","type":"법률","family":"nca","label":"제29조","title":"국가계약분쟁조정위원회","text":"제29조(국가계약분쟁조정위원회)\n① 국가를 당사자로 하는 계약에서 발생하는 분쟁을 심사ㆍ조정하게 하기 위하여 재정경제부에 국가계약분쟁조정위원회(이하 \"위원회\"라 한다)를 둔다.\n② 위원회는 위원장 1명을 포함하여 15명 이내의 위원으로 구성한다.\n③ 위원회의 위원장은 재정경제부장관이 지명하는 고위공무원단에 속하는 공무원이 되고, 위원은 대통령령으로 정하는 중앙행정기관 소속 공무원으로서 해당 기관의 장이 지명하는 사람과 다음 각 호의 어느 하나에 해당하는 사람 중 성별을 고려하여 재정경제부장관이 위촉하는 사람이 된다.\n④ 제3항 각 호의 위촉위원의 임기는 2년으로 하되, 연임할 수 있다.\n⑤ 제3항 각 호의 위촉위원의 사임 등으로 인하여 새로 위촉된 위원의 임기는 전임위원 임기의 남은 기간으로 한다.\n⑥ 제3항 각 호의 위촉위원은 금고 이상의 형의 선고를 받거나 장기간의 심신쇠약으로 직무를 수행할 수 없게 된 때를 제외하고는 임기 중 그 의사에 반하여 해촉되지 아니한다.\n⑦ 위원회의 위원은 그 위원과 직접 이해관계가 있는 안건의 심사ㆍ조정에 참여할 수 없다.\n⑧ 제2항부터 제7항까지에서 규정한 사항 외에 위원회의 운영 및 심사ㆍ조정 절차와 그 밖에 필요한 사항은 대통령령으로 정한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:30","kind":"조문","type":"법률","family":"nca","label":"제30조","title":"계약절차의 중지","text":"제30조(계약절차의 중지)\n① 위원회는 심사ㆍ조정을 시작하는 경우 청구인과 해당 중앙관서의 장에게 그 사실을 통지하여야 한다.\n② 위원회는 해당 중앙관서의 장의 의견을 고려하여 필요하다고 인정하면 조정이 완료될 때까지 해당 입찰 절차를 연기하거나 계약체결을 중지할 것을 명할 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:31","kind":"조문","type":"법률","family":"nca","label":"제31조","title":"심사ㆍ조정","text":"제31조(심사ㆍ조정)\n① 위원회는 특별한 사유가 없으면 심사ㆍ조정청구를 받은 날부터 50일 이내에 심사ㆍ조정하여야 한다.\n② 위원회는 심사ㆍ조정의 완료 전에 청구인 및 해당 중앙관서의 장과 그 대리인에게 의견을 진술할 기회를 주어야 하며, 필요한 경우에는 청구인 및 해당 중앙관서의 장과 그 대리인, 증인 또는 관계 전문가로 하여금 위원회에 출석하게 하여 그 의견을 들을 수 있다.\n③ 제1항에 따른 조정은 청구인과 해당 중앙관서의 장이 조정이 완료된 후 15일 이내에 이의를 제기하지 아니한 경우에는 재판상 화해(和解)와 같은 효력을 갖는다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:32","kind":"조문","type":"법률","family":"nca","label":"제32조","title":"계약담당공무원의 교육","text":"제32조(계약담당공무원의 교육) 정부는 계약담당공무원의 자질향상을 위하여 교육을 할 수 있다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:33","kind":"조문","type":"법률","family":"nca","label":"제33조","title":"계약실적보고서의 제출","text":"제33조(계약실적보고서의 제출) 각 중앙관서의 장은 대통령령으로 정하는 바에 따라 계약실적보고서를 재정경제부장관에게 제출하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:34","kind":"조문","type":"법률","family":"nca","label":"제34조","title":"계약에 관한 법령의 협의","text":"제34조(계약에 관한 법령의 협의) 각 중앙관서의 장은 계약에 관한 법령을 입안할 때에는 재정경제부장관과 미리 협의하여야 한다.","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"art:nca:35","kind":"조문","type":"법률","family":"nca","label":"제35조","title":"벌칙 적용에서의 공무원 의제","text":"제35조(벌칙 적용에서의 공무원 의제) 다음 각 호의 위원회의 위원 중 공무원이 아닌 위원은 「형법」 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다.\n1.\n1.  삭제\n2.\n2.  제29조에 따른 국가계약분쟁조정위원회\n3.\n3.  입찰ㆍ낙찰 또는 계약의 체결ㆍ이행에 관한 사전심사 및 자문 업무를 수행하는 대통령령으로 정하는 위원회","lawId":"nca","group":"국가계약법","확인일":"20260721","시행일":"20260611","상태":"현행"},{"id":"law:nca-e","kind":"법령","type":"시행령","family":"nca","label":"국가계약법 시행령","name":"국가를 당사자로 하는 계약에 관한 법률 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:1","kind":"조문","type":"시행령","family":"nca","label":"제1조","title":null,"text":"제1장 총칙","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:2","kind":"조문","type":"시행령","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 영에서 사용하는 용어의 정의는 다음과 같다.\n1.\n1.  \"추정가격\"이라 함은 물품ㆍ공사ㆍ용역등의 조달계약을 체결함에 있어서 「국가를 당사자로 하는 계약에 관한 법률」(이하 \"법\"이라 한다) 제4조의 규정에 의한 국제입찰 대상여부를 판단하는 기준등으로 삼기 위하여 예정가격이 결정되기 전에 제7조의 규정에 의하여 산정된 가격을 말한다.\n2.\n2.  삭제\n3.\n3.  \"고시금액\"이라 함은 법 제4조제1항 본문의 규정에 의하여 재정경제부장관이 고시한 금액을 말한다.\n4.\n4.  \"공사이행보증서\"라 함은 공사계약에 있어서 계약상대자가 계약상의 의무를 이행하지 못하는 경우 계약상대자를 대신하여 계약상의 의무를 이행할 것을 보증하되, 이를 보증한 기관이 의무를 이행하지 아니하는 경우에는 일정금액을 납부할 것을 보증하는 증서를 말한다.\n5.\n5.  삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:3","kind":"조문","type":"시행령","family":"nca","label":"제3조","title":"다른 법령과의 관계","text":"제3조(다른 법령과의 관계)\n①국가를 당사자로 하는 계약에 관하여는 다른 법령에 특별한 규정이 있는 경우를 제외하고는 이 영이 정하는 바에 의한다.\n②국제입찰에 의할 정부조달계약에 한하여 적용될 사항은 따로 대통령령으로 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:4","kind":"조문","type":"시행령","family":"nca","label":"제4조","title":null,"text":"제4조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:4의2","kind":"조문","type":"시행령","family":"nca","label":"제4조의2","title":"청렴계약의 내용과 체결 절차","text":"제4조의2(청렴계약의 내용과 체결 절차)\n① 법 제5조의2제1항에 따른 청렴계약(이하 \"청렴계약\"이라 한다)에 포함되어야 할 구체적인 내용은 다음 각 호와 같다.\n② 각 중앙관서의 장 또는 법 제6조에 따라 계약사무의 위임ㆍ위탁을 받은 공무원(이하 \"계약담당공무원\"이라 한다)은 입찰자가 입찰서를 제출할 때 법 제5조의2에 따라 체결한 청렴계약의 계약서를 제출하도록 해야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:4의3","kind":"조문","type":"시행령","family":"nca","label":"제4조의3","title":"청렴계약을 위반한 계약의 계속 이행","text":"제4조의3(청렴계약을 위반한 계약의 계속 이행) 각 중앙관서의 장은 법 제5조의3 단서에 따라 청렴계약을 지키지 아니한 해당 계약의 계속 이행을 승인할 때에는 계약 대상물의 성격과 해당 계약의 이행 정도 및 기간 등에 관하여 재정경제부장관이 정하는 기준 등을 고려하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:5","kind":"조문","type":"시행령","family":"nca","label":"제5조","title":"계약관의 대리와 분임 및 임명통지","text":"제5조(계약관의 대리와 분임 및 임명통지)\n①각 중앙관서의 장은 법 제6조제1항의 규정에 의하여 계약에 관한 사무를 담당하는 공무원(이하 \"계약관\"이라 한다)을 임명하였거나 계약관의 사무를 대리 또는 그 일부를 분장하게 한 때에는 그 뜻을 「국고금관리법」 제22조에 규정한 재무관 및 지출관과 감사원에 통지하여야 한다.\n②법 제6조제1항의 규정에 의하여 계약관의 사무의 전부를 대리하는 공무원은 대리계약관, 그 일부를 분장하는 공무원은 분임계약관, 분임계약관의 사무를 대리하는 공무원은 대리분임계약관으로 각각 칭한다.\n③각 중앙관서의 장은 법 제6조제2항의 규정에 의하여 다른 중앙관서소속의 공무원에게 계약관의 사무를 위탁하고자 할 때에는 위탁을 받을 공무원과 위탁하고자 하는 사무의 범위에 대하여 미리 그 중앙관서의 장의 동의를 얻어 위탁하고, 그 뜻을 감사원에 통지하여야 한다. 계약관의 사무의 전부를 대리하거나 그 일부를 분장하는 공무원을 임명하는 경우에도 또한 같다.\n④법 제6조제3항에 의하여 각 중앙관서의 장이 그 소관에 속하는 계약에 관한 사무를 다른 관서에 위탁할 경우에도 제3항의 규정을 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:6","kind":"조문","type":"시행령","family":"nca","label":"제6조","title":"계약담당공무원의 재정보증","text":"제6조(계약담당공무원의 재정보증)\n①각 중앙관서의 장은 법 제6조제5항의 규정에 의하여 소속계약관의 재정보증에 관한 사항을 정하여 운영하여야 한다.\n②제1항의 규정에 의한 재정보증에 관하여 필요한 공통적인 사항은 재정경제부장관이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:7","kind":"조문","type":"시행령","family":"nca","label":"제7조","title":null,"text":"제2장 추정가격 및 예정가격","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:7의2","kind":"조문","type":"시행령","family":"nca","label":"제7조의2","title":"예정가격의 작성방법 등","text":"제7조의2(예정가격의 작성방법 등)\n① 각 중앙관서의 장 또는 계약담당공무원이 법 제8조의2제1항 본문에 따라 예정가격을 작성하는 경우에는 해당 규격서 및 설계서 등에 따라 예정가격을 결정하고 이를 밀봉해 미리 개찰장소 또는 가격협상장소 등에 두어야 하며, 예정가격이 누설되지 않도록 해야 한다.\n② 법 제8조의2제1항 단서에서 \"다른 국가기관 또는 지방자치단체와 계약을 체결하는 경우 등 대통령령으로 정하는 경우\"란 다음 각 호의 구분에 따른 경우를 말한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:8","kind":"조문","type":"시행령","family":"nca","label":"제8조","title":"예정가격의 결정방법","text":"제8조(예정가격의 결정방법)\n①예정가격은 계약을 체결하고자 하는 사항의 가격의 총액에 대하여 이를 결정하여야 한다. 다만, 일정한 기간 계속하여 제조ㆍ공사ㆍ수리ㆍ가공ㆍ매매ㆍ공급ㆍ임차등을 하는 계약의 경우에 있어서는 단가에 대하여 그 예정가격을 결정할 수 있다.\n②공사계약에 있어서 그 이행에 수년이 걸리며 설계서등에 의하여 전체의 사업내용이 확정된 공사(이하 \"장기계속공사\"라 한다) 및 물품의 제조등의 계약에 있어서 그 이행에 수년이 걸리며 설계서 또는 규격서등에 의하여 당해 계약목적물의 내용이 확정된 물품의 제조등(이하 \"장기물품제조등\"이라 한다)의 경우에는 총공사ㆍ총제조등에 대하여 예산상의 총공사금액(관급자재 금액은 제외한다) 또는 총제조금액(관급자재 금액은 제외한다)등의 범위안에서 예정가격을 결정하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:9","kind":"조문","type":"시행령","family":"nca","label":"제9조","title":"예정가격의 결정기준","text":"제9조(예정가격의 결정기준)\n①각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 가격을 기준으로 하여 예정가격을 결정하여야 한다.\n②제1항의 규정에 불구하고 해외로부터 수입하고 있는 군용물자부품을 국산화한 업체와 계약을 체결하려는 경우에는 그 수입가격 등을 고려하여 방위사업청장이 인정한 가격을 기준으로 하여 예정가격을 결정할 수 있다.\n③각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 예정가격을 결정함에 있어서는 계약수량, 이행기간, 수급상황, 계약조건 기타 제반여건을 참작하여야 한다.\n④제1항 내지 제3항외에 예정가격의 결정에 관하여 필요한 사항은 재정경제부장관이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:10","kind":"조문","type":"시행령","family":"nca","label":"제10조","title":null,"text":"제3장 계약의 방법","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:11","kind":"조문","type":"시행령","family":"nca","label":"제11조","title":"경쟁입찰의 성립","text":"제11조(경쟁입찰의 성립) 경쟁입찰은 2인이상의 유효한 입찰로 성립한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:12","kind":"조문","type":"시행령","family":"nca","label":"제12조","title":"경쟁입찰의 참가자격","text":"제12조(경쟁입찰의 참가자격)\n①각 중앙관서의 장 또는 계약담당공무원은 다음 각호의 요건을 갖춘 자에 한하여 경쟁입찰에 참가하게 하여야 한다.\n②「중소기업협동조합법」에 따른 중소기업협동조합이 물품의 제조ㆍ구매ㆍ임차 또는 용역에 관한 경쟁입찰에 참가하는 경우(제1항제2호에 따른 요건을 갖춘 조합원으로 하여금 해당 물품을 제조ㆍ공급 또는 임대하게 하거나 용역을 수행하게 하는 경우로 한정한다)에는 제1항제2호를 적용하지 아니한다.\n③ 법 제27조의5제1항에서 \"대통령령으로 정하는 조세포탈 등을 한 자\"란 다음 각 호의 어느 하나에 해당하는 자를 말한다.\n④ 각 중앙관서의 장 또는 계약담당공무원은 「형의 실효 등에 관한 법률」 제2조제5호에 따른 범죄경력자료의 회보서나 판결문 등의 입증서류를 제출하게 하는 등의 방법으로 계약상대방이 제3항 각 호의 어느 하나에 해당하는지를 계약 체결 전까지 확인하여야 한다.\n⑤ 각 중앙관서의 장 또는 계약담당공무원은 계약상대방이 입찰에 참가할 때에 제4항에 따른 입증서류를 제출하기 어려운 경우에는 제3항 각 호의 어느 하나에 해당하지 아니한다는 사실을 적은 서약서를 제출하게 할 수 있다. 이 경우 서약서에는 서약서에 적은 내용과 다른 사실이 발견된 때에는 계약을 해제ㆍ해지할 수 있고, 부정당업자제재처분을 받을 수 있다는 내용이 포함되어야 한다.\n⑥ 제3항에 해당하는 자에 대한 입찰 참가자격 제한에 관하여는 제76조제5항ㆍ제6항ㆍ제9항 및 제10항을 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:13","kind":"조문","type":"시행령","family":"nca","label":"제13조","title":"입찰참가자격 사전심사","text":"제13조(입찰참가자격 사전심사)\n① 각 중앙관서의 장 또는 계약담당공무원은 입찰참가자의 자격을 미리 심사하여 경쟁입찰에 참가할 수 있는 적격자를 선정할 수 있으며, 적격자를 선정한 경우에는 선정된 적격자에게 선정결과를 통지해야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 입찰참가자의 자격을 심사하는 경우에는 계약이행의 난이도, 이행실적, 기술능력, 재무상태, 사회적 신인도 및 계약이행의 성실도 등 계약수행능력을 평가하는 데에 필요한 요소들을 종합적으로 고려해 심사기준을 정해야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 용역등에 대해 관계법령에서 사업자 선정절차등을 규정하고 있는 경우에는 제2항에도 불구하고 그 절차등에 따라 경쟁입찰에 참가할 수 있는 적격자를 선정할 수 있다.\n④ 각 중앙관서의 장 또는 계약담당공무원은 입찰에 참가하려는 자가 입찰 전에 열람할 수 있도록 다음 각 호의 사항을 적은 서류를 갖추어 두어야 하며, 입찰에 참가하려는 자가 요청하는 경우에는 이를 열람하게 하고 교부해야 한다. 다만, 「전자조달의 이용 및 촉진에 관한 법률」 제2조제4호에 따른 국가종합전자조달시스템(세입의 원인이 되는 경쟁입찰의 경우에는 「국유재산법」 제31조제2항 전단에 따라 재정경제부장관이 지정ㆍ고시하는 정보처리장치를 말하며, 이하 \"전자조달시스템\"이라 한다)에 이를 게재함으로써 열람 및 교부를 갈음할 수 있다.\n⑤ 제1항에 따른 입찰참가자격의 사전심사 절차 및 제2항에 따른 계약이행의 성실도 평가 시 고려요소에 관하여 필요한 사항은 재정경제부령으로 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:14","kind":"조문","type":"시행령","family":"nca","label":"제14조","title":"공사의 입찰","text":"제14조(공사의 입찰)\n① 각 중앙관서의 장 또는 계약담당공무원은 공사를 입찰에 부치려는 때에는 다음 각 호의 서류(이하 \"입찰관련서류\"라 한다)를 작성해야 한다. 다만, 제42조제4항제1호 및 제2호에 따른 공사입찰의 경우에는 입찰에 참가하려는 자에게 제2호에 따른 물량내역서를 직접 작성(중앙관서의 장 또는 계약담당공무원이 교부하는 물량내역 기초자료를 참고하여 작성하는 경우를 포함한다)하게 할 수 있다.\n② 각 중앙관서의 장 또는 계약담당공무원은 보안상 비밀유지가 필요한 경우 외에는 입찰관련서류를 입찰에 참가하려는 자가 열람할 수 있도록 전자조달시스템에 게재해야 한다. 다만, 제1항 각 호 외의 부분 단서에 따라 입찰에 참가하려는 자에게 물량내역서를 작성하게 하는 경우에는 물량내역서를 전자조달시스템에 게재하지 않을 수 있다.\n③ 삭제\n④ 삭제\n⑤ 삭제\n⑥ 공사입찰에 참가하려는 자는 입찰 시 입찰서와 함께 산출내역서를 중앙관서의 장 또는 계약담당공무원에게 제출해야 한다. 다만, 추정가격이 100억원 미만인 공사와 제20조제1항에 따라 재입찰에 부치는 공사의 경우에는 낙찰자로 결정된 후 착공신고서를 제출하는 때에 제출해야 한다.\n⑦ 제6항의 산출내역서는 물량내역서에 단가를 적는 방법으로 작성해야 한다. 다만, 제1항 각 호 외의 부분 단서에 따라 입찰에 참가하려는 자에게 물량내역서를 작성하게 하는 경우에는 직접 작성한 물량내역서에 단가를 적어야 한다.\n⑧장기계속공사의 경우에는 총공사를 대상으로 하여 입찰하게 해야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:14의2","kind":"조문","type":"시행령","family":"nca","label":"제14조의2","title":"공사의 현장설명","text":"제14조의2(공사의 현장설명)\n①각 중앙관서의 장 또는 계약담당공무원은 공사입찰을 하는 경우 그 공사의 성질ㆍ규모 등을 고려하여 실제 공사현장에서 입찰참가자의 적정한 시공을 위한 현장설명을 실시할 수 있다.\n② 삭제\n③제1항에 따른 현장설명은 공사의 규모에 따라 해당입찰서 제출마감일의 전일부터 기산하여 다음 각 호에서 정한 기간 전에 실시해야 한다. 다만, 제35조제4항의 경우에는 그 기간을 단축할 수 있다.\n④ 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:15","kind":"조문","type":"시행령","family":"nca","label":"제15조","title":null,"text":"제15조 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:16","kind":"조문","type":"시행령","family":"nca","label":"제16조","title":"물품의 제조ㆍ구매ㆍ임차 및 용역등의 입찰","text":"제16조(물품의 제조ㆍ구매ㆍ임차 및 용역등의 입찰)\n①각 중앙관서의 장 또는 계약담당공무원은 물품의 제조ㆍ구매ㆍ임차 및 용역등을 입찰에 부치고자 할 때에는 재정경제부령으로 정하는 입찰에 관한 서류를 작성ㆍ비치하여야 하며, 입찰공고일부터 입찰등록마감일까지 입찰에 참가하고자 하는 자의 요청이 있는 경우 이를 열람하게 하여야 한다. 다만, 추정가격이 고시금액이상인 물품의 제조ㆍ구매ㆍ임차 및 용역등의 입찰의 경우에는 입찰에 참가하고자 하는 자의 요구가 있는 경우 이를 교부하여야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 제1항에도 불구하고 입찰에 관한 서류를 전자조달시스템에 게재함으로써 열람 및 교부를 갈음할 수 있다.\n③각 중앙관서의 장 또는 계약담당공무원은 「소프트웨어 진흥법」 제2조제3호에 따른 소프트웨어사업시 계약의 특성상 필요하다고 인정되는 경우에는 물품과 용역을 일괄하여 입찰에 부칠 수 있다.\n④각 중앙관서의 장 또는 계약담당공무원은 제3항에 따라 물품과 용역을 일괄하여 입찰에 부치는 경우 제42조제1항ㆍ제3항, 제43조 및 제43조의3에 따른 낙찰자 결정방법 중에서 계약목적물의 특성에 적합하다고 판단되는 방법을 선택하여 입찰공고시 이를 명시하여야 한다.\n⑤물품의 제조ㆍ구매ㆍ임차 및 용역등의 입찰은 재정경제부령으로 정하는 서식에 의한 입찰서에 의하여야 하며 입찰금액은 총액에 대하여 실시하는 입찰의 경우에는 총액을, 단가에 대하여 실시하는 입찰의 경우에는 단가를 각각 표시하여야 한다.\n⑥제14조제8항의 규정은 장기물품제조등의 경우에 이를 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:17","kind":"조문","type":"시행령","family":"nca","label":"제17조","title":"다량물품의 입찰","text":"제17조(다량물품의 입찰)\n①다량의 물품을 매각할 경우의 일반경쟁입찰은 그 매각수량의 범위안에서 수요자의 매수 희망수량과 그 단가를 입찰하게 할 수 있다.\n②다량의 수요물품을 제조하게 하거나 구매 또는 임차하는 경우의 일반경쟁입찰은 그 수요수량의 범위안에서 공급자가 공급할 희망수량과 그 단가를 입찰하게 할 수 있다.\n③제1항 및 제2항의 규정에 의한 희망수량경쟁입찰 대상의 범위는 재정경제부령으로 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:18","kind":"조문","type":"시행령","family":"nca","label":"제18조","title":"2단계 경쟁등의 입찰","text":"제18조(2단계 경쟁등의 입찰)\n①각 중앙관서의 장 또는 계약담당공무원은 물품의 제조ㆍ구매ㆍ임차계약 또는 용역계약(단순한 노무에 의한 용역으로서 재정경제부령으로 정하는 용역의 계약을 제외한다)에 있어서 미리 적절한 규격등의 작성이 곤란하거나 기타 계약의 특성상 필요하다고 인정되는 경우에는 먼저 규격 또는 기술입찰을 실시한 후 가격입찰을 실시할 수 있다.\n②제1항의 경우 규격 또는 기술입찰을 개찰한 결과 적격자로 확정된 자에 한하여 가격입찰에 참가할 수 있는 자격을 부여하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 제1항 및 제2항의 규정에 불구하고 물품의 제조ㆍ구매ㆍ임차계약 또는 용역계약(단순한 노무에 의한 용역으로서 재정경제부령으로 정하는 용역의 계약을 제외한다)의 특성등에 따라 필요하다고 인정되는 경우에는 규격과 가격 또는 기술과 가격입찰을 동시에 실시할 수 있으며, 이 경우 규격입찰 또는 기술입찰을 개찰한 결과 적격자로 확정된 자에 한하여 가격입찰을 개찰하여야 한다.\n④각 중앙관서의 장은 제1항 내지 제3항의 규정에 의한 입찰을 실시하고자 할 때에는 입찰전에 평가기준 및 절차등을 정하여 입찰에 참가하고자 하는 자가 이를 열람할 수 있도록 하여야 한다.\n⑤제3항의 규정에 의하여 가격입찰서를 개찰한 결과 낙찰자를 결정할 수 없는 경우로서 규격적격자 또는 기술적격자가 2인이상인 때에는 그 규격적격자 또는 기술적격자에게 가격입찰서를 다시 제출하게 할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:19","kind":"조문","type":"시행령","family":"nca","label":"제19조","title":"부대입찰","text":"제19조(부대입찰)\n①각 중앙관서의 장 또는 계약담당공무원은 재정경제부령이 정하는 기준에 해당하는 공사를 입찰에 부치는 때에는 입찰자로 하여금 산출내역서에 입찰금액을 구성하는 공사중 하도급할 부분, 하도급금액 및 하수급인 등 하도급에 관한 사항을 기재하여 제출하게 하여야 한다. 다만, 다음 각호의 1에 해당하는 경우에는 그러하지 아니하다.\n②제1항의 규정에 의하여 하도급에 관한 사항을 기재하게 하는 경우로서 장기계속 공사의 경우에는 총공사 입찰금액에 대하여 기재하게 하여야 한다. 다만, 공사의 이행기간을 고려하여 필요하다고 인정되는 경우에는 제1차년도에 이행하게 할 공사의 입찰금액에 한하여 기재하게 할 수 있다.\n③제1항의 규정에 의한 부대입찰의 절차 그 밖에 필요한 사항은 재정경제부장관이 정하여 고시한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:20","kind":"조문","type":"시행령","family":"nca","label":"제20조","title":"재입찰 및 재공고입찰","text":"제20조(재입찰 및 재공고입찰)\n①경쟁입찰을 할 때 2인 이상의 유효한 입찰자가 없거나 낙찰자가 없을 경우 재입찰에 부칠 수 있다. 이 경우 재입찰은 새로운 입찰로 보지 않으며, 입찰자 또는 입찰횟수의 제한을 받지 않는다.\n②입찰자나 낙찰자가 없는 경우 또는 낙찰자가 계약을 체결하지 않는 경우에는 재공고입찰에 부칠 수 있다.\n③제1항 또는 제2항에 따른 재입찰 또는 재공고입찰시에는 기한을 제외하고는 최초의 입찰에 부칠 때에 정한 가격 및 기타 조건을 변경할 수 없다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:21","kind":"조문","type":"시행령","family":"nca","label":"제21조","title":"제한경쟁입찰에 의할 계약과 제한사항등","text":"제21조(제한경쟁입찰에 의할 계약과 제한사항등)\n①법 제7조제1항 단서에 따라 경쟁참가자의 자격을 제한할 수 있는 경우와 그 제한사항은 다음 각 호와 같다. 이 경우 제1호부터 제6호까지 및 제9호의 제한사항에 대한 구체적인 제한기준은 재정경제부령으로 정한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 경쟁참가자의 자격을 제한하고자 할 때에는 입찰공고에 그 제한사항과 제한기준을 명시하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 공사입찰로서 제1항제6호의 규정에 의하여 경쟁참가자의 자격을 제한하는 경우에 필요하다고 인정할 때에는 재정경제부령이 정하는 바에 의하여 당해 입찰참가적격자에게 제36조 각호의 사항을 통지함으로써 제2항의 규정에 의한 입찰공고에 갈음할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:22","kind":"조문","type":"시행령","family":"nca","label":"제22조","title":"공사의 성질별ㆍ규모별 제한에 의한 입찰","text":"제22조(공사의 성질별ㆍ규모별 제한에 의한 입찰)\n①각 중앙관서의 장 또는 계약담당공무원은 공사를 성질별ㆍ규모별로 유형화하여 이에 상응하는 경쟁제한기준을 정하고 이를 미리 전자조달시스템에 공고하여 경쟁참가적격자로 하여금 등록신청을 하게 할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의한 등록신청을 받은 때에는 이를 심사하여 유형별ㆍ등급별로 경쟁참가적격자를 선정하여 등록을 하고 공사 입찰시마다 당해 경쟁참가적격자에게 제36조 각호의 사항을 통지하여 입찰참가신청을 하게 할 수 있다.\n③각 중앙관서의 장은 제1항의 규정에 의하여 경쟁제한기준을 정하고자 할 때에는 재정경제부장관과 협의하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:23","kind":"조문","type":"시행령","family":"nca","label":"제23조","title":"지명경쟁입찰에 의할 계약","text":"제23조(지명경쟁입찰에 의할 계약)\n①법 제7조제1항 단서에 따라 지명경쟁입찰에 부칠 수 있는 경우는 다음 각 호와 같다.\n②각 중앙관서의 장의 위임을 받은 공무원은 제1항제1호의 규정에 의하여 지명경쟁입찰에 의하여 계약을 체결한 때에는 그 내용을 소속중앙관서의 장에게 보고하여야 하며, 각 중앙관서의 장은 이를 감사원에 통지하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:24","kind":"조문","type":"시행령","family":"nca","label":"제24조","title":"지명경쟁입찰 대상자의 지명","text":"제24조(지명경쟁입찰 대상자의 지명)\n①각 중앙관서의 장 또는 계약담당공무원은 제23조의 규정에 의하여 지명경쟁입찰에 부치고자 할 때에는 5인이상의 입찰대상자를 지명하여 2인이상의 입찰참가신청이 있어야 한다. 다만, 지명대상자가 5인미만인 때에는 대상자를 모두 지명하여야 한다.\n②제1항의 경우에는 제36조 각호의 사항을 각 입찰대상자에게 통지하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 입찰대상자를 지명하고자 할 때에는 재정경제부령이 정하는 바에 의하여 이를 통지하고 입찰참가여부를 확인하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:25","kind":"조문","type":"시행령","family":"nca","label":"제25조","title":"유사물품의 복수경쟁","text":"제25조(유사물품의 복수경쟁) 각 중앙관서의 장 또는 계약담당공무원은 품질ㆍ성능 또는 효율등에 차이가 있는 유사한 종류의 물품중에서 품질ㆍ성능 또는 효율등이 일정수준이상인 물품을 지정하여 제조하게 하거나 구매 또는 임차하는 경우에는 복수경쟁에 부칠 수 있다. 이 경우 유사한 종류의 물품별로 작성된 예정가격에 대한 입찰금액의 비율이 가장 낮은 입찰자를 낙찰자로 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:26","kind":"조문","type":"시행령","family":"nca","label":"제26조","title":"수의계약에 의할 수 있는 경우","text":"제26조(수의계약에 의할 수 있는 경우)\n① 법 제7조제1항 단서에 따라 수의계약을 할 수 있는 경우는 다음 각 호와 같다.\n② 각 중앙관서의 장 또는 계약담당공무원은 제1항제3호 각 목의 제품을 제조하게 하거나 구매 또는 임차하는 경우에는 주무부장관(주무부장관으로부터 위임받은 자를 포함한다)의 해당 물품에 대한 인증 또는 지정 등이 유효한 기간(유효한 기간이 연장된 경우에는 연장된 기간까지 포함한다. 이하 이 항에서 같다)의 범위에서 수의계약을 체결할 수 있다. 다만, 해당 물품에 대한 인증 또는 지정 등이 유효한 기간이 6년을 넘는 경우에는 6년까지만 수의계약을 체결할 수 있다.\n③각 중앙관서의 장 또는 계약담당공무원은 제1항제4호에 따라 수의계약에 의하는 경우에는 다음 각 호의 사항을 확인해야 한다.\n④각 중앙관서의 장 또는 계약담당공무원은 수의계약 대상자를 감독하는 주무부처의 장에게 제3항 각 호의 사항의 확인에 필요한 협조를 요청할 수 있다.\n⑤계약담당공무원은 제1항제1호다목ㆍ라목, 같은 항 제2호, 제4호나목ㆍ다목 및 제5호다목ㆍ마목에 따라 수의계약을 체결한 때에는 그 내용을 소속중앙관서의 장에게 보고해야 하며, 각 중앙관서의 장은 보고받은 사항 중 제1항제2호에 따른 계약에 대해서는 이를 감사원에 통지해야 한다.\n⑥ 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:27","kind":"조문","type":"시행령","family":"nca","label":"제27조","title":"재공고입찰과 수의계약","text":"제27조(재공고입찰과 수의계약)\n①경쟁입찰을 실시한 결과 다음 각호의 1에 해당하는 경우에는 수의계약에 의할 수 있다.\n②제1항의 규정에 의한 수의계약의 경우 보증금과 기한을 제외하고는 최초의 입찰에 부칠 때에 정한 가격 및 기타 조건을 변경할 수 없다. 다만, 제79조제1항제5호에 따른 일괄입찰 또는 제98조제3호에 따른 기본설계 기술제안입찰로 발주하는 공사에 대해 경쟁입찰을 한 후 물가변동으로 인해 각 중앙관서의 장이 「국가재정법」 제50조제5항에 따른 총사업비 관리에 관한 지침에 따라 해당 공사의 총사업비를 조정한 경우에는 최초의 입찰에 부칠 때에 정한 가격을 변경할 수 있다.\n③ 제1항제1호에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 제10조에 따라 경쟁입찰을 실시했으나 입찰자가 1인뿐인 경우 제20조제2항에 따른 재공고입찰을 실시하지 않더라도 수의계약을 할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:28","kind":"조문","type":"시행령","family":"nca","label":"제28조","title":"낙찰자가 계약을 체결하지 아니할 때의 수의계약","text":"제28조(낙찰자가 계약을 체결하지 아니할 때의 수의계약)\n①낙찰자가 계약을 체결하지 아니할 때에는 그 낙찰금액보다 불리하지 아니한 금액의 범위안에서 수의계약에 의할 수 있다. 다만, 기한을 제외하고는 최초의 입찰에 부칠 때 정한 가격 및 기타 조건을 변경할 수 없다.\n②제1항의 규정은 낙찰자가 계약체결후 소정의 기일내에 계약의 이행에 착수하지 아니하거나, 계약이행에 착수한 후 계약상의 의무를 이행하지 아니하여 계약을 해제 또는 해지한 경우에 이를 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:29","kind":"조문","type":"시행령","family":"nca","label":"제29조","title":"분할수의계약","text":"제29조(분할수의계약) 제26조제1항제5호라목, 제27조 및 제28조의 경우에 있어서는 예정가격 또는 낙찰금액을 분할하여 계산할 수 있는 경우에 한하여 그 가격 또는 금액보다 불리하지 아니한 금액의 범위안에서 수인에게 분할하여 계약을 할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:30","kind":"조문","type":"시행령","family":"nca","label":"제30조","title":"견적에 의한 가격결정 등","text":"제30조(견적에 의한 가격결정 등)\n①각 중앙관서의 장 또는 계약담당공무원은 수의계약을 체결하려는 경우에는 2인 이상으로부터 견적서를 받아야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 1인으로부터 받은 견적서에 의할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 제26조제1항제5호가목에 따른 수의계약 중 추정가격이 2천만원[같은 조 제1항제5호가목5)가)부터 다)까지의 어느 하나에 해당하는 자와 계약을 체결하는 경우에는 5천만원]을 초과하는 수의계약의 경우에는 전자조달시스템을 이용하여 견적서를 제출하도록 해야 한다. 다만, 계약의 목적이나 특성상 전자조달시스템에 의한 견적서제출이 곤란한 경우로서 재정경제부령으로 정하는 경우에는 그렇지 않다.\n③각 중앙관서의 장 또는 계약담당공무원은 제2항 본문에 따라 전자조달시스템을 이용하여 견적서를 제출하도록 하는 경우 그 견적서의 제출에 관한 사항은 전자조달시스템을 이용하여 안내공고를 하여야 한다.\n④각 중앙관서의 장 또는 계약담당공무원은 제2항에 따른 수의계약을 할 경우 계약이행의 용이성 및 효율성 등을 고려하여 필요하다고 인정되는 경우에는 견적서를 제출할 수 있는 자를 재정경제부령으로 정하는 바에 따라 법인등기부상 본점소재지를 기준으로 하여 제한할 수 있다. 이 경우 제3항에 따른 안내공고에 그 제한사항과 제한기준을 명시하여야 한다.\n⑤재정경제부장관은 제2항에 따른 전자조달시스템을 이용한 견적서의 제출과 관련한 기준 및 세부절차, 제3항에 따른 안내공고의 시기 및 기간 등에 관하여 필요한 사항을 정할 수 있다.\n⑥제1항 또는 제2항에 따라 제출받은 견적서에 기재된 견적가격이 예정가격(제7조의2제2항에 따라 예정가격작성을 생략한 경우에는 추정가격에 부가가치세를 포함한 금액을 말한다)의 범위에 포함되지 아니하는 경우 등 계약상대자를 결정할 수 없는 때에는 다시 견적서를 제출받아 계약금액을 결정하여야 한다.\n⑦제1항ㆍ제2항 및 제6항에도 불구하고 재정경제부령으로 정하는 경우에는 견적서제출을 생략하게 할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:31","kind":"조문","type":"시행령","family":"nca","label":"제31조","title":"계속공사에 대한 수의계약시의 계약금액","text":"제31조(계속공사에 대한 수의계약시의 계약금액) 계속공사(제26조제1항제2호가목부터 다목까지의 규정에 따라 직전 또는 현재의 시공자와 수의계약을 체결할 수 있는 공사를 말한다)에 있어서 해당 공사 이후의 계약금액은 예정가격에 제1차공사의 낙찰률(예정가격에 대한 낙찰금액 또는 계약금액의 비율을 말한다)을 곱한 금액이하로 해야 한다. 다만, 재정경제부장관이 정하는 경우에는 그렇지 않다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:32","kind":"조문","type":"시행령","family":"nca","label":"제32조","title":"경쟁계약에 관한 규정의 준용","text":"제32조(경쟁계약에 관한 규정의 준용) 수의계약의 체결에 관하여는 제12조제1항 및 제3항부터 제6항까지의 규정을 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:33","kind":"조문","type":"시행령","family":"nca","label":"제33조","title":null,"text":"제4장 입찰 및 낙찰절차","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:34","kind":"조문","type":"시행령","family":"nca","label":"제34조","title":"입찰참가의 통지","text":"제34조(입찰참가의 통지) 각 중앙관서의 장 또는 계약담당공무원은 국가의 보안유지를 위하여 필요한 때에는 제33조의 규정에 불구하고 재정경제부령이 정하는 바에 의하여 당해 입찰참가적격자에게 제36조의 사항을 통지하여 입찰참가신청을 하게 할 수 있다. 이 경우 통지시기에 관하여는 제35조의 규정을 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:35","kind":"조문","type":"시행령","family":"nca","label":"제35조","title":"입찰공고의 시기","text":"제35조(입찰공고의 시기)\n①입찰공고는 입찰서 제출마감일의 전일부터 기산하여 7일전에 이를 행하여야 한다.\n②공사입찰의 경우로서 제14조의2제1항에 따른 현장설명을 실시하는 경우에는 현장설명일의 전일부터 기산하여 7일전에 공고해야 한다. 다만, 제13조에 따라 입찰참가자격을 사전에 심사하려는 공사입찰의 경우에는 현장설명일 전일부터 기산하여 30일전에 공고해야 한다.\n③공사입찰의 경우로서 현장설명을 실시하지 아니하는 때에는 입찰서 제출마감일의 전일부터 기산하여 다음 각 호에서 정한 기간 전에 공고하여야 한다.\n④ 제1항부터 제3항까지의 규정에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 입찰서 제출마감일의 전날부터 기산하여 5일 전까지 공고할 수 있다.\n⑤제43조에 따른 협상에 의한 계약 또는 제43조의3에 따른 경쟁적 대화에 의한 계약의 경우에는 제1항 및 제4항에도 불구하고 제안서 제출마감일의 전날부터 기산하여 40일 전에 공고하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 제안서 제출마감일의 전날부터 기산하여 10일 전까지 공고할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:36","kind":"조문","type":"시행령","family":"nca","label":"제36조","title":"입찰공고의 내용","text":"제36조(입찰공고의 내용) 입찰공고에는 다음 각 호의 사항을 명시해야 한다.\n1.\n1.  입찰에 부치는 사항\n2.\n2.  입찰 또는 개찰의 장소와 일시\n3.\n3.  공사입찰의 경우에는 현장설명의 장소ㆍ일시 및 참가자격에 관한 사항\n3.\n2\n3의2.  제43조에 따른 협상에 의한 계약체결의 경우로서 제안요청서에 대한 설명을 실시하는 경우에는 그 장소 및 일시에 관한 사항\n4.\n4.  입찰참가자의 자격에 관한 사항\n4.\n2\n4의2.  입찰참가등록 및 입찰관련서류에 관한 사항\n5.\n5.  입찰보증금과 국고귀속에 관한 사항\n6.\n6.  낙찰자결정방법(제42조제1항 또는 제4항에 따라 낙찰자를 결정하는 경우에는 낙찰자결정에 필요한 서류의 제출일 및 낙찰자통보예정일을 포함한다)\n7.\n7.  계약의 착수일 및 완료일\n8.\n8.  계약하고자 하는 조건을 공시하는 장소\n9.\n9.  제39조제4항의 규정에 의한 입찰무효에 관한 사항\n10.\n10.  입찰에 관한 서류의 열람ㆍ교부장소 및 교부비용\n11.\n11.  추가정보를 입수할 수 있는 기관의 주소등\n12.\n12.  제39조제1항에 따라 전자조달시스템 또는 각 중앙관서의 장이 지정ㆍ고시한 정보처리장치를 이용하여 입찰서를 제출하게 하는 경우에는 그 절차 및 방법\n12.\n2\n12의2.  제39조제2항에 따라 입찰서를 우편으로 제출하게 하는 경우에는 그 취지와 입찰서를 송부할 주소\n13.\n13.  제72조의 규정에 의한 공동계약을 허용하는 경우에는 공동계약이 가능하다는 뜻(제72조제3항 및 제4항의 규정에 의한 공동계약인 경우에는 공동수급체구성원의 자격제한사항을 포함한다)과 공동계약의 이행방식\n14.\n14.  제19조의 규정에 의한 부대입찰의 경우에는 그 취지\n15.\n15.  제78조의 규정에 의한 입찰의 경우에는 대안입찰 또는 일괄입찰등에 관한 사항\n15.\n2\n15의2.  입찰 관련 비리 또는 불공정행위의 신고에 관한 사항\n16.\n16.  제9조제1항제2호에 따른 예정가격 결정과 관련하여 계약의 목적이 되는 물품ㆍ공사ㆍ용역등을 구성하는 재료비ㆍ노무비ㆍ경비의 책정기준, 일반관리비율 및 이윤율 등 재정경제부장관이 정하는 기준 및 비율\n17.\n17.  기타 입찰에 관하여 필요한 사항","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:37","kind":"조문","type":"시행령","family":"nca","label":"제37조","title":"입찰보증금","text":"제37조(입찰보증금)\n①법 제9조에 따른 입찰보증금은 입찰금액(단가에 대해 실시하는 입찰인 경우에는 그 단가에 매회별 이행예정량 중 최대량을 곱한 금액. 이하 이 항에서 같다)의 100분의 5 이상으로 해야 한다. 다만, 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 입찰보증금을 입찰금액의 1천분의 25 이상으로 할 수 있다.\n②입찰보증금은 현금(체신관서 또는 「은행법」의 적용을 받는 은행이 발행한 자기앞수표를 포함한다. 이하 같다) 또는 다음 각 호의 보증서등으로 납부하게 해야 한다.\n③법 제9조제1항 단서에 따라 입찰보증금의 전부 또는 일부의 납부를 면제할 수 있는 자는 다음 각 호와 같다.\n④각 중앙관서의 장 또는 계약담당공무원은 제3항에 따라 입찰보증금의 전부 또는 일부의 납부를 면제받은 자로 하여금 법 제9조제3항에 따른 국고귀속사유가 발생한 때에는 입찰보증금에 해당하는 금액을 납입할 것을 보장하기 위해 그 지급을 확약하는 내용의 문서를 제출하게 해야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:38","kind":"조문","type":"시행령","family":"nca","label":"제38조","title":"입찰보증금의 국고귀속","text":"제38조(입찰보증금의 국고귀속)\n①각 중앙관서의 장 또는 계약담당공무원은 제37조제2항의 규정에 의하여 입찰보증금을 보증서등으로 받은 경우 법 제9조제3항의 규정에 의한 입찰보증금의 국고귀속사유가 발생한 때에는 지체없이 그 뜻을 제37조제2항 각호의 해당 금융기관 또는 보증기관과 관계수입징수관 또는 유가증권취급공무원등에게 통지하고 재정경제부령이 정하는 바에 의하여 당해 입찰보증금을 현금으로 징수하게 하거나 정부소유유가증권으로 전환하게 하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 법 제9조제1항 단서의 규정에 의하여 입찰보증금의 전부 또는 일부의 납부를 면제받은 자에게 법 제9조제3항의 규정에 의한 국고귀속사유가 발생한 때에는 그 뜻과 함께 제37조제4항의 규정에 의하여 지급을 확약한 문서를 갖추어 관계수입징수관에게 통지하고 당해 낙찰자로부터 입찰보증금에 상당하는 금액을 현금으로 징수하게 하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:39","kind":"조문","type":"시행령","family":"nca","label":"제39조","title":"입찰서의 제출ㆍ접수 및 입찰의 무효","text":"제39조(입찰서의 제출ㆍ접수 및 입찰의 무효)\n① 각 중앙관서의 장 또는 계약담당공무원은 입찰자가 입찰서를 제출하는 경우 전자조달시스템을 이용하여 입찰서를 제출하게 하여야 한다. 다만, 미리 재정경제부장관과 협의한 경우에는 전자조달시스템 외에 각 중앙관서의 장이 지정ㆍ고시한 정보처리장치를 이용하여 입찰서를 제출하게 할 수 있다.\n② 각 중앙관서의 장 또는 계약담당공무원은 제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 입찰서를 입찰공고에 명시한 장소와 일시에 직접 또는 우편으로 제출하게 할 수 있다.\n③입찰자는 제출한 입찰서를 교환ㆍ변경 또는 취소하지 못한다. 다만, 재정경제부장관이 정하는 경우에는 그러하지 아니하다.\n④제12조 및 제21조의 규정에 의한 경쟁참가의 자격이 없는 자가 행한 입찰 기타 재정경제부령이 정하는 사유에 해당하는 입찰은 무효로 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:40","kind":"조문","type":"시행령","family":"nca","label":"제40조","title":"개찰 및 낙찰선언","text":"제40조(개찰 및 낙찰선언)\n①각 중앙관서의 장 또는 계약담당공무원은 입찰공고에 표시한 장소와 일시에 입찰자가 참석한 자리에서 개찰하여야 한다. 이 경우 입찰자로서 출석하지 아니한 자가 있는 때에는 입찰사무에 관계없는 공무원으로 하여금 개찰에 참여하게 할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 제출된 입찰서를 확인하고 유효한 입찰서의 입찰금액과 예정가격을 대조하여 적격자를 낙찰자로 결정한 때에는 지체없이 낙찰선언을 하여야 한다. 다만, 제42조제1항에 따라 계약이행능력 및 일자리창출 실적 등을 심사하여 낙찰자를 결정하거나 제42조제4항에 따라 각 입찰자의 입찰가격, 공사수행능력 및 사회적 책임 등을 종합적으로 심사하여 낙찰자를 결정하는 등 낙찰자결정에 장시간이 소요되는 때에는 그 절차를 거친 후 낙찰선언을 할 수 있다.\n③제39조제1항에 따라 전자조달시스템 또는 각 중앙관서의 장이 지정ㆍ고시한 정보처리장치를 이용하여 입찰서를 제출하는 방식의 경우에는 제1항 및 제2항의 규정에 불구하고 입찰공고에 표시한 절차와 방법에 의하여 개찰 및 낙찰선언을 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:41","kind":"조문","type":"시행령","family":"nca","label":"제41조","title":"세입이 되는 경쟁입찰에서의 낙찰자 결정","text":"제41조(세입이 되는 경쟁입찰에서의 낙찰자 결정) 세입의 원인이 되는 경쟁입찰에 있어서는 예정가격이상으로서 최고가격으로 입찰한 자를 낙찰자로 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:42","kind":"조문","type":"시행령","family":"nca","label":"제42조","title":"국고의 부담이 되는 경쟁입찰에서의 낙찰자 결정","text":"제42조(국고의 부담이 되는 경쟁입찰에서의 낙찰자 결정)\n①각 중앙관서의 장 또는 계약담당공무원은 국고의 부담이 되는 경쟁입찰의 경우에는 예정가격 이하로서 최저가격으로 입찰한 자의 순으로 계약이행능력 및 재정경제부장관이 정하는 일자리창출 실적 등을 심사하여 낙찰자를 결정한다.\n② 삭제\n③각 중앙관서의 장 또는 계약담당공무원은 제1항에 불구하고 제18조에 따른 입찰의 경우에는 예정가격 이하로서 최저가격으로 입찰한 자를 낙찰자로 결정한다.\n④ 각 중앙관서의 장 또는 계약담당공무원은 제1항에도 불구하고 다음 각 호의 공사 또는 용역입찰에 대해서는 예정가격 이하로 입찰한 입찰자 중 각 입찰자의 입찰가격, 공사수행능력(용역입찰의 경우에는 용역수행능력을 말하며, 제40조제2항 단서 및 이하에서 같다) 및 사회적 책임 등을 종합 심사하여 합산점수가 가장 높은 자를 낙찰자로 결정한다.\n⑤제1항에 따른 계약이행능력심사는 해당 입찰자의 이행실적, 기술능력, 재무상태, 과거 계약이행 성실도, 자재 및 인력조달가격ㆍ하도급관리계획ㆍ외주근로자 근로조건 이행계획의 적정성, 계약질서의 준수정도, 과거공사의 품질정도 및 입찰가격등을 종합적으로 고려하여 재정경제부장관이 정하는 심사기준에 따라 세부심사기준을 정하여 적격여부를 심사하며, 그 심사결과 적격하다고 인정되는 경우 당해 입찰자를 낙찰자로 결정한다. 다만, 공사 또는 물품등의 특성상 필요하다고 인정되는 경우에는 각 중앙관서의 장이 재정경제부장관과의 협의를 거쳐 직접 심사기준을 정할 수 있다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 제4항에 따른 종합 심사를 실시하려는 경우 입찰자의 계약이행실적, 인력배치계획, 사회적 책임 이행 노력 및 입찰가격 등을 종합적으로 고려하여 재정경제부장관이 정하는 심사기준에 따라 세부심사기준을 정하고, 입찰 전에 입찰에 참가하려는 자가 그 기준을 열람할 수 있도록 해야 한다.\n⑦각 중앙관서의 장 또는 계약담당공무원은 제4항에 따라 각 입찰자의 입찰가격, 공사수행능력 및 사회적 책임 등을 종합 심사하기 위해 종합심사낙찰제심사위원회(이하 이 조에서 \"위원회\"라 한다)를 둘 수 있다.\n⑧위원회는 각 중앙관서별로 그 중앙관서의 소속공무원(「조달사업에 관한 법률 시행령」 제11조에 따라 공사계약의 체결을 조달청장에게 요청한 경우에는 수요기관의 소속공무원을 포함한다), 계약에 관한 학식과 경험이 풍부한 자 등으로 구성하며, 위원회의 구성 및 운영에 관하여 필요한 세부사항은 각 중앙관서의 장이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:43","kind":"조문","type":"시행령","family":"nca","label":"제43조","title":"협상에 의한 계약체결","text":"제43조(협상에 의한 계약체결)\n①각 중앙관서의 장 또는 계약담당공무원은 물품ㆍ용역계약을 할 때 계약이행의 전문성ㆍ기술성ㆍ긴급성, 공공시설물의 안전성 및 그 밖에 국가안보목적등의 이유로 필요하다고 인정되는 경우에는 제42조에도 불구하고 다수의 공급자들로부터 제안서를 제출받아 평가하여 협상적격자를 선정한 후 협상절차를 통해 국가에 가장 유리하다고 인정되는 자와 계약을 체결할 수 있다. 이 경우 예정가격을 작성한 경우에는 예정가격 이하로 입찰한 자 중에서 협상적격자를 선정해야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항에 따른 계약을 체결하고자 하는 경우에는 입찰공고시 협상에 의한 계약이라는 뜻을 명시하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 협상에 의한 계약에 참가하고자 하는 자에게 제안요청서등 필요한 서류를 교부하여야 한다.\n④각 중앙관서의 장 또는 계약담당공무원은 제안요청서 등 필요한 서류를 전자조달시스템에 게재함으로써 제3항에 따른 제안요청서 등 필요한 서류의 교부에 갈음할 수 있다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 계약을 체결하려는 경우 그 계약의 성질ㆍ규모 등을 고려하여 필요하다고 인정되는 경우에는 제안요청서 등에 대한 설명을 할 수 있다.\n⑥ 삭제\n⑦각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 협상에 의한 계약을 체결하려는 경우에는 해당계약을 체결하려는 자의 이행실적, 기술능력, 사업수행계획, 재무상태 및 입찰가격 등을 종합적으로 고려하여 재정경제부장관이 정하는 계약체결기준에 따라 세부기준을 정하고, 계약을 체결하려는 자가 그 기준을 열람할 수 있도록 해야 한다. 다만, 「방위사업법」에 따른 방위력개선사업 수행을 위해 협상에 의한 계약을 체결하려는 경우에는 그 계약체결기준 및 절차는 방위사업청장이 정한다.\n⑧각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 제안서를 평가하는 경우에는 제안서평가위원회(이하 이 조에서 \"위원회\"라 한다)의 심의를 거쳐야 한다. 다만, 「방위사업법」에 따른 방위력개선사업과 관련하여 협상에 의한 계약을 체결하려는 경우에는 「국방과학기술혁신 촉진법 시행령」 제3조제6항에 따른 연구개발사업제안서 평가팀의 심의로 위원회의 심의를 갈음할 수 있다.\n⑨위원회는 각 중앙관서별로 그 중앙관서의 소속공무원, 계약에 관한 학식과 경험이 풍부한 자 등으로 구성하며, 위원회의 구성 및 운영에 관하여 필요한 세부사항은 각 중앙관서의 장이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:43의2","kind":"조문","type":"시행령","family":"nca","label":"제43조의2","title":"지식기반사업의 계약방법","text":"제43조의2(지식기반사업의 계약방법)\n①각 중앙관서의 장 또는 계약담당공무원은 정보과학기술 등 집약도가 높은 지식을 활용하여 고부가가치를 창출하는 사업중 다음 각호의 1에 해당하는 사업(이하 \"지식기반사업\"이라 한다)에 대한 계약을 체결하는 경우에는 제43조의 규정에 따라 협상에 의한 계약체결방법을 우선적으로 적용할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 협상에 의한 계약을 체결하고자 하는 경우에는 재정경제부장관이 정하는 제안서 평가방법 및 협상절차 등에 따라 세부기준을 정하여 그 계약을 체결하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:43의3","kind":"조문","type":"시행령","family":"nca","label":"제43조의3","title":"경쟁적 대화에 의한 계약체결","text":"제43조의3(경쟁적 대화에 의한 계약체결)\n① 각 중앙관서의 장 또는 계약담당공무원은 전문성ㆍ기술성이 요구되는 물품 또는 용역계약으로서 다음 각 호의 어느 하나에 해당하는 경우에는 제42조에도 불구하고 입찰대상자들과 계약목적물의 세부내용 등에 관한 경쟁적ㆍ기술적 대화(이하 \"경쟁적 대화\"라 한다)를 통하여 계약목적물의 세부내용 및 계약이행방안 등을 조정ㆍ확정한 후 제안서를 제출받고 이를 평가하여 국가에 가장 유리하다고 인정되는 자와 계약을 체결할 수 있다. 이 경우 예정가격을 작성한 경우에는 예정가격 이하로 계약을 체결해야 한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따른 계약을 체결하려는 경우에는 입찰공고 시 경쟁적 대화에 의한 계약이라는 뜻을 명시하여야 한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 경쟁적 대화를 하기 전에 입찰대상자의 제안 내용 등을 심사하여 경쟁적 대화에 참여할 입찰대상자를 선정하여야 한다.\n④ 각 중앙관서의 장 또는 계약담당공무원은 경쟁적 대화를 통하여 확정된 제안요청서 등 필요한 서류를 경쟁적 대화에 참여한 입찰대상자에게 내주어야 한다.\n⑤ 각 중앙관서의 장 또는 계약담당공무원은 경쟁적 대화에 참여하고 제안서를 제출한 자 중 낙찰자로 선정되지 아니한 참여자에게 예산의 범위에서 경쟁적 대화 참여비용의 전부 또는 일부를 지급할 수 있다.\n⑥ 경쟁적 대화에 의한 계약 체결 시 제안요청서에 대한 설명, 세부적인 계약체결기준 및 제안서 평가 등에 관하여는 제43조제4항, 제5항 및 제7항부터 제9항까지의 규정을 준용한다. 이 경우 \"협상에 의한 계약\"은 \"경쟁적 대화에 의한 계약\"으로 본다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 경쟁적 대화의 방법, 절차, 참여비용의 지급 등에 필요한 사항은 재정경제부장관이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:44","kind":"조문","type":"시행령","family":"nca","label":"제44조","title":"품질등에 의한 낙찰자의 결정","text":"제44조(품질등에 의한 낙찰자의 결정)\n①각 중앙관서의 장 또는 계약담당공무원은 물품의 제조ㆍ구매 또는 임차계약에 있어서 필요하다고 인정할 경우에는 제42조의 규정에 불구하고 당해 물품의 입찰가격외에 품질등을 종합적으로 참작하여 예정가격 이하로서 가장 경제성이 있는 가격으로 입찰한 자를 낙찰자로 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 낙찰자를 결정하고자 할 경우에는 당해 물품에 대한 품질등의 평가기준을 입찰전에 결정하여 입찰참가자로 하여금 이를 열람하게 하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:45","kind":"조문","type":"시행령","family":"nca","label":"제45조","title":"다량물품을 매각할 경우의 낙찰자 결정","text":"제45조(다량물품을 매각할 경우의 낙찰자 결정) 제17조제1항의 규정에 의하여 다량의 물품을 희망수량에 따라 분할하여 매각하고자 할 경우에는 제41조의 규정에 불구하고 예정가격이상의 단가로 입찰한 자중 최고가격으로 입찰한 자 순으로 매각수량에 도달할 때까지의 입찰자를 낙찰자로 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:46","kind":"조문","type":"시행령","family":"nca","label":"제46조","title":"다량물품을 제조ㆍ구매 또는 임차하는 경우의 낙찰자 결정","text":"제46조(다량물품을 제조ㆍ구매 또는 임차하는 경우의 낙찰자 결정) 제17조제2항의 규정에 의하여 다량의 물품을 희망수량에 따라 분할하여 제조하게 하거나 구매 또는 임차하는 경우에는 제42조의 규정에 불구하고 예정가격이하의 단가로 입찰한 자중 최저가격으로 입찰한 자 순으로 수요수량에 도달할 때까지의 입찰자를 낙찰자로 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:47","kind":"조문","type":"시행령","family":"nca","label":"제47조","title":"동일가격 등의 입찰인 경우의 낙찰자 결정","text":"제47조(동일가격 등의 입찰인 경우의 낙찰자 결정)\n①각 중앙관서의 장 또는 계약담당공무원은 낙찰이 될 수 있는 동일가격으로 입찰한 자가 2인(제42조제4항에 따른 공사 또는 용역의 입찰에 해당하는 경우에는 합산점수가 동점인 상위 2인을 말한다) 이상인 경우로서 다음 각 호의 어느 하나에 해당하는 경우에는 해당 각 호에서 정한 방법에 따라 낙찰자를 결정하여야 한다.\n②제1항의 경우 입찰자중 출석하지 아니한 자 또는 추첨을 하지 아니한 자가 있을 때에는 입찰사무에 관계없는 공무원으로 하여금 이를 대신하여 추첨하게 할 수 있다.\n③ 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:47의2","kind":"조문","type":"시행령","family":"nca","label":"제47조의2","title":"시범특례에 따른 계약체결","text":"제47조의2(시범특례에 따른 계약체결)\n① 각 중앙관서의 장 또는 계약담당공무원은 계약의 종류, 계약의 목적물 또는 계약 대상 사업의 혁신성ㆍ특수성 등을 고려할 때 제41조부터 제43조까지, 제43조의2, 제43조의3 및 제44조부터 제47조까지의 규정에 따른 계약체결 방법으로는 계약의 목적을 달성하기 곤란하다고 인정되는 경우에는 각 해당 규정에도 불구하고 재정경제부장관이 해당 계약의 체결에 관하여 한시적으로 정하는 기준ㆍ절차(이하 이 조에서 \"시범특례\"라 한다)에 따라 국가에 가장 유리하다고 인정되는 자와 계약을 체결할 수 있다.\n② 각 중앙관서의 장 또는 계약담당공무원은 시범특례에 따른 계약을 체결하려는 경우에는 입찰공고를 할 때에 시범특례에 따른 계약이라는 뜻을 명시해야 하며, 계약을 체결하려는 자가 그 시범특례를 열람할 수 있도록 해야 한다.\n③ 각 중앙관서의 장은 시범특례에 따른 계약체결이 필요하다고 인정되는 경우에는 재정경제부장관에게 해당 계약에 적용될 시범특례를 정해 줄 것을 요청해야 한다.\n④ 각 중앙관서의 장이 제3항에 따른 요청을 할 때에는 다음 각 호의 사항이 포함된 시범특례요청서를 제출해야 한다.\n⑤ 제3항에 따른 요청을 받은 재정경제부장관은 계약의 종류, 계약의 목적물 또는 계약 대상 사업의 혁신성ㆍ특수성 등을 고려할 때 제4항제2호에 따른 시범특례 적용의 필요성이 있고, 해당 계약 체결의 공정성과 투명성 등을 확보하기 위해 별도의 계약 체결 기준ㆍ절차를 마련할 필요가 있다고 인정되는 경우에는 「조달사업에 관한 법률 시행령」 제7조제1항에 따른 공공조달제도개선위원회의 심의를 거쳐 시범특례를 정할 수 있다. 이 경우 해당 심의를 거치기 전에 관계 중앙관서의 장과 협의할 수 있다.\n⑥ 시범특례의 유효기간은 제5항에 따라 시범특례를 정한 날부터 2년의 범위에서 재정경제부장관이 정하는 기간으로 하며, 재정경제부장관은 필요하다고 인정하는 경우 2년의 범위에서 한 차례 이상 유효기간을 연장할 수 있다.\n⑦ 재정경제부장관은 시범특례에 따라 체결된 계약 및 계약 대상 사업 등에 대하여 성과평가를 실시한 후 그 결과를 바탕으로 해당 시범특례를 국가계약법령에 반영할 필요가 있는지를 검토해야 한다. 이 경우 국가계약법령에의 반영 여부에 관하여는 「조달사업에 관한 법률 시행령」 제7조제1항에 따른 공공조달제도개선위원회의 심의를 거쳐야 한다.\n⑧ 재정경제부장관은 시범특례 제도의 효과적인 운영을 위하여 관련 전문기관 또는 단체에 다음 각 호의 조사ㆍ연구 등을 의뢰할 수 있다.\n⑨ 제1항부터 제8항까지에서 규정한 사항 외에 시범특례 제도의 운영에 필요한 세부사항은 재정경제부장관이 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:47의3","kind":"조문","type":"시행령","family":"nca","label":"제47조의3","title":"둘 이상의 낙찰자 결정","text":"제47조의3(둘 이상의 낙찰자 결정) 법 제10조제4항 전단에서 \"계약의 목적ㆍ성질ㆍ수량 등 대통령령으로 정하는 요건에 해당하여 1인의 낙찰자로는 계약목적 달성이 곤란하다고 판단되는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n1.\n1.  물품이나 시설물의 특성상 둘 이상의 계약상대자가 유지ㆍ보수 등의 업무를 수행할 필요가 있는 경우\n2.\n2.  공정성 및 정확성 제고를 위해 둘 이상의 계약상대자에게 평가ㆍ감정 등을 의뢰할 필요가 있는 경우\n3.\n3.  예상하지 못한 계약 불이행 상황 발생 시 사회적 혼란이 우려되는 경우\n4.\n4.  국고금, 기금 및 국유재산(이하 이 호에서 \"국고금등\"이라 한다) 운용의 안정성과 수익성을 제고하기 위해 둘 이상의 계약상대자에게 국고금등을 예치 또는 대여하거나 관리ㆍ운용 등의 업무를 수행하게 할 필요가 있는 경우\n5.\n5.  다음 각 목의 어느 하나에 해당하는 경우로서 해당 중앙관서의 장이 그 사유를 명시하여 재정경제부장관과 협의한 경우\n가.\n가.  계약의 효율적인 이행을 위해 둘 이상의 계약상대자가 동시에 업무를 수행할 필요가 있는 경우\n나.\n나.  긴급한 공급이 필요한 물품의 신속한 조달을 위해 둘 이상의 계약상대자가 해당 물품의 조달업무를 수행할 필요가 있는 경우","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:48","kind":"조문","type":"시행령","family":"nca","label":"제48조","title":null,"text":"제5장 계약의 체결 및 이행","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:48의2","kind":"조문","type":"시행령","family":"nca","label":"제48조의2","title":"국외공사계약","text":"제48조의2(국외공사계약)\n① 각 중앙관서의 장 또는 계약담당공무원은 국외공사계약을 체결할 때에 원칙적으로 현지통화로 계약을 하여야 한다. 다만, 현지통화로 계약하기 곤란한 경우에는 계약상대자와 협의하여 원화 또는 미화로 계약할 수 있다.\n② 각 중앙관서의 장 또는 계약담당공무원은 국외공사계약을 체결할 때 환율 또는 국제상 관례 등을 고려하여 계약금액 조정 관련 특례를 설정할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:49","kind":"조문","type":"시행령","family":"nca","label":"제49조","title":"계약서작성의 생략","text":"제49조(계약서작성의 생략) 법 제11조제1항 단서의 규정에 의하여 계약서의 작성을 생략할 수 있는 경우는 다음 각호와 같다.\n1.\n1.  계약금액이 3천만원이하인 계약을 체결하는 경우\n2.\n2.  경매에 부치는 경우\n3.\n3.  물품매각의 경우에 있어서 매수인이 즉시 대금을 납부하고 그 물품을 인수하는 경우\n4.\n4.  각 국가기관 및 지방자치단체 상호간에 계약을 체결하는 경우\n5.\n5.  전기ㆍ가스ㆍ수도의 공급계약등 성질상 계약서의 작성이 필요하지 아니한 경우","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:50","kind":"조문","type":"시행령","family":"nca","label":"제50조","title":"계약보증금","text":"제50조(계약보증금)\n①각 중앙관서의 장 또는 계약담당공무원은 법 제12조에 따른 계약보증금을 계약금액의 100분의 10 이상으로 납부하게 해야 한다. 다만, 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 계약보증금을 계약금액의 100분의 5 이상으로 할 수 있다.\n②단가계약에 의하는 경우로서 여러 차례로 분할하여 계약을 이행하게 하는 때에는 제1항의 규정에 불구하고 매회별 이행예정량중 최대량에 계약단가를 곱한 금액의 100분의 10이상을 계약보증금으로 납부하게 하여야 한다.\n③장기계속계약에 있어서는 제1차 계약체결시 부기(附記)한 총공사 또는 총제조등의 금액의 100분의 10이상을 계약보증금으로 납부하게 하여야 한다. 이 경우 당해 계약보증금은 총공사 또는 총제조등의 계약보증금으로 보며, 연차별계약이 완료된 때에는 당초의 계약보증금 중 이행이 완료된 연차별계약금액에 해당하는 분을 반환하여야 한다.\n④ 제3항 전단에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 계약보증금을 제1차 계약체결시 부기한 총공사 또는 총제조등의 금액의 100분의 5 이상으로 할 수 있다.\n⑤ 법 제27조제1항제2호ㆍ제4호ㆍ제7호ㆍ제8호 또는 같은 항 제9호가목의 어느 하나에 해당하여 입찰참가자격을 제한받은 자가 「행정심판법」 제30조제2항에 따른 집행정지 결정 또는 「행정소송법」 제23조제2항에 따른 집행정지 결정을 받아 입찰에 참가하여 낙찰자로 결정된 경우에는 제1항부터 제4항까지의 규정에도 불구하고 계약보증금을 다음 각 호의 금액(공동계약의 경우에는 해당 금액에 구성원의 출자비율을 곱한 금액을 말한다)의 100분의 10만큼 추가로 납부하게 해야 한다. 이 경우 추가로 납부한 계약보증금은 입찰참가자격 제한처분을 취소하는 재결이나 판결이 확정된 때에는 납부한 자에게 반환해야 한다.\n⑥법 제12조제1항 단서에 따라 계약보증금의 전부 또는 일부를 면제할 수 있는 경우는 다음 각 호와 같다.\n⑦계약보증금은 현금 또는 제37조제2항 각호에 규정한 보증서등으로 이를 납부하게 하여야 한다.\n⑧「자본시장과 금융투자업에 관한 법률 시행령」 제192조에 따른 증권 또는 현금으로 납부된 계약보증금을 계약상대자가 특별한 사유로 제37조제2항제1호 내지 제5호에 규정된 보증서등으로 대체납부할 것을 요청한 때에는 동가치 상당액이상으로 대체납부하게 할 수 있다.\n⑨ 삭제\n⑩제37조제4항의 규정은 제6항제1호 내지 제3호 및 제5호의 규정에 의하여 계약보증금의 전부 또는 일부를 면제한 경우에 이를 준용한다.\n⑪ 삭제","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:51","kind":"조문","type":"시행령","family":"nca","label":"제51조","title":"계약보증금의 국고귀속","text":"제51조(계약보증금의 국고귀속)\n①각 중앙관서의 장 또는 계약담당공무원은 계약상대자가 정당한 이유없이 계약상의 의무를 이행하지 아니한 때에는 제50조의 규정에 의한 계약보증금(제52조제1항제2호 및 제3호의 규정에 의한 보증금액을 포함한다. 이하 같다)을 법 제12조제3항의 규정에 의하여 국고에 귀속시켜야 한다. 이 경우 제75조제1항의 규정을 준용한다.\n② 제1항을 적용할 때 다음 각 호의 경우에는 해당 호에서 정하는 바에 따라 계약보증금을 국고에 귀속시켜야 한다.\n③제1항의 규정은 장기계속계약에 있어서 계약상대자가 제69조제2항 후단 및 동조제3항의 규정에 의한 2차이후의 공사 또는 제조등의 계약을 체결하지 아니한 경우에 이를 준용한다.\n④제1항부터 제3항까지의 규정에 따라 계약보증금을 국고에 귀속시키는 경우 그 계약보증금을 기성부분에 대한 미지급액과 상계 처리해서는 안 된다. 다만, 계약보증금의 전부 또는 일부를 면제한 경우에는 국고에 귀속시켜야 하는 계약보증금은 기성부분에 대한 미지급액과 상계 처리할 수 있다.\n⑤제38조제1항 및 제2항의 규정은 계약보증금의 국고귀속의 경우에 이를 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:52","kind":"조문","type":"시행령","family":"nca","label":"제52조","title":"공사계약에 있어서의 이행보증","text":"제52조(공사계약에 있어서의 이행보증)\n① 각 중앙관서의 장 또는 계약담당공무원은 공사계약(법 제21조에 따른 장기계속계약을 포함한다)을 체결하려는 경우에는 계약상대자로 하여금 다음 각 호의 어느 하나에 해당하는 방법을 선택하여 계약이행을 보증하게 해야 한다. 다만, 공사계약의 특성상 필요하다고 인정되는 경우에는 계약이행보증의 방법을 제2호에 따른 방법으로 한정할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항 본문에 따라 계약이행을 보증한 경우로서 계약상대자가 계약이행보증방법의 변경을 요청하는 경우에는 1회에 한하여 변경하게 할 수 있다.\n③ 삭제\n④재정경제부장관은 제1항에 따른 공사이행보증서의 제출등에 관하여 필요한 사항을 정할 수 있다.\n⑤용역계약의 경우 제1항부터 제4항까지의 규정을 준용할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:53","kind":"조문","type":"시행령","family":"nca","label":"제53조","title":"손해보험의 가입","text":"제53조(손해보험의 가입)\n①각 중앙관서의 장 또는 계약담당공무원은 계약을 체결함에 있어서 필요하다고 인정할 때에는 당해계약의 목적물등에 대하여 손해보험(「건설산업기본법」 제56조제1항제5호에 따른 손해공제를 포함한다. 이하 이 조에서 같다)에 가입하거나 계약상대자로 하여금 손해보험에 가입하게 할 수 있다.\n②재정경제부장관은 제1항의 규정에 의한 손해보험가입과 관련된 필요한 사항을 정할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:54","kind":"조문","type":"시행령","family":"nca","label":"제54조","title":"감독","text":"제54조(감독)\n①법 제13조제1항 단서에서 \"대통령령으로 정하는 계약\"이란 다음 각 호의 어느 하나에 해당하는 계약을 말한다.\n②각 중앙관서의 장 또는 계약담당공무원은 예정가격의 100분의 70 미만으로 낙찰되어 체결된 공사계약의 경우에는 부실시공을 방지하기 위하여 감독공무원의 수(제1항의 규정에 의한 계약중 공사계약의 경우에는 「건설기술 진흥법」 등에 의하여 정하여진 건설사업관리기술인 또는 감리원의 수를 말한다)를 그 배치기준의 100분의 50 범위내에서 추가하여 배치할 수 있다.\n③제2항의 규정에 의하여 추가로 소요되는 감독 또는 감리비용은 당해 공사예산중 낙찰차액(예정가격과 낙찰금액간의 차액을 말한다)으로 충당할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:55","kind":"조문","type":"시행령","family":"nca","label":"제55조","title":"검사","text":"제55조(검사)\n①법 제14조제1항에 따른 검사는 계약상대자로부터 해당 계약의 이행을 완료한 사실을 통지받은 날부터 14일(「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 계약상대자로부터 해당 계약의 이행을 완료한 사실을 통지받은 날부터 7일) 이내에 완료해야 한다. 다만, 재정경제부장관이 정하는 경우에는 7일(본문에 따라 7일 이내에 검사를 완료해야 하는 경우에는 3일)의 범위에서 그 검사기간을 연장할 수 있다.\n②제1항의 규정에 의한 검사를 할 때 조사설계용역계약인 경우에는 당해 용역계약의 상대자가 조사설계대상사업의 총사업비를 적정하게 산정하였는지의 여부를 함께 검사하여야 한다.\n③법 제14조제1항 단서에서 \"대통령령이 정하는 계약\"이라 함은 제54조제1항 각호의 1에 해당하는 계약을 말한다.\n④기본설계(타당성 조사에 관한 내용을 포함한다. 이하 같다)와 실시설계를 구분하여 계약을 체결한 경우에는 제1항의 규정에 의하여 실시설계용역에 대한 이행검사를 하는 때에 실시설계대상사업의 총사업비의 산정이 적정한지의 여부를 기본설계서상의 총사업비와 실시설계서상의 총사업비를 비교하여 검사하여야 한다. 이 경우 기본설계서상의 총사업비와 실시설계서상의 총사업비에 차이가 있는 경우에는 실시설계용역의 계약상대자로 하여금 그 사유를 설명하는 자료를 제출하게 하여야 한다.\n⑤천재ㆍ지변등 불가항력의 사유로 제1항의 규정에 의한 기간내에 검사를 완료하지 못한 경우에는 당해 사유가 소멸한 날부터 3일이내에 검사를 완료하여야 한다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 법 제14조제1항의 규정에 의한 검사를 함에 있어서 계약상대자의 계약이행내용의 전부 또는 일부가 계약에 위반되거나 부당함을 발견한 때에는 지체없이 필요한 시정조치를 하여야 한다. 이 경우 계약상대자로부터 그 시정을 완료한 사실을 통지받은 날부터 제1항의 규정에 의한 기간을 계산한다.\n⑦제58조제3항의 규정에 의한 기성대가지급시의 기성검사는 법 제13조에 의한 감독을 행하는 자가 작성한 감독조서의 확인으로 갈음할 수 있다. 다만, 동 검사 3회마다 1회는 법 제14조에 의한 검사를 실시하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:56","kind":"조문","type":"시행령","family":"nca","label":"제56조","title":"검사조서의 작성생략","text":"제56조(검사조서의 작성생략) 법 제14조제2항 단서의 규정에 의하여 검사조서의 작성을 생략할 수 있는 경우는 다음 각호와 같다.\n1.\n1.  계약금액이 3천만원이하인 계약의 경우\n2.\n2.  매각계약의 경우\n3.\n3.  전기ㆍ가스ㆍ수도의 공급계약등 그 성질상 검사조서의 작성을 필요로 하지 아니하는 계약의 경우","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:56의2","kind":"조문","type":"시행령","family":"nca","label":"제56조의2","title":"검사를 면제할 수 있는 물품","text":"제56조의2(검사를 면제할 수 있는 물품) 법 제14조제3항에 따라 검사를 하지 않을 수 있는 물품은 다음 각 호와 같다. 다만, 해당 물품이 국민의 생명 보호, 안전, 보건위생 등을 위하여 검사가 필요하다고 인정되거나, 불량 자재의 사용, 다수의 하자 발생, 관계 기관의 결함보상명령 등으로 품질의 확인이 필요한 것으로 인정되는 경우에는 법 제14조제1항에 따른 검사를 해야 한다.\n1.\n1.  「산업표준화법」 제15조에 따라 인증을 받은 제품\n2.\n2.  「산업표준화법」 제31조의4제2항에 따라 수상자로 선정된 기업등 및 개인이 제조한 제품\n3.\n3.  「조달사업에 관한 법률」 제18조에 따라 조달청장이 고시한 품질관리능력 평가기준에 적합한 자가 제조한 물품","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:57","kind":"조문","type":"시행령","family":"nca","label":"제57조","title":"감독과 검사직무의 겸직","text":"제57조(감독과 검사직무의 겸직) 제54조의 규정에 의한 감독의 직무와 제55조의 규정에 의한 검사의 직무는 겸할 수 없다. 다만, 다음 각호의 1에 해당하는 경우에는 그러하지 아니하다.\n1.\n1.  특별한 기술을 요하는 검사에 있어서 감독을 행하는 자외의 자로 하여금 검사를 행하게 하는 것이 현저하게 곤란한 경우\n2.\n2.  유지ㆍ보수에 관한 공사등 당해 계약의 이행후 지체없이 검사를 하지 아니하면 그 이행의 확인이 곤란한 경우\n3.\n3.  계약금액이 3억원이하인 물품의 제조 또는 공사계약의 경우\n4.\n4.  제54조제1항제1호에 규정한 공사계약의 경우\n5.\n5.  제55조제7항 본문의 규정에 의하여 감독조서의 확인으로 기성검사를 갈음하는 경우","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:58","kind":"조문","type":"시행령","family":"nca","label":"제58조","title":"대가의 지급","text":"제58조(대가의 지급)\n①법 제15조제2항에 따라 국고의 부담이 되는 계약의 대가는 제55조에 따른 검사를 완료한 후 계약상대자의 청구를 받은 날부터 5일(「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 계약상대자의 청구를 받은 날부터 3일) 이내에 지급해야 한다. 이 경우 계약당사자와 합의하여 5일을 초과하지 않는 범위에서 대가의 지급기한을 연장할 수 있는 특약을 정할 수 있다.\n②천재ㆍ지변등 불가항력의 사유로 지급기한내에 대가를 지급할 수 없게 된 경우에는 당해 사유가 소멸된 날부터 3일이내에 대가를 지급하여야 한다.\n③법 제15조의 규정에 의하여 기성부분 또는 기납부분에 대한 대가를 지급하는 경우에는 제1항의 규정에 불구하고 계약수량, 이행의 전망, 이행기간등을 참작하여 적어도 30일마다 지급하여야 한다.\n④제3항에 따른 대가 지급시에는 제55조에 따른 검사를 완료하는 날 이전까지 계약상대자로 하여금 대가지급 청구를 하게 할 수 있으며, 검사완료일부터 5일 이내에 검사된 내용에 따라 대가를 확정하여 지급하여야 한다. 다만, 계약상대자가 검사완료일후에 대가의 지급을 청구한 때에는 그 청구를 받은 날부터 5일 이내에 지급하여야 한다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 제1항 또는 제4항의 규정에 의한 대가지급의 청구를 받은 후 그 청구내용의 전부 또는 일부가 부당함을 발견한 때에는 그 사유를 명시하여 계약상대자에게 당해 청구서를 반송할 수 있다. 이 경우 반송한 날부터 재청구를 받은 날까지 기간은 제1항 또는 제4항의 지급기간에 이를 산입하지 아니한다.\n⑥제1항 및 제2항에 따른 기간을 산정하는 경우에는 공휴일 및 토요일을 제외한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:59","kind":"조문","type":"시행령","family":"nca","label":"제59조","title":"대가지급지연에 대한 이자","text":"제59조(대가지급지연에 대한 이자) 법 제15조제2항의 규정에 의하여 각 중앙관서의 장 또는 계약담당공무원이 대금지급청구를 받은 경우에 제58조의 규정에 의한 대가지급기한(국고채무부담행위에 의한 계약의 경우에는 다음 회계연도 개시후 「국가재정법」에 의하여 당해 예산이 배정된 날부터 20일)까지 대가를 지급하지 못하는 경우에는 지급기한의 다음날부터 지급하는 날까지의 일수(이하 \"대가지급지연일수\"라 한다)에 당해 미지급금액 및 지연발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 대출평균금리를 말한다)를 곱하여 산출한 금액을 이자로 지급하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:60","kind":"조문","type":"시행령","family":"nca","label":"제60조","title":"공사계약의 하자담보책임기간","text":"제60조(공사계약의 하자담보책임기간)\n①각 중앙관서의 장 또는 계약담당공무원은 공사의 도급계약을 체결할 때에는 전체 목적물을 인수한 날과 준공검사를 완료한 날 중에서 먼저 도래한 날(공사계약의 부분 완료로 관리ㆍ사용이 이루어지고 있는 경우에는 부분 목적물을 인수한 날과 공고에 따라 관리ㆍ사용을 개시한 날 중에서 먼저 도래한 날을 말한다)부터 1년 이상 10년 이하의 범위에서 재정경제부령이 정하는 기간동안 해당 공사의 하자보수를 보증하기 위한 하자담보책임기간을 정하여야 한다. 다만, 공사의 성질상 하자보수가 필요하지 아니한 경우로서 재정경제부령이 정하는 경우에는 그러하지 아니하다.\n②장기계속공사에 있어서는 연차계약별로 제1항의 규정에 의한 하자담보책임기간을 정한다. 다만, 연차계약별로 하자담보책임을 구분할 수 없는 공사인 경우에는 제1차계약을 체결할 때에 총공사에 대하여 하자담보책임기간을 정하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:61","kind":"조문","type":"시행령","family":"nca","label":"제61조","title":"하자검사","text":"제61조(하자검사)\n①각 중앙관서의 장 또는 계약담당공무원은 제60조의 규정에 의한 하자담보책임기간중 연 2회이상 정기적으로 하자를 검사하거나 소속공무원에게 그 사무를 위임하여 검사하게 하여야 한다.\n②제1항의 규정에 의한 하자검사가 특히 전문적인 지식 또는 기술을 필요로 하거나 예정가격의 100분의 86 미만으로 낙찰된 공사로서 「시설물의 안전 및 유지관리에 관한 특별법」 제2조제1호의 규정에 의한 시설물에 대한 것인 경우에는 각 중앙관서의 장 또는 계약담당공무원은 전문기관에 의뢰하여 필요한 검사를 하여야 한다.\n③제1항 및 제2항의 규정에 의하여 하자를 검사하는 자는 하자검사조서를 작성하여야 한다. 다만, 계약금액이 3천만원이하인 공사계약의 경우에는 하자검사조서의 작성을 생략할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:62","kind":"조문","type":"시행령","family":"nca","label":"제62조","title":"하자보수보증금","text":"제62조(하자보수보증금)\n①법 제18조의 규정에 의한 하자보수보증금은 재정경제부령이 정하는 바에 의하여 계약금액의 100분의 2이상 100분의 10이하로 하여야 한다. 다만, 공사의 성질상 하자보수가 필요하지 아니한 경우로서 재정경제부령이 정하는 경우에는 하자보수보증금을 납부하지 아니하게 할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의한 하자보수보증금을 당해 공사의 준공검사후 그 공사의 대가를 지급하기 전까지 납부하게 하고 제60조의 규정에 의한 하자담보책임기간동안 보관하여야 한다.\n③장기계속공사에 있어서는 연차계약별로 제1항 및 제2항의 규정에 의한 하자보수보증금을 납부하게 하여야 한다. 다만, 연차계약별로 하자담보책임을 구분할 수 없는 공사인 경우에는 총공사의 준공검사후 하자보수보증금을 납부하게 하여야 한다.\n④법 제18조제1항 단서의 규정에 의하여 하자보수보증금의 납부를 면제할 수 있는 경우는 다음 각호와 같다.\n⑤제37조제2항ㆍ제4항 및 제38조의 규정은 하자보수보증금의 납부 및 국고귀속의 경우에 이를 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:63","kind":"조문","type":"시행령","family":"nca","label":"제63조","title":"하자보수보증금의 직접사용","text":"제63조(하자보수보증금의 직접사용)\n①법 제18조제3항 단서에 따라 하자보수보증금을 해당 하자의 보수를 위하여 직접 사용하고자 할 때에는 해당 하자보수보증금을 세입으로 납입하지 아니하고 세입ㆍ세출외로 구분하여 회계처리한다.\n②제1항의 규정에 의한 하자보수보증금의 직접사용에 관한 절차는 재정경제부령으로 정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:64","kind":"조문","type":"시행령","family":"nca","label":"제64조","title":"물가변동으로 인한 계약금액의 조정","text":"제64조(물가변동으로 인한 계약금액의 조정)\n①각 중앙관서의 장 또는 계약담당공무원은 법 제19조의 규정에 의하여 국고의 부담이 되는 계약을 체결(장기계속공사 및 장기물품제조등의 경우에는 제1차계약의 체결을 말한다)한 날부터 90일이상 경과하고 동시에 다음 각 호의 어느 하나에 해당되는 때에는 재정경제부령이 정하는 바에 의하여 계약금액(장기계속공사 및 장기물품제조등의 경우에는 제1차계약체결시 부기한 총공사 및 총제조등의 금액을 말한다. 이하 이 장에서 같다)을 조정한다. 이 경우 조정기준일(조정사유가 발생한 날을 말한다. 이하 이 조에서 같다)부터 90일이내에는 이를 다시 조정하지 못한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 계약금액을 조정함에 있어서 동일한 계약에 대하여는 제1항 각호의 방법중 하나의 방법에 의하여야 하며, 계약을 체결할 때에 계약서에 계약상대자가 제1항제2호의 방법을 원하는 경우 외에는 동항제1호의 방법으로 계약금액을 조정한다는 뜻을 명시하여야 한다.\n③「국고금관리법 시행령」 제40조의 규정에 의하여 당해 계약상대자에게 선금을 지급한 것이 있는 때에는 제1항의 규정에 의하여 산출한 증가액에서 재정경제부령이 정하는 바에 의하여 산출한 금액을 공제한다.\n④각 중앙관서의 장 또는 계약담당공무원은 관계법령에 의하여 최고판매가격이 고시되는 물품을 구매하는 경우 기타 제1항의 규정을 적용하여서는 물품을 조달하기 곤란한 경우에는 계약체결시에 계약금액의 조정에 관하여 제1항의 규정과 달리 정할 수 있다.\n⑤제1항의 규정을 적용함에 있어서 천재ㆍ지변 또는 원자재의 가격급등으로 인하여 당해 조정제한기간내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 인정되는 경우에는 동항의 규정에도 불구하고 계약을 체결한 날 또는 직전 조정기준일부터 90일 이내에 계약금액을 조정할 수 있다.\n⑥제1항 각 호에도 불구하고 각 중앙관서의 장 또는 계약담당공무원은 공사계약의 경우 특정규격의 자재(해당 공사비를 구성하는 재료비ㆍ노무비ㆍ경비 합계액의 1천분의 5를 초과하는 자재만 해당한다)별 가격변동으로 인하여 입찰일을 기준일로 하여 산정한 해당자재의 가격증감률이 100분의 15이상인 때에는 그 자재에 한하여 계약금액을 조정한다.\n⑦ 각 중앙관서의 장 또는 계약담당공무원은 환율변동을 원인으로 하여 제1항에 따른 계약금액 조정요건이 성립된 경우에는 계약금액을 조정한다.\n⑧ 제1항에도 불구하고 각 중앙관서의 장 또는 계약담당공무원은 단순한 노무에 의한 용역으로서 재정경제부령으로 정하는 용역에 대해서는 예정가격 작성 이후 노임단가가 변동된 경우 노무비에 한정하여 계약금액을 조정한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:65","kind":"조문","type":"시행령","family":"nca","label":"제65조","title":"설계변경으로 인한 계약금액의 조정","text":"제65조(설계변경으로 인한 계약금액의 조정)\n①각 중앙관서의 장 또는 계약담당공무원은 공사계약의 경우 설계변경으로 공사량의 증감이 발생한 때에는 법 제19조에 따라 해당 계약금액을 조정한다. 다만, 제14조제7항 단서에 따라 입찰에 참가하려는 자가 물량내역서를 직접 작성하고 단가를 적은 산출내역서를 제출하는 경우로서 그 물량내역서의 누락 사항이나 오류 등으로 설계변경이 있는 경우에는 그 계약금액을 변경할 수 없다.\n②계약담당공무원은 예정가격의 100분의 86 미만으로 낙찰된 공사계약의 계약금액을 제1항에 따라 증액조정하려는 경우로서 해당 증액조정금액(2차 이후의 계약금액 조정에 있어서는 그 전에 설계변경으로 인하여 감액 또는 증액조정된 금액과 증액조정하려는 금액을 모두 합한 금액을 말한다)이 당초 계약서의 계약금액(장기계속공사의 경우에는 제69조제2항에 따라 부기된 총공사금액을 말한다)의 100분의 10 이상인 경우에는 제94조제1항에 따른 계약심의위원회, 「국가재정법 시행령」 제49조에 따른 예산집행심의회 또는 「건설기술 진흥법 시행령」 제19조에 따른 기술자문위원회(이하 \"기술자문위원회\"라 한다)의 심의를 거쳐 소속중앙관서의 장의 승인을 얻어야 한다.\n③제1항의 규정에 의하여 계약금액을 조정함에 있어서는 다음 각호의 기준에 의한다.\n④각 중앙관서의 장 또는 계약담당공무원은 계약상대자가 새로운 기술ㆍ공법 등을 사용함으로써 공사비의 절감, 시공기간의 단축등에 효과가 현저할 것으로 인정되어 계약상대자의 요청에 의하여 필요한 설계변경을 한 때에는 계약금액의 조정에 있어서 당해절감액의 100분의 30에 해당하는 금액을 감액한다.\n⑤ 제4항의 경우 새로운 기술ㆍ공법 등의 범위와 한계에 관하여 이의가 있을 때에는 기술자문위원회(기술자문위원회가 설치되어 있지 아니한 경우에는 「건설기술 진흥법」 제5조에 따른 건설기술심의위원회를 말한다)의 심의를 받아야 한다. 이 경우 새로운 기술ㆍ공법 등의 범위와 한계, 이의가 있을 경우의 처리방법 등 세부적인 시행절차는 각 중앙관서의 장이 정한다.\n⑥계약금액의 증감분에 대한 일반관리비 및 이윤등은 제14조제6항 또는 제7항의 규정에 의하여 제출한 산출내역서상의 일반관리비율 및 이윤율등에 의하되 재정경제부령이 정하는 율을 초과할 수 없다.\n⑦제1항 내지 제6항의 규정은 제조ㆍ용역등의 계약에 있어서 계약금액을 조정하는 경우에 이를 준용할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:66","kind":"조문","type":"시행령","family":"nca","label":"제66조","title":"기타 계약내용의 변경으로 인한 계약금액의 조정","text":"제66조(기타 계약내용의 변경으로 인한 계약금액의 조정)\n①각 중앙관서의 장 또는 계약담당공무원은 법 제19조의 규정에 의하여 공사ㆍ제조등의 계약에 있어서 제64조 및 제65조의 규정에 의한 경우외에 공사기간ㆍ운반거리의 변경등 계약내용의 변경으로 계약금액을 조정하여야 할 필요가 있는 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 이를 조정한다.\n② 각 중앙관서의 장 또는 계약담당공무원은 단순한 노무에 의한 용역으로서 재정경제부령으로 정하는 용역에 대해서는 「최저임금법」에 따른 최저임금액이 변동되어 당초의 계약금액(제64조제8항에 따라 계약금액 조정을 하는 경우를 포함한다)으로는 최저임금 지급이 곤란하다고 인정하는 경우로서 재정경제부장관이 정하는 요건에 해당하는 경우 계약금액을 조정한다.\n③제65조제6항의 규정은 제1항의 경우에 이를 준용한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:67","kind":"조문","type":"시행령","family":"nca","label":"제67조","title":"회계연도 개시 전의 계약","text":"제67조(회계연도 개시 전의 계약) 각 중앙관서의 장 또는 계약담당공무원은 법 제20조의 규정에 의하여 회계연도 개시 전에 계약을 체결하고자 할 때에는 그 회계연도 개시일 이후에 계약의 효력이 발생하도록 하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:68","kind":"조문","type":"시행령","family":"nca","label":"제68조","title":"공사의 분할계약금지","text":"제68조(공사의 분할계약금지)\n①각 중앙관서의 장 또는 계약담당공무원은 재정경제부장관이 정하는 동일 구조물공사 및 단일공사로서 설계서등에 의하여 전체 사업내용이 확정된 공사는 이를 시기적으로 분할하거나 공사량을 분할하여 계약할 수 없다. 다만, 다음 각 호의 어느 하나에 해당하는 공사의 경우에는 그러하지 아니하다.\n② 각 중앙관서의 장은 공사의 예산 편성과 기본설계 등 사업의 계획 단계부터 제1항에 따른 분할ㆍ분리 계약의 가능 여부를 검토하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:69","kind":"조문","type":"시행령","family":"nca","label":"제69조","title":"장기계속계약 및 계속비계약","text":"제69조(장기계속계약 및 계속비계약)\n①다음 각 호의 어느 하나에 해당하는 계약으로서 법 제21조에 따라 장기계속계약을 체결하려는 경우에는 각 소속중앙관서의 장의 승인을 받아 단가에 대한 계약으로 체결할 수 있다.\n②장기계속공사는 낙찰등에 의하여 결정된 총공사금액을 부기하고 당해 연도의 예산의 범위안에서 제1차공사를 이행하도록 계약을 체결하여야 한다. 이 경우 제2차공사이후의 계약은 부기된 총공사금액(제64조 내지 제66조의 규정에 의한 계약금액의 조정이 있는 경우에는 조정된 총공사금액을 말한다)에서 이미 계약된 금액을 공제한 금액의 범위안에서 계약을 체결할 것을 부관으로 약정하여야 한다.\n③장기물품제조등과 정보시스템 구축사업(구축사업과 함께 해당 정보시스템의 운영 및 유지보수사업을 포괄하여 계약을 체결하는 경우를 포함한다)의 계약체결방법에 관하여는 제2항을 준용한다.\n④제2항 및 제3항의 규정에 의한 제1차 및 제2차이후의 계약금액은 총공사ㆍ총제조등의 계약단가에 의하여 결정한다.\n⑤계속비예산으로 집행하는 공사에 있어서는 총공사와 연차별공사에 관한 사항을 명백히 하여 계약을 체결하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:70","kind":"조문","type":"시행령","family":"nca","label":"제70조","title":"개산계약","text":"제70조(개산계약)\n①각 중앙관서의 장 또는 계약담당공무원은 법 제23조의 규정에 의하여 개산계약을 체결하고자 할 때에는 미리 개산가격을 결정하여야 한다.\n②각 중앙관서의 장은 제1항의 규정에 의하여 개산계약을 체결하고자 할 때에는 입찰전에 계약목적물의 특성ㆍ계약수량 및 이행기간등을 고려하여 원가검토에 필요한 기준 및 절차 등을 정하여야 하며, 이를 입찰에 참가하고자 하는 자가 열람할 수 있도록 하여야 한다.\n③계약담당공무원은 제1항의 규정에 의하여 개산계약을 체결한 때에는 이를 감사원에 통지하여야 하며, 계약의 이행이 완료된 후에는 제9조 및 제2항의 규정에 의한 기준등에 따라 정산하여 소속중앙관서의 장의 승인을 얻어야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:71","kind":"조문","type":"시행령","family":"nca","label":"제71조","title":"종합계약","text":"제71조(종합계약) 재정경제부장관은 법 제24조의 규정에 의한 종합계약의 체결에 있어서 필요하다고 인정할 때에는 종합계약의 체결방법 기타 필요한 사항을 정할 수 있다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:72","kind":"조문","type":"시행령","family":"nca","label":"제72조","title":"공동계약","text":"제72조(공동계약)\n①법 제25조의 규정에 의한 공동계약의 체결방법 기타 필요한 사항은 재정경제부장관이 정한다.\n②각 중앙관서의 장 또는 계약담당공무원이 경쟁에 의하여 계약을 체결하고자 할 경우에는 계약의 목적 및 성질상 공동계약에 의하는 것이 부적절하다고 인정되는 경우를 제외하고는 가능한 한 공동계약에 의하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 제2항에 따른 공동계약을 체결할 때 다음 각 호의 어느 하나에 해당하는 사업인 경우에는 공사현장을 관할하는 특별시ㆍ광역시ㆍ특별자치시ㆍ도 및 특별자치도에 법인등기부상 본점소재지가 있는 자 중 1인 이상을 공동수급체의 구성원으로 해야 한다. 다만, 해당 지역에 공사의 이행에 필요한 자격을 갖춘 자가 10인 미만인 경우에는 그렇지 않다.\n④제3항의 규정에 의한 공동계약의 경우 공동수급체의 구성원중 당해 지역의 업체와 그외 지역의 업체간에는 「독점규제 및 공정거래에 관한 법률」에 의한 계열회사가 아니어야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:72의2","kind":"조문","type":"시행령","family":"nca","label":"제72조의2","title":"지식기반사업의 공동계약","text":"제72조의2(지식기반사업의 공동계약) 각 중앙관서의 장 또는 계약담당공무원은 지식기반사업중 수 개의 전문분야가 요구되는 복합사업에 입찰참가자가 공동으로 참가하고자 하는 경우에는 특별한 사유가 없는 한 이를 허용하여야 한다.","lawId":"nca-e","group":"국가계약법 시행령","확인일":"20260721","시행일":"20260603","상태":"현행"},{"id":"art:nca-e:73","kind":"조문","type":"시행령","family":"nca","label":"제73조","title":"사후원가검토조건부 계약","text":"제73조(사후원가검토조건부 계약)\n①각 중앙관서의 장 또는 계약담당공무원은 입찰 전에 추정가격을 구성하는 일부비목별 금액을 결정할 수 없는 경우에는 사후원가검토조건으로 계약을 체결할 수 있다. 다만, 추정가격 중 비목별 금액을 결정할 수 없는 비율이 100분의 20 이상인 사후원가검토조건부 계약을 체결하려는 경우에는
