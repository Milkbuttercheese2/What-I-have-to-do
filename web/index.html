"제13조(입찰의 연기) ① 발주기관은 다음 각호의 경우에 입찰공고 또는 입찰참가통지서에 기재된 입찰서 제출마감일시를 연기할 수 있다.1. 제5조제2항에 의한 설명요구사항의 내용이 중대하여 연기가 불가피하다고 판단되는 경우2. 기타 불가피한 사유로 인하여 지정된 일시에 입찰 또는 개찰을 실시하지 못한 경우② 제1항에 의하여 입찰을 연기한 경우에는 연기사유와 기간를 입찰공고의 방법과 동일한 방법으로 공고 또는 통지하여야 한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"재입찰 및 재공고입찰","text":"제14조(재입찰 및 재공고입찰) ① 계약담당공무원은 경쟁입찰에서 2인 이상의 유효한 입찰자가 없거나 낙찰자가 없는 경우에는 재입찰에 부칠 수 있다. 이 경우에는 최초 입찰에의 참가유무 또는 입찰횟수의 제한을 받지 아니한다. ② 입찰자나 낙찰자가 없는 경우 또는 낙찰자가 계약을 체결하지 아니하는 경우에는 계약담당공무원은 재공고입찰에 부칠 수 있다.③ 계약담당공무원은 시행령 제18조제3항에 의하여 기술과 가격을 분리하여 입찰에 부친 경우 가격입찰서를 개찰한 결과 낙찰자를 결정할 수 없는 경우로서 기술적격자가 2인 이상인 때에는 그 기술적격자에게 가격입찰서를 다시 제출하게 할 수 있다.④ 제1항 내지 제3항에 의한 재입찰 또는 재공고입찰시에는 기한을 제외하고는 최초의 입찰에 부칠 때에 정한 가격 및 기타조건을 변경할 수 없다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"낙찰자의 결정","text":"제15조(낙찰자의 결정) ① 계약담당공무원은 제12조에 해당되는 사유가 없는 자로서 시행령 제42조 등에서 정한 낙찰자결정기준에 적합한 자를 낙찰자로 한다.② 계약담당공무원은 개봉된 입찰서를 확인하고 유효한 입찰서의 입찰금액과 예정가격을 대조하여 지체없이 적격자를 낙찰자로 선정하여야 한다. 다만, 시행령 제42조제1항에 의하여 계약이행능력을 심사하여 낙찰자를 결정하는 등 낙찰자 결정에 장시간이 소요되는 경우에는 그러하지 아니할 수 있다.③ 계약담당공무원은 제1항 및 제2항에 의하여 낙찰자를 결정하기 전에 해당 입찰자의 입찰서, 법인 등기사항증명서(본사, 대표자 및 상호등 변경여부 확인), 공동수급표준협정서 등 관계서류를 검토하여 해당 낙찰예정자의 입찰이 제12조에 따른 무효입찰에 해당되는지의 여부를 확인하여야 한다. ④ 계약담당공무원은 낙찰이 될 수 있는 동일가격으로 입찰한 자가 2인 이상인 때에는 다음 각 호에 따라 낙찰자를 결정한다.1. 시행령 제42조제1항에 따라 낙찰자를 결정하는 경우 : 이행능력 심사결과 최고점수인 자를 낙찰자로 결정하되, 이행능력 심사결과도 동일한 경우에는 추첨에 의하여 낙찰자를 결정2. 시행령 제42조제3항에 따라 낙찰자를 결정하는 경우 : 규격 또는 기술우위자를 낙찰자로 결정하되, 규격 또는 기술평가 결과도 동일한 때에는 추첨에 의하여 낙찰자를 결정⑤ 제4항에 의한 낙찰자 결정시 입찰자중 출석하지 아니한 자 또는 추첨을 하지 아니한 자가 있을 때에는 입찰사무에 관계없는 공무원으로 하여금 추첨을 대신하게 할 수 있다.⑥ 계약담당공무원은 낙찰자로 결정된 자가 계약체결 이전에 입찰무효 등 부적격자로 판명되어 낙찰자 결정이 취소된 경우로서 동 부적격자를 제외하고 2인이상 유효한 입찰이 성립되어 있는 때에는 차순위자 순으로 필요한 심사 등을 실시하여 낙찰자를 결정한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"계약의 체결","text":"제16조(계약의 체결) ① 낙찰자는 계약담당공무원으로부터 낙찰통지를 받은 후 10일 이내에 소정의 서식에 의한 계약서에 의하여 계약을 체결하여야 하고 그 낙찰금액에 대한 산출내역서를 착수신고서 제출시까지 계약담당공무원에게 제출하여야 한다.② 제1항의 경우에 불가항력의 사유로 인하여 계약을 체결할 수 없는 경우에는 그 사유가 존속하는 기간은 이를 산입하지 아니한다..③ 제1항에 의하여 발주기관과 계약을 체결하고자 하는 자는 관계법령 및 계약담당공무원이 요구하는 서류를 계약담당공무원에게 제출하여야 한다.④ 계약담당공무원은 낙찰자가 정당한 이유없이 제1항에 의한 계약을 체결하지 아니하는 때에는 낙찰을 취소할 수 있다.⑤ 계약담당공무원은 장기계속용역의 경우 낙찰자와의 계약은 총용역 낙찰금액을 부기하고 해당연도 예산의 범위안에서 제1차 용역에 대하여 계약을 체결하여야 한다. 이 경우에 제2차 기술용역이후의 계약은 총용역낙찰금액(시행령 제64조 내지 제66조에 의한 계약금액의 조정이 있는 경우에는 조정된 총용역금액을 말한다)에서 이미 계약된 금액을 공제한 금액의 범위안에서 계약을 체결할 것을 부관(附款)으로 약정하여야 한다.⑥ 제5항에 의하여 제1차 및 제2차 용역이후의 계약금액은 총용역의 계약단가에 의한다. 이 경우 계약금액조정 등으로 인하여 산출내역서의 단가가 조정된 때에는 조정된 계약단가에 의한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"계약의 성립","text":"제17조(계약의 성립) 계약담당공무원과 낙찰자가 계약서에 기명ㆍ날인(외국인에 대하여 서명을 허용한 경우에는 서명을 포함한다)함으로써 계약은 확정된다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"입찰보증금의 계약보증금으로의 대체","text":"제18조(입찰보증금의 계약보증금으로의 대체) ① 계약담당공무원은 낙찰자가 납부한 입찰보증금을 소정의 절차에 따라 계약보증금으로 대체할 수 있다. 다만, 입찰보증금과 계약보증금과의 차이가 있으면 계약상대자는 그 차액을 추가로 납부하여야 한다.② 제1항에 의한 대체는 계약이 성립한 때에 이루어진 것으로 본다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:18의2","kind":"조문","type":"계약예규","family":"nca","label":"제18조의2","title":"계약의 이행보증","text":"제18조의2(계약의 이행보증) ① 낙찰자는 계약체결일까지 시행령 제50조 및 시행령 제52조가 정하는 바에 따라 계약이행보증을 하여야 한다.② 시행령 제52조에 의한 보증이행업체는 다음 각호에 해당하는 자격을 갖추고 있어야 하며, 계약담당공무원은 보증이행업체의 적격여부를 심사하기 위하여 낙찰자에게 관련자료의 제출을 요구할 수 있다.1. 「독점규제 및 공정거래에 관한 법률」에 의한 계열회사가 아닌 자2. 시행령 제76조에 의한 입찰참가자격 제한을 받고 그 제한기간 중에 있지 아니한 자3. 시행령 제36조에 의한 입찰공고 등에서 정한 입찰참가자격과 동등이상의 자격을 갖춘자③ 계약담당공무원은 제1항에 의하여 보증이행업체의 적격여부심사 결과 부적격하다고 인정되는 때에는 낙찰자에게 보증이행업체의 변경을 요구할 수 있다.④ 시행령 제52조제1항제3호에 의한 용역이행보증서의 제출 및 보증기관의 보증이행 등에 대하여는 제1항 내지 제3항 외에 계약예규「정부 입찰ㆍ계약 집행기준」제13장(공사의 이행보증제도 운용)에 정한 바에 의한다. ［본조신설 2025.12.31.］","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"부정당업자의 입찰참가자격제한","text":"제19조(부정당업자의 입찰참가자격제한) 입찰자 또는 낙찰자가 「국가를 당사자로 하는 계약에 관한 법률」제27조 및 시행령 제76조에 해당하는 경우에는 1월이상 2년이하의 범위내에서 입찰참가자격 제한 조치를 받게 된다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"비밀유지의 의무","text":"제20조(비밀유지의 의무) 입찰자는 발주기관으로부터 배부받은 입찰에 관한 서류 또는 각종 자료 및 입찰과정에서 얻은 정보를 해당 입찰 이외의 목적으로 사용하여서는 아니된다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"이의신청","text":"제21조(이의신청) ① 추정가격이 1억 5천만원이상인 용역의 입찰에 있어 다음 각호의 어느 하나의 사유로 인하여 불이익을 받았다고 인정되는 자는 「국가를 당사자로 하는 계약에 관한 법률」(이하 \"법\"이라 한다) 제28조제2항 및 제4항에서 정한 바에 따라 이의신청을 할 수 있다. 1. 법 제28조제1항 각호의 어느 하나에 정한 사유2. 특례규정 제26조에서 정한 사유","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"기타사항","text":"제22조(기타사항) 입찰공고조건 및 이 유의서에 명시되지 아니한 기타 사항은 발주기관에서 정하는 바에 의한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-bid:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"재검토기한","text":"제23조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-yongyeok-bid","group":"용역입찰유의서","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-yongyeok-js","kind":"법령","type":"계약예규","family":"nca","label":"용역종합심사기준","name":"(계약예규) 용역계약 종합심사낙찰제 심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 「국가를 당사자로 하는 계약에 관한 법률 시행령」제42조제4항제3호부터 제5호까지의 규정에 의한 낙찰자 결정시의 심사방법ㆍ항목ㆍ배점한도 등 심사기준과 각 중앙관서의 장 또는 계약담당공무원이 준수하여야 할 사항을 정함을 목적으로 한다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 예규에서 사용하는 용어의 정의는 다음과 같다.1. ‘종합기술제안서’라 함은 입찰자가 용역 수행을 위한 제안내용 등에 대하여 입찰공고에 따라 작성하여 제출하는 서류를 말한다.2. ‘종합기술제안서 심사적격자’란 제8조제1항에 따라 각 중앙관서의 장 또는 계약담당공무원이 종합기술제안서 심사대상으로 선정한 입찰자를 말한다.3. ‘기술적이행능력 평가서’란 제2호에 따른 종합기술제안서 심사적격자 선정심사를 위해 입찰자가 제출하는 서류를 말한다.4. ‘심사위원회’란 제8조에 따른 기술능력 심사를 위하여 시행령 제42조제7항에 따라 구성한 위원회를 말한다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"심사기준","text":"제3조(심사기준) ① 시행령 제42조제4항 제3호부터 제5호까지의 용역입찰에 대한 낙찰자 선정(이하 \"종합심사낙찰제\"라 한다)은 [별표1], [별표2], [별표3]의 심사기준에 따라 실시한다.② 시행령 제42조제4항 제3호부터 제5호에서 정한 각 용역의 유형별 심사기준에 대하여는 국토교통부 장관이 재정경제부장관의 승인을 받아 해당유형의 특성 등을 반영한 절차 및 심사기준을 정할 수 있다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"세부 심사기준의 작성","text":"제4조(세부 심사기준의 작성) ① 각 중앙관서의 장 또는 계약담당공무원은 제3조에 따른 기준에서 정하는 범위 내에서 세부 심사기준을 정할 수 있다.② 각 중앙관서의 장 또는 계약담당공무원은 제1항에도 불구하고 세부심사기준을 작성함에 있어서 용역의 특성ㆍ내용 및 사업특성 등을 고려하여 필요하다고 인정할 경우에는 재정경제부장관과 협의하여 제3조에 규정한 심사항목에 대한 배점한도를 가감ㆍ조정하거나 심사항목을 추가 또는 제외할 수 있다.③ 각 중앙관서의 장 또는 계약담당공무원은 시행령 제42조제4항 제3호부터 제5호의 용역에 대하여 제2항에 따라 재정경제부장관과 협의를 하려는 경우에는 사전에 국토교통부장관의 의견을 청취하여야 한다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"입찰공고","text":"제5조(입찰공고) 각 중앙관서의 장 또는 계약담당공무원은 입찰공고에 다음 각 호의 사항을 명시하여야 한다.1. 용역명, 용역내용, 용역기간 및 예산 규모2. 해당용역이 용역 종합심사낙찰제 적용 대상이라는 점3. 계약체결 절차, 기준, 심사에 필요한 서류와 제출기한4. 종합기술제안서의 내용, 심사요소 및 심사방법5. 종합기술제안서를 계약문서로 한다는 사항6. 종합기술제안서 심사적격자를 선정하는 경우 기술적이행능력 평가서의 작성방법, 심사항목 및 배점기준 등7. 그밖에 입찰 참가에 필요한 사항 등\n제2장 종합심사방법","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"입찰서의 제출","text":"제6조(입찰서의 제출) ① 각 중앙관서의 장 또는 계약담당공무원은 입찰자로 하여금 입찰시 다음 각 호의 서류를 제출하게 하여야 한다.1. 입찰서2. 종합기술제안서3. 기술적이행능력 평가서(제9조제1항에 따라 종합기술제안서 심사적격자를 선정하는 경우에 한한다)4. 심사를 위해 입찰공고에서 발주기관이 요구한 자료② 제1항에도 불구하고, 제8조제1항에 따라 종합기술제안서 심사적격자를 선정하는 경우에는 제1항제2호의 서류를 종합기술제안서 심사 전일로서 발주기관이 정하는 기일까지 제출하게 할 수 있다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"심사서류의 보완 등","text":"제7조(심사서류의 보완 등) ① 각 중앙관서의 장 또는 계약담당공무원은 제6조에 따라 제출된 종합기술제안서 등 심사서류의 내용이 불명확하여 인지할 수 없는 경우에는 기한을 정하여 보완을 요구할 수 있다.② 각 중앙관서의 장 또는 계약담당공무원은 제3조의 규정에 따른 심사를 위하여 종합기술제안서 내용의 확인에 필요한 추가자료를 요구하거나 입찰자에 대하여 설명을 요구할 수 있다.③ 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따른 기한까지 보완을 요구한 서류가 제출되지 아니한 경우 당초 제출된 서류만으로 심사하되, 당초 제출된 서류가 불명확하여 심사하기가 곤란한 경우에는 심사에서 제외할 수 있다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"종합기술제안서 심사적격자의 선정","text":"제8조(종합기술제안서 심사적격자의 선정) ① 각 중앙관서의 장 또는 계약담당공무원은 용역의 내용ㆍ난이도ㆍ해당 용역의 시장현황 등을 고려하여 기술역량 및 유사용역 수행 경험 등 기술적이행능력을 심사하여 선정된 자(이하 이 조에서 \"심사적격자\"라 한다)에 한하여 제9조제1항에 따라 종합기술제안서 심사를 하게 할 수 있다. ② 제1항의 경우 각 중앙관서의 장 또는 계약담당공무원은 [별표3]의 기준에 따라 심사하여야 한다.③ 각 중앙관서의 장은 심사적격자의 선정에 기술성ㆍ전문성이 요구된다고 판단할 경우에는 제11조에 따른 심사위원회에서 심사하게 할 수 있다.④ 각 중앙관서의 장 또는 계약담당공무원은 제3항의 규정에 따라 심사적격자를 선정한 경우에는 입찰자에게 선정결과를 통지하여야 한다.⑤ 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 선정된 심사적격자에게 종합기술제안서를 지정된 일시까지 제출하도록 통지하여야 한다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"종합기술제안서 심사","text":"제9조(종합기술제안서 심사) ① 각 중앙관서의 장 또는 계약담당공무원은 입찰자별로 종합기술제안서 심사와 가격심사를 실시하고 각 점수를 합산하여 종합심사점수를 산정한다. ② 종합기술제안서 심사는 [별표2], 종합점수 산정 및 가격심사는 [별표1]의 기준에 따라 각각 심사하되, 종합기술제안서 심사는 제11조에 따른 심사위원회가 심사한다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"낙찰자의 결정","text":"제10조(낙찰자의 결정) ① 입찰가격이 예정가격 이하인 자로서 제9조의 종합심사 점수가 최고점인 자를 낙찰자로 한다.② 종합심사 점수가 최고점자인 자가 둘 이상인 경우에는 종합기술제안서 심사점수가 높은 자를 낙찰자로 결정하고, 종합기술 심사점수가 가장 높은 자가 둘 이상인 경우에는 각 중앙관서의 장이 정하여 입찰공고에 명시한 기준에 따라 낙찰자를 결정한다.\n제3장 기  타","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"위원회 구성","text":"제11조(위원회 구성) 각 중앙관서의 장은 제8조에 따른 기술능력 심사를 위하여 시행령 제42조제7항에 따른 위원회의 심의를 거쳐 낙찰자를 결정하여야 하며, 심사위원회 구성 및 운영 등을 위해 필요한 세부사항은 각 중앙관서의 장이 따로 정한다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"기타사항","text":"제12조(기타사항) ① 「공사계약 종합심사낙찰제 심사기준」제15조부터 제17조의 규정은 용역 종합심사낙찰제에 준용한다.② 계약담당공무원은 용역에 대한 종합심사낙찰제를 실시함에 있어 이 예규에 규정되지 않은 사항과 이 예규 시행에 필요한 세부사항을 작성하여 집행할 수 있다.\n제4장 보  칙","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yongyeok-js:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"재검토기한","text":"제13조(재검토기한) 이 예규는「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2019년 1월1일을 기준으로 매3년이 되는 시점(매3년째의 12월31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-yongyeok-js","group":"용역종합심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-ilgwal","kind":"법령","type":"계약예규","family":"nca","label":"일괄입찰낙찰자결정기준","name":"(계약예규) 일괄입찰 등에 의한 낙찰자 결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제79조에 따른 일괄입찰 또는 대안입찰, 제98조에 따른 실시설계 기술제안입찰 또는 기본설계 기술제안입찰(이하 \"일괄입찰 등\"이라 한다)과 관련하여 시행령 제85조의2, 제86조, 제87조, 제102조, 제104조 및 제106조에 따른 낙찰자결정 및 그 밖에 필요한 사항을 정함을 목적으로 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"입찰참가자격사전심사","text":"제2조(입찰참가자격사전심사) 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)은 일괄입찰 등에 있어 시행령 제13조에 따라 입찰참가자격을 미리 심사하여 적격자를 선정 하고자 하는 경우 사전심사 기준ㆍ방법 그 밖에 필요한 사항은 계약예규「입찰참가자격사전심사요령」을 참고하여 정할 수 있다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"일괄입찰 등의 실시설계적격자 또는 낙찰자 결정방법 공고","text":"제3조(일괄입찰 등의 실시설계적격자 또는 낙찰자 결정방법 공고) 계약담당공무원은 시행령 제85조의2 또는 제102조에 따라 선택된 실시설계적격자 또는 낙찰자 결정방법을 입찰공고시 명시하여야 한다","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"입찰 및 설계심의 의뢰 등","text":"제4조(입찰 및 설계심의 의뢰 등) ① 계약담당공무원은 입찰참가자로 하여금 가격입찰서와 함께 일괄입찰의 경우에는 시행령 제85조제3항제1호에 정한 서류를, 대안입찰의 경우로서 대안을 제출하는 경우에는 동조 제2항에 정한 서류를, 실시설계 및 기본설계 기술제안입찰의 경우에는 시행령 제103조제1항 또는 시행령 제105조제1항의 기술제안서를 각각 제출하게 하여야 한다. 다만, 일괄입찰에 있어 시행령 제85조의2제1항제4호의 방법에 따라 실시설계적격자를 결정하는 경우에는 가격입찰서는 제출하게 하지 아니한다. ② 계약담당공무원은 입찰시 제출된 기본설계입찰서, 대안입찰서, 기술제안서 등에 대하여 시행령 제85조제5항 또는 제6항, 시행령 제103조제3항 또는 제4항, 시행령 제105조제4항 또는 제5항에 따라 중앙건설기술심의위원회 또는 기술자문위원회에 설계 또는 기술제안의 적격여부에 대한 심의 및 설계점수평가 또는 기술제안점수평가를 의뢰하여야 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"세부심사기준","text":"제5조(세부심사기준) ① 계약담당공무원은 필요한 경우에는 이 예규에 정한 바에 따라 실시설계적격자 또는 낙찰자가 결정될 수 있도록 세부심사기준을 정할 수 있다.② 계약담당공무원은 제1항에 따라 세부심사기준을 정한 때에는 입찰에 참가하고자 하는 자가 열람할 수 있도록 비치하여야 하며, 입찰에 참가하고자 하는 자의 신청이 있을 경우 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」 제41조에 정한 입찰관련서류와 함께 교부하여야 한다.③ 제2항에 따른 열람ㆍ교부기간은 입찰공고일부터 입찰등록마감일까지 이어야 한다.④ 계약담당공무원은 시행령 제14조에 따른 전자조달시스템에 제2항의 서류를 게재함으로써 입찰에 참가하고자 하는 자에 대한 열람 또는 교부에 갈음할 수 있다. 다만, 입찰에 참가하고자 하는 자가 서류로 제2항의 서류를 교부토록 요구하는 경우에는 서류로 교부하여야 한다.\n제2장 일괄입찰의 실시설계적격자 및 낙찰자 결정","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"일괄입찰의 실시설계적격자 및 낙찰자 결정","text":"제6조(일괄입찰의 실시설계적격자 및 낙찰자 결정) 계약담당공무원은 시행령 제87조에 따라 일괄입찰의 실시설계적격자 및 낙찰자를 결정함에 있어서는 이 장에 정한 바에 따라야 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"실시설계적격자 결정대상자 선정","text":"제7조(실시설계적격자 결정대상자 선정) ① 계약담당공무원은 일괄입찰에 참가한 자에 대하여 시행령 제85조제5항 또는 제6항에 따라 입찰시 제출한 기본설계의 적격여부 및 설계점수를 중앙건설기술심의위원회 또는 기술자문위원회로부터 통지 받은 때에는 기본설계적격자(제8조에 따라 낙찰자를 결정하는 경우에는 60점 이상 85점 이하에서 계약담당공무원이 정한 설계점수 이상을 받은 자) 중 설계점수가 높은 순으로 최대 6인(적격으로 통지된 입찰자가 6인미만인 경우에는 적격으로 통지된 모든 입찰자)을 실시설계적격자 결정대상자로 선정하여야 한다. ② 계약담당공무원은 제1항에 불구하고 시행령 제85조제5항 또는 제6항에 따른 기본설계적격자가 1인 이하인 경우에는 시행령 제87조제1항 단서에 정한 바에 따라 재공고입찰에 의하여야 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"설계적합최저가방식","text":"제8조(설계적합최저가방식) 계약담당공무원은 시행령 제85조의2제1항제1호의 방법으로 실시설계적격자를 선정하는 경우에는 제7조에 따라 선정된 실시설계적격자 결정대상자(이하 \"실시설계적격자 결정대상자\"라 한다) 중 최저가격으로 입찰한 자를 실시설계적격자로 결정하여야 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"입찰가격조정방식","text":"제9조(입찰가격조정방식) 계약담당공무원은 시행령 제85조의2제1항제2호 전단의 방법으로 실시설계적격자를 선정하는 경우에는 실시설계적격자 결정대상자 중 다음 계산식에 따라 조정된 가격이 가장 낮은 자를 실시설계적격자로 결정하여야 한다. 　    조정가격 = 입찰가격/(설계점수/100)","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"설계점수조정방식","text":"제10조(설계점수조정방식) 계약담당공무원은 시행령 제85조의2제1항제2호 후단의 방법으로 실시설계적격자를 선정하는 경우에는 실시설계적격자 결정대상자 중 다음 계산식에 따라 조정된 점수가 가장 높은 자를 실시설계적격자로 결정하여야 한다. 　    조정점수 = [(설계점수× 추정금액)]/입찰가격","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"가중치기준방식","text":"제11조(가중치기준방식) ① 계약담당공무원은 시행령 제85조의2제1항제3호의 방법으로 실시설계적격자를 선정하는 경우에는 실시설계적격자 결정대상자 중 가중치가 반영된 설계점수와 가격점수를 합산한 종합점수가 가장 높은 자를 실시설계적격자로 결정하여야 한다. ② 계약담당공무원은 제1항에 적용할 설계점수와 가격점수의 가중치는 공사의 기술난이도 등을 고려하여 별표에 따라 그 합계가 100이 되도록 정하여야 하며, 동 내용을 입찰공고시 실시설계적격자 결정방법과 함께 명시하여야 한다. ③ 가격점수는 다음 계산식을 적용하여 산정한다. 이 경우에 최저입찰가격은 실시설계적격자 결정대상자의 입찰가격 중 최저입찰가격을 말한다.　    가격점수 = 가격점수가중치 × (최저입찰가격/해당입찰가격)","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"확정가격최상설계방식","text":"제12조(확정가격최상설계방식) 계약담당공무원은 시행령 제85조의2제1항제4호의 방법으로 실시설계적격자를 선정하는 경우에는 실시설계적격자 결정대상자 중 설계점수가 가장 높은 자를 실시설계적격자로 결정하여야 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:12의2","kind":"조문","type":"계약예규","family":"nca","label":"제12조의2","title":"일괄입찰의 일부 입찰무효시 설계점수의 조정","text":"제12조의2(일괄입찰의 일부 입찰무효시 설계점수의 조정) 계약담당공무원은 제7조 내지 제12조에도 불구하고 기본설계적격자 및 실시설계적격자를 선정함에 있어 시행령 제84조제1항제2호의 자(이하 이 예규에서 설계업체라 한다)의 일부에 입찰무효 사유가 있는 입찰참가자에 대하여는 중앙건설기술심의위원회 또는 기술자문위원회로부터 통지받은 설계점수를 다음과 같이 조정한 설계점수를 적용한다.　　설계점수= 설계평가총점수 - [ (입찰무효사유가 있는 설계업체의 참여분야 지분율 × 해당분야 취득점수)+(입찰무효사유가 있는 설계업체의 참여분야 지분율 × 해당분야 취득점수)+......][본조신설 2016.12.30.]","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"일괄입찰의 낙찰자 결정","text":"제13조(일괄입찰의 낙찰자 결정) ① 계약담당공무원은 제8조 내지 제12조에 따라 실시설계적격자를 결정한 경우에는 시행령 제85조제3항제2호에 따라 실시설계적격자로부터 실시설계서 등을 제출받아 동조 제5항 또는 제6항에 따라 중앙건설기술심의위원회 또는 기술자문위원회에 실시설계서의 적격여부에 대한 심의를 의뢰하여야 한다. ② 계약담당공무원은 시행령 제85조제5항 또는 제6항에 따라 중앙건설기술심의위원회 또는 기술자문위원회로부터 해당 실시설계의 적격통지를 받은 때에는 동 실시설계적격자를 낙찰자로 결정한다. ③ 계약담당공무원은 실시설계적격자의 입찰금액이 계속비대형공사에 있어서는 계속비예산, 일반대형공사에 있어서는 총 공사 예산을 각각 초과하는 경우에는 실시설계 제출요구 전에 예산의 범위안으로 가격을 조정하기 위하여 그 입찰자와 협의하여야 하며 협의가 성립되지 아니할 때에는 재공고입찰에 의하여야 한다.④ 제1항 및 제2항에 따른 낙찰자의 결정은 부득이한 사유가 없는 한 실시설계서가 제출된 날부터 60일이내에 하여야 한다.\n제3장 대안입찰의 낙찰자 결정","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"대안입찰의 낙찰자 결정","text":"제14조(대안입찰의 낙찰자 결정) 계약담당공무원은 시행령 제86조에 따라 대안입찰의 낙찰자를 결정함에 있어서는 이 장에 정한 바에 따라야 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"낙찰적격입찰 선정 등","text":"제15조(낙찰적격입찰 선정 등) ① 계약담당공무원은 시행령 제85조제2항에 따라 제출된 대안입찰서의 대안입찰가격(제86조제3항 또는 제4항에 따른 조정을 거친 후의 대안입찰가격을 포함한다)이 다음 각 호의 요건을 모두 충족하는 경우에는 이를 낙찰적격입찰로 선정한다.1. 대안입찰가격이 입찰자 자신의 원안입찰가격보다 낮을 것2. 대안입찰가격이 총공사 예정가격 이하로서 대안공종에 대한 입찰가격이 대안공종에 대한 예정가격 이하일 것② 계약담당공무원은 제1항에 따라 선정된 낙찰적격입찰의 대안설계서를 원안설계서와 함께 시행령 제85조제5항 또는 제6항에 따라 중앙건설기술심의위원회 또는 기술자문위원회에 설계의 적격여부에 대한 심의 및 설계점수평가를 의뢰하여야 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"낙찰자 결정대상자 선정","text":"제16조(낙찰자 결정대상자 선정) 계약담당공무원은 다음 각 호에 해당하는 자를 낙찰자 결정대상자로 선정하여야 한다.1. 원안입찰자(대안입찰서를 제출하였으나 제15조에 따라 낙찰적격입찰에서 제외되었거나, 낙찰적격입찰 중 제2호에 포함되지 않은 입찰자를 포함한다. 이하 같다)2. 시행령 제85조제5항 또는 제6항에 따라 중앙건설기술심의위원회 또는 기술자문위원회로부터 적격으로 통지된(제17조에 따라 낙찰자를 결정하는 경우에는 60점 이상 85점 이하에서 계약담당공무원이 정한 설계점수 이상을 받은) 대안입찰서 중 설계점수가 높은 순으로 최대 6개의 대안(적격으로 통지된 대안이 6개미만인 경우에는 적격으로 통지된 모든 대안)을 선정한 후, 선정된 대안의 설계점수와 원안설계점수를 비교하여 대안설계점수가 원안설계점수보다 보다 낮지 아니한 대안입찰서를 제출한 자","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"설계적합최저가방식","text":"제17조(설계적합최저가방식) 계약담당공무원은 시행령 제85조의2제2항제1호의 방법으로 낙찰자를 결정하는 경우에는 제16조에 따라 선정된 낙찰자 결정대상자(이하 \"낙찰자 결정대상자\"라 한다) 중 최저가격으로 입찰한 자를 낙찰자로 결정하여야 한다.","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"입찰가격조정방식","text":"제18조(입찰가격조정방식) 계약담당공무원은 시행령 제85조의2제2항제2호 전단의 방법으로 낙찰자를 결정하는 경우에는 낙찰자 결정대상자 중 다음 계산식에 따라 조정된 가격이 가장 낮은 자를 낙찰자로 결정하여야 한다. 　    ㆍ 조정가격 = 입찰가격/(설계점수/100)","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"설계점수조정방식","text":"제19조(설계점수조정방식) 계약담당공무원은 시행령 제85조의2제2항제2호 후단의 방법으로 낙찰자를 결정하는 경우에는 낙찰자 결정대상자 중 다음 계산식에 따라 조정된 점수가 가장 높은 자를 낙찰자로 결정하여야 한다. 　    ㆍ 조정점수 = (설계점수 × 예정가격)/입찰가격","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"가중치기준방식","text":"제20조(가중치기준방식) ① 계약담당공무원은 시행령 제85조의2제2항제3호의 방법으로 낙찰자를 결정하는 경우에는 낙찰자 결정대상자 중 가중치가 반영된 설계점수와 가격점수를 합산한 종합점수가 가장 높은 자를 낙찰자로 결정하여야 한다. ② 계약담당공무원은 제1항에 적용할 설계점수와 가격점수의 가중치는 공사의 기술난이도 등을 고려하여 별표에 따라 그 합계가 100이 되도록 정하여야 하며, 동 내용을 입찰공고시 낙찰자 결정방법과 함께 명시하여야 한다. ③ 가격점수는 다음 계산식을 적용하여 산정한다. 이 경우 최저입찰가격은 낙찰자 결정대상자의 입찰가격 중 최저입찰가격을 말한다.　    ㆍ 가격점수 = 가격점수가중치 × (최저입찰가격/해당입찰가격)","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:20의2","kind":"조문","type":"계약예규","family":"nca","label":"제20조의2","title":"대안입찰의 일부 입찰무효시 설계점수의 조정","text":"제20조의2(대안입찰의 일부 입찰무효시 설계점수의 조정) 계약담당공무원은 제16조 내지 제20조에도 불구하고 설계업체의 일부에 입찰무효 사유가 있는 입찰참가자가 있을 경우에는 낙찰자 결정대상자 및 낙찰자를 선정함에 있어 제12조의2를 준용한다.[본조신설 2016.12.30.]\n제4장 기술제안입찰자의 낙찰자 결정","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"기술제안입찰의 낙찰자 결정","text":"제21조(기술제안입찰의 낙찰자 결정) 계약담당공무원은 시행령 제104조에 따라 실시설계 기술제안입찰의 낙찰자를 결정하거나 시행령 제106조에 따라 기본설계 기술제안입찰의 실시설계적격자 및 낙찰자를 결정함에 있어서는 이 장에 정한 바에 따라야 한다.[본조신설 2023.6.30.][종전 제21조는 제27조로 이동 2023.6.30.]","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"실시설계 기술제안입찰의 낙찰자 결정 대상자 선정","text":"제22조(실시설계 기술제안입찰의 낙찰자 결정 대상자 선정) 계약담당공무원은 실시설계 기술제안입찰에 참가한 자에 대하여 시행령 제103조제3항 또는 제4항에 따라 입찰시 제출한 기술제안서의 적격여부 및 기술제안점수를 중앙건설기술심의위원회 또는 기술자문위원회로부터 통지받은 때에는 기술제안적격자 중 다음 각 호의 구분에 따른 예산을 초과하지 않는 금액으로 입찰한 자로서 기술제안점수가 높은 순으로 최대 6명(적격으로 통지된 입찰자가 6명 미만인 경우 적격으로 통지된 모든 입찰자)을 낙찰자 결정대상자로 선정하여야 한다. 1. 공사비가 계속비 예산으로 계상된 공사: 계속비 예산2. 공사비가 계속비 예산으로 계상되지 않은 공사: 총공사 예산[본조신설 2023.6.30.][종전 제22조는 제28조로 이동 2023.6.30.]","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"실시설계 기술제안입찰의 낙찰자 결정 방법","text":"제23조(실시설계 기술제안입찰의 낙찰자 결정 방법) ① 계약담당공무원은 시행령 제102조제1항 각 호의 방법으로 낙찰자를 결정하는 경우에는 제17조 내지 제20조의 낙찰자 결정방법을 준용한다. 이 경우 \"설계점수\"는 \"기술제안점수\"로 \"예정가격\"은 \"추정금액\"으로 본다.[본조신설 2023.6.30.]","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:24","kind":"조문","type":"계약예규","family":"nca","label":"제24조","title":"기본설계 기술제안입찰의 실시설계적격자 결정대상자 결정","text":"제24조(기본설계 기술제안입찰의 실시설계적격자 결정대상자 결정) 계약담당공무원은 시행령 제105조제4항 또는 제5항에 따라 입찰시 제출한 기술제안서의 적격여부 및 기술제안점수를 중앙건설기술심의위원회 또는 기술자문위원회로부터 통지받은 때에는 기술제안적격자 중 기술제안점수가 높은 순으로 최대 6명(적격으로 통지된 입찰자가 6명 미만인 경우 적격으로 통지된 모든 입찰자)을 실시설계적격자 결정대상자로 선정하여야 한다.[본조신설 2023.6.30.]","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:25","kind":"조문","type":"계약예규","family":"nca","label":"제25조","title":"기본설계 기술제안입찰의 실시설계적격자 결정 방법","text":"제25조(기본설계 기술제안입찰의 실시설계적격자 결정 방법) 계약담당공무원은 시행령 제102조제2항 각 호의 방법으로 실시설계적격자를 선정하는 경우에는 제9조 내지 제11조의 실시설계적격자 결정방법을 준용한다. 이 경우 \"설계점수\"는 \"기술제안점수\"로 본다.[본조신설 2023.6.30.]","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:26","kind":"조문","type":"계약예규","family":"nca","label":"제26조","title":"기본설계 기술제안입찰의 낙찰자 결정","text":"제26조(기본설계 기술제안입찰의 낙찰자 결정) ① 계약담당공무원은 제25조에 따라 실시설계적격자를 결정한 경우에는 시행령 제105조제3항에 따라 실시설계적격자로부터 실시설계서 등을 제출받아 동조 제4항 또는 제5항에 따라 중앙건설기술심의위원회 또는 기술자문위원회에 실시설계서의 적격여부에 대한 심의를 의뢰하여야 한다.② 계약담당공무원은 시행령 제105조제4항 또는 제5항에 따라 중앙건설기술심의위원회 또는 기술자문위원회로부터 해당 실시설계의 적격통지를 받은 때에는 동 실시설계적격자를 낙찰자로 결정한다.③ 제13조제3항 및 제4항은 기본설계 기술제안입찰의 낙찰자결정에 관하여 준용한다.[본조신설 2023.6.30.]\n제5장 보칙","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:27","kind":"조문","type":"계약예규","family":"nca","label":"제27조","title":"입찰결과의 공개 등","text":"제27조(입찰결과의 공개 등) 계약담당공무원은 개찰 후 즉시 입찰참가업체별 설계점수와 입찰가격을 전자조달시스템 또는 발주기관의 정보처리장치를 통하여 공개하여야 하며, 「독점규제 및 공정거래에 관한 법령」에 따라 입찰관련정보를 공정거래위원회에 제출하여야 한다.[제21조에서 이동 2023.6.30.]","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-ilgwal:28","kind":"조문","type":"계약예규","family":"nca","label":"제28조","title":"재검토기한","text":"제28조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.[제22조에서 이동 2023.6.30.]","lawId":"ye-ilgwal","group":"일괄입찰낙찰자결정기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-jonghap","kind":"법령","type":"계약예규","family":"nca","label":"종합계약집행요령","name":"(계약예규) 종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적 및 적용범위","text":"제1조(목적 및 적용범위) ① 이 예규는 「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제71조에 의한 종합계약의 체결방법 기타 필요한 사항을 정함을 목적으로 한다.② 이 예규는 국가기관, 지방자치단체 또는 「공공기관의 운영에 관한 법률」 제4조 내지 제6조에 의한 공공기관(이하 \"국가기관\"이라 한다)이 집행하는 공사에 적용된다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 예규에서 사용하는 용어의 정의는 다음과 같다.1. \"종합계약\"이라 함은 「국가를 당사자로 하는 계약에 관한 법률」 제24조에 의해 동일 장소에서 서로 다른 국가기관 중 2개 기관 이상이 관련되는 공사 등에 대하여 관련기관협의체를 구성하여 공동으로 체결하는 계약을 말한다.2. \"간선시설공사\"라 함은 다음과 같다.가. 공사기간동안 도로의 점용ㆍ굴착 또는 기타의 사유로 인해 교통체증, 소음 등을 유발함으로써 인근지역 주민들의 생활에 지장을 초래할 것이 예상되는 공사로 추정금액이 30억원 이상인 도로등 토목공사와 추정금액이 10억원 이상인 전기ㆍ전기통신ㆍ가스ㆍ상하수도ㆍ교통안전시설ㆍ포장공사 등나. 「택지개발촉진법」, 「주택법」, 「산업입지 및 개발에 관한 법률」, 「도시 및 주거환경 정비법」 등에서 규정하는 택지ㆍ주택단지ㆍ대지ㆍ공단조성지역 및 정비구역 등의 사업시행지역 내에서 집행하려는 도로등 토목공사와 전기ㆍ전기통신ㆍ가스ㆍ상하수도ㆍ교통안전시설ㆍ포장공사 등3. \"종합계약공사\"라 함은 제4조에 의하여 조달청장이 종합계약에 의하는 것이 적합하다고 인정한 간선시설공사로서 도로관리청이 동 계약방식에 의할 것을 조건으로 허가ㆍ협의 또는 승인(이하 \"허가\"라 한다)하거나, 사업실시계획의 승인 또는 인가권자(이하 \"인가권자\"라 한다)가 동 계약방식에 의하도록 승인ㆍ인가(이하 \"인가\"라 한다)한 사업실시계획상의 간선시설공사를 말한다.4. \"관련기관협의체\"라 함은 종합계획에 의하도록 허가ㆍ인가된 공사의 관련기관이 해당 계약을 공동으로 집행하기 위해 잠정적으로 결성한 조직체를 말한다.5. \"지하구\"라 함은 복수의 기관들이 각각 필요한 전기, 전기통신, 가스, 상하수도시설 등을 동시에 설치할 수 있도록 된 터널형태의 지하구조물을 말한다.6. \"도로관리청\"이라 함은 「도로법」 제20조에 의한 도로관리청을 말한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"사업계획서 등의 작성ㆍ제출","text":"제3조(사업계획서 등의 작성ㆍ제출) ① 제2조제2호 \"가\"목의 간선시설공사를 집행하려는 각 국가기관의 장은 「도로법 시행령」 제30조에 따라 도로관리청에 제출하는 도로점용에 관한 사업계획서에 다음 각호의 사항을 명시하여야 한다.1. 공사의 개요2. 공사의 예상금액3. 공사기간4. 공사장의 위치5. 기타 공사집행에 필요한 사항② 제2조제2호 \"나\"목에 정한 사업시행지역 내에서 사업을 시행하려는 사업시행자 또는 사업시행주체는 간선시설공사 등의 관련기관들과 협의하여 사업의 실시계획서를 작성하고, 이를 인가권자에게 제출하여야 하며, 사업의 실시계획서에 간선시설공사 등에 대한 제1항 각호의 사항을 명시하여야 한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"종합계약 적격여부 심사","text":"제4조(종합계약 적격여부 심사) ① 제3조제1항에 의하여 사업계획서를 제출받은 도로관리청은 동 사업계획서상 동일 도로에서 집행될 공사의 기간조정 등을 통하여 동시에 공사시행이 가능하다고 판단될 경우에는 그 대상공사 및 사업계획서를 조달청장에게 통보한다.② 제3조제2항에 의하여 사업의 실시계획서를 제출받은 인가권자는 간선시설공사의 공사기간조정 등을 통하여 동시에 공사시행이 가능하다고 판단될 경우에는 그 대상공사 및 그 사업의 실시계획서를 조달청장에게 통보한다.③ 조달청장은 제1항 및 제2항에 의하여 사업계획서 및 사업의 실시계획서를 통보받을 경우에는 종합계약에 의하는 것이 적합한지를 심사하여 그 결과를 도로관리청 및 인가권자에게 통보한다.④ 도로관리청 또는 인가권자는 제3항에 의하여 종합계약에 의하는 것이 적합하다고 판단된 경우 종합계약에 의한 공사의 집행을 조건으로 도로점용을 허가하거나 사업의 실시계획을 인가한다.⑤ 도로관리청 또는 인가권자는 간선시설공사를 지하구형태로 집행하는 것이 가능하거나 공동굴착이 기술상 가능하다고 판단될 경우에는 이에 의한 공사의 집행을 조건으로 허가 또는 인가한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"관련기관협의체의 구성","text":"제5조(관련기관협의체의 구성) ① 제4조에 의하여 종합계약에 의하여 공사를 집행하도록 된 기관들(이하 \"관련기관들\"이라 한다)은 종합계약의 집행을 위한 관련기관협의체를 구성하여야 한다.② 관련기관협의체 구성기관들은 동 협의체를 대표하는 기관(이하 \"대표관련기관\"이라 한다)을 선임하여야 한다.③ 제2항에 의한 선임은 원칙적으로 종합계약공사로 판정이 난 공사중 도로공사가 있는 경우에는 도로공사를 집행하는 기관으로, 도로공사가 없는 경우에는 공사의 예상금액이 가장 높은 기관으로 한다.④ 제2항에 의해 선임된 대표관련기관은 계약상대자 및 제3자에 대하여 관련기관협의체를 대표한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"관련기관 협정서의 작성","text":"제6조(관련기관 협정서의 작성) ① 관련기관협의체는 제9조제1항에 의하여 계약을 체결하고자하는 경우에는 관련기관 상호간의 권리, 의무 및 책임등에 관하여 필요한 사항을 규정하기 위하여 관련기관협정서를 작성ㆍ비치하고 계약체결 요청시에는 그 1부를 조달청장에게 제출한다.② 관련기관협의체는 제9조제2항에 의하여 직접 공사계약을 체결하고자 하는 경우, 관련기관협의체의 협의에 의해 대표기관집행방식과 공동집행방식중 하나를 택일하고 이에 따라 별지 제1호 및 제2호를 참고하여 종합계약관련기관협정서를 작성한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"종합집행계획서의 작성","text":"제7조(종합집행계획서의 작성) ① 관련기관협의체는 각 관련기관의 사업계획서와 사업시행자의 사업실시계획서 등을 참고로 하여 다음 각호의 내용이 포함된 종합집행계획서를 작성하여 재정경제부장관, 도로관리청장과 사업시행자에게 제출하도록 하며, 이 경우에는 종합집행계획서의 작성, 제출책임은 대표관련기관의 장이 진다.1. 공사의 개요2. 공사의 종합설계서 및 총 설계금액3. 공사기간4. 발주방법 및 발주예정시기5. 공사장의 위치6. 기타 공사집행에 필요한 사항② 대표관련기관은 종합집행계획서의 원활한 작성을 위해 제14조제1항의 운영협의체의 계약업무담당자들과 협의하여야 한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"예산배정 및 지출한도액 통지","text":"제8조(예산배정 및 지출한도액 통지) 제7조에 의하여 종합집행계획서를 제출받은 재정경제부장관은 예산배정 및 지출한도액 통지를 함에 있어 해당 공사가 차질없이 집행될 수 있도록 협조한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"계약체결","text":"제9조(계약체결) ① 관련기관협의체는 종합짐행계획서 1부를 첨부하여 조달청장에게 계약체결을 요청하여야 한다.② 관련기관협의체는 종합계약공사의 시공, 감독, 하자보수 등에 관한 기술적인 특수성 혹은 종합계약의 특수성을 고려하여 직접 공사계약을 체결함이 적합하다고 인정되는 공사로서 조달청장과 미리 협의한 경우에는 제1항에도 불구하고 직접 공사계약을 체결할 수 있다.③ 조달청장은 제1항에 의하여 계약체결을 요청받은 때에는 「조달사업에 관한 법률 시행규칙」 제5조 내지 제10조에 의하여 계약업무를 집행하여야 한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"입찰공고","text":"제10조(입찰공고) ① 관련기관협의체는 시행령 제33조에 의한 입찰공고시에 시행령 제36조에서 정한 입찰공고의 내용에 더하여 해당 공사가 종합계약에 의한다는 것을 명시하여야 한다.② 관련기관협의체는 입찰공고시 종합계약공사중 2개 이상 공종의 복합공사로서 일괄발주가 가능한 간선시설공사들은 일괄하여 복합공사로 발주할 수 있으며, 이 경우에는 특별한 사유가 없는 한 공동계약이 가능하다는 것을 입찰공고에 명시하여야 한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"예정가격","text":"제11조(예정가격) 제9조제1항에 의하여 조달청장에게 계약체결이 요청된 경우에는 종합계약공사의 예정가격을 조달청장이 작성하며, 제9조제2항에 의하여 관련기관협의체가 직접계약을 체결하는 경우에는 대표관련기관이 제14조제1항의 운영협의체의 계약업무 담당자들과 협의하여 예정가격을 작성한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"권리행사 및 의무의 이행","text":"제12조(권리행사 및 의무의 이행) 각 관련기관은 관련기관협의체의 구성원으로서 이 예규 및 관련기관협정서에서 정하는 바에 따라 신의와 성실의 원칙에 따라 이를 이행하여야 한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"정부의 위탁ㆍ보조를 받아 공사를 집행하는 자 등에의 준용","text":"제13조(정부의 위탁ㆍ보조를 받아 공사를 집행하는 자 등에의 준용) ① 국가기관의 위탁 또는 보조(총공사금액의 100분의 30이상의 보조를 받는 경우에 한한다)를 받아 공사를 집행하는 자가 시행하는 공사에 대하여도 이 요령을 준용한다.② 도로관리청은 민간 가스공급업자들에 대하여도 필요하다고 인정될 경우에는 종합계약을 조건으로 도로점용을 허가할 수 있고, 이 요령을 준용할 수 있다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"운영협의체","text":"제14조(운영협의체) ① 관련기관협의체는 각 구성기관의 장이 임명한 계약업무담당자를 위원으로 하는 운영협의체를 설치하여 계약의 집행에 관한 제반사항을 협의한다.② 관련기관협정서에 규정되지 아니한 사항 및 구성기관간의 분쟁은 운영협의체에서 협의하여 처리하며, 구성기관 간에 합의가 이루어지지 않을 때에는 대표관련기관의 장이 결정한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"보칙","text":"제15조(보칙) 조달청장은 종합계약적격여부의 심사기준ㆍ심사기간ㆍ세부적인 예정가격의 결정방법ㆍ계약체결 위탁 경우에 각 관련기관별 공사비분담방법 등 이 예규에 정하여지지 않은 사항에 관하여 세부운영기준을 정할 수 있다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jonghap:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"재검토기한","text":"제16조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-jonghap","group":"종합계약집행요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"ext:국가재정법","kind":"외부법","type":"외부","label":"국가재정법","name":"국가재정법"},{"id":"ext:하도급거래공정화에관한법률","kind":"외부법","type":"외부","label":"하도급거래 공정화에 관한 법률","name":"하도급거래 공정화에 관한 법률"},{"id":"ext:근로기준법","kind":"외부법","type":"외부","label":"근로기준법","name":"근로기준법"},{"id":"ext:민법","kind":"외부법","type":"외부","label":"민법","name":"민법"},{"id":"ext:국고금관리법","kind":"외부법","type":"외부","label":"국고금 관리법","name":"국고금 관리법"},{"id":"ext:공공기관의운영에관한법률","kind":"외부법","type":"외부","label":"공공기관의 운영에 관한 법률","name":"공공기관의 운영에 관한 법률"},{"id":"ext:독점규제및공정거래에관한법률","kind":"외부법","type":"외부","label":"독점규제 및 공정거래에 관한 법률","name":"독점규제 및 공정거래에 관한 법률"},{"id":"ext:건설산업기본법","kind":"외부법","type":"외부","label":"건설산업기본법","name":"건설산업기본법"},{"id":"ext:중소기업협동조합법","kind":"외부법","type":"외부","label":"중소기업협동조합법","name":"중소기업협동조합법"},{"id":"ext:형의실효등에관한법률","kind":"외부법","type":"외부","label":"형의 실효 등에 관한 법률","name <script>
/* LawEverything — 검색 런타임 (브라우저 인라인용, 모듈 아님)
 *
 * 이 파일은 빌드 시 template.html 의 검색 자리표시자 주석 위치에 그대로 삽입된다.
 * 동시에 test/search.test.mjs 가 같은 파일을 읽어 검증한다 — 단일 원천.
 * 따라서 import/export 를 쓰지 않고 전역 LawSearch 를 노출한다.
 *
 * 설계 근거 (실측):
 *   1,223조문 0.45MB 에서 단순 선형 스캔이 타건당 2~3ms. 속도는 병목이 아니다.
 *   진짜 문제는 "수의계약" 한 번에 60건이 순위 없이 쏟아지는 것 —
 *   그래서 이 파일의 핵심은 색인이 아니라 **랭킹**이다.
 */
var LawSearch = (function () {
  "use strict";

  var CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";

  /** 한글 음절 → 초성. "수의계약" → "ㅅㅇㄱㅇ" (초성 검색용) */
  function chosung(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var code = s.charCodeAt(i) - 0xac00;
      out += code >= 0 && code < 11172 ? CHO[Math.floor(code / 588)] : s[i];
    }
    return out;
  }

  /** 공백·구두점 제거 + 소문자. 실무자는 띄어쓰기를 신경 쓰지 않는다. */
  function normalize(s) {
    return String(s == null ? "" : s).toLowerCase().replace(/[\s·ㆍ,.()（）「」<>·:;'"\-_/]/g, "");
  }

  /**
   * 조문 번호 표기를 하나로 모은다.
   *   "7조" · "제7조" · "제 7 조" · "7-2" · "제7조의2"  →  {jo:"7"} / {jo:"7의2"}
   * 실무자는 "7조 보증금" 처럼 조번호와 키워드를 섞어 친다.
   */
  function parseQuery(raw) {
    var q = String(raw == null ? "" : raw).trim();
    var jo = null;
    var rest = q.replace(/제?\s*(\d+)\s*조(?:\s*의\s*(\d+))?/g, function (_, a, b) {
      jo = b ? a + "의" + b : a;
      return " ";
    });
    // 조번호를 못 찾았고 질의가 숫자만이면 그것도 조번호로 본다 ("42")
    if (!jo && /^\d+$/.test(q)) jo = q;
    var terms = normalize(rest).length ? [normalize(rest)] : [];
    return { raw: q, jo: jo, terms: terms, cho: chosung(normalize(rest)) };
  }

  /** 노드 1건의 색인 — 빌드 시 1회 계산해 두고 타건마다 재사용한다. */
  function indexNode(n) {
    // 조문제목("계약보증금")과 소속 법령명("공사계약일반조건")을 분리해 색인한다.
    // 합쳐두면 법령명 매치가 조문제목 매치를 덮어버린다 —
    // "예정가격"을 치면 「예정가격작성기준」의 모든 조문이 상위를 점령하고
    // 정작 국가계약법 제8조의2(예정가격의 작성)가 밀린다.
    var own = n.kind === "조문" ? n.title || "" : n.label || "";
    var owner = n.kind === "조문" ? (n.group || "") + " " + (n.label || "") : n.name || "";
    return {
      ti: normalize(own), // 조문제목 (법령 노드는 법령명)
      t: normalize(owner), // 소속 법령명 + 조번호
      ci: chosung(normalize(own)), // 조문제목 초성 (ㅅㅇㄱㅇ → 수의계약)
      c: chosung(normalize(own + " " + owner)), // 전체 초성
      s: normalize(own + " " + owner + " " + (n.text || "")), // 전문
      jo: n.kind === "조문" && n.label ? String(n.label).replace(/^제|조$/g, "").replace(/조의/, "의") : null,
    };
  }

  // 상위 법령일수록, 원문이 있는 조문일수록 유용하다.
  var TYPE_W = { 법률: 40, 시행령: 32, 시행규칙: 24, 계약예규: 16, 훈령: 12, 고시: 12, 지침: 10, 외부: 0 };

  /** 점수. 0 이하면 결과에서 뺀다. */
  function score(n, ix, q) {
    var sc = 0;
    var matchedSomething = false;

    if (q.jo) {
      if (ix.jo === q.jo) {
        sc += 1000;
        matchedSomething = true;
      } else if (q.terms.length === 0) {
        return 0; // 조번호만 물었는데 그 조가 아니면 볼 필요 없다
      }
    }

    for (var i = 0; i < q.terms.length; i++) {
      var t = q.terms[i];
      if (!t) continue;
      // 조문제목 매치가 가장 강하다 — 실무자가 찾는 건 대개 "그 주제의 조문"이다.
      if (ix.ti === t) { sc += 700; matchedSomething = true; }
      else if (ix.ti.indexOf(t) === 0) { sc += 450; matchedSomething = true; }
      else if (ix.ti.indexOf(t) >= 0) { sc += 300; matchedSomething = true; }
      // 그 다음이 소속 법령명 매치
      else if (ix.t.indexOf(t) === 0) { sc += 220; matchedSomething = true; }
      else if (ix.t.indexOf(t) >= 0) { sc += 160; matchedSomething = true; }
      else if (ix.s.indexOf(t) >= 0) {
        // 본문 매치. 빈도를 조금 반영하되 장문이 무조건 이기지 않도록 상한을 둔다.
        var c = ix.s.split(t).length - 1;
        sc += 60 + Math.min(c, 5) * 8;
        matchedSomething = true;
      } else if (t.length >= 2 && ix.ci.indexOf(t) >= 0) {
        // 초성으로 쳤다는 건 그 단어를 정확히 안다는 뜻이다. 제목 매치급으로 쳐준다.
        sc += ix.ci === t ? 500 : 380;
        matchedSomething = true;
      } else if (t.length >= 2 && ix.c.indexOf(t) >= 0) {
        sc += 140; // 법령명까지 포함한 초성 매치
        matchedSomething = true;
      } else {
        return 0; // 모든 검색어가 걸려야 한다 (AND)
      }
    }

    if (!matchedSomething) return 0;
    sc += TYPE_W[n.type] || 0;
    if (n.kind === "조문") sc += 10;
    else if (n.kind === "법령") sc += 5;
    return sc;
  }

  function create(nodes) {
    var index = new Array(nodes.length);
    for (var i = 0; i < nodes.length; i++) index[i] = indexNode(nodes[i]);

    return {
      index: index,
      /** 상위 limit 건을 점수 내림차순으로 */
      search: function (raw, limit) {
        var q = parseQuery(raw);
        if (!q.jo && !q.terms.length) return [];
        var hits = [];
        for (var i = 0; i < nodes.length; i++) {
          var sc = score(nodes[i], index[i], q);
          if (sc > 0) hits.push({ node: nodes[i], score: sc });
        }
        hits.sort(function (a, b) {
          return b.score - a.score || (a.node.label || "").localeCompare(b.node.label || "");
        });
        return limit ? hits.slice(0, limit) : hits;
      },
    };
  }

  return { create: create, parseQuery: parseQuery, chosung: chosung, normalize: normalize, indexNode: indexNode, score: score };
})();

if (typeof module !== "undefined" && module.exports) module.exports = LawSearch;

</script>

  let hits=[], cur=0;

  function highlight(text,raw){
    const t=String(raw||'').trim();
    if(!t)return esc(text);
    const i=text.toLowerCase().indexOf(t.toLowerCase());
    if(i<0)return esc(text);
    return esc(text.slice(0,i))+'<b>'+esc(text.slice(i,i+t.length))+'</b>'+esc(text.slice(i+t.length));
  }

  function renderResults(){
    if(!hits.length){
      results.innerHTML=q.value.trim()?'<div class="none">결과 없음</div>':'';
      return;
    }
    results.innerHTML=hits.map((h,i)=>{
      const n=h.node;
      const title=n.kind==='조문'?(n.title||n.label):n.label;
      const sub=n.kind==='조문'?`${n.group} ${n.label}`:(n.name||n.type);
      return `<div class="ritem${i===cur?' sel':''}" data-i="${i}">
        <span class="dot" style="background:${color(n)}"></span>
        <span class="main">
          <span class="ttl">${highlight(title,q.value)}</span>
          <div class="sub">${esc(sub)}</div>
        </span>
        <span class="badge">${esc(n.type)}</span>
      </div>`;
    }).join('');
    const sel=results.querySelector('.ritem.sel');
    if(sel)sel.scrollIntoView({block:'nearest'});
  }

  function doSearch(){
    const s=q.value.trim();
    spot.classList.toggle('typing',!!s);
    hint.style.display=s?'none':'';
    hits=s?idx.search(s,60):[];
    cur=0;
    renderResults();
  }
  q.addEventListener('input',doSearch);
  results.addEventListener('click',e=>{
    const it=e.target.closest('.ritem'); if(!it)return;
    open(hits[+it.dataset.i].node.id);
  });

  // ───────── 원문 뷰 ─────────
  const reader=document.getElementById('reader'), docEl=document.getElementById('doc'),
        relsEl=document.getElementById('rels');
  const stack=[];
  let focusId=null;

  /**
   * 원문 안의 인용 표기를 클릭 가능한 링크로.
   * evidence 는 추출 단계에서 항·호를 덧붙여 만든 문자열이라 원문과 띄어쓰기가 다를 수 있다.
   * 그래서 공백을 제거한 사본에서 위치를 찾고 원문 좌표로 되돌린다.
   */
  function linkify(text,outEdges){
    let bare='';const map=[];
    for(let i=0;i<text.length;i++){ if(!/\s/.test(text[i])){bare+=text[i];map.push(i);} }
    const marks=[];
    const seen=new Set();
    for(const e of outEdges){
      if(e.kind==='소속'||!e.evidence)continue;
      const ev=e.evidence.replace(/\s/g,'');
      if(!ev)continue;
      let from=0;
      while(true){
        const at=bare.indexOf(ev,from);
        if(at<0)break;
        const s=map[at], en=map[at+ev.length-1]+1;
        const key=s+':'+en;
        if(!seen.has(key)){ seen.add(key); marks.push({s,e:en,target:e.target}); }
        from=at+ev.length;
        break; // 같은 근거는 첫 등장만
      }
    }
    marks.sort((a,b)=>a.s-b.s||b.e-a.e);
    let out='',pos=0;
    for(const m of marks){
      if(m.s<pos)continue; // 겹치면 건너뜀
      out+=esc(text.slice(pos,m.s));
      const t=byId.get(m.target);
      out+=`<a class="cite" data-go="${esc(m.target)}" title="${esc(t?nameOf(t):'')}">${esc(text.slice(m.s,m.e))}</a>`;
      pos=m.e;
    }
    return out+esc(text.slice(pos));
  }

  function relRow(e,dir){
    const other=byId.get(dir==='out'?e.target:e.source);
    if(!other)return '';
    return `<div class="rel" data-go="${esc(other.id)}">
      <span class="k ${e.kind}">${e.kind}</span>
      <span>${dir==='out'?'→':'←'} ${esc(nameOf(other))}
      ${e.evidence?`<span class="ev"> ⟨${esc(e.evidence)}⟩</span>`:''}</span></div>`;
  }

  function open(id,push){
    const n=byId.get(id); if(!n)return;
    if(push!==false&&focusId&&focusId!==id)stack.push(focusId);
    focusId=id;

    const o=(outs.get(id)||[]).filter(e=>e.kind!=='소속');
    const i=(ins.get(id)||[]).filter(e=>e.kind!=='소속');
    const stamp=(n.확인일||n.시행일)?`<div class="stamp${n.낡음?' old':''}">${
      [n.시행일?`시행 ${ymd(n.시행일)}`:'',n.확인일?`확인 ${ymd(n.확인일)}`:'',
       n.상태&&n.상태!=='현행'?n.상태:'',n.낡음?'⚠ 재수집 필요':''].filter(Boolean).join(' · ')}</div>`:'';

    docEl.innerHTML=`
      <div class="crumb">${esc(n.kind==='조문'?n.group:n.type)}</div>
      <h2>${esc(n.kind==='조문'?n.label:n.label)}${n.kind==='조문'&&n.title?` <span class="subt">(${esc(n.title)})</span>`:''}</h2>
      ${n.kind!=='조문'&&n.name?`<div class="subt">${esc(n.name)}</div>`:''}
      ${stamp}
      <div class="body">${n.text?linkify(n.text,outs.get(id)||[]):'<span style="color:var(--muted)">원문 없음 — 이 노드는 법령/외부법 단위입니다.</span>'}</div>`;
    docEl.scrollTop=0;

    relsEl.innerHTML=
      (o.length?`<h3>이 조문이 향하는 곳 (${o.length})</h3>`+o.map(e=>relRow(e,'out')).join(''):'')+
      (i.length?`<h3>이곳을 가리키는 것 (${i.length})</h3>`+i.map(e=>relRow(e,'in')).join(''):'')+
      (!o.length&&!i.length?'<div class="relempty">연결된 관계가 없습니다.</div>':'');

    drawMini(id);
    reader.classList.add('on');
    spot.style.display='none';
    document.getElementById('back').style.visibility=stack.length?'visible':'hidden';
  }

  document.addEventListener('click',e=>{
    const g=e.target.closest('[data-go]');
    if(g){ open(g.dataset.go); }
  });
  document.getElementById('back').onclick=()=>{
    const prev=stack.pop(); if(prev)open(prev,false);
    document.getElementById('back').style.visibility=stack.length?'visible':'hidden';
  };
  document.getElementById('tosearch').onclick=toSearch;
  function toSearch(){
    reader.classList.remove('on');
    spot.style.display='';
    q.focus(); q.select();
  }

  // ───────── 국소 그래프 (2단계 이웃만) ─────────
  // 전역 1,354노드는 O(n²) 포스 시뮬레이션이라 브라우저에서 돌지 않는다.
  // 실무 질문은 "이 조문이 뭐랑 엮였나"라서 2홉이면 충분하다.
  const MAX_NODES=48;
  const svg=document.getElementById('mini');
  let sim=null;

  function neighborhood(id){
    const keep=new Set([id]);
    let frontier=[id];
    for(let hop=0;hop<2&&keep.size<MAX_NODES;hop++){
      const next=[];
      for(const x of frontier){
        for(const y of (adj.get(x)||[])){
          if(keep.has(y))continue;
          keep.add(y); next.push(y);
          if(keep.size>=MAX_NODES)break;
        }
        if(keep.size>=MAX_NODES)break;
      }
      frontier=next;
    }
    return keep;
  }

  function drawMini(id){
    if(sim)cancelAnimationFrame(sim);
    const keep=neighborhood(id);
    const ns=[...keep].map(x=>({...byId.get(x)}));
    const nmap=new Map(ns.map(n=>[n.id,n]));
    const es=edges.filter(e=>keep.has(e.source)&&keep.has(e.target));

    const W=svg.clientWidth||360,H=svg.clientHeight||260;
    ns.forEach((n,i)=>{const a=i/ns.length*Math.PI*2;
      n.x=W/2+Math.cos(a)*Math.min(W,H)*0.3;n.y=H/2+Math.sin(a)*Math.min(W,H)*0.3;n.vx=0;n.vy=0;});
    const me=nmap.get(id); me.x=W/2; me.y=H/2;

    let alpha=1;
    function tick(){
      for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
        const a=ns[i],b=ns[j];let dx=a.x-b.x,dy=a.y-b.y;let d2=dx*dx+dy*dy||1;
        const f=900/d2,d=Math.sqrt(d2);dx/=d;dy/=d;
        a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
      }
      for(const e of es){
        const a=nmap.get(e.source),b=nmap.get(e.target);
        const target=e.kind==='소속'?42:66;
        let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1;
        const f=(d-target)*0.03;dx/=d;dy/=d;
        a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
      }
      for(const n of ns){
        n.vx+=(W/2-n.x)*0.004;n.vy+=(H/2-n.y)*0.004;
        if(n.id===id){n.x=W/2;n.y=H/2;n.vx=n.vy=0;continue;}
        n.vx*=0.8;n.vy*=0.8;n.x+=n.vx*alpha;n.y+=n.vy*alpha;
        n.x=Math.max(16,Math.min(W-16,n.x));n.y=Math.max(14,Math.min(H-14,n.y));
      }
      alpha*=0.985;
      svg.innerHTML=
        es.map(e=>{const a=nmap.get(e.source),b=nmap.get(e.target);
          return `<line class="edge ${e.kind}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;}).join('')+
        ns.map(n=>`<g class="node ${n.kind==='외부법'?'ext':''} ${n.id===id?'focus':''}" data-go="${esc(n.id)}">
          <circle cx="${n.x}" cy="${n.y}" r="${n.id===id?9:n.kind==='법령'?7:5}" fill="${color(n)}"/>
          ${n.id===id||n.kind==='법령'?`<text x="${n.x+11}" y="${n.y+3.5}">${esc(n.kind==='조문'?n.label:n.label)}</text>`:''}
        </g>`).join('');
      // 레이아웃이 잦아들면 멈춘다. 계속 돌리면 읽는 내내 CPU를 태운다.
      sim=alpha>0.03?requestAnimationFrame(tick):null;
    }
    tick();
  }

  // ───────── 키보드 ─────────
  document.addEventListener('keydown',e=>{
    // 한글 IME 조합 중의 Enter 는 "조합 확정"이지 "선택"이 아니다.
    // 이걸 거르지 않으면 "수의계약" 치고 Enter 한 번에 엉뚱한 항목이 열린다.
    if(e.isComposing||e.keyCode===229)return;
    const inReader=reader.classList.contains('on');
    if(e.key==='/'&&document.activeElement!==q){e.preventDefault();toSearch();return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();toSearch();return;}
    if(e.key==='Escape'){
      if(inReader){toSearch();}
      else if(q.value){q.value='';doSearch();}
      return;
    }
    if(inReader)return;
    if(!hits.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();cur=Math.min(cur+1,hits.length-1);renderResults();}
    else if(e.key==='ArrowUp'){e.preventDefault();cur=Math.max(cur-1,0);renderResults();}
    else if(e.key==='Enter'){e.preventDefault();open(hits[cur].node.id);}
  });

  q.focus();
})();
</script>
</body>
</html>
