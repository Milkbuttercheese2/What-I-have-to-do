 있다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:7","kind":"조문","type":"시행령","family":"nca","label":"제7조","title":"일반경쟁 및 제한경쟁의 공고","text":"제7조(일반경쟁 및 제한경쟁의 공고)\n①각 중앙관서의 장 또는 그 위임을 받은 공무원은 특례조달계약에 있어서 일반경쟁 또는 제한경쟁에 붙이고자 하는 때에는 국가를당사자로하는계약에관한법률시행령에 따라 공고를 하여야 한다. 이 경우 국가를당사자로하는계약에관한법률시행령 제33조제1항중 \"관보 또는 일간신문에 게재하거나 게시판에 게시하는 방법등\"을 \"관보 또는 간행물에의 게재\"로, 제35조제1항중 \"10일이전\"을 \"40일이전(반복조달계약으로서 최초의 계약외의 경우에는 25일이전)\"으로, 제35조제2항중 \"5일까지\"를 \"10일까지\"로 보고, 동령 제35조제2항중 재공고 입찰의 경우 \"5일까지\"를 \"40일까지\"로 본다.\n②입찰공고내용을 수정하기 위하여 수정공고를 하는 경우와 입찰자 또는 낙찰자가 없거나 낙찰자가 계약을 체결하지 아니하여 재공고를 하는 경우에 있어서 적기에 특정물품등을 조달할 수 없다고 판단되는 때에는 제1항의 규정에 불구하고 입찰일 또는 개찰일전 10일까지 공고할 수 있다.\n③입찰공고의 내용에는 국가를당사자로하는계약에관한법률시행령 제36조에 규정된 것외에 다음 각호의 사항을 포함하여야 한다.\n④입찰공고에 있어서 특정의 상표ㆍ상호ㆍ디자인ㆍ생산지 또는 제작자등을 언급하지 아니하고는 조달하고자 하는 물품의 규격ㆍ품질등에 대하여 충분한 설명이 곤란한 경우에는 그 공고내용에 상표ㆍ상호ㆍ디자인ㆍ생산지 또는 제작자등을 특정하여 그 특정된 물품 또는 이와 규격ㆍ품질등이 동등한 물품에 대하여 입찰에 붙인다는 뜻을 기재할 수 있다. 이 경우 입찰 참가자는 공급하고자 하는 물품이 공고내용에 기재된 물품과 규격ㆍ품질등이 동등한 것임을 증명하여야 한다.\n⑤제1항의 규정에 의한 공고에 사용하는 언어는 한국어로 함을 원칙으로 하되, 다음 각호의 사항은 영어ㆍ불어ㆍ스페인어중 하나를 선택하여 공고문 하단에 요약하여 게재하여야 한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:8","kind":"조문","type":"시행령","family":"nca","label":"제8조","title":"지명경쟁의 공고등","text":"제8조(지명경쟁의 공고등)\n①각 중앙관서의 장 또는 그 위임을 받은 공무원은 특례조달계약에 있어서 지명경쟁에 붙이고자 하는 때에는 제7조의 규정에 준하여 공고하되, 그 공고내용에는 지명경쟁에의 참가기준을 포함하여야 한다.\n②제1항의 규정에 의한 지명경쟁입찰에 있어서 제6조제5항의 규정에 의한 인증공급자명부가 작성되어 있지 아니하거나 기타의 사유로 입찰공고일 이전에 별도로 당해 입찰에 지명될 자를 결정할 필요가 있는 경우에는 입찰참가희망자로부터 당해 입찰에 관한 의견이나 참가요청서등을 미리 제출받아 입찰참가자격을 심사할 수 있다.\n③지명경쟁의 공고 및 통지등에 관하여 필요한 사항은 재정경제부령으로 정한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:9","kind":"조문","type":"시행령","family":"nca","label":"제9조","title":"입찰설명서의 교부","text":"제9조(입찰설명서의 교부)\n①각 중앙관서의 장 또는 그 위임을 받은 공무원은 특례조달계약에 있어서 경쟁입찰에 붙이고자 하는 경우에는 입찰에 참가하고자 하는 자에게 입찰설명서를 교부받을 수 있는 균등한 기회를 주어야 하며, 입찰설명서에 대한 설명등을 요청받은 때에는 즉시 이에 응하여야 한다.\n②입찰설명서의 내용 및 교부방법등에 관하여 필요한 사항은 재정경제부령으로 정한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:10","kind":"조문","type":"시행령","family":"nca","label":"제10조","title":"낙찰자등의 고시 및 통지등","text":"제10조(낙찰자등의 고시 및 통지등)\n①각 중앙관서의 장 또는 그 위임을 받은 공무원은 특례조달계약에 있어서 낙찰자 또는 수의계약의 상대자를 결정한 때에는 그 결정일의 다음날부터 60일이내에 재정경제부령이 정하는 사항을 관보에 고시하여야 한다.\n②각 중앙관서의 장 또는 그 위임을 받은 공무원은 경쟁입찰에 의한 특례조달계약에 있어서 낙찰자를 결정한 때에는 특별한 사유가 없는 한 그 결정일의 다음날부터 7일이내에 낙찰자외의 모든 입찰자들에게 낙찰자를 결정한 사실, 낙찰자의 성명(상호) 및 주소, 낙찰금액등을 서면 또는 간행물등의 방법으로 통지하여야 한다.\n③각 중앙관서의 장 또는 그 위임을 받은 공무원은 낙찰자로 결정되지 아니한 입찰자로부터 낙찰되지 아니한 이유 기타 당해 입찰과 관련된 자료등의 요청이 있는 때에는 특별한 사유가 없는 한 이에 응하여야 한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:11","kind":"조문","type":"시행령","family":"nca","label":"제11조","title":"수의계약 사유","text":"제11조(수의계약 사유) 특례조달계약에 있어서 국가를당사자로하는계약에관한법률시행령 제26조제1항제4호ㆍ제5호, 동항제6호 가목(품질경영촉진법 부칙 제4조의 규정에 의한 경우에 한한다), 동항제7호 가목 내지 마목, 동항제8호 가목 및 나목의 규정에 의한 사유는 수의계약 적용대상에서 제외한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:12","kind":"조문","type":"시행령","family":"nca","label":"제12조","title":null,"text":"제12조 삭제","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:13","kind":"조문","type":"시행령","family":"nca","label":"제13조","title":"계약에 관한 기록","text":"제13조(계약에 관한 기록)\n①각 중앙관서의 장 또는 그 위임을 받은 공무원은 특례조달계약에 있어서 경쟁에 의하여 낙찰자를 결정한 때에는 다음 각호의 사항을 기록하여 관리하여야 한다.\n②각 중앙관서의 장 또는 그 위임을 받은 공무원은 특례조달계약에 있어서 수의계약을 체결한 때에는 다음 각호의 사항을 기록하여 관리하여야 한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:14","kind":"조문","type":"시행령","family":"nca","label":"제14조","title":"이의처리","text":"제14조(이의처리)\n①각 중앙관서의 장은 특례조달계약에 있어서 낙찰자로 결정되지 아니한 입찰자로부터 이의제기가 있는 경우에는 이에 대한 적절한 조치를 하여야 한다.\n②제1항의 규정에 의한 각 중앙관서의 장의 조치에 이의가 있는 자는 그 조치가 있은 날 또는 그 조치가 있음을 안 날부터 15일이내에 특정조달을위한국가를당사자로하는계약에관한법률시행령특례규정 제28조의 규정에 의한 국제계약분쟁조정위원회에 조정을 위한 재심을 청구할 수 있다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:15","kind":"조문","type":"시행령","family":"nca","label":"제15조","title":null,"text":"제15조 삭제","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:16","kind":"조문","type":"시행령","family":"nca","label":"제16조","title":null,"text":"제16조 삭제","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-e:17","kind":"조문","type":"시행령","family":"nca","label":"제17조","title":"국가를당사자로하는계약에관한법률시행령과의 관계","text":"제17조(국가를당사자로하는계약에관한법률시행령과의 관계) 특례조달계약에 있어서 이 영에 특별한 규정이 없는 사항에 관하여는 국가를당사자로하는계약에관한법률시행령 및 특정조달을위한국가를당사자로하는계약에관한법률시행령특례규정을 적용한다.","lawId":"nca-sp1-e","group":"특정물품 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:nca-sp1-r","kind":"법령","type":"시행규칙","family":"nca","label":"특정물품 특례규칙","name":"특정물품등의조달에관한국가를당사자로하는계약에관한법률시행특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:1","kind":"조문","type":"시행규칙","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 특례규칙은 특정물품등의조달에관한국가를당사자로하는계약에관한법률시행령특례규정에서 위임된 사항과 그 시행에 관하여 필요한 사항을 규정함을 목적으로 한다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:2","kind":"조문","type":"시행규칙","family":"nca","label":"제2조","title":"특정물품등의 범위등","text":"제2조(특정물품등의 범위등)\n①특정물품등의조달에관한국가를당사자로하는계약에관한법률시행령특례규정(이하 \"특례령\"이라 한다) 제2조제1호의 규정에 의한 특정물품등은 외국과의 상호합의에 의하여 양허되는 전기통신제품(통신망장비 기타 통신기자재를 포함한다), 이에 부수되는 서비스 및 이들과 관련되는 소프트웨어(프로그램과 이를 작성하기 위하여 사용되는 설계서ㆍ기술서 기타 관련자료를 말한다)로 한다. 다만, 다음 각호의 것을 제외한다.\n②특례령 제2조제2호에서 \"재정경제부령이 정하는 국가기관\"이라 함은 미래창조과학부 및 조달청을 말한다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:3","kind":"조문","type":"시행규칙","family":"nca","label":"제3조","title":"입찰참가자격","text":"제3조(입찰참가자격)\n①특례령 제6조제1항의 규정에 의하여 외국인의 입찰참가자격을 다음과 같이 한다.\n②계약담당공무원은 조달하고자 하는 물품의 특성에 따라 필요하다고 인정되는 경우에는 제1항의 규정에 의한 자격요건외에 경영상황ㆍ경영실적 및 기술능력등을 추가하여 입찰참가자격을 정할 수 있다.\n③계약담당공무원은 제2항의 규정에 의한 입찰참가자격의 심사를 위하여 필요하다고 인정되는 경우에는 다음 각호의 서류를 제출하게 할 수 있다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:4","kind":"조문","type":"시행규칙","family":"nca","label":"제4조","title":"입찰참가자격의 등록 및 공고","text":"제4조(입찰참가자격의 등록 및 공고)\n①제3조제1항제1호의 규정에 해당하는 자가 국가를당사자로하는계약에관한법률시행규칙 제15조의 규정에 의하여 입찰참가자격의 등록을 하고자 하는 때에는 동조제2항제2호 또는 제3호 각목의 서류를 제출하거나 이들에 갈음하는 증명서를 제출하여야 한다.\n②제3조제1항제2호의 규정에 해당하는 자가 국가를당사자로하는계약에관한법률시행규칙 제15조의 규정에 의하여 입찰참가자격의 등록을 하고자 하는 때에는 등록신청서와 제3조제1항제2호의 규정에 의한 자격이 있음을 증명하는 서류(본사 소재국의 대한민국공관장, 상공회의소 기타 이에 상응하는 기관의 장 또는 공증인의 확인을 받은 것에 한한다)를 함께 제출하여야 한다.\n③계약담당공무원은 제1항 및 제2항의 규정에 의하여 입찰참가자격의 등록을 하게 하고자 하는 때에는 다음 각호의 사항을 국가를당사자로하는계약에관한법률시행령 제22조제1항의 규정에 의한 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다) 또는 간행물에 공고하여야 한다.\n④등록신청서의 작성에 사용하는 언어는 한국어로 한다. 다만, 필요하다고 인정되는 경우에는 한국어외에 영어ㆍ불어ㆍ스페인어중 하나를 선택하여 사용하게 할 수 있다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:5","kind":"조문","type":"시행규칙","family":"nca","label":"제5조","title":"인증공급자 명부작성의 공고등","text":"제5조(인증공급자 명부작성의 공고등) 특례령 제6조제5항의 규정에 의한 인증공급자명부를 작성하고자 하는 때에는 다음 각호의 사항을 매회계연도마다 전자조달시스템 또는 간행물에 공고하여야 하며, 인증공급자명부상의 등록유효기간이 만료되거나 공급자가 인증공급자명부에서 제외되게 된 때에는 그 내용을 해당 공급자에게 통보하여야 한다.\n1.\n1.  조달하고자 하는 물품 및 그 물품의 범위\n2.\n2.  해당 인증공급자명부에의 등록조건 및 그 조건의 입증방법\n3.\n3.  인증공급자명부의 유효기간 및 등록갱신절차","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:6","kind":"조문","type":"시행규칙","family":"nca","label":"제6조","title":"지명경쟁의 통지 및 공고","text":"제6조(지명경쟁의 통지 및 공고)\n①특례령 제8조제1항의 규정에 따라 계약담당공무원이 특례조달계약을 지명경쟁에 부치고자 하는 때에는 다음 각호의 사항을 입찰대상자에게 통지하고, 전자조달시스템 또는 간행물에 공고하여야 한다.\n②제1항의 규정에 의한 통지 및 공고는 입찰일의 전일부터 기산하여 40일이전에 이를 행하여야 한다.\n③제1항의 규정에 의한 통지를 받은 지명경쟁입찰대상자로서 당해 입찰에 참가하고자 하는 자는 지명경쟁입찰참가승낙서를 입찰일의 전일까지 제출하여야 한다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:7","kind":"조문","type":"시행규칙","family":"nca","label":"제7조","title":"입찰설명서의 내용","text":"제7조(입찰설명서의 내용) 특례령 제9조의 규정에 의한 입찰설명서에는 다음 각호의 내용이 포함되어야 한다.\n1.\n1.  특례령 제7조 또는 제8조에 규정된 사항\n2.\n2.  입찰대상물품의 기술명세 및 규격에 관한 설명서\n3.\n3.  계약담당공무원의 소속기관 및 그 기관의 주소\n4.\n4.  계약서 작성에 사용하는 언어\n5.\n5.  기타 필요하다고 인정되는 사항","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:8","kind":"조문","type":"시행규칙","family":"nca","label":"제8조","title":"우편입찰서의 보관등","text":"제8조(우편입찰서의 보관등)\n①계약담당공무원은 우편입찰서를 접수한 때에는 당해 입찰서의 봉투표면에 접수일시를 기재하고 확인인을 날인하여 개찰시까지 개봉하지 아니하고 보관하여야 한다.\n②우편입찰서가 입찰서 접수마감일시이후에 도착된 경우에는 그 도착일시 및 당해 입찰서의 접수가 무효라는 뜻을 당해 입찰참가희망자에게 통지하여야 한다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:9","kind":"조문","type":"시행규칙","family":"nca","label":"제9조","title":"입찰서의 심사기준등","text":"제9조(입찰서의 심사기준등)\n①계약담당공무원은 특례조달계약 입찰서를 심사하고 낙찰자를 결정함에 있어서는 당해 물품의 조달에 필요한 모든 비용이 포함된 가격을 기준으로 하여야 한다.\n②입찰서를 심사함에 있어서 계약의 목적 및 성질상 제1항의 규정에 의한 가격만을 심사의 기준으로 하기가 곤란하다고 인정되는 경우에는 예정가격이하의 가격으로 입찰에 참가한 자중에서 가격을 포함한 모든 조건을 가장 유리하게 제시한 자를 낙찰자로 결정할 수 있다. 다만, 입찰공고 및 입찰설명서상에서 이러한 결정기준을 명확히 한 경우에 한한다.\n③입찰서의 작성에 사용하는 언어에 관하여는 제4조제4항의 규정을 준용한다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:10","kind":"조문","type":"시행규칙","family":"nca","label":"제10조","title":"낙찰자등의 결정의 고시사항","text":"제10조(낙찰자등의 결정의 고시사항)\n①특례령 제10조제1항의 규정에 의하여 낙찰자 또는 수의계약대상자의 결정에 관하여 고시할 사항은 다음 각호와 같다.\n②계약담당공무원은 제1항각호의 사항이 공개됨으로 인하여 법령의 집행을 저해하거나 공공의 이익에 반할 우려가 있다고 판단되는 경우 또는 공급자간의 공정한 경쟁을 저해하거나 특정인의 상업적 이익을 침해하는 등의 우려가 있다고 판단되는 경우에는 제1항각호의 고시사항중 일부를 생략할 수 있다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:11","kind":"조문","type":"시행규칙","family":"nca","label":"제11조","title":null,"text":"제11조 삭제","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp1-r:12","kind":"조문","type":"시행규칙","family":"nca","label":"제12조","title":"계약실적보고","text":"제12조(계약실적보고) 각 중앙관서의 장은 특례조달계약을 체결한 경우에는 별지 서식에 따라 작성한 매분기별 계약실적보고서를 당해 분기종료후 30일이내에 재정경제부장관에게 제출하여야 한다.","lawId":"nca-sp1-r","group":"특정물품 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:nca-sp2-e","kind":"법령","type":"시행령","family":"nca","label":"특정조달 특례규정","name":"특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:1","kind":"조문","type":"시행령","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 영은 1994년 4월 15일 마라케쉬에서 작성된 정부조달협정 등 정부가 가입하거나 체결한 다자간 또는 양자간 정부조달협정을 이행하기 위하여 국가를당사자로하는계약에관한법률(이하 \"법\"이라 한다) 제4조의 규정에 의한 국제입찰을 실시함에 있어서 국가를당사자로하는계약에관한법률시행령(이하 \"시행령\"이라 한다)에 대한 특례를 정함을 목적으로 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:2","kind":"조문","type":"시행령","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 영에서 사용하는 용어의 정의는 다음과 같다.\n1.\n1.  \"국제입찰\"이라 함은 내ㆍ외국인 또는 외국인을 대상으로 하여 물품ㆍ공사 및 용역을 조달하기 위하여 행하는 입찰을 말하며 수의계약을 포함한다.\n2.\n2.  \"특정조달계약\"이라 함은 국가가 법 제4조제1항 및 제2항의 규정에 의한 국제입찰을 통하여 물품ㆍ공사 및 용역을 조달하기 위하여 법ㆍ시행령 및 이 영의 규정에 따라 체결하는 계약을 말한다.\n3.\n3.  \"발주기관\"이라 함은 법ㆍ시행령 및 이 영의 규정에 의하여 물품ㆍ공사 및 용역을 조달하기 위하여 계약을 체결하는 국가기관을 말한다.\n4.\n4.  \"일반경쟁입찰\"이라 함은 특정조달계약에 있어서 입찰에 참가하고자 하는 모든 자격자가 입찰서를 제출할 수 있는 입찰을 말한다.\n5.\n5.  \"지명경쟁입찰\"이라 함은 특정조달계약에 있어서 발주기관이 지명한 자가 입찰서를 제출할 수 있는 입찰을 말한다.\n6.\n6.  \"수의계약\"이라 함은 특정조달계약에 있어서 발주기관이 경쟁입찰에 의하지 아니하고 계약상대자를 결정하는 계약을 말한다.\n7.\n7.  \"유자격자명부\"라 함은 특정조달계약에 있어서 물품ㆍ공사 및 용역의 입찰에 참가할 수 있는 자격을 미리 정한 후 그 자격을 갖춘 자를 기재한 명부를 말한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:3","kind":"조문","type":"시행령","family":"nca","label":"제3조","title":"적용범위","text":"제3조(적용범위)\n①이 영은 국가가 체결하는 특정조달계약에 대하여 적용한다.\n②법 제4조제1항제4호에서 \"대통령령으로 정한 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n③법 제4조제2항의 규정에 의한 정부기관과 물품ㆍ공사 및 용역의 범위는 각각 별표 1 및 별표 2와 같다.\n④재정경제부장관은 마라케쉬 정부조달협정 등 정부가 가입하거나 체결한 다자간 또는 양자간 정부조달협정(국제협정에 포함된 정부조달부문을 포함하며, 이하 \"협정\"이라 한다)이 정하는 바에 의하여 제2항 및 제3항의 규정에 대한 특례를 정하고자 하는 경우에는 그 협정의 내용에 따라 협정가입국(협정체결국을 포함한다. 이하 같다), 특정조달계약의 체결이 제한되는 국가, 협정의 적용범위 및 특정조달계약의 적용범위 등에 관한 사항을 고시하여야 한다.\n⑤「국가재정법」 제6조에 따른 중앙관서의 장(이하 \"각 중앙관서의 장\"이라 한다) 또는 법 제6조에 따른 위임ㆍ위탁 등을 받아 계약사무를 담당하는 공무원(이하 \"계약담당공무원\"이라 한다)이 법 제4조제3항에 따라 국제입찰에 의하여 조달할 수 있는 경우는 다음 각 호와 같다.\n⑥제5항의 규정에 의한 국제입찰의 경우에는 그 성질에 반하지 아니하는 범위안에서 이 영의 규정을 준용한다. 이 경우 \"특정조달계약\"은 \"제5항의 규정에 의한 국제입찰\"로 본다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:4","kind":"조문","type":"시행령","family":"nca","label":"제4조","title":"특정조달계약의 원칙","text":"제4조(특정조달계약의 원칙)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 계약상대자를 공정하게 선정하여야 하며, 정부조달과 관련된 정보를 차별적으로 제공하여서는 아니된다.\n②각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 다음 각 호의 사항을 준수하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:5","kind":"조문","type":"시행령","family":"nca","label":"제5조","title":"개발도상국에 대한 우대조치","text":"제5조(개발도상국에 대한 우대조치)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 개발도상국의 공급자로부터 조달되는 물품ㆍ공사 및 용역에 대하여 협정의 내용에 따라 우대조치를 할 수 있다.\n②재정경제부장관은 제1항의 적용과 관련하여 대상국가 및 대상물품등을 정하여 고시할 수 있다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:6","kind":"조문","type":"시행령","family":"nca","label":"제6조","title":"예정가격 작성의 예외","text":"제6조(예정가격 작성의 예외) 각 중앙관서의 장 또는 계약담당공무원은 물품 및 용역에 대한 특정조달계약에 있어서 거래실례가격이 없어 예정가격을 작성하기 곤란한 경우등 재정경제부령이 정하는 사유에 해당하는 때에는 시행령 제7조의2제1항의 규정에 의한 예정가격을 작성하지 아니할 수 있다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:7","kind":"조문","type":"시행령","family":"nca","label":"제7조","title":"계약방법","text":"제7조(계약방법) 특정조달계약의 계약방법은 일반경쟁입찰에 의한 계약ㆍ지명경쟁입찰에 의한 계약 및 수의계약으로 구분한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:8","kind":"조문","type":"시행령","family":"nca","label":"제8조","title":"사용언어","text":"제8조(사용언어)\n①특정조달계약에서 사용하는 언어는 한국어로 함을 원칙으로 한다. 다만, 조달대상인 물품등의 공급자가 특정지역에 한정되어 있는 등 외국어의 사용이 불가피하다고 인정되는 경우에는 그 특정국가의 언어 또는 영어ㆍ불어 및 스페인어중 하나를 사용할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 특정조달계약의 입찰공고를 하는 경우에는 다음 각호의 사항을 영어ㆍ불어 및 스페인어중 하나를 선택하여 입찰공고문 하단에 기재하여야 한다.\n③각 중앙관서의 장 또는 계약담당공무원은 특정조달계약의 입찰서 작성에 있어서 다수의 언어를 사용할 수 있도록 하는 경우에는 영어ㆍ불어 및 스페인어중 하나이상의 언어를 포함시켜야 한다.\n④제2항 및 제3항의 규정에 의하여 외국어로 기재한 사항이 한국어로 기재한 사항과 상이할 때에는 한국어로 기재한 사항이 우선한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:9","kind":"조문","type":"시행령","family":"nca","label":"제9조","title":"일반경쟁입찰 참가자의 자격 및 심사","text":"제9조(일반경쟁입찰 참가자의 자격 및 심사)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 필요하다고 인정하는 경우에는 시행령 제12조제1항제2호 및 제3호에 따른 자격요건 외에 계약의 종류 및 규모 등에 따라 해당 계약과 같은 종류의 계약실적, 도급한도액, 시공능력, 기술능력 및 경영상태 등 필요한 사항에 대하여 일반경쟁입찰에 참가하는 자에게 요구되는 자격을 정할 수 있다. 다만, 각 중앙관서의 장 또는 계약담당공무원이 계약의 적절한 이행을 위하여 필수적이라고 인정하는 경우 외에는 국내 수주실적을 입찰참가자격으로 정해서는 아니 된다.\n②각 중앙관서의 장 또는 계약담당공무원은 일반경쟁입찰에 참가하려는 자가 신청하는 경우 제1항에 따른 입찰참가자격의 유무를 심사하고 그 결과를 신청자에게 통지하여야 한다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 제2항에 따라 입찰참가자격의 유무를 심사하는 경우에 입찰공고 및 제15조에 따른 입찰에 관한 서류에 명시한 사항에 따라 심사하여야 하며, 입찰참가자의 국내외 사업활동에 근거하여 기술능력 및 경영상태 등을 심사하여야 한다.\n④각 중앙관서의 장 또는 계약담당공무원은 유자격자명부에 등록된 자에 대하여는 제2항의 규정에 의한 심사를 하지 아니할 수 있다.\n⑤각 중앙관서의 장 또는 계약담당공무원은 제10조제1항의 규정에 의한 자격심사를 거치지 아니한 자가 입찰참가를 요청할 경우 신속하게 자격심사절차를 개시하여야 하며, 입찰서 제출마감일 전일까지 자격심사를 완료할 만한 충분한 시간이 있다고 인정되는 경우에는 입찰서를 제출할 수 있도록 하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:10","kind":"조문","type":"시행령","family":"nca","label":"제10조","title":"유자격자명부","text":"제10조(유자격자명부)\n①각 중앙관서의 장 또는 계약담당공무원은 제9조제1항의 규정에 의한 입찰참가자격 기준을 매회계연도초에 「전자조달의 이용 및 촉진에 관한 법률」 제2조제4호에 따른 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)에 공고하고 수시로 일반경쟁입찰에 참가하고자 하는 자의 신청을 받아 입찰참가자격을 심사할 수 있으며, 그 결과에 따라 유자격자명부를 작성ㆍ비치하여 입찰에 참가하고자 하는 자가 이를 열람하게 할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 입찰공고후 제1항의 규정에 의한 입찰참가자격유무의 심사결과를 신청자에게 통지하여야 하며, 유자격자명부의 유효기간이 만료되거나 유자격자명부상에 기재된 자가 동 명부에서 제외되게 되는 경우에는 그 내용을 해당자에게 통지하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:11","kind":"조문","type":"시행령","family":"nca","label":"제11조","title":"입찰공고","text":"제11조(입찰공고)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 일반경쟁입찰에 의하는 경우에는 제12조의 규정에 의한 사항을 전자조달시스템에 공고하여야 한다.\n②제1항에 따른 입찰공고는 입찰서 제출마감일 전날부터 기산하여 40일 이전에 하여야 한다.\n③제2항에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우로서 계약목적물을 적기에 조달할 수 없다고 판단되는 경우에는 입찰서 제출마감일 전날부터 기산하여 10일 이전에 입찰공고를 할 수 있다.\n④ 각 중앙관서의 장 또는 계약담당공무원은 다음 각 호의 어느 하나에 해당하는 경우에는 각각 5일씩 공고기간을 단축할 수 있다.\n⑤ 제3항 및 제4항을 동시에 적용하는 경우에도 공고기간은 10일 미만으로 단축할 수 없다.\n⑥ 제1항부터 제4항까지의 규정에 따라 입찰공고를 한 후 그 내용에 대하여 정정공고를 하는 경우 또는 시행령 제20조제2항에 따라 재공고를 하는 경우에는 각각 시행령 제33조제2항 및 시행령 제35조제4항ㆍ제5항을 적용한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:12","kind":"조문","type":"시행령","family":"nca","label":"제12조","title":"입찰공고의 내용","text":"제12조(입찰공고의 내용) 각 중앙관서의 장 또는 계약담당공무원은 제11조의 규정에 의한 공고시 시행령 제36조에서 정한 내용외에 다음 각호의 사항을 포함하여야 한다.\n1.\n1.  당해 조달과 관련하여 추가될 조달의 조건에 관한 사항 및 반복계약의 경우에 있어서 후속입찰에 대하여는 그 입찰공고의 예정시기\n2.\n2.  일반경쟁입찰 또는 지명경쟁입찰의 방법과 협상절차의 포함여부\n3.\n3.  구매ㆍ임차 및 할부구매 등 발주기관이 사용할 조달형태\n4.\n4.  입찰참가자격심사신청서ㆍ입찰참가신청서 및 입찰서의 제출등을 위한 주소와 제출마감일 및 사용언어\n5.\n5.  협정의 적용대상 여부","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:13","kind":"조문","type":"시행령","family":"nca","label":"제13조","title":"조달계획공고","text":"제13조(조달계획공고)\n①각 중앙관서의 장 또는 계약담당공무원은 회계연도별로 특정조달계약으로 조달할 물품ㆍ공사 및 용역에 대한 조달계획을 전자조달시스템에 공고할 수 있다.\n②조달계획공고에는 제8조제2항 각 호의 사항과 입찰공고 예정일이 포함되어야 하며 제12조 각 호의 사항은 가능한 한 포함되도록 하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:14","kind":"조문","type":"시행령","family":"nca","label":"제14조","title":"기술규격","text":"제14조(기술규격)\n①각 중앙관서의 장 또는 계약담당공무원은 품질 및 성능 등에 관한 기술규격을 성능 위주로 작성하여야 하며 불가피한 경우를 제외하고는 국제표준이 있는 경우에는 국제표준에 의하고, 국제표준이 없는 경우에는 국내 관련법령의 규정 또는 국내표준에 의하여 작성하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의한 국제표준등이 없는 경우에는 품질 또는 성능시험 등을 통하여 기술규격을 작성할 수 있다.\n③ 각 중앙관서의 장 또는 계약담당공무원은 입찰에 참가하려는 자와 상호 협의하여 천연자원의 보존을 증진시키거나 환경을 보호하기 위한 목적의 기술규격을 작성할 수 있다.\n④각 중앙관서의 장 또는 계약담당공무원은 특정한 상표ㆍ규격 등을 제시하지 아니하고는 조달하고자 하는 물품 또는 용역에 대한 충분한 설명이 곤란한 경우로서 제15조의 규정에 의한 입찰에 관한 서류에 상표ㆍ규격 등을 특정하는 때에는 그 특정된 상표ㆍ규격 등과 동등이상인 물품이나 용역에 대하여 입찰에 부친다는 뜻을 기재하여야 한다.\n⑤제4항의 경우에 있어서 입찰참가자는 공급하고자 하는 물품 또는 용역의 규격ㆍ품질 등이 특정된 조건과 동등이상인 것임을 입증하여야 한다.\n⑥각 중앙관서의 장 또는 계약담당공무원은 규격을 작성함에 있어서 경쟁이 제한될 우려가 있는 방법으로 사용될 수 있는 상업적 이해관계가 있는 자에게 조언을 요구하거나 받아들여서는 아니된다.\n⑦각 중앙관서의 장 또는 계약담당공무원은 공정한 경쟁등을 위하여 필요하다고 인정되는 경우에는 기술규격을 입찰전에 공개ㆍ열람하도록 하여 입찰에 참가하고자 하는 자가 이에 대한 의견을 제시하게 할 수 있다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:15","kind":"조문","type":"시행령","family":"nca","label":"제15조","title":"입찰에 관한 서류의 교부","text":"제15조(입찰에 관한 서류의 교부) 각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 일반경쟁입찰에 의하는 경우 해당 입찰에 참가하려는 자가 요청하는 때에는 시행령 제14조제1항 또는 제16조제1항에 따른 입찰에 관한 서류(이하 \"입찰에 관한 서류\"라 한다)를 교부하여야 하며, 이에 대한 설명을 요청받은 때에는 지체없이 이에 응하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:16","kind":"조문","type":"시행령","family":"nca","label":"제16조","title":"입찰서의 제출 및 접수","text":"제16조(입찰서의 제출 및 접수)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 입찰서를 우편으로 제출하는 것을 금지하여서는 아니된다.\n②각 중앙관서의 장 또는 계약담당공무원은 필요한 경우 입찰서 및 이에 관련된 서류를 전신ㆍ전보 및 모사전송 등에 의하여 제출하도록 할 수 있다.\n③제2항의 규정에 의하여 입찰서등을 제출한 경우에는 입찰참가자로 하여금 즉시 서명본을 제출하게 하여 확인하여야 한다. 이 경우 제출된 전신등의 내용이 입찰서 제출마감일이후에 제출된 서명본과 차이가 있는 경우에는 먼저 제출된 전신등의 내용이 우선한다.\n④각 중앙관서의 장 또는 계약담당공무원은 제1항의 규정에 의하여 우편입찰서를 접수한 때에는 당해 입찰서의 봉투표면에 접수일시를 기재하고 확인인을 날인하여 개찰시까지 개봉하지 아니하고 보관하여야 하며, 입찰서가 발주기관의 귀책사유로 인하여 입찰에 관한 서류에 명시된 일시이후에 지정된 부서에 접수되었을 경우에는 당해 입찰자에게 불이익을 주어서는 아니된다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:17","kind":"조문","type":"시행령","family":"nca","label":"제17조","title":"낙찰자등의 공고 및 정보의 공개","text":"제17조(낙찰자등의 공고 및 정보의 공개)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 낙찰자를 결정하였거나 제23조의 규정에 의하여 수의계약대상자를 결정한 때에는 그 결정일의 다음날부터 72일이내에 재정경제부령이 정하는 사항을 전자조달시스템에 공고하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 입찰참가자등으로부터 당해 입찰과 관련된 정보제공 요청이 있는 경우에는 특별한 사유가 없는 한 이에 응하여야 한다.\n③제1항 및 제2항의 규정과 관련하여 낙찰정보등의 공개범위 및 공개의 예외에 관한 사항은 재정경제부령으로 정한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:18","kind":"조문","type":"시행령","family":"nca","label":"제18조","title":"지명경쟁입찰","text":"제18조(지명경쟁입찰) 각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 법 제7조의 규정에 의한 지명경쟁입찰에 부칠 경우에는 제9조에 규정한 사항을 고려하여 지명경쟁입찰에 참가하는 자에게 필요한 자격 및 지명기준을 정하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:19","kind":"조문","type":"시행령","family":"nca","label":"제19조","title":"지명경쟁입찰 참가자의 지명 및 통지","text":"제19조(지명경쟁입찰 참가자의 지명 및 통지)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약을 지명경쟁입찰에 부치고자 하는 때에는 제18조에 규정한 자격을 갖춘 자로서 지명기준에 적합하다고 인정되는 자를 지명함과 동시에 그 지명한 자에 대하여 제12조 및 시행령 제36조에 규정한 입찰공고와 관련한 사항을 통지하여야 한다.\n②제1항의 규정에 의한 통지는 제20조제1항의 규정에 의한 공고일에 하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:20","kind":"조문","type":"시행령","family":"nca","label":"제20조","title":"지명경쟁입찰의 공고","text":"제20조(지명경쟁입찰의 공고)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 지명경쟁입찰에 의하는 경우에는 제11조 및 제12조의 규정을 준용하여 이를 공고하여야 한다.\n②제1항의 규정에 불구하고 제10조의 규정에 의한 유자격자명부를 사용하지 아니하는 지명경쟁입찰의 경우에는 지명경쟁입찰참가신청서의 제출기간을 제1항의 규정에 의한 공고일 전일부터 기산하여 25일이상이 되도록 지정하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:21","kind":"조문","type":"시행령","family":"nca","label":"제21조","title":"지명경쟁입찰 참가자의 자격심사등","text":"제21조(지명경쟁입찰 참가자의 자격심사등)\n①각 중앙관서의 장 또는 계약담당공무원은 제20조의 규정에 의한 공고후 지명경쟁입찰 참가자격 심사신청이 있는 때에는 지체없이 제18조의 규정에 의한 자격에 대하여 심사를 개시하여야 한다. 다만, 입찰서 제출마감일까지 심사가 불가능하다고 판단되는 때에는 사전에 그 취지를 당해 신청자에게 통지하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 필요한 경우 제1항의 규정에 의한 참가자격 심사신청에 대한 심사기간을 정하여 제20조의 규정에 의한 공고시 이를 포함시킬 수 있다.\n③각 중앙관서의 장 또는 계약담당공무원은 지명경쟁입찰을 위한 유자격자명부를 작성하는 경우에는 지명경쟁입찰 참가자격등에 관하여 재정경제부령이 정한 사항을 매년 관보에 공고하여야 한다.\n④제10조의 규정은 제3항의 규정에 의한 유자격자명부를 작성하는 경우에 이를 준용한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:22","kind":"조문","type":"시행령","family":"nca","label":"제22조","title":"일반경쟁입찰에 관한 규정의 준용","text":"제22조(일반경쟁입찰에 관한 규정의 준용) 제9조 내지 제17조의 규정은 지명경쟁입찰의 경우에 이를 준용한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:23","kind":"조문","type":"시행령","family":"nca","label":"제23조","title":"수의계약","text":"제23조(수의계약) 특정조달계약에 있어서 수의계약에 의할 수 있는 경우는 다음 각 호와 같다.\n1.\n1.  경쟁입찰에 부쳤으나 응찰자가 없는 경우 또는 담합된 입찰서가 제출되었거나 입찰공고등에서 요구한 조건에 부합되는 입찰서가 없는 경우\n2.\n2.  적절한 대용품이나 대체품이 없는 예술품ㆍ특허권 또는 출판권 등 독점적 권리와 관련되거나 기술적 이유로 특정공급자로부터 조달할 수 있는 경우\n3.\n3.  긴급한 사유로 인하여 경쟁입찰에 의하여서는 필요한 기간내에 조달할 수 없는 경우\n4.\n4.  이미 조달된 물품 등의 부품교환 또는 설비확충 등을 위하여 조달하는 경우 또는 이미 계약을 체결한 공사에 대하여 추가공사가 필요하게 된 경우(공급자를 변경하게 되면 호환성이 없게 되는 등 기술적 또는 경제적으로 곤란하고, 동시에 발주기관에 중대한 불편을 초래하는 경우로 한정한다)\n5.\n5.  발주기관의 요구로 개발된 시제품등을 조달하는 경우(당해 계약의 이행이 완료된 후 당해 제품을 계속하여 조달하는 경우를 제외한다)\n6.\n6.  삭제\n7.\n7.  삭제\n8.\n8.  원자재시장(상품거래소등)에서 물품을 구매하는 경우\n9.\n9.  파산 및 법정관리기업의 자산처분 등의 사유로 인하여 현저하게 유리한 조건으로 조달하는 경우\n10.\n10.  재정경제부령이 정한 내용에 따른 디자인 공모에 당선된 자와 계약을 체결하는 경우","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:23의2","kind":"조문","type":"시행령","family":"nca","label":"제23조의2","title":"전자경매","text":"제23조의2(전자경매) 각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 전자적 수단으로 입찰참가자의 순위를 정하는 방식(이하 이 조에서 \"전자경매\"라 한다)으로 낙찰자를 결정하는 때에는 전자경매 개시 전에 평가 기준 및 그에 따른 평가방법과 그 밖에 해당 전자경매의 수행에 관한 정보를 각 입찰참가자에게 제공하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:24","kind":"조문","type":"시행령","family":"nca","label":"제24조","title":"계약에 관한 기록","text":"제24조(계약에 관한 기록)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 경쟁에 의하여 낙찰자를 결정한 때에는 입찰 및 계약관련 서류와 다음 각호의 사항을 기록한 문서를 5년간 보존하여야 한다.\n②각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 수의계약을 체결한 때에는 계약관련 서류와 다음 각호의 사항을 기록한 문서를 5년간 보존하여야 한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:25","kind":"조문","type":"시행령","family":"nca","label":"제25조","title":"계약실적보고","text":"제25조(계약실적보고)\n①각 중앙관서의 장은 재정경제부령으로 정하는 내용의 계약실적보고서를 작성하여 해당 연도 종료 후 60일 이내에 재정경제부장관에게 제출하여야 한다.\n②협정의 적용을 받는 공공기관에 대한 계약실적보고서는 그 주무부장관이 제1항의 규정에 따라 제출한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:26","kind":"조문","type":"시행령","family":"nca","label":"제26조","title":"이의신청의 대상","text":"제26조(이의신청의 대상) 법 제28조제1항제5호에서 \"기타 대통령령이 정하는 사항\"이라 함은 법 제28조제1항제1호 내지 제4호에 규정되지 아니한 사항으로서 협정에 위배된 사항을 말한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:27","kind":"조문","type":"시행령","family":"nca","label":"제27조","title":null,"text":"제27조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:28","kind":"조문","type":"시행령","family":"nca","label":"제28조","title":null,"text":"제28조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:29","kind":"조문","type":"시행령","family":"nca","label":"제29조","title":null,"text":"제29조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:29의2","kind":"조문","type":"시행령","family":"nca","label":"제29조의2","title":null,"text":"제29조의2 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:30","kind":"조문","type":"시행령","family":"nca","label":"제30조","title":null,"text":"제30조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:31","kind":"조문","type":"시행령","family":"nca","label":"제31조","title":null,"text":"제31조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:32","kind":"조문","type":"시행령","family":"nca","label":"제32조","title":null,"text":"제32조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:33","kind":"조문","type":"시행령","family":"nca","label":"제33조","title":null,"text":"제33조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:34","kind":"조문","type":"시행령","family":"nca","label":"제34조","title":null,"text":"제34조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:35","kind":"조문","type":"시행령","family":"nca","label":"제35조","title":null,"text":"제35조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:36","kind":"조문","type":"시행령","family":"nca","label":"제36조","title":null,"text":"제36조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:37","kind":"조문","type":"시행령","family":"nca","label":"제37조","title":null,"text":"제37조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:38","kind":"조문","type":"시행령","family":"nca","label":"제38조","title":null,"text":"제38조 삭제","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:39","kind":"조문","type":"시행령","family":"nca","label":"제39조","title":"시행령과의 관계","text":"제39조(시행령과의 관계) 특정조달계약에 있어서 이 영에 특별히 규정되어 있지 아니한 사항에 관하여는 시행령의 규정을 적용한다. 다만, 시행령 제21조ㆍ제22조 및 제72조제3항의 규정은 특정조달계약에 관한 사무에는 이를 적용하지 아니한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:40","kind":"조문","type":"시행령","family":"nca","label":"제40조","title":"국제상관례의 적용등","text":"제40조(국제상관례의 적용등)\n①각 중앙관서의 장 또는 계약담당공무원은 특정조달계약에 있어서 통화, 보증금납부의 형태 및 시기, 신용장등에 의한 대가지급 방법 및 검사 등 조달절차 수행과 관련하여 불가피한 경우에는 제39조의 규정에 불구하고 협정 및 이 영의 규정과 그 성질에 반하지 아니하는 범위안에서 국제상관례에 의할 수 있다.\n②각 중앙관서의 장 또는 계약담당공무원은 물품 및 용역의 특정조달계약에 있어서 물가변동으로 인한 계약금액 조정에 관하여 국제상관례에 따르지 아니하는 경우 조달절차 수행이 곤란하다고 판단되는 때에는 시행령 제64조제1항의 규정에 불구하고 협정 및 이 영의 규정과 그 성질에 반하지 아니하는 범위안에서 국제상관례에 의할 수 있다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:41","kind":"조문","type":"시행령","family":"nca","label":"제41조","title":"대한민국정부와칠레공화국정부간의자유무역협정과 관련한 특례","text":"제41조(대한민국정부와칠레공화국정부간의자유무역협정과 관련한 특례)\n①제3조제3항의 규정에 불구하고 대한민국정부와칠레공화국정부간의자유무역협정(이하 \"한ㆍ칠레자유무역협정\"이라 한다)에 의하여 칠레공화국의 공급자에 대하여 적용되는 특정조달계약의 대상이 되는 용역 및 공사는 별표 3과 같다.\n②제11조의 규정에 불구하고 한ㆍ칠레자유무역협정에 의하여 칠레공화국의 공급자가 참가할 수 있는 국제입찰에 대하여는 관보 또는 전자조달시스템에 입찰공고를 하게 할 수 있다. 이 경우 입찰공고는 입찰서 제출마감일 전일부터 기산하여 10일 이전에 하여야 한다.\n③제16조의 규정에 불구하고 한ㆍ칠레자유무역협정에 의하여 칠레공화국의 공급자가 참가할 수 있는 국제입찰중 재정경제부장관이 정하여 고시하는 특정조달계약에 대하여는 전자조달시스템을 이용하여 입찰서를 제출하게 할 수 있다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:42","kind":"조문","type":"시행령","family":"nca","label":"제42조","title":"「대한민국과 유럽연합 및 그 회원국 간의 자유무역협정」과 관련한 특례","text":"제42조(「대한민국과 유럽연합 및 그 회원국 간의 자유무역협정」과 관련한 특례) 「대한민국과 유럽연합 및 그 회원국 간의 자유무역협정」 제9.1조에 따라 각 중앙관서의 장 또는 계약담당공무원은 마라케쉬 정부조달협정의 협정가입국 또는 「자유무역협정의 이행을 위한 관세법의 특례에 관한 법률 시행령」 제2조제7항에 따른 유럽연합당사자의 공급자와 특정조달계약을 체결하려는 경우에는 다음 각 호의 사항을 낙찰자결정기준으로 정하거나 제1호의 사항을 입찰참가자격으로 정해서는 아니 된다.\n1.\n1.  다음 각 목의 어느 하나에 해당하는 기관이 발주한 계약의 수주실적\n가.\n가.  별표 1에 규정된 정부기관\n나.\n나.  「지방자치단체를 당사자로 하는 계약에 관한 법률」 제5조제1항 각 호 외의 부분 본문에 따라 행정안전부장관이 고시하는 지방자치단체\n다.\n다.  「공공기관의 운영에 관한 법률」 제39조제3항에 따라 입찰참가자격의 제한기준 등에 관하여 필요한 사항을 정한 재정경제부령에서 정부가 가입하거나 체결한 정부조달에 관한 협정 및 이에 근거한 국제규범에 따라 국제입찰의 방법으로 조달계약을 체결하도록 하고 있는 공기업 또는 준정부기관\n2.\n2.  제1호 외의 국내 수주실적. 다만, 각 중앙관서의 장 또는 계약담당공무원이 해당 계약의 적절한 이행을 위하여 국내 수주실적이 필수적이라고 인정하는 경우는 제외한다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:43","kind":"조문","type":"시행령","family":"nca","label":"제43조","title":"「대한민국과 페루공화국 간의 자유무역협정」과 관련한 특례","text":"제43조(「대한민국과 페루공화국 간의 자유무역협정」과 관련한 특례)\n① 삭제\n② 제3조제3항에도 불구하고 「대한민국과 페루공화국 간의 자유무역협정」(이하 \"한ㆍ페루 자유무역협정\"이라 한다)에 따라 페루공화국의 공급자를 대상으로 국제입찰을 실시하여야 하는 정부기관은 별표 4와 같다.\n③ 한ㆍ페루 자유무역협정에 따라 각 중앙관서의 장 또는 계약담당공무원은 페루공화국의 공급자와 특정조달계약을 체결하려는 경우에는 다음 각 호의 어느 하나에 해당하는 기관이 발주한 계약의 수주실적(이하 이 항에서 \"정부기관등과의 계약실적\"이라 한다)을 낙찰자결정기준으로 정해서는 아니 된다. 다만, 각 중앙관서의 장 또는 계약담당공무원이 계약의 적절한 이행을 위하여 정부기관등과의 계약실적이 필수적이라고 인정하는 경우에는 그러하지 아니하다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:44","kind":"조문","type":"시행령","family":"nca","label":"제44조","title":"「대한민국과 미합중국 간의 자유무역협정」과 관련한 특례","text":"제44조(「대한민국과 미합중국 간의 자유무역협정」과 관련한 특례)\n① 삭제\n② 제3조제3항에도 불구하고 「대한민국과 미합중국 간의 자유무역협정」(이하 \"한ㆍ미 자유무역협정\"이라 한다)에 따라 미합중국의 공급자를 대상으로 국제입찰을 실시하여야 하는 정부기관과 공사의 범위는 각각 별표 5 및 별표 6과 같다.\n③ 제9조제1항에도 불구하고 한ㆍ미 자유무역협정 제17.5조에 따라 각 중앙관서의 장 또는 계약담당공무원은 미합중국의 공급자와 특정조달계약을 체결하려는 경우에는 다음 각 호의 사항을 입찰참가자격 또는 낙찰자결정기준으로 정해서는 아니 된다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:45","kind":"조문","type":"시행령","family":"nca","label":"제45조","title":"「대한민국과 콜롬비아공화국 간의 자유무역협정」과 관련한 특례","text":"제45조(「대한민국과 콜롬비아공화국 간의 자유무역협정」과 관련한 특례)\n① 「대한민국과 콜롬비아공화국 간의 자유무역협정」(이하 \"한ㆍ콜 자유무역협정\"이라 한다)에 따라 콜롬비아공화국의 공급자에 대해서는 제3조제2항 각 호 외의 부분에 따른 \"대통령령으로 정한 경우\"에 급식에 필요한 물품 등을 조달하는 경우를 포함한다.\n② 제3조제3항에도 불구하고 한ㆍ콜 자유무역협정에 따라 콜롬비아공화국의 공급자를 대상으로 국제입찰을 실시하여야 하는 정부기관과 공사 및 용역의 범위는 각각 별표 7 및 별표 8과 같다.\n③ 제9조제1항에도 불구하고 한ㆍ콜 자유무역협정 제14.6조에 따라 각 중앙관서의 장 또는 계약담당공무원은 콜롬비아공화국의 공급자와 특정조달계약을 체결하려는 경우에는 다음 각 호의 사항을 입찰참가자격 또는 낙찰자결정기준으로 정해서는 아니 된다. 다만, 각 중앙관서의 장 또는 계약담당공무원이 계약의 적절한 이행을 위하여 정부기관등과의 계약실적이 필수적이라고 인정하는 경우에는 그러하지 아니하다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-e:46","kind":"조문","type":"시행령","family":"nca","label":"제46조","title":"「대한민국 정부와 호주 정부 간의 자유무역협정」과 관련한 특례","text":"제46조(「대한민국 정부와 호주 정부 간의 자유무역협정」과 관련한 특례)\n① 「대한민국 정부와 호주 정부 간의 자유무역협정」(이하 \"한ㆍ호주 자유무역협정\"이라 한다)에 따라 호주의 공급자에 대해서는 제3조제2항 각 호 외의 부분에 따른 \"대통령령으로 정한 경우\"에 혈액과 혈액제품(혈장분획제제를 포함한다)을 조달하는 경우를 포함한다.\n② 제3조제3항에도 불구하고 한ㆍ호주 자유무역협정에 따라 호주의 공급자를 대상으로 국제입찰을 실시하여야 하는 정부기관은 별표 9와 같고, 용역 및 공사의 범위는 별표 10과 같다.\n③ 한ㆍ호주 자유무역협정 제12.6조에 따라 각 중앙관서의 장 또는 계약담당공무원은 호주의 공급자와 특정조달계약을 체결하려는 경우에는 다음 각 호의 사항을 낙찰자결정기준으로 정해서는 아니 된다. 다만, 각 중앙관서의 장 또는 계약담당공무원이 계약의 적절한 이행을 위하여 필수적이라고 인정하는 경우에는 그러하지 아니하다.","lawId":"nca-sp2-e","group":"특정조달 특례규정","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:nca-sp2-r","kind":"법령","type":"시행규칙","family":"nca","label":"특정조달 특례규칙","name":"특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-r:1","kind":"조문","type":"시행규칙","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 규칙은 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다.","lawId":"nca-sp2-r","group":"특정조달 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-r:2","kind":"조문","type":"시행규칙","family":"nca","label":"제2조","title":"예정가격 작성의 예외","text":"제2조(예정가격 작성의 예외) 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」(이하 \"특례규정\"이라 한다) 제6조에서 \"거래실례가격이 없어 예정가격을 작성하기 곤란한 경우등\"이란 용역과 기계ㆍ기재류(機材類), 철재류(鐵材類), 식료품류, 동물류, 화공품류(비료는 제외한다), 약품류, 종이 및 판지류, 유제품류 및 목재류 등의 물품이 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n1.\n1.  지역 또는 시기에 따라 가격 차가 심한 경우\n2.\n2.  특정 제작자만이 제작할 수 있는 경우\n3.\n3.  국제 시세가 없는 경우\n4.\n4.  제작자의 설계에 따라서 가격차가 심한 경우\n5.\n5.  공급자가 제시한 규격에 따라 물품을 구매하는 경우\n6.\n6.  긴급히 구매할 필요가 있어 예정가격을 작성할 시간적 여유가 없는 경우","lawId":"nca-sp2-r","group":"특정조달 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-r:3","kind":"조문","type":"시행규칙","family":"nca","label":"제3조","title":"낙찰자 등 결정의 공고","text":"제3조(낙찰자 등 결정의 공고) 특례규정 제17조제1항에 따라 낙찰자 또는 수의계약대상자의 결정에 관하여 공고할 사항은 다음 각 호와 같다.\n1.\n1.  낙찰되거나 수의계약한 조달 대상ㆍ수량 및 금액\n2.\n2.  낙찰자 또는 수의계약대상자의 성명 및 주소\n3.\n3.  조달기관의 주소\n4.\n4.  낙찰자 또는 수의계약대상자의 결정절차\n5.\n5.  경쟁입찰의 경우에는 입찰의 공고절차\n6.\n6.  수의계약의 경우에는 수의계약 사유\n7.\n7.  그 밖에 낙찰자 등의 결정에 관한 사항","lawId":"nca-sp2-r","group":"특정조달 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-r:4","kind":"조문","type":"시행규칙","family":"nca","label":"제4조","title":"낙찰정보등의 공개범위와 공개의 예외","text":"제4조(낙찰정보등의 공개범위와 공개의 예외)\n① 특례규정 제17조제3항에 따른 낙찰정보 등의 공개범위는 다음 각 호와 같다.\n② 특례규정 제17조제3항에 따라 낙찰정보 등을 공개하지 아니할 수 있는 경우는 제1항제3호 및 제3조에서 규정한 사항의 공개가 다음 각 호의 어느 하나에 해당하는 경우를 말한다.","lawId":"nca-sp2-r","group":"특정조달 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-r:5","kind":"조문","type":"시행규칙","family":"nca","label":"제5조","title":"지명경쟁 유자격자명부 작성의 공고","text":"제5조(지명경쟁 유자격자명부 작성의 공고) 각 중앙관서의 장 또는 계약담당공무원은 특례규정 제21조제3항에 따라 지명경쟁 유자격자 명부를 작성하는 경우로서 지명경쟁입찰 참가자격 등에 관하여 관보에 공고할 경우에는 다음 각 호의 사항을 포함하여야 한다.\n1.\n1.  유자격자명부에 등록된 업체 일람표(유자격자명부를 통하여 조달하는 물품이나 서비스 또는 물품이나 서비스군의 품목분류번호를 포함하여야 한다)\n2.\n2.  유자격자명부의 등록요건 및 심사방법\n3.\n3.  유자격자명부의 유효기간 및 등록경신절차\n4.\n4.  그 밖에 유자격자명부의 등록에 관한 사항","lawId":"nca-sp2-r","group":"특정조달 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-r:6","kind":"조문","type":"시행규칙","family":"nca","label":"제6조","title":"수의계약에 의할 수 있는 경우와 관련한 디자인 공모","text":"제6조(수의계약에 의할 수 있는 경우와 관련한 디자인 공모) 특례규정 제23조제10호에서 \"재정경제부령이 정한 내용에 따른 디자인 공모\"란 해당 공모에 당선된 자와 계약을 체결할 목적으로 발주기관과 별도의 독립적인 심사단이 심사하고 모든 유자격자가 참여할 수 있도록 관보나 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제22조제1항에 따른 국가종합전자조달시스템에 공고한 것을 말한다.","lawId":"nca-sp2-r","group":"특정조달 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-r:7","kind":"조문","type":"시행규칙","family":"nca","label":"제7조","title":"계약에 관한 자료 등의 요구","text":"제7조(계약에 관한 자료 등의 요구)\n① 재정경제부장관은 정부조달협정가입국으로부터 특정조달계약에 대한 자료를 요구받은 경우에는 해당 중앙관서의 장에게 관련 자료의 제출을 요구할 수 있다.\n② 제1항에 따라 관련 자료의 제출을 요구받은 각 중앙관서의 장은 지체 없이 이를 재정경제부장관에게 제출하여야 한다.","lawId":"nca-sp2-r","group":"특정조달 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:nca-sp2-r:8","kind":"조문","type":"시행규칙","family":"nca","label":"제8조","title":"계약실적보고","text":"제8조(계약실적보고)\n① 특례규정 제25조제1항에 따른 계약실적 보고서의 내용은 다음 각 호와 같다.\n② 특례규정 제25조제2항에 따른 계약실적보고서의 내용은 「공기업ㆍ준정부기관 계약사무규칙」 제4조제1항에 따라 국제입찰의 방법으로 계약을 체결한 물품ㆍ공사 및 용역의 계약 건수와 계약 총액으로 한다.","lawId":"nca-sp2-r","group":"특정조달 특례규칙","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:psa","kind":"법령","type":"법률","family":"psa","label":"조달사업법","name":"조달사업에 관한 법률","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:1","kind":"조문","type":"법률","family":"psa","label":"제1조","title":null,"text":"제1장 총칙","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:2","kind":"조문","type":"법률","family":"psa","label":"제2조","title":"정의","text":"제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1.\n1.  \"조달물자\"란 수요물자와 비축물자(備蓄物資)를 말한다.\n2.\n2.  \"수요물자\"란 수요기관에 필요한 물자로서 대통령령으로 정하는 물자를 말한다.\n3.\n3.  \"비축물자\"란 장단기(長短期)의 원활한 물자수급과 물가안정, 재난ㆍ국가위기 등 비상시 대비를 위하여 정부가 단독으로 또는 정부와 민간이 협력하여 비축하거나 공급하는 원자재, 시설자재 및 생활필수품으로서 대통령령으로 정하는 물자를 말한다.\n4.\n4.  \"안전관리물자\"란 국민의 생활안전, 생명보호, 보건위생과 관련된 조달물자로서 조달청장이 지정ㆍ고시하는 물자를 말한다.\n5.\n5.  \"수요기관\"이란 조달물자, 공사 계약의 체결 또는 시설물의 관리가 필요한 다음 각 목의 기관을 말한다.\n가.\n가.  「국가재정법」 제6조에 따른 독립기관 및 중앙관서(이하 \"국가기관\"이라 한다)\n나.\n나.  「지방자치법」 제2조에 따른 지방자치단체(이하 \"지방자치단체\"라 한다)\n다.\n다.  그 밖에 대통령령으로 정하는 기관","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:3","kind":"조문","type":"법률","family":"psa","label":"제3조","title":"조달사업의 범위","text":"제3조(조달사업의 범위) 조달청장이 하는 조달사업의 범위는 다음 각 호와 같다.\n1.\n1.  조달물자의 구매, 물류관리, 공급 및 그에 따른 사업\n2.\n2.  수요기관의 공사 계약 및 그에 따른 사업\n3.\n3.  수요기관의 시설물 관리ㆍ운영 및 그에 따른 사업\n4.\n4.  조달물자 및 안전관리물자의 품질관리\n5.\n5.  국제조달 협력 및 해외 조달시장 진출 지원\n6.\n6.  그 밖에 다른 법령에서 조달청장이 할 수 있거나 하도록 규정한 사업","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:4","kind":"조문","type":"법률","family":"psa","label":"제4조","title":"다른 법률과의 관계","text":"제4조(다른 법률과의 관계) 조달사업에 관하여는 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:5","kind":"조문","type":"법률","family":"psa","label":"제5조","title":null,"text":"제2장 공공조달 정책 기반","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:6","kind":"조문","type":"법률","family":"psa","label":"제6조","title":"사회적 책임 장려","text":"제6조(사회적 책임 장려) 조달청장은 기업의 사회적 책임을 장려하기 위하여 조달절차에서 환경, 인권, 노동, 고용, 공정거래, 소비자 보호 등 사회적ㆍ환경적 가치를 반영할 수 있다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:7","kind":"조문","type":"법률","family":"psa","label":"제7조","title":"조달교육","text":"제7조(조달교육) 조달청장은 조달청, 수요기관 및 민간업체의 조달업무나 납품업무 종사자의 전문성과 자질 향상을 위한 조달교육을 할 수 있다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:8","kind":"조문","type":"법률","family":"psa","label":"제8조","title":"조달의 날","text":"제8조(조달의 날)\n① 공공조달의 중요성에 대한 사회적 인식과 관심을 증대시키고, 공공조달의 발전을 도모하기 위하여 매년 9월 30일을 조달의 날로 정하여 기념행사를 한다.\n② 조달의 날 행사에 관하여 필요한 사항은 조달청장이 정하여 시행할 수 있다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:9","kind":"조문","type":"법률","family":"psa","label":"제9조","title":"조달통계","text":"제9조(조달통계)\n① 조달청장은 공공조달의 현황을 파악하고 효과적인 조달정책을 수립ㆍ시행하기 위하여 국가기관, 지방자치단체 및 그 밖에 대통령령으로 정하는 기관(이하 이 조에서 \"국가기관등\"이라 한다)의 입찰ㆍ계약ㆍ대금지급 등(하도급에 관한 사항을 포함한다)에 관한 통계(이하 이 조에서 \"조달통계\"라 한다)를 작성하여야 한다.\n② 조달청장은 조달통계를 작성하기 위하여 필요한 자료를 국가기관등에 요구할 수 있다.\n③ 제2항에 따라 자료의 제출을 요구받은 국가기관등은 정당한 사유가 없으면 이에 따라야 한다.\n④ 조달청장은 조달통계의 집계를 위하여 국가기관등에 대통령령으로 정하는 재정 관련 정보시스템 및 자체전자조달시스템을 국가종합전자조달시스템(「전자조달의 이용 및 촉진에 관한 법률」 제2조제4호에 따른 국가종합전자조달시스템을 말한다. 이하 같다)에 연계할 것을 요구할 수 있으며, 국가기관등은 특별한 사유가 없으면 이에 협조하여야 한다.\n⑤ 제1항에 따른 통계작성의 대상ㆍ방법 및 절차에 관한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:10","kind":"조문","type":"법률","family":"psa","label":"제10조","title":"자료제공의 요청 등","text":"제10조(자료제공의 요청 등)\n① 조달청장은 다음 각 호의 경우에는 관계 행정기관의 장에게 대통령령으로 정하는 바에 따라 관련 자료의 제공을 요청할 수 있다. 이 경우 관계 행정기관의 장은 특별한 사유가 없으면 이에 협조하여야 한다.\n② 제1항에 따라 조달청장이 관계 행정기관의 장에게 제공을 요청할 수 있는 자료는 다음 각 호와 같다.\n③ 조달청장은 제1항 및 제2항에 따라 제공받은 자료를 처리할 때에는 「개인정보 보호법」에 따라 보호하여야 한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:11","kind":"조문","type":"법률","family":"psa","label":"제11조","title":null,"text":"제3장 계약체결의 요청 및 계약방법의 특례","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:12","kind":"조문","type":"법률","family":"psa","label":"제12조","title":"제3자를 위한 단가계약","text":"제12조(제3자를 위한 단가계약)\n① 조달청장은 수요기관이 필요로 하는 수요물자를 제조ㆍ구매 및 가공하는 등의 계약을 할 때 미리 단가만을 정하여 계약(이하 \"제3자를 위한 단가계약\"이라 한다)을 체결할 수 있다.\n② 조달청장은 계약상대자가 경영악화로 인한 폐업, 원자재 수급 곤란, 그 밖에 대통령령으로 정하는 사유로 계약기간 중 계약해지를 요청하는 때에는 다음 각 호의 어느 하나에 해당되는 경우를 제외하고는 이를 허용할 수 있다.\n③ 제3자를 위한 단가계약의 체결 및 해지 등에 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:13","kind":"조문","type":"법률","family":"psa","label":"제13조","title":"다수공급자계약","text":"제13조(다수공급자계약)\n① 조달청장은 수요기관이 필요로 하는 수요물자를 구매하기 위하여 품질ㆍ성능 또는 효율 등이 같거나 비슷한 종류의 수요물자를 수요기관이 선택할 수 있도록 2인 이상을 계약상대자로 하여 제12조에 따른 계약(이하 \"다수공급자계약\"이라 한다)을 체결할 수 있다.\n② 계약상대자는 다수공급자계약을 체결하는 경우 계약가격을 계약상품(성능ㆍ사양이 계약상품과 동등 이상인 계약상대자의 상품을 포함한다)의 시장거래가격(계약상대자가 수요기관과 직접 계약을 체결하는 경우의 가격 또는 계약상대자가 시장에 공급한 가격을 말한다)과 같거나 시장거래가격보다 낮게 유지하여야 한다.\n③ 조달청장은 계약상대자가 정당한 이유없이 제2항을 위반한 경우 계약금액과의 차액을 납품금액에서 감액하거나 계약상대자에게 청구할 수 있다.\n④ 다수공급자계약의 체결, 차액의 감액 및 청구 등에 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:14","kind":"조문","type":"법률","family":"psa","label":"제14조","title":"계약방법의 특례","text":"제14조(계약방법의 특례)\n① 조달청장은 각 수요기관에 필요한 조달물자를 구매ㆍ공급하기 위하여 필요한 경우에는 대통령령으로 정하는 계약방법으로 계약을 체결할 수 있다.\n② 조달청장은 「중소기업기본법」 제2조제2항에 따른 소기업과 「소상공인기본법」 제2조에 따른 소상공인의 수주기회를 확대하기 위하여 「중소기업제품 구매촉진 및 판로지원에 관한 법률」 제6조에 따른 중소기업자간 경쟁 제품 중 대통령령으로 정하는 규모 이상의 표준제품을 구매하는 경우에는 「중소기업기본법」 제2조에 따른 중소기업자로 구성된 공동수급체 간의 경쟁입찰에 따라 조달계약을 체결할 수 있다.\n③ 조달청장은 제2항에 따른 경쟁입찰과정에서 입찰자 간에 서로 상의하여 미리 입찰가격을 협정하였거나 특정인의 낙찰을 위하여 담합한 공동수급체에 대하여는 낙찰자 결정의 취소, 계약의 해제ㆍ해지 등의 필요한 조치를 하여야 한다. 다만, 낙찰자 결정의 취소, 계약의 해제ㆍ해지 등의 필요한 조치를 받는 자 외에는 적합한 시공자, 제조자가 존재하지 아니하는 등 대통령령으로 정하는 부득이한 경우에는 그러하지 아니하다.\n④ 조달청장은 제3항 본문에 따른 공동수급체의 구성원에 대하여는 「국가를 당사자로 하는 계약에 관한 법률」 제27조에 따라 입찰 참가자격을 제한하여야 한다.\n⑤ 제2항에 따른 표준제품의 범위와 공동수급체의 구성 등은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:15","kind":"조문","type":"법률","family":"psa","label":"제15조","title":null,"text":"제4장 대금 지급 등","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:16","kind":"조문","type":"법률","family":"psa","label":"제16조","title":"수수료","text":"제16조(수수료)\n① 조달청장은 조달사업과 관련된 수수료를 수요기관으로부터 받을 수 있다.\n② 제1항에 따른 수수료는 「정부기업예산법」 제3조제4호에 따른 조달특별회계(이하 \"조달특별회계\"라 한다)의 세입으로 한다.\n③ 조달청장은 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에 따른 수수료를 감경 또는 면제(이하 \"감면\"이라 한다)할 수 있다.\n④ 제1항에 따른 수수료의 결정ㆍ징수절차 및 제3항에 따른 수수료 감면에 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:17","kind":"조문","type":"법률","family":"psa","label":"제17조","title":"연체료","text":"제17조(연체료) 조달청장은 제15조제1항에 따라 대지급한 대금 및 제16조제1항에 따른 수수료를 기한까지 납부하지 아니한 수요기관의 장에게 대통령령으로 정하는 바에 따라 연체료를 부과할 수 있다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:18","kind":"조문","type":"법률","family":"psa","label":"제18조","title":null,"text":"제5장 조달물자 및 안전관리물자의 품질관리","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:19","kind":"조문","type":"법률","family":"psa","label":"제19조","title":"안전관리물자의 품질관리","text":"제19조(안전관리물자의 품질관리)\n① 조달청장은 국민의 안전을 위하여 안전관리물자에 대한 제18조제1항 각 호에 따른 품질관리업무를 하여야 한다.\n② 안전관리물자 품목의 선정, 폐지 및 변경에 필요한 사항은 관계 기관과 협의하여 조달청장이 작성ㆍ고시한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:20","kind":"조문","type":"법률","family":"psa","label":"제20조","title":"품질관리의 특례","text":"제20조(품질관리의 특례) 조달청장은 다음 각 호의 어느 하나에 해당하는 물품 또는 용역에 대하여 해당 기관의 장이 제18조제1항제2호에 따른 납품검사를 조달청장에게 요청하는 때에는 「국가를 당사자로 하는 계약에 관한 법률」 제14조, 「지방자치단체를 당사자로 하는 계약에 관한 법률」 제17조 및 「방위사업법」 제28조에도 불구하고 그 기관의 장을 대신하여 납품검사를 할 수 있다.\n1.\n1.  국가기관의 장(공공기관의 장을 포함한다)이 자체 조달한 물품 또는 용역\n2.\n2.  지방자치단체의 장이 자체 조달한 물품 또는 용역\n3.\n3.  방위사업청장이 자체 조달한 물품 또는 용역","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:21","kind":"조문","type":"법률","family":"psa","label":"제21조","title":null,"text":"제6장 조달사업의 공정성","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:22","kind":"조문","type":"법률","family":"psa","label":"제22조","title":"거래정지","text":"제22조(거래정지)\n① 조달청장은 제12조 및 제13조에 따른 계약을 체결한 계약상대자가 계약을 이행할 때 다음 각 호의 어느 하나에 해당하는 경우에는 해당 계약상대자, 세부 품명 또는 품목에 대하여 2년 이내의 범위에서 대통령령으로 정하는 바에 따라 거래를 정지할 수 있다.\n② 제1항에 따른 거래정지의 세부적인 대상과 기준 및 그 밖에 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:23","kind":"조문","type":"법률","family":"psa","label":"제23조","title":"포상금의 지급","text":"제23조(포상금의 지급)\n① 조달청장은 조달사업을 수행하는 공무원의 직무에 관한 뇌물수수(收受) 행위 또는 불공정 조달행위를 신고하거나 제보하고 그 신고나 제보를 증명할 수 있는 증거자료를 제출한 사람(이하 \"신고자등\"이라 한다)에게 예산의 범위에서 포상금을 지급할 수 있다.\n② 제1항에 따라 신고 또는 제보를 받은 사람은 신고자등의 신분 등에 관한 비밀을 유지하여야 한다.\n③ 제1항에 따른 포상금 지급 대상자의 범위, 포상금 지급의 기준 및 절차에 관한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:24","kind":"조문","type":"법률","family":"psa","label":"제24조","title":null,"text":"제7장 수요기관 및 조달기업의 지원","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:25","kind":"조문","type":"법률","family":"psa","label":"제25조","title":"조달기업의 지원","text":"제25조(조달기업의 지원) 조달청장은 대통령령으로 정하는 바에 따라 조달기업에 대하여 지원센터 및 온라인 상품몰 운영 등 조달시장 진출을 지원할 수 있다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:26","kind":"조문","type":"법률","family":"psa","label":"제26조","title":"우수조달물품등의 지정","text":"제26조(우수조달물품등의 지정)\n① 조달청장은 조달물자의 품질향상을 위하여 다음 각 호의 어느 하나에 해당하는 물품 또는 상표를 우수조달물품 또는 우수조달공동상표(이하 이 조에서 \"우수조달물품등\"이라 한다)로 지정하여 고시할 수 있다.\n② 조달청장은 대통령령으로 정하는 바에 따라 우수조달물품등의 구매 증대와 판로 확대를 위하여 필요한 조치를 할 수 있다.\n③ 조달청장은 제1항에 따라 지정된 우수조달물품등이 최초 지정기준에 미달하는 등 대통령령으로 정하는 경우에는 그 효력을 정지하거나 지정을 취소할 수 있다.\n④ 우수조달물품등의 지정 절차ㆍ기간, 효력정지 및 지정취소에 관한 구체적인 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:27","kind":"조문","type":"법률","family":"psa","label":"제27조","title":"혁신제품의 공공구매 지원","text":"제27조(혁신제품의 공공구매 지원)\n① 조달청장은 공공서비스 향상과 기술혁신을 위하여 공공성, 혁신성 등이 인정되는 제품으로서 제5조제1항제2호에 따라 위원회의 심의를 거쳐 지정된 제품(이하 \"혁신제품\"이라 한다)에 대하여 다음 각 호의 방법으로 공공구매를 지원할 수 있다.\n② 조달청장은 제1항에 따른 공공구매 지원방법 등에 대하여 재정경제부장관과 미리 협의하여야 하며, 이에 관하여 필요한 사항은 대통령령으로 정한다.\n③ 조달청장은 제1항에 따라 지정된 제품이 최초 지정기준에 미달하는 등 대통령령으로 정하는 경우에는 그 지정을 취소할 수 있다.\n④ 혁신제품을 구매한 수요기관의 구매 책임자는 고의나 중대한 과실이 입증되지 아니하면 그 제품의 구매로 생긴 손실에 대하여 책임을 지지 아니한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:27의2","kind":"조문","type":"법률","family":"psa","label":"제27조의2","title":"혁신제품 지원센터","text":"제27조의2(혁신제품 지원센터)\n① 조달청장은 제27조에 따른 혁신제품의 공공구매 지원을 위하여 혁신제품 지원센터(이하 \"지원센터\"라 한다)를 지정하여 다음 각 호의 업무 중 전부 또는 일부를 수행하게 할 수 있다.\n② 조달청장은 지원센터의 지정 등에 대하여 재정경제부장관과 미리 협의하여야 한다.\n③ 조달청장은 지원센터가 다음 각 호의 어느 하나에 해당하면 그 지정을 취소하거나 6개월 이내의 기간을 정하여 그 업무의 정지를 명할 수 있다. 다만, 제1호에 해당하면 그 지정을 취소하여야 한다.\n④ 조달청장은 제3항에 따라 지원센터의 지정을 취소하려면 청문을 하여야 한다.\n⑤ 조달청장은 지원센터가 그 업무의 수행에 드는 비용의 전부 또는 일부를 예산의 범위에서 지원할 수 있다.\n⑥ 지원센터의 지정 기준, 지정 및 지정 취소의 절차, 그 밖의 운영 등에 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:28","kind":"조문","type":"법률","family":"psa","label":"제28조","title":"국제조달 협력 및 해외 조달시장 진출 지원","text":"제28조(국제조달 협력 및 해외 조달시장 진출 지원)\n① 조달청장은 조달시장의 공정한 경쟁 환경 조성을 위하여 국내 관련 기관 및 각 국 조달기관과의 교류ㆍ협력을 확대하고, 국내기업의 해외 조달시장 진출을 지원할 수 있다.\n② 제1항에 따른 국내기업의 해외 조달시장 진출 지원 절차와 방법, 그 밖에 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:29","kind":"조문","type":"법률","family":"psa","label":"제29조","title":null,"text":"제8장 비축사업","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:30","kind":"조문","type":"법률","family":"psa","label":"제30조","title":"비축물자의 판매가격 결정","text":"제30조(비축물자의 판매가격 결정)\n① 비축물자의 판매가격은 구매원가(물품대금, 물류관리비 등 관리에 직접 드는 경비를 포함한다. 이하 같다), 해당 물자의 수급 및 가격의 동향 등을 고려하여 조달청장이 정한다.\n② 비축물자의 판매가격이 구매원가를 넘는 경우에는 그 초과분은 조달특별회계의 세입으로 한다.\n③ 조달청장은 수요기관 또는 민간업체에 비축물자를 인도하기 전에 판매대금을 납입하게 하여야 한다. 다만, 수요기관 또는 민간업체가 요청하는 경우로서 비축사업의 원활한 수행을 위하여 필요하다고 인정하는 때에는 비축물자를 인도한 후에 판매대금을 납입하게 할 수 있다.\n④ 비축물자를 구매하려는 자(조달청장과 제32조제2항에 따른 민간사업자는 제외한다)는 비축물자 구매 대금의 납부를 대행할 수 있도록 조달청장이 대통령령으로 정하는 바에 따라 지정한 기관(이하 이 조에서 \"비축물자대금 납부대행기관\"이라 한다)을 통하여 신용카드나 직불카드 등(이하 이 조에서 \"신용카드등\"이라 한다)으로 비축물자 구매 대금을 납부할 수 있다.\n⑤ 제4항에 따라 신용카드등으로 비축물자의 구매 대금을 납부하는 경우에는 비축물자대금 납부대행기관의 승인일을 구매 대금의 납부일로 본다.\n⑥ 비축물자대금 납부대행기관은 비축물자를 구매하려는 자로부터 구매 대금의 납부를 대행하는 대가로 수수료를 받을 수 있다.\n⑦ 비축물자대금 납부대행기관의 지정ㆍ운영과 납부대행 수수료 등에 관하여 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:31","kind":"조문","type":"법률","family":"psa","label":"제31조","title":"파생상품거래","text":"제31조(파생상품거래)\n① 조달청장은 비축물자의 가격 변동이나 수급 불안정에 따른 위험을 피하기 위하여 필요하면 「자본시장과 금융투자업에 관한 법률」 제5조제1항제1호 및 제2호에 따른 파생상품을 거래할 수 있다.\n② 제1항에 따른 파생상품거래의 내용과 범위, 그 밖에 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:32","kind":"조문","type":"법률","family":"psa","label":"제32조","title":"민관 공동 비축사업","text":"제32조(민관 공동 비축사업)\n① 조달청장은 비축사업을 활성화하기 위하여 필요한 경우 민간과 협력하여 민관 공동 비축사업을 할 수 있다.\n② 조달청장은 제1항에 따라 민관 공동 비축사업에 참여하는 민간사업자가 비축하는 물자에 대하여 필요한 지원을 할 수 있으며, 「국유재산법」 제32조 및 제34조에도 불구하고 비축물자의 특성, 물량, 비축기간 등이 대통령령으로 정하는 기준에 해당하는 경우에는 비축시설의 사용료를 감면할 수 있다.\n③ 조달청장은 제2항에 따라 지원을 받거나 사용료를 감면받은 민간사업자에 대하여 해당 사업자가 비축하는 물자를 조달청에 우선적으로 매각하도록 요청할 수 있으며, 정당한 사유 없이 그 요청을 따르지 아니하는 경우에는 제2항에 따라 감면받은 사용료를 환수하는 등 대통령령으로 정하는 제재조치를 할 수 있다.\n④ 제1항에 따른 민관 공동 비축사업의 참여대상, 방법 및 그 밖에 필요한 사항은 대통령령으로 정한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:32의2","kind":"조문","type":"법률","family":"psa","label":"제32조의2","title":null,"text":"제9장 조달기업공제조합","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:32의3","kind":"조문","type":"법률","family":"psa","label":"제32조의3","title":"공제조합의 사업 등","text":"제32조의3(공제조합의 사업 등)\n① 공제조합은 조달사업과 관련된 다음 각 호의 사업을 한다.\n② 공제조합이 제1항제1호에 따른 보증사업 및 같은 항 제3호ㆍ제4호에 따른 공제사업을 하려면 다음 각 호의 사항을 포함하는 보증 및 공제에 관한 규정을 정하여 조달청장의 승인을 얻어야 한다. 승인받은 사항을 변경하는 경우에도 또한 같다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:32의4","kind":"조문","type":"법률","family":"psa","label":"제32조의4","title":"보고ㆍ조사 등","text":"제32조의4(보고ㆍ조사 등)\n① 조달청장은 공제조합의 재무건전성 유지 등을 위하여 필요하다고 판단될 때에는 공제조합에 대하여 그 업무에 관한 사항을 보고하게 하거나 자료의 제출을 요구할 수 있으며, 소속 공무원으로 하여금 공제조합의 업무 또는 회계 상황을 조사하게 하거나 장부 또는 그 밖의 서류를 검사하게 할 수 있다. 이 경우 조사 또는 검사를 하는 공무원은 그 권한을 표시하는 증표를 지니고 이를 관계인에게 보여주어야 한다.\n② 조달청장은 제32조의3제1항제1호에 따른 보증사업의 건전한 육성과 계약자 보호를 위하여 보증사업의 감독에 필요한 기준을 정하여 고시하여야 한다.\n③ 제32조의3제1항제3호 및 제4호에 따른 공제사업에 대해서는 대통령령으로 정하는 바에 따라 금융위원회가 제1항에 따른 조사 또는 검사를 할 수 있다.\n④ 조달청장은 제32조의3제1항제3호 및 제4호에 따른 공제사업의 건전한 육성과 계약자의 보호를 위하여 금융위원회 위원장과 협의하여 감독에 필요한 기준을 정한 후 고시하여야 한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:32의5","kind":"조문","type":"법률","family":"psa","label":"제32조의5","title":"다른 법률의 준용","text":"제32조의5(다른 법률의 준용) 공제조합과 관련하여 이 법에서 정하지 아니한 사항에 대하여는 「민법」 중 사단법인에 관한 규정 및 「상법」 중 주식회사의 회계에 관한 규정을 준용한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:33","kind":"조문","type":"법률","family":"psa","label":"제33조","title":null,"text":"제10장 보칙","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:34","kind":"조문","type":"법률","family":"psa","label":"제34조","title":"벌칙 적용에서 공무원 의제","text":"제34조(벌칙 적용에서 공무원 의제) 다음 각 호의 어느 하나에 해당하는 사람은 「형법」 제129조부터 제132조까지의 규정을 적용할 때에는 공무원으로 본다.\n1.\n1.  제5조에 따른 위원회, 분과위원회 및 실무위원회의 위원 중 공무원이 아닌 위원\n2.\n2.  제33조에 따라 위탁받은 업무에 종사하는 수탁기관의 임직원","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa:35","kind":"조문","type":"법률","family":"psa","label":"제35조","title":"과태료","text":"제35조(과태료)\n① 다음 각 호의 어느 하나에 해당하는 자에게는 300만원 이하의 과태료를 부과한다.\n② 제1항에 따른 과태료는 대통령령으로 정하는 바에 따라 조달청장이 부과ㆍ징수한다.","lawId":"psa","group":"조달사업법","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"law:psa-e","kind":"법령","type":"시행령","family":"psa","label":"조달사업법 시행령","name":"조달사업에 관한 법률 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:1","kind":"조문","type":"시행령","family":"psa","label":"제1조","title":null,"text":"제1장 총칙","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:2","kind":"조문","type":"시행령","family":"psa","label":"제2조","title":"수요물자의 범위","text":"제2조(수요물자의 범위) 「조달사업에 관한 법률」(이하 \"법\"이라 한다) 제2조제2호에서 \"대통령령으로 정하는 물자\"란 조달청장이 국내 및 국외에서 구매ㆍ공급[임차(賃借) 또는 대여의 경우를 포함한다]하는 물품 및 용역을 말한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:3","kind":"조문","type":"시행령","family":"psa","label":"제3조","title":"비축물자의 범위","text":"제3조(비축물자의 범위) 법 제2조제3호에서 \"대통령령으로 정하는 물자\"란 다음 각 호의 어느 하나에 해당하는 물자로서 재정경제부장관이 관계 중앙행정기관의 장과 협의하여 고시하는 물자를 말한다.\n1.\n1.  해외 의존도가 높은 물자\n2.\n2.  국민생활 안정에 매우 중요한 물자\n3.\n3.  「방위사업법」 제3조제7호에 따른 방위산업물자의 안정적 생산을 위해 필요한 물자\n4.\n4.  그 밖에 물가안정과 수급조절, 재난ㆍ국가위기 등 비상시 대비를 위해 긴급히 대처할 필요가 있는 물자","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:4","kind":"조문","type":"시행령","family":"psa","label":"제4조","title":"수요기관의 범위","text":"제4조(수요기관의 범위)\n① 법 제2조제5호다목에서 \"대통령령으로 정하는 기관\"이란 다음 각 호의 기관을 말한다.\n② 조달청장은 제1항제3호에 따른 수요기관의 지정에 필요한 사항을 정하여 고시해야 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:5","kind":"조문","type":"시행령","family":"psa","label":"제5조","title":null,"text":"제2장 공공조달 정책 기반","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:6","kind":"조문","type":"시행령","family":"psa","label":"제6조","title":"위원의 제척ㆍ기피ㆍ회피 등","text":"제6조(위원의 제척ㆍ기피ㆍ회피 등)\n① 위원회(분과위원회 및 실무위원회를 포함한다. 이하 이 조에서 같다)의 위원(이하 이 조에서 \"위원\"이라 한다)이 다음 각 호의 어느 하나에 해당하는 경우에는 위원회의 심의ㆍ의결에서 제척(除斥)된다.\n② 해당 안건의 당사자는 위원에게 공정한 심의ㆍ의결을 기대하기 어려운 사정이 있는 경우에는 위원회에 기피 신청을 할 수 있고, 위원회는 의결로 기피 여부를 결정한다. 이 경우 기피 신청의 대상인 위원은 그 의결에 참여하지 못한다.\n③ 위원이 제1항 각 호에 따른 제척 사유에 해당하는 경우에는 스스로 해당 안건의 심의ㆍ의결에서 회피(回避)해야 한다.\n④ 재정경제부장관은 위원회의 공무원이 아닌 위촉위원이 다음 각 호의 어느 하나에 해당하는 경우 해당 위원을 해촉(解囑)할 수 있다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:7","kind":"조문","type":"시행령","family":"psa","label":"제7조","title":"분과위원회","text":"제7조(분과위원회)\n① 법 제5조제4항 전단에 따라 위원회에 분야별 분과위원회로 공공수요발굴위원회, 공공조달제도개선위원회 및 공공조달성과위원회를 둔다.\n② 제1항에 따른 분야별 분과위원회(이하 \"분과위원회\"라 한다)는 다음 각 호의 구분에 따른 사항을 심의한다.\n③ 각 분과위원회는 위원장 1명을 포함하여 15명 이내로 구성하며, 분과위원회의 위원장과 위원은 위원회의 위원장이 위원회 위원 중에서 임명 또는 위촉한다. 이 경우 위원회의 위원장은 관계 중앙행정기관 소속 공무원을 각 분과위원회 위원으로 중복하여 임명할 수 있다.\n④ 제5조제1항제7호에 따른 위원인 경우에는 제3항 전단에 따른 분과위원회 위원 수 산정에 포함하지 않는다.\n⑤ 분과위원회의 위원장은 분과위원회를 대표하고, 분과위원회의 업무를 총괄한다.\n⑥ 분과위원회의 운영에 관하여는 제5조제4항부터 제9항까지의 규정을 준용한다. 이 경우 \"위원회\"는 \"분과위원회\"로, \"위원장\"은 \"분과위원회 위원장\"으로 본다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 분과위원회의 구성 및 운영에 필요한 사항은 위원회의 의결을 거쳐 위원회 위원장이 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:8","kind":"조문","type":"시행령","family":"psa","label":"제8조","title":"실무위원회","text":"제8조(실무위원회)\n① 법 제5조제5항에 따라 위원회 및 분과위원회의 심의 안건을 미리 검토하고, 위원회 및 분과위원회로부터 위임받은 사항 등을 처리하기 위해 위원회 및 분과위원회에 실무위원회를 둘 수 있다.\n② 실무위원회의 위원장은 재정경제부 소속 고위공무원 중 위원회 위원장이 지명하는 사람이 된다.\n③ 실무위원회의 위원은 관계 행정기관의 공무원 및 민간전문가 중에서 실무위원회 위원장이 임명 또는 위촉한다.\n④ 실무위원회는 심의를 위해 필요한 경우 안건과 관련된 관계 행정기관, 공공단체나 그 밖의 기관ㆍ단체의 장, 관계자 또는 민간전문가를 참석하게 하여 의견을 들을 수 있다.\n⑤ 실무위원회 회의에 출석한 위원, 관계자 또는 전문가에게는 예산의 범위에서 수당과 여비를 지급할 수 있다. 다만, 공무원이 그 소관 업무와 직접 관련되어 출석하는 경우에는 수당과 여비를 지급하지 않는다.\n⑥ 제1항부터 제5항까지에서 규정한 사항 외에 실무위원회의 구성 및 운영에 필요한 사항은 위원회 위원장이 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:9","kind":"조문","type":"시행령","family":"psa","label":"제9조","title":"조달통계의 작성","text":"제9조(조달통계의 작성)\n① 법 제9조제1항에서 \"대통령령으로 정하는 기관\"이란 다음 각 호의 기관을 말한다.\n② 조달청장은 법 제9조제1항에 따라 국가기관, 지방자치단체 및 제1항 각 호의 기관(이하 이 조에서 \"국가기관등\"이라 한다)의 입찰ㆍ계약ㆍ대금지급 등(하도급에 관한 사항을 포함한다)과 관련된 다음 각 호의 사항을 매월 통계로 작성해야 한다.\n③ 조달청장은 법 제9조제2항에 따라 국가기관등에 다음 각 호의 자료(하도급에 관한 사항을 포함한다)를 요구할 수 있다.\n④ 조달청장은 법 제9조제2항에 따라 자료의 제출을 요구받은 국가기관등을 위해 표준화된 자료작성 기준 및 서식 등을 정하여 고시해야 한다.\n⑤ 법 제9조제2항에 따라 자료의 제출을 요구받은 국가기관등은 그 요구를 받은 날이 속하는 달의 다음 달 말일까지 제3항에 따른 자료를 조달청장이 지정하는 정보처리장치를 이용하여 작성ㆍ제출해야 한다.\n⑥ 법 제9조제4항에서 \"대통령령으로 정하는 재정 관련 정보시스템 및 자체전자조달시스템\"이란 다음 각 호의 시스템을 말한다.\n⑦ 제1항부터 제6항까지에서 규정한 사항 외에 법 제9조에 따른 통계작성의 대상ㆍ방법 및 절차에 관하여 필요한 사항은 조달청장이 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:10","kind":"조문","type":"시행령","family":"psa","label":"제10조","title":"자료제공의 요청","text":"제10조(자료제공의 요청)\n① 조달청장은 법 제10조제1항 전단 및 같은 조 제2항제1호에 따라 관세청장에게 「관세법 시행령」 제246조제2항에 따른 수출ㆍ수입 또는 반송 신고서의 제공을 요청할 수 있다.\n② 조달청장은 법 제10조제1항 전단 및 같은 조 제2항제2호에 따라 국세청장에게 「부가가치세법」 제32조제2항에 따른 전자세금계산서 및 같은 조 제7항에 따른 수정전자세금계산서의 제공을 요청할 수 있다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:11","kind":"조문","type":"시행령","family":"psa","label":"제11조","title":null,"text":"제3장 계약체결의 요청 및 계약방법의 특례","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:12","kind":"조문","type":"시행령","family":"psa","label":"제12조","title":"제3자를 위한 단가계약","text":"제12조(제3자를 위한 단가계약)\n① 법 제12조제1항에 따른 제3자를 위한 단가계약(이하 \"제3자를 위한 단가계약\"이라 한다)의 계약상대자가 되려는 자는 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제12조에 따른 경쟁입찰의 참가자격을 갖추어야 한다. 다만, 「중소기업제품 구매촉진 및 판로지원에 관한 법률」 제6조에 따른 중소기업자간 경쟁 제품에 대한 제3자를 위한 단가계약의 계약상대자가 되려는 자는 같은 법 시행령 제9조에서 정한 중소기업자간 경쟁입찰의 참여자격을 갖추어야 한다.\n② 법 제12조제2항 각 호 외의 부분에서 \"대통령령으로 정하는 사유\"란 다음 각 호의 경우에 해당하는 사유를 말한다.\n③ 법 제12조제2항제3호에서 \"계약조건 등의 위반 사실이 있는 등 대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n④ 조달청장은 제3자를 위한 단가계약을 체결한 경우 그 내용을 수요기관에 통보해야 한다. 다만, 「전자조달의 이용 및 촉진에 관한 법률」 제2조제4호에 따른 국가종합전자조달시스템(이하 \"국가종합전자조달시스템\"이라 한다)에 계약상품을 등록하는 경우에는 통보하지 않을 수 있다.\n⑤ 수요기관의 장은 제3자를 위한 단가계약이 체결된 물품의 납품을 요구하거나 대금의 지급 등을 한 경우 그 내용을 조달청장에게 통보해야 한다.\n⑥ 제1항부터 제5항까지에서 규정한 사항 외에 제3자를 위한 단가계약의 절차에 관하여 필요한 사항은 조달청장이 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:13","kind":"조문","type":"시행령","family":"psa","label":"제13조","title":"다수공급자계약","text":"제13조(다수공급자계약)\n① 조달청장은 법 제13조에 따른 다수공급자계약(이하 \"다수공급자계약\"이라 한다)의 입찰에 참가한 입찰자의 재무 상태 및 납품 실적 등의 평가를 통해 재정경제부장관과 협의하여 정한 기준에 적합한 자를 선정하고, 선정된 자를 대상으로 한 가격협상을 통해 낙찰자로 결정된 2인 이상을 계약상대자로 정한다.\n② 제1항에도 불구하고 계약의 특성에 따라 필요한 경우 수요물자별로 작성(공통규격의 경우에는 1개만 작성)된 예정가격에 대한 입찰금액의 비율이 낮은 입찰자의 순서로 낙찰자를 결정하여 2인 이상의 계약상대자를 정할 수 있다.\n③ 수요기관의 장은 다수공급자계약을 체결한 계약상대자로부터 조달청장이 정하여 고시하는 금액 이상의 수요물자를 구매하려는 경우 조달청장이 재정경제부장관과 협의하여 정하는 기준에 따라 둘 이상의 계약상대자로 하여금 제안서를 제출하도록 하고, 그 제안서의 심사 결과에 따라 해당 수요물자를 납품할 자를 선택해야 한다.\n④ 조달청장은 법 제13조제3항에 따라 계약금액과의 차액을 납품금액에서 감액하거나 청구하려는 경우 그 사유와 차액 및 의견제출 기한 등을 미리 서면으로 계약상대자에게 통지해야 하고, 차액의 감액 또는 청구가 확정된 경우에는 그 내용을 서면으로 통지해야 한다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 다수공급자계약의 체결 등에 관하여 필요한 사항은 조달청장이 재정경제부장관과 협의하여 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:13의2","kind":"조문","type":"시행령","family":"psa","label":"제13조의2","title":"제3자를 위한 단가계약 등의 계약보증금","text":"제13조의2(제3자를 위한 단가계약 등의 계약보증금) 조달청장은 제3자를 위한 단가계약 또는 다수공급자계약을 체결하는 경우로서 여러 차례 분할하여 계약을 이행하게 하는 때에는 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제50조제2항에도 불구하고 다음의 계산식에 따라 산출한 금액의 100분의 10 이상을 계약보증금으로 납부하게 할 수 있다.  ,,  ┌──────────────────────────────────────────┐,│A × B × C                                                                         │,│A: 매회별 이행예정량 중 최대량                                                      │,│B: 계약단가                                                                         │,│C: 수요물자의 납품이행실적을 고려하여 조달청장이 재정경제부장관과 협의하여 정한 후  │,│고시하는 비율                                                                       │,└──────────────────────────────────────────┘,","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:14","kind":"조문","type":"시행령","family":"psa","label":"제14조","title":"계약방법의 특례","text":"제14조(계약방법의 특례) 법 제14조제1항에서 \"대통령령으로 정하는 계약방법\"이란 다음 각 호의 계약방법을 말한다.\n1.\n1.  제16조에 따른 카탈로그 계약\n2.\n2.  제35조에 따른 비축물자에 대한 계약","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:15","kind":"조문","type":"시행령","family":"psa","label":"제15조","title":"입찰참가자격의 사전심사","text":"제15조(입찰참가자격의 사전심사)\n① 조달청장은 법 제14조제1항에 따라 조달물자를 구매할 때 품질 확보를 위해 필요한 경우 입찰자격을 미리 심사하여 경쟁입찰에 참가할 수 있는 적격자를 선정할 수 있다.\n② 조달청장은 제1항에 따라 입찰참가자의 자격을 심사하려는 경우 미리 해당 입찰참가자격의 심사기준을 정하여 입찰 전에 입찰참가자가 열람할 수 있도록 해야 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:16","kind":"조문","type":"시행령","family":"psa","label":"제16조","title":"카탈로그 계약","text":"제16조(카탈로그 계약)\n① 조달청장은 각 수요기관의 다양한 필요를 반영하기 위해 법 제14조제1항에 따라 상품의 기능이나 특징ㆍ조건ㆍ가격 등을 설명한 카탈로그를 제시하는 계약상대자와 공급계약(이하 \"카탈로그 계약\"이라 한다)을 체결할 수 있다.\n② 조달청장은 카탈로그 계약을 체결하려는 경우 카탈로그를 제시한 자의 재무 상태, 납품 실적 및 카탈로그 내용의 적정성 등을 심사하여 2인 이상의 계약상대자를 결정한다.\n③ 조달청장은 제2항에도 불구하고 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제26조제1항제5호아목에 따른 수요물자의 경우에는 심사를 통해 1인을 계약상대자로 결정할 수 있다.\n④ 수요기관의 장은 카탈로그 계약을 체결한 계약상대자에게 제안서를 제출하도록 하고, 그 제안서의 평가 및 협상 결과에 따라 수요물자를 납품할 자를 결정한다.\n⑤ 제1항부터 제4항까지에서 규정한 사항 외에 카탈로그 계약 및 납품대상자 선정 절차 등에 관하여 필요한 사항은 조달청장이 재정경제부장관과 협의하여 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:17","kind":"조문","type":"시행령","family":"psa","label":"제17조","title":"중소기업자간 경쟁 제품에 대한 계약의 특례","text":"제17조(중소기업자간 경쟁 제품에 대한 계약의 특례)\n① 법 제14조제2항에서 \"대통령령으로 정하는 규모 이상\"이란 표준제품의 구매금액이 추정가격 기준으로 20억원 이상으로서 조달청장이 제품별로 단가 등을 고려하여 정하는 기준 금액 이상인 경우를 말한다.\n② 법 제14조제2항에 따라 중소기업자로 구성된 공동수급체 간의 경쟁입찰(이하 이 조에서 \"공동수급체간 경쟁입찰\"이라 한다)을 통해 조달계약을 체결할 수 있는 표준제품은 다음 각 호의 요건을 모두 갖춘 제품으로서 조달청장이 재정경제부장관과 협의하여 지정ㆍ고시하는 제품(이하 이 조에서 \"표준제품\"이라 한다)으로 한다.\n③ 제2항에 따른 지정의 유효기간은 지정ㆍ고시한 날부터 2년으로 한다.\n④ 조달청장은 제2항에 따라 지정받은 표준제품이 다음 각 호의 어느 하나에 해당하는 경우에는 그 지정을 취소해야 한다.\n⑤ 법 제14조제2항에 따라 공동수급체간 경쟁입찰에 참여하려는 공동수급체는 다음 각 호의 요건을 모두 갖추어야 한다.\n⑥ 제5항에도 불구하고 「중소기업제품 구매촉진 및 판로지원에 관한 법률 시행령」 제9조제2항에 따라 중소기업자간 경쟁입찰의 참여자격을 갖춘 조합이 공동수급체간 경쟁입찰에 참여하려는 경우에는 계약을 이행할 조합원만을 구성원으로 보아 해당 조합이 제5항 각 호의 요건을 모두 갖추었는지 여부를 판단한다.\n⑦ 조달청장은 공동수급체간 경쟁입찰에서 적정한 품질 확보와 납품 가격의 안정을 위해 재정경제부장관과 협의하여 정한 심사기준에 따라 공동수급체의 계약 이행능력을 심사하여 계약상대자를 결정해야 한다. 다만, 구매의 효율성 등을 위해 필요한 경우에는 다음 각 호에서 정하는 방법에 따라 계약상대자를 결정할 수 있다.\n⑧ 법 제14조제3항 단서에서 \"낙찰자 결정의 취소, 계약의 해제ㆍ해지 등의 필요한 조치를 받는 자 외에는 적합한 시공자, 제조자가 존재하지 아니하는 등 대통령령으로 정하는 부득이한 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n⑨ 제1항부터 제8항까지에서 규정한 사항 외에 표준제품의 지정, 공동수급체의 구성, 계약상대자의 결정 등에 필요한 사항은 조달청장이 재정경제부장관과의 협의를 거쳐 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:18","kind":"조문","type":"시행령","family":"psa","label":"제18조","title":null,"text":"제4장 대금 지급 등","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:19","kind":"조문","type":"시행령","family":"psa","label":"제19조","title":"대금 및 수수료의 납입시기 등","text":"제19조(대금 및 수수료의 납입시기 등)\n① 수요기관의 장이 법 제15조제3항에 따라 조달청장에게 미리 대금을 지급(이하 이 조에서 \"선급\"이라 한다)하려는 경우에는 수요물자의 구매 또는 공급을 조달청장에게 요청할 때 그 선급 의사를 조달청장에게 함께 통보해야 한다.\n② 조달청장은 다음 각 호의 어느 하나에 해당하는 대금 또는 법 제16조제1항에 따른 수수료(이하 이 장에서 \"수수료\"라 한다)를 수요기관으로부터 징수하려는 경우 수요기관의 장에게 미리 납입고지를 해야 한다.\n③ 수요기관의 장은 제2항에 따라 조달청장이 납입고지를 한 날부터 다음 각 호의 구분에 따른 기간 내에 대금 또는 수수료를 내야 한다. 이 경우 제1호에 따른 기간을 계산할 때 공휴일과 토요일은 제외한다.\n④ 조달청장은 수요기관이 자금 사정 등으로 제3항제1호 또는 제3호에 따른 대지급 대금 또는 수수료의 납입기간 연장을 요청한 경우 그 기간을 연장할 수 있다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:20","kind":"조문","type":"시행령","family":"psa","label":"제20조","title":"수수료 결정 및 감면 등","text":"제20조(수수료 결정 및 감면 등)\n① 수수료는 조달사업별로 계약금액 등을 고려하여 조달청장이 재정경제부장관과 협의하여 정한 후 고시한다.\n② 법 제16조제3항제3호에서 \"대통령령으로 정하는 경우\"란 조달청장이 중소기업제품 구매촉진, 기술개발ㆍ향상 또는 조달사업 확대 등을 위해 수수료의 감면이 필요하다고 인정하는 경우를 말한다.\n③ 수수료를 감면할 경우 그 감경률(수수료에서 감면하려는 액수가 차지하는 비중을 말한다)은 100분의 20을 초과할 수 없다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:21","kind":"조문","type":"시행령","family":"psa","label":"제21조","title":"연체료","text":"제21조(연체료) 법 제17조에 따른 연체료는 연체금액에 1천분의 10을 넘지 않는 범위에서 재정경제부령으로 정한 연체료율을 곱한 금액으로 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:22","kind":"조문","type":"시행령","family":"psa","label":"제22조","title":"보증금 및 지체상금의 처리","text":"제22조(보증금 및 지체상금의 처리) 조달물자 및 시설공사의 계약과 관련한 위약금으로서 국고에 귀속되는 입찰보증금, 계약보증금 및 지체상금(遲滯償金)은 해당 수요기관의 수입으로 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:23","kind":"조문","type":"시행령","family":"psa","label":"제23조","title":null,"text":"제5장 조달물자 및 안전관리물자의 품질관리","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:24","kind":"조문","type":"시행령","family":"psa","label":"제24조","title":null,"text":"제6장 조달사업의 공정성","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:25","kind":"조문","type":"시행령","family":"psa","label":"제25조","title":"거래정지","text":"제25조(거래정지)\n① 법 제22조제1항제4호의 \"대통령령으로 정하는 행위를 한 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n② 조달청장은 위반행위의 내용ㆍ정도, 그 결과와 위반행위의 횟수 등을 고려하여 법 제22조제1항에 따른 거래정지의 대상 및 기간을 정한다.\n③ 조달청장은 법 제22조제1항에 따른 거래정지를 하려는 경우 사유별 대상, 기간 및 의견제출 기한 등을 미리 계약상대자에게 통지해야 하며, 거래정지가 확정된 경우에는 그 내용을 서면으로 통지해야 한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 거래정지의 세부 사유별 대상과 기간, 거래정지 절차 및 기준, 그 밖에 거래정지에 필요한 세부적인 사항은 조달청장이 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:26","kind":"조문","type":"시행령","family":"psa","label":"제26조","title":"포상금 지급 대상자의 범위 등","text":"제26조(포상금 지급 대상자의 범위 등)\n① 법 제23조제1항에 따른 포상금 지급 대상자는 다음 각 호의 요건을 모두 갖춘 자(이하 \"신고자등\"이라 한다)로 한다.\n② 포상금 지급금액은 뇌물수수행위 또는 불공정 조달행위의 규모, 조달사업에 미치는 영향, 예산 등을 고려하여 조달청장이 정하되, 포상금의 지급한도는 2천만원으로 한다.\n③ 포상금은 신고자등의 비밀을 보장하기 위해 현금으로 지급하는 것을 원칙으로 한다.\n④ 포상금의 지급대상 및 지급액은 뇌물수수행위 또는 불공정 조달행위에 대한 조사가 끝난 후 결정하며, 포상금의 신청절차, 지급시기 또는 그 밖에 필요한 사항은 조달청장이 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:27","kind":"조문","type":"시행령","family":"psa","label":"제27조","title":null,"text":"제7장 수요기관 및 조달기업의 지원","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:28","kind":"조문","type":"시행령","family":"psa","label":"제28조","title":"지방자치단체 공사원가의 사전검토","text":"제28조(지방자치단체 공사원가의 사전검토)\n① 지방자치단체의 장은 제27조제2호마목에도 불구하고 「지방자치단체를 당사자로 하는 계약에 관한 법률 시행령」 제2조제1호에 따른 추정가격이 100억원 이상인 공사에 대해서는 조달청장에게 공사원가의 사전검토를 요청해야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 요청하지 않을 수 있다.\n② 조달청장은 제1항에 따라 공사원가의 사전검토를 요청받은 경우 특별한 사유가 없으면 접수한 날부터 10일 이내에 그 결과를 해당 지방자치단체의 장에게 통보해야 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:29","kind":"조문","type":"시행령","family":"psa","label":"제29조","title":"조달기업의 지원","text":"제29조(조달기업의 지원)\n① 법 제25조에 따라 조달청장은 다음 각 호의 방법으로 조달기업의 조달시장 진출을 지원할 수 있다.\n② 조달청장은 제1항에 따른 지원 업무를 수행할 때 필요한 예산을 확보하기 위해 노력해야 한다.\n③ 제1항에 따른 지원센터 설치ㆍ운영과 온라인 상품몰 등록대상 상품의 지정 기준, 절차 등에 관하여 필요한 사항은 조달청장이 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:30","kind":"조문","type":"시행령","family":"psa","label":"제30조","title":"우수조달물품의 지정","text":"제30조(우수조달물품의 지정)\n① 법 제26조제1항제1호 각 목 외의 부분에서 \"대통령령으로 정하는 기준을 충족하는 물품\"이란 다음 각 호의 요건을 모두 갖춘 물품을 말한다. 다만, 음료품류ㆍ식료품류 및 동물류ㆍ식물류나 무기ㆍ총포ㆍ화약류 등으로서 조달청장이 우수조달물품으로 지정하는 것이 적합하지 않다고 인정하여 고시하는 물품은 제외한다.\n② 법 제26조제1항제1호나목에서 \"매출액 규모, 중견기업이 된 이후의 기간 등 대통령령으로 정하는 기준을 충족하는 기업\"이란 「중견기업 성장촉진 및 경쟁력 강화에 관한 특별법」 제2조에 따른 중견기업(이하 \"중견기업\"이라 한다)으로서 다음 각 호의 구분에 따른 기업을 말한다.\n③ 법 제26조제1항에 따라 우수조달물품의 지정을 받으려는 자는 제1항 각 호에 관한 사항을 적은 지정신청서를 조달청장에게 제출해야 한다.\n④ 조달청장은 제3항에 따라 신청서를 제출받은 경우 해당 물품이 제1항에 따른 지정기준을 충족하는지를 심사하여 신청서 접수 마감일부터 90일 이내에 그 지정 여부를 결정해야 한다. 다만, 조달청장은 90일 이내에 지정 여부를 결정하기 어려운 사유가 있는 경우 결정기간을 연장할 수 있으며, 그 연장 사유와 결정 예정일 등을 신청인에게 알려야 한다.\n⑤ 조달청장은 제4항에 따라 지정 여부를 결정했을 때에는 그 결과를 신청인에게 문서로 통보하고, 우수조달물품으로 지정된 물품을 국가종합전자조달시스템에 등록해야 한다.\n⑥ 우수조달물품의 지정기간은 법 제26조제1항에 따라 고시한 날부터 3년으로 한다. 다만, 조달청장이 우수조달물품의 판매 실적, 계약이행 내용 및 향후 수요 예측 등의 심사를 거쳐 지정기간을 연장할 필요가 있다고 인정하는 경우에는 3년의 범위에서 그 지정기간을 연장할 수 있다.\n⑦ 조달청장은 법 제26조제2항에 따라 우수조달물품의 구매 증대 및 판로 확대를 위해 국내외 홍보, 수출 지원 및 수요기관을 위한 계약체결 등의 조치를 할 수 있다.\n⑧ 제1항부터 제7항까지에서 규정한 사항 외에 우수조달물품의 지정기준, 지정절차 및 지정기간 연장 등에 관하여 필요한 사항은 조달청장이 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:31","kind":"조문","type":"시행령","family":"psa","label":"제31조","title":"우수조달공동상표의 지정","text":"제31조(우수조달공동상표의 지정)\n① 법 제26조제1항제2호에서 \"대통령령으로 정하는 수\"란 5를 말한다.\n② 법 제26조제1항제2호에서 \"대통령령으로 정하는 기준\"이란 다음 각 호의 요건을 모두 충족하는 경우를 말한다.\n③ 법 제26조제1항에 따라 우수조달공동상표의 지정을 받으려는 자는 제2항 각 호에 관한 사항을 적은 지정신청서를 조달청장에게 제출해야 한다.\n④ 조달청장은 제3항에 따라 신청서를 제출받은 경우 해당 공동상표가 제1항 및 제2항에 따른 지정기준을 충족하는지를 심사하여 신청서 접수 마감일부터 90일 이내에 그 지정 여부를 결정해야 한다. 다만, 조달청장은 90일 이내에 지정 여부를 결정하기 어려운 사유가 있는 경우에는 결정기간을 연장할 수 있으며, 그 연장 사유와 결정 예정일 등을 신청인에게 알려야 한다.\n⑤ 조달청장은 제4항에 따라 지정 여부를 결정했을 때에는 그 결과를 신청인에게 문서로 통보하고, 우수조달공동상표로 지정된 공동상표를 국가종합전자조달시스템에 등록해야 한다.\n⑥ 우수조달공동상표의 지정기간은 법 제26조제1항에 따라 고시한 날부터 3년으로 한다. 다만, 조달청장이 우수조달공동상표 물품의 판매 실적, 계약이행 내용 및 향후 수요 예측 등의 심사를 거쳐 지정기간을 연장할 필요가 있다고 인정하는 경우에는 그 지정기간을 3년의 범위에서 한 번만 연장할 수 있다.\n⑦ 조달청장은 법 제26조제2항에 따라 우수조달공동상표 물품의 구매 증대 및 판로 확대를 위하여 국내외 홍보, 수출 지원 및 수요기관을 위한 계약체결 등의 조치를 할 수 있다.\n⑧ 제1항부터 제7항까지에서 규정한 사항 외에 우수조달공동상표의 지정기준, 지정절차 및 지정기간 연장 등에 관하여 필요한 사항은 조달청장이 재정경제부장관과의 협의를 거쳐 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:32","kind":"조문","type":"시행령","family":"psa","label":"제32조","title":"우수조달물품 등의 효력정지 또는 지정취소","text":"제32조(우수조달물품 등의 효력정지 또는 지정취소)\n① 법 제26조제3항에서 \"최초 지정기준에 미달하는 등 대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n② 조달청장은 우수조달물품등의 효력정지 또는 지정취소를 하는 경우 그 사유, 기간(효력정지의 기간을 말한다) 및 의견제출 기한 등을 지정을 받은 자에게 미리 문서로 통지해야 하며, 효력정지 또는 지정취소가 확정된 경우에는 그 내용을 문서로 통지해야 한다.\n③ 제1항 및 제2항에서 규정한 사항 외에 효력정지 및 지정취소에 관한 절차ㆍ기준 등에 관하여 필요한 사항은 조달청장이 재정경제부장관과 협의를 거쳐 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:33","kind":"조문","type":"시행령","family":"psa","label":"제33조","title":"혁신제품의 공공구매 지원","text":"제33조(혁신제품의 공공구매 지원)\n① 법 제27조제1항에 따른 혁신제품(이하 \"혁신제품\"이라 한다)은 다음 각 호의 제품 중 위원회의 심의를 거쳐 지정한다.\n② 법 제27조제1항에 따라 지정된 혁신제품의 지정기간은 제1항에 따라 지정되어 고시된 날부터 3년으로 한다. 다만, 대상 제품의 특성 등을 고려하여 지정기간을 별도로 정할 필요가 있다고 인정하는 경우에는 위원회의 심의를 거쳐 지정기간을 별도로 정할 수 있다.\n③ 제2항에 따른 지정기간은 혁신제품의 공공부문 시장안착 및 판로개척 지원 등을 강화하기 위하여 필요한 경우 위원회의 심의를 거쳐 3년의 범위에서 연장할 수 있다.\n④ 제2항 단서에 따라 지정기간을 별도로 정하는 경우와 제3항에 따라 지정기간을 연장하는 경우에는 해당 중앙관서의 장 또는 조달청장이 이를 고시한다.\n⑤ 조달청장은 혁신제품의 공공구매 지원을 위해 법 제27조제1항제1호에 따라 혁신제품을 시범구매하여 수요기관에 공급하고, 재정경제부장관과 미리 협의한 바에 따라 그 사용 결과를 공개하는 시범구매 계약을 체결할 수 있다. 이 경우 수요기관은 혁신제품의 사용 결과를 조달청장에게 통지해야 한다.\n⑥ 조달청장은 다음 각 호의 어느 하나에 해당하는 경우에는 각 중앙관서의 장으로 하여금 직접 제5항에 따른 시범구매 계약을 체결하도록 할 수 있다.\n⑦ 제5항 또는 제6항에 따른 혁신제품 시범구매에 관한 절차는 시범구매를 하는 조달청장 또는 각 중앙관서의 장이 재정경제부장관과 협의하여 정한다.\n⑧ 조달청장은 제5항에 따라 혁신제품 사용 결과를 공개하는 경우 수요기관이 통지한 사용 결과를 종합하여 공개한다. 다만, 조달청장이 정하여 고시하는 경우에는 사용 결과를 공개하지 않을 수 있다.\n⑨ 조달청장은 법 제27조제1항제2호에 따른 혁신제품의 공공구매 지원 시스템을 통해 혁신제품 등록ㆍ거래ㆍ홍보, 혁신조달제품 운영정보화 등을 지원할 수 있다.\n⑩ 법 제27조제3항에서 \"최초 지정기준에 미달하는 등 대통령령으로 정하는 경우\"란 다음 각 호의 어느 하나에 해당하는 경우를 말한다.\n⑪ 조달청장은 법 제27조제3항에 따라 지정취소를 하는 경우 위원회의 심의를 거쳐야 한다. 이 경우 제1항제1호의 제품으로서 혁신제품으로 지정된 제품을 취소하려는 경우에는 위원회의 심의를 거치기 전 해당 중앙관서의 장과의 협의를 거쳐야 한다.\n⑫ 조달청장은 혁신제품의 지정을 취소하는 경우 그 사유 및 의견제출 기한 등을 지정을 받은 자에게 미리 서면으로 통지해야 하며, 제11항에 따라 위원회 심의를 거쳐 지정취소가 확정되는 경우에는 그 내용을 서면으로 통지해야 한다.\n⑬ 제1항부터 제12항까지에서 규정한 사항 외에 혁신제품 시범구매 및 공급, 혁신제품의 공공구매 지원 시스템 구축 및 운영, 혁신제품의 지정취소 등에 필요한 사항은 조달청장이 재정경제부장관과 협의하여 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:33의2","kind":"조문","type":"시행령","family":"psa","label":"제33조의2","title":"혁신제품 지원센터의 지정 기준 등","text":"제33조의2(혁신제품 지원센터의 지정 기준 등)\n① 법 제27조의2제1항에 따른 혁신제품 지원센터(이하 \"지원센터\"라 한다)의 지정 기준은 다음 각 호와 같다.\n② 지원센터로 지정을 받으려는 자는 재정경제부령으로 정하는 지정신청서를 조달청장에게 제출해야 한다. 지정 사항을 변경하려는 경우에도 또한 같다.\n③ 조달청장은 제2항에 따라 지정신청을 받으면 제1항의 지정 기준을 갖추었는지를 검토하여 혁신제품 공공구매 지원에 관한 업무를 수행하기에 적합한 기관을 지원센터로 지정할 수 있다.\n④ 조달청장은 제3항에 따라 지원센터를 지정한 때에는 재정경제부령으로 정하는 지원센터 지정서를 발급해야 한다.\n⑤ 지원센터의 지정기간은 지정된 날부터 3년으로 한다.\n⑥ 법 제27조의2제3항에 따른 지원센터의 지정취소 및 업무정지의 기준은 별표 1과 같다.\n⑦ 법 제27조의2제5항에 따라 비용 지원을 받은 지원센터는 해당 연도의 사업이 끝난 후 2개월 이내에 해당 연도의 사업추진실적, 예산집행실적 및 다음 연도의 사업계획을 조달청장에게 제출해야 한다.\n⑧ 제1항부터 제7항까지에서 규정한 사항 외에 지원센터의 지정 기준, 지정 및 지정 취소의 절차, 그 밖의 운영 등에 필요한 사항은 조달청장이 재정경제부장관과 협의하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:34","kind":"조문","type":"시행령","family":"psa","label":"제34조","title":"해외 조달시장 진출에 대한 지원","text":"제34조(해외 조달시장 진출에 대한 지원)\n① 조달청장은 법 제28조제1항에 따라 다음 각 호의 방법으로 국내기업의 해외 조달시장 진출을 지원할 수 있다.\n② 조달청장은 제1항에 따라 지원을 하려는 경우 지원 대상ㆍ내용 및 신청방법 등을 미리 공고해야 한다.\n③ 조달청장은 제1항에 따른 지원 업무를 수행할 때 필요한 예산을 확보하기 위해 노력해야 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:35","kind":"조문","type":"시행령","family":"psa","label":"제35조","title":null,"text":"제8장 비축사업","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:36","kind":"조문","type":"시행령","family":"psa","label":"제36조","title":"비축물자 이용업체 등록제한 등","text":"제36조(비축물자 이용업체 등록제한 등)\n① 조달청장은 법 제29조제4항에 따라 이용업체 등록을 제한하려는 경우 해당 이용업체에 대하여 자료 제출 요구와 현장 확인 등을 할 수 있다.\n② 조달청장은 법 제29조제4항 또는 제5항에 따라 이용업체 등록을 제한하거나 차액을 환수하려는 경우 그 사유, 등록제한 기간이나 환수금액 및 의견제출 기한 등을 미리 문서로 이용업체에 통지해야 하며, 이용업체의 등록 제한이나 차액의 환수가 확정된 경우에는 그 내용을 서면으로 통지해야 한다.\n③ 제1항 및 제2항에서 규정한 사항 외에 이용업체 등록 제한 및 차액 환수에 필요한 사항은 조달청장이 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:37","kind":"조문","type":"시행령","family":"psa","label":"제37조","title":"신용카드 등을 통한 비축물자대금의 납부","text":"제37조(신용카드 등을 통한 비축물자대금의 납부)\n① 조달청장은 정보통신망을 이용하여 신용카드 또는 직불카드 등(이하 \"신용카드등\"이라 한다)을 통한 결제를 수행하는 기관으로서 재정경제부령으로 정하는 기관을 법 제30조제4항에 따른 비축물자대금 납부대행기관(이하 \"비축물자대금 납부대행기관\"이라 한다)으로 지정한다.\n② 비축물자대금 납부대행기관은 비축물자를 구매하려는 자로부터 신용카드등을 통한 비축물자대금 납부 대행용역의 대가로 해당 납부대금의 1천분의 10 이내에서 재정경제부령으로 정하는 바에 따라 납부대행 수수료를 받을 수 있다.\n③ 제1항 및 제2항에서 규정한 사항 외에 신용카드등을 통한 비축물자대금 납부에 필요한 사항은 조달청장이 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:38","kind":"조문","type":"시행령","family":"psa","label":"제38조","title":"장내파생상품거래","text":"제38조(장내파생상품거래) 조달청장은 법 제31조제1항에 따라 비축물자의 안정적 확보 및 효율적 관리를 위해 필요하다고 인정하는 경우 「자본시장과 금융투자업에 관한 법률」 제5조제2항에 따른 장내파생상품을 거래할 수 있다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:39","kind":"조문","type":"시행령","family":"psa","label":"제39조","title":"민관 공동 비축사업의 참여대상 등","text":"제39조(민관 공동 비축사업의 참여대상 등)\n① 조달청장은 법 제32조제1항에 따라 다음 각 호의 어느 하나에 해당하는 자와 민관 공동 비축사업을 할 수 있다.\n② 법 제32조제1항에 따른 민관 공동 비축사업에 참여하려는 자는 비축사업신청서에 비축품목, 비축기간 및 비축물량 등을 적은 비축사업계획서를 첨부하여 조달청장에게 제출해야 한다.\n③ 조달청장은 제2항에 따라 신청서를 제출받은 경우 제출서류를 검토하여 민관 공동 비축사업을 수행하기에 적합하다고 인정하면 해당 신청인을 민관 공동 비축사업에 참여하는 민간사업자(이하 \"민간비축사업자\"라 한다)로 선정할 수 있다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 민간비축사업자의 선정 기준 및 절차, 그 밖에 민관 공동 비축사업의 운영에 필요한 사항은 조달청장이 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:40","kind":"조문","type":"시행령","family":"psa","label":"제40조","title":"민관 공동 비축협약 등","text":"제40조(민관 공동 비축협약 등)\n① 조달청장은 제39조제3항에 따라 민간비축사업자로 승인받은 자와 비축사업의 범위ㆍ방법과 법 제32조제3항에 따른 비축물자 우선매각의 대상 물량 및 매각 가격ㆍ조건 등을 포함하는 민관 공동 비축협약을 체결해야 한다.\n② 민간비축사업자는 제1항에 따른 민관 공동 비축협약에 따라 구매한 비축물자를 보관하기 위해 조달청장이 관리하는 비축시설을 사용할 수 있다.\n③ 조달청장은 민간비축사업자가 요청하는 경우 비축물자의 구매 및 판매 등을 대행할 수 있다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:41","kind":"조문","type":"시행령","family":"psa","label":"제41조","title":"비축시설 사용료의 감면 등","text":"제41조(비축시설 사용료의 감면 등)\n① 법 제32조제2항에서 \"대통령령으로 정하는 기준\"이란 다음 각 호의 요건을 모두 갖춘 경우를 말한다.\n② 조달청장은 법 제32조제2항에 따라 비축시설 사용료(비축시설의 관리비를 포함한다. 이하 제42조에서 같다)를 100분의 50 범위에서 감면할 수 있다. 이 경우 구체적인 감면비율은 우선매각의 대상 물량, 비축기간, 비축물량, 비축물자의 가액 등을 고려하여 조달청장이 정하여 고시한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42","kind":"조문","type":"시행령","family":"psa","label":"제42조","title":"우선매각의 방법 및 위반 시 제재조치","text":"제42조(우선매각의 방법 및 위반 시 제재조치)\n① 법 제32조제2항에 따라 사용료를 감면받은 민간비축사업자는 같은 조 제3항에 따라 조달청장으로부터 비축물자의 우선매각을 요청받은 경우 해당 비축물자를 제39조제1항에 따른 민관 공동 비축협약에서 정한 가격 및 조건으로 조달청장에게 매각해야 한다.\n② 법 제32조제3항에서 \"감면받은 사용료를 환수하는 등 대통령령으로 정하는 제재조치\"란 다음 각 호의 제재조치를 말한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의2","kind":"조문","type":"시행령","family":"psa","label":"제42조의2","title":null,"text":"제9장 조달기업공제조합","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의3","kind":"조문","type":"시행령","family":"psa","label":"제42조의3","title":"공제조합의 등기","text":"제42조의3(공제조합의 등기)\n① 공제조합은 법 제32조의2제1항에 따른 설립인가를 받으면 주사무소의 소재지에 다음 각 호의 사항을 등기해야 한다.\n② 제1항 각 호의 등기사항이 변경된 경우에는 그 변경이 발생한 날부터 3주 이내에 변경 사항을 등기해야 한다. 다만, 제1항제6호에 따른 출자금 총액의 변경등기는 매 회계연도 종료일 다음날부터 3개월 이내에 등기할 수 있다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의4","kind":"조문","type":"시행령","family":"psa","label":"제42조의4","title":"기본재산의 조성","text":"제42조의4(기본재산의 조성) 법 제32조의2제3항에서 \"대통령령으로 정하는 재원\"이란 다음 각 호의 재원을 말한다.\n1.\n1.  조합원의 공제부금ㆍ예탁금\n2.\n2.  조달 관계 기관 및 관련자 등의 출자금ㆍ출연금 또는 예탁금\n3.\n3.  공제사업을 위한 차입금\n4.\n4.  그 밖의 수입금","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의5","kind":"조문","type":"시행령","family":"psa","label":"제42조의5","title":"공제조합의 정관 기재사항","text":"제42조의5(공제조합의 정관 기재사항) 법 제32조의2제4항에 따른 공제조합의 정관 기재사항은 다음 각 호와 같다.\n1.\n1.  목적\n2.\n2.  명칭\n3.\n3.  사무소의 소재지\n4.\n4.  사업에 관한 사항\n5.\n5.  임원 및 직원에 관한 사항\n6.\n6.  조합원의 자격과 가입 및 탈퇴에 관한 사항\n7.\n7.  조합원의 권리ㆍ의무에 관한 사항\n8.\n8.  출자증권 1좌의 금액과 출자의 방법 등에 관한 사항\n9.\n9.  기본재산의 조성 및 운영관리에 관한 사항\n10.\n10.  자산 및 회계에 관한 사항\n11.\n11.  잉여금ㆍ적립금 및 손실금의 처리에 관한 사항\n12.\n12.  총회 및 이사회에 관한 사항\n13.\n13.  해산과 잔여재산의 처리에 관한 사항\n14.\n14.  지점 등의 설치에 관한 사항\n15.\n15.  공고에 관한 사항\n16.\n16.  대리인에 관한 사항\n17.\n17.  정관의 변경에 관한 사항","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의6","kind":"조문","type":"시행령","family":"psa","label":"제42조의6","title":"출자 및 출자증권 등","text":"제42조의6(출자 및 출자증권 등)\n① 공제조합의 총출자금은 조합원이 출자한 총 출자계좌의 액면총액으로 한다.\n② 공제조합은 정관에서 정하는 바에 따라 출자한 조합원에게 그 출자를 나타내는 출자증권을 발행하여 교부해야 한다.\n③ 조합원의 출자는 전액 현금으로 납입해야 하며, 그 납입금은 공제조합에 대한 채권과 상계하지 못한다.\n④ 조합원의 책임은 그 출자금액을 한도로 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의7","kind":"조문","type":"시행령","family":"psa","label":"제42조의7","title":"출자증권의 명의 변경","text":"제42조의7(출자증권의 명의 변경)\n① 조합원 또는 조합원이었던 자는 제42조의8제1항에 따라 그의 지분을 양도하려는 경우에는 정관에서 정하는 바에 따라 공제조합으로부터 출자증권의 명의 변경을 받아야 한다.\n② 공제조합은 제42조의9제1항제2호 또는 제3호의 사유로 지분을 취득한 경우에는 해당 지분에 대한 출자증권의 명의를 공제조합의 명의로 변경한 후 해당 지분을 처분해야 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의8","kind":"조문","type":"시행령","family":"psa","label":"제42조의8","title":"지분의 양도 등","text":"제42조의8(지분의 양도 등)\n① 조합원 또는 조합원이었던 자는 그의 지분을 다른 조합원이나 조합원이 되려는 자에게 양도할 수 있다.\n② 제1항에 따라 지분을 양수한 자는 그 지분에 관한 양도인의 권리와 의무를 승계한다.\n③ 조합원의 지분은 공제조합에 대한 채무의 담보로 제공하는 경우 외에는 질권의 목적으로 사용할 수 없다.\n④ 지분의 양도 및 질권설정은 「상법」에 따른 주식의 양도 및 질권설정의 방법으로 한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의9","kind":"조문","type":"시행령","family":"psa","label":"제42조의9","title":"공제조합의 지분취득","text":"제42조의9(공제조합의 지분취득)\n① 공제조합은 다음 각 호의 어느 하나에 해당하는 사유가 있을 때에는 조합원 또는 조합원이었던 자의 지분을 취득할 수 있다. 다만, 제1호 또는 제3호에 해당할 때에는 그 지분을 취득해야 한다.\n② 제1항에 따라 공제조합이 지분을 취득하였을 때에는 지체 없이 다음 각 호의 구분에 따른 조치를 이행해야 한다.\n③ 제1항에 따라 공제조합이 지분을 취득할 때의 취득가액은 그 출자증권의 지분가액을 초과할 수 없다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의10","kind":"조문","type":"시행령","family":"psa","label":"제42조의10","title":"책임준비금의 적립 등","text":"제42조의10(책임준비금의 적립 등)\n① 공제조합은 공제사업에 따른 손실을 보전하기 위해 공제이용자로 하여금 책임준비금을 부담하게 하고, 이를 별도의 계정으로 적립하여 운용할 수 있다.\n② 책임준비금은 자금대여액ㆍ채무보증액 및 이행보증액을 합한 금액의 100분의 5의 범위에서 적립ㆍ운용해야 한다.\n③ 책임준비금은 공제사업의 운영과 관련하여 발생한 손실의 보전과 그 관리에 필요한 비용 외에는 사용하지 못한다.\n④ 제1항부터 제3항까지에서 규정한 사항 외에 책임준비금의 적립ㆍ운용에 관한 세부사항은 보증규정 및 공제규정으로 정한다.","lawId":"psa-e","group":"조달사업법 시행령","확인일":"20260721","시행일":"20260102","상태":"현행"},{"id":"art:psa-e:42의11","kind":"조문","type":"시행령","family":"
