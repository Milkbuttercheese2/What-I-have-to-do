"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:45","kind":"조문","type":"계약예규","family":"nca","label":"제45조","title":"전문가격조사기관 등록","text":"제45조(전문가격조사기관 등록) 이 장은 시행규칙 제5조제1항제2호에 의한 전문가격조사기관의 등록에 관하여 필요한 사항을 정함으로써, 공신력 있는 조사기관에 의한 조사가격의 객관성과 신뢰성을 확보하여 예정가격의 합리적 결정과 이에 따른 예산의 효율적 집행을 도모함을 목적으로 한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:46","kind":"조문","type":"계약예규","family":"nca","label":"제46조","title":"등록자격요건","text":"제46조(등록자격요건) 전문가격조사기관으로 등록하고자하는 자는 다음 각호의 자격요건을 갖추어야 한다.1. 정관상 사업목적에 가격조사업무가 포함되어있는 비영리법인2. 별첨 \"표준가격조사요령\"에 의하여 조사한 가격의 정보에 관한 정기간행물을 월1회이상 발행한 실적이 있는 자","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:47","kind":"조문","type":"계약예규","family":"nca","label":"제47조","title":"등록신청","text":"제47조(등록신청) 제46조의 자격요건을 갖춘 자가 전문가격조사기관으로 등록하고자할 경우에는 별표7의 등록 신청서에 다음 각호의 서류를 첨부하여 재정경제부장관에게 제출하여야 한다.1. 비영리법인의 설립허가서, 등기부등본 및 정관사본 1부2. 제46조제2호에 규정한 사항을 증명할 수 있는 자료 1부3. 조사요원 재직증명서 1부4. 「국가기술자격법 시행규칙」 제4조 관련 별표2(기술ㆍ기능분야)에 의한 기계, 전기, 통신, 토목, 건축 직무분야 중 3개이상 직무분야의 산업기사 이상인 자의 재직증명서 1부","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:48","kind":"조문","type":"계약예규","family":"nca","label":"제48조","title":"등록증의 교부","text":"제48조(등록증의 교부) 재정경제부장관은 제47조에 의한 전문가격조사기관등록신청자가 제46조의 자격요건을 갖춘 경우에는 조사기관등록대장에 등재하고, 그 신청인에게 별표 8의 전문가격조사기관등록증을 교부한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:49","kind":"조문","type":"계약예규","family":"nca","label":"제49조","title":"가격정보에 관한 간행물","text":"제49조(가격정보에 관한 간행물) ① 전문가격조사기관으로 등록한 기관은 매월 1회이상 별첨 표준가격조사요령에 의하여 조사한 가격의 정보에 관한 정기간행물을 발행하여야 한다.② 제1항에 의한 가격의 정보에 관한 정기간행물에는 조사기관의 등록번호와 등록 년월일을 기재하여야 한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:50","kind":"조문","type":"계약예규","family":"nca","label":"제50조","title":"등록사항의 변경신청","text":"제50조(등록사항의 변경신청) ① 전문가격조사기관으로 등록한 자가 제46조의 등록요건과 법인명, 대표자, 주소 등이 변경된 때에는 별표 9의 등록사항변경신고서를 작성하여 재정경제부장관에게 60일이내에 신고하여야 한다.② 재정경제부장관은 제1항의 등록사항 변경신고서의 내용에 따라 조사기관등록증을 재발급한다. 단, 등록번호 및 등록년월일은 변경하지 아니한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:51","kind":"조문","type":"계약예규","family":"nca","label":"제51조","title":"등록의 취소","text":"제51조(등록의 취소) 재정경제부장관은 다음 각호의 어느 하나에 해당될 경우에는 전문가격조사기관의 등록을 취소할 수 있다.1. 제46조에 의한 자격요건에 미달될 때2. 정당한 조사방법에 의하지 아니하고 담합 등 허위로 가격을 게재하는 경우3. 재정경제부장관의 자료제출의 요구를 받고도 정당한 사유 없이 이를 제출하지 아니하는 경우4. 재정경제부장관에 의한 3회이상 시정조치를 받고도 이에 응하지 않은 경우5. 조사원이 윤리강령 등에 위배되는 행동으로 인하여 사회적 물의를 일으킨 경우","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:52","kind":"조문","type":"계약예규","family":"nca","label":"제52조","title":"등록기관의 지도감독","text":"제52조(등록기관의 지도감독) ① 재정경제부장관은 제45조에 규정한 목적을 달성하기 위하여 필요하다고 인정될 때에는 조사기관에 대하여 가격조사에 관한 필요한 지시 및 시정조치를 명할 수 있다.② 재정경제부장관은 년 1회이상 조사기관에 대하여 감사를 할 수 있다.\n제6장 보칙","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-yejeong:53","kind":"조문","type":"계약예규","family":"nca","label":"제53조","title":"재검토기한","text":"제53조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-yejeong","group":"예정가격작성기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-jeokgyeok","kind":"법령","type":"계약예규","family":"nca","label":"적격심사기준","name":"(계약예규) 적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제42조제1항에 의한 낙찰자 결정시의 계약이행능력 심사(이하 \"적격심사\"라 한다) 방법ㆍ항목ㆍ배점한도액 기타 필요한 사항을 정함을 목적으로 한다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"낙찰자결정방법 등의 공고","text":"제2조(낙찰자결정방법 등의 공고) 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)은 시행령 제42조제1항에 의한 공사, 물품 및 용역을 집행하고자 할 때에는 시행령 제36조제6호 및 제16호에 의하여 낙찰자 결정방법, 적격심사기준 열람에 관한 사항, 심사에 필요한 서류, 제출기한 및 낙찰자통보 예정일 등을 입찰공고시 함께 공고하여야 한다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"세부심사기준 등의 열람","text":"제3조(세부심사기준 등의 열람) ① 계약담당공무원은 입찰에 참가하고자 하는 자가 열람할 수 있도록 다음 각호의 서류를 비치하여야 하며, 입찰에 참가하고자 하는 자의 요구가 있을 경우에는 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」(이하 \"시행규칙\"이라 한다) 제41조에서 정한 입찰관련서류와 함께 교부하여야 한다.1. 세부심사기준2. 심사에 필요한 증빙서류의 작성요령 및 제출방법3. 기타 심사에 필요하다고 인정되는 사항② 제1항에 의한 열람ㆍ교부기간은 입찰공고일부터 입찰등록마감일까지로 한다. ③ 계약담당공무원은 필요하다고 인정되는 때에는 전자조달시스템에 제1항 각호의 서류를 게재함으로써 입찰에 참가하고자 하는 자에 대한 교부에 갈음할 수 있다. 다만, 입찰에 참가하고자 하는 자가 문서로 요구하는 경우에는 제1항 각 호의 서류를 교부하여야 한다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"심사자료요구","text":"제4조(심사자료요구) ① 계약담당공무원은 입찰을 집행한 후 예정가격 이하로서 최저가입찰자에게 적격심사에 필요한 서류를 제출하도록 요구하되, 그 제출기한을 분명히 하여야 하며 제출기한은 통보를 받은 날로부터 5일 이상으로 하여야 한다. ② 계약담당공무원은 제1항에 의하여 제출된 적격심사서류 중 첨부목록에 있는 서류가 첨부되어 있지 않거나 제출된 서류가 불명확하여 인지할 수 없는 경우에는 기한을 정하여 보완을 요구할 수 있으며, 보완기간은 통보를 받은 날로부터 3일 이상으로 하여야 한다. ③ 계약담당공무원은 제2항에 따라 보완요구한 서류가 기한까지 제출되지 아니한 경우에는 당초 제출된 서류만으로 심사하되, 당초 제출된 서류가 불명확하여 심사하기가 곤란한 경우에는 심사에서 제외한다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"심사항목 및 배점한도","text":"제5조(심사항목 및 배점한도) ① 시행령 제42조제1항 및 제5항 본문중 공사에 대한 적격심사의 항목 및 배점한도는 별표와 같고, 물품 및 용역에 대한 적격심사의 항목 및 배점한도는 각 중앙관서의 장이 직접 별표에 정한 공사에 대한 적격심사 항목 및 배점한도를 준용하여 재정경제부장관의 협의를 거쳐 정한다. ② 각 중앙관서의 장은 제1항에도 불구하고 시행령 제42조제5항 단서에 의하여 재정경제부장관과 협의하여 직접 공사, 물품 및 용역 등에 대한 적격심사기준을 정할 수 있다. ③ 각 중앙관서의 장은 제1항 및 제2항에 따른 심사기준을 정함에 있어 다음 각호의 사항을 심사항목으로 포함하여야 한다. 다만, 가점항목으로 포함하는 경우에는 이행(수행)능력의 배점한도 범위 내에서 가산점을 부여한다. 1. 물품 제조ㆍ구매, 용역계약: 「사회적기업 육성법」 제2조제1호에 따른 사회적기업, 「협동조합 기본법」 제2조제3호에 따른 사회적협동조합, 「국민기초생활보장법」 제18조에 따른 자활기업, 「도시재생 활성화 및 지원에 관한 특별법」 제2조제1항제9호에 따른 마을기업에 대한 신인도 평가시 가점 2. 시행규칙 제23조의3 각 호의 어느 하나에 해당하는 용역: 시행령 제42조제5항에 따른 외주근로자 근로조건 이행계획에 관한 사항 3. 공사, 물품 제조ㆍ구매, 용역계약: 일자리창출에 대한 우대 가점 4. 개정 근로기준법(법률 제15513호) 제2조에 따른 근로시간 단축의 시행시기가 도래하기 이전에 자발적으로 1주당 최대 근로시간을 52시간으로 단축하여 시행한 업체로서 고용노동부로부터 근로시간 단축 확인을 받은 업체에 대한 신인도 평가시 가점 5. 공사계약 가. 최근 1년간 산업재해예방활동 실적이 우수한 자에 대한 신인도 가점 및 최근 1년동안 산업안전보건법령 위반으로 동일 공공공사 현장에서 벌금이상의 행정형벌을 2회 이상 받은 자에 대한 신인도 감점나. 최근 3년간 고용노동부장관이 산정한 사고사망만인율의 가중평균이 평균사고사망만인율의 가중평균 이하인 자에 대한 가점다. 입찰공고일 기준 최근 1년간 산업안전보건법 위반으로 중대재해를 발생시킨 자에 대한 감점 ④ 각 중앙관서의 장은 「용역계약일반조건」제38조제4항에 따라 전자조달시스템에 게재된 업체에 대해 게재일로부터 1년간 신인도 평가 시 감점할 수 있으며, 입찰공고일 기준으로 과거 1년 이내에 미이행 횟수가 2건 이상인 경우에는 추가로 감점할 수 있다. ⑤ 제1항 및 제2항에 의한 심사항목별 심사기준일은 입찰공고일로 한다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"세부심사기준","text":"제6조(세부심사기준) ① 계약담당공무원은 제5조에 의한 세부심사기준(이하 \"세부심사기준\"이라 한다)을 정할 때에는 이 예규에 규정된 바에 따라 적격업체가 선정될 수 있도록 작성하여야 한다. ② 공사의 경우에는 제1항을 적용함에 있어서 교량, 터널, 지하철, 전기, 정보통신 등 각 공사종류별로 그 공사의 특성ㆍ목적 및 내용 등을 종합 고려하여 별표의 분야별 배점한도(입찰가격은 제외한다)를 20% 범위내에서 가ㆍ감 조정할 수 있으며, 항목별(신인도 제외) 세부사항을 추가하거나 제외할 수 있다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"심사방법","text":"제7조(심사방법) ① 계약담당공무원은 제5조 및 제6조에 따라 예정가격 이하로서 최저가로 입찰한 자 순으로 심사하여야 한다. 다만, 예정가격이 100억원 미만인 공사인 경우에는 입찰가격을 예정가격 중 다음 각 호에 해당하는 금액의 합계액의 100분의 98 미만으로 입찰한 자는 심사대상에서 제외한다.1. 재료비ㆍ노무비ㆍ경비2. 제1호에 대한 부가가치세② 계약담당공무원은 제1항에 의한 심사를 하는 때에는 제4조에 의하여 제출된 서류를 그 제출마감일 또는 보완일부터 7일이내에 심사하여야 한다. 다만, 불가피한 경우에는 3일의 범위내에서 그 기간을 연장할 수 있다.③ 공동계약의 경우에는 공동수급체에 대한 심사는 제5조 별표의 분야별ㆍ항목별로 다음 각호와 같이 실시하되, 공동수급체 구성원간의 시공능력공시액, 실적, 기술보유상황 등의 보완을 위하여 공동계약을 하는 경우에는 세부심사기준 작성시 이를 우대할 수 있다.1. 시공경험ㆍ기술능력 : 공동수급체 구성원별로 각각 시공경험 및 기술능력에 공사참여 지분율(이하 \"시공비율\"이라 한다)을 곱하여 산정한 후 이를 합산하여 산정2. 경영상태ㆍ신인도 : 공동수급체 구성원별로 각각 산출한 점수에 시공비율을 곱하여 이를 합산④ 계약담당공무원은 시행령 제22조에 따라 입찰참가자격을 제한하는 경우에는 제3항제1호에도 불구하고 공동수급체 구성원에 대한 해당 공사수행능력 심사방법을 세부심사기준에 따로 정할 수 있다.⑤ 제2항에도 불구하고 「재난 및 안전관리 기본법」 제3조제1호의 재난이나 경기침체, 대량실업 등으로 인한 국가의 경제위기를 극복하기 위해 재정경제부장관이 기간을 정하여 고시한 경우에는 다음 각 호의 계약에 대하여는 심사서류의 제출마감일 또는 보완일로부터 4일 이내에 심사하여아 한다. 다만, 불가피한 경우에는 2일의 범위내에서 그 기간을 연장할 수 있다.1. 추정가격이 10억원 미만인 공사계약2. 추정가격이 2억원 미만인 물품 및 용역계약⑥ 「건설산업기본법」에 따라 종합공사의 건설업종을 등록한 건설사업자(이하 \"종합건설사업자\"라 한다)와 전문공사의 건설업종을 등록한 건설사업자(이하 \"전문건설사업자\"라 한다)가 모두 참여하는 입찰의 시공경험, 경영상태(경영상태 심사방법 중 최근년도 부채비율 및 유동비율, 영업기간), 하도급관리계획의 적정성 심사는 다음 각 호 및 별표와 같으며, 그 외 심사분야 및 심사항목은 별표를 따른다.  1. 시공경험 : 국토교통부고시 「종합ㆍ전문업종간 상호시장 진출을 위한 건설공사실적 인정기준」을 기준으로 한다.가. 전문건설사업자가 전문공사로 구성된 추정가격 10억원 이상인 종합공사에 참여하는 경우에는 입찰공고에 명시한 추정금액 기준 전문업종별 구성비율로 배점을 구분하고 각 전문업종별로 평가해 합산한다.나. 2026. 12. 31. 까지 입찰공고한 공사로서 전문건설사업자가 전문공사로 구성된 추정가격 10억원 미만 3억원 이상인 종합공사에 참여하는 경우에는 각 전문업종별 실적을 합산해 평가한다. 다만, 입찰공고에 명시한 각 전문업종별 추정금액(공동수급체 구성원은 추정금액에 공사참여 지분율을 곱한 값) 대비 1/5 미만인 업종이 있는 경우에는 입찰공고에 명시한 추정금액 기준 전문업종별 구성비율로 배점을 구분하고 각 전문업종별로 평가해 합산한다. 다. 전문건설사업자가 전문공사로 구성된 종합공사에 참여하는 경우로서 2021.1.1. 이후 전문건설사업자의 자격으로 취득한 종합공사 실적을 보유한 경우에는 해당 종합공사 실적을 우선 평가(종합건설사업자의 종합공사 평가방법과 동일)하고 배점한도를 충족하지 못할 경우 잔여 배점을 기준으로 \"가\"목 내지 \"나\"목에 의하여 전문업종별 실적을 평가하여 합산한다. 2. 경영상태(최근년도 부채비율 및 유동비율) : 관련 협회가 조사ㆍ통보한 종합건설사업자 및 전문건설사업자 가중평균비율을 기준으로 한다.가. 종합건설사업자의 부채비율 및 유동비율은 종합건설사업자 가중평균비율을 기준으로 등급을 정해 평가한다.나. 전문건설사업자의 부채비율 및 유동비율은 전문건설사업자 가중평균비율을 기준으로 등급을 정해 평가한다.(다만, 전문건설사업자가 전문공사에 참여하는 경우 전문건설사업자의 부채비율과 유동비율은 해당 전문공사 업종의 가중평균비율을 기준으로 등급 평가)3. 경영상태(영업기간) : 다음 각목의 방법 및 별표에 따라 영업기간을 산정한다.가. 종합공사에 전문건설사업자가 참여하는 경우에는 해당 종합공사를 구성하는 전문공사 참여 업종의 등록일 중 가장 빠른 날부터 심사기준일까지의 기간을 기준으로 한다.나. 전문공사에 종합건설사업자가 참여하는 경우에는 입찰공고에 입찰참가자격으로 명시한 종합공사 참여 업종의 등록일 중 가장 빠른 날부터 심사기준일까지의 기간을 기준으로 한다.4. 하도급관리계획의 적정성 : 별표에도 불구하고 직접 시공하는 경우에는 배점한도를 부여한다.⑦ 계약담당공무원은  국토교통부 고시 「건설공사 발주 세부기준」제8조의2에 따라 (주력)업무분야를 시공자격으로 발주한 전문공사 입찰의 시공경험은 (주력)업무분야 실적으로 평가하며, 그 외 심사분야 및 심사항목은 별표를 따른다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"낙찰자 결정","text":"제8조(낙찰자 결정) ① 계약담당공무원은 제7조제1항에 의한 심사의 경우에는 종합평점이 95점이상이면 이를 낙찰자로 결정하여야 한다. ② 제1항에 의한 심사에서 최저가 입찰자의 종합평점이 낙찰자로 결정될 수 있는 점수미만일 때에는 차순위 최저가 입찰자 순으로 심사하여 제1항의 낙찰자 결정에 필요한 점수이상이 되면 낙찰자로 결정한다.③ 물품 및 용역의 경우에는 낙찰자 결정방법을 제1항 및 제2항에도  불구하고 각 중앙관서의 장이 별도로 정할 수 있다.④ 계약담당공무원은 제1항 내지 제3항에 의한 낙찰자 결정결과를 해당자에게 지체없이 통보하여야 한다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"재심사","text":"제9조(재심사) ① 계약담당공무원은 제8조에 의하여 부적격 통보를 받은 자가 통보일부터 3일이내에 심사결과에 대한 재심사를 요청하였을 때에는 특별한 사유가 없는 한 재심사요청서 접수일부터 3일이내에 재심사하여야 한다.② 재심사결과를 통보하는 경우에는 제8조제4항의 규정을 준용한다. ③ 계약담당공무원은 제1항의 재심사요청서를 접수할 때에는 적격심사에 필요한 추가서류를 접수할 수 없다","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:9의2","kind":"조문","type":"계약예규","family":"nca","label":"제9조의2","title":"적격심사의 결격 및 재심사","text":"제9조의2(적격심사의 결격 및 재심사) 계약담당공무원은 시행령 제72조의 규정에 따라 공동계약을 허용한 경우로서, 공동수급체 일부 구성원이 입찰서제출마감일 이후 낙찰자결정 이전에 부도, 부정당업자제재, 영업정지, 입찰무효 등의 결격사유가 발생한 경우에는 해당 구성원을 제외하고 잔존구성원의 출자비율 또는 분담내용을 변경하게 하여 재심사 하여야 한다. 다만, 공동수급체 대표자가 부도, 부정당업자제재, 영엽정지, 입찰무효 등의 결격사유가 발생한 경우에는 공동수급체를 낙찰자 결정대상에서 제외하여야 한다.[본조신설 2014.1.10.]","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"부정한 방법으로 심사서류를 제출한 자의 처리","text":"제10조(부정한 방법으로 심사서류를 제출한 자의 처리) ① 계약담당공무원은 제4조에 따라 제출된 서류가 부정 또는 허위로 작성된 것으로 판명된 때에는 다음 각호에 따라 처리하여야 한다.1. 계약체결 이전인 경우에는 적격낙찰자 결정대상에서 제외 또는 결정통보를 취소한다.2. 계약체결 이후인 경우에는 해당 계약을 해제 또는 해지할 수 있다.② 각 중앙관서의 장은 제1항에 해당하는 자에 대하여는 시행령 제76조에 의한 입찰참가자격제한조치를 하여야 한다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"기타사항","text":"제11조(기타사항) 계약담당공무원은 적격심사를 함에 있어 이 예규에 규정되지 아니한 사항과 이 예규시행에 필요한 세부사항을 작성하여 집행할 수 있다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-jeokgyeok:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"재검토기한","text":"제12조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-jeokgyeok","group":"적격심사기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-pq","kind":"법령","type":"계약예규","family":"nca","label":"입찰참가자격사전심사요령","name":"(계약예규) 입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제13조 및 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」(이하 \"시행규칙\"이라 한다) 제23조 및 제23조의2에 의한 입찰참가자격사전심사(이하 \"사전심사\"라 한다)를 위하여 중앙관서의 장 또는 계약담당공무원(이하 계약담당공무원)이 심사기준을 정하는 경우 고려하여야 하는 사항과 사전심사를 실시하는 경우 따라야 할 절차, 방법 및 기타 필요한 사항을 정함을 목적으로 한다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"입찰공고","text":"제2조(입찰공고) ① 계약담당공무원이 사전심사를 집행하는 때에는 시행령 제36조제16호에 의하여 심사기준의 열람ㆍ교부에 관한 사항, 심사에 필요한 서류 및 제출기한 등을 공고하여야 한다. 1. 2. 3. ② 제1항에 의한 공고는 시행령 제35조제2항에 정한 바와 같이 현장설명일의 전일부터 기산하여 최소한 30일전에 하여야 한다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"심사기준 등의 열람ㆍ교부","text":"제3조(심사기준 등의 열람ㆍ교부) ① 계약담당공무원은 제6조에 따라 작성한 심사기준 등을 사전심사에 참가하고자 하는 자가 열람할 수 있도록 다음 각호의 서류 등을 비치하여야 하며, 사전심사에 참가하고자 하는 자의 신청이 있는 경우 이를 교부하여야 한다. 1. 심사기준 2. 심사에 필요한 증빙서류의 작성요령 및 제출방법3. 기타 필요한 사항② 제1항에 의한 열람ㆍ교부기간은 입찰공고일로부터 입찰참가자격 사전심사 신청 마감일까지로 한다. ③ 계약담당공무원은 필요하다고 인정되는 때에는 전자조달시스템에 제1항 각 호의 서류를 게재함으로써 입찰에 참가하고자 하는 자에 대한 교부에 갈음할 수 있다. 다만, 입찰에 참가하고자 하는 자가 서류로 제1항 각 호의 서류를 교부토록 신청하는 경우에는 서류로 교부하여야 한다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"사전심사 신청","text":"제4조(사전심사 신청) ① 계약담당공무원은 사전심사를 신청하고자 하는 자로 하여금 입찰공고일부터 7일 이상이 지난 날부터 사전심사에 필요한 증빙서류 등을 갖추어 신청하게 하여야 한다. 단, 사전심사를 신청하고자 하는 자가 공정거래위원회에서 보급한 표준계약서를 사용하고자 하는 경우에는 그 사용계획을 포함하여야 한다. ② 제1항에 따른 신청기간은 10일 이상으로 하되, 입찰공고시 그 신청기간을 명시하여야 한다. 다만, 계약담당공무원은 제출된 서류 등이 미비하거나 불명확하다고 인정되는 경우에는 사전심사를 신청한 자에게 3일 이내의 기간을 정하여 보완을 요구할 수 있다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"사전심사신청 자격제한","text":"제5조(사전심사신청 자격제한) 계약담당공무원은 사전심사 신청자의 자격을 시행령 제21조 또는 제22조에 의거 제한할 수 있다. 다만, 시행령 제22조의 경우 추정가격이 200억원이상인 공사로서 제6조 제5항 제1호에 규정한 공사 중 다음 각 호의 공사는 제외한다. 1. 교량건설공사2. 공항건설공사3. 댐축조공사4. 철도공사5. 지하철공사6. 터널공사가 포함된 공사7. 발전소 건설공사8. 9. 쓰레기 소각로 건설공사10. 폐수처리장 건설공사11. 하수종말처리공사12. 관람집회시설공사","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"심사기준등","text":"제6조(심사기준등) ① 계약담당공무원은 시행령 제13조 제2항에 따른 심사기준을 정할 때에는 제6조 및 제7조, 별표 2 및 3을 고려하여 해당공사의 성질ㆍ내용 등에 따라 적격업체가 선정될 수 있도록 하여야 한다. ② 사전심사는 경영상태부문과 기술적 공사이행능력부문으로 구분하여 심사하며, 경영상태부문의 적격요건을 충족한 자를 대상으로 기술적 공사이행능력부문을 심사한다. ③ 경영상태부문은 「신용정보의 이용 및 보호에 관한 법률」제4조제1항제1호 또는「자본시장과 금융투자업에 관한 법률」제9조제26항의 업무를 영위하는 신용정보업자가 평가한 회사채(또는 기업어음) 또는 기업신용평가등급(이하 \"신용평가등급\"이라 한다)으로 심사하며, 적격요건은 다음 각호와 같다. 1. 신용평가등급에 의한 적격요건가. 추정가격이 500억원 이상인 공사1) 회사채에 대한 신용평가등급의 경우 BB+(단, 공동이행방식에서 공동수급체 대표자이외의 구성원은 BB0) 이상 2) 기업어음에 대한 신용평가등급의 경우 B+ 이상 3) 기업신용평가등급의 경우 회사채에 대한 신용평가등급 BB+(단, 공동이행방식에서 공동수급체 대표자이외의 구성원은 BB0)에 준하는 등급 이상 나. 추정가격이 500억원 미만인 공사1) 회사채에 대한 신용평가등급의 경우 BB-(단, 공동이행방식에서 공동수급체 대표자이외의 구성원은 B+) 이상 2) 기업어음에 대한 신용평가등급의 경우 B0(단, 공동이행방식에서 공동수급체 대표자이외의 구성원은 B-) 이상 3) 기업신용평가등급의 경우 회사채에 대한 신용평가등급 BB-(단, 공동이행방식에서 공동수급체 대표자이외의 구성원은 B+)에 준하는 등급 이상 2. ④ 기술적 공사이행능력부문은 시공경험분야, 기술능력분야, 시공평가결과분야, 지역업체참여도분야, 신인도분야를 종합적으로 심사하며, 적격요건은 평점 90점이상으로 한다. ⑤ 제4항에 따른 기술적 공사이행능력부문 심사시의 분야별 심사항목 및 배점에 대한 기준은 다음과 같다. 1. 추정가격이 200억원 이상인 공사로서 다음 각 목의 어느 하나에 해당하는 공사는 별표2를 적용가. 다음 중 어느 하나에 해당하는 교량건설공사가-1. 기둥 사이의 거리가 50미터 이상이거나 길이 500미터 이상인 교량건설공사가-2. 교량건설공사와 교량 외의 건설공사가 복합된 공사의 경우에는 교량건설공사(기둥 사이의 거리가 50미터 이상이거나 길이 500미터 이상인 것에 한한다)부분의 추정가격이 200억원 이상인 교량건설공사나. 공항건설공사다. 댐축조공사라. 에너지저장시설공사마. 간척공사바. 준설공사사. 항만공사아. 철도공사자. 지하철공사차. 터널건설공사(단, 터널건설공사와 터널 외의 건설공사가 복합된 공사의 경우에는 터널건설공사부분의 추정가격이 200억원 이상인 것에 한함)카. 발전소건설공사타. 쓰레기소각로건설공사파. 폐수처리장건설공사하. 하수종말처리장건설공사거. 관람집회시설공사너. 전시시설공사더. 송전공사러. 변전공사2. 제1호 이외의 공사는 별표3을 적용⑥ 제3항에 의한 신용평가등급은 입찰공고일 이전 가장 최근에 평가한 유효기간내 신용평가등급으로 하며, 제3항 및 제4항의 심사항목에 대한 심사기준일은 입찰공고일로 한다. ⑦ 계약담당공무원은 제4항에 따른 기술적 공사이행능력부문 심사시에는 계약이행의 성실도 평가를 위하여 다음 각호의 사항은 분야별 심사항목에 반드시 포함하여야 한다. 1. 「건설기술진흥법」 제53조에 따른 부실벌점 2. 「건설기술진흥법」 제50조에 따른 평가결과 3. 일자리창출을 평가하기 위한 일자리창출 실적","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"심사기준의 조정","text":"제7조(심사기준의 조정) ① ② 계약담당공무원은 제6조에 따라 심사기준을 정하는 경우 해당공사의 성질, 내용 등을 고려하여 필요하다고 인정될 때에는 제6조제3항 및 제4항의 적격요건을 상향조정할 수 있다. ③ 계약담당공무원은 제6조를 적용함에 있어 해당공사의 성질ㆍ내용 등을 고려하여 필요하다고 인정되는 경우에는 별표 2 및 3의 분야별ㆍ항목별 배점한도를 가ㆍ감 조정하거나, 항목별 세부사항을 추가 또는 제외할 수 있다. 다만, 신인도 항목을 추가 또는 제외하려는 경우에는 재정경제부장관과 협의를 거쳐야 한다.  ④ 계약담당공무원은 「건설산업기본법」에 의한 건설공사외의 공사의 경우에는 신인도분야의 각 항목을 해당공사 관련법령에 규정된 내용에 따라 조정한다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"심사방법","text":"제8조(심사방법) ① 계약담당공무원은 제4조에 따라 신청한 자의 제출서류를 제6조의 심사기준에 따라 신청마감일 또는 보완일로부터 10일이내에 심사하여야 한다. 다만, 부득이한 경우에는 3일의 범위내에서 그 기간을 연장할 수 있다. ② ③ 경영상태의 평가는 심사기준일 이전에 평가한 유효기간내에 있는 회사채, 기업어음, 기업의 신용평가등급중에서 가장 최근의 등급으로 심사하고, 합병한 업체에 대하여는 합병후 새로운 신용평가등급으로 심사하여야 하며 그 전까지는 합병대상업체중 가장 낮은 신용평가등급을 받은 업체의 신용평가등급으로 심사한다. ④ 제1항의 심사결과 제6조제3항에 따른 경영상태부문에 대한 적격요건과 제6조제4항에 따른 기술적 공사이행능력부문에 대한 적격요건을 모두 충족하는 자를 입찰적격자로 선정한다. ⑤ 계약담당공무원은 제1항의 심사를 위하여 필요하다고 인정할 때에는 시행령 제94조에 의한 계약심의회의 심의를 거쳐 심사할 수 있다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"심사결과의 통보","text":"제9조(심사결과의 통보) ① 계약담당공무원은 제8조제4항에 의하여 입찰적격자를 선정한 때에는 지체없이 해당자에게 통보하고 해당사실을 시행령 제13조 제4항 단서에 의한 전자조달시스템(이하 \"전자조달시스템\"이라 한다), 게시판 또는 일간건설지등에 게재하여야 하며, 공사종류별로 입찰적격자명부를 작성ㆍ비치하여야 한다. ② 계약담당공무원은 제4조에 의한 신청자가 제8조에 규정한 심사관련서류의 열람을 신청한 때에는 제1항의 게재일로부터 3일까지는 이를 허용하여야 한다.③","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"재심사","text":"제10조(재심사) ① 계약담당공무원은 제9조에 의한 통보를 받은 자가 시행령 제14조의2에 의한 현장설명일부터 3일이전까지 심사결과에 대하여 이의가 있어 재심사를 요청한 때에는 재심사를 실시하고, 재심사 요청을 받은 날부터 3일 이내에 그 결과를 통지하여야 한다. ② 계약담당공무원은 시행령 제72조의 규정에 의하여 공동계약을 허용한 경우로서 공동수급체를 구성하여 입찰에 참가하고자 하는 자가 제8조의 규정에 의한 입찰적격자 선정이후 낙찰자 결정이전에 공동수급체구성원중 일부 구성원이 부도, 부정당업자제재, 영업정지, 입찰무효 등의 결격사유가 발생한 경우(결격사유가 입찰참가등록 마감일 이전에 소멸되는 경우는 제외, 이하 이항에서 같음)에는 잔존구성원의 출자비율 또는 분담내용을 변경하거나 결격사유가 발생한 구성원을 대신할 새로운 구성원을 추가하도록 하여 제8조제4항의 규정에 의한 입찰적격자 선정범위에 해당되는지의 여부를 재심사하여야 하며, 잔존구성원만으로 또는 새로운 구성원을 추가하도록 하여 입찰적격자 선정범위에 해당되는 때에는 해당 공동수급체를 입찰에 참가하게 하여야 한다. 다만, 공동수급체대표자가 부도, 부정당업자제재, 영업정지, 입찰무효 등의 결격사유가 발생한 경우에는 해당 공동수급체를 입찰에 참가하게 하여서는 아니되며, 입찰이후에는 낙찰자 결정대상에서 제외하여야 한다. ③ 재심사결과의 통보에 대하여는 제9조의 규정을 준용한다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"부정한 방법으로 신청한 자의 처리","text":"제11조(부정한 방법으로 신청한 자의 처리) 계약담당공무원은 제4조의 규정에 따라 신청자가 제출한 서류가 부정하게 작성된 것으로 판명된 때에는 다음 각호의 기준에 의거 처리하여야 한다.1. 제8조제4항의 적격자를 선정하기 이전일 경우에는 입찰적격자선정대상에서 제외2. 입찰실시이전일 경우에는 입찰참가자격을 박탈","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"현장설명참가자격","text":"제12조(현장설명참가자격) 계약담당공무원은 제9조 또는 제10조의 규정에 의거 입찰적격자로 통보한 자에 한하여 시행령 제14조의2의 규정에 의한 현장설명에 참가하게 할 수 있다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"사전심사의 면제 등","text":"제13조(사전심사의 면제 등) ① 계약담당공무원은 해당공사와 동일한 종류의 공사를 이미 심사한 경우로서 신청자중 제8조제4항의 규정에 따라 입찰적격자로 선정된 자(제7조제2항의 규정에 의하여 적격요건을 상향조정한 경우에는 상향조정된 요건에 해당하는 자)에 대하여는 공사의 특성 등을 고려하여 1년 범위 내에서 사전심사를 면제할 수 있다. ② 계약담당공무원은 매건 자격심사마다 제9조제1항의 규정에 의거 작성된 명부에 등재된 자에 대한 사전심사를 면제할 것인지의 여부를 결정하여 제3조의 규정에 의거 열람하게 하여야 한다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"공동계약의 운용","text":"제14조(공동계약의 운용) ① 계약담당공무원은 사전심사방법으로 발주하는 공사의 경우에도 시행령 제72조의 규정에 따라 가능한 한 공동계약에 의하여 한다.② 제1항의 규정에 의한 공동계약의 경우 공동수급체에 대한 심사는 제6조 제2항 및 제5항을 고려하여 분야별ㆍ항목별로 다음 각호와 같이 실시하되, 공동수급체 구성원간의 시공능력, 실적, 기술보유상황 등의 보완을 위하여 공동계약을 하는 경우에는 이를 우대하여 제6조의 규정에 따른 심사기준을 작성할 수 있다. 1. 경영상태부문 : 공동수급체의 구성원별로 각각 신용평가등급으로 심사2. 기술적 공사이행능력부문가. 시공경험, 기술능력, 시공평가결과: 공동수급체 구성원별로 각각 시공경험, 기술능력 및 시공평가결과에 공사참여 지분율(이하 \"시공비율\"이라 한다)을 곱하여 산정한 후 이를 합산하여 산정한 평점으로 심사  나. 신인도 : 공동수급체 구성원별로 각각 산출한 점수에 시공비율을 곱하여 이를 합산③ 제2항1호에 의한 경영상태부문 평가시 구성원별로 각각 심사 후 적격요건을 충족시키지 못하는 구성원이 있는 공동수급체는 제8조제4항에 따른 입찰적격자 선정에서 제외한다.④ 계약담당공무원은 해당 공사의 성질, 내용 등을 고려하여 필요하다고 인정되는 경우에는 제2항제2호의 규정에도 불구하고 공동수급체의 구성원에 대한 기술적 공사이행능력부문 심사방법을 따로 정할 수 있다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"입찰가격공개 및 관리","text":"제15조(입찰가격공개 및 관리) 계약담당공무원은 사전심사방법으로 발주하는 공사중 시행령 제42조제4항의 규정에 의한 종합심사낙찰제 대상공사에 대하여는 입찰실시후 입찰자의 입찰가격을 전자조달시스템에 등재하고, 입찰자별 입찰가격 및 낙찰상황 등을 지속적으로 관리하여야 한다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"기타사항","text":"제16조(기타사항) 계약담당공무원은 사전심사를 함에 있어 이 예규에 규정되지 아니한 사항과 예규시행에 필요한 사항에 대하여는 세부기준을 작성하여 집행할 수 있다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-pq:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"재검토기한","text":"제17조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-pq","group":"입찰참가자격사전심사요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-gongdong","kind":"법령","type":"계약예규","family":"nca","label":"공동계약운용요령","name":"(계약예규) 공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제72조에 의한 공동계약의 체결방법과 기타 필요한 사항을 정함을 목적으로 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 예규에서 사용하는 용어의 정의는 다음과 같다.1. \"공동계약\"이라 함은 공사ㆍ제조ㆍ기타의 계약에 있어서 발주기관과 공동수급체가 체결하는 계약을 말한다.2. \"공동수급체\"라 함은 구성원을 2인 이상으로 하여 수급인이 해당계약을 공동으로 수행하기 위하여 잠정적으로 결성한 실체를 말한다.3. \"공동수급체 대표자\"라 함은 공동수급체의 구성원 중에서 대표자로 선정된 자를 말한다.4. \"공동수급협정서\"라 함은 공동계약에 있어서 공동수급체구성원 상호간의 권리ㆍ의무 등 공동계약의 수행에 관한 중요사항을 규정한 계약서를 말한다.5. \"주계약자\"라 함은 주계약자관리방식의 공동계약에서 공동수급체 구성원 중 전체 건설공사의 이행에 관하여 종합적인 계획ㆍ관리ㆍ조정을 하는 자를 말한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:2의2","kind":"조문","type":"계약예규","family":"nca","label":"제2조의2","title":"공동계약의 유형","text":"제2조의2(공동계약의 유형) 공동계약은 공동수급체가 도급받아 이행하는 방식에 따라 다음 각 호와 같이 구분한다.1. \"공동이행방식\"이라 함은 공동수급체 구성원이 일정 출자비율에 따라 연대하여 공동으로 계약을 이행하는 공동계약을 말한다.2. \"분담이행방식\"이라 함은 공동수급체 구성원이 일정 분담내용에 따라 나누어 공동으로 계약을 이행하는 공동계약을 말한다.3. \"주계약자관리방식\"이라 함은 「건설산업기본법」에 따른 건설공사를 시행하기 위한 공동수급체의 구성원중 주계약자를 선정하고, 주계약자가 전체 건설공사 계약의 수행에 관하여 종합적인 계획ㆍ관리 및 조정을 하는 공동계약을 말한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:2의3","kind":"조문","type":"계약예규","family":"nca","label":"제2조의3","title":"주계약자관리방식에 의한 공동계약","text":"제2조의3(주계약자관리방식에 의한 공동계약)","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"권리행사 및 의무의 이행","text":"제3조(권리행사 및 의무의 이행) 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)은 공동수급체의 구성원으로 하여금 이 예규 및 공동수급협정서에서 정하는 바에 따라 신의와 성실의 원칙에 입각하여 이를 이행하게 하여야 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"공동수급체 대표자의 선임","text":"제4조(공동수급체 대표자의 선임) ① 계약담당공무원은 공동수급체의 구성원으로 하여금 상호 협의하여 공동수급체 대표자를 선임하게 하되, 시행령 제36조에 의한 입찰공고 등에서 요구한 자격을 갖춘 업체를 우선적으로 선임하게 하여야 한다. 다만, 주계약자관리방식에 의한 공동계약의 경우에는 주계약자가 공동수급체의 대표자가 된다. ② 제1항에 의하여 선임된 공동수급체 대표자는 발주기관 및 제3자에 대하여 공동수급체를 대표한다.③ 계약담당공무원은 주계약자관리방식에서 대표자로 하여금 공사시방서ㆍ설계도면ㆍ계약서ㆍ예정공정표ㆍ품질보증계획 또는 품질시험계획ㆍ안전 및 환경관리계획ㆍ산출내역서 등에 의하여 품질 및 시공을 확인하게 하고 적정하지 못하다고 인정되는 경우에는 재시공지시 등 필요한 조치를 하게 하여야 한다. ④ 계약담당공무원은 주계약자관리방식에서 대표자로 하여금 공사 진행의 경제성 및 효율성 등을 감안하여 공동수급체 구성원과의 협의를 거쳐 자재 및 장비 등의 조달을 일원화하여 관리하게 하여야 한다. ⑤ 계약담당공무원은 시행령 제42조제4항에 의한 종합심사 낙찰제 대상공사 입찰의 경우에 공동수급체 대표자의 출자비율 또는 분담내용이 100분의 50이상이 되도록 하여야 한다. 다만, 주계약자관리방식에 의한 공동계약의 경우에는 공사의 내용 및 특성에 따라 분담내용을 정한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"공동수급협정서의 작성 및 제출","text":"제5조(공동수급협정서의 작성 및 제출) ① 계약담당공무원은 공동수급체 구성원으로 하여금 제8조에 의하여 입찰공고 내용에 명시된 공동계약의 이행방식에 따라 별첨 1(공동이행방식) 또는 별첨 2(분담이행방식) 또는 별첨 3(주계약자관리방식)의 공동수급표준협정서를 참고하여 공동수급협정서를 작성하게 하여야 한다. ② 계약담당공무원은 공동수급체 대표자로 하여금 제1항에 의하여 작성한 공동수급협정서를 「국가를 당사자로 하는 계약에 관한 법률 시행규칙」 제40조에 의한 입찰참가 신청서류 제출시 함께 제출토록 하여 이를 보관하여야 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"계약의 체결","text":"제6조(계약의 체결) 계약담당공무원은 공동계약 체결시 공동수급체구성원 전원이 계약서에 연명으로 기명날인 또는 서명토록 하여야 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"책임","text":"제7조(책임) ① 계약담당공무원은 공동수급체 구성원으로 하여금 발주자에 대한 계약상의 시공, 제조, 용역의무이행에 대하여 다음 각호에 따라 책임을 지도록 하여야 한다. 1. 공동이행방식에 의한 경우에 구성원은 연대하여 책임을 지도록 하여야 한다. 다만, 공사이행보증서가 제출된 공사로서 계약이행요건을 충족하지 못하는 업체는 출자비율에 따라 책임을 지도록 하여야 한다. 2. 분담이행방식에 의한 경우에 구성원은 분담내용에 따라 각자 책임을 지도록 하여야 한다. 3. 주계약자관리방식에 의한 경우에 구성원은 각자 자신이 분담한 부분에 대해서만 책임을 지되, 불이행시 그 구성원의 보증기관이 책임을 지며, 주계약자는 최종적으로 전체계약에 대하여 책임을 지되, 불이행시 주계약자의 보증기관이 책임을 진다. 다만, 주계약자가 탈퇴한 후에 주계약자의 계약이행의무 대행이 이루어지지 않은 경우에는 주계약자 이외의 구성원은 자신의 분담부분에 대하여 계약이행이 이루어지지 아니한 것으로 본다. ② 시행령 제76조제2항은 입찰참가자격의 제한사유를 발생시킨 자에 대하여 적용하며, 출자비율 또는 분담내용과 다르게 시공한 경우에는 해당 구성원에 대하여 적용한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"입찰공고","text":"제8조(입찰공고) ① 계약담당공무원은 입찰공고시 시행령 제72조제2항에 의하여 동일현장에 2인이상의 수급인을 투입하기 곤란하거나 긴급한 이행이 필요한 경우등 계약의 목적ㆍ성질상 공동계약에 의함이 곤란하다고 인정되는 경우를 제외하고는 가능한 한 공동계약이 가능하다는 뜻을 명시하여야 한다.② 계약담당공무원은 시행령 제72조제1항 또는 제3항에 따라 공동계약으로 발주하려는 경우에는 다음 각 호의 사항을 입찰공고에 명시하여야 한다. 1. 공동계약의 이행방식: 다음 각 방식 중 어느 하나로 한다. 가. 공동이행방식나. 분담이행방식다. 공동이행방식과 분담이행방식이 혼합된 방식2. 공동수급체 구성원의 자격제한 사항  ③ 입찰참가자는 제2항제1호 가목 또는 다목의 공동이행방식을 대신하여 주계약자관리방식으로 공동수급체를 구성하여 입찰에 참여할 수 있다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:8의2","kind":"조문","type":"계약예규","family":"nca","label":"제8조의2","title":"설비공사의 공동계약","text":"제8조의2(설비공사의 공동계약) ① 계약담당공무원은 「건설산업기본법시행령」 제7조에 의한 설비공사를 발주할 경우에는 설비제조업체와 시공업체간 분담이행방식에 의한 공동계약방법으로 입찰에 참가하게 할 수 있다. 다만, 단일 설비제조업체의 설비부분이 전체 추정가격의 50%이상일 경우에 한한다.② 계약담당공무원은 제1항의 공사를 시행령 제78조에 의하여 일괄입찰방식으로 발주할 경우에 설비제조업체, 시공업체 및 기술용역등록업체간 분담이행방식에 의한 공동계약방법으로 입찰에 참가하게 할 수 있다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"공동수급체의 구성","text":"제9조(공동수급체의 구성) ① 계약담당공무원은 공동수급체 구성원으로 하여금 해당계약을 이행하는데 필요한 면허ㆍ허가ㆍ등록 등의 자격요건을 갖추게 하여야 하며, 계약이행에 필요한 자격요건은 다음 각 호에 따라 구비되어야 한다. 1. 분담이행방식의 경우 : 구성원 공동2. 공동이행방식의 경우 : 구성원 각각3. 주계약자관리방식의 경우가. 주계약자 : 전체공사를 이행하는데 필요한 자격요건나. 구성원 : 분담공사를 이행하는데 필요한 자격요건② 계약담당공무원은 시행령 제21조제1항에 의한 시공능력, 공사실적, 기술보유상황 등은 「건설산업기본법」 등 관련법령에서 규정하고 있는 면허와 동일한 경우에는 공동수급체 구성원 모두의 것을 합산하여 적용한다. ③ 공동계약에 의하여 이행된 실적의 인정범위는 다음 각 호에 따라 배분한다.1. 분담이행방식에 의한 경우 : 공동수급체의 구성원별 분담부분2. 공동이행방식에 의한 경우가. 금액 : 공동수급체의 구성원별 출자비율에 해당되는 금액나. 규모 또는 양 : 실적증명 발급기관에서 공사의 성질상 공동수급체의 구성원별 실제 시공부분을 분리하여 구분할 수 있는 경우에는 실제 시공한 부분. 다만, 분리ㆍ구분할 수 없는 경우에는 출자비율에 따라 배분3. 주계약자관리방식에 의한 경우 가. 구성원 : 분담부분나. 주계약자 : 건설산업기본법 시행규칙 제23조 제6항에 의함(제10항)④ 계약담당공무원은 공동수급체구성원이 동일 입찰건에 대하여 공동수급체를 중복적으로 결성하여 입찰에 참가하게 하거나, 시행령 제72조제3항에 의한 공동계약의 경우와 주계약자관리방식에 의한 공동계약의 경우 「독점규제 및 공정거래에 관한 법률」에 의한 상호출자제한기업집단소속 계열회사간에 공동수급체를 구성하게 하여서는 아니된다. ⑤ 계약담당공무원은 공동계약의 유형별 구성원 수와 구성원별 계약참여 최소지분율을 다음 각 호에 따라 처리한다. 다만, 해당 계약의 특성 및 규모를 고려하여 계약담당공무원이 필요하다고 인정할 경우에는 공동계약의 유형별 구성원 수와 구성원별 계약참여 최소지분율을 각각 20% 범위내에서 가감할 수 있다.  가. 분담이행방식에 의한 경우 : 5인 이하나. 공동이행방식에 의한 경우 : 5인 이하, 10% 이상(단, 시행령 제6장 및 제8장에 따른 공사중 추정가격이 1,000억원 이상인 공사의 경우에는 10인 이하, 5% 이상) 다. 주계약자관리방식에 의한 경우 : 10인 이하, 5% 이상⑥ 제5항에도 불구하고 계약담당공무원은 시행령 제72조제3항에 따른 공동계약의 경우에 공사의 특성 등을 고려하여 지역업체의 최소지분율을 다음 각 호에 따라 정할 수 있으며, 이를 입찰공고에 명시하여야 한다.1. 시행령 제72조제3항제1호에 따른 공동계약 : 30% 이상2. 시행령 제72조제3항제2호에 따른 공동계약 가. 재정경제부 고시「국가를 당사자로 하는 계약에 관한 법률 시행령 제72조제3항제2호에 따른 공동계약 대상사업」(이하  이 예규에서 \"고시\"라 한다) 제1호에 따른 사업: 40% 이상(단, 시행령 제6장 및 제8장에 따른 공사의 경우에는 20% 이상)나. 고시 제2호에 따른 사업: 20% 이상⑦ 제6항제2호에 따른 공동수급체의 구성원이 되는 지역업체는 입찰공고일 현재 90일 이상 해당 공사현장을 관할하는 특별시ㆍ광역시 및 도에 법인등기부상 본점소재지가 소재한 업체이어야 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"보증금의 납부","text":"제10조(보증금의 납부) 공동수급체 구성원은 각종 보증금 납부시 공동수급협정서에서 정한 구성원의 출자비율 또는 분담내용에 따라 분할 납부하여야 한다. 다만, 공동이행방식 또는 주계약자관리방식에 의한 공동계약일 경우에는 공동수급체대표자 또는 공동수급체구성원중 1인으로 하여금 일괄 납부하게 할 수 있다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"대가지급","text":"제11조(대가지급) ① 계약담당공무원은 선금ㆍ대가 등을 지급함에 있어서는 공동수급체 구성원별로 구분 기재된 신청서를 공동수급체 대표자가 제출하도록 하여야 한다. 다만, 공동수급체 대표자가 부도, 파산 등의 부득이한 사유로 신청서를 제출할 수 없는 경우에는 공동수급체의 다른 모든 구성원의 연명으로 이를 제출하게 할 수 있다.② 계약담당공무원은 제1항에 의한 신청이 있을 경우에 신청된 금액을 공동수급체구성원 각자에게 지급하여야 한다. 다만, 선금은 주계약자관리방식에 의한 공동계약일 경우에는 제1항 단서의 경우를 제외하고는 공동수급체 대표자에게 지급하여야 한다. ③ 기성대가는 공동수급체의 대표자 및 각 구성원의 이행내용에 따라 지급하여야 한다. 이 경우에 준공대가 지급시에는 구성원별 총 지급금액이 준공당시 공동수급체구성원의 출자비율 또는 분담내용과 일치하여야 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"공동도급내용의 변경","text":"제12조(공동도급내용의 변경) ① 계약담당공무원은 공동계약을 체결한 후 공동수급체구성원의 출자비율 또는 분담내용을 변경하게 할 수 없다. 다만, 시행령 제64조내지 제66조에 의한 계약내용의 변경이나 파산, 해산, 부도, 법정관리, 워크아웃(기업구조조정촉진법에 따라 채권단이 구조조정 대상으로 결정하여 구조조정중인 업체), 중도탈퇴의 사유로 인하여 당초 협정서의 내용대로 계약이행이 곤란한 구성원이 발생하여 공동수급체구성원 연명으로 출자비율 또는 분담내용의 변경을 요청한 경우와 제12조제4항의 경우에는 그러하지 아니하다. ② 계약담당공무원은 제1항 단서에 의하여 공동수급체 구성원의 출자비율 또는 분담내용의 변경을 승인함에 있어 구성원 각각의 출자지분 또는 분담내용 전부를 다른 구성원에게 이전하게 하여서는 아니된다. 다만, 주계약자관리방식에서 공동수급체 구성원중 일부가 파산, 해산, 부도 등으로 계약을 이행할 수 없는 사유 등으로 공동수급체 구성원의 출자비율 또는 분담내용의 변경을 승인하는 경우에는 그러하지 아니하다. ③ 계약담당공무원은 공동수급체 구성원을 추가하게 할 수 없다. 다만, 계약내용의 변경이나 공동수급체 구성원의 파산, 해산, 부도, 법정관리, 워크아웃(기업구조조정촉진법에 따라 채권단이 구조조정 대상으로 결정하여 구조조정중인  업체), 중도탈퇴의 사유로 인하여 잔존구성원만으로는 면허, 시공능력 및 실적 등 계약이행에 필요한 요건을 갖추지 못할 경우로서 공동수급체구성원 연명으로 구성원의 추가를 요청한 경우에는 그러하지 아니한다. ④ 주계약자관리방식에서 주계약자는 구성원이 정당한 사유없이 계약을 이행하지 아니하거나 지체하여 이행하는 경우 또는 주계약자의 계획ㆍ관리 및 조정 등에 협조하지 않아 계약이행이 곤란하다고 판단되는 경우에는 구성원의 출자비율 또는 분담내용, 해당 구성원을 변경할 수 있다. 이 경우에 주계약자는 변경사유와 변경내용 등을 계약담당공무원에게 통보하여야 하며, 계약담당공무원은 주계약자의 변경내용이 계약의 원활한 이행을 저해하지 않는 한 승인해야 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"공동수급체 구성원의 제재","text":"제13조(공동수급체 구성원의 제재) ① 계약담당공무원은 공사 착공시까지 공동수급체 구성원별 출자비율 또는 분담내용에 따른 다음 각 호의 내용이 포함된 공동계약이행계획서(이하 \"계약이행계획서\"라 한다)를 제출하게 하여 승인을 받도록 하여야 한다.1. 구성원별 이행부분 및 내역서(이행부분을 구분하지 아니하는 경우에는 제외)2. 구성원별 투입 인원ㆍ장비 등 목록 및 투입시기3. 그 밖의 발주기관이 요구하는 사항② 계약담당공무원은 공동수급체구성원이 연명으로 출자비율 또는 분담내용을 준수하는 범위내에서 제1항에 의한 계약이행계획서의 변경에 대한 승인을 요청하는 때에는 공사의 적정한 이행을 위하여 필요하다고 인정되는 경우에 한하여 이를 승인할 수 있다.③ 계약담당공무원은 주계약자관리방식에 의한 공동계약의 경우에 주계약자 이외의 공동수급체의 구성원 자신이 분담한 부분을 직접 시공하게 하여야 한다. 다만, 공동수급체 구성원이 종합건설업자인 경우에는 다른 법령이나 시공품질의 향상 및 현장사정 등 불가피한 사유가 있는 경우에는 주계약자와 합의하여 하도급을 승인할 수 있다. ④ 주계약자관리방식에 의한 경우로서 주계약자는 직접시공에는 참여하지 않더라도 시공관리, 품질관리, 하자관리, 공정관리, 안전관리, 환경관리 등 시공의 종합적인 계획ㆍ관리 및 조정에만 참여하는 경우에도 이를 계약이행으로 본다. ⑤ 각 중앙관서의 장은 공동수급체 구성원 중 정당한 이유없이 계약이행계획서에 따라 실제 계약이행에 참여하지 아니하는 구성원(단순히 자본참여만을 한 경우 등을 포함) 또는 출자비율 또는 분담내용과 다르게 시공하는 구성원 또는 주계약자관리방식에서 주계약자이외의 구성원이 발주기관의 사전서면 승인없이 직접 시공하지 않고 하도급한 경우에 법률 제27조제1항제3호 또는 시행령 제76조제2항제2호 가목에 의한 입찰참가자격제한조치를 하여야 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongdong:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"재검토기한","text":"제14조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-gongdong","group":"공동계약운용요령","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-hyeopsang","kind":"법령","type":"계약예규","family":"nca","label":"협상에의한계약체결기준","name":"(계약예규) 협상에 의한 계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는 「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제43조 및 제43조의2에 의한 협상에 의한 계약의 체결에 필요한 사항을 정함을 목적으로 한다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 기준에서 사용하는 용어의 정의는 다음과 같다.1. ‘제안요청서’라 함은 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)이 협상에 의한 계약의 입찰에 참가하고자 하는 자에게 제안서의 제출을 요청하기 위하여 교부 또는 열람하게 하는 서류를 말한다.2. ‘제안서’라 함은 협상에 의한 계약의 입찰에 참가하고자 하는 자가 제안요청서 또는 입찰공고에 따라 작성하여 계약담당공무원에게 제출하는 서류를 말한다.3. ‘협상적격자’라 함은 제안서의 평가결과에 따라 협상에 의한 계약의 협상대상자가 될 수 있는 자격을 갖춘 자를 말한다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"적용범위","text":"제3조(적용범위) 이 기준은 계약담당공무원이 시행령 제43조제1항 및 제43조의2제1항에 의한 계약을 체결하는 경우에 적용한다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"입찰공고","text":"제4조(입찰공고) ① 계약담당공무원은 제안서 제출마감일의 전일부터 기산하여 40일 전에 입찰공고를 하여야 한다. 다만, 긴급한 경우, 추정가격이 고시금액 미만인 경우 및 시행령 제20조제2항에 따른 재공고입찰인 경우에는 제안서 제출마감일의 전일부터 기산하여 10일전까지 공고할 수 있다.② 입찰공고에는 다음 각 호의 사항을 명시하여야 한다.1. 사업명, 사업내용, 사업기간, 사업예산2. 해당 계약이 협상에 의한 계약이라는 사실3. 제안요청서의 요청기한 및 요청에 필요한 서류4. 시행령 제43조제5항에 따라 제안요청서에 대한 설명을 실시하는 경우에는 그 장소(화상 방식 등 전자적 방식에 의할 경우 정보처리장치에 대한 접속방법)ㆍ일시에 관한 사항  5. 협상에 의한 계약체결에 필요한 기준 및 절차6. 제안서의 제출기간7. 제안서의 내용8. 제안서의 평가요소 및 평가방법(제7조제2항에 따라 분야별 배점한도를 10점 범위내에서 조정하는 경우에는 그 사유를 포함한다)9. 제7조제6항에 따라 기술능력평가를 실시하는지 여부와 평가점수 부여기준 10. 제7조의2 제2항에 따라 가격의 적정성 평가를 실시하는지 여부와 적정성 평가대상의 기준이 되는 금액 11. 제안서 평가시 제안서에 대한 설명을 실시하는 경우 그 장소(화상평가 등 전자적 방식에 의한 평가의 경우 해당 정보처리장치에 대한 접속방법)ㆍ일시에 관한 사항  12. 기타 계약담당공무원이 필요하다고 인정하는 사항","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"제안요청서의 교부 또는 열람 등","text":"제5조(제안요청서의 교부 또는 열람 등) ①계약담당공무원은 입찰에 참가하고자 하는 자에게 제안요청서를 교부하여야 한다.② 계약담당공무원은 제안요청서 등 필요한 서류를 시행령 제14조제3항에 의한 전자조달시스템에 게재함으로써 제1항에 따른 제안요청서 등 필요한 서류의 교부에 갈음할 수 있다.③ 계약담당공무원은 사업내용이 비교적 단순하여 제1항 및 제2항에 의한 제안요청서의 교부 또는 열람이 불필요하다고 인정되는 경우에는 제안요청서의 교부 또는 열람을 생략하고, 바로 제안서를 제출하게 할 수 있다. 이 경우에는 입찰공고에 사업내용 등 제안서 작성에 필요한 사항을 명시하여야 한다. ④ 계약담당공무원은 계약의 성질ㆍ규모 등을 고려하여 필요하다고 인정하는 경우에는 제안요청서 등에 대한 설명을 할 수 있다. ⑤ 제안요청서에는 다음 각 호의 사항을 명시하여야 한다.1. 과업내용2. 요구사항3. 계약조건4. 평가요소와 평가방법5. 제안서의 규격6. 기타 필요한 사항","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"제안서 등의 제출","text":"제6조(제안서 등의 제출) ① 협상에 의한 계약에 참가하고자 하는 자는 제4조에 의한 입찰공고 또는 제5조에 의한 제안요청서에 정한 바에 따라 제안서(제7조의2 제2항에 따른 기준금액 미만으로 입찰하려는 자의 경우 원가절감에 대한 제안을 포함한다) 및 가격 입찰서를 별도로 작성하여 계약담당공무원에게 제출하여야 한다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"제안서의 평가","text":"제7조(제안서의 평가) ① 제안서는 기술능력과 입찰가격을 종합적으로 평가하며, 평가항목 및 배점한도는 별표와 같다② 각 중앙관서의 장은 제1항에 의한 평가항목 및 배점한도를 기준으로 세부평가기준을 정할 수 있다. 이 경우에는 사업의 특성ㆍ목적ㆍ내용 및 요구되는 전문성ㆍ기술성 정도 등을 고려하여 필요한 때에는 기술 중시형, 기술ㆍ가격 균형형, 가격 중시형으로 구분하여 별표의 분야별 배점한도를 20점의 범위 내에서 가ㆍ감 조정할 수 있으며, 평가항목을 추가하거나 제외할 수 있다. 다만, 배점한도에 대하여 20점의 범위를 초과하여 가ㆍ감 조정할 경우에는 재정경제부장관과 협의하여야 한다. ③ 제안서의 평가에 있어서 필요한 서류가 첨부되어 있지 않거나 제출된 서류가 불명확하여 인지할 수 없는 경우에는 제안서 내용의 변경이 없는 경미한 사항에 한하여 기한을 정하여 보완을 요구하여야 한다.④ 제3항에 의하여 보완요구한 서류가 기한까지 제출되지 아니한 경우에는 당초 제출된 서류만으로 평가하고, 당초 제출된 서류가 불명확하여 심사가 불가능한 경우에는 평가에서 제외한다.⑤ 각 중앙관서의 장 또는 계약담당공무원은 제1항에 따라 제안서를 평가하는 경우에는 시행령 제43조제8항에 의한 제안서평가위원회(이하 \"위원회\"라고 함)의 심의를 거쳐야 한다. 다만, 기술능력 평가 중 수행실적, 경영상태 등 정량적 지표에 의한 평가항목은 계약담당공무원이 제16조에 따른 세부기준에 따라 평가한다. ⑥ 계약담당공무원은 제1항에 따라 제안서를 평가함에 있어서 해당산업의 특성, 최근 동종사업에 대한 낙찰률, 제안서 평가 점수 분포 등을 고려할 때, 기술능력평가의 변별력을 확보하기 어렵다고 판단되는 계약에 대하여는 제5항에 따른 제안서 평가점수에 따라 입찰자의 순위를 정하고, 입찰자의 순위에 따라 고정점수를 부여하는 차등점수제를 적용하여야 한다. ⑦ 각 중앙관서의 장은 순위별 점수부여 기준 등 제6항에 따른 차등점수제의 세부 절차 및 기준을 정하여 운용할 수 있다. ⑧ 제5항에 의한 위원회는 소속공무원, 해당사업 및 계약에 관한 학식과 경험이 풍부한 자 등으로 구성하며, 위원회의 구성 및 운영에 관하여 필요한 세부사항은 각 중앙관서의 장이 정한다.⑨ 계약담당공무원은 평가위원회의 요청이 있는 경우에는 제안서를 제출한 자에게 보완자료 등 평가에 필요한 자료를 제출하게 할 수 있다.⑩ 각 중앙관서의 장은 제안서평가 종료 후 전자조달시스템 또는 발주기관의 정보처리장치를 이용하여 평가위원 명단과 위원별ㆍ항목별 평가점수를 공개하여야 한다. 다만 평가의 공정성 확보를 위하여 필요하다고 인정되는 경우에는 평가위원 실명은 공개하지 아니할 수 있다. ⑪ 제10항 본문에도 불구하고 각 중앙관서의 장은 제안서 평가결과에 개인정보, 영업비밀 및 다른 법령에 따라 공개가 제한되는 정보가 포함되어 있을 경우 평가결과의 일부 또는 전부를 공개하지 아니할 수 있다. 이 경우 전자조달시스템 또는 발주기관의 정보처리장치에 제안서 평가결과를 공개하지 않는다는 취지와 그 사유를 게재하여야 한다. ⑫ 각 중앙관서의 장 또는 계약담당공무원은 제5항에 따라 위원회가 제안서를 평가함에 있어 화상평가 등 전자적 방식에 의한 평가를 실시하도록 할 수 있다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:7의2","kind":"조문","type":"계약예규","family":"nca","label":"제7조의2","title":"입찰가격 개봉 및 평가","text":"제7조의2(입찰가격 개봉 및 평가) ① 계약담당공무원은 제7조에 의한 제안서 평가 후 지체없이 입찰참가자가 참석한 자리에서 봉함된 가격입찰서를 개봉하고 입찰가격에 대한 평가를 실시하여야 한다② 제1항에도 불구하고 기술평가의 변별력을 확보할 필요성이 높은 계약에 대하여는 계약의 특성 및 사업내용 등을 고려하여 계약담당공무원이 입찰공고시 명시한 기준금액 미만의 입찰자에 대하여는 원가절감의 적정성을 심사할 수 있다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"협상적격자 및 협상순위의 선정","text":"제8조(협상적격자 및 협상순위의 선정) ① 계약담당공무원은 제7조에 따른 제안서 평가결과, 입찰가격이 해당 사업예산(예정가격을 작성한 경우에는 예정가격) 이하인 자로서 기술능력평가 점수가 기술능력평가분야 배점한도의 85% 이상인 자를 협상적격자로 선정한다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"가격의 협상","text":"제12조(가격의 협상) ① 협상대상자와의 가격협상시 기준가격은 해당 사업예산(예정가격을 작성한 경우에는 예정가격)이하로서 협상대상자가 제안한 가격으로 한다② 계약담당공무원은 협상대상자가 제안한 내용을 가감하는 경우에는 그 가감되는 내용에 상당하는 금액을 해당 사업예산(예정가격을 작성한 경우에는 예정가격) 범위 내에서 조정할 수 있다. 다만, 제안한 내용의 가감조정이 없는 경우에는 가격협상시 협상대상자가 제안한 가격을 증감조정할 수 없다.③ 제1항 및 제2항에 의한 가격협상을 위하여 예정가격을 작성하는 경우에는 제6조에 의한 제안서제출전까지 시행령 제9조에 따라 작성하여야 하며, 입찰에 참가한 자의 제안가격 등을 기준으로 작성하여서는 아니된다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"협상기간","text":"제13조(협상기간) ① 계약담당공무원은 협상기간과 대상 등을 협상대상자에게 통보하여야 하며, 협상기간은 협상대상자에게 통보된 날로부터 15일 이내로 한다. 다만, 해당 사업의 규모, 특수성, 난이도 등에 따라 협상대상자와의 협의에 의하여 5일의 범위내에서 조정할 수 있다. ② 제1항에서 정한 기간 내에 협상이 이루어지지 않을 경우에는 10일의 범위내에서 연장 할 수 있다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"협상결과의 통보","text":"제14조(협상결과의 통보) 계약담당공무원은 협상이 성립되면 그 결과를 해당 협상대상자 및 다른 협상적격자에게 서면으로 통보하여야 한다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"계약체결 및 이행","text":"제15조(계약체결 및 이행) ① 계약담당공무원은 협상이 성립된 후 10일이내에 계약을 체결하여야 한다② 계약의 체결 및 이행에 관하여는 제14조에 의하여 서면통보한 협상결과와 「국가를 당사자로 하는 계약에 관한 법률」, 시행령 및 시행규칙과 이에 근거한 계약의 일반조건, 특수조건, 입찰유의서 및 일반원칙에 따른다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"세부기준의 제정","text":"제16조(세부기준의 제정) ① 각 중앙관서의 장은 이 기준에 따라 협상에 의한 계약을 체결함에 있어 필요한 세부기준을 정하여 운용할 수 있다② 각 중앙관서의 장은 제1항에 따라 세부기준을 정하려는 경우 기술능력 평가는 정량적 평가항목과 정성적 평가항목으로 구분하여 정하여야 한다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-hyeopsang:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"재검토기한","text":"제17조(재검토기한) 「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2016년 1월 1일 기준으로 매3년이 되는 시점(매 3년째의 12월 31일까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-hyeopsang","group":"협상에의한계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-daehwa","kind":"법령","type":"계약예규","family":"nca","label":"경쟁적대화계약체결기준","name":"(계약예규) 경쟁적대화에 의한 계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"목적","text":"제1조(목적) 이 예규는「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제43조의3에 의한 경쟁적 대화에 의한 계약 체결에 필요한 사항을 정함을 목적으로 한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 기준에서 사용하는 용어의 정의는 다음과 같다.1. ‘기본 제안요청서’라 함은 계약담당공무원(각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다. 이하 같다)이 경쟁적 대화에 의한 계약의 입찰에 참가하고자 하는 자에게 기본 제안서의 제출을 요청하기 위하여 교부 또는 열람하게 하는 서류를 말한다.2. ‘최종 제안요청서’라 함은 경쟁적 대화 참여적격자로 선정되어 경쟁적 대화과정에 참여한 자에게 최종 제안서의 제출을 요청하기 위하여 교부 또는 열람하게 하는 서류를 말한다.3. ‘기본 제안서’라 함은 경쟁적 대화에 의한 계약의 입찰에 참가하고자 하는 자가 기본 제안요청서 또는 입찰공고에 따라 작성하여 계약담당공무원에게 제출하는 서류를 말한다.4. ‘최종 제안서’라 함은 경쟁적 대화과정에 참여한 자가 최종제안요청서에 따라 작성하여 계약담당공무원에게 제출하는 서류를 말한다.5. ‘참여적격자’라 함은 기본 제안서의 평가결과에 따라 경쟁적 대화에 참여할 대상자로 선정된 자를 말한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"적용범위","text":"제3조(적용범위) 이 기준은 계약담당공무원이 시행령 제43조의3에 의한 계약을 체결하는 경우에 적용한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"입찰공고","text":"제4조(입찰공고) ① 계약담당공무원은 기본 제안서 제출마감일의 전일부터 기산하여 40일 전에 입찰공고를 하여야 한다. 다만, 긴급한 경우, 추정가격이 고시금액 미만인 경우 및 시행령 제20조제2항에 따른 재공고입찰인 경우에는 제안서 제출마감일의 전일부터 기산하여 10일전까지 공고할 수 있다. ② 입찰공고에는 다음 각 호의 사항을 명시하여야 한다.1. 사업명, 사업내용, 사업기간, 사업예산2. 해당 계약이 경쟁적 대화에 의한 계약이라는 사실3. 기본 제안요청서의 요청기한 및 요청에 필요한 서류4. 시행령 제43조제5항을 준용하여 기본 제안요청서에 대한 설명을 실시하는 경우에는 그 장소ㆍ일시에 관한 사항 5. 경쟁적 대화에 의한 계약체결에 필요한 기준 및 절차6. 기본 제안서의 제출기간7. 기본 제안서의 내용8. 기본 제안서의 평가요소 및 평가방법9. 기본 제안서 평가를 통해 경쟁적 대화에 참여시킬 참여자 수10. 기타 계약담당공무원이 필요하다고 인정하는 사항","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"기본 제안요청서의 교부 또는 열람 등","text":"제5조(기본 제안요청서의 교부 또는 열람 등) ① 계약담당공무원은 입찰에 참가하고자 하는 자에게 기본 제안요청서를 교부하여야 한다.② 계약담당공무원은 기본 제안요청서 등 필요한 서류를 「전자조달의 이용 및 촉진에 관한 법률」 제2조제4호에 따른 국가종합전자조달시스템(이하 \"전자조달시스템\"이라 한다)에 게재함으로써 제1항에 따른 기본 제안요청서 등 필요한 서류의 교부에 갈음할 수 있다.③ 계약담당공무원은 계약의 성질ㆍ규모 등을 고려하여 필요하다고 인정하는 경우에는 기본 제안요청서 등에 대한 설명을 할 수 있다 ④ 기본 제안요청서에는 다음 각 호의 사항을 명시하여야 한다.1. 과업내용2. 요구사항3. 경쟁적 대화 참여적격자 선정을 위한 평가요소와 평가방법4. 기본 제안서의 규격5. 기타 필요한 사항","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"경쟁적 대화 참가신청","text":"제6조(경쟁적 대화 참가신청) 경쟁적 대화에 의한 계약에 참가하고자 하는 자는 제4조에 의한 입찰공고 또는 제5조에 의한 기본 제안요청서에 정한 바에 따라 기본 제안서를 작성하여 계약담당공무원에게 제출함으로써 경쟁적 대화 참가 신청을 갈음한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"참여적격자 선정","text":"제7조(참여적격자 선정) 계약담당공무원은 제5조 제4항 제3호에 의한 평가요소와 평가방법에 따라 제6조의 기본 제안서를 평가하여 경쟁적 대화과정에 참여할 자를 2인이상 선정하고, 선정된 자에게 이를 통보하여야 한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"경쟁적 대화 절차","text":"제8조(경쟁적 대화 절차) ① 계약담당공무원은 경쟁적 대화과정에 참여한 자들과 각각 2회 이상 과업에 대한 기술적 ㆍ 재무적 요구내용에 대하여 대화하여야 한다.② 계약담당공무원은 대화참여자가 경쟁적 대화 과정에서 제시한 기술적 사항을 확인하기 위해 대화참여자의 사업지에 대해 현장점검을 실시할 수 있으며, 현장점검 내용을 최종 제안서 평가에 반영할 수 있다.③ 계약담당공무원은 대화참여자와의 대화내용 중 대화참여자가 요구하여 비공개하기로 합의한 사항에 대하여는 다른 참여자나 제3자에게 누설하여서는 아니된다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"최종 제안요청서의 교부 및 열람","text":"제9조(최종 제안요청서의 교부 및 열람) ① 계약담당공무원은 경쟁적 대화과정에 참여한 자를 대상으로 최종 제안요청서를 교부할 수 있다.② 계약담당공무원은 최종 제안요청서 등 필요한 서류를 「전자조달의 이용 및 촉진에 관한 법률」 제2조제4호에 따른 전자조달시스템에 게재함으로써 제1항에 따른 최종 제안요청서 등 필요한 서류의 교부에 갈음할 수 있다.③ 최종 제안요청서에는 다음 각 호의 사항을 명시하여야 한다.1. 최종 과업내용2. 최종 요구사항3. 낙찰자 선정을 위한 평가요소와 평가방법4. 최종 제안서의 규격5. 기타 필요한 사항","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"최종제안서 등의 제출","text":"제10조(최종제안서 등의 제출) ① 경쟁적 대화 참여적격자로 선정되어 최종제안서를 제출하고자 하는 자는 제9조에 의한 최종 제안요청서에 정한 바에 따라 최종 제안서를 작성하여 가격입찰서와 함께 계약담당공무원에게 제출하여야 한다.② 계약담당공무원은 입찰참가자의 가격입찰서 모두를 함께 봉함하여 개봉시까지 보관하여야 한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"최종 제안서의 평가","text":"제11조(최종 제안서의 평가) ① 최종 제안서는 기술능력과 입찰가격을 종합적으로 평가하며, 평가항목 및 배점한도는 별표와 같다.② 각 중앙관서의 장은 제1항에 의한 평가항목 및 배점한도를 기준으로 세부평가기준을 정할 수 있다. 이 경우에는 사업의 특성ㆍ목적 및 내용 등을 고려하여 필요한 때에는 분야별 배점한도를 5점의 범위 내에서 가ㆍ감조정할 수 있으며, 평가항목을 추가하거나 제외할 수 있다. 다만, 배점한도를 5점의 범위를 초과하여 가ㆍ감조정할 경우에는 재정경제부장관과 협의하여야 한다.③ 최종 제안서의 평가에 있어서 필요한 서류가 첨부되어 있지 않거나 제출된 서류가 불명확하여 인지할 수 없는 경우에는 제안서 내용의 변경이 없는 경미한 사항에 한하여 기한을 정하여 보완을 요구하여야 한다.④ 제3항에 의하여 보완요구한 서류가 기한까지 제출되지 아니한 경우에는 당초 제출된 서류만으로 평가하고, 당초 제출된 서류가 불명확하여 심사가 불가능한 경우에는 평가에서 제외한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"제안서평가위원회","text":"제12조(제안서평가위원회) ① 각 중앙관서의 장 또는 계약담당공무원은 제안서를 평가하는 경우에는 시행령 제43조의3제6항에 따라 시행령 제43조제8항에 의한 제안서평가위원회(이하 \"위원회\"라고 함)의 심의를 거쳐야 한다.② 제1항에 의한 위원회는 소속공무원, 해당사업 및 계약에 관한 학식과 경험이 풍부한 자 등으로 구성하며, 위원회의 구성 및 운영에 관하여 필요한 세부사항은 각 중앙관서의 장이 정한다.③ 계약담당공무원은 평가위원회의 요청이 있는 경우에는 제안서를 제출한 자에게 보완자료 등 평가에 필요한 자료를 제출하게 할 수 있다.④ 각 중앙관서의 장은 전자조달시스템 또는 발주기관의 정보처리장치를 통해 제1항에 의한 위원회의 위원별 제안서 평가결과를 공개하여야 한다. 다만, 위원의 실명은 공개하지 아니할 수 있다.⑤ 제4항 본문에도 불구하고 각 중앙관서의 장은 제안서 평가결과에 개인정보, 영업비밀 및 다른 법령에 따라 공개가 제한되는 정보가 포함되어 있을 경우 평가결과의 일부 또는 전부를 공개하지 아니할 수 있다. 이 경우 전자조달시스템 또는 발주기관의 정보처리장치에 제안서 평가결과를 공개하지 않는다는 취지와 그 사유를 게재하여야 한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"낙찰자의 선정","text":"제13조(낙찰자의 선정) ① 계약담당공무원은 최종제안서 제출자 중에서 제11조에 따른 제안서 평가결과 기술능력평가와 입찰가격 평가를 합산한 점수가 가장 높은 자를 낙찰자로 선정한다.② 제1항에도 불구하고 계약담당공무원은 입찰금액이 총사업예산(예정가격을 작성한 경우에는 예정가격)을 초과하는 경우에는 예산의 범위안으로 가격을 조정하기 위하여 그 입찰자와 협의하여야 하며 협의가 성립되지 아니할 때에는 합계점수 차순위 자를 낙찰자로 결정한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"낙찰자에 대한 통보","text":"제14조(낙찰자에 대한 통보) 계약담당공무원은 제13조에 의하여 낙찰자가 결정된 경우에는 지체없이 낙찰자에게 낙찰사실을 통보하여야 한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"계약체결 및 이행","text":"제15조(계약체결 및 이행) ① 계약담당공무원은 낙찰후 10일이내에 계약을 체결하여야 한다.② 계약의 체결 및 이행에 관하여는 최종 제안요청서, 낙찰자가 제출한 최종제안서와 「국가를 당사자로 하는 계약에 관한 법률」, 시행령 및 시행규칙과 이에 근거한 계약의 일반조건, 특수조건, 입찰유의서 및 일반원칙에 따른다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"경쟁적 대화 참여비용의 지급","text":"제16조(경쟁적 대화 참여비용의 지급) ① 계약담당공무원은 다음 각호의 어느 하나에 해당하는 자에게 전체 사업예산의 15/1,000에 해당되는 금액의 범위 내에서 평가 순위에 따라 분할 배분하여 보상할 수 있다. 다만, 제2호의 경우 평가가 이루어지지 않은 경우에는 균분하여 보상할 수 있다.1. 최종제안서를 제출한 후 최종 낙찰에 탈락한 자로서 제11조에 따른 제안서 평가 중 기술능력평가점수가 각 중앙관서의 장이 정한 점수를 초과하는 자2. 발주기관의 귀책사유에 따라 경쟁적 대화에 따른 계약 절차가 중단된 경우로서 2회 이상 경쟁적 대화에 참여한 자② 각 중앙관서의 장은 제1항의 보상에 있어 세부기준을 정하여 운용할 수 있다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"세부기준의 제정","text":"제17조(세부기준의 제정) 각 중앙관서의 장은 이 기준에 따라 경쟁적 대화에 의한 계약을 체결함에 있어 필요한 세부기준을 정하여 운용할 수 있다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-daehwa:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"재검토기한","text":"제18조 (재검토기한) 이 예규는「훈령ㆍ예규 등의 발령 및 관리에 관한 규정」에 따라 이 예규에 대하여 2019년 1월1일을 기준으로 매3년이 되는 시점(매3년째의 12월31까지를 말한다)마다 그 타당성을 검토하여 개선 등의 조치를 하여야 한다.","lawId":"ye-daehwa","group":"경쟁적대화계약체결기준","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"law:ye-gongsa-gen","kind":"법령","type":"계약예규","family":"nca","label":"공사계약일반조건","name":"(계약예규) 공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:1","kind":"조문","type":"계약예규","family":"nca","label":"제1조","title":"총칙","text":"제1조(총칙) 계약담당공무원과 계약상대자는 공사도급표준계약서(이하 \"계약서\"라 한다)에 기재한 공사의 도급계약에 관하여 제3조에 의한 계약문서에서 정하는 바에 따라 신의와 성실의 원칙에 입각하여 이를 이행한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:2","kind":"조문","type":"계약예규","family":"nca","label":"제2조","title":"정의","text":"제2조(정의) 이 조건에서 사용하는 용어의 정의는 다음과 같다.1. \"계약담당공무원\"이라 함은  「국가를 당사자로 하는 계약에 관한 법률 시행규칙」(이하 \"시행규칙\"이라 한다) 제2조에 의한 공무원을 말한다. 이 경우에 각 중앙관서의 장이 계약에 관한 사무를 그 소속공무원에게 위임하지 아니하고 직접 처리하는 경우에는 이를 계약담당공무원으로 본다.2. \"계약상대자\"라 함은 정부와 공사계약을 체결한 자연인 또는 법인을 말한다.3. \"공사감독관\"이라 함은 제16조에 규정된 임무를 수행하기 위하여 정부가 임명한 기술담당공무원 또는 그의 대리인을 말한다. 다만, 「건설기술 진흥법」 제39조제2항 또는 「전력기술관리법」 제12조 및 그 밖에 공사 관련 법령에 의하여 건설사업관리 또는 감리를 하는 공사에 있어서는 해당공사의 감리를 수행하는 건설산업관리기술자 또는 감리원을 말한다. 4. \"설계서\"라 함은 공사시방서, 설계도면, 현장설명서, 공사기간의 산정근거(「국가를 당사자로 하는 계약에 관한 법률 시행령」(이하 \"시행령\"이라 한다) 제6장 및 제8장의 계약 및 현장설명서를 작성하는 공사는 제외한다) 및 공종별 목적물 물량내역서(가설물의 설치에 소요되는 물량 포함하며, 이하 \"물량내역서\"라 한다)를 말하며, 다음 각 목의 내역서는 설계서에 포함하지 아니한다. 가. 나. 시행령 제78조에 따라 일괄입찰을 실시하여 체결된 공사와 대안입찰을 실시하여 체결된 공사(대안이 채택된 부분에 한함)의 산출내역서다. 시행령 제98조에 따라 실시설계 기술제안 입찰을 실시하여 체결된 공사와 기본설계 기술제안입찰을 실시하여 체결된 공사의 산출내역서 라. 수의계약으로 체결된 공사의 산출내역서. 다만, 시행령 제30조제2항 본문에 따라 체결된 수의계약 공사의 물량내역서는 제외5. \"공사시방서\"라 함은 공사에 쓰이는 재료, 설비, 시공체계, 시공기준 및 시공기술에 대한 기술설명서와 이에 적용되는 행정명세서로서, 설계도면에 대한 설명 또는 설계도면에 기재하기 어려운 기술적인 사항을 표시해 놓은 도서를 말한다.6. \"설계도면\"이라 함은 시공될 공사의 성격과 범위를 표시하고 설계자의 의사를 일정한 약속에 근거하여 그림으로 표현한 도서로서 공사목적물의 내용을 구체적인 그림으로 표시해 놓은 도서를 말한다.7. \"현장설명서\"라 함은 시행령 제14조의2에 의한 현장설명 시 교부하는 도서로서 시공에 필요한 현장상태 등에 관한 정보 또는 단가에 관한 설명서 등을 포함한 입찰가격 결정에 필요한 사항을 제공하는 도서를 말한다.8. \"물량내역서\"라 함은 공종별 목적물을 구성하는 품목 또는 비목과 동 품목 또는 비목의 규격ㆍ수량ㆍ단위 등이 표시된 다음 각 목의 내역서를 말한다.가. 시행령 제14조제1항에 따라 계약담당공무원 또는 입찰에 참가하려는 자가 작성한 내역서 나. 시행령 제30조제2항 및 계약예규 「정부입찰ㆍ계약 집행기준」 제10조제3항에 따라 견적서제출 안내공고 후 견적서를 제출하려는 자에게 교부된 내역서9. \"산출내역서\"라 함은 입찰금액 또는 계약금액을 구성하는 물량, 규격, 단위, 단가 등을 기재한 다음 각 목의 내역서를 말한다.가. 시행령 제14조제6항과 제7항에 따라 제출한 내역서나. 시행령 제85조제2항과 제3항에 따라 제출한 내역서다. 시행령 제103조제1항과 제105조제3항에 따라 제출한 내역서라. 수의계약으로 체결된 공사의 경우에는 착공신고서 제출 시까지 제출한 내역서10. 이 조건에서 따로 정하는 경우를 제외하고는 「국가를 당사자로 하는 계약에 관한 법률 시행령」, 「특정조달을 위한 국가를 당사자로 하는 계약에 관한 법률 시행령 특례규정」(이하 각각 \"시행령\", \"특례규정\"이라 한다), 시행규칙 및 계약예규 공사입찰유의서(이하 \"유의서\"라 한다)에 정하는 바에 의한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:3","kind":"조문","type":"계약예규","family":"nca","label":"제3조","title":"계약문서","text":"제3조(계약문서) ① 계약문서는 계약서, 설계서, 유의서, 공사계약일반조건, 공사계약특수조건 및 산출내역서로 구성되며 상호보완의 효력을 가진다. 다만, 산출내역서는 이 조건에서 규정하는 계약금액의 조정 및 기성부분에 대한 대가의 지급시에 적용할 기준으로서 계약문서의 효력을 가진다. ② ③ 계약담당공무원은 「국가를 당사자로 하는 계약에 관한 법령」, 공사관계 법령 및 이 조건에 정한 계약일반사항 외에 해당 계약의 적정한 이행을 위하여 필요한 경우 공사계약특수조건을 정하여 계약을 체결할 수 있다.④ 제3항에 의하여 정한 공사계약특수조건에 「국가를 당사자로 하는 계약에 관한 법령」, 공사 관계법령 및 이 조건에 의한 계약상대자의 계약상 이익을 제한하는 내용이 있는 경우에 특수조건의 해당 내용은 효력이 인정되지 아니한다.⑤ 이 조건이 정하는 바에 의하여 계약당사자간에 행한 통지문서등은 계약문서로서의 효력을 가진다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:4","kind":"조문","type":"계약예규","family":"nca","label":"제4조","title":"사용언어","text":"제4조(사용언어) ① 계약을 이행함에 있어서 사용하는 언어는 한국어로 함을 원칙으로 한다.② 계약담당공무원은 계약체결시 제1항에도 불구하고 필요하다고 인정하는 경우에는 계약이행과 관련하여 계약상대자가 외국어를 사용하거나 외국어와 한국어를 병행하여 사용할 수 있도록 필요한 조치를 할 수 있다.③ 제2항에 의하여 외국어와 한국어를 병행하여 사용한 경우에 외국어로 기재된 사항이 한국어와 상이할 때에는 한국어로 기재한 사항이 우선한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:5","kind":"조문","type":"계약예규","family":"nca","label":"제5조","title":"통지 등","text":"제5조(통지 등) ① 구두에 의한 통지ㆍ신청ㆍ청구ㆍ요구ㆍ회신ㆍ승인 또는 지시(이하 \"통지 등\"이라 한다)는 문서로 보완되어야 효력이 있다.② 통지 등의 장소는 계약서에 기재된 주소로 하며, 주소를 변경하는 경우에는 이를 즉시 계약당사자에게 통지하여야 한다.③ 통지 등의 효력은 계약문서에서 따로 정하는 경우를 제외하고는 계약당사자에게 도달한 날부터 발생한다. 이 경우 도달일이 공휴일인 경우에는 그 다음 날부터 효력이 발생한다.④ 계약당사자는 계약이행중 이 조건 및 관계법령 등에서 정한 바에 따라 서면으로 정당한 요구를 받은 경우에는 이를 성실히 검토하여 회신하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:6","kind":"조문","type":"계약예규","family":"nca","label":"제6조","title":"채권양도","text":"제6조(채권양도) ① 계약상대자는 이 계약에 의하여 발생한 채권(공사대금 청구권)을 제3자(공동수급체 구성원 포함)에게 양도할 수 있다.② 계약담당공무원은 제1항에 의한 채권양도와 관련하여 적정한 공사이행목적 등 필요한 경우에는 채권양도를 제한하는 특약을 정하여 운용할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:7","kind":"조문","type":"계약예규","family":"nca","label":"제7조","title":"계약보증금","text":"제7조(계약보증금) ① 계약상대자는 이 조건에 의하여 계약금액이 증액된 경우에는 이에 상응하는 금액의 계약보증금을 시행령 제50조 및 제52조에 정한 바에 따라 추가로 납부하여야 하며 계약담당공무원은 계약금액이 감액된 경우에는 이에 상응하는 금액의 계약보증금을 반환해야 한다. ② 계약담당공무원은 시행령 제52조제1항 본문에 의하여 계약이행을 보증한 경우로서 계약상대자가 계약이행보증방법의 변경을 요청하는 경우에는 1회에 한하여 변경하게 할 수 있다.  1. 2. 3. ③ 계약담당공무원은 시행령 제37조제2항제2호에 의한 유가증권이나 현금으로 납부된 계약보증금을 계약상대자가 특별한 사유로 시행령 제37조제2항제1호 내지 제5호에 규정된 보증서 등으로 대체납부할 것을 요청한 때에는 동가치 상당액 이상으로 대체 납부하게 할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:8","kind":"조문","type":"계약예규","family":"nca","label":"제8조","title":"계약보증금의 처리","text":"제8조(계약보증금의 처리) ① 계약담당공무원은 계약상대자가 정당한 이유없이 계약상의 의무를 이행하지 아니할 때에는 계약보증금을 국고에 귀속한다.② 시행령 제69조에 의한 장기계속공사계약에 있어서 계약상대자가 2차 이후의 공사계약을 체결하지 아니한 경우에는 제1항을 준용한다.③ 시행령 제50조제10항에 의하여 계약보증금지급각서를 제출한 경우로서 계약보증금의 국고귀속사유가 발생하여 계약담당공무원의 납입요청이 있을 때에는 계약상대자는 해당 계약보증금을 지체없이 현금으로 납부하여야 한다.④ 제1항 및 제2항에 의하여 계약보증금을 국고에 귀속함에 있어서 그 계약보증금은 이를 기성부분에 대한 미지급액과 상계 처리할 수 없다. 다만, 계약보증금의 전부 또는 일부를 면제받은 자의 경우에는 국고에 귀속되는 계약보증금과 기성부분에 대한 미지급액을 상계 처리할 수 있다.⑤ 계약담당공무원은 계약상대자가 납부한 계약보증금을 계약이 이행된 후에 계약상대자의 청구에 의하여 반환한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:9","kind":"조문","type":"계약예규","family":"nca","label":"제9조","title":"보증이행업체의 자격","text":"제9조(보증이행업체의 자격) ① 시행령 제52조에 의한 보증이행업체는 다음 각호에 해당하는 자격을 갖추고 있어야 하며, 계약담당공무원은 보증이행업체의 적격여부를 심사하기 위하여 계약상대자에게 관련자료의 제출을 요구할 수 있다. 1. 「독점규제 및 공정거래에 관한 법률」에 의한 계열회사가 아닌 자2. 시행령 제76조에 의한 입찰참가자격제한을 받고 그 제한기간 중에 있지 아니한 자3. 시행령 제36조에 의한 입찰공고 등에서 정한 입찰참가자격과 동등이상의 자격을 갖춘 자4. 시행령 제13조에 의한 입찰의 경우에는 입찰참가자격사전심사기준에 따른 입찰참가에 필요한 종합평점 이상이 되는 자② 계약담당공무원은 제1항에 의하여 보증이행업체로된 자가 부적격하다고 인정되는 때에는 계약상대자에게 보증이행업체의 변경을 요구할 수 있다. ③ 시행령 제52조제1항제3호에 의한 공사이행보증서의 제출 등에 대하여는 제1항 및 제2항외에 계약예규 「정부 입찰ㆍ계약 집행기준」 제13장(공사의 이행보증제도 운용)에 정한 바에 의한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:10","kind":"조문","type":"계약예규","family":"nca","label":"제10조","title":"손해보험","text":"제10조(손해보험) ① 계약상대자는 해당 계약의 목적물 등에 대하여 손해보험(「건설산업기본법」 제56조제1항제5호에 따른 손해공제를 포함한다. 이하 이 조에서 같다)에 가입할 수 있으며, 시행령 제78조, 제97조 및 추정가격이 200억원이상인 공사로서 계약예규「입찰참가자격사전심사요령」제6조제5항제1호에 규정된 공사에 대하여는 특별한 사유가 없는 한 계약목적물 및 제3자 배상책임을 담보할 수 있는 손해보험에 가입하여야 한다. ② 계약상대자는 제1항에 의한 보험가입시에 발주기관, 계약상대자, 하수급인 및 해당공사의 이해관계인을 피보험자로 하여야 하며, 보험사고 발생으로 발주기관이외의 자가 보험금을 수령하게 될 경우에는 발주기관의 장의 사전 동의를 받아야 한다.③ 계약목적물에 대한 보험가입금액은 공사의 보험가입 대상부분의 순계약금액(계약금액에서 부가가치세와 손해보험료를 제외한 금액을 말하며, 관급자재가 있을 경우에는 이를 포함한다. 이하 같다)을 기준으로 한다.④ 계약상대자는 제1항에 의한 보험가입을 공사착공일(손해보험가입 비대상공사가 포함된 공사의 경우에는 손해보험가입대상공사 착공일을 말함) 이전까지 하고 그 증서를 착공신고서 제출시(손해보험가입 비대상공사가 포함된 공사의 경우에는 손해보험가입대상공사 착공시) 발주기관에 제출하여야 하며, 보험기간은 해당공사 착공시부터 발주기관의 인수시(시운전이 필요한 공사인 경우에는 시운전 시기까지 포함한다)까지로 하여야 한다.⑤ 계약상대자는 손해보험가입시 제48조에 의하여 보증기관이 시공하게 될 경우에 계약상대자의 보험계약상의 권리와 의무가 보증기관에 승계되도록 하는 것을 포함하여야 하며, 제44조 내지 제46조에 의하여 계약이 해제 또는 해지된 후에 새로운 계약상대자가 선정될 경우에도 계약상대자의 보험계약상의 권리와 의무가 새로운 계약상대자에게 승계되는 내용이 포함되도록 하여야 한다. ⑥ 계약상대자는 발주기관이 작성한 예정가격조서상의 보험료 또는 계약상대자가 제출한 입찰금액 산출내역서상의 보험료와 계약상대자가 손해보험회사에 실제 납입한 보험료간의 차액발생을 이유로 보험가입을 거절하거나 동 차액의 정산을 요구하여서는 아니된다.⑦ 계약상대자는 보험가입 목적물의 보험사고로 보험금이 지급되는 경우에는 동 보험금을 해당공사의 복구에 우선 사용하여야 하며, 보험금 지급이 지연되거나 부족하게 지급되는 경우에도 이를 이유로 피해복구를 지연하거나 거절하여서는 아니된다.⑧ 제1항 내지 제7항의 사항이외에 손해보험과 관련된 기타 계약조건은 계약예규 「정부 입찰ㆍ계약 집행기준」 제14장(공사의 손해보험가입 업무집행)에 정한 바에 의한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:11","kind":"조문","type":"계약예규","family":"nca","label":"제11조","title":"공사용지의 확보","text":"제11조(공사용지의 확보) ① 발주기관은 계약문서에 따로 정한 경우를 제외하고는 계약상대자가 공사의 수행에 필요로 하는 날까지 공사용지를 확보하여 계약상대자에게 인도하여야 한다.② 계약상대자는 현장에 인력, 장비 또는 자재를 투입하기 전에 공사용지의 확보여부를 계약담당공무원으로부터 확인을 받아야 한다.③ 발주기관은 공사용지 확보 및 민원 대응 등 공사용지 확보와 직접 관련되는 업무를 계약상대자에게 전가하여서는 아니된다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:12","kind":"조문","type":"계약예규","family":"nca","label":"제12조","title":"공사자재의 검사","text":"제12조(공사자재의 검사) ① 공사에 사용할 자재는 신품이어야 하며 품질ㆍ규격 등은 반드시 설계서와 일치되어야 한다. 다만, 설계서에 명확히 규정되지 아니한 자재는 표준품 이상으로서 계약의 목적을 달성하는 데에 가장 적합한 것이어야 한다.② 계약상대자는 공사자재를 사용하기 전에 공사감독관의 검사를 받아야 하며, 불합격된 자재는 즉시 대체하여 다시 검사를 받아야 한다.③ 제2항에 의한 검사에 이의가 있을 경우에 계약상대자는 계약담당공무원에 대하여 재검사를 요청할 수 있으며, 재검사가 필요하다고 인정되는 경우에 계약담당공무원은 지체없이 재검사하도록 조치하여야 한다.④ 계약담당공무원은 계약상대자로부터 공사에 사용할 자재의 검사를 요청받거나 제3항에 의한 재검사의 요청을 받은 때에는 정당한 이유없이 검사를 지체할 수 없다.⑤ 계약상대자가 불합격된 자재를 즉시 이송하지 않거나 대체하지 아니하는 경우에는 계약담당공무원이 일방적으로 불합격 자재를 제거하거나 대체시킬 수 있다.⑥ 계약상대자는 시험 또는 조합이 필요한 자재가 있는 경우 공사감독관의 참여하에 그 시험 또는 조합을 하여야 한다.⑦ 수중 또는 지하에 매몰하는 공작물 기타 준공후 외부로부터 검사할 수 없는 공작물의 공사는 공사감독관의 참여하에 시공하여야 한다.⑧ 계약상대자가 제1항 내지 제7항이 정한 조건에 위배하거나 또는 설계서에 합치되지 않는 시공을 하였을 때에는 계약담당공무원은 공작물의 대체 또는 개조를 명할 수 있다.⑨ 제2항 내지 제8항의 경우에 계약금액을 증감하거나 계약기간을 연장할 수 없다. 다만, 제3항에 의하여 재검사 결과에서 적합한 자재인 것으로 판명될 경우에는 재검사에 소요된 기간에 대하여는 계약기간을 연장할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:13","kind":"조문","type":"계약예규","family":"nca","label":"제13조","title":"관급자재 및 대여품","text":"제13조(관급자재 및 대여품) ① 발주기관은 공사의 수행에 필요한 특정자재 또는 기계ㆍ기구 등을 계약상대자에게 공급하거나 대여할 수 있으며, 이 경우에 관급자재 등(관급자재 및 대여품을 말한다. 이하 같다)은 설계서에 명시되어 있어야 한다.② 관급자재 등은 제17조제1항제2호의 공사공정예정표에 따라 적기에 공급되어야 하며, 인도일시 및 장소는 계약당사자간에 협의하여 결정한다.③ 관급자재 등의 소유권은 발주기관에 있으며, 잉여분이 있을 경우에는 계약상대자는 이를 발주기관에 통지하여 계약담당공무원의 지시에 따라 이를 반환하여야 한다.④ 제2항에 의한 인도후의 관급자재 등에 대한 관리상의 책임은 계약상대자에게 있으며, 계약상대자가 이를 멸실 또는 훼손하였을 경우에는 발주기관에 변상하여야 한다.⑤ 계약상대자는 관급자재 등을 계약의 수행외의 목적으로 사용할 수 없으며, 공사감독관의 서면승인 없이는 현장외부로 반출하여서는 아니된다.⑥ 계약상대자는 관급자재 등을 인수할 때에는 이를 검수하여야 하며 그 품질 또는 규격이 시공에 적당하지 아니하다고 인정될 경우에는 즉시 계약담당공무원에게 이를 통지하여 대체를 요구하여야 한다.⑦ 계약담당공무원은 필요하다고 인정할 경우에는 관급자재 등의 수량ㆍ품질ㆍ규격ㆍ인도시기ㆍ인도장소 등을 변경할 수 있다. 이 경우에는 제20조 및 제23조를 적용한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:14","kind":"조문","type":"계약예규","family":"nca","label":"제14조","title":"공사현장대리인","text":"제14조(공사현장대리인) ① 계약상대자는 계약된 공사에 적격한 공사현장대리인(건설산업기본법시행령 제35조 [별표5] 등 공사관련 법령에 따른 기술자 배치기준에 적합한 자를 말한다. 이하 같다)을 지명하여 계약담당공무원에게 통지하여야 한다. ② 공사현장대리인은 공사현장에 상주하여 계약문서와 공사감독관의 지시에 따라 공사현장의 관리 및 공사에 관한 모든 사항을 처리하여야 한다. 다만, 공사가 일정기간 중단된 경우로서 발주기관의 승인을 얻은 경우에는 그러하지 아니한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:15","kind":"조문","type":"계약예규","family":"nca","label":"제15조","title":"공사현장 근로자","text":"제15조(공사현장 근로자) ① 계약상대자는 해당계약의 시공 또는 관리에 필요한 기술과 경험을 가진 근로자를 채용하여야 하며 근로자의 행위에 대하여 책임을 져야 한다. 다만, 계약상대자가 근로자의 관리ㆍ감독에 상당한 주의와 의무를 다한 경우에는 그러하지 아니하다. ② 계약상대자는 계약담당공무원이 계약상대자가 채용한 근로자에 대하여 해당계약의 시공 또는 관리상 적당하지 아니하다고 인정하여 이의 교체를 요구한 때에는 즉시 교체하여야 하며 계약담당공무원의 승인없이는 교체된 근로자를 해당계약의 시공 또는 관리를 위하여 다시 채용할 수 없다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:16","kind":"조문","type":"계약예규","family":"nca","label":"제16조","title":"공사감독관","text":"제16조(공사감독관) ① 공사감독관은 계약된 공사의 수행과 품질의 확보 및 향상을 위하여 「건설기술 진흥법」 제39조제6항 및 동법 시행령 제59조, 「전력기술관리법」 제12조, 그 밖에 공사관련법령에 따른 건설사업관리기술자 또는 감리원의 업무범위에서 정한 내용 및 이 조건에서 규정한 업무를 수행한다. ② 공사감독관은 계약담당공무원의 승인없이 계약상대자의 의무와 책임을 면제시키거나 증감시킬 수 없다.③ 계약상대자는 공사감독관의 지시 또는 결정이 이 조건에서 정한 사항에 위반되거나 계약의 이행에 적합하지 아니하다고 인정될 경우에는 즉시 계약담당공무원에게 이의 시정을 요구하여야 한다.④ 계약담당공무원은 제3항에 의한 시정요구를 받은 날부터 7일이내에 필요한 조치를 하여야 한다.⑤ 계약상대자는 발주기관에 제출하는 모든 문서에 대하여 그 사본을 공사감독관에게 제출하여야 한다.⑥ 공사감독관은 계약상대자로부터 제43조의2 제1항에 따른 통보를 받은 경우에는 하수급인 및 계약상대자와 직접 계약을 체결한 건설공사용부품제작납품업자, 건설기계대여업자(이하 \"하수급인 및 자재ㆍ장비업자\"라 한다)로부터 대금 수령내역 및 증빙서류를 제출받아 대금 지급내역 및 수령내역의 일치 여부를 확인하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:17","kind":"조문","type":"계약예규","family":"nca","label":"제17조","title":"착공 및 공정보고","text":"제17조(착공 및 공정보고) ① 계약상대자는 계약문서에서 정하는 바에 따라 공사를 착공하여야 하며 착공시에는 다음 각호의 서류가 포함된 착공신고서를 발주기관에 제출하여야 한다. 다만, 계약담당공무원은 공사기간이 30일 미만인 경우 등에는 착공신고서를 제출하지 아니하도록 할 수 있다. 1. 「건설기술 진흥법령」 등 관련법령에 의한 현장기술자지정신고서 2. 공사공정예정표3. 안전ㆍ환경 및 품질관리계획서4. 공정별 인력 및 장비투입계획서5. 착공전 현장사진6. 기타 계약담당공무원이 지정한 사항② 계약담당공무원은 공사의 규모ㆍ난이도ㆍ성격을 고려하여 착공일을 결정하되, 다음 각 호에서 정한 일자 이전의 날짜로 정하여서는 아니된다. 다만, 재해복구 등 긴급하게 착공하여야 할 필요가 있는 공사계약 및 장기계속공사의 1차 계약 이후 연차계약의 경우에는 계약상대자와의 협의를 거쳐 다음 각호에서 정한 일자 이전의 시점으로 착공일을 결정할 수 있다. 1. 추정가격이 10억원 미만인 경우: 계약체결일로부터 10일2. 추정가격이 10억원 이상인 경우: 계약체결일로부터 20일③ 계약상대자는 계약의 이행중에 설계변경 또는 기타 계약내용의 변경으로 인하여 제1항에 의하여 제출한 서류의 변경이 필요한 때에는 관련서류를 변경하여 제출하여야 한다. ④ 계약담당공무원은 제1항 및 제3항에 의하여 제출된 서류의 내용을 조정할 필요가 있다고 인정하는 경우에는 계약상대자에게 이의 조정을 요구할 수 있다. ⑤ 계약담당공무원은 제1항에 따라 착공신고서를 제출한 공사인 경우 계약상대자로 하여금 월별로 수행한 공사에 대하여 다음 각호의 사항을 명백히 하여 다음 달 14일까지 발주기관에 제출(「전자조달의 이용에 및 촉진에 관한 법률」제2조제4호 또는 동법 제14조에 의한 시스템을 통한 제출 포함)하게 할 수 있으며, 이 경우 계약상대자는 이에 응하여야 한다. 1. 월별 공정율 및 수행공사금액2. 인력ㆍ장비 및 자재현황3. 계약사항의 변경 및 계약금액의 조정내용4. 공정상황을 나타내는 현장사진⑥ 계약담당공무원은 공정이 지체되어 소정기한내에 공사가 준공될 수 없다고 인정할 경우에는 제5항에 의한 월별 현황과는 별도로 주간공정현황의 제출 등 공사추진에 필요한 조치를 계약상대자에게 지시할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:18","kind":"조문","type":"계약예규","family":"nca","label":"제18조","title":"휴일 및 야간작업","text":"제18조(휴일 및 야간작업) ① 계약상대자는 계약담당공무원의 공기단축지시 및 발주기관의 부득이한 사유로 인하여 휴일 또는 야간작업을 지시받았을 때에는 계약담당공무원에게 추가비용을 청구할 수 있다. ② 제1항의 경우에는 제23조를 준용한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:19","kind":"조문","type":"계약예규","family":"nca","label":"제19조","title":"설계변경 등","text":"제19조(설계변경 등) ① 설계변경은 다음 각호의 어느 하나에 해당하는 경우에 한다.1. 설계서의 내용이 불분명하거나 누락ㆍ오류 또는 상호 모순되는 점이 있을 경우2. 지질, 용수등 공사현장의 상태가 설계서와 다를 경우3. 새로운 기술ㆍ공법사용으로 공사비의 절감 및 시공기간의 단축 등의 효과가 현저할 경우4. 기타 발주기관이 설계서를 변경할 필요가 있다고 인정할 경우 등② ③ 제1항에 의한 설계변경은 그 설계변경이 필요한 부분의 시공전에 완료하여야 한다. 다만, 계약담당공무원은 공정이행의 지연으로 품질저하가 우려되는 등 긴급하게 공사를 수행할 필요가 있는 때에는 계약상대자와 협의하여 설계변경의 시기 등을 명확히 정하고, 설계변경을 완료하기 전에 우선시공을 하게 할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:19의2","kind":"조문","type":"계약예규","family":"nca","label":"제19조의2","title":"설계서의 불분명ㆍ누락ㆍ오류 및 설계서간의 상호모순 등에 의한 설계변경","text":"제19조의2(설계서의 불분명ㆍ누락ㆍ오류 및 설계서간의 상호모순 등에 의한 설계변경) ① 계약상대자는 공사계약의 이행중에 설계서의 내용이 불분명하거나 설계서에 누락ㆍ오류 및 설계서간에 상호모순 등이 있는 사실을 발견하였을 때에는 설계변경이 필요한 부분의 이행전에 해당사항을 분명히 한 서류를 작성하여 계약담당공무원과 공사감독관에게 동시에 이를 통지하여야 한다.② 계약담당공무원은 제1항에 의한 통지를 받은 즉시 공사가 적절히 이행될 수 있도록 다음 각호의 어느 하나의 방법으로 설계변경 등 필요한 조치를 하여야 한다.1. 설계서의 내용이 불분명한 경우(설계서만으로는 시공방법, 투입자재 등을 확정할 수 없는 경우)에는 설계자의 의견 및 발주기관이 작성한 단가산출서 또는 수량산출서 등의 검토를 통하여 당초 설계서에 의한 시공방법ㆍ투입자재 등을 확인한 후에 확인된 사항대로 시공하여야 하는 경우에는 설계서를 보완하되 제20조에 의한 계약금액조정은 하지 아니하며, 확인된 사항과 다르게 시공하여야 하는 경우에는 설계서를 보완하고 제20조에 의하여 계약금액을 조정하여야 함2. 설계서에 누락ㆍ오류가 있는 경우에는 그 사실을 조사 확인하고 계약목적물의 기능 및 안전을 확보할 수 있도록 설계서를 보완3. 설계도면과 공사시방서는 서로 일치하나 물량내역서와 상이한 경우에는 설계도면 및 공사시방서에 물량내역서를 일치4. 설계도면과 공사시방서가 상이한 경우로서 물량내역서가 설계도면과 상이하거나 공사시방서와 상이한 경우에는 설계도면과 공사시방서중 최선의 공사시공을 위하여 우선되어야 할 내용으로 설계도면 또는 공사시방서를 확정한 후 그 확정된 내용에 따라 물량내역서를 일치③ 제2항제3호 및 제4호는 제2조제4호에서 정한 공사의 경우에는 적용되지 아니한다. 다만, 제2조제4호에서 정한 공사의 경우로서 설계도면과 공사시방서가 상호 모순되는 경우에는 관련 법령 및 입찰에 관한 서류 등에 정한 내용에 따라 우선 여부를 결정하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:19의3","kind":"조문","type":"계약예규","family":"nca","label":"제19조의3","title":"현장상태와 설계서의 상이로 인한 설계변경","text":"제19조의3(현장상태와 설계서의 상이로 인한 설계변경) ① 계약상대자는 공사의 이행 중에 지질, 용수, 지하매설물 등 공사현장의 상태가 설계서와 다른 사실을 발견하였을 때에는 지체없이 설계서에 명시된 현장상태와 상이하게 나타난 현장상태를 기재한 서류를 작성하여 계약담당공무원과 공사감독관에게 동시에 이를 통지하여야 한다.② 계약담당공무원은 제1항에 의한 통지를 받은 즉시 현장을 확인하고 현장상태에 따라 설계서를 변경하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:19의4","kind":"조문","type":"계약예규","family":"nca","label":"제19조의4","title":"신기술 및 신공법에 의한 설계변경","text":"제19조의4(신기술 및 신공법에 의한 설계변경) ① 계약상대자는 새로운 기술ㆍ공법(발주기관의 설계와 동등이상의 기능ㆍ효과를 가진 기술ㆍ공법 및 기자재 등을 포함한다. 이하 같다)을 사용함으로써 공사비의 절감 및 시공기간의 단축 등에 효과가 현저할 것으로 인정하는 경우에는 다음 각호의 서류를 첨부하여 공사감독관을 경유하여 계약담당공무원에게 서면으로 설계변경을 요청할 수 있다.1. 제안사항에 대한 구체적인 설명서2. 제안사항에 대한 산출내역서3. 제17조제1항제2호에 대한 수정공정예정표4. 공사비의 절감 및 시공기간의 단축효과5. 기타 참고사항② 계약담당공무원은 제1항에 의하여 설계변경을 요청받은 경우에는 이를 검토하여 그 결과를 계약상대자에게 통지하여야 한다. 이 경우에 계약담당공무원은 설계변경 요청에 대하여 이의가 있을 때에는 「건설기술 진흥법 시행령」 제19조에 따른 기술자문위원회(이하 \"기술자문위원회\"라 한다)에 청구하여 심의를 받아야 한다. 다만, 기술자문위원회가 설치되어 있지 아니한 경우에는 「건설기술 진흥법」 제5조에 의한 건설기술심의위원회의 심의를 받아야 한다. ③ 계약상대자는 제1항에 의한 요청이 승인되었을 경우에는 지체없이 새로운 기술ㆍ공법으로 수행할 공사에 대한 시공상세도면을 공사감독관을 경유하여 계약담당공무원에게 제출하여야 한다.④ 계약상대자는 제2항에 의한 심의를 거친 계약담당공무원의 결정에 대하여 이의를 제기할 수 없으며, 또한 새로운 기술ㆍ공법의 개발에 소요된 비용 및 새로운 기술ㆍ공법에 의한 설계변경 후에 해당 기술ㆍ공법에 의한 시공이 불가능한 것으로 판명된 경우에는 시공에 소요된 비용을 발주기관에 청구할 수 없다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:19의5","kind":"조문","type":"계약예규","family":"nca","label":"제19조의5","title":"발주기관의 필요에 의한 설계변경","text":"제19조의5(발주기관의 필요에 의한 설계변경) ① 계약담당공무원은 다음 각호의 어느 하나의 사유로 인하여 설계서를 변경할 필요가 있다고 인정할 경우에는 계약상대자에게 이를 서면으로 통보할 수 있다.1. 해당공사의 일부변경이 수반되는 추가공사의 발생2. 특정공종의 삭제3. 공정계획의 변경4. 시공방법의 변경5. 기타 공사의 적정한 이행을 위한 변경② 계약담당공무원은 제1항에 의한 설계변경을 통보할 경우에는 다음 각호의 서류를 첨부하여야 한다. 다만, 발주기관이 설계서를 변경 작성할 수 없을 때에는 설계변경 개요서만을 첨부하여 설계변경을 통보할 수 있다.1. 설계변경개요서2. 수정설계도면 및 공사시방서3. 기타 필요한 서류③ 계약상대자는 제1항에 의한 통보를 받은 즉시 공사이행상황 및 자재수급 상황 등을 검토하여 설계변경 통보내용의 이행가능 여부(이행이 불가능하다고 판단될 경우에는 그 사유와 근거자료를 첨부)를 계약담당공무원과 공사감독관에게 동시에 이를 서면으로 통지하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:19의6","kind":"조문","type":"계약예규","family":"nca","label":"제19조의6","title":"소요자재의 수급방법 변경","text":"제19조의6(소요자재의 수급방법 변경) ① 계약담당공무원은 발주기관의 사정으로 인하여 당초 관급자재로 정한 품목을 계약상대자와 협의하여 계약상대자가 직접 구입하여 투입하는 자재(이하 \"사급자재\"라 한다)로 변경하고자 하는 경우 또는 관급자재 등의 공급지체로 공사가 상당기간 지연될 것이 예상되어 계약상대자가 대체사용 승인을 신청한 경우로서 이를 승인한 경우에는 이를 서면으로 계약상대자에게 통보하여야 한다. 이때 계약담당공무원은 계약상대자와 협의하여 변경된 방법으로 일괄하여 자재를 구입할 수 없는 경우에는 분할하여 구입하게 할 수 있으며, 분할 구입하게 할 경우에는 구입시기별로 이를 서면으로 계약상대자에게 통보하여야 한다.② 계약담당공무원은 공사의 이행 중에 설계변경 등으로 인하여 당초 관급자재의 수량이 증가되는 경우로서 증가되는 수량을 적기에 지급할 수 없어 공사의 이행이 지연될 것으로 예상되는 등 필요하다고 인정되는 때에는 계약상대자와 협의한 후에 증가되는 수량을 계약상대자가 직접 구입하여 투입하도록 서면으로 계약상대자에게 통보할 수 있다.③ 제1항에 의하여 자재의 수급방법을 변경한 경우에는 계약담당공무원은 통보당시의 가격에 의하여 그 대가(기성부분에 실제 투입된 자재에 대한 대가)를 제39조 내지 제40조에 의한 기성대가 또는 준공대가에 합산하여 지급하여야 한다. 다만, 계약상대자의 대체사용 승인신청에 따라 자재가 대체사용된 경우에는 계약상대자와 합의된 장소 및 일시에 현품으로 반환할 수도 있다.④ 계약담당공무원은 당초계약시의 사급자재를 관급자재로 변경할 수 없다. 다만, 원자재의 수급 불균형에 따른 원자재가격 급등 등 사급자재를 관급자재로 변경하지 않으면 계약목적을 이행할 수 없다고 인정될 때에는 계약당사자간의 협의에 의하여 변경할 수 있다.⑤ 제2항 및 제4항에 의하여 추가되는 관급자재를 사급자재로 변경하거나 사급자재를 관급자재로 변경한 경우에는 제20조에 정한 바에 따라 계약금액을 조정하여야 하며, 제3항 본문에 의하여 대가를 지급하는 경우에는 제20조제5항을 준용한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:19의7","kind":"조문","type":"계약예규","family":"nca","label":"제19조의7","title":"설계변경에 따른 추가조치 등","text":"제19조의7(설계변경에 따른 추가조치 등) ① 계약담당공무원은 제19조제1항에 의하여 설계변경을 하는 경우에 그 변경사항이 목적물의 구조변경 등으로 인하여 안전과 관련이 있는 때에는 하자발생시 책임한계를 명확하게 하기 위하여 당초 설계자의 의견을 들어야 한다.② 계약담당공무원은 제19조의2, 제19조의3 및 제19조의5에 의하여 설계변경을 하는 경우에 계약상대자로 하여금 다음 각호의 사항을 계약담당공무원과 공사감독관에게 동시에 제출하게 할 수 있으며, 계약상대자는 이에 응하여야 한다.1. 해당공종의 수정공정예정표2. 해당공종의 수정도면 및 수정상세도면3. 조정이 요구되는 계약금액 및 기간4. 그 밖의 공정에 미치는 영향③ 계약담당공무원은 제2항제2호에 의하여 당초의 설계도면 및 시공상세도면을 계약상대자가 수정하여 제출하는 경우에는 그 수정에 소요된 비용을 제23조에 의하여 계약상대자에게 지급하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:20","kind":"조문","type":"계약예규","family":"nca","label":"제20조","title":"설계변경으로 인한 계약금액의 조정","text":"제20조(설계변경으로 인한 계약금액의 조정) ① 계약담당공무원은 설계변경으로 시공방법의 변경, 투입자재의 변경 등 공사량의 증감이 발생하는 경우에는 다음 각호의 어느 하나의 기준에 의하여 계약금액을 조정하여야 한다.1. 증감된 공사량의 단가는 계약단가로 한다. 다만 계약단가가 예정가격단가보다 높은 경우로서 물량이 증가하게 되는 때에는 그 증가된 물량에 대한 적용단가는 예정가격단가로 한다.2. 산출내역서에 없는 품목 또는 비목(동일한 품목이라도 성능, 규격 등이 다른 경우를 포함한다. 이하 \"신규비목\"이라 한다)의 단가는 설계변경당시(설계도면의 변경이 필요한 경우에는 변경도면을 발주기관이 확정한 때, 설계도면의 변경을 요하지 않는 경우에는 계약당사자간에 설계변경을 문서에 의하여 합의한 때, 제19조제3항에 의하여 우선시공을 한 경우에는 그 우선시공을 하게 한 때를 말한다. 이하 같다)를 기준으로 산정한 단가에 낙찰율(예정가격에 대한 낙찰금액 또는 계약금액의 비율을 말한다. 이하 같다)을 곱한 금액으로 한다.② 발주기관이 설계변경을 요구한 경우(계약상대자의 책임없는 사유로 인한 경우를 포함한다. 이하 같다)에는 제1항에도 불구하고 증가된 물량 또는 신규비목의 단가는 설계변경당시를 기준으로 하여 산정한 단가와 동 단가에 낙찰율을 곱한 금액의 범위안에서 발주기관과 계약상대자가 서로 주장하는 각각의 단가기준에 대한 근거자료 제시 등을 통하여 성실히 협의(이하 \"협의\"라 한다) 하여 결정한다. 다만, 계약당사자간에 협의가 이루어지지 아니하는 경우에는 설계변경당시를 기준으로 하여 산정한 단가와 동 단가에 낙찰율을 곱한 금액을 합한 금액의 100분의 50으로 한다.③ 제2항에도 불구하고 표준시장단가가 적용된 공사의 경우에는 다음 각호의 어느 하나의 기준에 의하여 계약금액을 조정하여야 한다. 1. 증가된 공사량의 단가는 예정가격 산정시 표준시장단가가 적용된 경우에 설계변경 당시를 기준으로 하여 산정한 표준시장단가로 한다.2. 신규비목의 단가는 표준시장단가를 기준으로 산정하고자 하는 경우에 설계변경 당시를 기준으로 산정한 표준시장단가로 한다.④ 제19조의4에 의한 설계변경의 경우에는 해당 절감액의 100분의 30에 해당하는 금액을 감액한다. ⑤ 제1항 및 제2항에 의한 계약금액의 증감분에 대한 간접노무비, 산재보험료 및 산업안전보건관리비 등의 승율비용과 일반관리비 및 이윤은 산출내역서상의 간접노무비율, 산재보험료율 및 산업안전보건관리비율 등의 승율비용과 일반관리비율 및 이윤율에 의하되 설계변경당시의 관계법령 및 재정경제부장관 등이 정한 율을 초과할 수 없다. ⑥ 계약담당공무원은 예정가격의 100분의 86미만으로 낙찰된 공사계약의 계약금액을 제1항에 따라 증액조정하고자 하는 경우로서 해당 증액조정금액(2차 이후의 계약금액 조정에 있어서는 그 전에 설계변경으로 인하여 감액 또는 증액조정된 금액과 증액조정하려는 금액을 모두 합한 금액을 말한다)이 당초 계약서의 계약금액(장기계속공사의 경우에는 시행령 제69조제2항에 따라 부기된 총공사금액)의 100분의 10 이상인 경우에는 시행령 제94조에 따른 계약심의회, 「국가재정법 시행령」 제49조에 따른 예산집행심의회 또는 「건설기술 진흥법 시행령」 제19조에 따른 기술자문위원회의 심의를 거쳐 소속중앙관서의 장의 승인을 얻어야 한다. ⑦ 일부 공종의 단가가 세부공종별로 분류되어 작성되지 아니하고 총계방식으로 작성(이하 \"1식단가\"라 한다)되어 있는 경우에도 설계도면 또는 공사시방서가 변경되어 1식단가의 구성내용이 변경되는 때에는 제1항 내지 제5항에 의하여 계약금액을 조정하여야 한다. ⑧ 발주기관은 제1항 내지 제7항에 의하여 계약금액을 조정하는 경우에는 계약상대자의 계약금액조정 청구를 받은 날부터 30일이내에 계약금액을 조정하여야 한다. 이 경우에 예산배정의 지연 등 불가피한 경우에는 계약상대자와 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 조정할 수 있는 예산이 없는 때에는 공사량 등을 조정하여 그 대가를 지급할 수 있다. ⑨ 계약담당공무원은 제8항에 의한 계약상대자의 계약금액조정 청구 내용이 부당함을 발견한 때에는 지체없이 필요한 보완요구 등의 조치를 하여야 한다. 이 경우 계약상대자가 보완요구 등의 조치를 통보받은 날부터 발주기관이 그 보완을 완료한 사실을 통지받은 날까지의 기간은 제8항에 의한 기간에 산입하지 아니한다. ⑩ 제8항 전단에 의한 계약상대자의 계약금액조정 청구는 제40조에 의한 준공대가(장기계속계약의 경우에는 각 차수별 준공대가) 수령전까지 조정신청을 하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:21","kind":"조문","type":"계약예규","family":"nca","label":"제21조","title":"설계변경으로 인한 계약금액조정의 제한 등","text":"제21조(설계변경으로 인한 계약금액조정의 제한 등) ① 다음 각 호의 어느 하나의 방법으로 체결된 공사계약에 있어서는 설계변경으로 계약내용을 변경하는 경우에도 정부에 책임있는 사유 또는 천재ㆍ지변 등 불가항력의 사유로 인한 경우를 제외하고는 그 계약금액을 증액할 수 없다.1. 2. 시행령 제78조에 따른 일괄입찰 및 대안입찰(대안이 채택된 부분에 한함)을 실시하여 체결된 공사계약3. 시행령 제98조에 따른 기본설계 기술제안입찰 및 실시설계 기술제안입찰(기술제안이 채택된 부분에 한함)을 실시하여 체결된 공사계약 ② 계약담당공무원은 시행령 제14조제1항 각 호 외의 부분 단서에 따라 물량내역서를 작성하는 경우에는 물량내역서의 누락사항이나 오류 등으로 설계를 변경하는 경우에도 그 계약금액을 변경할 수 없다. 다만, 입찰참가자가 교부받은 물량내역서의 물량을 수정하고 단가를 적은 산출내역서를 제출하는 경우에는 입찰참가자의 물량수정이 허용되지 않은 공종에 대하여는 그러하지 아니하다. ③ 각 중앙관서의 장 또는 계약담당공무원은 시행령 제78조에 따른 일괄입찰과 제98조에 따른 기본설계 기술제안입찰의 경우 계약체결 이전에 실시설계적격자에게 책임이 없는 다음 각 호의 어느 하나에 해당하는 사유로 실시설계를 변경한 경우에는 계약체결 이후에 즉시 설계변경에 의한 계약금액 조정을 하여야 한다. 1. 민원이나 환경ㆍ교통영향평가 또는 관련 법령에 따른 인허가 조건 등과 관련하여 실시설계의 변경이 필요한 경우2. 발주기관이 제시한 기본계획서ㆍ입찰안내서 또는 기본설계서에 명시 또는 반영되어 있지 아니한 사항에 대하여 해당 발주기관이 변경을 요구한 경우3. 중앙건설기술심의위원회 또는 기술자문위원회가 실시설계 심의과정에서 변경을 요구한 경우 ④ 제1항 또는 제3항의 경우에서 계약금액을 조정하고자 할 때에는 다음 각호의 기준에 의한다. 1. 실시설계 기술제안입찰은 시행령 제65조 제3항에 의한다. 2. 제1항제2호의 경우와 기본설계 기술제안입찰은 시행령 제91조 제3항에 의한다. ⑤ 제1항에 정한 정부의 책임있는 사유 또는 불가항력의 사유란 다음 각호의 어느 하나의 경우를 말한다. 다만, 설계시 공사관련법령 등에 정한 바에 따라 설계서가 작성된 경우에 한한다. 1. 사업계획 변경 등 발주기관의 필요에 의한 경우2. 발주기관 외에 해당공사와 관련된 인허가기관 등의 요구가 있어 이를 발주기관이 수용하는 경우3. 공사관련법령(표준시방서, 전문시방서, 설계기준 및 지침 등 포함)의 제ㆍ개정으로 인한 경우4. 공사관련법령에 정한 바에 따라 시공하였음에도 불구하고 발생되는 민원에 의한 경우5. 발주기관 또는 공사 관련기관이 교부한 지하매설 지장물 도면과 현장 상태가 상이하거나 계약이후 신규로 매설된 지장물에 의한 경우6. 토지ㆍ건물소유자의 반대, 지장물의 존치, 관련기관의 인허가 불허 등으로 지질조사가 불가능했던 부분의 경우7. 제32조에 정한 사항 등 계약당사자 누구의 책임에도 속하지 않는 사유에 의한 경우⑥ 제4항에 따라 계약금액을 증감조정하고자 하는 경우에 증감되는 공사물량은 수정전의 설계도면과 수정후의 설계도면을 비교하여 산출한다. ⑦ 제3항 각호의 사유 및 제5항 각호의 사유에 해당되지 않는 경우로서 현장상태와 설계서의 상이 등으로 인하여 설계변경을 하는 경우에는 전체공사에 대하여 증ㆍ감되는 금액을 합산하여 계약금액을 조정하되, 계약금액을 증액할 수는 없다. ⑧ 계약담당공무원은 제7항에 따른 계약금액 조정과 관련하여 연차계약별로 준공되는 장기계속공사의 경우에는 계약체결시 전체공사에 대한 증ㆍ감 금액의 합산처리 방법, 합산잔액의 다음 연차계약으로의 이월 등 필요한 사항을 정하여 운영하여야 한다. ⑨ 제1항 내지 제8항에 따른 계약금액조정의 경우에는 제20조제5항 및 제8항 내지 제10항을 준용한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:22","kind":"조문","type":"계약예규","family":"nca","label":"제22조","title":"물가변동으로 인한 계약금액의 조정","text":"제22조(물가변동으로 인한 계약금액의 조정) ① 물가변동으로 인한 계약금액의 조정은 시행령 제64조 및 시행규칙 제74조에 정한 바에 의한다.② 계약담당공무원이 동일한 계약에 대한 계약금액을 조정할 때에는 품목조정율 및 지수조정율을 동시에 적용하여서는 아니되며, 계약을 체결할 때에 계약상대자가 지수조정율 방법을 원하는 경우외에는 품목조정율 방법으로 계약금액을 조정하도록 계약서에 명시하여야 한다. 이 경우 계약이행중 계약서에 명시된 계약금액 조정방법을 임의로 변경하여서는 아니된다. 다만, 시행령 제64조제6항에 따라 특정규격의 자재별 가격변동으로 계약금액을 조정할 경우에는 본문에도 불구하고 품목조정율에 의한다.③ 제1항에 의하여 계약금액을 증액하는 경우에는 계약상대자의 청구에 의하여야 하고, 계약상대자는 제40조에 의한 준공대가(장기계속계약의 경우에는 각 차수별 준공대가) 수령전까지 조정신청을 하여야 조정금액을 지급받을 수 있으며, 조정된 계약금액은 직전의 물가변동으로 인한 계약금액조정기준일부터 90일이내에 이를 다시 조정할 수 없다. 다만, 천재ㆍ지변 또는 원자재의 가격급등으로 해당 기간내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 인정되는 경우에는 계약을 체결한 날 또는 직전 조정기준일로부터 90일이내에도 계약금액을 조정할 수 있다.④ 계약상대자는 제3항에 의하여 계약금액의 증액을 청구하는 경우에 계약금액조정 내역서를 첨부하여야 한다.⑤ 발주기관은 제1항 내지 제4항에 의하여 계약금액을 증액하는 경우에는 계약상대자의 청구를 받은 날부터 30일 이내에 계약금액을 조정하여야 한다. 이 때 예산배정의 지연 등 불가피한 경우에는 계약상대자와 협의하여 그 조정기한을 연장할 수 있으며, 계약금액을 증액할 수 있는 예산이 없는 때에는 공사량 등을 조정하여 그 대가를 지급할 수 있다.⑥ 계약담당공무원은 제4항 및 제5항에 의한 계약상대자의 계약금액조정 청구 내용이 일부 미비하거나 분명하지 아니한 경우에는 지체없이 필요한 보완요구를 하여야 하며, 이 경우 계약상대자가 보완요구를 통보받은 날부터 발주기관이 그 보완을 완료한 사실을 통지받은 날까지의 기간은 제5항에 의한 기간에 산입하지 아니한다. 다만, 계약상대자의 계약금액조정 청구내용이 계약금액 조정요건을 충족하지 않았거나 관련 증빙서류가 첨부되지 아니한 경우에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송하여야 하며, 이 경우에 계약상대자는 그 반송사유를 충족하여 계약금액조정을 다시 청구하여야 한다.⑦ 시행령 제64조제6항에 따른 계약금액 조정요건을 충족하였으나 계약상대자가 계약금액 조정신청을 하지 않을 경우에 하수급인은 이러한 사실을 계약담당공무원에게 통보할 수 있으며, 통보받은 계약담당공무원은 이를 확인한 후에 계약상대자에게 계약금액 조정신청과 관련된 필요한 조치 등을 하도록 하여야 한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:23","kind":"조문","type":"계약예규","family":"nca","label":"제23조","title":"기타 계약내용의 변경으로 인한 계약금액의 조정","text":"제23조(기타 계약내용의 변경으로 인한 계약금액의 조정) ① 계약담당공무원은 공사계약에 있어서 제20조 및 제22조에 의한 경우 외에 공사기간ㆍ운반거리의 변경 등 계약내용의 변경으로 계약금액을 조정하여야 할 필요가 있는 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 이를 조정(하도급업체가 지출한 비용을 포함한다)하며, 계약예규 「정부입찰ㆍ계약 집행기준」제16장(실비의 산정)을 적용한다. ② 제1항에 의한 계약내용의 변경은 변경되는 부분의 이행에 착수하기 전에 완료하여야 한다. 다만, 계약담당공무원은 계약이행의 지연으로 품질저하가 우려되는 등 긴급하게 계약을 이행하게 할 필요가 있는 때에는 계약상대자와 협의하여 계약내용 변경의 시기 등을 명확히 정하고, 계약내용을 변경하기 전에 계약을 이행하게 할 수 있다.③ 제1항의 경우에는 제20조제5항을 준용한다.④ 제1항에 의하여 계약금액이 증액될 때에는 계약상대자의 신청에 따라 조정하여야 한다.⑤ 제1항 내지 제4항에 의한 계약금액조정의 경우에는 제20조제8항 내지 제10항을 준용한다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:23의2","kind":"조문","type":"계약예규","family":"nca","label":"제23조의2","title":"설계변경 등에 따른 통보","text":"제23조의2(설계변경 등에 따른 통보) 계약담당공무원은 다음 각 호에 따라 계약내용을 변경한 경우에는 그 사유와 내용을 하수급인에게 통보하여야 한다. 1. 제20조 내지 제23조에 따라 계약금액을 조정한 경우2. 계약금액 조정을 하지 않고 계약내용을 변경한 경우[본조 신설 2008.12.29.]","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:23의3","kind":"조문","type":"계약예규","family":"nca","label":"제23조의3","title":"건설폐기물량의 초과발생에 따른 계약금액의 조정","text":"제23조의3(건설폐기물량의 초과발생에 따른 계약금액의 조정) 시행령 제78조에 따라 체결된 계약에 있어서 「건설폐기물의 재활용 촉진에 관한 법률」제15조에 따라 건설공사와 건설폐기물처리용역을 분리발주한 경우로서 공사수행과정에서 건설폐기물이 계약상대자가 설계시 산출한 물량을 초과하여 발생한 때에는 해당 초과물량에 대하여 발주기관이 실제 폐기물처리업체에 지급한 처리비용만큼 계약금액에서 감액조정한다.[본조 신설 2010.11.30.]","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:24","kind":"조문","type":"계약예규","family":"nca","label":"제24조","title":"응급조치","text":"제24조(응급조치) ① 계약상대자는 시공기간중 재해방지를 위하여 필요하다고 인정할 때에는 미리 공사감독관의 의견을 들어 필요한 조치를 취하여야 한다.② 공사감독관은 재해방지 기타 시공상 부득이할 때에는 계약상대자에게 필요한 응급조치를 취할 것을 구두 또는 서면으로 요구할 수 있다. 이 경우에 구두로 응급조치를 요구한 때에는 추후 서면으로 보완하여야 한다.③ 계약상대자는 제2항에 의한 요구를 받은 때에는 즉시 이에 응하여야 한다. 다만 계약상대자가 요구에 응하지 아니할 때에는 계약담당공무원은 일방적으로 계약상대자 부담으로 제3자로 하여금 응급조치하게 할 수 있다.④ 제1항 내지 제3항의 조치에 소요된 경비중에서 계약상대자가 계약금액의 범위내에서 부담하는 것이 부당하다고 인정되는 때에는 제23조에 의하여 실비의 범위안에서 계약금액을 조정할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:25","kind":"조문","type":"계약예규","family":"nca","label":"제25조","title":"지체상금","text":"제25조(지체상금) ① 계약상대자는 계약서에 정한 준공기한(계약서상 준공신고서 제출기일을 말한다. 이하 같다)내에 공사를 완성하지 아니한 때에는 매 지체일수마다 계약서에 정한 지체상금률을 계약금액(장기계속공사계약의 경우에는 연차별 계약금액)에 곱하여 산출한 금액(이하 \"지체상금\"이라 한다)을 현금으로 납부하여야 한다. 다만, 납부할 금액이 계약금액(제2항에 따라 기성부분 또는 기납부분에 대하여 검사를 거쳐 이를 인수한 경우에는 그 부분에 상당하는 금액을 계약금액에서 공제한 금액을 말한다)의 100분의 30을 초과하는 경우에는 100분의 30으로 한다. ② 계약담당공무원은 제1항의 경우에 제29조에 의하여 기성부분에 대하여 검사를 거쳐 이를 인수(인수하지 아니하고 관리ㆍ사용하고 있는 경우를 포함한다. 이하 이 조에서 같다)한 때에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 이 경우에 기성부분의 인수는 그 성질상 분할할 수 있는 공사에 대한 완성부분으로 인수하는 것에 한한다.③ 계약담당공무원은 다음 각호의 어느 하나에 해당되어 공사가 지체되었다고 인정할 때에는 그 해당일수를 제1항의 지체일수에 산입하지 아니한다.1. 제32조에서 규정한 불가항력의 사유에 의한 경우2. 계약상대자가 대체 사용할 수 없는 중요 관급자재 등의 공급이 지연되어 공사의 진행이 불가능하였을 경우3. 발주기관의 책임으로 착공이 지연되거나 시공이 중단되었을 경우4. 5. 계약상대자의 부도 등으로 보증기관이 보증이행업체를 지정하여 보증시공할 경우6. 제19조에 의한 설계변경(계약상대자의 책임없는 사유인 경우에 한한다)으로 인하여 준공기한내에 계약을 이행할 수 없을 경우 7. 발주기관이 「조달사업에 관한 법률」 제27조 제1항에 따른 혁신제품을 자재로 사용토록 한 경우로서 혁신제품의 하자가 직접적인 원인이 되어  준공기한내에 계약을 이행할 수 없을 경우 8. 원자재의 수급 불균형 또는 「정부 입찰ㆍ계약집행기준」 제70조의4제1항제1호에 따른 가격급등으로 인하여 해당 관급자재의 조달지연 또는 사급자재(관급자재에서 전환된 사급자재를 포함한다)의 구입곤란 등 기타 계약상대자의 책임에 속하지 아니하는 사유로 인하여 지체된 경우 ④ ⑤ 제3항제5호에 의하여 지체일수에 산입하지 아니하는 기간은 발주기관으로부터 보증채무 이행청구서를 접수한 날부터 보증이행개시일 전일까지(단, 30일 이내에 한한다)로 한다.⑥ 계약담당공무원은 제1항에 의한 지체일수를 다음 각호에 따라 산정하여야 한다.1. 준공기한내에 준공신고서를 제출한 때에는 제27조에 의한 준공검사에 소요된 기간은 지체일수에 산입하지 아니한다. 다만, 준공기한 이후에 제27조제3항에 의한 시정조치를 한 때에는 시정조치를 한 날부터 최종 준공검사에 합격한 날까지의 기간(검사기간이 제27조에 정한 기간을 초과한 경우에는 동조에 정한 기간에 한한다. 이하 같다)을 지체일수에 산입한다.2. 준공기한을 경과하여 준공신고서를 제출한 때에는 준공기한 다음 날부터 준공검사(시정조치를 한 때에는 최종 준공검사)에 합격한 날까지의 기간을 지체일수에 산입한다.3. 준공기한의 말일이 공휴일(관련 법령에 의하여 발주기관의 휴무일이거나 「근로자의 날 제정에 관한 법률」에 따른 근로자의 날(계약상대자가 실제 업무를 하지 아니한 경우에 한함)인 경우를 포함한다)인 경우에 지체일수는 공휴일의 다음 다음날부터 기산한다. ⑦ 계약담당공무원은 제1항 내지 제3항에 의한 지체상금은 계약상대자에게 지급될 대가, 대가지급지연에 대한 이자 또는 기타 예치금 등과 상계할 수 있다.","lawId":"ye-gongsa-gen","group":"공사계약일반조건","확인일":"20260721","시행일":null,"상태":"현행"},{"id":"art:ye-gongsa-gen:26","kind":"조문","type":"계약예규","family":"nca","label":"제26조","title":"계약기간의 연장","text":"제26조(계약기간의 연장) ① 계약상대자는 제25조제3항 각호의 어느 하나의 사유가 계약기간(장기계속공사의 경우에는 연차별 계약기간을 말한다. 이하 이 조에서 같다.)내에 발생한 경우에는 계약기간 종료전에 지체없이 제17조제1항제2호의 수정공정표를 첨부하여 계약담당공무원과 공사감독관에게 서면으로 계약기간의 연장신청을 하여야 한다. 다만, 연장사유가 계약기간내에 발생하여 계약기간 경과후 종료된 경우에는 동 사유가 종료된 후 즉시 계약기간의 연장신청을 하여야 한다. ② 계약담당공무원은 제1항에 의한 계약기간연장 신청이 접수된 때에는 즉시 그 사실을 조사 확인하고 공사가 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다.③ 계약담당공무원은 제1항에 의한 연장청구를 승인하였을 경우에는 동 연장기간에 대하여는 제25조에 의한 지체상금을 부과하여서는 아니된다.④ 제2
