[package]
name = "myeot-johang-ideora"
version = "0.2.0"
description = "몇 조항이더라 — 조달 법령 오프라인 리더"
authors = ["조달청 실무자"]
edition = "2021"
rust-version = "1.77.2"

# main.rs 는 lib.rs 의 run() 을 부른다 — 데스크톱/모바일 진입점을 한곳에 둔다.
[lib]
name = "myeot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 법령노트를 SQLite 로 영속화한다(데스크톱 앱). 프론트엔드는 kv 테이블에 write-through.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 설정의 "저장위치 변경 · DB 불러오기" 네이티브 파일 대화상자.
tauri-plugin-dialog = "2"

# 전역 핫키(Ctrl+Shift+Space)는 데스크톱 전용 플러그인이다.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[features]
# 배포 빌드에서 콘솔 창을 숨긴다(Windows).
custom-protocol = ["tauri/custom-protocol"]
