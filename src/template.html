<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LawEverything — 조달 법령 관계 그래프</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171d2b; --panel2:#1e2537; --line:#2b3346;
    --text:#e8ecf4; --muted:#93a0b8; --accent:#4c9aff;
    --wimim:#f6a94a; --inyong:#5cc8ff; --sosok:#39425a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  #app{display:grid;grid-template-columns:320px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  header{padding:14px 16px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px;letter-spacing:.2px}
  header p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
  .search{padding:12px 14px;border-bottom:1px solid var(--line)}
  .search input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:13px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .toggles{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
  .toggles label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .results{overflow:auto;flex:1;min-height:0}
  .ritem{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
  .ritem:hover{background:var(--panel2)}
  .ritem .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .ritem .g{color:var(--muted);font-size:11px}
  .ritem b{font-weight:600}
  main{position:relative;min-width:0}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg:active{cursor:grabbing}
  .edge{stroke-width:1.6;fill:none}
  .edge.위임{stroke:var(--wimim)}
  .edge.인용{stroke:var(--inyong);stroke-dasharray:5 4}
  .edge.소속{stroke:#39425a;stroke-width:1;opacity:.5}
  .edge.dim{opacity:.06}
  .node{cursor:pointer}
  .node circle,.node rect{stroke:#0c111c;stroke-width:1.5}
  .node.ext circle{stroke-dasharray:3 3;stroke:#6b7690}
  .node text{font-size:11px;fill:var(--text);pointer-events:none;paint-order:stroke;
    stroke:#0c111c;stroke-width:3px}
  .node.dim{opacity:.12}
  .node.match circle,.node.match rect{stroke:#fff;stroke-width:2.5}
  .legend{position:absolute;left:14px;bottom:14px;background:rgba(23,29,43,.9);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted)}
  .legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
  .legend .ln{width:22px;height:0;border-top:2px solid}
  .detail{position:absolute;right:14px;top:14px;width:300px;max-height:calc(100% - 28px);
    overflow:auto;background:rgba(23,29,43,.97);border:1px solid var(--line);border-radius:12px;
    padding:0;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .detail.on{display:block}
  .detail .dh{padding:13px 15px;border-bottom:1px solid var(--line)}
  .detail .tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--panel2);color:var(--muted)}
  .detail h2{margin:8px 0 2px;font-size:15px}
  .detail .sub{font-size:12px;color:var(--muted)}
  .detail .stamp{margin-top:7px;font-size:10.5px;color:var(--muted);
    padding:3px 7px;border-radius:5px;background:var(--panel2);display:inline-block}
  .detail .stamp.old{color:var(--wimim);background:rgba(246,169,74,.13)}
  .detail .body{padding:12px 15px}
  .detail .txt{font-size:12px;line-height:1.65;color:#cdd6e6;background:var(--panel2);
    border-radius:8px;padding:10px;white-space:pre-wrap}
  .detail .relhead{font-size:11px;color:var(--muted);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.5px}
  .detail .rel{font-size:12px;padding:6px 8px;border-radius:7px;cursor:pointer;display:flex;gap:6px;align-items:center}
  .detail .rel:hover{background:var(--panel2)}
  .detail .rel .k{font-size:10px;padding:1px 6px;border-radius:20px}
  .detail .rel .k.위임{background:rgba(246,169,74,.18);color:var(--wimim)}
  .detail .rel .k.인용{background:rgba(92,200,255,.16);color:var(--inyong)}
  .detail .rel .k.소속{background:#2a3247;color:var(--muted)}
  .detail .close{position:absolute;right:11px;top:11px;cursor:pointer;color:var(--muted);font-size:16px}
  .empty{color:var(--muted);font-size:12px;padding:16px 14px}
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>LawEverything · 조달 법령 관계</h1>
      <p id="meta"></p>
    </header>
    <div class="search">
      <input id="q" placeholder="법령·조문·키워드 즉시검색  (예: 수의계약, 제7조, 보증금)" autocomplete="off"/>
      <div class="toggles">
        <label><input type="checkbox" id="t-위임" checked/> 위임</label>
        <label><input type="checkbox" id="t-인용" checked/> 인용</label>
        <label><input type="checkbox" id="t-소속" checked/> 소속</label>
      </div>
    </div>
    <div class="results" id="results"></div>
  </aside>
  <main>
    <svg id="svg"></svg>
    <div class="legend">
      <div class="row"><span class="ln" style="border-color:var(--wimim)"></span> 위임 (법→시행령→규칙)</div>
      <div class="row"><span class="ln" style="border-color:var(--inyong);border-top-style:dashed"></span> 인용 (조문→조문)</div>
      <div class="row"><span class="ln" style="border-color:#39425a"></span> 소속 (법령→조문)</div>
    </div>
    <div class="detail" id="detail"></div>
  </main>
</div>
<script>
const GRAPH = /*__GRAPH__*/;
</script>
<script>
(function(){
  const {nodes,edges,meta}=GRAPH;

  // ---- 법령 확인일 배너 ----
  // 폐쇄망에서는 데이터가 늘 과거다. "언제 기준인지"를 숨기면 실무자가
  // 낡은 조문을 현행으로 착각한다. 항상 보이게 하고, 낡으면 색으로 경고한다.
  (function(){
    const v=meta.확인요약, el=document.getElementById('meta');
    const base=`${meta.domain||''} · 스냅샷 ${meta.snapshotDate||meta.기준일||''}`.replace(/^ · /,'');
    if(!v){el.textContent=base;return;}
    const parts=[base];
    if(meta.기준일) parts.push(`기준일 ${meta.기준일}`);
    if(v.현행) parts.push(`현행 ${v.현행}건`);
    if(v.시행예정) parts.push(`시행예정 ${v.시행예정}건 (인용 제외)`);
    if(v.최고경과일!=null) parts.push(`최종확인 ${v.최고경과일}일 전`);
    el.textContent=parts.join(' · ');
    if(v.낡음>0){
      el.style.color='var(--wimim)';
      el.textContent+=` · ⚠ ${v.낡음}건 재수집 필요`;
    }
  })();

  // ---- 색상: 법령 가문(hue) × 유형(명도) ----
  const HUE={};let hueSeed=[210,145,275,25,330,190];
  nodes.forEach(n=>{if(n.family&&!(n.family in HUE))HUE[n.family]=hueSeed[Object.keys(HUE).length%hueSeed.length];});
  const light={ "법률":46,"시행령":58,"시행규칙":68 };
  function color(n){
    if(n.kind==='외부법') return 'hsl(220,8%,55%)';
    const h=HUE[n.family]??220; return `hsl(${h},55%,${light[n.type]||55}%)`;
  }

  const byId=new Map(nodes.map(n=>[n.id,n]));
  const adj=new Map(nodes.map(n=>[n.id,new Set()]));
  edges.forEach(e=>{adj.get(e.source).add(e.target);adj.get(e.target).add(e.source);});

  // ---- 포스 시뮬레이션 (바닐라) ----
  const svg=document.getElementById('svg');
  let W=svg.clientWidth,H=svg.clientHeight;
  nodes.forEach(n=>{n.x=W/2+(Math.random()-.5)*300;n.y=H/2+(Math.random()-.5)*300;n.vx=0;n.vy=0;});
  const R=n=>n.kind==='법령'?13:n.kind==='외부법'?9:8;
  let alpha=1;
  function tick(){
    // 반발
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y;let d2=dx*dx+dy*dy||1;
      let f=2600/d2;let d=Math.sqrt(d2);dx/=d;dy/=d;
      a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
    }
    // 스프링
    edges.forEach(e=>{const a=byId.get(e.source),b=byId.get(e.target);
      const target=e.kind==='소속'?70:120;let dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy)||1;
      let f=(d-target)*0.02;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;});
    // 중심 중력
    nodes.forEach(n=>{n.vx+=(W/2-n.x)*0.002;n.vy+=(H/2-n.y)*0.002;});
    // 적분
    nodes.forEach(n=>{if(n.fx!=null){n.x=n.fx;n.y=n.fy;n.vx=n.vy=0;return;}
      n.vx*=0.82;n.vy*=0.82;n.x+=n.vx*alpha;n.y+=n.vy*alpha;
      n.x=Math.max(24,Math.min(W-24,n.x));n.y=Math.max(24,Math.min(H-24,n.y));});
    alpha*=0.995;if(alpha<0.03)alpha=0.03;
    render();
    requestAnimationFrame(tick);
  }

  // ---- 렌더 ----
  const NS='http://www.w3.org/2000/svg';
  svg.innerHTML=`<defs>
    <marker id="a-위임" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="var(--wimim)"/></marker>
    <marker id="a-인용" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="var(--inyong)"/></marker>
  </defs><g id="edges"></g><g id="nodes"></g>`;
  const gE=svg.querySelector('#edges'),gN=svg.querySelector('#nodes');
  const eEls=edges.map(e=>{const p=document.createElementNS(NS,'line');
    p.setAttribute('class','edge '+e.kind);
    if(e.kind!=='소속')p.setAttribute('marker-end',`url(#a-${e.kind})`);
    gE.appendChild(p);return p;});
  const nEls=nodes.map(n=>{const g=document.createElementNS(NS,'g');
    g.setAttribute('class','node'+(n.kind==='외부법'?' ext':''));
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('r',R(n));c.setAttribute('fill',color(n));
    if(n.kind==='법령'){c.setAttribute('r',R(n));}
    const t=document.createElementNS(NS,'text');
    t.setAttribute('text-anchor','middle');t.setAttribute('dy',R(n)+13);
    t.textContent=n.kind==='조문'?`${n.group} ${n.label}`:n.label;
    if(n.kind==='조문')t.setAttribute('dy',R(n)+12);
    g.appendChild(c);g.appendChild(t);gN.appendChild(g);
    g.addEventListener('click',ev=>{ev.stopPropagation();select(n.id);});
    enableDrag(g,n);
    return g;});
  function render(){
    edges.forEach((e,i)=>{const a=byId.get(e.source),b=byId.get(e.target);
      const rb=R(b);const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
      const ex=b.x-dx/d*(rb+2),ey=b.y-dy/d*(rb+2);
      eEls[i].setAttribute('x1',a.x);eEls[i].setAttribute('y1',a.y);
      eEls[i].setAttribute('x2',ex);eEls[i].setAttribute('y2',ey);});
    nodes.forEach((n,i)=>nEls[i].setAttribute('transform',`translate(${n.x},${n.y})`));
  }

  // ---- 드래그 ----
  function enableDrag(g,n){
    let down=false;
    g.addEventListener('pointerdown',e=>{down=true;n.fx=n.x;n.fy=n.y;g.setPointerCapture(e.pointerId);alpha=.6;});
    g.addEventListener('pointermove',e=>{if(!down)return;const r=svg.getBoundingClientRect();
      n.fx=e.clientX-r.left;n.fy=e.clientY-r.top;});
    g.addEventListener('pointerup',e=>{down=false;n.fx=n.fy=null;});
  }

  // ---- 하이라이트 / 선택 ----
  let selected=null;
  function highlight(id){
    const keep=new Set([id,...adj.get(id)]);
    nEls.forEach((el,i)=>el.classList.toggle('dim',!keep.has(nodes[i].id)));
    eEls.forEach((el,i)=>el.classList.toggle('dim',edges[i].source!==id&&edges[i].target!==id));
  }
  function clearHi(){nEls.forEach(el=>el.classList.remove('dim'));eEls.forEach(el=>el.classList.remove('dim'));}
  svg.addEventListener('click',()=>{selected=null;clearHi();document.getElementById('detail').classList.remove('on');});

  function select(id){
    selected=id;highlight(id);renderDetail(id);
    const n=byId.get(id);alpha=.5;
  }
  function renderDetail(id){
    const n=byId.get(id);const d=document.getElementById('detail');
    const out=edges.filter(e=>e.source===id),inc=edges.filter(e=>e.target===id);
    const relRow=(e,dir)=>{const other=byId.get(dir==='out'?e.target:e.source);
      return `<div class="rel" data-go="${other.id}"><span class="k ${e.kind}">${e.kind}</span>
        <span>${dir==='out'?'→':'←'} ${other.kind==='조문'?other.group+' '+other.label:other.label}
        ${e.evidence?`<span style="color:var(--muted)"> ⟨${e.evidence}⟩</span>`:''}</span></div>`;};
    // 조문을 근거로 인용하려면 "언제 기준 조문인지"를 알아야 한다.
    const ymd=s=>s?`${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}`:'';
    const stamp=n.확인일||n.시행일
      ? `<div class="stamp${n.낡음?' old':''}">${[
          n.시행일?`시행 ${ymd(n.시행일)}`:'',
          n.확인일?`확인 ${ymd(n.확인일)}`:'',
          n.상태&&n.상태!=='현행'?n.상태:'',
          n.낡음?'⚠ 재수집 필요':'',
        ].filter(Boolean).join(' · ')}</div>`
      : '';

    d.innerHTML=`<span class="close">✕</span>
      <div class="dh"><span class="tag">${n.type} · ${n.kind}</span>
        <h2>${n.kind==='조문'?n.group+' '+n.label:n.label}</h2>
        <div class="sub">${n.kind==='조문'?(n.title||''):(n.name||'')}</div>
        ${stamp}</div>
      <div class="body">
        ${n.text?`<div class="txt">${n.text}</div>`:''}
        ${out.length?`<div class="relhead">이 조문이 향하는 곳 (${out.length})</div>${out.map(e=>relRow(e,'out')).join('')}`:''}
        ${inc.length?`<div class="relhead">이곳을 가리키는 것 (${inc.length})</div>${inc.map(e=>relRow(e,'in')).join('')}`:''}
      </div>`;
    d.classList.add('on');
    d.querySelector('.close').onclick=()=>{d.classList.remove('on');selected=null;clearHi();};
    d.querySelectorAll('.rel').forEach(el=>el.onclick=()=>select(el.dataset.go));
  }

  // ---- 검색 ----
  const q=document.getElementById('q'),results=document.getElementById('results');
  function textOf(n){return [n.label,n.group,n.title,n.name,n.text,n.type].filter(Boolean).join(' ');}
  function search(){
    const s=q.value.trim();
    const matches=s?nodes.filter(n=>textOf(n).toLowerCase().includes(s.toLowerCase())):[];
    const mset=new Set(matches.map(n=>n.id));
    nEls.forEach((el,i)=>el.classList.toggle('match',s&&mset.has(nodes[i].id)));
    if(s&&!selected){nEls.forEach((el,i)=>el.classList.toggle('dim',!mset.has(nodes[i].id)));
      eEls.forEach(el=>el.classList.add('dim'));}
    else if(!selected){clearHi();nEls.forEach(el=>el.classList.remove('match'));if(s)nEls.forEach((el,i)=>el.classList.toggle('match',mset.has(nodes[i].id)));}
    results.innerHTML=matches.length?matches.map(n=>
      `<div class="ritem" data-go="${n.id}"><span class="dot" style="background:${color(n)}"></span>
       <b>${n.kind==='조문'?n.group+' '+n.label:n.label}</b>
       <div class="g">${n.kind==='조문'?(n.title||''):n.kind==='외부법'?'외부 인용 법령':n.name}</div></div>`).join('')
      :`<div class="empty">${s?'일치하는 법령·조문이 없습니다.':'노드를 클릭하거나 위에서 검색하세요. 조문을 클릭하면 위임·인용 관계가 펼쳐집니다.'}</div>`;
    results.querySelectorAll('.ritem').forEach(el=>el.onclick=()=>{select(el.dataset.go);});
  }
  q.addEventListener('input',search);

  // ---- 엣지 유형 토글 ----
  ['위임','인용','소속'].forEach(k=>{
    document.getElementById('t-'+k).addEventListener('change',e=>{
      edges.forEach((ed,i)=>{if(ed.kind===k)eEls[i].style.display=e.target.checked?'':'none';});
    });
  });

  window.addEventListener('resize',()=>{W=svg.clientWidth;H=svg.clientHeight;alpha=.4;});
  search();tick();
})();
</script>
</body>
</html>
