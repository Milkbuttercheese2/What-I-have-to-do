<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>빠른 메모</title>
<!-- 미니 캡처 창 전용 페이지. 메인 앱 모듈 그래프와 완전히 독립 —
     store.js 등을 끌어오면 이 웹뷰에서도 최상위 부작용이 실행된다.
     외부(인터넷) 리소스 금지: 내부망(air-gapped) 배포 대상.
     v2.5.21: 검색 모드(기본, 창을 열 때마다 새로) + Alt로 빠른 메모 모드 전환.
     입력칸 placeholder 는 두지 않는다 — 빈 입력칸에 뜬 회색 문구를 실제 글자로
     오해해 "그 단어 뒤로 커서가 안 간다"는 혼선이 있었다. 안내는 아래 힌트줄(#cap-hint).
     스타일: 창은 transparent(tauri.conf) + 둥근 검정 패널(스포트라이트풍, 그림자 없음).
     폰트는 앱과 통일(Pretendard/맑은 고딕), 글씨크기는 입력·검색·검색결과 모두 14px. -->
<style>
 /* 스포트라이트 바. 폰트는 앱과 통일(Pretendard 로컬 번들).
    v2.6.0: 색은 전부 토큰 — 기본(어둡게) + body.light(밝게). 설정에서 고른 값을
    capture-win.js 가 body 클래스로 적용한다. 메인 창의 다크 팔레트와 같은 계열
    (#1e2128 면 / 청록 강조)이라 두 창이 한 시스템처럼 보인다. */
 :root{
   /* v2.6.1: 메인 다크와 같은 팔레트(자매 앱 '어느 조항이었지' 정책) — 남색 면 + 밝은 회청색 글자 */
   --cap-panel:#161c29; --cap-border:#2b3346; --cap-ink:#e8ecf4; --cap-muted:#aeb9cf;
   --cap-sep:rgba(255,255,255,.10); --cap-hit-bg:#1c3a35; --cap-hit-fg:#74cdbd;
   --cap-tag-on-bg:#1c3a35; --cap-tag-on-fg:#74cdbd; --cap-tag-off-bg:#1e2537; --cap-tag-off-fg:#93a0b8;
   --cap-flash:#74cdbd; --cap-hint:#93a0b8;
   --cap-thumb:rgba(255,255,255,.18); --cap-thumb-hover:rgba(255,255,255,.32);
   --cap-tag-hl:#24443e;   /* 본문 태그 하이라이트 (v3.0.1) */
 }
 body.light{
   --cap-panel:#ffffff; --cap-border:#eceef0; --cap-ink:#1f2a33; --cap-muted:#68717c;
   --cap-sep:rgba(31,42,51,.10); --cap-hit-bg:#edf4f2; --cap-hit-fg:#226659;
   --cap-tag-on-bg:#edf4f2; --cap-tag-on-fg:#2a7c6e; --cap-tag-off-bg:#eef0f3; --cap-tag-off-fg:#5a6472;
   --cap-flash:#226659; --cap-hint:#8a919b;
   --cap-thumb:rgba(31,42,51,.16); --cap-thumb-hover:rgba(31,42,51,.30);
   --cap-tag-hl:#d9ebe6;
   color-scheme:light;
 }
 @font-face{font-family:'Pretendard';src:url('fonts/PretendardVariable.woff2') format('woff2-variations');
   font-weight:45 920;font-style:normal;font-display:swap}
 html,body{margin:0;height:100%;overflow:hidden;background:transparent}
 body{display:flex;box-sizing:border-box;padding:0;color:var(--cap-ink);
   font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,-apple-system,sans-serif}
 /* v3.2.5 근본 구조 변경 — 패널은 **내용 높이**만 차지하고, 창에 남는 공간은
    투명하게 둔다(창은 transparent). 예전엔 패널이 창을 꽉 채워(flex:1) 창 높이가
    조금만 어긋나도 목록이 잘리거나 빈 띠가 생겼고, 그 픽셀을 맞추려 계산을
    반복 수정해야 했다. 이제 창을 넉넉히 잡아도 남는 부분은 보이지 않으므로
    "잘림"이 구조적으로 불가능하다. 검색 모드는 목록 스크롤이 필요해 꽉 채운다. */
 /* ⚠️ 세로만 '내용 높이'다 — 가로는 창을 꽉 채워야 한다. body 를 세로 flex 로 두면
    주축(세로)에서 flex:0 0 auto 가 내용 높이가 되고, 교차축(가로)은 stretch 로 꽉 찬다.
    v3.2.5 에서 가로 flex 인 채로 flex:0 0 auto 를 줘 패널이 내용 폭만 차지하고
    왼쪽에 치우쳐 있었다(좌 0 / 우 359px — 실측으로 확인, v3.2.7 수정). */
 body{flex-direction:column}
 body.search #cap-shell{height:100%}
 #cap-shell{flex:0 0 auto;max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;min-height:0;
   background:var(--cap-panel);border:1px solid var(--cap-border);border-radius:18px;overflow:hidden}
 #cap-bar{display:flex;align-items:center;flex:1;min-height:56px;position:relative}
 /* v3.0.1 빠른 메모 본문 @태그 하이라이트 — 양식 메모와 같은 백드롭 층.
    ⚠️ textarea(#cap-inp)와 글꼴·크기·행간·패딩이 한 값이라도 다르면 어긋난다.
    스택(#cap-inp-stack)이 textarea 를 감싸 위치를 정확히 공유한다. 검색 모드 숨김. */
 #cap-inp-stack{position:relative;flex:1;min-width:0}
 body.search #cap-inp-stack{display:none}
 #cap-hl{position:absolute;inset:0;padding:15px 18px;font-family:inherit;font-size:14px;line-height:1.5;
   white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;
   color:transparent;pointer-events:none;overflow:hidden}
 #cap-hl .at-tag{color:transparent;font-weight:inherit;background:var(--cap-tag-hl);border-radius:4px;padding:0}
 #cap-hl .at-tag.hover{box-shadow:0 0 0 1.5px var(--cap-hit-fg)}
 #cap-inp{position:relative;z-index:1;width:100%}
 body.search #cap-bar,body.search #cap-hint{flex:none}   /* 검색칸·힌트는 상단 고정, 목록만 스크롤 */
 body.search #cap-bar{flex:none}
 /* v2.5.1: font 축약형에 inherit(전역 키워드)를 섞으면 선언 전체가 무효 처리돼
    입력창이 브라우저 기본 폼 폰트로 렌더되던 버그 — 롱핸드로 분리(파일 전체 동일). */
 #cap-inp,#cap-search{flex:1;border:0;outline:0;background:transparent;color:var(--cap-ink);
   font-family:inherit;font-size:14px;line-height:1.5;padding:15px 18px}
 /* v2.5.11: 한 줄 기본(rows=1) + box-sizing 으로 auto-grow 정확히. 기본 textarea rows=2 라
    한 줄 메모가 2줄 박스 위쪽에 붙어 "글자가 위로 뜬" 것처럼 보이던 문제 해결. */
 #cap-inp{resize:none;box-sizing:border-box;overflow:hidden}
 #cap-inp::placeholder,#cap-search::placeholder{color:var(--cap-muted)}
 #cap-results{display:none;flex:1;min-height:0;flex-direction:column;
   border-top:1px solid var(--cap-sep)}
 /* v2.6.8: min-height:0 이 없으면 flex 자식이 내용만큼 늘어나 '스크롤되는 목록'이 아니라
    '길어지는 목록'이 된다 → 검색칸이 위로 밀리고 휠도 안 먹는다(§7-A 와 같은 이유, 세로판). */
 .cap-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
 .cap-col-h{flex:none;font-weight:600;font-size:11px;color:var(--cap-muted);
   padding:10px 16px 6px;letter-spacing:.04em}
 /* v3.0.1: 목록을 세로 flex 로 — 빈 안내문(.cap-empty)을 넓은 영역 가운데에 띄워
    '좁은 안내 슬리버' 대신 차분한 한 판으로 보이게 한다(결과 행 배치는 동일). */
 .cap-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 8px 10px;
   display:flex;flex-direction:column}
 .cap-list .cap-empty{margin:auto;text-align:center}
 /* v2.5.3 스크롤바 — 검정 패널에 맞춘 유리 썸(트랙 없음·둥근 캡슐), 안 쓸 때 숨김.
    메모 입력칸(textarea)·검색 목록 모두 동일 적용 (창 전역 규칙). */
 ::-webkit-scrollbar{width:9px;height:9px}
 ::-webkit-scrollbar-track{background:transparent}
 ::-webkit-scrollbar-corner{background:transparent}
 ::-webkit-scrollbar-thumb{background:transparent;border-radius:999px;border:2px solid transparent;background-clip:padding-box}
 :hover::-webkit-scrollbar-thumb,:focus-within::-webkit-scrollbar-thumb{background:var(--cap-thumb);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
 ::-webkit-scrollbar-thumb:hover{background:var(--cap-thumb-hover);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
 .cap-hit{font-size:13px;line-height:1.45;color:var(--cap-ink);padding:8px 11px;margin:1px 0;
   border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 /* v2.6.7: hover 는 body.mouse 일 때만 — 창이 커서 밑에 뜨면 그 자리의 줄이 곧바로 :hover 가 되고,
    마우스를 안 움직이니 엉뚱한 줄이 계속 켜져 있는 것처럼 보였다. 마우스를 실제로 움직이면
    켜지고, 키보드를 쓰기 시작하면 다시 꺼진다(선택 .sel 은 키보드 전용 표시). */
 body.mouse .cap-hit:hover,.cap-hit.sel{background:var(--cap-hit-bg);color:var(--cap-hit-fg)}
 .cap-hit.done{color:var(--cap-muted)}
 .cap-empty{font-size:13px;color:var(--cap-muted);padding:12px}
 /* v2.5.21 안내줄 → v3.0.2 맨 아래 푸터로 이동(모드별 문구는 capture-win.js).
    입력칸과 결과 사이에 끼어 3단으로 보이던 원인이라 바닥으로 내렸다. */
 #cap-hint{flex:none;font-size:11px;color:var(--cap-hint);padding:8px 18px 10px}
 body.search #cap-hint{border-top:1px solid var(--cap-sep)}   /* 구분선은 목록이 있는 검색 모드만 — 메모 모드에선 띠를 만든다(v3.0.3) */
 /* v2.7.0 빠른 메모 @ 자동완성 — 전화번호부 목록. 검색 결과(.cap-hit)와 같은 시각 언어.
    v2.9.0 body.pb: 목록이 펴진 동안 입력칸 flex:1 을 꺼서 늘어난 창 높이를 목록이 갖는다
    (안 끄면 입력·힌트·목록이 벌어진 3분할로 찢어져 보이던 버그).
    v3.0.4: 표시 여부의 주인은 **CSS 한 곳**이다(예전엔 JS 가 인라인 style.display 로
    폈다 접었다 했고, 그 인라인이 한 번이라도 'block' 인 채 남으면 검색 화면에
    빈 띠가 하나 더 생겼다 — 실사용 버그). 빠른 메모 화면일 때만 펴진다:
    검색(body.search)·등록 플래시(body.flash)에서는 규칙상 아예 자리를 못 갖는다. */
 body.pb #cap-bar{flex:none}
 #cap-pb{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
   border-top:1px solid var(--cap-sep);padding:6px 8px}
 body.pb:not(.search):not(.flash) #cap-pb{display:block}
 .cap-pb-it{display:flex;align-items:center;gap:9px;font-size:13px;line-height:1.45;color:var(--cap-ink);
   padding:7px 11px;margin:1px 0;border-radius:8px;cursor:pointer}
 .cap-pb-it.sel,body.mouse .cap-pb-it:hover{background:var(--cap-hit-bg);color:var(--cap-hit-fg)}
 .cap-pb-who{flex:none;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .cap-pb-org{flex:1;min-width:0;color:var(--cap-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .cap-pb-phone{flex:none;color:var(--cap-muted);font-variant-numeric:tabular-nums}
 #cap-flash{display:none;align-items:center;justify-content:center;flex:1;gap:7px;
   color:var(--cap-flash);font-weight:600;font-size:15px}
 body.flash #cap-bar,body.flash #cap-results,body.flash #cap-hint{display:none}
 body.flash #cap-flash{display:flex}
 .cap-col-h{display:none}
 .cap-hit{display:flex;align-items:center;gap:9px}
 .cap-hit-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .cap-tag{flex:none;font-weight:700;font-size:10.5px;padding:2.5px 9px;border-radius:999px;letter-spacing:.02em}
 .cap-tag.ongoing{background:var(--cap-tag-on-bg);color:var(--cap-tag-on-fg)}
 .cap-tag.done{background:var(--cap-tag-off-bg);color:var(--cap-tag-off-fg)}
 .cap-hit.done .cap-hit-txt{color:var(--cap-muted)}
</style>
</head>
<!-- v2.5.21: 검색 모드가 기본이라 초기 마크업도 검색 모드로 둔다(JS 실행 전 깜빡임 방지) -->
<body class="search">
<div id="cap-shell">
  <div id="cap-bar">
    <!-- v3.0.1 본문 태그 하이라이트 — 스택이 textarea 를 감싸야 백드롭이 textarea 의
         실제 위치를 따라간다(#cap-bar 는 세로 중앙정렬이라 bar 기준 백드롭은 어긋난다) -->
    <div id="cap-inp-stack">
      <div id="cap-hl" aria-hidden="true"></div>
      <textarea id="cap-inp" rows="1" maxlength="50000" style="display:none"></textarea>
    </div>
    <input id="cap-search" autocomplete="off">
  </div>
  <!-- v2.7.0 빠른 메모 @ 자동완성 (전화번호부) — @토큰을 칠 때만 capture-win.js 가 편다.
       v3.0.4: 인라인 style 금지 — 표시는 body.pb 클래스로만 갈린다(위 CSS 주석) -->
  <div id="cap-pb"></div>
  <div id="cap-results" style="display:flex">
    <div class="cap-col"><div class="cap-col-h">내 업무</div><div class="cap-list" id="cap-items"></div></div>
  </div>
  <!-- v3.0.2 힌트줄을 맨 아래 푸터로(소유자 지정 — 입력칸과 결과 사이에 끼어
       화면을 3단으로 쪼개던 원인). 이제 검색 = 입력칸/결과 2단 + 바닥 안내. -->
  <div id="cap-hint">내 업무 검색 · Alt 를 누르면 빠른 메모</div>
  <div id="cap-flash">등록됨</div>
</div>
<script type="module" src="capture-boot.js"></script>
</body>
</html>
